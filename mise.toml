# Toolchain source of truth (single pinned toolchain config).
# Path choice: `mise.toml` at the repo root (not `.mise.toml`) so mise,
# editors, and CI discover it with zero extra config — the upstream default.
# Mirror versions exactly on every bump: follow the changelog-first upgrade
# lifecycle in AGENTS.md and keep pin parity across mise.toml,
# talos/ansible/group_vars/all.yml, Terraform/Ansible constraints, GitHub
# workflows, Dockerfiles, and Flux manifests.
#
# Backend map (each id verified via `mise registry` / `mise ls-remote`):
# - core: go, python (first-party mise backends).
# - aqua (short names resolve to these): flux2, cilium-cli, kubectl, helm,
#   kustomize, opentofu, golangci-lint, hk, yq, kubeconform, cosign, oras,
#   rclone, shellcheck, gh, docker (= aqua:docker/cli), docker-buildx,
#   flux-operator-mcp.
# - pypi/pipx: ansible-core (the previous manifest's `ansible` pin used core
#   versioning, and ansible-playbook ships in ansible-core), yamllint (pypi),
#   ansible-lint (pipx: isolated venv).
# - go (built with the pinned Go above): gopls, govulncheck. CI invokes
#   govulncheck via `go run golang.org/x/vuln/cmd/govulncheck@<version>` —
#   same module and version, no per-module tool directive needed.
# - github (+ [tool_alias]): talosctl (prerelease tag; aqua filters
#   prereleases out, so the github backend with `prerelease = true` is used),
#   netbird (multi-binary release; `matching` selects the `netbird_` CLI
#   asset and skips the UI/idp-migrate ones), pass-cli (bare-binary release;
#   `bin` renames the platform-suffixed asset to `pass-cli`).
# System-provided, no entry here (plain pipe/fetch helpers, never
# version-gated): curl, git, tar, unzip.
min_version = "2026.9.16"

[tool_alias]
talosctl = "github:siderolabs/talos"
netbird = "github:netbirdio/netbird"
"pass-cli" = "github:protonpass/pass-cli"
"ansible-lint" = "pipx:ansible-lint"

[tools]
ansible-core = "2.21.4"
"pipx:ansible-lint" = "25.8.2"
cilium-cli = "0.19.7"
flux2 = "2.9.5"
flux-operator-mcp = "0.58.1"
kubectl = "1.37.0"
gh = "2.101.0"
go = "1.26.7"
"go:golang.org/x/tools/gopls" = "v0.23.0"
helm = "4.3.0"
kustomize = "5.8.1"
netbird = { version = "0.79.0", matching = "netbird_" }
"pass-cli" = { version = "2.3.3", bin = "pass-cli" }
python = "3.14.7"
opentofu = "1.12.6"
golangci-lint = "2.13.2"
hk = "2.4.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.8.0"
yq = "4.53.3"
kubeconform = "0.8.0"
cosign = "3.1.3"
oras = "1.3.4"
"aqua:docker/cli" = "29.8.0"
"aqua:docker/buildx" = "0.35.0"
"pypi:yamllint" = "1.37.1"
shellcheck = "0.11.0"
rclone = "1.75.1"
talosctl = { version = "v1.15.0-alpha.0", prerelease = true }

[env]
PROTON_PASS_KEY_PROVIDER = "fs"
HK_MISE = "1"

[shell_alias]
# terraform already means tofu (previously a shell profile alias).
terraform = "tofu"

[hooks]
# Replaces the previous env-manager activate hook: hk shims auto-install on every
# directory entry — fast/idempotent (~10ms, no network, no lock), guarded to
# repo checkouts with the config present. Never fails activation.
enter = "if [ -f hk.pkl ] && git rev-parse --git-dir >/dev/null 2>&1 && command -v hk >/dev/null 2>&1; then hk install >/dev/null 2>&1 || true; fi"

[tasks.flux-operator-mcp]
description = "Local-only Flux Operator MCP server for agent tooling (never exposed off-host; run by hand with `mise run flux-operator-mcp`)"
env = { KUBECONFIG = "{{config_root}}/kubeconfig" }
run = "flux-operator-mcp serve --transport http --port 8080 --kubeconfig {{config_root}}/kubeconfig"

[tasks.netbird]
description = "Local root-side Netbird tunnel endpoint for the private mesh (needs sudo for /var/run|log|lib/netbird and the TUN device; run by hand with `mise run netbird`)"
run = ["sudo mkdir -p /var/run/netbird /var/log/netbird /var/lib/netbird", "sudo env PATH=\"$PATH\" netbird service run --log-file console --log-level info"]

[tasks.talosctl-install]
description = "Install the pinned talosctl (tracks talos_version in talos/ansible/group_vars/all.yml)"
run = "mise install talosctl"

[tasks.hk-install]
description = "Install hk git hooks for this checkout"
run = "hk install --mise"
