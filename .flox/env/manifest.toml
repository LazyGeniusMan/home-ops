docker.version = "29.8.0"
docker-buildx.pkg-path = "docker-buildx"
docker-buildx.version = "0.35.0"
curl.pkg-path = "curl"
curl.version = "8.21.0"
git.pkg-path = "git"
git.version = "2.55.0"
gnutar.pkg-path = "gnutar"
gnutar.version = "1.35"
yamllint.pkg-path = "yamllint"
yamllint.version = "1.37.1"
# EXCEPTION: ControlPlane flux distribution CLI (controlplaneio-fluxcd/distribution/actions/*)
# has no Flox catalog package (verified 2026-09-12: `flox search controlplane` = no match;
# `flox search fluxcd` lists only OSS fluxcd/fluxcd-operator/fluxcd-operator-mcp, which are
# NOT the same binary). CI push legs using the ControlPlane distribution remain the only
# tool invocation without a local Flox-provided equivalent.

[vars]
PROTON_PASS_KEY_PROVIDER = "fs"

[hook]
on-activate = '''
  install_talosctl() {
    cache_dir="${FLOX_ENV_CACHE:-$FLOX_ENV_PROJECT/.flox/cache}"
    mkdir -p "$cache_dir/bin"
    if [ ! -x "$cache_dir/bin/talosctl" ]; then
      curl -L -o "$cache_dir/bin/talosctl" \
        "https://github.com/siderolabs/talos/releases/download/v1.14.0/talosctl-linux-amd64"
      chmod +x "$cache_dir/bin/talosctl"
    fi
  }
  install_talosctl
  cd "$FLOX_ENV_PROJECT" || return
'''

[profile]
common = '''
  export PATH="$FLOX_ENV_CACHE/bin:$PATH"
  alias terraform=tofu
'''

[services]
[services.flux-operator-mcp]
command = '''
  export KUBECONFIG="$FLOX_ENV_PROJECT/kubeconfig"
  flux-operator-mcp serve --transport http --port 8080 --kubeconfig "$KUBECONFIG"
'''

[services.netbird]
command = '''
  sudo mkdir -p /var/run/netbird /var/log/netbird /var/lib/netbird
  sudo env PATH="$PATH" netbird service run --log-file console --log-level info
'''

[options]
allow.unfree = true
