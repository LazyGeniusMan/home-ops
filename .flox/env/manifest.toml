## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"
PROTON_PASS_KEY_PROVIDER = "fs"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
# on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache
# '''
on-activate = '''
  install_talosctl() {
    cache_dir="${FLOX_ENV_CACHE:-$FLOX_ENV_PROJECT/.flox/cache}"
    mkdir -p "$cache_dir/bin"
    if [ ! -x "$cache_dir/bin/talosctl" ]; then
      curl -L -o "$cache_dir/bin/talosctl" \
        "https://github.com/siderolabs/talos/releases/download/v1.14.0/talosctl-linux-amd64"
      chmod +x "$cache_dir/bin/talosctl"
    fi
  }
  # install_terraform() {
  #   cache_dir="${FLOX_ENV_CACHE:-$FLOX_ENV_PROJECT/.flox/cache}"
  #   mkdir -p "$cache_dir/bin"
  #   if [ ! -x "$cache_dir/bin/terraform" ]; then
  #     curl -fsSL "https://releases.hashicorp.com/terraform/1.16.1/terraform_1.16.1_linux_amd64.zip" -o /tmp/terraform.zip \
  #       && unzip -o /tmp/terraform.zip -d "$cache_dir/bin" \
  #       && rm -f /tmp/terraform.zip \
  #       && chmod +x "$cache_dir/bin/terraform"
  #   fi
  # }
  install_talosctl
  # install_terraform
  cd "$FLOX_ENV_PROJECT" || return
'''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
# common = '''
#   gum style \
#   --foreground 212 --border-foreground 212 --border double \
#   --align center --width 50 --margin "1 2" --padding "2 4" \
#     $INTRO_MESSAGE
# '''
## Shell-specific customizations such as setting aliases go here:
# bash = ...
# zsh  = ...
# fish = ...
common = '''
  export PATH="$FLOX_ENV_CACHE/bin:$PATH"
  alias terraform=tofu
'''


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"
[services.flux-operator-mcp]
command = '''
  export KUBECONFIG="$FLOX_ENV_PROJECT/kubeconfig"
  flux-operator-mcp serve --transport http --port 8080 --kubeconfig "$KUBECONFIG"
'''

[services.netbird]
command = '''
  sudo mkdir -p /var/run/netbird /var/log/netbird /var/lib/netbird
  sudo env PATH="$PATH" netbird service run --log-file console --log-level info
'''



