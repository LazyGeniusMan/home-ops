# EXCEPTION: ControlPlane flux distribution CLI has no Flox catalog package;
# CI push legs are the only invocations without a local Flox equivalent.

[vars]
PROTON_PASS_KEY_PROVIDER = "fs"

[hook]
on-activate = '''
  # talosctl is curl-fetched (no Flox catalog package). Version + sha256 track
  # talos/ansible/group_vars/all.yml. The cache key includes the version so a
  # bump never reuses a stale binary from a previous pin.
  install_talosctl() {
    talos_version="v1.15.0-alpha.0"
    talos_sha256="d0779b799815aeebccc18cf98851928ff1b050434c96831259b2e4ceafdb5399"
    cache_dir="${FLOX_ENV_CACHE:-$FLOX_ENV_PROJECT/.flox/cache}"
    mkdir -p "$cache_dir/bin"
    marker="$cache_dir/bin/.talosctl-${talos_version}.ok"
    if [ ! -f "$marker" ]; then
      tmp_bin="$(mktemp "$cache_dir/bin/talosctl-XXXXXX")"
      curl -fSL --retry 3 -o "$tmp_bin" \
        "https://github.com/siderolabs/talos/releases/download/${talos_version}/talosctl-linux-amd64"
      echo "${talos_sha256}  ${tmp_bin}" | sha256sum -c -
      chmod +x "$tmp_bin"
      mv -f "$tmp_bin" "$cache_dir/bin/talosctl"
      rm -f "$cache_dir"/bin/.talosctl-v*.ok
      touch "$marker"
    fi
  }
  install_talosctl
  cd "$FLOX_ENV_PROJECT" || return
'''

[profile]
common = '''
  export PATH="$FLOX_ENV_CACHE/bin:$PATH"
  alias terraform=tofu
'''

[services]
# Local-only dev services (never exposed off-host): flux-operator-mcp has no
# --address/--bind flag and listens on this machine's :8080 for local agent
# tooling only; netbird runs as a local root-side tunnel endpoint for the
# private mesh (sudo needed to write /var/run|log|lib/netbird and to manage
# the TUN device).
[services.flux-operator-mcp]
command = '''
  export KUBECONFIG="$FLOX_ENV_PROJECT/kubeconfig"
  flux-operator-mcp serve --transport http --port 8080 --kubeconfig "$KUBECONFIG"
'''

[services.netbird]
command = '''
  sudo mkdir -p /var/run/netbird /var/log/netbird /var/lib/netbird
  sudo env PATH="$PATH" netbird service run --log-file console --log-level info
'''

[options]
# No free-software catalog substitute for the AGPL MCP server, BSD netbird
# client, GPL pass-cli, or MIT rclone; scoped to these four installs only.
allow.unfree = true
