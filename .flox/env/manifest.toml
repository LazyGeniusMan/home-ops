schema-version = "1.15.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
ansible.pkg-path = "ansible"
ansible.version = "2.21.3"
cilium-cli.pkg-path = "cilium-cli"
cilium-cli.version = "0.19.7"
fluxcd.pkg-path = "fluxcd"
fluxcd.version = "2.9.4"
fluxcd-operator-mcp.pkg-path = "fluxcd-operator-mcp"
fluxcd-operator-mcp.version = "0.58.1"
kubectl.pkg-path = "kubectl"
kubectl.version = "1.37.0"
github-cli.pkg-path = "github-cli"
github-cli.version = "2.99.0"
go.pkg-path = "go"
go.version = "1.26.7"
gopls.pkg-path = "gopls"
gopls.version = "0.23.0"
kubernetes-helm.pkg-path = "kubernetes-helm"
kubernetes-helm.version = "4.2.4"
kustomize.pkg-path = "kustomize"
kustomize.version = "5.8.1"
netbird.pkg-path = "netbird"
netbird.version = "0.77.1"
proton-pass-cli.pkg-path = "proton-pass-cli"
proton-pass-cli.version = "2.3.3"
python3.pkg-path = "python3"
python3.version = "3.14.7"
opentofu.pkg-path = "opentofu"
opentofu.version = "1.12.6"
golangci-lint.pkg-path = "golangci-lint"
golangci-lint.version = "2.13.2"
ansible-lint.pkg-path = "ansible-lint"
ansible-lint.version = "25.8.2"
yq.pkg-path = "yq-go"
yq.version = "4.53.3"
kubeconform.pkg-path = "kubeconform"
kubeconform.version = "0.8.0"
### TEMPORARY
