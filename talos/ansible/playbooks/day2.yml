---
# Day-2 operate: health + etcd status; optional upgrade via -e upgrade_image=....
# Local-only: ansible-playbook playbooks/day2.yml -i localhost,
#   -e talos_cluster=acme-dev-bdo1-talos-apps-01 [-e upgrade_image=<installer>]
- name: Day-2 operate Talos cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    talos_cluster: acme-dev-bdo1-talos-apps-01
  roles:
    - role: talos_operate
      vars:
        talos_operate_upgrade_image: "{{ upgrade_image | default('') }}"
