---
# Day-2 operate: health + etcd status; optional upgrades, regen, secrets
# refresh, re-apply. Kubernetes upgrades are explicit -e opt-in only (the group
# pin is record-only — a pin bump alone never mutates the cluster).
# Local-only: ansible-playbook playbooks/day2.yml -i localhost,
#   -e talos_cluster=acme-dev-bdo1-talos-apps-01
#   [-e upgrade_image=<installer>] [-e upgrade_talos_version=<ver>]
#   [-e kubernetes_version=<ver>]
#   [-e regen_talosconfig=true] [-e regen_kubeconfig=true]
#   [-e refresh_secrets=true]
#   [-e reapply_configs=true [-e reapply_mode=staged]]
#   [-e pat_apply=true [-e pat_renew=true] [-e pat_name=...] [-e pat_expiration=1y]]
#   [-e skip_health=true]  # break-glass only: skips the health probe AND the
#   mutating-plane health gate (RUNBOOK §3.1).
- name: Day-2 operate Talos cluster
  hosts: localhost
  connection: local
  gather_facts: false
  # Explicitly load shared vars (group_vars/ is not auto-loaded with an inline inventory).
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  vars:
    talos_cluster: acme-dev-bdo1-talos-apps-01
  roles:
    - role: talos_operate
      vars:
        talos_operate_upgrade_image: "{{ upgrade_image | default('') }}"
        talos_operate_upgrade_talos_version: "{{ upgrade_talos_version | default('') }}"
        talos_operate_kubernetes_version: "{{ kubernetes_version | default('') }}"
        talos_operate_regen_talosconfig: "{{ regen_talosconfig | default(false) | bool }}"
        talos_operate_regen_kubeconfig: "{{ regen_kubeconfig | default(false) | bool }}"
        talos_operate_refresh_secrets: "{{ refresh_secrets | default(false) | bool }}"
        talos_operate_reapply_configs: "{{ reapply_configs | default(false) | bool }}"
        talos_operate_reapply_mode: "{{ reapply_mode | default('staged') }}"
        talos_operate_pat_apply: "{{ pat_apply | default(false) | bool }}"
        talos_operate_pat_renew: "{{ pat_renew | default(false) | bool }}"
        talos_operate_pat_name: "{{ pat_name | default('home-ops-eso') }}"
        talos_operate_pat_expiration: "{{ pat_expiration | default('1y') }}"
