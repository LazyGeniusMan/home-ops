---
# Day-1 single-node: install, bootstrap etcd, fetch kubeconfig.
# Local-only: ansible-playbook playbooks/day1.yml -i localhost,
#   -e talos_cluster=acme-dev-bdo1-talos-apps-01
- name: Day-1 install and bootstrap Talos cluster
  hosts: localhost
  connection: local
  gather_facts: false
  # Explicitly load shared vars: group_vars/ is not auto-loaded with an
  # inline `-i localhost,` inventory (Ansible resolves group_vars relative
  # to the inventory file/playbook dir).
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  vars:
    talos_cluster: acme-dev-bdo1-talos-apps-01
  roles:
    - role: talos_bootstrap
