---
# Day-1 single-node: insecure-apply per node, wait gates, bootstrap etcd, fetch kubeconfig.
# Requires the same fresh-install flag day-0 rendered with (RUNBOOK §1.5, §2.1).
# Local-only: ansible-playbook playbooks/day1.yml -i localhost,
#   -e talos_cluster=acme-dev-bdo1-talos-apps-01 -e talos_bootstrap_fresh_install=true
- name: Day-1 install and bootstrap Talos cluster
  hosts: localhost
  connection: local
  gather_facts: false
  # Explicitly load shared vars (group_vars/ is not auto-loaded with an inline inventory).
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  vars:
    talos_cluster: acme-dev-bdo1-talos-apps-01
  roles:
    - role: talos_bootstrap
