---
talos_bootstrap_talosctl: talosctl
talos_bootstrap_mode: auto
# Audit prefix for PROTON_PASS_AGENT_REASON on the early auth probe
# (`<prefix>-<cluster>-authcheck-<16 lowercase hex>`).
talos_bootstrap_pass_agent_reason_prefix: talos-bootstrap
# Readiness gates: L1 = TCP 50000 reachable per node; L2 = authenticated
# `talosctl version` poll on every node. Bootstrap + kubeconfig retry because
# slow boots can lag the gates.
talos_bootstrap_api_port: 50000
talos_bootstrap_wait_timeout: 300
talos_bootstrap_version_retries: 60
talos_bootstrap_version_delay: 10
talos_bootstrap_bootstrap_retries: 30
talos_bootstrap_bootstrap_delay: 10
talos_bootstrap_kubeconfig_retries: 12
talos_bootstrap_kubeconfig_delay: 10
