---
talos_bootstrap_talosctl: talosctl
talos_bootstrap_mode: auto
# Audit prefix for PROTON_PASS_AGENT_REASON on the early auth probe.
# The check gets `<prefix>-<cluster>-authcheck-<16 lowercase hex>`
# (mirrors eso-proton-pass NewAgentReason: 8 random bytes hex, max
# 300 chars).
talos_bootstrap_pass_agent_reason_prefix: talos-bootstrap
# Local PAT store for the day-2 ESO Secret apply (build/<cluster>/, 0600,
# gitignored via ansible/build/). Written from PROTON_PASS_PERSONAL_ACCESS_TOKEN.
talos_bootstrap_pat_filename: proton-pass-pat
# Documentation only for the one-time interactive agent create command
# (day-1 never auto-creates: minting a token needs an interactive user
# session).
# Example: pass-cli agent create <agent-name>
#   --expiration {{ talos_bootstrap_pat_expiration }} [--vault <cluster-vault>]
talos_bootstrap_pat_expiration: 1y
