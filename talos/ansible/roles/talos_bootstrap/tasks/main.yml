---
# Day-1: insecure-apply per node, wait gates, bootstrap etcd, fetch kubeconfig.
- name: Check pass-cli session is authenticated
  # Ansible never logs in. check_mode:false so --check still validates auth.
  ansible.builtin.command:
    cmd: pass-cli info -o json
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_bootstrap_pass_agent_reason_prefix }}-{{ talos_cluster }}-authcheck-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  check_mode: false
  changed_when: false
  failed_when: false
  register: talos_bootstrap_pass_session
  no_log: true

- name: Fail when pass-cli has no authenticated session
  ansible.builtin.assert:
    that:
      - talos_bootstrap_pass_session.rc == 0
      - talos_bootstrap_pass_session.stdout | from_json is mapping
    fail_msg: >-
      No authenticated pass-cli session. Run `pass-cli login` before
      day-1, then re-run the play.
    success_msg: "pass-cli session authenticated."

- name: Apply installer config to maintenance nodes (insecure first boot)
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} apply-config
      --talosconfig {{ talos_talosconfig }}
      --insecure -n {{ item.ip }}
      -f {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
      --mode {{ talos_bootstrap_mode }}
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/.installed-{{ item.name }}"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Mark nodes installed
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/.installed-{{ item.name }}"
    state: touch
    mode: "0600"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Wait for Talos API port on installed nodes
  # Nodes install + reboot after the insecure apply; TCP 50000 drops briefly.
  ansible.builtin.wait_for:
    host: "{{ item.ip }}"
    port: "{{ talos_bootstrap_api_port }}"
    timeout: "{{ talos_bootstrap_wait_timeout }}"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert the bootstrap node is a control-plane node
  # Etcd bootstrap targets nodes[0] by list order (RUNBOOK §4.5).
  ansible.builtin.assert:
    that:
      - talos_clusters[talos_cluster].nodes[0].role == 'controlplane'
    fail_msg: >-
      nodes[0] ({{ talos_clusters[talos_cluster].nodes[0].name }},
      role {{ talos_clusters[talos_cluster].nodes[0].role }}) is not a
      control-plane node. Keep the intended bootstrap control-plane node
      first in group_vars/all.yml (RUNBOOK §4.5), then re-run day-1.
    success_msg: "Bootstrap node {{ talos_clusters[talos_cluster].nodes[0].name }} is a control-plane node."

- name: Wait for authenticated Talos API on every node
  # rc==0 proves the node installed, rebooted, and booted configured.
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} version
      --talosconfig {{ talos_talosconfig }}
      -n {{ item.ip }}
      -e {{ item.ip }}
  check_mode: false
  changed_when: false
  register: talos_bootstrap_version
  until: talos_bootstrap_version.rc == 0
  retries: "{{ talos_bootstrap_version_retries }}"
  delay: "{{ talos_bootstrap_version_delay }}"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Bootstrap etcd on the first control-plane node
  # Races slow boots — retry all non-zero exits.
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} bootstrap
      --talosconfig {{ talos_talosconfig }}
      -n {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -e {{ talos_clusters[talos_cluster].nodes[0].ip }}
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/.bootstrapped"
  changed_when: true
  register: talos_bootstrap_result
  until: talos_bootstrap_result.rc == 0
  retries: "{{ talos_bootstrap_bootstrap_retries }}"
  delay: "{{ talos_bootstrap_bootstrap_delay }}"

- name: Mark cluster bootstrapped
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/.bootstrapped"
    state: touch
    mode: "0600"
  changed_when: false

- name: Fetch admin kubeconfig
  # Single control-plane per cluster (RUNBOOK §4.5): source pinned to nodes[0].
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} kubeconfig
      --talosconfig {{ talos_talosconfig }}
      {{ talos_build_dir }}/{{ talos_cluster }}/kubeconfig
      -n {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -e {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -f
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/kubeconfig"
  changed_when: true
  register: talos_bootstrap_kubeconfig
  until: talos_bootstrap_kubeconfig.rc == 0
  retries: "{{ talos_bootstrap_kubeconfig_retries }}"
  delay: "{{ talos_bootstrap_kubeconfig_delay }}"
