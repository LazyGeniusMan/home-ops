---
# Day-1: install, bootstrap etcd, fetch kubeconfig, apply node config.
# Auth comes FIRST: day-1 ends by storing the PAT locally, and nothing
# before that needs pass-cli — but failing fast here beats pushing a config
# to nodes and only then discovering the session/store step cannot run.
- name: Assert Proton Pass PAT env var is set
  # Fail fast before any talosctl call: the PAT arrives via env only (never
  # files) and day-1 stores it locally for the day-2 ESO Secret apply.
  # check_mode has no effect on assert, so --check still validates.
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', proton_pass_pat_env) | length > 0
    fail_msg: >-
      {{ proton_pass_pat_env }} is not set or empty. Export
      {{ proton_pass_pat_env }}=pst_... and run `pass-cli login` before
      day-1 (needed for the local PAT store), then re-run the play.
    success_msg: "{{ proton_pass_pat_env }} is set."

- name: Check pass-cli session is authenticated for local store
  # Ansible NEVER logs in: probes the existing session via
  # `pass-cli info -o json` (rc==0 + JSON mapping stdout = logged in;
  # logged-out gives rc=1 + a non-JSON error). check_mode:false so
  # --check still validates auth. On failure, export
  # PROTON_PASS_PERSONAL_ACCESS_TOKEN=pst_... and run `pass-cli login`,
  # then re-run the play.
  ansible.builtin.command:
    cmd: pass-cli info -o json
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_bootstrap_pass_agent_reason_prefix }}-{{ talos_cluster }}-authcheck-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  check_mode: false
  changed_when: false
  failed_when: false
  register: talos_bootstrap_pass_session
  no_log: true

- name: Fail when pass-cli has no authenticated session
  ansible.builtin.assert:
    that:
      - talos_bootstrap_pass_session.rc == 0
      - talos_bootstrap_pass_session.stdout | from_json is mapping
    fail_msg: >-
      No authenticated pass-cli session. Export
      {{ proton_pass_pat_env }}=pst_... and run `pass-cli login` before
      day-1 (needed for the local PAT store), then re-run the play.
    success_msg: "pass-cli session authenticated."

- name: Apply installer config to maintenance nodes (insecure first boot)
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} apply-config
      --talosconfig {{ talos_talosconfig }}
      --insecure -n {{ item.ip }}
      -f {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
      --mode {{ talos_bootstrap_mode }}
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/.installed-{{ item.name }}"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Mark nodes installed
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/.installed-{{ item.name }}"
    state: touch
    mode: "0600"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Wait for Talos API port on installed nodes
  # L1 readiness gate: after the insecure apply each node installs + reboots,
  # so the API is briefly down. Ready nodes expose TCP 50000 again post-reboot
  # (runs from localhost: the day-1 play uses connection: local). Typical
  # wait is 1-2 min; timeout is generous for slow installs.
  ansible.builtin.wait_for:
    host: "{{ item.ip }}"
    port: "{{ talos_bootstrap_api_port }}"
    timeout: "{{ talos_bootstrap_wait_timeout }}"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for authenticated Talos API on the bootstrap node
  # L2 readiness gate: `talosctl version` with the cluster talosconfig fails
  # in maintenance mode (cert error) and during reboot (connection refused);
  # rc==0 proves the node installed, rebooted, and booted configured.
  # `talosctl health` is NOT a pre-bootstrap gate (it only works post-bootstrap).
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} version
      --talosconfig {{ talos_talosconfig }}
      -n {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -e {{ talos_clusters[talos_cluster].nodes[0].ip }}
  check_mode: false
  changed_when: false
  register: talos_bootstrap_version
  until: talos_bootstrap_version.rc == 0
  retries: "{{ talos_bootstrap_version_retries }}"
  delay: "{{ talos_bootstrap_version_delay }}"

- name: Bootstrap etcd on the first control-plane node
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} bootstrap
      --talosconfig {{ talos_talosconfig }}
      -n {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -e {{ talos_clusters[talos_cluster].nodes[0].ip }}
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/.bootstrapped"
  changed_when: true
  register: talos_bootstrap_result
  # `bootstrap` has no wait flags and still races slow boots with
  # `FailedPrecondition: bootstrap is not available yet` — retry all
  # non-zero exits (until covers every rc != 0).
  until: talos_bootstrap_result.rc == 0
  retries: "{{ talos_bootstrap_bootstrap_retries }}"
  delay: "{{ talos_bootstrap_bootstrap_delay }}"

- name: Mark cluster bootstrapped
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/.bootstrapped"
    state: touch
    mode: "0600"
  changed_when: false

- name: Fetch admin kubeconfig
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} kubeconfig
      --talosconfig {{ talos_talosconfig }}
      {{ talos_build_dir }}/{{ talos_cluster }}/kubeconfig
      -n {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -e {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -f
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/kubeconfig"
  changed_when: true
  register: talos_bootstrap_kubeconfig
  # The Kubernetes API needs time to come up post-bootstrap.
  until: talos_bootstrap_kubeconfig.rc == 0
  retries: "{{ talos_bootstrap_kubeconfig_retries }}"
  delay: "{{ talos_bootstrap_kubeconfig_delay }}"

- name: Store PAT locally for day-2 ESO Secret apply
  # Day-1 runs pre-Flux (no external-secrets ns on the cluster): store only.
  # The PAT is the vault credential itself, so it is kept in build/<cluster>/
  # (0600, gitignored) — never seeded back into the vault it unlocks.
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.env', proton_pass_pat_env) }}\n"
    dest: "{{ talos_build_dir }}/{{ talos_cluster }}/{{ talos_bootstrap_pat_filename }}"
    mode: "0600"
  no_log: true
