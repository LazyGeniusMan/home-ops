---
# Day-1: install, bootstrap etcd, fetch kubeconfig, apply node config.
- name: Apply installer config to maintenance nodes (insecure first boot)
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} apply-config
      --talosconfig {{ talos_talosconfig }}
      --insecure -n {{ item.ip }}
      -f {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
      --mode {{ talos_bootstrap_mode }}
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/.installed-{{ item.name }}"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Mark nodes installed
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/.installed-{{ item.name }}"
    state: touch
    mode: "0600"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Bootstrap etcd on the first control-plane node
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} bootstrap
      --talosconfig {{ talos_talosconfig }}
      -n {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -e {{ talos_clusters[talos_cluster].nodes[0].ip }}
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/.bootstrapped"
  changed_when: true

- name: Mark cluster bootstrapped
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/.bootstrapped"
    state: touch
    mode: "0600"
  changed_when: false

- name: Fetch admin kubeconfig
  ansible.builtin.command:
    cmd: >-
      {{ talos_bootstrap_talosctl }} kubeconfig
      --talosconfig {{ talos_talosconfig }}
      {{ talos_build_dir }}/{{ talos_cluster }}/kubeconfig
      -n {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -e {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -f
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/kubeconfig"
  changed_when: true

- name: Check pass-cli PAT is present for local store
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', proton_pass_pat_env) | length > 0
    fail_msg: "Set {{ proton_pass_pat_env }} before day-1 (needed for the local PAT store)."
    success_msg: "Proton Pass credential available via {{ proton_pass_pat_env }}."

- name: Store PAT locally for day-2 ESO Secret apply
  # Day-1 runs pre-Flux (no external-secrets ns on the cluster): store only.
  # The PAT is the vault credential itself, so it is kept in build/<cluster>/
  # (0600, gitignored) — never seeded back into the vault it unlocks.
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.env', proton_pass_pat_env) }}\n"
    dest: "{{ talos_build_dir }}/{{ talos_cluster }}/{{ talos_bootstrap_pat_filename }}"
    mode: "0600"
  no_log: true
