---
# NetBird setup-key plane (shared by day-0 render + day-2 re-apply).
# The rendered cluster patch carries NB_SETUP_KEY=__TALOS_NETBIRD_SETUP_KEY__
# (never a vault value); this plane resolves the PAT from the vault, applies
# the dedicated Talos NetBird root (roles/talos_render/files/netbird/,
# Ansible-managed, never Flux) via `community.general.terraform`
# (requirements.yml pins community.general >= 9.0.0), and rewrites the
# placeholder with the sensitive `talos_setup_key` output. No raw apply shell
# exists here — only the vault render command and the module call.
# Key: reusable, expiry 0 = never, usage 0 = unlimited,
# auto_groups [<cluster>-nodes]. no_log throughout; 0600 kept.
#
# - PAT (pass://<cluster-vault>/talos/netbird-pat) reaches Terraform ONLY as
#   the NB_PAT env (never -var, never on disk).
# - The module needs an ABSOLUTE binary path, so the apply task resolves the
#   `talos_netbird_tofu` name via command lookup. `force_init: true`; no
#   backend_config, so state is the local `terraform.tfstate` in the staged dir.
# - The root is staged at build/<cluster>/netbird-tf/ (gitignored) and applied
#   THERE; the dir persists across runs so re-applies upsert (do NOT delete —
#   recovery is `tofu import` per resource, see files/netbird/README.md).
- name: Resolve NetBird PAT from Proton Pass
  ansible.builtin.command:
    cmd: >-
      pass-cli item view
      "pass://{{ talos_clusters[talos_cluster].vault }}/{{ talos_netbird_pat_item }}/{{ talos_netbird_pat_field }}"
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_netbird_pass_agent_reason_prefix }}-{{ talos_cluster }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  check_mode: false
  changed_when: false
  register: talos_render_netbird_pat_view
  no_log: true

- name: Fail when the NetBird PAT vault field is missing
  ansible.builtin.fail:
    msg: >-
      Missing NetBird PAT: no value at
      pass://{{ talos_clusters[talos_cluster].vault }}/{{ talos_netbird_pat_item }}/{{ talos_netbird_pat_field }}.
      Seed it once in Proton Pass (the cluster vault `talos` item,
      `netbird-pat` field), run `pass-cli login`, then re-run the play.
  when:
    - talos_render_netbird_pat_view.stdout | default('', true) | trim | length == 0
  no_log: true

- name: Ensure staged Terraform dir exists
  # Persistent: local terraform.tfstate lives here across runs so re-applies upsert.
  ansible.builtin.file:
    path: "{{ talos_netbird_terraform_dir }}"
    state: directory
    mode: "0700"

- name: Stage dedicated NetBird root copy
  # Working copy so the module never writes state into the committed tree.
  # Re-runs sync changed sources over the persisted state by checksum.
  ansible.builtin.copy:
    src: "{{ role_path }}/files/netbird/"
    dest: "{{ talos_netbird_terraform_dir }}/"
    mode: preserve

# The PAT authenticates via the NB_PAT env only (no netbird_token variable,
# so it never lands in TFVARS/state). Only cluster_name is passed as a
# variable; lan_cidr rides the root default (192.168.1.0/24).
- name: Apply Talos NetBird fabric via Terraform
  community.general.terraform:
    project_path: "{{ talos_netbird_terraform_dir }}"
    binary_path: "{{ lookup('ansible.builtin.pipe', 'command -v ' + talos_netbird_tofu) | trim }}"
    state: present
    force_init: true
    variables:
      cluster_name: "{{ talos_cluster }}"
  environment:
    NB_PAT: "{{ talos_render_netbird_pat_view.stdout | trim }}"
  register: talos_render_netbird_tf
  no_log: true

- name: Fail when the Terraform setup-key output is empty
  ansible.builtin.fail:
    msg: >-
      Terraform returned an empty talos_setup_key output for
      {{ talos_cluster }}. Check the NetBird PAT
      (pass://{{ talos_clusters[talos_cluster].vault }}/{{ talos_netbird_pat_item }}/{{ talos_netbird_pat_field }})
      and re-run the play.
  when:
    - talos_render_netbird_tf.outputs.talos_setup_key.value | default('', true) | trim | length == 0
  no_log: true

- name: Stage resolved setup key for the shape check
  # Indirection keeps the key out of the assert args (assert stays WITHOUT
  # no_log so failures name the PAT source; only a boolean is asserted).
  ansible.builtin.set_fact:
    talos_render_netbird_setup_key_ok: >-
      {{ talos_render_netbird_tf.outputs.talos_setup_key.value | default('', true) | trim
      is match(talos_netbird_setup_key_pattern) }}
  no_log: true

- name: Assert the resolved setup key matches the expected shape
  # UUID gate: proves the value is a real minted key before baking it into
  # the machine configs. Never echoes the value.
  ansible.builtin.assert:
    that:
      - talos_render_netbird_setup_key_ok | bool
    fail_msg: >-
      Resolved NetBird setup key for {{ talos_cluster }} failed the shape
      check (expected UUID form). Verify the PAT at
      pass://{{ talos_clusters[talos_cluster].vault }}/{{ talos_netbird_pat_item }}/{{ talos_netbird_pat_field }}
      and re-run the play.
    success_msg: "NetBird setup key resolved for {{ talos_cluster }}."

- name: Rewrite setup-key placeholder in the rendered cluster patch
  # pass-cli inject ran first, so the render still carries the placeholder;
  # file-mode stays 0600.
  ansible.builtin.replace:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/patches.yml"
    regexp: "{{ talos_netbird_placeholder }}"
    replace: "{{ talos_render_netbird_tf.outputs.talos_setup_key.value | trim }}"
  no_log: true
