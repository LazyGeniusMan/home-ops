---
# NetBird setup-key plane (shared by day-0 render + day-2 re-apply).
# The rendered cluster patch carries NB_SETUP_KEY=__TALOS_NETBIRD_SETUP_KEY__
# (never a pass:// vault value); this plane resolves the PAT from Proton
# Pass, applies the dedicated Talos NetBird root
# (roles/talos_render/files/netbird/ — full access fabric, Ansible-managed,
# never Flux) via the `community.general.terraform` module, and rewrites the
# placeholder with the sensitive `talos_setup_key` output.
#
# Module FQCN: `community.general.terraform` (requirements.yml pins
# community.general >= 9.0.0, which ships this module; verified via
# `ansible-doc community.general.terraform` against the installed 13.3.0).
# The module shells out to a Terraform-compatible binary itself, so NO raw
# `tofu ... apply` shell exists anywhere on this plane — the only helpers
# are `pass-cli` (command module, never shell) and this module call.
#
# - The PAT (magnet pass://<cluster-vault>/talos/netbird-pat) reaches
#   Terraform ONLY as the NB_PAT env var (provider schema: config value wins
#   over env, so NO -var netbird_token is passed — the token never lands in
#   TFVARS/state/diffs; task-level `environment:` + `no_log: true` keeps it
#   out of logs too). Never written to disk.
# - The module needs an ABSOLUTE binary path (its preflight stats the path),
#   while the `talos_netbird_tofu` knob stays a bare name — so the apply task
#   resolves it via `command -v` (pipe lookup, trimmed). `force_init: true`
#   drives init every run (provider auto-install on first run); no
#   backend_config is set, so state is the local `terraform.tfstate` inside
#   the staged dir.
# - The plane first copies the committed root into
#   build/<cluster>/netbird-tf/ (gitignored via ansible/build/) and applies
#   THERE. The staged dir PERSISTS across runs so re-applies are true upserts
#   (variables: cluster_name = talos_cluster); do NOT delete it between runs
#   (a fresh dir = empty state = duplicate-CREATE attempts failing closed
#   under prevent_destroy; recovery is `tofu import` per resource — see
#   files/netbird/README.md).
# - The key plaintext leaves ONLY via the module's
#   outputs.talos_setup_key.value (sensitive output) into the placeholder
#   rewrite (0600 kept). Every key-handling task carries no_log: true; no
#   debug ever prints the key.
# - Key properties: type reusable, expiry_seconds 0 = never expires,
#   usage_limit 0 = unlimited, auto_groups [<cluster>-nodes].
# - Rotation: replace the netbird_setup_key.talos resource (plan first —
#   prevent_destroy fails closed) then re-run day-0
#   (rm build/<c>/patches.yml first so the inject guard re-renders) or
#   day-2 -e reapply_configs=true (forced re-render + rewrite + apply).
# - The setup key never lives in vault. There is NO outputs_secret fallback:
#   the Flux consumer root is proxy-only and exposes no talos_setup_key, so
#   this module-driven plane is the only source.
- name: Resolve NetBird PAT from Proton Pass
  ansible.builtin.command:
    cmd: >-
      pass-cli item view
      "pass://{{ talos_clusters[talos_cluster].vault }}/{{ talos_netbird_pat_item }}/{{ talos_netbird_pat_field }}"
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_netbird_pass_agent_reason_prefix }}-{{ talos_cluster }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  check_mode: false
  changed_when: false
  register: talos_render_netbird_pat_view
  no_log: true

- name: Fail when the NetBird PAT vault field is missing
  ansible.builtin.fail:
    msg: >-
      Missing NetBird PAT: no value at
      pass://{{ talos_clusters[talos_cluster].vault }}/{{ talos_netbird_pat_item }}/{{ talos_netbird_pat_field }}.
      Seed it once in Proton Pass (the cluster vault `talos` item,
      `netbird-pat` field), run `pass-cli login`, then re-run the play.
  when:
    - talos_render_netbird_pat_view.stdout | default('', true) | trim | length == 0
  no_log: true

- name: Ensure staged Terraform dir exists
  # Persistent (NOT throwaway): the module's local terraform.tfstate lives
  # here across runs so re-applies upsert instead of re-creating.
  ansible.builtin.file:
    path: "{{ talos_netbird_terraform_dir }}"
    state: directory
    mode: "0700"

- name: Stage dedicated NetBird root copy
  # Working copy of roles/talos_render/files/netbird/ so the module never
  # writes lock files / .terraform/ / state into the committed tree (all
  # stay inside the gitignored staged dir). Re-runs sync changed sources
  # over the persisted state by checksum.
  ansible.builtin.copy:
    src: "{{ role_path }}/files/netbird/"
    dest: "{{ talos_netbird_terraform_dir }}/"
    mode: preserve

# The PAT authenticates via the NB_PAT env (provider schema: config value
# wins over env, so NO variables entry for netbird_token exists — the token
# never lands in a TFVARS file, state diff, or process table). Only
# cluster_name is passed as a variable (per-cluster fabric); lan_cidr rides
# the root default (192.168.1.0/24).
- name: Apply Talos NetBird fabric via Terraform
  community.general.terraform:
    project_path: "{{ talos_netbird_terraform_dir }}"
    binary_path: "{{ lookup('ansible.builtin.pipe', 'command -v ' + talos_netbird_tofu) | trim }}"
    state: present
    force_init: true
    variables:
      cluster_name: "{{ talos_cluster }}"
  environment:
    NB_PAT: "{{ talos_render_netbird_pat_view.stdout | trim }}"
  register: talos_render_netbird_tf
  no_log: true

- name: Fail when the Terraform setup-key output is empty
  ansible.builtin.fail:
    msg: >-
      Terraform returned an empty talos_setup_key output for
      {{ talos_cluster }}. Check the NetBird PAT
      (pass://{{ talos_clusters[talos_cluster].vault }}/{{ talos_netbird_pat_item }}/{{ talos_netbird_pat_field }})
      and re-run the play.
  when:
    - talos_render_netbird_tf.outputs.talos_setup_key.value | default('', true) | trim | length == 0
  no_log: true

- name: Stage resolved setup key for the shape check
  # Indirection keeps the key out of the assert args (assert is intentionally
  # WITHOUT no_log so failures stay actionable; the value itself must never
  # reach the log, so only a boolean fact is asserted below).
  ansible.builtin.set_fact:
    talos_render_netbird_setup_key_ok: >-
      {{ talos_render_netbird_tf.outputs.talos_setup_key.value | default('', true) | trim
      is match(talos_netbird_setup_key_pattern) }}
  no_log: true

- name: Assert the resolved setup key matches the expected shape
  # Shape gate only (UUID form per /api/setup-keys): proves the value is a
  # real minted key and not an empty/HTML/error blob before it is baked into
  # the machine configs. The assertion message never echoes the value.
  ansible.builtin.assert:
    that:
      - talos_render_netbird_setup_key_ok | bool
    fail_msg: >-
      Resolved NetBird setup key for {{ talos_cluster }} failed the shape
      check (expected UUID form). Verify the PAT at
      pass://{{ talos_clusters[talos_cluster].vault }}/{{ talos_netbird_pat_item }}/{{ talos_netbird_pat_field }}
      and re-run the play.
    success_msg: "NetBird setup key resolved for {{ talos_cluster }}."

- name: Rewrite setup-key placeholder in the rendered cluster patch
  # The rendered build/<cluster>/patches.yml already exists (pass-cli inject
  # ran first) and still carries NB_SETUP_KEY=__TALOS_NETBIRD_SETUP_KEY__.
  # Replace the placeholder with the resolved key; file-mode stays 0600.
  ansible.builtin.replace:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/patches.yml"
    regexp: "{{ talos_netbird_placeholder }}"
    replace: "{{ talos_render_netbird_tf.outputs.talos_setup_key.value | trim }}"
  no_log: true
