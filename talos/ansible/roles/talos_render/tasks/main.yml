---
# Day-0 render: inject secrets, generate machine configs, validate.
- name: Assert Proton Pass PAT env var is set
  # Fail fast before any build output or pass-cli exec: the PAT must arrive
  # via env only (never files). check_mode has no effect on assert, so
  # --check still validates.
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', proton_pass_pat_env) | length > 0
    fail_msg: >-
      {{ proton_pass_pat_env }} is not set or empty. Export
      {{ proton_pass_pat_env }}=pst_... and run `pass-cli login` before
      rendering secrets, then re-run the play.
    success_msg: "{{ proton_pass_pat_env }} is set."

- name: Ensure build directory exists
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}"
    state: directory
    mode: "0700"

- name: Check pass-cli session is authenticated
  # Ansible NEVER logs in: this probes the existing session via
  # `pass-cli info -o json` (rc==0 + JSON mapping stdout = logged in;
  # logged-out gives rc=1 + a non-JSON error). check_mode:false so
  # --check still validates auth. On failure, export
  # PROTON_PASS_PERSONAL_ACCESS_TOKEN=pst_... and run `pass-cli login`,
  # then re-run the play.
  ansible.builtin.command:
    cmd: pass-cli info -o json
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_render_pass_agent_reason_prefix }}-{{ talos_cluster }}-authcheck-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  check_mode: false
  changed_when: false
  failed_when: false
  register: talos_render_pass_session
  no_log: true

- name: Fail when pass-cli has no authenticated session
  ansible.builtin.assert:
    that:
      - talos_render_pass_session.rc == 0
      - talos_render_pass_session.stdout | from_json is mapping
    fail_msg: >-
      No authenticated pass-cli session. Export
      {{ proton_pass_pat_env }}=pst_... and run `pass-cli login` before
      rendering secrets, then re-run the play.
    success_msg: "pass-cli session authenticated."

- name: Render cluster patches.yml via pass-cli inject
  # NOTE: intentionally WITHOUT no_log — pass-cli inject with --out-file
  # prints no secret values (success: "Secrets injected successfully to:
  # <path>"; failure: only the unresolved pass://<vault>/<item>/<field>
  # ref). A failure therefore names the missing vault field instead of
  # showing "censored".
  ansible.builtin.command:
    cmd: >-
      pass-cli inject
      --in-file {{ playbook_dir }}/../../clusters/{{ talos_cluster }}/patches.yml
      --out-file {{ talos_build_dir }}/{{ talos_cluster }}/patches.yml
      --force --file-mode 0600
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/patches.yml"
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_render_pass_agent_reason_prefix }}-{{ talos_cluster }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  changed_when: true

- name: Render node patches via pass-cli inject
  # NOTE: intentionally WITHOUT no_log — see the cluster inject task above:
  # pass-cli prints no secret values in this mode; failures name the
  # unresolved pass://<vault>/<item>/<field> ref for this node.
  ansible.builtin.command:
    cmd: >-
      pass-cli inject
      --in-file {{ playbook_dir }}/../../clusters/{{ talos_cluster }}/nodes/{{ item.name }}/patches.yml
      --out-file {{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml
      --force --file-mode 0600
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml"
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_render_pass_agent_reason_prefix }}-{{ talos_cluster }}-{{ item.name }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Resolve and upload per-node schematics
  ansible.builtin.include_tasks: schematic.yml
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    loop_var: node
    label: "{{ node.name }}"

- name: Generate Talos secrets bundle when missing
  # NOTE: intentionally WITHOUT no_log — `talosctl gen secrets -o` writes
  # the bundle to a file and prints nothing secret-bearing, so failures
  # (bad flags, unwritable out-file) stay visible instead of "censored".
  ansible.builtin.command:
    cmd: >-
      {{ talos_render_talosctl }} gen secrets
      -o {{ talos_build_dir }}/{{ talos_cluster }}/secrets.bundle.yml
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/secrets.bundle.yml"
  changed_when: true

- name: Ensure per-node build directories exist
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}"
    state: directory
    mode: "0700"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate cluster talosconfig
  ansible.builtin.command:
    cmd: >-
      {{ talos_render_talosctl }} gen config {{ talos_cluster }}
      {{ talos_clusters[talos_cluster].endpoint }}
      --with-secrets {{ talos_build_dir }}/{{ talos_cluster }}/secrets.bundle.yml
      --config-patch @{{ playbook_dir }}/../../clusters/_base/patches.yml
      --config-patch @{{ talos_build_dir }}/{{ talos_cluster }}/patches.yml
      --talos-version {{ talos_render_version }}
      -t talosconfig
      --force
      -o {{ talos_build_dir }}/{{ talos_cluster }}/talosconfig
  changed_when: true

- name: Generate per-node machine configs
  ansible.builtin.command:
    cmd: >-
      {{ talos_render_talosctl }} gen config {{ talos_cluster }}
      {{ talos_clusters[talos_cluster].endpoint }}
      --with-secrets {{ talos_build_dir }}/{{ talos_cluster }}/secrets.bundle.yml
      --config-patch @{{ playbook_dir }}/../../clusters/_base/patches.yml
      --config-patch @{{ talos_build_dir }}/{{ talos_cluster }}/patches.yml
      {{ '--config-patch-control-plane' if talos_machine_roles[item.role] == 'controlplane' else '--config-patch-worker' }}
      @{{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml
      --talos-version {{ talos_render_version }}
      --install-image
      factory.talos.dev/metal-installer/{{ (talos_render_schematic_ids | default({})).get(item.name, 'pending-schematic-upload') }}:{{ talos_version }}
      -t {{ talos_machine_roles[item.role] }}
      --force
      -o {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Validate generated per-node configs
  ansible.builtin.command:
    cmd: >-
      {{ talos_render_talosctl }} validate
      -c {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
      -m metal
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
