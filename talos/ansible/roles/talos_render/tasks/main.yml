---
# Day-0 render: inject secrets, generate machine configs, validate.
# Auth comes FIRST: every pass-cli exec below needs a live session, so the
# `pass-cli info` probe runs before any render. Ansible NEVER logs in —
# run `pass-cli login` in your shell before the play.
- name: Ensure build directory exists
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}"
    state: directory
    mode: "0700"

- name: Stat cluster patch source for render freshness preflight
  # The inject tasks below carry `creates:` guards: they never re-run while
  # the rendered file exists, even when the SOURCE changed (RUNBOOK §4.3).
  # Compare mtimes and fail fast naming the exact rm from §1.7 instead of
  # rendering + validating stale configs as if fresh.
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../clusters/{{ talos_cluster }}/patches.yml"
  check_mode: false
  register: talos_render_preflight_cluster_src

- name: Stat rendered cluster patch for render freshness preflight
  ansible.builtin.stat:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/patches.yml"
  check_mode: false
  register: talos_render_preflight_cluster_out

- name: Fail when the cluster patch source is newer than its render
  ansible.builtin.assert:
    that:
      - not (talos_render_preflight_cluster_src.stat.exists | default(false))
        or not (talos_render_preflight_cluster_out.stat.exists | default(false))
        or (talos_render_preflight_cluster_src.stat.mtime | default(0)) <= (talos_render_preflight_cluster_out.stat.mtime | default(0))
    fail_msg: >-
      build/{{ talos_cluster }}/patches.yml is older than its source
      (clusters/{{ talos_cluster }}/patches.yml changed after the last
      render) and the inject task would skip it via creates:. Delete the
      stale file(s) and re-run day-0 (RUNBOOK §1.7):
      rm build/{{ talos_cluster }}/patches.yml
      build/{{ talos_cluster }}/nodes-*-patches.yml
    success_msg: "Cluster patch render is fresh."

- name: Stat PAT template for render freshness preflight
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../clusters/{{ talos_cluster }}/pat.yml.template"
  check_mode: false
  register: talos_render_preflight_pat_src

- name: Stat rendered PAT for render freshness preflight
  ansible.builtin.stat:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/{{ talos_pat_filename }}"
  check_mode: false
  register: talos_render_preflight_pat_out

- name: Fail when the PAT template is newer than its render
  # Vault rotations are undetectable here (values live outside the repo);
  # this covers template edits only. A rotation still needs an explicit
  # rm build/<cluster>/proton-pass-pat + re-run day-0 (RUNBOOK §4.3).
  ansible.builtin.assert:
    that:
      - not (talos_render_preflight_pat_src.stat.exists | default(false))
        or not (talos_render_preflight_pat_out.stat.exists | default(false))
        or (talos_render_preflight_pat_src.stat.mtime | default(0)) <= (talos_render_preflight_pat_out.stat.mtime | default(0))
    fail_msg: >-
      build/{{ talos_cluster }}/{{ talos_pat_filename }} is older than its
      source (pat.yml.template changed after the last render) and the inject
      task would skip it via creates:. Delete the stale file and re-run
      day-0 (RUNBOOK §1.7):
      rm build/{{ talos_cluster }}/{{ talos_pat_filename }}
    success_msg: "PAT render is fresh."

- name: Stat node patch sources for render freshness preflight
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../clusters/{{ talos_cluster }}/nodes/{{ item.name }}/patches.yml"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  check_mode: false
  register: talos_render_preflight_node_src

- name: Stat rendered node patches for render freshness preflight
  ansible.builtin.stat:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  check_mode: false
  register: talos_render_preflight_node_out

- name: Fail when a node patch source is newer than its render
  # Indexed pairing (not zip): node list order is stable, so src/out result
  # indices align 1:1 with the node loop above.
  ansible.builtin.assert:
    that:
      - not (talos_render_preflight_node_src.results[idx].stat.exists | default(false))
        or not (talos_render_preflight_node_out.results[idx].stat.exists | default(false))
        or (talos_render_preflight_node_src.results[idx].stat.mtime | default(0)) <= (talos_render_preflight_node_out.results[idx].stat.mtime | default(0))
    fail_msg: >-
      build/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml is
      older than its source (clusters/{{ talos_cluster }}/nodes/{{
      item.name }}/patches.yml changed after the last render) and the
      inject task would skip it via creates:. Delete the stale file and
      re-run day-0 (RUNBOOK §1.7):
      rm build/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml
    success_msg: "Node patch render is fresh for {{ item.name }}."
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: idx

- name: Check pass-cli session is authenticated
  # Ansible NEVER logs in: this probes the existing session via
  # `pass-cli info -o json` (rc==0 + JSON mapping stdout = logged in;
  # logged-out gives rc=1 + a non-JSON error). check_mode:false so
  # --check still validates auth. On failure, run `pass-cli login`,
  # then re-run the play.
  ansible.builtin.command:
    cmd: pass-cli info -o json
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_render_pass_agent_reason_prefix }}-{{ talos_cluster }}-authcheck-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  check_mode: false
  changed_when: false
  failed_when: false
  register: talos_render_pass_session
  no_log: true

- name: Fail when pass-cli has no authenticated session
  ansible.builtin.assert:
    that:
      - talos_render_pass_session.rc == 0
      - talos_render_pass_session.stdout | from_json is mapping
    fail_msg: >-
      No authenticated pass-cli session. Run `pass-cli login` before
      rendering secrets, then re-run the play.
    success_msg: "pass-cli session authenticated."

- name: Render cluster patches.yml via pass-cli inject
  # NOTE: intentionally WITHOUT no_log — pass-cli inject with --out-file
  # prints no secret values (success: "Secrets injected successfully to:
  # <path>"; failure: only the unresolved pass://<vault>/<item>/<field>
  # ref). A failure therefore names the missing vault field instead of
  # showing "censored".
  ansible.builtin.command:
    cmd: >-
      pass-cli inject
      --in-file {{ playbook_dir }}/../../clusters/{{ talos_cluster }}/patches.yml
      --out-file {{ talos_build_dir }}/{{ talos_cluster }}/patches.yml
      --force --file-mode 0600
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/patches.yml"
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_render_pass_agent_reason_prefix }}-{{ talos_cluster }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  changed_when: true

- name: Render node patches via pass-cli inject
  # NOTE: intentionally WITHOUT no_log — see the cluster inject task above:
  # pass-cli prints no secret values in this mode; failures name the
  # unresolved pass://<vault>/<item>/<field> ref for this node.
  ansible.builtin.command:
    cmd: >-
      pass-cli inject
      --in-file {{ playbook_dir }}/../../clusters/{{ talos_cluster }}/nodes/{{ item.name }}/patches.yml
      --out-file {{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml
      --force --file-mode 0600
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml"
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_render_pass_agent_reason_prefix }}-{{ talos_cluster }}-{{ item.name }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Render PAT file via pass-cli inject
  # ESO webhook PAT: single-line source at clusters/<cluster>/pat.yml.template
  # (double-brace ref to `eso-proton-pass`/`pat` in the OWN cluster vault).
  # NOTE: intentionally WITHOUT no_log — see the cluster inject task above:
  # pass-cli prints no secret values in this mode; failures name the
  # unresolved pass://<vault>/<item>/<field> ref.
  ansible.builtin.command:
    cmd: >-
      pass-cli inject
      --in-file {{ playbook_dir }}/../../clusters/{{ talos_cluster }}/pat.yml.template
      --out-file {{ talos_build_dir }}/{{ talos_cluster }}/{{ talos_pat_filename }}
      --force --file-mode 0600
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/{{ talos_pat_filename }}"
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_render_pass_agent_reason_prefix }}-{{ talos_cluster }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  changed_when: true

- name: Resolve and upload per-node schematics
  ansible.builtin.include_tasks: schematic.yml
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    loop_var: node
    label: "{{ node.name }}"

- name: Generate Talos secrets bundle when missing
  # NOTE: intentionally WITHOUT no_log — `talosctl gen secrets -o` writes
  # the bundle to a file and prints nothing secret-bearing, so failures
  # (bad flags, unwritable out-file) stay visible instead of "censored".
  ansible.builtin.command:
    cmd: >-
      {{ talos_render_talosctl }} gen secrets
      -o {{ talos_build_dir }}/{{ talos_cluster }}/secrets.bundle.yml
    creates: "{{ talos_build_dir }}/{{ talos_cluster }}/secrets.bundle.yml"
  changed_when: true

- name: Ensure per-node build directories exist
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}"
    state: directory
    mode: "0700"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate cluster talosconfig
  ansible.builtin.command:
    cmd: >-
      {{ talos_render_talosctl }} gen config {{ talos_cluster }}
      {{ talos_clusters[talos_cluster].endpoint }}
      --with-secrets {{ talos_build_dir }}/{{ talos_cluster }}/secrets.bundle.yml
      --config-patch @{{ playbook_dir }}/../../clusters/_base/patches.yml
      --config-patch @{{ talos_build_dir }}/{{ talos_cluster }}/patches.yml
      --talos-version {{ talos_render_version }}
      -t talosconfig
      --force
      -o {{ talos_build_dir }}/{{ talos_cluster }}/talosconfig
  changed_when: true

- name: Generate per-node machine configs
  ansible.builtin.command:
    cmd: >-
      {{ talos_render_talosctl }} gen config {{ talos_cluster }}
      {{ talos_clusters[talos_cluster].endpoint }}
      --with-secrets {{ talos_build_dir }}/{{ talos_cluster }}/secrets.bundle.yml
      --config-patch @{{ playbook_dir }}/../../clusters/_base/patches.yml
      --config-patch @{{ talos_build_dir }}/{{ talos_cluster }}/patches.yml
      {{ '--config-patch-control-plane' if talos_machine_roles[item.role] == 'controlplane' else '--config-patch-worker' }}
      @{{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml
      --talos-version {{ talos_render_version }}
      --install-image
      factory.talos.dev/metal-installer/{{ (talos_render_schematic_ids | default({})).get(item.name, 'pending-schematic-upload') }}:{{ talos_version }}
      -t {{ talos_machine_roles[item.role] }}
      --force
      -o {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Validate generated per-node configs
  ansible.builtin.command:
    cmd: >-
      {{ talos_render_talosctl }} validate
      -c {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
      -m metal
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
