---
# Config push to installed nodes (RUNBOOK §3.6): the render half lives in
# refresh.yml (shared with -e refresh_secrets=true); this file only validates
# the reapply mode and pushes via authenticated apply-config.
- name: Assert re-apply mode is valid
  # Full talosctl apply-config mode set (reboot included — valid upstream mode).
  ansible.builtin.assert:
    that:
      - talos_operate_reapply_mode in ['auto', 'no-reboot', 'reboot', 'staged', 'try']
    fail_msg: "reapply_mode must be one of auto, no-reboot, reboot, staged, try (got '{{ talos_operate_reapply_mode }}')."
    success_msg: "Re-apply mode {{ talos_operate_reapply_mode }}."
  when: talos_operate_reapply_configs | bool

- name: Apply machine configs to installed nodes
  ansible.builtin.command:
    cmd: >-
      {{ talos_operate_talosctl }} apply-config
      --talosconfig {{ talos_talosconfig }}
      -n {{ item.ip }}
      -e {{ item.ip }}
      -f {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
      --mode {{ talos_operate_reapply_mode }}
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: talos_operate_reapply_configs | bool
  changed_when: true
