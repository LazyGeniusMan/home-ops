---
# Config push to installed nodes (RUNBOOK §3.6): render half lives in refresh.yml.
- name: Assert re-apply mode is valid
  # Full talosctl apply-config mode set (reboot included — valid upstream mode).
  ansible.builtin.assert:
    that:
      - talos_operate_reapply_mode in ['auto', 'no-reboot', 'reboot', 'staged', 'try']
    fail_msg: >-
      reapply_mode must be one of auto, no-reboot, reboot, staged, try
      (got '{{ talos_operate_reapply_mode }}').
    success_msg: "Re-apply mode {{ talos_operate_reapply_mode }}."
  when: talos_operate_reapply_configs | bool

- name: Slurp rendered node patches for the pre-apply wipe gate
  ansible.builtin.slurp:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  check_mode: false
  failed_when: false
  register: talos_operate_reapply_wipe
  when: talos_operate_reapply_configs | bool

- name: Fail when a rendered node patch carries wipe true before apply
  # Refresh already forced wipe:false; this catches a stale build/.
  ansible.builtin.assert:
    that:
      - not ((item.content | default('', true) | b64decode | trim) is search('(?m)^\s*wipe:\s*true\s*$'))
    fail_msg: >-
      Rendered nodes-{{ item.item.name }}-patches.yml contains `wipe: true` —
      day-2 refuses apply-config to an installed node. Delete
      build/{{ talos_cluster }}/nodes-{{ item.item.name }}-patches.yml and
      re-run day-2 -e reapply_configs=true so the refresh plane sanitizes it.
    success_msg: "Rendered node patch for {{ item.item.name }} carries wipe:false before apply."
  loop: "{{ talos_operate_reapply_wipe.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - talos_operate_reapply_configs | bool
    - not ansible_check_mode

- name: Apply machine configs to installed nodes
  ansible.builtin.command:
    cmd: >-
      {{ talos_operate_talosctl }} apply-config
      --talosconfig {{ talos_talosconfig }}
      -n {{ item.ip }}
      -e {{ item.ip }}
      -f {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
      --mode {{ talos_operate_reapply_mode }}
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: talos_operate_reapply_configs | bool
  changed_when: true
