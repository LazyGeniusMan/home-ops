---
# ESO PAT Secret plane: optionally renew the agent token, then apply the
# stored PAT to the cluster Secret + restart the webhook so it picks up
# rotation.
# Default (pat_apply=false) is read-only: every task below is skipped.
# Day-1 stores the PAT locally; this plane only runs post-Flux (the
# external-secrets namespace must exist). PAT-bearing tasks carry no_log.
# Token management uses the agent verbs (`agent renew <name> --expiration
# <exp>`, always JSON): `agent create <name> --expiration ... [--vault ...]`
# replaces `pat create`; `agent access grant` replaces `pat access grant`;
# `agent delete <name>` (by name) replaces `pat delete`.
- name: Attempt agent token renewal via pass-cli
  # DEFENSIVE: pass-cli cannot manage agent tokens inside a PAT/agent
  # session, so this never fails the play — a blocked session skips with
  # the exact interactive command to run instead.
  ansible.builtin.command:
    cmd: >-
      pass-cli agent renew {{ talos_operate_pat_name }}
      --expiration {{ talos_operate_pat_expiration }}
      --output json
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_operate_pass_agent_reason_prefix }}-{{ talos_cluster }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  when:
    - talos_operate_pat_apply | bool
    - talos_operate_pat_renew | bool
  changed_when: talos_operate_pat_renew_result.rc == 0
  failed_when: false
  register: talos_operate_pat_renew_result
  no_log: true

- name: Report agent-session blocked renewal
  ansible.builtin.debug:
    msg: >-
      Agent token renewal skipped: pass-cli cannot manage agent tokens while
      logged in with a PAT/agent session. Renew interactively instead:
      pass-cli agent renew {{ talos_operate_pat_name }}
      --expiration {{ talos_operate_pat_expiration }} --output json
      (then re-run day-2 with -e pat_apply=true to apply the stored PAT).
  when:
    - talos_operate_pat_apply | bool
    - talos_operate_pat_renew | bool
    - talos_operate_pat_renew_result is defined
    - talos_operate_pat_renew_result.rc is defined
    - talos_operate_pat_renew_result.rc != 0
    - >-
      ('while logged in with a personal access token'
      in (talos_operate_pat_renew_result.stderr | default('', true)
      + talos_operate_pat_renew_result.stdout | default('', true)))
      or ('personal access token'
      in ((talos_operate_pat_renew_result.stderr | default('', true)
      + talos_operate_pat_renew_result.stdout | default('', true)) | lower))
      or ('agent session'
      in ((talos_operate_pat_renew_result.stderr | default('', true)
      + talos_operate_pat_renew_result.stdout | default('', true)) | lower))

- name: Extract renewed agent token from renew output
  # `agent renew --output json` prints {"token": "PROTON_PASS_PERSONAL_ACCESS_TOKEN=pst_..."}
  # (or a bare pst_ token in human output): strip the env-prefix, fall back
  # to a pst_ regex.
  ansible.builtin.set_fact:
    talos_operate_pat_renewed: >-
      {{ ((talos_operate_pat_renew_result.stdout | default('', true) | from_json).token
      | default('', true)
      | regex_replace('^PROTON_PASS_PERSONAL_ACCESS_TOKEN=', ''))
      if ((talos_operate_pat_renew_result.stdout | default('', true) | trim).startswith('{'))
      else (talos_operate_pat_renew_result.stdout | default('', true)
      | regex_search('pst_[^"\\s]+', multiline=true) | default('', true)) }}
  when:
    - talos_operate_pat_apply | bool
    - talos_operate_pat_renew | bool
    - talos_operate_pat_renew_result is defined
    - talos_operate_pat_renew_result.rc is defined
    - talos_operate_pat_renew_result.rc == 0
  no_log: true

- name: Refresh local PAT store with renewed value
  ansible.builtin.copy:
    content: "{{ talos_operate_pat_renewed }}\n"
    dest: "{{ talos_build_dir }}/{{ talos_cluster }}/{{ talos_operate_pat_filename }}"
    mode: "0600"
  when:
    - talos_operate_pat_apply | bool
    - talos_operate_pat_renew | bool
    - talos_operate_pat_renewed is defined
    - talos_operate_pat_renewed | length > 0
  no_log: true

- name: Note unparseable renew output keeps stored PAT
  ansible.builtin.debug:
    msg: >-
      Agent token renew returned rc=0 but no token was found in its output
      (no .token in the JSON and no pst_ match);
      keeping the stored PAT at
      build/{{ talos_cluster }}/{{ talos_operate_pat_filename }}.
  when:
    - talos_operate_pat_apply | bool
    - talos_operate_pat_renew | bool
    - talos_operate_pat_renew_result is defined
    - talos_operate_pat_renew_result.rc is defined
    - talos_operate_pat_renew_result.rc == 0
    - talos_operate_pat_renewed is defined
    - talos_operate_pat_renewed | length == 0

- name: Check ESO PAT Secret target namespace is reachable
  ansible.builtin.command:
    cmd: >-
      {{ talos_operate_kubectl }} --kubeconfig
      {{ talos_build_dir }}/{{ talos_cluster }}/kubeconfig
      get namespace {{ talos_operate_pat_namespace }}
  when: talos_operate_pat_apply | bool
  changed_when: false
  failed_when: false
  register: talos_operate_pat_ns

- name: Report PAT Secret target unavailable
  ansible.builtin.debug:
    msg: >-
      PAT Secret apply skipped: namespace
      {{ talos_operate_pat_namespace }} is unreachable
      (Flux/ESO not installed yet, or kubeconfig stale — refresh with
      -e regen_kubeconfig=true, or re-run day-2 post-Flux).
  when:
    - talos_operate_pat_apply | bool
    - talos_operate_pat_ns.rc is defined
    - talos_operate_pat_ns.rc != 0

- name: Apply stored PAT to the ESO Secret
  ansible.builtin.shell:
    cmd: >-
      {{ talos_operate_kubectl }} --kubeconfig
      {{ talos_build_dir }}/{{ talos_cluster }}/kubeconfig
      -n {{ talos_operate_pat_namespace }} create secret generic
      {{ talos_operate_pat_secret }}
      --from-file={{ talos_operate_pat_key }}={{ talos_build_dir }}/{{ talos_cluster }}/{{ talos_operate_pat_filename }}
      --dry-run=client -o yaml
      | {{ talos_operate_kubectl }} --kubeconfig
      {{ talos_build_dir }}/{{ talos_cluster }}/kubeconfig
      apply -f -
  when:
    - talos_operate_pat_apply | bool
    - talos_operate_pat_ns.rc is defined
    - talos_operate_pat_ns.rc == 0
  changed_when: "'unchanged' not in talos_operate_pat_apply_result.stdout"
  register: talos_operate_pat_apply_result
  no_log: true

- name: Restart ESO Proton Pass webhook to pick up rotated PAT
  ansible.builtin.command:
    cmd: >-
      {{ talos_operate_kubectl }} --kubeconfig
      {{ talos_build_dir }}/{{ talos_cluster }}/kubeconfig
      -n {{ talos_operate_pat_namespace }} rollout restart
      deploy/{{ talos_operate_pat_deployment }}
  when:
    - talos_operate_pat_apply | bool
    - talos_operate_pat_apply_result is defined
    - talos_operate_pat_apply_result.changed | default(false) | bool
  changed_when: true

- name: Summarize PAT Secret plane
  ansible.builtin.debug:
    msg: >-
      PAT Secret {{ talos_operate_pat_namespace }}/{{ talos_operate_pat_secret }}
      (key {{ talos_operate_pat_key }}):
      {{ talos_operate_pat_apply_result.stdout | default('not applied (see skip notes above)', true) }}.
      Webhook deploy/{{ talos_operate_pat_deployment }} restarts only when the
      Secret data changed.
  when: talos_operate_pat_apply | bool
