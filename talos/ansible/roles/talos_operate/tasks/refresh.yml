---
# Secrets refresh without a push (RUNBOOK §3.6a): re-render + regenerate, never apply-config.
- name: Decide whether secrets refresh runs
  ansible.builtin.set_fact:
    talos_operate_refresh_active: "{{ talos_operate_refresh_secrets | bool or talos_operate_reapply_configs | bool }}"

- name: Force re-render cluster patches.yml via pass-cli inject
  # No no_log and no creates: (dropped guard lets edited sources re-render).
  ansible.builtin.command:
    cmd: >-
      pass-cli inject
      --in-file {{ playbook_dir }}/../../clusters/{{ talos_cluster }}/patches.yml
      --out-file {{ talos_build_dir }}/{{ talos_cluster }}/patches.yml
      --force --file-mode 0600
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_operate_pass_agent_reason_prefix }}-{{ talos_cluster }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  when: talos_operate_refresh_active | bool
  changed_when: true

- name: Force re-render node patches via pass-cli inject
  ansible.builtin.command:
    cmd: >-
      pass-cli inject
      --in-file {{ playbook_dir }}/../../clusters/{{ talos_cluster }}/nodes/{{ item.name }}/patches.yml
      --out-file {{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml
      --force --file-mode 0600
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_operate_pass_agent_reason_prefix }}-{{ talos_cluster }}-{{ item.name }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: talos_operate_refresh_active | bool
  changed_when: true

- name: Force re-render PAT file via pass-cli inject
  # No creates:, no no_log — picks up vault rotations. Source: clusters/<cluster>/pat.yml.template.
  ansible.builtin.command:
    cmd: >-
      pass-cli inject
      --in-file {{ playbook_dir }}/../../clusters/{{ talos_cluster }}/pat.yml.template
      --out-file {{ talos_build_dir }}/{{ talos_cluster }}/{{ talos_pat_filename }}
      --force --file-mode 0600
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_operate_pass_agent_reason_prefix }}-{{ talos_cluster }}-exec-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  when: talos_operate_refresh_active | bool
  changed_when: true

# NetBird rewrite: the forced re-render restores the placeholder, so re-apply the
# day-0 module plane via include_role.
- name: Rewrite NetBird setup-key placeholder in the re-rendered cluster patch
  ansible.builtin.include_role:
    name: talos_render
    tasks_from: netbird_setup_key
  when: talos_operate_refresh_active | bool

- name: Refresh per-node schematic IDs from the Image Factory
  # Reuses the day-0 schematic plane (hash changes re-upload; .id/.sha256 persist).
  ansible.builtin.include_role:
    name: talos_render
    tasks_from: schematic
    public: true
  vars:
    talos_render_schematic_factory_url: "{{ talos_operate_schematic_factory_url }}"
    talos_render_schematic_factory_timeout: "{{ talos_operate_schematic_factory_timeout }}"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    loop_var: node
    label: "{{ node.name }}"
  when: talos_operate_refresh_active | bool

- name: Read per-node schematic IDs for installer image rewrite
  # Offline fallback when no upload ran; upload-fresh IDs win.
  ansible.builtin.slurp:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/schematic-{{ item.name }}.id"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  check_mode: false
  failed_when: false
  register: talos_operate_refresh_schematic
  when: talos_operate_refresh_active | bool

- name: Map node names to schematic IDs for refresh
  ansible.builtin.set_fact:
    talos_operate_refresh_ids: >-
      {{ (talos_operate_refresh_ids | default({}))
      | combine({item.item.name: (item.content | default('', true) | b64decode | trim)}) }}
  loop: "{{ talos_operate_refresh_schematic.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - talos_operate_refresh_active | bool
    - item.content is defined

- name: Prefer schematic-plane IDs refreshed this run over file reads
  ansible.builtin.set_fact:
    talos_operate_refresh_ids: "{{ (talos_operate_refresh_ids | default({})) | combine(talos_render_schematic_ids | default({})) }}"
  when: talos_operate_refresh_active | bool

- name: Assert schematic IDs resolve for refresh
  # A miss means build/<cluster> lost its .id files — re-run day-0.
  ansible.builtin.assert:
    that:
      - (talos_operate_refresh_ids | default({})).get(item.name, '') is match(talos_schematic_id_pattern)
    fail_msg: >-
      Missing schematic ID for {{ item.name }}
      (build/{{ talos_cluster }}/schematic-{{ item.name }}.id); re-run day-0.
    success_msg: "Schematic ID resolves for {{ item.name }}."
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: talos_operate_refresh_active | bool

- name: Rewrite installer image in re-rendered node patches
  ansible.builtin.replace:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml"
    regexp: 'factory\.talos\.dev/metal-installer/(?:PLACEHOLDER_SCHEMATIC_ID|[0-9a-f]{64})'
    replace: "factory.talos.dev/metal-installer/{{ (talos_operate_refresh_ids | default({})).get(item.name, '') }}"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - talos_operate_refresh_active | bool
    - (talos_operate_refresh_ids | default({})).get(item.name, '') | length > 0

- name: Force wipe false in re-rendered node patches
  # Day-2 never bootstraps (RUNBOOK §1.5): ALWAYS force wipe:false in build/
  # regardless of talos_bootstrap_fresh_install — belt-and-braces alongside the
  # safe-default render behavior, BEFORE `gen config` bakes machine configs.
  ansible.builtin.replace:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml"
    regexp: '(?m)^(\s*wipe:\s*)true\s*$'
    replace: '\1false'
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: talos_operate_refresh_active | bool

- name: Slurp re-rendered node patches for the wipe gate
  ansible.builtin.slurp:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  check_mode: false
  failed_when: false
  register: talos_operate_refresh_wipe
  when: talos_operate_refresh_active | bool

- name: Fail when a re-rendered node patch still carries wipe true
  # Fails closed before `gen config`: a later maintenance-boot must never see
  # `wipe: true`. Day-2 ignores the fresh-install flag entirely.
  ansible.builtin.assert:
    that:
      - not ((item.content | default('', true) | b64decode | trim) is search('(?m)^\s*wipe:\s*true\s*$'))
    fail_msg: >-
      Re-rendered nodes-{{ item.item.name }}-patches.yml still contains
      `wipe: true` — day-2 refuses to bake machine configs that could wipe an
      installed node. Delete
      build/{{ talos_cluster }}/nodes-{{ item.item.name }}-patches.yml and
      re-run day-2 -e refresh_secrets=true (or -e reapply_configs=true).
    success_msg: "Re-rendered node patch for {{ item.item.name }} carries wipe:false."
  loop: "{{ talos_operate_refresh_wipe.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - talos_operate_refresh_active | bool
    - not ansible_check_mode

- name: Assert node roles map to a Talos machine type
  # Unknown role: strings fail here with the node name + valid roles instead
  # of a raw Jinja KeyError inside the gen config invocation below.
  ansible.builtin.assert:
    that:
      - item.role in talos_machine_roles
    fail_msg: >-
      Node {{ item.name }} has unknown role '{{ item.role }}'
      (valid: {{ talos_machine_roles.keys() | join(', ') }}). Fix role in
      group_vars/all.yml, then re-run day-2.
    success_msg: "Node {{ item.name }} role {{ item.role }} maps to {{ talos_machine_roles[item.role] }}."
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: talos_operate_refresh_active | bool

- name: Regenerate per-node machine configs from refreshed patches
  ansible.builtin.command:
    cmd: >-
      {{ talos_operate_talosctl }} gen config {{ talos_cluster }}
      {{ talos_clusters[talos_cluster].endpoint }}
      --with-secrets {{ talos_build_dir }}/{{ talos_cluster }}/secrets.bundle.yml
      --config-patch @{{ playbook_dir }}/../../clusters/_base/patches.yml
      --config-patch @{{ talos_build_dir }}/{{ talos_cluster }}/patches.yml
      {{ '--config-patch-control-plane' if talos_machine_roles[item.role] == 'controlplane' else '--config-patch-worker' }}
      @{{ talos_build_dir }}/{{ talos_cluster }}/nodes-{{ item.name }}-patches.yml
      --talos-version {{ talos_version }}
      --install-image
      factory.talos.dev/metal-installer/{{ (talos_operate_refresh_ids | default({})).get(item.name, 'pending-schematic-upload') }}:{{ talos_version }}
      -t {{ talos_machine_roles[item.role] }}
      --force
      -o {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: talos_operate_refresh_active | bool
  changed_when: true

- name: Lock down regenerated per-node config permissions
  ansible.builtin.file:
    path: "{{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml"
    mode: "0600"
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: talos_operate_refresh_active | bool

- name: Validate regenerated per-node configs
  ansible.builtin.command:
    cmd: >-
      {{ talos_operate_talosctl }} validate
      -c {{ talos_build_dir }}/{{ talos_cluster }}/nodes/{{ item.name }}/{{ talos_machine_roles[item.role] }}.yaml
      -m metal
  loop: "{{ talos_clusters[talos_cluster].nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: talos_operate_refresh_active | bool
  changed_when: false
