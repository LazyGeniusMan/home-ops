---
# Day-2 operate: health, etcd status, optional upgrade + config patch.
- name: Check pass-cli session is authenticated
  # Ansible never logs in. check_mode:false so --check still validates auth.
  ansible.builtin.command:
    cmd: pass-cli info -o json
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_operate_pass_agent_reason_prefix }}-{{ talos_cluster }}-authcheck-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  check_mode: false
  changed_when: false
  failed_when: false
  register: talos_operate_pass_session
  no_log: true

- name: Fail when pass-cli has no authenticated session
  ansible.builtin.assert:
    that:
      - talos_operate_pass_session.rc == 0
      - talos_operate_pass_session.stdout | from_json is mapping
    fail_msg: >-
      No authenticated pass-cli session. Run `pass-cli login` before
      operating the cluster, then re-run the play.
    success_msg: "pass-cli session authenticated."

- name: Check cluster health
  # Always runs; skip with `-e skip_health=true` (RUNBOOK §3.1). failed_when is
  # false so the report task prints output before the gate below fails the play.
  ansible.builtin.command:
    cmd: >-
      {{ talos_operate_talosctl }} health
      --talosconfig {{ talos_talosconfig }}
      --control-plane-nodes {{ talos_clusters[talos_cluster].nodes
      | selectattr('role', 'equalto', 'controlplane') | map(attribute='ip') | join(',') }}
      --init-node {{ talos_clusters[talos_cluster].nodes[0].ip }}
  changed_when: false
  failed_when: false
  register: talos_operate_health
  when: not (skip_health | default(false) | bool)

- name: Report cluster health
  ansible.builtin.debug:
    msg: "{{ talos_operate_health.stdout_lines | default(['health check skipped or unavailable']) }}"

- name: Gate mutating planes on a healthy cluster
  # Advisory health is not enough: regen, re-apply, and upgrades only run when
  # `talosctl health` returned rc==0 this run. Bypass explicitly with
  # `-e skip_health=true` (you own the risk — RUNBOOK §3.1).
  ansible.builtin.assert:
    that:
      - skip_health | default(false) | bool or talos_operate_health.rc is defined and talos_operate_health.rc == 0
    fail_msg: >-
      Cluster health check failed (rc={{ talos_operate_health.rc | default('n/a') }})
      — refusing regen, re-apply, and upgrades. Fix the cluster first, then
      re-run; or bypass explicitly with -e skip_health=true.
    success_msg: "Cluster health gate passed (or explicitly skipped)."
  when: talos_operate_regen_talosconfig | bool
    or talos_operate_regen_kubeconfig | bool
    or talos_operate_reapply_configs | bool
    or talos_operate_refresh_secrets | bool
    or talos_operate_upgrade_image | length > 0
    or talos_operate_upgrade_talos_version | length > 0
    or talos_operate_kubernetes_version | length > 0
    or talos_operate_pat_apply | bool

- name: Show etcd members
  ansible.builtin.command:
    cmd: >-
      {{ talos_operate_talosctl }} etcd members
      --talosconfig {{ talos_talosconfig }}
      -n {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -e {{ talos_clusters[talos_cluster].nodes[0].ip }}
  changed_when: false
  failed_when: false
  register: talos_operate_etcd

- name: Report etcd members
  ansible.builtin.debug:
    msg: "{{ talos_operate_etcd.stdout_lines | default(['etcd members unavailable']) }}"

# Order (RUNBOOK §3): regen → refresh → re-apply → Talos upgrade → k8s upgrade.
# kubernetes_version is opt-in -e only (never defaulted from the group pin).
- name: Regenerate talosconfig or kubeconfig on request
  ansible.builtin.include_tasks: regen.yml

- name: Restore missing cluster files from Proton Pass on request
  # Fresh clones start with an empty build/<cluster>/: pull
  # secrets.bundle.yml, talosconfig, and kubeconfig from the cluster vault
  # `talos` item when the local copy is absent (local files win). Opt-in
  # -e restore_secrets=true only — default false keeps day-2 read-only.
  # Local-only pull, so it stays outside the cluster health gate above.
  ansible.builtin.include_role:
    name: talos_bootstrap
    tasks_from: pass_restore
  vars:
    talos_bootstrap_restore_reason_prefix: "{{ talos_operate_pass_agent_reason_prefix }}"
  when: talos_operate_restore_secrets | bool

- name: Refresh rendered secrets from the vault on request
  ansible.builtin.include_tasks: refresh.yml

- name: Apply ESO PAT Secret on request (post-Flux)
  ansible.builtin.include_tasks: pat_secret.yml

- name: Re-apply rendered machine configs on request
  ansible.builtin.include_tasks: reapply.yml

- name: Upgrade Talos per node on request
  ansible.builtin.include_tasks: upgrade.yml

- name: Upgrade Kubernetes on version drift
  ansible.builtin.include_tasks: kubernetes.yml
