---
# Day-2 operate: health, etcd status, optional upgrade + config patch.
# Auth comes FIRST, unconditionally: re-apply inject and the PAT renew path
# both need a live pass-cli session, so failing fast here beats running
# health/etcd probes and only then discovering pass-cli cannot run. Cheap
# no-change probe (check_mode:false, changed_when:false, no_log:true).
- name: Assert Proton Pass PAT env var is set
  # Fail fast before any talosctl call: the PAT arrives via env only (never
  # files). Always checked (even for default read-only runs) since it is a
  # cheap probe and re-apply/renew need it. check_mode has no effect on
  # assert, so --check still validates.
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', proton_pass_pat_env) | length > 0
    fail_msg: >-
      {{ proton_pass_pat_env }} is not set or empty. Export
      {{ proton_pass_pat_env }}=pst_... and run `pass-cli login` before
      operating the cluster, then re-run the play.
    success_msg: "{{ proton_pass_pat_env }} is set."

- name: Check pass-cli session is authenticated
  # Ansible NEVER logs in: probes the existing session via
  # `pass-cli info -o json` (rc==0 + JSON mapping stdout = logged in;
  # logged-out gives rc=1 + a non-JSON error). check_mode:false so
  # --check still validates auth. On failure, export
  # PROTON_PASS_PERSONAL_ACCESS_TOKEN=pst_... and run `pass-cli login`,
  # then re-run the play.
  ansible.builtin.command:
    cmd: pass-cli info -o json
  environment:
    PROTON_PASS_AGENT_REASON: >-
      {{ talos_operate_pass_agent_reason_prefix }}-{{ talos_cluster }}-authcheck-{{
        lookup('community.general.random_string', length=16,
        override_all='0123456789abcdef') }}
  check_mode: false
  changed_when: false
  failed_when: false
  register: talos_operate_pass_session
  no_log: true

- name: Fail when pass-cli has no authenticated session
  ansible.builtin.assert:
    that:
      - talos_operate_pass_session.rc == 0
      - talos_operate_pass_session.stdout | from_json is mapping
    fail_msg: >-
      No authenticated pass-cli session. Export
      {{ proton_pass_pat_env }}=pst_... and run `pass-cli login` before
      operating the cluster, then re-run the play.
    success_msg: "pass-cli session authenticated."

- name: Check cluster health
  # Always runs on every invocation; skip explicitly instead (see RUNBOOK
  # §3.1):
  #   ansible-playbook playbooks/day2.yml -i localhost, -e talos_cluster=<c> -e skip_health=true
  ansible.builtin.command:
    cmd: >-
      {{ talos_operate_talosctl }} health
      --talosconfig {{ talos_talosconfig }}
      --control-plane-nodes {{ talos_clusters[talos_cluster].nodes | selectattr('role', 'equalto', 'controlplane') | map(attribute='ip') | join(',') }}
      --init-node {{ talos_clusters[talos_cluster].nodes[0].ip }}
  changed_when: false
  failed_when: false
  register: talos_operate_health
  when: not (skip_health | default(false) | bool)

- name: Report cluster health
  ansible.builtin.debug:
    msg: "{{ talos_operate_health.stdout_lines | default(['health check skipped or unavailable']) }}"

- name: Show etcd members
  ansible.builtin.command:
    cmd: >-
      {{ talos_operate_talosctl }} etcd members
      --talosconfig {{ talos_talosconfig }}
      -n {{ talos_clusters[talos_cluster].nodes[0].ip }}
      -e {{ talos_clusters[talos_cluster].nodes[0].ip }}
  changed_when: false
  failed_when: false
  register: talos_operate_etcd

- name: Report etcd members
  ansible.builtin.debug:
    msg: "{{ talos_operate_etcd.stdout_lines | default(['etcd members unavailable']) }}"

# Execution order (documented in RUNBOOK §3): config-plane first, version
# upgrades last — regen talosconfig/kubeconfig → re-apply machine configs →
# Talos upgrade per node → Kubernetes upgrade. Talos always precedes k8s.
- name: Regenerate talosconfig or kubeconfig on request
  ansible.builtin.include_tasks: regen.yml

- name: Apply ESO PAT Secret on request (post-Flux)
  ansible.builtin.include_tasks: pat_secret.yml

- name: Re-apply rendered machine configs on request
  ansible.builtin.include_tasks: reapply.yml

- name: Upgrade Talos per node on request
  ansible.builtin.include_tasks: upgrade.yml

- name: Upgrade Kubernetes on version drift
  ansible.builtin.include_tasks: kubernetes.yml
