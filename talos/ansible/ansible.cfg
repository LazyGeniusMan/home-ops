[defaults]
roles_path = roles
# Local-only: Talos has no SSH — plays run on localhost, nodes via talosctl API.
# host_key_checking is scoped to this local-only tree: no SSH transport exists
# here (all node contact is talosctl over the Talos API), so there are no host
# keys to check. Do not copy this setting into SSH-based inventories.
transport = local
host_key_checking = false
display_skipped_hosts = false
stdout_callback = default
bin_ansible_callbacks = false

[diff]
always = true
context = 3
