---
# Shared vars: `pass-cli login` gates auth; the PAT value renders from the
# vault via `pass-cli inject`, never the shell.
#
# Local-only: playbooks run on localhost and reach nodes via `talosctl` over
# the Talos API (no SSH inventory). `talos_clusters` is the single source of
# truth for node IPs (data for `talosctl -n/-e` flags only).
# Shared PAT filename for build/<cluster>/ (0600, gitignored): day-0
# renders it, day-2 reads/renews it.
talos_pat_filename: proton-pass-pat
talos_version: v1.15.0-alpha.0
# Pinned Kubernetes version: day-0 passes no --kubernetes-version flag, so
# this records the kubelet image version day-0 renders. Day-2 runs
# upgrade-k8s only on drift vs the rendered machine configs.
kubernetes_version: 1.37.0
talos_build_dir: "{{ playbook_dir }}/../build"
# Inventory role -> Talos machine type for `gen config -t` and output files.
talos_machine_roles:
  controlplane: controlplane
  worker: worker
# Explicit talosctl auth: bootstrap/operate pass this via --talosconfig
# instead of relying on an ambient TALOSCONFIG or ~/.talos/config.
talos_talosconfig: "{{ talos_build_dir }}/{{ talos_cluster }}/talosconfig"
# NetBird wiring (RUNBOOK §1.0b): vault PAT reaches Terraform only as
# NB_PAT env.
# The reusable setup key leaves only via the sensitive talos_setup_key output
# into __TALOS_NETBIRD_SETUP_KEY__ (0600, no_log, never committed). Root staged
# at build/<cluster>/netbird-tf/ with persistent state (re-applies upsert).
talos_netbird_terraform_dir: "{{ playbook_dir }}/../build/{{ talos_cluster }}/netbird-tf"
talos_netbird_placeholder: __TALOS_NETBIRD_SETUP_KEY__
talos_netbird_setup_key_pattern: "^[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}$"
# Render-role defaults do NOT load on day-2: the plane reads only talos_netbird_* / talos_* shared vars.
talos_netbird_tofu: tofu
talos_netbird_pat_item: talos
talos_netbird_pat_field: netbird-pat
talos_netbird_pass_agent_reason_prefix: talos-netbird
talos_clusters:
  acme-prd-bdo1-talos-apps-01:
    vault: acme-prd-bdo1-talos-apps-01
    endpoint: https://192.168.1.198:6443
    nodes:
      - name: bdo-r01-cp-001
        ip: 192.168.1.101
        role: controlplane
  acme-dev-bdo1-talos-apps-01:
    vault: acme-dev-bdo1-talos-apps-01
    endpoint: https://192.168.1.248:6443
    nodes:
      - name: bdo-r01-cp-002
        ip: 192.168.1.201
        role: controlplane
