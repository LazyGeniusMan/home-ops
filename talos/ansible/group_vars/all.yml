---
# Shared vars: vault login gates auth; renders land in build/<cluster>/ (gitignored).
# Local-only: playbooks run on localhost, nodes via `talosctl` (no SSH inventory).
talos_pat_filename: proton-pass-pat
# Talos v1.15.0-alpha.0 pins nfs-server (>=1.15); re-check stable each release.
talos_version: v1.15.0-alpha.0
# Record-only; day-2 uses -e kubernetes_version opt-in.
talos_kubernetes_pinned_version: 1.37.0
# Image Factory endpoint (single source for render + re-apply schematic planes).
talos_schematic_factory_url: https://factory.talos.dev/schematics
# Schematic IDs are 64 lowercase hex; anything else fails fast.
talos_schematic_id_pattern: "^[0-9a-f]{64}$"
# Bootstrap-only wipe intent (RUNBOOK §1.5): default false = safe (day-0 rewrites
# wipe to false in build/; day-2 always forces wipe:false). Pass
# -e talos_bootstrap_fresh_install=true on day-0 AND day-1 for a new node only.
talos_bootstrap_fresh_install: false
talos_build_dir: "{{ playbook_dir }}/../build"
# Inventory role -> `gen config -t` machine type.
talos_machine_roles:
  controlplane: controlplane
  worker: worker
# Explicit talosctl auth (never ambient TALOSCONFIG).
talos_talosconfig: "{{ talos_build_dir }}/{{ talos_cluster }}/talosconfig"
# NetBird wiring (RUNBOOK §1.0b): vault PAT reaches Terraform only as NB_PAT env;
# the setup key leaves only via the sensitive talos_setup_key output.
# Root staged at build/<cluster>/netbird-tf/ with persistent state.
talos_netbird_terraform_dir: "{{ playbook_dir }}/../build/{{ talos_cluster }}/netbird-tf"
talos_netbird_placeholder: __TALOS_NETBIRD_SETUP_KEY__
talos_netbird_setup_key_pattern: "^[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}$"
# Day-2 netbird/schematic planes run via include_role: talos_render (shared/group
# talos_* vars plus the explicit per-call overrides in refresh.yml).
talos_netbird_tofu: tofu
talos_netbird_pat_item: talos
talos_netbird_pat_field: netbird-pat
talos_netbird_pass_agent_reason_prefix: talos-netbird
talos_clusters:
  acme-prd-bdo1-talos-apps-01:
    vault: acme-prd-bdo1-talos-apps-01
    endpoint: https://192.168.1.198:6443
    nodes:
      - name: bdo-r01-cp-001
        ip: 192.168.1.101
        role: controlplane
  acme-dev-bdo1-talos-apps-01:
    vault: acme-dev-bdo1-talos-apps-01
    endpoint: https://192.168.1.248:6443
    nodes:
      - name: bdo-r01-cp-002
        ip: 192.168.1.201
        role: controlplane
