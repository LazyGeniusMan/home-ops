---
# Shared vars: pass-cli session (via `pass-cli login`) gates auth; the PAT
# value is rendered from the vault via `pass-cli inject`, never the shell.
#
# Local-only execution: playbooks run on localhost (connection: local) and
# reach nodes via `talosctl` over the Talos API — there is no SSH inventory.
# `talos_clusters` is the single source of truth for node IPs; they are data
# for `talosctl -n/-e` flags only, never Ansible connection targets.
# Shared PAT filename for build/<cluster>/ (0600, gitignored via
# ansible/build/): day-0 renders it via pass-cli inject, day-2 reads/renews it.
talos_pat_filename: proton-pass-pat
talos_version: v1.15.0-alpha.0
# Pinned Kubernetes version: day-0 passes no --kubernetes-version flag, so
# gen config uses the talosctl default; 1.37.0 is what day-0 last rendered
# (confirmed in the rendered kubelet image). Day-2 compares this desired
# version against the kubelet image recorded in the rendered machine configs
# and runs upgrade-k8s only on mismatch. Keep in sync with what day-0 renders.
kubernetes_version: 1.37.0
talos_build_dir: "{{ playbook_dir }}/../build"
# Inventory node role -> Talos machine type. Inventory says `controlplane`;
# `talosctl gen config -t` and per-node output files say `controlplane`.
talos_machine_roles:
  controlplane: controlplane
  worker: worker
# Explicit talosctl auth: bootstrap/operate pass this via --talosconfig
# instead of relying on an ambient TALOSCONFIG or ~/.talos/config.
talos_talosconfig: "{{ talos_build_dir }}/{{ talos_cluster }}/talosconfig"
talos_clusters:
  acme-prd-bdo1-talos-apps-01:
    vault: acme-prd-bdo1-talos-apps-01
    endpoint: https://192.168.1.198:6443
    nodes:
      - name: bdo-r01-cp-001
        ip: 192.168.1.101
        role: controlplane
  acme-dev-bdo1-talos-apps-01:
    vault: acme-dev-bdo1-talos-apps-01
    endpoint: https://192.168.1.248:6443
    nodes:
      - name: bdo-r01-cp-002
        ip: 192.168.1.201
        role: controlplane
