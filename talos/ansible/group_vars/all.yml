---
# Shared vars: pass-cli session (via `pass-cli login`) gates auth; the PAT
# value is rendered from the vault via `pass-cli inject`, never the shell.
#
# Local-only execution: playbooks run on localhost (connection: local) and
# reach nodes via `talosctl` over the Talos API — there is no SSH inventory.
# `talos_clusters` is the single source of truth for node IPs; they are data
# for `talosctl -n/-e` flags only, never Ansible connection targets.
# Shared PAT filename for build/<cluster>/ (0600, gitignored via
# ansible/build/): day-0 renders it via pass-cli inject, day-2 reads/renews it.
talos_pat_filename: proton-pass-pat
talos_version: v1.15.0-alpha.0
# Pinned Kubernetes version: day-0 passes no --kubernetes-version flag, so
# gen config uses the talosctl default; 1.37.0 is what day-0 last rendered
# (confirmed in the rendered kubelet image). Day-2 compares this desired
# version against the kubelet image recorded in the rendered machine configs
# and runs upgrade-k8s only on mismatch. Keep in sync with what day-0 renders.
kubernetes_version: 1.37.0
talos_build_dir: "{{ playbook_dir }}/../build"
# Inventory node role -> Talos machine type. Inventory says `controlplane`;
# `talosctl gen config -t` and per-node output files say `controlplane`.
talos_machine_roles:
  controlplane: controlplane
  worker: worker
# Explicit talosctl auth: bootstrap/operate pass this via --talosconfig
# instead of relying on an ambient TALOSCONFIG or ~/.talos/config.
talos_talosconfig: "{{ talos_build_dir }}/{{ talos_cluster }}/talosconfig"
# NetBird wiring (PAT-driven, Terraform-minted setup key — see RUNBOOK §1.0b):
# - NetBird PAT comes from Proton Pass (magnet
#   pass://<cluster-vault>/talos/netbird-pat) and is resolved locally via
#   `pass-cli item view` in the talos_netbird plane — it only ever reaches
#   Terraform as the NB_PAT env var on the `community.general.terraform`
#   module call (never -var, never written to disk).
# - The reusable setup key is minted by the dedicated Talos root
#   (roles/talos_render/files/netbird/, staged per cluster at
#   build/<cluster>/netbird-tf/ with persistent local state — NOT deleted
#   between runs, so re-applies upsert): `netbird_setup_key.talos`
#   (type reusable, expiry_seconds 0 = never expires, usage_limit 0 =
#   unlimited, auto_groups [<cluster>-nodes]). The plaintext leaves ONLY via
#   the module's sensitive `talos_setup_key` output
#   (outputs.talos_setup_key.value) and is rewritten into the rendered
#   cluster patch placeholder __TALOS_NETBIRD_SETUP_KEY__ (0600, gitignored
#   build/<cluster>/), never logged (no_log: true everywhere on the plane)
#   and never committed. Rotate by replacing the TF key resource (plan first;
#   prevent_destroy fails closed) then re-running day-0 (rm
#   build/<c>/patches.yml first so the inject guard re-renders) or day-2
#   -e reapply_configs=true.
# - The setup key never lives in vault. There is NO outputs_secret fallback:
#   the Flux consumer root is proxy-only and exposes no talos_setup_key, so
#   the module-driven plane is the only source.
# - Per-cluster values come from the talos_clusters map below (cluster_name
#   = talos_cluster, vault = per-cluster vault); LB IP is NOT needed here
#   (proxy-only concern owned by the Flux consumer).
talos_netbird_terraform_dir: "{{ playbook_dir }}/../build/{{ talos_cluster }}/netbird-tf"
talos_netbird_placeholder: __TALOS_NETBIRD_SETUP_KEY__
talos_netbird_setup_key_pattern: "^[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}$"
# Binaries + audit prefix for the NetBird plane (shared by the day-0 render
# include and the day-2 re-apply include_role — render-role defaults are NOT
# loaded on day-2, so the plane only reads talos_netbird_* / talos_* shared
# vars). PAT vault field: `netbird-pat` on the `talos` item in the OWN
# cluster vault (pass://<cluster-vault>/talos/netbird-pat).
talos_netbird_tofu: tofu
talos_netbird_pat_item: talos
talos_netbird_pat_field: netbird-pat
talos_netbird_pass_agent_reason_prefix: talos-netbird
talos_clusters:
  acme-prd-bdo1-talos-apps-01:
    vault: acme-prd-bdo1-talos-apps-01
    endpoint: https://192.168.1.198:6443
    nodes:
      - name: bdo-r01-cp-001
        ip: 192.168.1.101
        role: controlplane
  acme-dev-bdo1-talos-apps-01:
    vault: acme-dev-bdo1-talos-apps-01
    endpoint: https://192.168.1.248:6443
    nodes:
      - name: bdo-r01-cp-002
        ip: 192.168.1.201
        role: controlplane
