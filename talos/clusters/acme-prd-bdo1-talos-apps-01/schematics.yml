# Cluster-shared Image Factory schematic (Talos v1.14).
# Bare `siderolabs/<name>` entries only — the factory pins extension versions
# to the Talos release. Per-node schematics.yml files are AUTHORITATIVE for
# each node's installer image; this file documents the extension(s) shared by
# all nodes in acme-prd-bdo1-talos-apps-01.
# Upload: curl -X POST --data-binary @schematics.yml https://factory.talos.dev/schematics
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/netbird # overlay mgmt plane (contrib; verified in extensions release-1.14 README)
