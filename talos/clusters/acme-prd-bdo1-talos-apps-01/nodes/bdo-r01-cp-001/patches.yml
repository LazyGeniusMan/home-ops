# Node patch: bdo-r01-cp-001 — acme-prd-bdo1-talos-apps-01 (Talos v1.15.0-alpha.0).
# Applied last. Bare metal: static IP 192.168.1.101/24 on enp45s0 (RTL8125),
# install disk /dev/nvme0n1 (512 GiB NVMe), data disk /dev/sda.
# Pre-flight: `talosctl get links --insecure -n 192.168.1.101`.
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: bdo-r01-cp-001
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp45s0
addresses:
  - address: 192.168.1.101/24
routes:
  - gateway: 192.168.1.1
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/PLACEHOLDER_SCHEMATIC_ID:v1.15.0-alpha.0 # set from schematic upload
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
  wipe: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  grow: false
  maxSize: -400GiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: nvme-data
provisioning:
  diskSelector:
    match: system_disk
  grow: true
  maxSize: 400GiB
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: sata-data
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  grow: true
  minSize: 64GiB
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  # 1. SunRPC Slot Tables (Concurrency depth per connection)
  sunrpc.tcp_slot_table_entries: "64"
  sunrpc.tcp_max_slot_table_entries: "64"

  # 2. Network Core Socket Buffers (Optimized for 10GbE+)
  net.core.rmem_max: "33554432"          # 32MB
  net.core.wmem_max: "33554432"          # 32MB
  net.core.rmem_default: "1048576"
  net.core.wmem_default: "1048576"
  net.core.netdev_max_backlog: "10000"
  net.core.somaxconn: "4096"

  # 3. TCP Memory Buffer Limits (Min, Default, Max)
  net.ipv4.tcp_rmem: "4096 87380 33554432"
  net.ipv4.tcp_wmem: "4096 65536 33554432"
  net.ipv4.tcp_slow_start_after_idle: "0"

  # 4. Virtual Memory Writeback Flushing
  vm.dirty_background_ratio: "5"
  vm.dirty_ratio: "10"
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nfsd
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: nfs.conf
mode: 0o644
contents: |
  [nfsd]
  threads = 64

  [mountd]
  manage-gids = y
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: nfs-server
environment:
  - RPCNFSDCOUNT=32
---
# NFS stack: exports the nvme-data + sata-data volumes above
# (UserVolumeConfig <name> mounts at /var/mnt/<name>); no dedicated volume.
apiVersion: v1alpha1
kind: EtcFileConfig
name: exports
mode: 0o644
contents: |
  /var 192.168.1.0/24(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534,no_wdelay,fsid=0)
  /var/mnt/nvme-data 192.168.1.0/24(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534,no_wdelay,fsid=1)
  /var/mnt/sata-data 192.168.1.0/24(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534,no_wdelay,fsid=2)
# LAN-only 192.168.1.0/24; default root_squash kept (no no_root_squash).
# fsid values mark the NFSv4 exports (pseudo-root fsid=0).
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: netconfig
mode: 0o644
contents: |
  udp        tpi_clts      v     inet     udp     -       -
  tcp        tpi_cots_ord  v     inet     tcp     -       -
# libtirpc IPv4 server table (nfs-server README); service path-deps on both
# /etc/exports and /etc/netconfig — it will not start without them.
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
# No env label here (dev-only); prd selects on tier + zone.
labels:
  topology.kubernetes.io/zone: bdo1
  node-role.acme.io/tier: apps
