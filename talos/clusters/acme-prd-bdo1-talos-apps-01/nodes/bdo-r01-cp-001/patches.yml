# Node patch: bdo-r01-cp-001. Bare metal: 192.168.1.101/24 on enp45s0,
# install /dev/nvme0n1 (512 GiB NVMe), data /dev/sda.
# Volume math on the 512 GiB system disk: EPHEMERAL maxSize -400GiB, nvme-data maxSize 400GiB.
# sata-data (min 64 GiB, grow) takes
# /dev/sda (size unrecorded — verify with
# `talosctl get disks --insecure -n 192.168.1.101` and record it here before
# first apply; never guess).
# Pre-flight (required): talosctl get links/disks --insecure -n 192.168.1.101.
# NFS tuning is bare-metal sized (64 slots/threads; dev runs 32).
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: bdo-r01-cp-001
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp45s0
addresses:
  - address: 192.168.1.101/24
routes:
  - gateway: 192.168.1.1
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  # Version tracks talos_version in group_vars/all.yml.
  image: factory.talos.dev/metal-installer/PLACEHOLDER_SCHEMATIC_ID:v1.15.0-alpha.0
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
  # Bootstrap-only: wipe clears a reused OS disk on first install. Source
  # stays true; automation forces wipe:false in build/ unless day-0 rendered
  # with -e talos_bootstrap_fresh_install=true (RUNBOOK §1.5). Never edit the
  # source per install — later renders default safe on their own.
  wipe: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  grow: false
  maxSize: -400GiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: nvme-data
provisioning:
  diskSelector:
    match: system_disk
  grow: true
  maxSize: 400GiB
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: sata-data
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  grow: true
  minSize: 64GiB
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  sunrpc.tcp_slot_table_entries: "64"
  sunrpc.tcp_max_slot_table_entries: "64"
  net.core.rmem_max: "33554432"
  net.core.wmem_max: "33554432"
  net.core.rmem_default: "1048576"
  net.core.wmem_default: "1048576"
  net.core.netdev_max_backlog: "10000"
  net.core.somaxconn: "4096"
  net.ipv4.tcp_rmem: "4096 87380 33554432"
  net.ipv4.tcp_wmem: "4096 65536 33554432"
  net.ipv4.tcp_slow_start_after_idle: "0"
  vm.dirty_background_ratio: "5"
  vm.dirty_ratio: "10"
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nfsd
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: nfs.conf
mode: 0o644
contents: |
  [nfsd]
  threads = 64

  [mountd]
  manage-gids = y
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: nfs-server
environment:
  - RPCNFSDCOUNT=64 # matches [nfsd] threads above (bare-metal size; dev runs 32)
---
# NFS exports for nvme-data + sata-data (<name> mounts at /var/mnt/<name>).
# Data volumes only (no bare /var root); LAN-only 192.168.1.0/24, all_squash.
# The /24 CIDR is accepted: access is limited by the VLAN.
apiVersion: v1alpha1
kind: EtcFileConfig
name: exports
mode: 0o644
contents: |
  /var/mnt/nvme-data 192.168.1.0/24(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534,no_wdelay,fsid=1)
  /var/mnt/sata-data 192.168.1.0/24(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534,no_wdelay,fsid=2)
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: netconfig
mode: 0o644
contents: |
  udp        tpi_clts      v     inet     udp     -       -
  tcp        tpi_cots_ord  v     inet     tcp     -       -
# libtirpc IPv4 server table.
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
labels:
  topology.kubernetes.io/zone: bdo1
  node-role.acme.io/tier: apps
  node-role.acme.io/env: prd
