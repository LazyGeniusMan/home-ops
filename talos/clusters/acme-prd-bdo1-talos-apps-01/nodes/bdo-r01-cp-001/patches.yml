# Node patch: bdo-r01-cp-001 — acme-prd-bdo1-talos-apps-01 (Talos v1.14).
# Applied last: --config-patch @nodes/bdo-r01-cp-001/patches.yml
# Static IP 192.168.1.101/24 on the RTL8125 link (systemd predictable name
# for PCI 0000:2d:00.0 is enp45s0). Manual pre-flight:
# `talosctl get links --insecure -n 192.168.1.101` before first apply.
# Field evidence (config.schema.json + reference/configuration):
#   HostnameConfig{hostname}, LinkConfig{name, addresses[]:{address}, routes[]:{gateway}},
#   UnattendedInstallConfig{installer.image, provisioning.diskSelector.match, wipe},
#   UserVolumeConfig{name, provisioning.diskSelector.match/filesystem.type},
#   KubeNodeConfig{nodeIP.validSubnets, labels}.
# Disk CEL: disk.dev_path / disk.transport (sata evidenced in
# disk-management/layout.mdx) / !system_disk (system.mdx:46,83).
# No sata-data volume: the host has no SATA disk (AHCI controller 0000:00:17.0
# is vfio-pci passthrough — see node schematics.yml), so a
# disk.dev_path == "/dev/sda" selector would never match and the
# UserVolumeConfig would block provisioning waiting for a disk.
# Re-add a sata-data UserVolumeConfig (+ its /var/mnt/sata-data exports line)
# only when a SATA disk is physically present.
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: bdo-r01-cp-001
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp45s0
addresses:
  - address: 192.168.1.101/24
routes:
  - gateway: 192.168.1.1
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/PLACEHOLDER_SCHEMATIC_ID:v1.14.0 # set from schematic upload
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
  wipe: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  grow: false
  maxSize: 64GiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: nvme-data
provisioning:
  diskSelector:
    match: system_disk
filesystem:
  type: xfs
---
# NFS server stack (nfs-server README §Requirements + Configuration).
# Exports the existing user volume — no dedicated nfs volume.
# UserVolumeConfig <name> mounts at /var/mnt/<name>, so this path resolves
# against the nvme-data volume above.
apiVersion: v1alpha1
kind: EtcFileConfig
name: exports
mode: 0o644
contents: |
  /var/mnt/nvme-data 192.168.1.0/24(rw,sync,no_subtree_check,fsid=0,crossmnt)
# LAN-only 192.168.1.0/24; default root_squash kept (no no_root_squash).
# fsid=0 marks the NFSv4 pseudo-root, crossmnt kept so a second export can
# attach later. nvme-data is the only volume — no sata-data (host has no
# SATA disk; AHCI is vfio-pci passthrough). Add its export line only with a
# sata-data UserVolumeConfig when that disk appears.
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: netconfig
mode: 0o644
contents: |
  udp        tpi_clts      v     inet     udp     -       -
  tcp        tpi_cots_ord  v     inet     tcp     -       -
# libtirpc IPv4 server table (nfs-server README); service path-deps on both
# /etc/exports and /etc/netconfig — it will not start without them.
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
# Note: no node-role.acme.io/env label here — only the dev node carries
# env: dev. Prd workloads select on tier: apps + zone: bdo1.
labels:
  topology.kubernetes.io/zone: bdo1
  node-role.acme.io/tier: apps
