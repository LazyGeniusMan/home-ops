# Node patch: bdo-r01-cp-001 — acme-prd-bdo1-talos-apps-01 (Talos v1.14).
# Applied last: --config-patch @nodes/bdo-r01-cp-001/patches.yml
# Static IP 192.168.1.101/24 on the RTL8125 link (systemd predictable name
# for PCI 0000:2d:00.0 is enp45s0). Manual pre-flight:
# `talosctl get links --insecure -n 192.168.1.101` before first apply.
# Field evidence (config.schema.json + reference/configuration):
#   HostnameConfig{hostname}, LinkConfig{name, addresses[]:{address}, routes[]:{gateway}},
#   UnattendedInstallConfig{installer.image, provisioning.diskSelector.match, wipe},
#   UserVolumeConfig{name, provisioning.diskSelector.match/filesystem.type},
#   KubeNodeConfig{nodeIP.validSubnets, labels}.
# Disk CEL: disk.dev_path / disk.transport (sata evidenced in
# disk-management/layout.mdx) / !system_disk (system.mdx:46,83).
# No sata-data volume: the host has no SATA disk (AHCI controller 0000:00:17.0
# is vfio-pci passthrough — see node schematics.yml), so a
# disk.dev_path == "/dev/sda" selector would never match and the
# UserVolumeConfig would block provisioning waiting for a disk.
# Re-add a sata-data UserVolumeConfig (+ its /var/mnt/sata-data exports line)
# only when a SATA disk is physically present.
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: bdo-r01-cp-001
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp45s0
addresses:
  - address: 192.168.1.101/24
routes:
  - gateway: 192.168.1.1
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/PLACEHOLDER_SCHEMATIC_ID:v1.15.0-alpha.0 # set from schematic upload
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0"
  wipe: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  grow: false
  maxSize: -400GiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: nvme-data
provisioning:
  diskSelector:
    match: system_disk
  grow: true
  maxSize: 400GiB
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: sata-data
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  grow: true
  minSize: 64GiB
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  # 1. SunRPC Slot Tables (Concurreny depth per connection)
  sunrpc.tcp_slot_table_entries: "64"
  sunrpc.tcp_max_slot_table_entries: "64"

  # 2. Network Core Socket Buffers (Optimized for 10GbE+)
  net.core.rmem_max: "33554432"          # 32MB
  net.core.wmem_max: "33554432"          # 32MB
  net.core.rmem_default: "1048576"
  net.core.wmem_default: "1048576"
  net.core.netdev_max_backlog: "10000"
  net.core.somaxconn: "4096"

  # 3. TCP Memory Buffer Limits (Min, Default, Max)
  net.ipv4.tcp_rmem: "4096 87380 33554432"
  net.ipv4.tcp_wmem: "4096 65536 33554432"
  net.ipv4.tcp_slow_start_after_idle: "0"

  # 4. Virtual Memory Writeback Flushing
  vm.dirty_background_ratio: "5"
  vm.dirty_ratio: "10"
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nfsd
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: nfs.conf
mode: 0o644
contents: |
  [nfsd]
  threads = 64
  # vers2 = n
  # vers3 = n
  # vers4 = y
  # vers4.0 = n
  # vers4.1 = y
  # vers4.2 = y

  [mountd]
  manage-gids = y
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: nfs-server
environment:
  - RPCNFSDCOUNT=32
---
# NFS server stack (nfs-server README §Requirements + Configuration).
# Exports the existing user volumes — no dedicated nfs volume.
# UserVolumeConfig <name> mounts at /var/mnt/<name>, so these paths resolve
# against the nvme-data + sata-data volumes above.
# Linux Client Example
# fstab
# 192.168.1.101:/var/mnt/sata-data /mnt/sata-data nfs4 nfsvers=4.2,hard,timeo=600,retrans=2,rsize=1048576,wsize=1048576,nconnect=8,noatime,nodiratime,nosuid,nodev 0 0
# mount
# sudo mount -t nfs4 -o nfsvers=4.2,hard,timeo=600,retrans=2,rsize=1048576,wsize=1048576,nconnect=8,noatime,nodiratime,nosuid,nodev 192.168.1.101:/mnt/sata-data /mnt/sata-data
# Kubernetes Client Example
# mountOptions:
#   - nfsvers=4.2
#   - hard
#   - timeo=600
#   - retrans=2
#   - rsize=1048576
#   - wsize=1048576
#   - nconnect=8
#   - noatime
#   - nodiratime
#   - noresvport                        # Essential for Kubernetes containers
apiVersion: v1alpha1
kind: EtcFileConfig
name: exports
mode: 0o644
contents: |
  /var 192.168.1.0/24(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534,no_wdelay,fsid=0)
  /var/mnt/nvme-data 192.168.1.0/24(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534,no_wdelay,fsid=1)
  /var/mnt/sata-data 192.168.1.0/24(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534,no_wdelay,fsid=2) 
# LAN-only 192.168.1.0/24; default root_squash kept (no no_root_squash).
# fsid=0 marks the NFSv4 pseudo-root on nvme-data; crossmnt lets clients
# traverse into the sata-data export.
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: netconfig
mode: 0o644
contents: |
  udp        tpi_clts      v     inet     udp     -       -
  tcp        tpi_cots_ord  v     inet     tcp     -       -
# libtirpc IPv4 server table (nfs-server README); service path-deps on both
# /etc/exports and /etc/netconfig — it will not start without them.
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
# Note: no node-role.acme.io/env label here — only the dev node carries
# env: dev. Prd workloads select on tier: apps + zone: bdo1.
labels:
  topology.kubernetes.io/zone: bdo1
  node-role.acme.io/tier: apps
