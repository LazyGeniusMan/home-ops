# Node patch: bdo-r01-cp-001 — acme-prd-bdo1-talos-apps-01 (Talos v1.14).
# Applied last: --config-patch @nodes/bdo-r01-cp-001/patches.yml
# Static IP 192.168.1.101/24 on the RTL8125 link; Proxmox lshw logical names
# (nic0/nic1) do not survive into Talos — systemd predictable name for PCI
# 0000:2d:00.0 is enp45s0 (0x2d = 45). Day-0 verifies with
# `talosctl get links --insecure -n 192.168.1.101` before first apply.
# Field evidence (config.schema.json + reference/configuration):
#   HostnameConfig{hostname}, LinkConfig{name, addresses[]:{address}, routes[]:{gateway}},
#   UnattendedInstallConfig{installer.image, provisioning.diskSelector.match, wipe},
#   UserVolumeConfig{name, provisioning.diskSelector.match/filesystem.type},
#   KubeNodeConfig{nodeIP.validSubnets, labels}.
# Disk CEL: disk.dev_path / disk.transport (sata evidenced in
# disk-management/layout.mdx) / !system_disk (system.mdx:46,83).
# sata-data provisions when a SATA disk is present; the host AHCI controller is
# currently vfio-pci passthrough, so this volume waits for a disk.
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: bdo-r01-cp-001
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp45s0
addresses:
  - address: 192.168.1.101/24
routes:
  - gateway: 192.168.1.1
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/PLACEHOLDER_SCHEMATIC_ID:v1.14.0 # set from schematic upload
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0"
  wipe: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  grow: false
  maxSize: 64GiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: nvme-data
provisioning:
  diskSelector:
    match: system_disk
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: sata-data
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  minSize: 1GiB
filesystem:
  type: xfs
---
# NFS server stack (nfs-server README §Requirements + Configuration).
# Backing store: UserVolumeConfig <name> mounts at /var/mnt/<name>, so the
# volume MUST be named `nfs` for the /etc/exports line below (/var/mnt/nfs,
# byte-identical to upstream README example) to resolve. (Brief sketched
# `nfs-data`; that would mount at /var/mnt/nfs-data and the export path would
# not exist — exportfs -r would fail and the server would never start.)
# system_disk (/dev/nvme0, 512 GB NVMe) is the ONLY disk on this host — the
# /dev/sda sata-data volume above pends on a disk that does not exist (AHCI
# controller is vfio-pci passthrough). EPHEMERAL is capped at 64 GiB, leaving
# room for nfs as a second system_disk partition alongside nvme-data. Day-0:
# verify free space with `talosctl get volumestatus/disks`; cap nvme-data
# with maxSize if the nfs provisioning reports insufficient space.
apiVersion: v1alpha1
kind: EtcFileConfig
name: exports
mode: 0o644
contents: |
  /var/mnt/nfs 192.168.1.0/24(rw,sync,no_subtree_check,fsid=0)
# Conservative: default root_squash kept (no no_root_squash); fsid=0 marks the
# NFSv4 pseudo-root. CIDR tightened from the README's 10.0.0.0/8 placeholder
# to the live LAN both nodes serve (192.168.1.0/24).
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: netconfig
mode: 0o644
contents: |
  udp        tpi_clts      v     inet     udp     -       -
  tcp        tpi_cots_ord  v     inet     tcp     -       -
# libtirpc IPv4 server table (nfs-server README); service path-deps on both
# /etc/exports and /etc/netconfig — it will not start without them.
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: nfs
provisioning:
  diskSelector:
    match: system_disk
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
labels:
  topology.kubernetes.io/zone: bdo1
  node-role.acme.io/tier: apps
