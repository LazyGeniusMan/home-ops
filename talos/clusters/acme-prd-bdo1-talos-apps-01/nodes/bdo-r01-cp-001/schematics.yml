# Node-specific Image Factory schematic layer for bdo-r01-cp-001 (Talos v1.14).
# Additive ONLY: entries here merge over the _base + cluster layers (the
# cluster layer already provides siderolabs/netbird). Keep node-only entries.
# Node: MSI PRO ADL-U Cubi 5 (MS-B0A8), i3-1215U Alder Lake-U, 64 GiB RAM,
# RTL8125 2.5GbE (PCI 0000:2d:00.0) + RTL8111 GbE (PCI 0000:2e:00.0),
# Alder Lake-UP3 GT1 iGPU (i915), install disk /dev/nvme0n1 (512 GB NVMe).
# Evidence: /tmp/lshw-log/lshw.log (host) — CPU lshw.log:124-130,
# NICs :518-558, iGPU :148-160, NVMe :269-295. No SATA disks on host
# (AHCI controller 0000:00:17.0 is vfio-pci passthrough) -> install MUST be NVMe.
# Bare `siderolabs/<name>` entries only — factory pins versions to Talos release.
# Extension names verified against extensions repo (release-1.14 README):
#   intel-ucode (CPU microcode), i915 (iGPU firmware), realtek-firmware (both NICs).
# Upload: curl -X POST --data-binary @schematics.yml https://factory.talos.dev/schematics
# Then set the returned ID in patches.yml UnattendedInstallConfig installer.image.
customization:
  extraKernelArgs:
    - intel_iommu=on # enable DMAR so vfio-pci GPU-VF/SATA passthrough isolates correctly
    - iommu=pt # passthrough DMA for unassigned devices (no needless remap overhead)
  systemExtensions:
    officialExtensions:
      - siderolabs/intel-ucode
      - siderolabs/i915
      - siderolabs/realtek-firmware
      # NFS server stack (all three required together — nfs-server README
      # §Requirements): nfsd (kernel module), nfs-utils (rpcbind/rpc.statd),
      # nfs-server (server daemons). Node exports via /var/mnt/nfs.
      - siderolabs/nfsd
      - siderolabs/nfs-utils
      - siderolabs/nfs-server
