# Node schematic layer for bdo-r01-cp-001: node-only entries.
customization:
  extraKernelArgs:
    - intel_iommu=on # IOMMU passthrough isolation
    - iommu=pt # passthrough DMA for unassigned devices
  systemExtensions:
    officialExtensions:
      - siderolabs/intel-ucode
      - siderolabs/i915
      - siderolabs/realtek-firmware
      # NFS server stack (all three required).
      - siderolabs/nfsd
      - siderolabs/nfs-utils
      - siderolabs/nfs-server
