# Node schematic layer for bdo-r01-cp-001 (Talos v1.15.0-alpha.0): node-only entries
# (netbird comes from the cluster layer). Bare `siderolabs/<name>` entries only.
customization:
  extraKernelArgs:
    - intel_iommu=on # IOMMU passthrough isolation
    - iommu=pt # passthrough DMA for unassigned devices
  systemExtensions:
    officialExtensions:
      - siderolabs/intel-ucode
      - siderolabs/i915
      - siderolabs/realtek-firmware
      # NFS server stack (all three required).
      - siderolabs/nfsd
      - siderolabs/nfs-utils
      - siderolabs/nfs-server
