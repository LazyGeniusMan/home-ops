# Cluster patch: acme-prd-bdo1-talos-apps-01 (Talos v1.15.0-alpha.0, single control-plane).
# Applied after ../_base/patches.yml (base -> cluster -> node via --config-patch).
# Secrets are double-brace Proton Pass references; the NetBird placeholder
# (NB_SETUP_KEY=__TALOS_NETBIRD_SETUP_KEY__) is rewritten at render time from
# the Terraform-minted key (see talos_netbird_* in ansible/group_vars/all.yml).
# Render: pass-cli inject --in-file patches.yml
#   --out-file ../../ansible/build/acme-prd-bdo1-talos-apps-01/patches.yml
# Split-doc kinds: KubeClusterConfig{endpoint}; KubeProxyConfig{enabled: false}
# (Cilium replaces kube-proxy); KubeNodeConfig with the default control-plane
# taint removed (single-node runs workloads on the control-plane);
# Layer2VIPConfig, RegistryAuthConfig, ResolverConfig.
---
apiVersion: v1alpha1
kind: KubeClusterConfig
endpoint: https://192.168.1.198:6443
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false # Cilium replaces kube-proxy (off: no managed kube-proxy deployment)
---
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  $patch: delete # single-node: permit workloads on the control-plane
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.1.198 # K8s API VIP, advertised from the control-plane node
link: enp45s0 # RTL8125 2.5GbE (PCI 0000:2d:00.0 -> enp45s0); confirm via manual pre-flight `talosctl get links --insecure -n 192.168.1.101`
---
apiVersion: v1alpha1
kind: RegistryAuthConfig
name: docker.io
username: "{{ pass://acme-prd-bdo1-talos-apps-01/talos/docker-username }}"
password: "{{ pass://acme-prd-bdo1-talos-apps-01/talos/docker-password }}"
---
apiVersion: v1alpha1
kind: RegistryAuthConfig
name: ghcr.io
username: "{{ pass://acme-prd-bdo1-talos-apps-01/talos/ghcr-username }}"
password: "{{ pass://acme-prd-bdo1-talos-apps-01/talos/ghcr-password }}"
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 1.1.1.1
  - address: 8.8.8.8
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: netbird
environment:
  - NB_SETUP_KEY=__TALOS_NETBIRD_SETUP_KEY__ # render-time placeholder: rewritten from the Terraform talos_setup_key output (never a vault value)
