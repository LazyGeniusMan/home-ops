# Cluster patch: acme-prd-bdo1-talos-apps-01 (why-alpha: see group_vars/all.yml; single control-plane),
# applied after ../_base/patches.yml. Own vault; double-brace refs only;
# __TALOS_NETBIRD_SETUP_KEY__ is rewritten at render (RUNBOOK §1.0b).
# kube-proxy disabled (Cilium replaces it); control-plane taint removed.
---
apiVersion: v1alpha1
kind: KubeClusterConfig
endpoint: https://192.168.1.198:6443
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false # Cilium replaces kube-proxy (off: no managed kube-proxy deployment)
---
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  $patch: delete # single-node: permit workloads on the control-plane
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
# Single speaker (no HA) — stable endpoint across scale-up (RUNBOOK §4.6).
name: 192.168.1.198 # K8s API VIP, advertised from the control-plane node
link: enp45s0 # RTL8125 2.5GbE (pre-flight: talosctl get links --insecure -n 192.168.1.101)
---
# Registry creds rotate in Proton Pass, pick up via day-2 reapply (§3.6).
apiVersion: v1alpha1
kind: RegistryAuthConfig
name: docker.io
username: "{{ pass://acme-prd-bdo1-talos-apps-01/talos/docker-username }}"
password: "{{ pass://acme-prd-bdo1-talos-apps-01/talos/docker-password }}"
---
apiVersion: v1alpha1
kind: RegistryAuthConfig
name: ghcr.io
username: "{{ pass://acme-prd-bdo1-talos-apps-01/talos/ghcr-username }}"
password: "{{ pass://acme-prd-bdo1-talos-apps-01/talos/ghcr-password }}"
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 1.1.1.1
  - address: 8.8.8.8
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: netbird
environment:
  - NB_SETUP_KEY=__TALOS_NETBIRD_SETUP_KEY__ # render-time placeholder (RUNBOOK §1.0b; never a vault value)
