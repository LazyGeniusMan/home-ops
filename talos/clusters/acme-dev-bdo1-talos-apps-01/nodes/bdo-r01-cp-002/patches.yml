# Node patch: bdo-r01-cp-002 — acme-dev-bdo1-talos-apps-01 (Talos v1.14).
# QEMU/KVM VM: virtio NIC (ens18), /dev/sda 32 GB install target,
# /dev/sdb 64 GB data disk. Install selector pins the OS disk by size so the
# data disk is never picked; app-data XFS volume provisions on the 64 GB disk.
# Day-0 verifies link name + sizes with `talosctl get links/disks --insecure`.
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: bdo-r01-cp-002
---
apiVersion: v1alpha1
kind: LinkConfig
name: ens18
addresses:
  - address: 192.168.1.201/24
routes:
  - gateway: 192.168.1.1
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/PLACEHOLDER_SCHEMATIC_ID:v1.14.0 # set from schematic upload
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  wipe: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  grow: false
  maxSize: 32GiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: nvme-data
provisioning:
  diskSelector:
    match: system_disk
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: sata-data
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sdb"
filesystem:
  type: xfs
---
# NFS server stack (nfs-server README §Requirements + Configuration).
# Backing store: UserVolumeConfig <name> mounts at /var/mnt/<name>, so the
# volume MUST be named `nfs` for the /etc/exports line below (/var/mnt/nfs,
# byte-identical to upstream README example) to resolve. (Brief sketched
# `nfs-data`; that would mount at /var/mnt/nfs-data and the export path would
# not exist — exportfs -r would fail and the server would never start.)
# Shares the /dev/sdb data disk with sata-data as a second partition;
# system_disk (/dev/sda, 32 GB) already carries EPHEMERAL (capped 32 GiB) +
# nvme-data and has no room. Day-0: verify free space with
# `talosctl get volumestatus/disks`; cap sata-data with maxSize if full.
apiVersion: v1alpha1
kind: EtcFileConfig
name: exports
mode: 0o644
contents: |
  /var/mnt/nfs 192.168.1.0/24(rw,sync,no_subtree_check,fsid=0)
# Conservative: default root_squash kept (no no_root_squash); fsid=0 marks the
# NFSv4 pseudo-root. CIDR tightened from the README's 10.0.0.0/8 placeholder
# to the live LAN both nodes serve (192.168.1.0/24).
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: netconfig
mode: 0o644
contents: |
  udp        tpi_clts      v     inet     udp     -       -
  tcp        tpi_cots_ord  v     inet     tcp     -       -
# libtirpc IPv4 server table (nfs-server README); service path-deps on both
# /etc/exports and /etc/netconfig — it will not start without them.
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: nfs
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sdb"
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
labels:
  topology.kubernetes.io/zone: bdo1
  node-role.acme.io/tier: apps
  node-role.acme.io/env: dev
