# Node patch: bdo-r01-cp-002 — acme-dev-bdo1-talos-apps-01 (Talos v1.14).
# QEMU/KVM VM: virtio NIC (ens18), install disk /dev/sda (20 GiB OS),
# data disk /dev/sdb (960 GB passthrough). Install selector pins /dev/sda;
# EPHEMERAL capped at 32GiB on the system disk; nvme-data (system disk) +
# sata-data (/dev/sdb) XFS volumes. Manual pre-flight:
# `talosctl get links/disks --insecure -n 192.168.1.201`.
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: bdo-r01-cp-002
---
apiVersion: v1alpha1
kind: LinkConfig
name: ens18
addresses:
  - address: 192.168.1.201/24
routes:
  - gateway: 192.168.1.1
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/PLACEHOLDER_SCHEMATIC_ID:v1.14.0 # set from schematic upload
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  wipe: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  grow: false
  maxSize: 32GiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: nvme-data
provisioning:
  diskSelector:
    match: system_disk
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: sata-data
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sdb"
filesystem:
  type: xfs
---
# NFS server stack (nfs-server README §Requirements + Configuration).
# Exports the existing user volumes — no dedicated nfs volume.
# UserVolumeConfig <name> mounts at /var/mnt/<name>, so these paths resolve
# against the nvme-data + sata-data volumes above.
apiVersion: v1alpha1
kind: EtcFileConfig
name: exports
mode: 0o644
contents: |
  /var/mnt/nvme-data 192.168.1.0/24(rw,sync,no_subtree_check,fsid=0,crossmnt)
  /var/mnt/sata-data 192.168.1.0/24(rw,sync,no_subtree_check)
# LAN-only 192.168.1.0/24; default root_squash kept (no no_root_squash).
# fsid=0 marks the NFSv4 pseudo-root on nvme-data; crossmnt lets clients
# traverse into the sata-data export.
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: netconfig
mode: 0o644
contents: |
  udp        tpi_clts      v     inet     udp     -       -
  tcp        tpi_cots_ord  v     inet     tcp     -       -
# libtirpc IPv4 server table (nfs-server README); service path-deps on both
# /etc/exports and /etc/netconfig — it will not start without them.
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
labels:
  topology.kubernetes.io/zone: bdo1
  node-role.acme.io/tier: apps
  node-role.acme.io/env: dev
