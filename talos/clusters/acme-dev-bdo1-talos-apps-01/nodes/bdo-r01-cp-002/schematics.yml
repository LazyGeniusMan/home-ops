# Node schematic layer for bdo-r01-cp-002 (Talos v1.15.0-alpha.0): node-only entries
# (netbird comes from the cluster layer). Bare `siderolabs/<name>` entries only.
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/qemu-guest-agent
      # NFS server stack (all three required).
      - siderolabs/nfsd
      - siderolabs/nfs-utils
      - siderolabs/nfs-server
