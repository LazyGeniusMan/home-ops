# Cluster patch: acme-dev-bdo1-talos-apps-01 (Talos v1.14, single control-plane).
# Dev cluster addressing (node .201, VIP .248) with its own Proton Pass vault.
# No cross-environment vault references anywhere in this tree.
# Applied after ../_base/patches.yml (same --config-patch ordering as prd).
# Secrets: double-brace refs rendered via pass-cli inject into gitignored build/:
#   export PROTON_PASS_PERSONAL_ACCESS_TOKEN=pst_...
#   pass-cli inject --in-file patches.yml --out-file ../../ansible/build/acme-dev-bdo1-talos-apps-01/patches.yml
# Split-doc kinds per reference/configuration/document-map.mdx:
#   endpoint -> KubeClusterConfig{endpoint}; proxy off -> KubeProxyConfig{enabled};
#   scheduling on the control-plane -> KubeNodeConfig with the default
#   control-plane NoSchedule taint removed (workloads-on-controlplane.mdx).
---
apiVersion: v1alpha1
kind: KubeClusterConfig
endpoint: https://192.168.1.248:6443
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false # Cilium replaces kube-proxy
---
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  $patch: delete # single-node: permit workloads on the control-plane
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.1.248 # K8s API VIP, advertised from the control-plane node
link: ens18 # QEMU/KVM virtio NIC; day-0 verifies via `talosctl get links`
---
apiVersion: v1alpha1
kind: RegistryAuthConfig
name: docker.io
username: "{{ pass://acme-dev-bdo1-talos-apps-01/talos/docker-username }}"
password: "{{ pass://acme-dev-bdo1-talos-apps-01/talos/docker-password }}"
---
apiVersion: v1alpha1
kind: RegistryAuthConfig
name: dhi.io
username: "{{ pass://acme-dev-bdo1-talos-apps-01/talos/docker-username }}"
password: "{{ pass://acme-dev-bdo1-talos-apps-01/talos/docker-password }}"
---
apiVersion: v1alpha1
kind: RegistryAuthConfig
name: ghcr.io
username: "{{ pass://acme-dev-bdo1-talos-apps-01/talos/ghcr-username }}"
password: "{{ pass://acme-dev-bdo1-talos-apps-01/talos/ghcr-password }}"
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 1.1.1.1
  - address: 8.8.8.8
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: netbird
environment:
  - NB_SETUP_KEY="{{ pass://acme-dev-bdo1-talos-apps-01/talos/netbird-setup-key }}"
