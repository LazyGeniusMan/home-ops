# Opt-in override: disable kube-proxy where Cilium replaces it.
# Apply AFTER _base/patches.yml so this fragment wins the merge:
#   --config-patch @clusters/_base/patches.yml \
#   --config-patch @clusters/_base/kube-proxy-override.yml
# Split-doc form (document-map.mdx: `.cluster.proxy` -> KubeProxyConfig):
# KubeProxyConfig{enabled} disables the managed kube-proxy deployment.
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
