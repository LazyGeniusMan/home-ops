# Shared barebone base, applied first. kube-proxy iptables here; cluster patches disable it (Cilium).
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeProxyConfig
mode: iptables
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: default
$patch: delete
---
apiVersion: v1alpha1
kind: TimeSyncConfig
# Two NTP sources; no LAN NTP.
ntp:
  servers:
    - time.cloudflare.com
    - time.google.com
