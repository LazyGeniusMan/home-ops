# Shared barebone base patch for all clusters (Talos v1.15.0-alpha.0).
# Multi-document file consumed via `talosctl gen config --config-patch @file`;
# split-doc kinds merge after the v1alpha1 fragment. Base ships zero bootstrap
# manifests (no inlineManifests / extraManifests): CNI none (delete
# KubeFlannelCNIConfig; Cilium arrives via GitOps), CoreDNS off, kube-proxy
# iptables mode (clusters on Cilium kube-proxy replacement set enabled: false
# in their cluster patches.yml), discovery off (delete DiscoveryServiceConfig
# `default`).
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeProxyConfig
mode: iptables
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: default
$patch: delete
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - time.cloudflare.com
