# Shared barebone base patch (why-alpha: see group_vars/all.yml), applied first.
# CNI none (Cilium arrives via GitOps), CoreDNS off, discovery off.
# kube-proxy runs in iptables mode HERE so the base alone boots;
# every cluster patch disables it.
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeProxyConfig
mode: iptables
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: default
$patch: delete
---
apiVersion: v1alpha1
kind: TimeSyncConfig
# Two NTP sources (no LAN NTP yet — see RUNBOOK §4.5).
ntp:
  servers:
    - time.cloudflare.com
    - time.google.com
