# Shared barebone base patch (Talos v1.15.0-alpha.0), applied first via --config-patch.
# CNI none (Cilium arrives via GitOps), CoreDNS off, kube-proxy iptables mode
# (clusters on Cilium kube-proxy replacement disable it), discovery off.
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeProxyConfig
mode: iptables
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: default
$patch: delete
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - time.cloudflare.com
