# Shared barebone base patch (Talos v1.15.0-alpha.0 — why-alpha: the
# nfs-server system extension requires Talos >= 1.15, and 1.15 ships only as
# alpha today; see the pin comment in talos/ansible/group_vars/all.yml),
# applied first via --config-patch.
# CNI none (Cilium arrives via GitOps), CoreDNS off, discovery off.
# kube-proxy runs in iptables mode HERE so the base alone is a bootable shape;
# every cluster patch disables it (Cilium replaces kube-proxy) — see the
# KubeProxyConfig doc in each clusters/<cluster>/patches.yml.
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeProxyConfig
mode: iptables
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: default
$patch: delete
---
apiVersion: v1alpha1
kind: TimeSyncConfig
# Two NTP sources: chrony falls over to the second when the first is
# unreachable (single-node clusters have no LAN NTP yet — see RUNBOOK §4.5).
ntp:
  servers:
    - time.cloudflare.com
    - time.google.com
