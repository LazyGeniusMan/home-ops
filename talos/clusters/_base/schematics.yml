# Base Image Factory schematic layer shared by all clusters/nodes (Talos v1.15.0-alpha.0).
# Layered model: this base layer holds config shared by every node; the
# cluster layer adds env-wide entries and the node layer adds node-specific
# entries. Layers deep-merge base -> cluster -> node (dedup union).
# Bare `siderolabs/<name>` entries only — the factory pins extension versions
# to the Talos release (see boot-assets.mdx bare-metal example).
# Upload: curl -X POST --data-binary @schematics.yml
#   https://factory.talos.dev/schematics  -> {"id":"..."}
# Empty schematic (customization: {}) renders no installer image; each node's
# factory ID comes from its own merged schematic upload (see ansible day-0).
# Kernel args live here (customization.extraKernelArgs); machine.kernel.args
# does not exist in v1alpha1 (zero hits in config.schema.json).
customization: {}
