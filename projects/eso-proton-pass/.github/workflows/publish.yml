# Canonical publish workflow for eso-proton-pass.
# Builds and pushes ghcr.io/lazygeniusman/home-ops/infra/eso-proton-pass.
# Split-ready layout: paths assume the project directory is the repository root.
# After the per-project repo split this file executes as-is (callable via
# workflow_call); until then GitHub only executes the root wiring file
# .github/workflows/eso-proton-pass.yml, which calls the same shared logic
# in ../actions/publish with monorepo-relative paths.
name: eso-proton-pass-publish

on:
  workflow_call:
    inputs:
      context:
        description: 'Docker build context, relative to the repository root'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile path, relative to the repository root'
        required: false
        type: string
        default: './Dockerfile'
  push:
    paths:
      - 'projects/eso-proton-pass/**'
    tags:
      - 'eso-proton-pass-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: eso-proton-pass-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: ./.github/actions/publish
        with:
          context: ${{ inputs.context || '.' }}
          dockerfile: ${{ inputs.dockerfile || './Dockerfile' }}
