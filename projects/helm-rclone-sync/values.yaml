# Default values for helm-rclone-sync: env-only periodic sync. Remotes are
# built exclusively from RCLONE_CONFIG_* env; no rclone.conf exists anywhere
# (RCLONE_CONFIG=/dev/null blocks file read/auto-create).

# -- Container image for the sync job. Tag must be an exact pin, never "latest".
image:
  repository: rclone/rclone
  tag: "1.75.0"
  pullPolicy: IfNotPresent

rclone:
  # -- Overrides image.tag when set (exact pin, never "latest"). Empty = use image.tag.
  version: ""
  # -- One-shot command: sync (mirror, deletes extras at destination) or copy.
  operation: sync
  # -- Extra CLI flags appended before the source/destination args,
  # e.g. ["--transfers=4", "--checkers=8", "--stats=60s", "--stats-one-line"]
  extraArgs: []

# -- Cron schedule for the CronJob (also used for `spec.schedule` verbatim).
schedule: "0 2 * * *"
# -- IANA timezone for the schedule, e.g. "America/New_York". Empty = cluster default.
# Requires controller support for spec.timeZone (>= K8s 1.27).
timeZone: ""
# -- When true, the CronJob is suspended (no new Jobs are started).
suspend: false
# -- CronJob concurrency policy. Keep Forbid so overlapping runs never fight
# over the same destination (see README "Overlap safety").
concurrencyPolicy: Forbid
# -- Job retry budget and history pruning.
backoffLimit: 3
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
# -- Delete finished Jobs (and their Pods) this many seconds after completion.
ttlSecondsAfterFinished: 86400
# -- Kill a single sync run that exceeds this many seconds. Null = no deadline.
activeDeadlineSeconds: null
# -- Pod restartPolicy for the Job. Must be OnFailure or Never (Jobs requirement).
restartPolicy: OnFailure

# Endpoints share one shape; direction is source.type/destination.type.
# Every uri/credential field is a literal or one of value|secretRef|
# configMapRef|esoRef (chart creates no Secrets).
source:
  type: pvc-rwo
  remoteName: ""
  uri:
    value: data
  credentials: {}

destination:
  type: s3
  remoteName: ""
  uri:
    value: my-bucket/backups
  credentials:
    provider:
      value: AWS
    accessKeyId:
      value: CHANGEME
    secretAccessKey:
      secretRef:
        name: rclone-s3-credentials
        key: secret-access-key
    region:
      value: us-east-1

# -- Co-locate sync Pods with the owning workload (recommended for pvc-rwo).
# Renders a required podAffinity term (default topologyKey
# kubernetes.io/hostname) merged with .affinity. Empty = none.
# E.g. coLocateWith: {matchLabels: {app: my-db}}
coLocateWith: {}
# -- Scheduling helpers. Useful for pvc-rwo: pin the Job Pod to the node that
# holds the RWO volume (the claim's own access mode still governs attach).
nodeSelector: {}
affinity: {}
tolerations: []

# -- Resource requests/limits for the sync container.
resources:
  requests:
    cpu: 50m
    memory: 128Mi

podSecurityContext: {}
securityContext: {}

# -- Annotations added to the CronJob metadata.
annotations: {}

nameOverride: ""
fullnameOverride: ""
