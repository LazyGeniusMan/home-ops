# Value-source proof for every one of the four sources, applied to BOTH a uri
# and a credential field in a single render (see README "Value sources"):
#   value ......... source.uri + source credentials (provider/accessKeyId/region)
#   secretRef ..... source credentials.secretAccessKey
#   configMapRef .. source credentials.endpoint
#   esoRef ........ destination.uri + destination credentials.password
schedule: "0 5 * * *"
source:
  type: s3
  uri:
    value: bucket1/nightly
  credentials:
    provider:
      value: AWS
    accessKeyId:
      value: AKIAIOSFODNN7EXAMPLE
    secretAccessKey:
      secretRef:
        name: rclone-s3-credentials
        key: secret-access-key
    region:
      value: us-east-1
    endpoint:
      configMapRef:
        name: rclone-s3-config
        key: endpoint
destination:
  type: proton-drive
  uri:
    esoRef:
      name: rclone-proton-eso
      key: backup-path
  credentials:
    username:
      value: user@example.com
    password:
      esoRef:
        name: rclone-proton-eso
        key: password
