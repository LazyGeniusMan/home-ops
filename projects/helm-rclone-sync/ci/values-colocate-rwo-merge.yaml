# RWO co-location + user affinity merge proof: the generated podAffinity term
# appends to (never replaces) user-supplied affinity (here nodeAffinity).
schedule: "20 2 * * *"
coLocateWith:
  matchLabels:
    app: my-db
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: disktype
              operator: In
              values:
                - ssd
source:
  type: pvc-rwo
  uri:
    value: data-rwo
destination:
  type: s3
  uri:
    value: bucket1/nightly
  credentials:
    provider:
      value: AWS
    accessKeyId:
      value: AKIAIOSFODNN7EXAMPLE
    secretAccessKey:
      secretRef:
        name: rclone-s3-credentials
        key: secret-access-key
    region:
      value: us-east-1
