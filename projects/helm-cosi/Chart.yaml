apiVersion: v2
name: helm-cosi
description: >-
  COSI objectstorage CRDs (5 files) fetched at publish time from the upstream tag tree (no YAML committed).
type: application
# Chart version tracks the upstream release (sans leading v);
# appVersion is the same upstream (with leading v); ci/fetch.sh downloads it.
version: 0.2.2
appVersion: "v0.2.2"
keywords:
  - cosi
  - object-storage
  - crds
home: https://github.com/lazygeniusman/home-ops
sources:
  - https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-cosi
  - https://github.com/kubernetes-sigs/container-object-storage-interface/releases
maintainers:
  - name: lazygeniusman
kubeVersion: ">= 1.27"
