# Default values for helm-gateway-api.
# The upstream standard-channel bundle has no tunable knobs; this file only
# documents the fetch contract (ci/fetch.sh reads Chart.yaml, not values).

# -- Upstream release asset fetched at publish time (version pinned by
# Chart.yaml version; forge a full URL only via ci/fetch.sh).
upstream:
  repo: kubernetes-sigs/gateway-api
  asset: standard-install.yaml

nameOverride: ""
fullnameOverride: ""
