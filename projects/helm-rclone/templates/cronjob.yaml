{{- /* One generic CronJob for all sync directions (env-only). */ -}}
{{- if not (hasKey .Values "source") }}{{ fail "source is required: set source.type/uri (destination likewise)" }}{{ end -}}
{{- if not (hasKey .Values "destination") }}{{ fail "destination is required: set destination.type/uri (source likewise)" }}{{ end -}}
{{- $src := .Values.source -}}
{{- $dst := .Values.destination -}}
{{- if not (kindIs "map" $src) }}{{ fail "source is required: set source.type/uri (destination likewise)" }}{{ end -}}
{{- if not (kindIs "map" $dst) }}{{ fail "destination is required: set destination.type/uri (source likewise)" }}{{ end -}}
{{- include "helm-rclone.validateType" (dict "type" $src.type "role" "source") -}}
{{- include "helm-rclone.validateType" (dict "type" $dst.type "role" "destination") -}}
{{- include "helm-rclone.requireUri" (dict "endpoint" $src "role" "source") -}}
{{- include "helm-rclone.requireUri" (dict "endpoint" $dst "role" "destination") -}}
{{- $fullname := include "helm-rclone.fullname" . -}}
{{- $image := include "helm-rclone.image" . -}}
{{- $operation := include "helm-rclone.operation" . -}}
{{- $restartPolicy := include "helm-rclone.restartPolicy" . -}}
{{- $concurrencyPolicy := include "helm-rclone.concurrencyPolicy" . -}}
{{- $srcArg := include "helm-rclone.endpointArg" (dict "endpoint" $src "role" "source" "prefix" "SRC" "slot" "src") -}}
{{- $dstArg := include "helm-rclone.endpointArg" (dict "endpoint" $dst "role" "destination" "prefix" "DST" "slot" "dst") -}}
{{- $schedule := required "schedule is required (cron expression, e.g. \"0 2 * * *\")" .Values.schedule -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "helm-rclone.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ $schedule | quote }}
  {{- if .Values.timeZone }}
  timeZone: {{ .Values.timeZone | quote }}
  {{- end }}
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: {{ $concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      {{- if .Values.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
      {{- end }}
      {{- if kindIs "invalid" .Values.activeDeadlineSeconds }}{{ fail "activeDeadlineSeconds is required: set an explicit deadline (e.g. 3600) so a wedged run cannot block every later schedule under concurrencyPolicy Forbid" }}{{ end }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "helm-rclone.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: {{ $restartPolicy }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $volumes := include "helm-rclone.volumes" (dict "source" $src "destination" $dst) | trim }}
          {{- if $volumes }}
          {{ $volumes | nindent 10 }}
          {{- end }}
          containers:
            - name: sync
              image: {{ $image | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - {{ $operation }}
                {{- range .Values.rclone.extraArgs }}
                - {{ . | quote }}
                {{- end }}
                - {{ $srcArg | quote }}
                - {{ $dstArg | quote }}
              env:
                # See README Endpoint model.
                - name: RCLONE_CONFIG
                  value: /dev/null
                {{- $srcEnv := include "helm-rclone.endpointEnv" (dict "endpoint" $src "role" "source" "prefix" "SRC") | trim }}
                {{- if $srcEnv }}
                {{ $srcEnv | nindent 16 }}
                {{- end }}
                {{- $dstEnv := include "helm-rclone.endpointEnv" (dict "endpoint" $dst "role" "destination" "prefix" "DST") | trim }}
                {{- if $dstEnv }}
                {{ $dstEnv | nindent 16 }}
                {{- end }}
              {{- $mounts := include "helm-rclone.volumeMounts" (dict "source" $src "destination" $dst) | trim }}
              {{- if $mounts }}
              {{ $mounts | nindent 14 }}
              {{- end }}
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $affinity := include "helm-rclone.affinity" . | trim }}
          {{- if $affinity }}
          affinity:
            {{ $affinity | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
