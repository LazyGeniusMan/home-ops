# Default values for helm-rclone: env-only periodic sync. Remotes are
# built exclusively from RCLONE_CONFIG_* env; no rclone.conf exists anywhere
# (RCLONE_CONFIG=/dev/null blocks file read/auto-create).

# -- Container image for the sync job. Tag must be an exact pin, never "latest";
# digest pins the registry content (tag-only images are rejected at render).
# Re-pin on every tag bump: docker buildx imagetools inspect rclone/rclone:<tag>.
# Accepted risk: digest verified by hand at last bump; no automated cosign/signature
# check exists for this image (re-verify the digest out-of-band on every bump).
image:
  repository: rclone/rclone
  tag: "1.75.0"
  digest: "sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548"
  pullPolicy: IfNotPresent

rclone:
  # -- Overrides image.tag when set (exact pin, never "latest"). Empty = use image.tag.
  # A version override MUST set rclone.digest too (tag-only renders fail).
  version: ""
  # -- Overrides image.digest when set. Empty = use image.digest (dropped when
  # rclone.version is set without it, so the render fails instead of going tag-only).
  digest: ""
  # -- One-shot command: sync (mirror default, deletes extras at
  # destination; source deletion is the storage backend or db/app
  # operator's job) or copy (additive, never deletes).
  operation: sync
  # -- Extra CLI flags appended before the source/destination args,
  # e.g. ["--transfers=4", "--checkers=8", "--stats=60s", "--stats-one-line"]
  extraArgs: []

# -- Cron schedule for the CronJob (also used for `spec.schedule` verbatim).
schedule: "0 2 * * *"
# -- IANA timezone for the schedule, e.g. "America/New_York". Empty = cluster default.
# Requires controller support for spec.timeZone (>= K8s 1.27).
timeZone: ""
# -- When true, the CronJob is suspended (no new Jobs are started).
suspend: false
# -- CronJob concurrency policy: keep Forbid (see README "Overlap safety").
concurrencyPolicy: Forbid
# -- Job retry budget and history pruning.
backoffLimit: 3
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
# -- Delete finished Jobs (and their Pods) this many seconds after completion.
ttlSecondsAfterFinished: 86400
# -- Kill a single sync run that exceeds this many seconds. An explicit
# deadline is required: null would let a wedged run block every later
# schedule under concurrencyPolicy Forbid.
activeDeadlineSeconds: 3600
# -- Pod restartPolicy for the Job. Must be OnFailure or Never (Jobs requirement).
restartPolicy: OnFailure

# Endpoints share one shape; direction is source.type/destination.type.
# uri/credential fields: literal or value|secretRef|configMapRef|esoRef.
source:
  type: pvc-rwo
  remoteName: ""
  uri:
    value: data
  credentials: {}

destination:
  type: s3
  remoteName: ""
  uri:
    value: my-bucket/backups
  credentials:
    provider:
      value: AWS
    # -- Empty by design: the render fails fast until a real value or a ref
    # source (secretRef/configMapRef/esoRef) is set. Never ship a placeholder.
    accessKeyId:
      value: ""
    secretAccessKey:
      secretRef:
        name: rclone-s3-credentials
        key: secret-access-key
    region:
      value: us-east-1

# -- Co-locate sync Pods with the owning workload (recommended for pvc-rwo).
# Renders a required podAffinity term merged with .affinity; empty = none.
coLocateWith: {}
# -- Scheduling helpers (nodeSelector/affinity/tolerations pass through).
nodeSelector: {}
affinity: {}
tolerations: []

# -- Resource requests/limits for the sync container (both capped so one
# runaway sync cannot starve the node; tune via values, not edits).
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Pod-level security (run as non-root, restricted seccomp).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security (no privilege escalation, read-only root,
# all capabilities dropped). Note: readOnlyRootFilesystem runs WITHOUT a
# writable /tmp mount — rclone needs none (env-only config, no state files).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Annotations added to the CronJob metadata.
annotations: {}

nameOverride: ""
fullnameOverride: ""
