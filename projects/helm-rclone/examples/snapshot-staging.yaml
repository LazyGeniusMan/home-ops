# EXAMPLE ONLY — not applied by the chart. External scheduler snapshots the
# live claim and restores to staging; the chart syncs from staging. Needs
# snapshot-capable CSI + VolumeSnapshotClass (not local-ssd-nvme).
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: my-db-snap
  namespace: apps
spec:
  volumeSnapshotClassName: <your-snapshot-capable-class>  # e.g. NOT local-ssd-nvme
  source:
    persistentVolumeClaimName: my-db-live   # the live RWO claim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-db-snap-staging
  namespace: apps   # restores must land per the snapshot source rules
spec:
  accessModes: ["ReadWriteMany"]   # RWX preferred: no co-location needed
  storageClassName: <staging-class-capable-of-restore>
  resources:
    requests:
      storage: 20Gi   # >= source claim size
  dataSource:
    name: my-db-snap
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
---
# Values snippet: point source at the staging claim (pvc-rwx, no
# coLocateWith); destination unchanged.
# source: {type: pvc-rwx, uri: {value: my-db-snap-staging}}
# destination: {type: s3, uri: {value: my-bucket/backups}, credentials: {...}}
