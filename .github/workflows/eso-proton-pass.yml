# eso-proton-pass publish.
# Owner: projects/eso-proton-pass
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions).
name: eso-proton-pass

on:
  push:
    branches:
      - 'main'
    paths:
      - 'projects/eso-proton-pass/**'
    tags:
      - 'eso-proton-pass-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eso-proton-pass-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eso-proton-pass
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: projects/eso-proton-pass/go.mod

      - name: Vet
        run: go vet ./...

      - name: Tidy check
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: projects/eso-proton-pass

      - name: Vulnerability check
        # Pinned govulncheck release. `go run <pkg>@<version>` verifies the
        # module against the Go checksum database, so the version pin is
        # integrity-checked; bump the pin explicitly when x/vuln releases.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate tag semver
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#eso-proton-pass-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' yields non-semver version '$version';" >&2
            echo "expected eso-proton-pass-v<semver>." >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/lazygeniusman/home-ops/projects/eso-proton-pass
          flavor: |
            latest=false
          # Branch leg: dev + dev-<sha>. Tag leg: stable + <semver>.
          # BREAKING: tags publish `stable` instead of `latest`.
          tags: |
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' }}
            type=sha,format=short,prefix=dev-,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=match,pattern=eso-proton-pass-v(.*),group=1,enable=${{ github.ref_type == 'tag' }}

      - name: Resolve VERSION build-arg
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#eso-proton-pass-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: projects/eso-proton-pass
          file: projects/eso-proton-pass/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Sign image
        if: steps.build.outputs.digest != ''
        shell: bash
        run: cosign sign --yes "$IMAGE_DIGEST_URL"
        env:
          IMAGE_DIGEST_URL: ghcr.io/lazygeniusman/home-ops/projects/eso-proton-pass@${{ steps.build.outputs.digest }}
