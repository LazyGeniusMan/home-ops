# eso-proton-pass publish.
# Owner: projects/eso-proton-pass
# Future repo: eso-proton-pass
# Migration to the dedicated repo (eso-proton-pass):
#   1. Copy .github/workflows/eso-proton-pass.yml -> <new-repo>/.github/workflows/publish.yml
#      and .github/actions/eso-proton-pass-publish/ -> <new-repo>/.github/actions/publish/.
#   2. Flip the monorepo path inputs to the split values:
#      `context: projects/eso-proton-pass` -> `.`,
#      `dockerfile: projects/eso-proton-pass/Dockerfile` -> `./Dockerfile`.
#   3. Broaden the trigger path filter: `paths: ['projects/eso-proton-pass/**']` -> `['**']`
#      (or drop the paths filter; keep the `eso-proton-pass-v*` tag filter).
#   4. Optionally restore the split-ready `workflow_call` inputs (context,
#      dockerfile; defaults `'.'`/`'./Dockerfile'`) that the old project-local
#      project-local publish.yml carried (removed in consolidation) for cross-repo calls.
name: eso-proton-pass

on:
  push:
    paths:
      - 'projects/eso-proton-pass/**'
    tags:
      - 'eso-proton-pass-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: eso-proton-pass-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: ./.github/actions/eso-proton-pass-publish
        with:
          context: projects/eso-proton-pass
          dockerfile: projects/eso-proton-pass/Dockerfile
