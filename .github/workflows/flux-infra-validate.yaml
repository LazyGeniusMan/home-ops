# Root wiring for infra validation. This file carries the triggers and calls
# the canonical job logic in flux/infra/.github/actions/validate-manifests via
# the area-local reusable workflow flux/infra/.github/workflows/validate.yaml
# (workflow_call).
name: flux-infra-validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flux/infra/**'
      - 'flux/fleet/tenants/infra.yaml'
  push:
    branches: [ 'main' ]
    paths:
      - 'flux/infra/**'
      - 'flux/fleet/tenants/infra.yaml'

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate manifests
        uses: ./flux/infra/.github/actions/validate-manifests
        with:
          script: ./flux/scripts/validate.sh
          validate-dir: flux/infra
