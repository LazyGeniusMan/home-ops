# Infra validation.
# Owner: flux/infra
# Future repo: home-ops-infra
# Migration to the dedicated repo (home-ops-infra):
#   1. Copy .github/workflows/flux-infra-validate.yaml -> <new-repo>/.github/workflows/validate.yaml
#      and .github/actions/flux-infra-validate-manifests/ ->
#      <new-repo>/.github/actions/validate-manifests/.
#   2. Flip the monorepo path inputs to the split values:
#      `script: ./flux/scripts/validate.sh` -> `./scripts/validate.sh`
#      (copy flux/scripts/validate.sh -> <new-repo>/scripts/validate.sh),
#      `validate-dir: flux/infra` -> `.`.
#   3. Broaden the trigger path filters: `paths: ['flux/infra/**',
#      'flux/fleet/tenants/infra.yaml']` -> `['components/**', 'tenants/infra.yaml']`
#      (after copying the tenants file) or drop the paths filters entirely.
name: flux-infra-validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flux/infra/**'
      - 'flux/fleet/tenants/infra.yaml'
  push:
    branches: [ 'main' ]
    paths:
      - 'flux/infra/**'
      - 'flux/fleet/tenants/infra.yaml'

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate manifests
        uses: ./.github/actions/flux-infra-validate-manifests
        with:
          script: ./flux/scripts/validate.sh
          validate-dir: flux/infra
