# Root wiring for external-dns-netbird publish (§6.2).
# GitHub only executes workflows under the repo-root .github/workflows/,
# so this file carries the triggers and calls the canonical job logic in
# projects/external-dns-netbird/.github/actions/publish via the project-local
# reusable workflow projects/external-dns-netbird/.github/workflows/publish.yml
# (workflow_call).
# On the future per-project repo split, replace this job's steps with:
#   uses: <new-repo>/.github/workflows/publish.yml@<ref>   # workflow_call
# and keep the project-local publish.yml as the canonical definition.
name: external-dns-netbird

on:
  push:
    paths:
      - 'projects/external-dns-netbird/**'
    tags:
      - 'external-dns-netbird-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: external-dns-netbird-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: ./projects/external-dns-netbird/.github/actions/publish
        with:
          context: projects/external-dns-netbird
          dockerfile: projects/external-dns-netbird/Dockerfile
