# external-dns-netbird publish.
# Owner: projects/external-dns-netbird
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions).
name: external-dns-netbird

on:
  push:
    paths:
      - 'projects/external-dns-netbird/**'
    tags:
      - 'external-dns-netbird-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-dns-netbird-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/external-dns-netbird
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: projects/external-dns-netbird/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          working-directory: projects/external-dns-netbird

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate tag semver
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#external-dns-netbird-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' yields non-semver version '$version';" >&2
            echo "expected external-dns-netbird-v<semver>." >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/lazygeniusman/home-ops/infra/external-dns-netbird
          flavor: |
            latest=false
          # Branch leg: dev + dev-<sha>. Tag leg: stable + <semver>.
          # BREAKING: tags publish `stable` instead of `latest`.
          tags: |
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' }}
            type=sha,format=short,prefix=dev-,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=match,pattern=external-dns-netbird-v(.*),group=1,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: projects/external-dns-netbird
          file: projects/external-dns-netbird/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign image
        if: steps.build.outputs.digest != ''
        shell: bash
        run: cosign sign --yes "$IMAGE_DIGEST_URL"
        env:
          IMAGE_DIGEST_URL: ghcr.io/lazygeniusman/home-ops/infra/external-dns-netbird@${{ steps.build.outputs.digest }}
