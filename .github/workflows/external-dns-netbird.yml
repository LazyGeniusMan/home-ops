# external-dns-netbird publish (§6.2).
# Owner: projects/external-dns-netbird
# Future repo: external-dns-netbird
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions).
# Migration to the dedicated repo (external-dns-netbird):
#   1. Copy this file -> <new-repo>/.github/workflows/publish.yml (only file needed).
#   2. Flip the monorepo path values to the split values:
#      `context: projects/external-dns-netbird` -> `.`,
#      `file: projects/external-dns-netbird/Dockerfile` -> `./Dockerfile`.
#   3. Broaden the trigger path filter: `paths: ['projects/external-dns-netbird/**']` -> `['**']`
#      (or drop the paths filter; keep the `external-dns-netbird-v*` tag filter).
#   4. Optionally restore the split-ready `workflow_call` inputs (context,
#      dockerfile; defaults `'.'`/`'./Dockerfile'`) that the old project-local
#      project-local publish.yml carried (removed in consolidation) for cross-repo calls.
name: external-dns-netbird

on:
  push:
    paths:
      - 'projects/external-dns-netbird/**'
    tags:
      - 'external-dns-netbird-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: external-dns-netbird-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/lazygeniusman/home-ops/infra/external-dns-netbird
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=match,pattern=external-dns-netbird-v(.*),group=1,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: projects/external-dns-netbird
          file: projects/external-dns-netbird/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
