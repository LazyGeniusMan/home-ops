# external-dns-netbird publish (§6.2).
# Owner: projects/external-dns-netbird
# Future repo: external-dns-netbird
# Migration to the dedicated repo (external-dns-netbird):
#   1. Copy .github/workflows/external-dns-netbird.yml -> <new-repo>/.github/workflows/publish.yml
#      and .github/actions/external-dns-netbird-publish/ -> <new-repo>/.github/actions/publish/.
#   2. Flip the monorepo path inputs to the split values:
#      `context: projects/external-dns-netbird` -> `.`,
#      `dockerfile: projects/external-dns-netbird/Dockerfile` -> `./Dockerfile`.
#   3. Broaden the trigger path filter: `paths: ['projects/external-dns-netbird/**']` -> `['**']`
#      (or drop the paths filter; keep the `external-dns-netbird-v*` tag filter).
#   4. Optionally restore the split-ready `workflow_call` inputs (context,
#      dockerfile; defaults `'.'`/`'./Dockerfile'`) that the old project-local
#      project-local publish.yml carried (removed in consolidation) for cross-repo calls.
name: external-dns-netbird

on:
  push:
    paths:
      - 'projects/external-dns-netbird/**'
    tags:
      - 'external-dns-netbird-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: external-dns-netbird-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: ./.github/actions/external-dns-netbird-publish
        with:
          context: projects/external-dns-netbird
          dockerfile: projects/external-dns-netbird/Dockerfile
