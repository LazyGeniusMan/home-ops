# Root wiring for fleet release delivery: tag flux-fleet-vX.Y.Z to publish
# oci://ghcr.io/<owner>/home-ops/fleet:flux-fleet-vX.Y.Z and move latest-stable.
# The home cluster verifies this workflow + tag via the cosign subject pinned
# in flux/fleet/clusters/home/flux-system/flux-instance.yaml.
# This file carries the triggers and calls the canonical job logic in
# flux/fleet/.github/actions/oci-release via the area-local reusable workflow
# flux/fleet/.github/workflows/release.yaml (workflow_call).
# On the future per-area repo split, replace this job's steps with:
#   call: <new-repo>/.github/workflows/release.yaml@<ref>   # workflow_call
# and keep the area-local release.yaml as the canonical definition.
name: flux-fleet-release

# OCI: oci://ghcr.io/<owner>/home-ops/fleet:<flux-fleet-vX.Y.Z> + latest-stable.

on:
  push:
    tags:
      - 'flux-fleet-v*'

jobs:
  flux-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish fleet release
        uses: ./flux/fleet/.github/actions/oci-release
        with:
          repository: ghcr.io/${{ github.repository }}/fleet
          path: "./flux/fleet"
          diff-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
