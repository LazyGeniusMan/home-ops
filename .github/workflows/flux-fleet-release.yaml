# Fleet release delivery: tag flux-fleet-vX.Y.Z to publish
# oci://ghcr.io/<owner>/home-ops/fleet with tags stable + stable-X.Y.Z
# (version stripped from the git ref).
# Owner: flux/fleet
# Future repo: home-ops-fleet
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions).
# The prd cluster verifies this workflow + tag via the cosign subject pinned
# in flux/fleet/clusters/acme-prd-bdo1-talos-apps-01/flux-system/flux-instance.yaml.
# Migration to the dedicated repo (home-ops-fleet):
#   1. Copy this file -> <new-repo>/.github/workflows/release.yaml (only file needed).
#   2. Flip the monorepo path value to the split value: `path: "./flux/fleet"` -> `"./"`.
#   3. Update the cosign subject path: the flux-instance.yaml pin moves with
#      flux/fleet, so the subject stays `clusters/acme-prd-bdo1-talos-apps-01/...`
#      (drop the `flux/fleet/` prefix) after the split.
#   4. Optionally restore the split-ready `workflow_call` inputs (repository,
#      path; defaults `''`/`'./'`) that the old area-local
#      area-local release.yaml carried (removed in consolidation) for cross-repo calls.
name: flux-fleet-release

# OCI: oci://ghcr.io/<owner>/home-ops/fleet:stable + stable-<version>.

on:
  push:
    tags:
      - 'flux-fleet-v*'

jobs:
  flux-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute stable version
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          echo "STABLE_VERSION=${REF##*-v}" >> "$GITHUB_ENV"
      - name: Push artifact
        uses: controlplaneio-fluxcd/distribution/actions/push@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
        id: push
        with:
          repository: ghcr.io/${{ github.repository }}/fleet
          path: "./flux/fleet"
          diff-tag: stable
          tags: stable-${{ env.STABLE_VERSION }}
      - name: Sign artifact
        if: steps.push.outputs.pushed == 'true'
        shell: bash
        run: cosign sign --yes $DIGEST_URL
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
