# Root wiring for per-component apps OCI delivery (main -> tags dev + dev-<sha>).
# This file carries the triggers and calls the canonical job logic in
# flux/apps/.github/actions/oci-push via the area-local reusable workflow
# flux/apps/.github/workflows/push.yaml (workflow_call).
# To onboard an app (§§8-14): add its directory name to the components input
# here AND in flux/apps/.github/workflows/push.yaml AND add a matching tenant
# input in flux/fleet/tenants/apps.yaml.
# Unchanged components are no-ops (push action only pushes on diff).
# On the future per-area repo split, replace this job's steps with:
#   call: <new-repo>/.github/workflows/push.yaml@<ref>   # workflow_call
# and keep the area-local push.yaml as the canonical definition.
name: flux-apps-push

# OCI: oci://ghcr.io/<owner>/home-ops/apps/<component>:dev + dev-<sha>.

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'flux/apps/**'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - rclone
          - win11-vm
          - talos-vm
          - clickstack
          - hubble-ui
          - flux-operator-ui
          - headlamp
          - coder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Push component artifact
        uses: ./flux/apps/.github/actions/oci-push
        with:
          component: ${{ matrix.component }}
          repository-prefix: ghcr.io/${{ github.repository }}/apps
          source-prefix: flux/apps/components
          github-token: ${{ secrets.GITHUB_TOKEN }}
