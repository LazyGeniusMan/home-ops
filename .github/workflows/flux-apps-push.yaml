# Per-component apps OCI delivery (main -> tags dev + dev-<sha>).
# Owner: flux/apps
# Future repo: home-ops-apps
# To onboard an app (§§8-14): add its directory name to the components matrix
# here AND add a matching tenant input in flux/fleet/tenants/apps.yaml.
# Unchanged components are no-ops (push action only pushes on diff).
# Migration to the dedicated repo (home-ops-apps):
#   1. Copy .github/workflows/flux-apps-push.yaml -> <new-repo>/.github/workflows/push.yaml
#      and .github/actions/flux-apps-oci-push/ -> <new-repo>/.github/actions/oci-push/.
#   2. Flip the monorepo path input to the split value:
#      `source-prefix: flux/apps/components` -> `components`.
#   3. Broaden the trigger path filter: `paths: ['flux/apps/**']` -> `['components/**']`
#      (or `['**']`, or drop the paths filter entirely).
#   4. Optionally restore the split-ready `workflow_call` inputs
#      (repository-prefix, source-prefix; defaults `''`/`'components'`) that the
#      old area-local push.yaml carried (removed in consolidation) for cross-repo calls.
name: flux-apps-push

# OCI: oci://ghcr.io/<owner>/home-ops/apps/<component>:dev + dev-<sha>.

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'flux/apps/**'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - rclone
          - win11-vm
          - talos-vm
          - clickstack
          - hubble-ui
          - flux-operator-ui
          - headlamp
          - coder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Push component artifact
        uses: ./.github/actions/flux-apps-oci-push
        with:
          component: ${{ matrix.component }}
          repository-prefix: ghcr.io/${{ github.repository }}/apps
          source-prefix: flux/apps/components
          github-token: ${{ secrets.GITHUB_TOKEN }}
