# Publishes helm-cosi chart to GHCR OCI (verify, fetch upstream, package/push/sign).
# Trigger: push to main on projects/helm-cosi/** + workflow_dispatch (no git tags;
# version resolves purely from Chart.yaml). Re-publish of an unchanged Chart
# version overwrites the same OCI tag (helm push OCI replace semantics).
# Upstream is fetched at publish time by ci/fetch.sh (no YAML committed); the
# staged bundle is bundled by helm package.
# PR legs run test only; publish runs on main pushes (dev artifacts only from main).
name: helm-cosi

on:
  push:
    branches:
      - 'main'
    paths:
      - 'projects/helm-cosi/**'
  pull_request:
    paths:
      - 'projects/helm-cosi/**'
  workflow_dispatch:

permissions: {} # deny-all default; test/publish scopes granted per job below.

concurrency:
  group: helm-cosi-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0 # match .flox kubernetes-helm pin

      - name: Verify (lint + fetch dry-run + guards)
        run: bash projects/helm-cosi/ci/verify.sh

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' # dev artifacts only from main
    permissions:
      contents: read
      packages: write # helm push + oras tag
      id-token: write # cosign keyless signing
    env:
      OCI_REPO: ghcr.io/lazygeniusman/home-ops/projects/helm-cosi
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0 # match .flox kubernetes-helm pin

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          # setup-oras v2.0.1 bundles oras up to 1.3.3; 1.3.4 installs the
          # standalone binary instead (version takes no `v` prefix).
          version: 1.3.4 # match .flox oras pin

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: v3.1.3 # match .flox cosign pin

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # SHA-pinned
        with:
          version: v4.53.3 # match .flox yq pin

      - name: Resolve chart version
        id: version
        run: |
          # Version resolves purely from Chart.yaml (no git-tag leg).
          VERSION="$(yq '.version' projects/helm-cosi/Chart.yaml)"
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! echo "${VERSION}" | grep -Eq "${SEMVER}"; then
            echo "Refusing to publish non-semver chart version: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream and package
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash projects/helm-cosi/ci/fetch.sh
          helm package projects/helm-cosi --version "${VERSION}"
          # `helm push` appends the chart name, so push to the parent to land exactly at OCI_REPO.
          # Re-publish overwrites the same OCI tag (helm push OCI replace semantics).
          PUSH_OUT="$(helm push "helm-cosi-${VERSION}.tgz" "oci://${OCI_REPO%/*}" 2>&1)"
          echo "${PUSH_OUT}"
          PUSHED_REF="$(echo "${PUSH_OUT}" | grep -Eo 'Pushed: [^[:space:]]+' | awk '{print $2}' | head -n 1)"
          if [ "${PUSHED_REF%:*}" != "${OCI_REPO}" ]; then
            echo "Pushed ref '${PUSHED_REF}' does not match OCI_REPO '${OCI_REPO}'" >&2
            exit 1
          fi
          DIGEST="$(echo "${PUSH_OUT}" | grep -Eo 'sha256:[0-9a-f]{64}' | head -n 1)"
          if [ -z "${DIGEST}" ]; then
            echo "Could not extract pushed digest from helm push output" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign chart artifact
        shell: bash
        run: cosign sign --yes "${OCI_REPO}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Apply floating tags
        # Push publish tracks stable + dev aliases from the Chart version;
        # re-runs overwrite the same OCI tags (idempotent, no git tags).
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          oras tag "${OCI_REPO}:${VERSION}" stable
          oras tag "${OCI_REPO}:${VERSION}" dev
          oras tag "${OCI_REPO}:${VERSION}" "dev-${GITHUB_SHA::7}"
