# Validates flux/apps manifests (validate.sh).
# Paths: flux/apps/**, tenants/apps.yaml. Runs alongside flux-apps-push.
name: flux-apps-validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flux/apps/**'
      - 'flux/fleet/tenants/apps.yaml'
      - 'flux/scripts/**'
  push:
    branches: [ 'main' ]
    paths:
      - 'flux/apps/**'
      - 'flux/fleet/tenants/apps.yaml'
      - 'flux/scripts/**'

permissions:
  contents: read

concurrency:
  group: flux-apps-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # SHA-pinned
        with:
          version: v4.53.3 # match .flox yq pin
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # SHA-pinned
        with:
          version: v0.8.0 # match .flox kubeconform pin
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # SHA-pinned
        with:
          version: v5.8.1 # match .flox kustomize pin
      - name: Validate manifests
        shell: bash
        run: ./flux/scripts/validate.sh -d flux/apps
