# Apps validation.
# Owner: flux/apps
# Future repo: home-ops-apps
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions).
# Migration to the dedicated repo (home-ops-apps):
#   1. Copy this file -> <new-repo>/.github/workflows/validate.yaml, plus
#      flux/scripts/validate.sh -> <new-repo>/scripts/validate.sh (only files needed).
#   2. Flip the monorepo path values to the split values:
#      `run: ./flux/scripts/validate.sh` -> `./scripts/validate.sh`,
#      `run: ... -d flux/apps` -> `-d .`.
#   3. Broaden the trigger path filters: `paths: ['flux/apps/**',
#      'flux/fleet/tenants/apps.yaml']` -> `['components/**', 'tenants/apps.yaml']`
#      (after copying the tenants file) or drop the paths filters entirely.
name: flux-apps-validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flux/apps/**'
      - 'flux/fleet/tenants/apps.yaml'
  push:
    branches: [ 'main' ]
    paths:
      - 'flux/apps/**'
      - 'flux/fleet/tenants/apps.yaml'

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Validate manifests
        shell: bash
        run: ./flux/scripts/validate.sh -d flux/apps
