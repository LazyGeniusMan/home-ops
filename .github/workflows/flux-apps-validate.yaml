# Apps validation.
# Owner: flux/apps
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions).
#
# Hardening: pull_request + push(main) + dispatch only, no
# pull_request_target; top-level permissions contents:read; every uses: is
# SHA-pinned; no ${{ }} interpolation into run: scripts (fixed validate.sh
# args); no secrets consumed.
# Efficiency: concurrency cancels superseded runs; path-gating limits runs to
# flux/apps/** + the apps tenant file; no dependency cache -- the steps
# shell out to prebuilt yq/kubeconform/kustomize binaries with nothing worth
# caching.
# Overlap note: push(main) runs here AND in flux-apps-push.yaml by design --
# validate gates the manifests, push ships them.
name: flux-apps-validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flux/apps/**'
      - 'flux/fleet/tenants/apps.yaml'
  push:
    branches: [ 'main' ]
    paths:
      - 'flux/apps/**'
      - 'flux/fleet/tenants/apps.yaml'

permissions:
  contents: read

concurrency:
  group: flux-apps-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # sha-pinned, no upstream tag at time of pinning
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # sha-pinned, no upstream tag at time of pinning
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # sha-pinned, no upstream tag at time of pinning
      - name: Validate manifests
        shell: bash
        run: ./flux/scripts/validate.sh -d flux/apps
