# Root wiring for per-component infra OCI delivery (main -> tag latest).
# This file carries the triggers and calls the canonical job logic in
# flux/infra/.github/actions/oci-push via the area-local reusable workflow
# flux/infra/.github/workflows/push.yaml (workflow_call).
# To onboard a component (§§8-14): add its directory name to the components
# input here AND in flux/infra/.github/workflows/push.yaml AND add a matching
# tenant input in flux/fleet/tenants/infra.yaml.
# Unchanged components are no-ops (push action only pushes on diff).
# On the future per-area repo split, replace this job's steps with:
#   call: <new-repo>/.github/workflows/push.yaml@<ref>   # workflow_call
# and keep the area-local push.yaml as the canonical definition.
name: flux-infra-push

# OCI: oci://ghcr.io/<owner>/home-ops/infra/<component>:latest.

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'flux/infra/**'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - cilium
          - coredns
          - gateway-api
          - external-secrets
          - metrics-server
          - cert-manager
          - external-dns
          - local-path-provisioner
          - cnpg
          - clickhouse
          - dragonfly
          - seaweedfs
          - multus
          - kubevirt
          - zitadel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Push component artifact
        uses: ./flux/infra/.github/actions/oci-push
        with:
          component: ${{ matrix.component }}
          repository-prefix: ghcr.io/${{ github.repository }}/infra
          source-prefix: flux/infra/components
          diff-tag: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
