# Per-component infra OCI delivery (main -> tags dev + dev-<sha>).
# Owner: flux/infra
# Future repo: home-ops-infra
# To onboard a component (§§8-14): add its directory name to the components
# matrix here AND add a matching tenant input in flux/fleet/tenants/infra.yaml.
# Unchanged components are no-ops (push action only pushes on diff).
# Migration to the dedicated repo (home-ops-infra):
#   1. Copy .github/workflows/flux-infra-push.yaml -> <new-repo>/.github/workflows/push.yaml
#      and .github/actions/flux-infra-oci-push/ -> <new-repo>/.github/actions/oci-push/.
#   2. Flip the monorepo path input to the split value:
#      `source-prefix: flux/infra/components` -> `components`.
#   3. Broaden the trigger path filter: `paths: ['flux/infra/**']` -> `['components/**']`
#      (or `['**']`, or drop the paths filter entirely).
#   4. Optionally restore the split-ready `workflow_call` inputs
#      (repository-prefix, source-prefix; defaults `''`/`'components'`) that the
#      old area-local push.yaml carried (removed in consolidation) for cross-repo calls.
name: flux-infra-push

# OCI: oci://ghcr.io/<owner>/home-ops/infra/<component>:dev + dev-<sha>.

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'flux/infra/**'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - cilium
          - coredns
          - gateway-api
          - external-secrets
          - metrics-server
          - cert-manager
          - external-dns
          - local-path-provisioner
          - cnpg
          - clickhouse
          - dragonfly
          - seaweedfs
          - multus
          - kubevirt
          - zitadel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Push component artifact
        uses: ./.github/actions/flux-infra-oci-push
        with:
          component: ${{ matrix.component }}
          repository-prefix: ghcr.io/${{ github.repository }}/infra
          source-prefix: flux/infra/components
          github-token: ${{ secrets.GITHUB_TOKEN }}
