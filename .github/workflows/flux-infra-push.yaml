# Per-component infra OCI delivery (main -> tags dev + dev-<sha>).
# Owner: flux/infra
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions).
# To onboard a component (§§8-14): add its directory name to the components
# matrix here AND add a matching tenant input in flux/fleet/tenants/infra.yaml.
# Unchanged components are no-ops (push action only pushes on diff).
name: flux-infra-push

# OCI: oci://ghcr.io/<owner>/home-ops/infra/<component>:dev + dev-<sha>.

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'flux/infra/**'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - cilium
          - coredns
          - gateway-api
          - tofu-controller
          - external-secrets
          - metrics-server
          - cert-manager
          - external-dns
          - local-path-provisioner
          - cnpg
          - clickhouse
          - dragonfly
          - seaweedfs
          - multus
          - kubevirt
          - zitadel
          - cosi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Lowercase repository
        shell: bash
        run: echo "REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Push artifact
        uses: controlplaneio-fluxcd/distribution/actions/push@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
        id: push
        with:
          repository: ghcr.io/${{ env.REPO_LC }}/infra/${{ matrix.component }}
          path: flux/infra/components/${{ matrix.component }}
          diff-tag: dev
          tags: dev-${{ env.SHORT_SHA }}
      - name: Sign artifact
        if: steps.push.outputs.pushed == 'true'
        shell: bash
        run: cosign sign --yes $DIGEST_URL
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
