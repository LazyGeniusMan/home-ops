# Opens a PR to main per image-updates-infra/apps branch (automation proposes, human merges).
# Triggers: branch creation + dispatch.

name: flux-image-updates

permissions: {} # deny-all default; the pull-request job elevates below

on:
  workflow_dispatch:
  create:
    branches:
      - 'image-updates-infra'
      - 'image-updates-apps'

concurrency:
  group: flux-image-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request:
    # create.branches already narrows branch creation; this guard stays as
    # defense-in-depth for workflow_dispatch runs.
    if: >-
      github.event_name != 'create' ||
      github.ref_name == 'image-updates-infra' ||
      github.ref_name == 'image-updates-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        # Shallow is enough: run steps only call `gh pr list/create`, never
        # git log/merge-base, so full history is not needed.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Create Pull Request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          # Duplicate-PR guard: the create trigger re-fires on pushes to the
          # branch; skip when a PR for this head already exists
          # (same pattern as the helm-*-check workflows).
          if gh pr list --repo="${GITHUB_REPO}" --head="${HEAD_BRANCH}" --json number --jq '.[0].number' \
            | grep -qE '[0-9]+'; then
            echo "PR for ${HEAD_BRANCH} already open; skipping."
            exit 0
          fi
          gh pr create \
            --repo="${GITHUB_REPO}" \
            --head="${HEAD_BRANCH}" \
            --base=main \
            --fill-first
