# PR automation for Git-based image updates: the update cluster's
# ImageUpdateAutomation (flux/fleet/clusters/update/automation.yaml) pushes
# chart/image bumps to image-updates-infra and image-updates-apps branches;
# this workflow opens a PR to main for each. Review + merge per branch
# promotes the bump through the push/release pipelines above.
# This file carries the triggers and calls the canonical job logic in
# flux/fleet/.github/actions/image-updates via the area-local reusable workflow
# flux/fleet/.github/workflows/image-updates.yaml (workflow_call).

name: flux-image-updates

on:
  workflow_dispatch:
  create:

jobs:
  pull-request:
    if: github.event_name != 'create' || github.ref_name == 'image-updates-infra' || github.ref_name == 'image-updates-apps'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create Pull Request
        uses: ./flux/fleet/.github/actions/image-updates
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
