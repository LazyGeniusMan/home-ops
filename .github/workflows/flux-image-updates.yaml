# Opens a PR to main per image-updates-infra/apps branch (automation proposes, human merges).
# Triggers: branch creation + dispatch.

name: flux-image-updates

permissions: {} # deny-all default; the pull-request job elevates below

on:
  workflow_dispatch:
  create:

concurrency:
  group: flux-image-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request:
    if: >-
      github.event_name != 'create' ||
      github.ref_name == 'image-updates-infra' ||
      github.ref_name == 'image-updates-apps'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Create Pull Request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          gh pr create \
            --repo="${GITHUB_REPO}" \
            --head="${HEAD_BRANCH}" \
            --base=main \
            --fill-first
