# PR automation for Git-based image updates: the update cluster's
# ImageUpdateAutomation (flux/fleet/clusters/update/automation.yaml) pushes
# chart/image bumps to image-updates-infra and image-updates-apps branches;
# this workflow opens a PR to main for each. Review + merge per branch
# promotes the bump through the push/release pipelines above.
# Owner: flux/fleet
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions,
# plus the gh CLI which is preinstalled on ubuntu-latest runners).
#
# Hardening: create + dispatch only, no pull_request_target; job-level
# permissions contents:read + pull-requests:write (least privilege); create
# runs are branch-gated by the job `if:` to image-updates-infra/apps;
# checkout is SHA-pinned; gh args pass via env vars, never ${{ }}
# interpolation into run:; GITHUB_TOKEN travels via env only, never echoed.
# Efficiency: concurrency serializes per-branch PR creation without cancelling
# (cancel-in-progress:false -- an in-flight `gh pr create` must finish so a
# retry sees the existing PR instead of racing it); no dependency cache --
# the job shells out to the preinstalled gh CLI with nothing worth caching.

name: flux-image-updates

on:
  workflow_dispatch:
  create:

concurrency:
  group: flux-image-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request:
    if: >-
      github.event_name != 'create' ||
      github.ref_name == 'image-updates-infra' ||
      github.ref_name == 'image-updates-apps'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create Pull Request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          gh pr create \
            --repo="${GITHUB_REPO}" \
            --head="${HEAD_BRANCH}" \
            --base=main \
            --fill-first
