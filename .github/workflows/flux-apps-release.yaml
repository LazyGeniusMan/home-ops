# Root wiring for apps area releases: tag flux-cluster-vX.Y.Z to publish every matrix
# component as oci://ghcr.io/<owner>/home-ops/apps/<component> with diff-tag
# flux-cluster-vX.Y.Z and move latest-stable. The home cluster verifies this workflow
# + tag via the cosign subject pinned in flux/fleet/tenants/apps.yaml
# (refs/tags/flux-cluster-v\d+\.\d+\.\d+).
# This file carries the triggers and calls the canonical job logic in
# flux/apps/.github/actions/oci-release via the area-local reusable workflow
# flux/apps/.github/workflows/release.yaml (workflow_call).
name: flux-apps-release

# OCI: oci://ghcr.io/<owner>/home-ops/apps/<component>:<flux-cluster-vX.Y.Z> + latest-stable.

on:
  push:
    tags:
      - 'flux-cluster-v*'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - rclone
          - win11-vm
          - talos-vm
          - clickstack
          - hubble-ui
          - flux-operator-ui
          - headlamp
          - coder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish component release
        uses: ./flux/apps/.github/actions/oci-release
        with:
          component: ${{ matrix.component }}
          repository-prefix: ghcr.io/${{ github.repository }}/apps
          source-prefix: flux/apps/components
          diff-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
