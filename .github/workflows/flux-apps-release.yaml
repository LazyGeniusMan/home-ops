# Apps area releases: tag flux-apps-vX.Y.Z to publish every matrix
# component as oci://ghcr.io/<owner>/home-ops/apps/<component> with tags
# stable + stable-X.Y.Z (version stripped from the git ref). The prd cluster verifies this workflow
# + tag via the cosign subject pinned in flux/fleet/tenants/apps.yaml
# (refs/tags/flux-apps-v\d+\.\d+\.\d+).
# Owner: flux/apps
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions).
name: flux-apps-release

# OCI: oci://ghcr.io/<owner>/home-ops/apps/<component>:stable + stable-<version>.

on:
  push:
    tags:
      - 'flux-apps-v*'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - win11-vm
          - talos-vm
          - clickstack
          - hubble-ui
          - flux-operator-ui
          - headlamp
          - coder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute stable version
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          echo "STABLE_VERSION=${REF##*-v}" >> "$GITHUB_ENV"
      - name: Lowercase repository
        shell: bash
        run: echo "REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Push artifact
        uses: controlplaneio-fluxcd/distribution/actions/push@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
        id: push
        with:
          repository: ghcr.io/${{ env.REPO_LC }}/apps/${{ matrix.component }}
          path: flux/apps/components/${{ matrix.component }}
          diff-tag: stable
          tags: stable-${{ env.STABLE_VERSION }}
      - name: Sign artifact
        if: steps.push.outputs.pushed == 'true'
        shell: bash
        run: cosign sign --yes $DIGEST_URL
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
