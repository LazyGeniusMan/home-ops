# Apps area releases: tag flux-apps-vX.Y.Z to publish every matrix
# component as oci://ghcr.io/<owner>/home-ops/apps/<component> with tags
# stable + stable-X.Y.Z (version stripped from the git ref). The prd cluster verifies this workflow
# + tag via the cosign subject pinned in flux/fleet/tenants/apps.yaml
# (refs/tags/flux-apps-v\d+\.\d+\.\d+).
# Owner: flux/apps
# Future repo: home-ops-apps
# Migration to the dedicated repo (home-ops-apps):
#   1. Copy .github/workflows/flux-apps-release.yaml -> <new-repo>/.github/workflows/release.yaml
#      and .github/actions/flux-apps-oci-release/ -> <new-repo>/.github/actions/oci-release/.
#   2. Flip the monorepo path input to the split value:
#      `source-prefix: flux/apps/components` -> `components`.
#   3. Copy flux/fleet/tenants/apps.yaml -> <new-repo>/tenants/apps.yaml and update
#      the cosign subject pin (drop the `flux/fleet/` prefix).
#   4. Optionally restore the split-ready `workflow_call` inputs
#      (repository-prefix, source-prefix; defaults `''`/`'components'`) that the
#      old area-local release.yaml carried (removed in consolidation) for cross-repo calls.
name: flux-apps-release

# OCI: oci://ghcr.io/<owner>/home-ops/apps/<component>:stable + stable-<version>.

on:
  push:
    tags:
      - 'flux-apps-v*'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - rclone
          - win11-vm
          - talos-vm
          - clickstack
          - hubble-ui
          - flux-operator-ui
          - headlamp
          - coder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish component release
        uses: ./.github/actions/flux-apps-oci-release
        with:
          component: ${{ matrix.component }}
          repository-prefix: ghcr.io/${{ github.repository }}/apps
          source-prefix: flux/apps/components
          github-token: ${{ secrets.GITHUB_TOKEN }}
