# Fleet validation (manifests + Terraform bootstrap).
# Owner: flux/fleet
# Future repo: home-ops-fleet
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions).
# Migration to the dedicated repo (home-ops-fleet):
#   1. Copy this file -> <new-repo>/.github/workflows/validate.yaml, plus
#      flux/scripts/validate.sh -> <new-repo>/scripts/validate.sh (only files needed).
#   2. Flip the monorepo path values to the split values:
#      `run: ./flux/scripts/validate.sh` -> `./scripts/validate.sh`,
#      `run: ... -d flux/fleet` -> `-d .`,
#      `working-directory: flux/fleet/terraform` -> `terraform`.
#   3. Broaden the trigger path filters: `paths: ['flux/fleet/**']` -> `['**']`
#      (or drop the paths filters entirely).
name: flux-fleet-validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flux/fleet/**'
  push:
    branches: [ 'main' ]
    paths:
      - 'flux/fleet/**'

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Validate manifests
        shell: bash
        run: ./flux/scripts/validate.sh -d flux/fleet

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - name: Init (no backend, no live apply)
        shell: bash
        working-directory: flux/fleet/terraform
        run: tofu init -backend=false
      - name: Validate
        shell: bash
        working-directory: flux/fleet/terraform
        run: tofu validate
      - name: Test single-source mapping
        shell: bash
        working-directory: flux/fleet/terraform
        run: tofu test
