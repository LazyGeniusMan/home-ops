# Root wiring for fleet validation (manifests + Terraform bootstrap).
# This file carries the triggers and calls the canonical job logic in
# flux/fleet/.github/actions/{validate-manifests,validate-terraform} via the
# area-local reusable workflow flux/fleet/.github/workflows/validate.yaml
# (workflow_call).
name: flux-fleet-validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flux/fleet/**'
  push:
    branches: [ 'main' ]
    paths:
      - 'flux/fleet/**'

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate manifests
        uses: ./flux/fleet/.github/actions/validate-manifests
        with:
          script: ./flux/scripts/validate.sh
          validate-dir: flux/fleet

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate bootstrap
        uses: ./flux/fleet/.github/actions/validate-terraform
        with:
          working-directory: flux/fleet/terraform
