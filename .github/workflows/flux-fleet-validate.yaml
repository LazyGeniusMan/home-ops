# Fleet validation (manifests + Terraform bootstrap).
# Owner: flux/fleet
# Self-contained: all steps are inline in this file; no local composite
# actions are referenced (only pinned external owner/repo@sha actions).
#
# Hardening: pull_request + push(main) + dispatch only, no
# pull_request_target; top-level permissions contents:read; every uses: is
# SHA-pinned; no ${{ }} interpolation into run: scripts (fixed validate.sh
# args); no secrets consumed.
# Efficiency: concurrency cancels superseded runs; path-gating limits runs to
# flux/fleet/**; no dependency cache -- the steps shell out to prebuilt
# yq/kubeconform/kustomize/tofu binaries with nothing worth caching.
# Overlap note: push(main) runs here AND in flux-fleet-push.yaml by design --
# validate gates the manifests, push ships them.
name: flux-fleet-validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flux/fleet/**'
  push:
    branches: [ 'main' ]
    paths:
      - 'flux/fleet/**'

permissions:
  contents: read

concurrency:
  group: flux-fleet-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Validate manifests
        shell: bash
        run: ./flux/scripts/validate.sh -d flux/fleet

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - name: Init (no backend, no live apply)
        shell: bash
        working-directory: flux/fleet/terraform
        run: tofu init -backend=false
      - name: Validate
        shell: bash
        working-directory: flux/fleet/terraform
        run: tofu validate
      - name: Test single-source mapping
        shell: bash
        working-directory: flux/fleet/terraform
        run: tofu test
