# Validates flux/fleet manifests (validate.sh) + bootstrap Terraform.
# Paths: flux/fleet/**. Runs alongside flux-fleet-push.
name: flux-fleet-validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flux/fleet/**'
      - 'flux/scripts/**'
  push:
    branches: ['main']
    paths:
      - 'flux/fleet/**'
      - 'flux/scripts/**'

permissions:
  contents: read

concurrency:
  group: flux-fleet-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # SHA-pinned
        with:
          version: v4.53.3 # match .flox yq pin
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # SHA-pinned
        with:
          version: v0.8.0 # match .flox kubeconform pin
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # SHA-pinned
        with:
          version: v5.8.1 # match .flox kustomize pin
      - name: Validate manifests
        shell: bash
        run: ./flux/scripts/validate.sh -d flux/fleet

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.6 # match .flox opentofu pin
      - name: Init (no backend, no live apply)
        shell: bash
        working-directory: flux/fleet/terraform
        run: tofu init -backend=false
      - name: Validate
        shell: bash
        working-directory: flux/fleet/terraform
        run: tofu validate
      - name: Test single-source mapping
        shell: bash
        working-directory: flux/fleet/terraform
        run: tofu test
