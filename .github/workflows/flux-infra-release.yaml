# Root wiring for infra area releases: tag flux-infra-vX.Y.Z to publish every
# matrix component as oci://ghcr.io/<owner>/home-ops/infra/<component> with
# diff-tag flux-infra-vX.Y.Z and move latest-stable. The home cluster verifies this
# workflow + tag via the cosign subject pinned in
# flux/fleet/tenants/infra.yaml (refs/tags/flux-infra-v\d+\.\d+\.\d+).
# This file carries the triggers and calls the canonical job logic in
# flux/infra/.github/actions/oci-release via the area-local reusable workflow
# flux/infra/.github/workflows/release.yaml (workflow_call).
name: flux-infra-release

# OCI: oci://ghcr.io/<owner>/home-ops/infra/<component>:<flux-infra-vX.Y.Z> + latest-stable.

on:
  push:
    tags:
      - 'flux-infra-v*'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - cilium
          - coredns
          - gateway-api
          - external-secrets
          - metrics-server
          - cert-manager
          - external-dns
          - local-path-provisioner
          - cnpg
          - clickhouse
          - dragonfly
          - seaweedfs
          - multus
          - kubevirt
          - zitadel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish component release
        uses: ./flux/infra/.github/actions/oci-release
        with:
          component: ${{ matrix.component }}
          repository-prefix: ghcr.io/${{ github.repository }}/infra
          source-prefix: flux/infra/components
          diff-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
