# Infra area releases: tag flux-infra-vX.Y.Z to publish every
# matrix component as oci://ghcr.io/<owner>/home-ops/infra/<component> with
# tags stable + stable-X.Y.Z (version stripped from the git ref). The prd cluster verifies this
# workflow + tag via the cosign subject pinned in
# flux/fleet/tenants/infra.yaml (refs/tags/flux-infra-v\d+\.\d+\.\d+).
# Owner: flux/infra
# Future repo: home-ops-infra
# Migration to the dedicated repo (home-ops-infra):
#   1. Copy .github/workflows/flux-infra-release.yaml -> <new-repo>/.github/workflows/release.yaml
#      and .github/actions/flux-infra-oci-release/ -> <new-repo>/.github/actions/oci-release/.
#   2. Flip the monorepo path input to the split value:
#      `source-prefix: flux/infra/components` -> `components`.
#   3. Copy flux/fleet/tenants/infra.yaml -> <new-repo>/tenants/infra.yaml and update
#      the cosign subject pin (drop the `flux/fleet/` prefix).
#   4. Optionally restore the split-ready `workflow_call` inputs
#      (repository-prefix, source-prefix; defaults `''`/`'components'`) that the
#      old area-local release.yaml carried (removed in consolidation) for cross-repo calls.
name: flux-infra-release

# OCI: oci://ghcr.io/<owner>/home-ops/infra/<component>:stable + stable-<version>.

on:
  push:
    tags:
      - 'flux-infra-v*'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - cilium
          - coredns
          - gateway-api
          - external-secrets
          - metrics-server
          - cert-manager
          - external-dns
          - local-path-provisioner
          - cnpg
          - clickhouse
          - dragonfly
          - seaweedfs
          - multus
          - kubevirt
          - zitadel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish component release
        uses: ./.github/actions/flux-infra-oci-release
        with:
          component: ${{ matrix.component }}
          repository-prefix: ghcr.io/${{ github.repository }}/infra
          source-prefix: flux/infra/components
          github-token: ${{ secrets.GITHUB_TOKEN }}
