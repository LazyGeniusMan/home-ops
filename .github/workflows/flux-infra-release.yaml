# Releases flux/infra to GHCR OCI (stable + X.Y.Z) on flux-infra-v* tags.
# Paths: flux-infra-v* tags. Prd verifies via tenants/infra.yaml; keep matrix in parity with flux-infra-push.yaml.
name: flux-infra-release

permissions: {} # deny-all default; publish/sign scopes granted per job below.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # release tags are unique refs; safe to supersede.

on:
  push:
    tags:
      - 'flux-infra-v*'
      - 'flux-infra-v[0-9]*' # in-job semver gate is authoritative.

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - cilium
          - coredns
          - gateway-api
          - tofu-controller
          - external-secrets
          - metrics-server
          - cert-manager
          - external-dns
          - local-path-provisioner
          - cnpg
          - clickhouse
          - dragonfly
          - seaweedfs
          - multus
          - kubevirt
          - zitadel
          - cosi
          - vpa
          - netbird
          - apprise-go-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@746d36fb6147fcb558c0e3e1c8c37d849b56b550 # v2.9.5
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute stable version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME##*-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG_NAME' is not semver (expected *-vX.Y.Z)."
            exit 1
          fi
          echo "STABLE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Lowercase repository
        shell: bash
        run: echo "REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Push artifact
        uses: controlplaneio-fluxcd/distribution/actions/push@746d36fb6147fcb558c0e3e1c8c37d849b56b550 # v2.9.5
        id: push
        with:
          repository: ghcr.io/${{ env.REPO_LC }}/infra/${{ matrix.component }}
          path: flux/infra/components/${{ matrix.component }}
          diff-tag: stable
          tags: ${{ env.STABLE_VERSION }}
      - name: Sign artifact
        if: steps.push.outputs.pushed == 'true'
        shell: bash
        run: cosign sign --yes $DIGEST_URL
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
