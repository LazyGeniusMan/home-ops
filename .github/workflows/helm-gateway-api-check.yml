# Daily check: compares Chart.yaml version against the latest upstream release;
# opens a PR bumping Chart.yaml version + appVersion and the wrapper ref.tag together.
# GitHub releases API (gateway-api, tag v<X.Y.Z> -> chart <X.Y.Z>).
name: helm-gateway-api-check

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:

permissions: {} # deny-all default; check scope granted per job below.

concurrency:
  group: helm-gateway-api-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push version-bump branch
      pull-requests: write # open version-bump PRs with gh
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # SHA-pinned
        with:
          version: v4.53.3 # match .flox yq pin

      - name: Compare Chart.yaml version with upstream latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRAPPER: flux/infra/components/gateway-api/crds/base/standard-install.yaml
        run: |
          CURRENT="$(yq '.version' projects/helm-gateway-api/Chart.yaml)"
          LATEST="$(gh api repos/kubernetes-sigs/gateway-api/releases/latest --jq '.tag_name')"
          LATEST="${LATEST#v}" # strip leading v: tag v<X.Y.Z> -> chart <X.Y.Z>
          echo "current=${CURRENT} latest=${LATEST}"
          export LATEST
          if [ -z "${LATEST}" ]; then
            echo "Could not resolve latest upstream release" >&2
            exit 1
          fi
          if [ "${LATEST}" = "${CURRENT}" ]; then
            echo "Up to date: Chart.yaml already at ${CURRENT}."
            exit 0
          fi
          BRANCH="helm-gateway-api-bump-${LATEST}"
          if gh pr list --head "${BRANCH}" --json number --jq '.[0].number' | grep -qE '[0-9]+'; then
            echo "Bump PR for ${LATEST} already open; skipping."
            exit 0
          fi
          git checkout -b "${BRANCH}"
          yq -i '.version=strenv(LATEST)|.appVersion="v"+strenv(LATEST)' projects/helm-gateway-api/Chart.yaml
          # Atomic hand-bump: wrapper ref.tag must equal Chart.yaml version
          # (no ImagePolicy/marker on first-party Helm OCIRepositories).
          yq -i 'select(.kind == "OCIRepository").spec.ref.tag = strenv(LATEST)' "${WRAPPER}"
          bash projects/helm-gateway-api/ci/fetch.sh --check
          git add "projects/helm-gateway-api/Chart.yaml" "${WRAPPER}"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(helm-gateway-api): bump to ${LATEST}"
          git push -u origin "${BRANCH}"
          gh pr create --fill --head "${BRANCH}" \
            --title "chore(helm-gateway-api): bump to ${LATEST}" \
            --body "Upstream kubernetes-sigs/gateway-api released ${LATEST}" \
              " (Chart.yaml was ${CURRENT}). Merge checklist:" \
              " (1) Chart.yaml + wrapper ref.tag bumped together;" \
              " (2) `bash projects/helm-gateway-api/ci/verify.sh` is green."
