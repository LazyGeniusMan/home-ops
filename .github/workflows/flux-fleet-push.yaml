# Ships flux/fleet to GHCR OCI (dev + dev-<sha>) on main pushes.
# Paths: flux/fleet/**. Runs alongside flux-fleet-validate.
name: flux-fleet-push

permissions: {} # deny-all default; publish/sign scopes granted per job below.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # main pushes supersede; only the latest dev matters.

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'flux/fleet/**'

jobs:
  flux-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@746d36fb6147fcb558c0e3e1c8c37d849b56b550 # v2.9.5
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Lowercase repository
        shell: bash
        run: echo "REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Push artifact
        uses: controlplaneio-fluxcd/distribution/actions/push@746d36fb6147fcb558c0e3e1c8c37d849b56b550 # v2.9.5
        id: push
        with:
          repository: ghcr.io/${{ env.REPO_LC }}/fleet
          path: "./flux/fleet"
          diff-tag: dev
          tags: dev-${{ env.SHORT_SHA }}
      - name: Sign artifact
        if: steps.push.outputs.pushed == 'true'
        shell: bash
        run: cosign sign --yes $DIGEST_URL
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
