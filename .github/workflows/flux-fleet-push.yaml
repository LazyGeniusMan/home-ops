# Root wiring for fleet OCI delivery (main branch -> tag latest).
# GitHub only executes workflows under the repo-root .github/workflows/,
# so this file carries the triggers and mirrors the canonical job defined in
# flux/fleet/.github/workflows/push.yaml (path "./" there maps to
# "./flux/fleet" here).
# On the future per-area repo split, replace this job's steps with:
#   call: <new-repo>/.github/workflows/push.yaml@<ref>   # workflow_call
# and keep the area-local push.yaml as the canonical definition.
name: flux-fleet-push

# OCI: oci://ghcr.io/<owner>/home-ops/fleet:latest (main commits).

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'flux/fleet/**'

jobs:
  flux-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push artifact
        uses: controlplaneio-fluxcd/distribution/actions/push@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
        id: push
        with:
          repository: ghcr.io/${{ github.repository }}/fleet
          path: "./flux/fleet"
          diff-tag: latest
      - name: Sign artifact
        if: steps.push.outputs.pushed == 'true'
        run: cosign sign --yes $DIGEST_URL
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
