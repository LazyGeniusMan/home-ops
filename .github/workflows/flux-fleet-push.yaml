# Root wiring for fleet OCI delivery (main branch -> tag latest).
# GitHub only executes workflows under the repo-root .github/workflows/,
# so this file carries the triggers and calls the canonical job logic in
# flux/fleet/.github/actions/oci-push via the area-local reusable workflow
# flux/fleet/.github/workflows/push.yaml (workflow_call). Reusable workflows
# cannot live in subdirectories, so the executable sharing layer is the
# step-level composite action — the documented pattern for local shared logic.
# On the future per-area repo split, replace this job's steps with:
#   call: <new-repo>/.github/workflows/push.yaml@<ref>   # workflow_call
# and keep the area-local push.yaml as the canonical definition.
name: flux-fleet-push

# OCI: oci://ghcr.io/<owner>/home-ops/fleet:latest (main commits).

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'flux/fleet/**'

jobs:
  flux-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Push fleet artifact
        uses: ./flux/fleet/.github/actions/oci-push
        with:
          repository: ghcr.io/${{ github.repository }}/fleet
          path: "./flux/fleet"
          diff-tag: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
