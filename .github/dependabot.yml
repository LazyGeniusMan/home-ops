# Dependabot: Go modules + GitHub Actions, grouped minor/patch.
# No Renovate config exists in this repo; Dependabot is the update system.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /projects/apprise-go-api
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
  - package-ecosystem: gomod
    directory: /projects/eso-proton-pass
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
  - package-ecosystem: gomod
    directory: /projects/external-dns-netbird
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
