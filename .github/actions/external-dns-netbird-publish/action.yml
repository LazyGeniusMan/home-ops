# Shared publish logic for external-dns-netbird (§6.2).
# Builds and pushes ghcr.io/lazygeniusman/home-ops/infra/external-dns-netbird.
# Owner: projects/external-dns-netbird. Called by .github/workflows/external-dns-netbird.yml
# (via `uses: ./.github/actions/external-dns-netbird-publish`).
# Step-level composite action: the executable sharing layer for this monorepo.
# The caller performs the checkout so this local action resolves.
# On the per-project repo split (future repo: external-dns-netbird) this
# directory moves to <new-repo>/.github/actions/publish/.
name: external-dns-netbird-publish
description: Build and push the external-dns-netbird image.

inputs:
  context:
    description: 'Docker build context, relative to the repository root'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path, relative to the repository root'
    required: false
    default: './Dockerfile'

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ghcr.io/lazygeniusman/home-ops/infra/external-dns-netbird
        flavor: |
          latest=false
        tags: |
          type=raw,value=dev,enable=${{ github.ref_type == 'branch' }}
          type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          type=match,pattern=external-dns-netbird-v(.*),group=1,enable=${{ github.ref_type == 'tag' }}

    - name: Build and push
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
