# Shared fleet release delivery logic: tag flux-fleet-vX.Y.Z to publish
# oci://ghcr.io/<owner>/home-ops/fleet with tags stable + stable-X.Y.Z
# (version stripped from the git ref).
# The prd cluster verifies this workflow + tag via the cosign subject pinned
# in flux/fleet/clusters/acme-prd-bdo1-talos-apps-01/flux-system/flux-instance.yaml.
# Called by .github/workflows/flux-fleet-release.yaml
# (via `uses: ./.github/actions/flux-fleet-oci-release`). Step-level composite
# action: the executable sharing layer for this monorepo.
# On the per-area repo split (future repo: home-ops-fleet) this directory
# moves to <new-repo>/.github/actions/oci-release/ and callers switch to the
# split workflow <new-repo>/.github/workflows/release.yaml.
name: fleet-oci-release
description: Publish the fleet OCI release artifact and sign it with cosign.

inputs:
  repository:
    description: 'Target OCI repository, e.g. ghcr.io/<owner>/home-ops/fleet'
    required: true
  path:
    description: 'Artifact source directory, relative to the repository root'
    required: false
    default: '.'
  github-token:
    description: 'Token used for GHCR login'
    required: true

runs:
  using: composite
  steps:
    - name: Install flux
      uses: controlplaneio-fluxcd/distribution/actions/setup@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - name: Compute stable version
      shell: bash
      run: |
        REF="${{ github.ref_name }}"
        echo "STABLE_VERSION=${REF##*-v}" >> "$GITHUB_ENV"
    - name: Push artifact
      uses: controlplaneio-fluxcd/distribution/actions/push@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
      id: push
      with:
        repository: ${{ inputs.repository }}
        path: ${{ inputs.path }}
        diff-tag: stable
        tags: stable-${{ env.STABLE_VERSION }}
    - name: Sign artifact
      if: steps.push.outputs.pushed == 'true'
      shell: bash
      run: cosign sign --yes $DIGEST_URL
      env:
        DIGEST_URL: ${{ steps.push.outputs.digest-url }}
