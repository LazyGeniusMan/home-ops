# Shared per-component apps OCI delivery logic (main -> tags dev + dev-<sha>).
# Owner: flux/apps. Called by .github/workflows/flux-apps-push.yaml
# (via `uses: ./.github/actions/flux-apps-oci-push`). Unchanged components are
# no-ops (push action only pushes on diff). Step-level composite action: the
# executable sharing layer for this monorepo.
# To onboard an app (§§8-14): add its directory name to the components matrix
# in the caller AND add a matching tenant in flux/fleet/tenants/apps.yaml.
# On the per-area repo split (future repo: home-ops-apps) this directory
# moves to <new-repo>/.github/actions/oci-push/.
name: apps-oci-push
description: Push one apps component OCI artifact and sign it with cosign.

inputs:
  component:
    description: 'Component directory under flux/apps/components (monorepo) or components (split repo)'
    required: true
  repository-prefix:
    description: 'OCI repository prefix, e.g. ghcr.io/<owner>/home-ops/apps'
    required: true
  source-prefix:
    description: 'Artifact source directory prefix, relative to the repository root'
    required: false
    default: 'components'
  github-token:
    description: 'Token used for GHCR login'
    required: true

runs:
  using: composite
  steps:
    - name: Install flux
      uses: controlplaneio-fluxcd/distribution/actions/setup@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - name: Compute short SHA
      shell: bash
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
    - name: Push artifact
      uses: controlplaneio-fluxcd/distribution/actions/push@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
      id: push
      with:
        repository: ${{ inputs.repository-prefix }}/${{ inputs.component }}
        path: ${{ inputs.source-prefix }}/${{ inputs.component }}
        diff-tag: dev
        tags: dev-${{ env.SHORT_SHA }}
    - name: Sign artifact
      if: steps.push.outputs.pushed == 'true'
      shell: bash
      run: cosign sign --yes $DIGEST_URL
      env:
        DIGEST_URL: ${{ steps.push.outputs.digest-url }}
