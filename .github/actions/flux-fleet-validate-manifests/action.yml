# Shared fleet manifest validation logic.
# Owner: flux/fleet. Called by .github/workflows/flux-fleet-validate.yaml
# (via `uses: ./.github/actions/flux-fleet-validate-manifests`). Defaults
# assume the area directory is the repository root (true after the per-area
# repo split to home-ops-fleet, when this directory moves to
# <new-repo>/.github/actions/validate-manifests/); the monorepo caller
# overrides script/validate-dir with flux/-prefixed paths.
name: fleet-validate-manifests
description: Validate fleet manifests with the shared validate script.

inputs:
  script:
    description: 'Validate script, relative to the repository root'
    required: false
    default: './scripts/validate.sh'
  validate-dir:
    description: 'Directory to validate, relative to the repository root'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Setup yq
      uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
    - name: Setup kubeconform
      uses: fluxcd/pkg/actions/kubeconform@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
    - name: Setup kustomize
      uses: fluxcd/pkg/actions/kustomize@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
    - name: Validate manifests
      shell: bash
      run: ${{ inputs.script }} -d ${{ inputs.validate-dir }}
