# Shared fleet Terraform bootstrap validation logic (no backend, no live apply).
# Owner: flux/fleet. Called by .github/workflows/flux-fleet-validate.yaml
# (via `uses: ./.github/actions/flux-fleet-validate-terraform`). The default
# assumes the area directory is the repository root (true after the per-area
# repo split to home-ops-fleet, when this directory moves to
# <new-repo>/.github/actions/validate-terraform/); the monorepo caller
# overrides working-directory.
name: fleet-validate-terraform
description: Validate fleet Terraform bootstrap with OpenTofu.

inputs:
  working-directory:
    description: 'Terraform directory, relative to the repository root'
    required: false
    default: 'terraform'

runs:
  using: composite
  steps:
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
    - name: Init (no backend, no live apply)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: tofu init -backend=false
    - name: Validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: tofu validate
    - name: Test single-source mapping
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: tofu test
