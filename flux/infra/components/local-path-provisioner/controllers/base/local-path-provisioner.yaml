# Local Path Provisioner v0.0.37 (chart == app). Chart oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner.
# Talos UserVolumeConfig mounts at /var/mnt/<name>; exactly one default (local-ssd-nvme); chart built-in class disabled. Volumes are node-local, not snapshottable.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: local-path-provisioner-chart
spec:
  interval: 1h
  url: oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "0.0.37" # {"$imagepolicy": "infra:local-path-provisioner:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  interval: 1h
  releaseName: local-path-provisioner
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: local-path-provisioner-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/rancher/local-path-provisioner/tree/master/deploy/chart/local-path-provisioner
  values:
    # Singleton placeholder: provisioner runs with LeaderElection(false); two
    # replicas would provision/delete PVs concurrently. NO HPA — pinned to 1
    # in dev/prd overlays.
    replicaCount: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
    # Resources: upstream leaves {} by default; provisioner idles except on PV
    # create/delete so requests stay light. Requests pinned for scheduling/QoS,
    # memory-only limit.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    storageClass:
      create: false
    storageClassConfigs:
      local-ssd-nvme:
        storageClass:
          create: true
          defaultClass: true
          defaultVolumeType: hostPath
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
        nodePathMap:
          - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
            paths:
              - /var/mnt/nvme-data
      local-ssd-sata:
        storageClass:
          create: true
          defaultClass: false
          defaultVolumeType: hostPath
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
        nodePathMap:
          - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
            paths:
              - /var/mnt/sata-data
