# Local Path Provisioner v0.0.37 (§9.5): node-local dynamic volumes for the
# prd data layer. Chart: oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner
# (verified tag 0.0.37 == app v0.0.37).
# Talos alignment: UserVolumeConfig volumes mount at /var/mnt/<name>, so
# nvme-data -> /var/mnt/nvme-data and sata-data -> /var/mnt/sata-data
# (talos/clusters/acme-prd-bdo1-talos-apps-01 node patches).
# Default-class discipline: exactly one default — local-ssd-nvme. The base
# storageClass.create=false disables the chart's single built-in class so
# only the two storageClassConfigs below exist.
# Telemetry: none upstream. Monitoring: the chart exposes no metrics
# endpoint/ServiceMonitor; node/volume health is observed via kubelet +
# kube-state-metrics once the monitoring stack lands (see README).
# Backup note: local-path volumes are node-local and NOT snapshottable —
# data services must back up at the operator/app level, not via CSI
# snapshots alone (see README).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: local-path-provisioner-chart
spec:
  interval: 1h
  url: oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "0.0.37" # {"$imagepolicy": "infra:local-path-provisioner:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  interval: 1h
  releaseName: local-path-provisioner
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: local-path-provisioner-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/rancher/local-path-provisioner/tree/master/deploy/chart/local-path-provisioner
  values:
    # Singleton placeholder: provisioner runs with LeaderElection(false)
    # (main.go opts out while the vendored default is true); two replicas
    # would provision/delete PVs concurrently. NO HPA — pinned to 1 in
    # dev/prd overlays (verified against local-path-provisioner-docs/main.go
    # + deploy/provisioner.yaml hardcoded replicas 1).
    replicaCount: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
    # Resources: upstream leaves {} by default ("conscious choice for the
    # user" per deploy/chart/local-path-provisioner/values.yaml); provisioner
    # idles except on PV create/delete so requests stay light. Requests pinned
    # for scheduling/QoS, memory-only limit.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    storageClass:
      create: false
    storageClassConfigs:
      local-ssd-nvme:
        storageClass:
          create: true
          defaultClass: true
          defaultVolumeType: hostPath
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
        nodePathMap:
          - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
            paths:
              - /var/mnt/nvme-data
      local-ssd-sata:
        storageClass:
          create: true
          defaultClass: false
          defaultVolumeType: hostPath
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
        nodePathMap:
          - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
            paths:
              - /var/mnt/sata-data
