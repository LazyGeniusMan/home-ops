# Gateway API standard-channel CRDs v1.6.1 as a first-party Helm OCI chart (no official upstream chart).
# Chart source: projects/helm-gateway-api (Chart.yaml version = upstream release sans v;
# ci/fetch.sh stages standard-install.yaml at publish time; no YAML committed in the chart).
# Standard channel whole: 10 CRDs + safe-upgrades VAP/Binding (experimental not adopted).
# Rendered by the fleet through the prune:false infra-crds Kustomization — CRDs are
# never garbage-collected (see flux/fleet/tenants/infra.yaml). Bump the chart
# (daily check PR -> publish OCI -> bump wrapper ref.tag, human merges) together with
# the Cilium minor pairing (see flux/infra/update-policies/cilium.yaml).
# No $imagepolicy — first-party Helm OCI bumps atomically (Chart.yaml + wrapper ref.tag in one PR, cf. helm-rclone).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gateway-api-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-gateway-api
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Tag MUST equal Chart.yaml `version` in projects/helm-gateway-api (bump
  # Chart.yaml + this ref.tag together; no $imagepolicy marker — Helm
  # OCIRepositories are untracked by image automation).
  ref:
    tag: "1.6.1"
  # No `verify:` block: first-party chart signed at publish time, no pinned
  # upstream identity — same shape as the helm-rclone wrappers.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway-api
spec:
  interval: 1h
  releaseName: gateway-api
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: gateway-api-chart
  install:
    # CreateReplace: chart CRDs advance in place; HelmRelease deletion never
    # cascade-deletes CRs (replicates the prune:false infra-crds intent).
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-gateway-api
