# Base HTTP→HTTPS redirects for the shared Gateway (port 80 is a redirect source
# only; backends attach via per-service HTTPRoutes). The `*.__BASE_DOMAIN__`
# wildcard covers both service and nested subservice shapes. Base holds the
# __BASE_DOMAIN__ placeholder (patched per env).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-apex
spec:
  parentRefs:
    - name: main
      sectionName: http
  hostnames:
    - __BASE_DOMAIN__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-services
spec:
  parentRefs:
    - name: main
      sectionName: http
  hostnames:
    - "*.__BASE_DOMAIN__"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
