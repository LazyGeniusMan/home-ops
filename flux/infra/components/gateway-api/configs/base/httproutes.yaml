# Base HTTPRoutes (§8.1): HTTP→HTTPS redirects for the shared Gateway. EVERY
# route here carries a RequestRedirect filter — port 80 exists only as a
# redirect source; real backends attach via per-service HTTPRoutes (§§11-13).
# Hostname shapes: the apex record, plus the `*.__BASE_DOMAIN__`
# wildcard. Per the Gateway API spec a `*.` hostname matches dots to the
# left, so the wildcard covers BOTH `<service>.__BASE_DOMAIN__` and
# nested `<subservice>.<service>.__BASE_DOMAIN__` shapes.
# Base holds the __BASE_DOMAIN__ placeholder (prd home-ops.yansyah.my.id,
# dev homelab-dev.yansyah.my.id) — patched per environment.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-apex
spec:
  parentRefs:
    - name: main
      sectionName: http
  hostnames:
    - __BASE_DOMAIN__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-services
spec:
  parentRefs:
    - name: main
      sectionName: http
  hostnames:
    - "*.__BASE_DOMAIN__"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
