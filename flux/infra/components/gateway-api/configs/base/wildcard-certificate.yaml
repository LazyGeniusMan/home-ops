# In-namespace wildcard Certificate. cert-manager Secrets are namespace-local, so
# this component mints __WILDCARD_TLS_SECRET__ HERE via ClusterIssuer/letsencrypt
# (same dnsNames pattern; duplicate wildcard orders stay valid). The token
# ExternalSecret mirrors cert-manager/configs/base/cluster-issuer.yaml so the
# DNS-01 solver credential exists in this namespace too.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
---
# SANs: single-level wildcard + nested *.zitadel.<base> (covers the NetBird
# login host login.zitadel.<base> and future zitadel siblings) + nested
# *.coder.<base> (covers coder workspaces `*.coder.<base>` — one route covers
# all workspaces incl. nested app subdomains; coderd multiplexes by subdomain).
# Wildcards match one label only, so *.base covers NEITHER nested shape — both
# nested SANs are load-bearing.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __WILDCARD_CERT_NAME__
spec:
  secretName: __WILDCARD_TLS_SECRET__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.__BASE_DOMAIN__"
    - "*.zitadel.__BASE_DOMAIN__"
    - "*.coder.__BASE_DOMAIN__"
