# Shared Gateway for __BASE_DOMAIN__. HTTP 80 is a redirect source only (see
# httproutes.yaml); HTTPS 443 terminates with the in-namespace wildcard Secret
# (wildcard-certificate.yaml). Listeners accept routes from all namespaces.
# Base holds the __WILDCARD_TLS_SECRET__ placeholder (patched per env).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: __WILDCARD_TLS_SECRET__
      allowedRoutes:
        namespaces:
          from: All
