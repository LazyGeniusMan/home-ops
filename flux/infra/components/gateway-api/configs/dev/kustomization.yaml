apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev Gateway TLS secret (wildcard-homelab-dev-tls).
  - patch: |
      - op: replace
        path: /spec/listeners/1/tls/certificateRefs/0/name
        value: wildcard-homelab-dev-tls
    target:
      kind: Gateway
      name: main
  # Dev hostnames (homelab-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: redirect-apex
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.homelab-dev.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: redirect-services
  # Dev wildcard Certificate (wildcard-homelab-dev).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-homelab-dev
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-homelab-dev-tls
    target:
      kind: Certificate
      name: wildcard-homelab-dev
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-homelab-dev
