# Dev HTTPRoutes (§14): HTTP→HTTPS redirects for the dev Gateway. EVERY
# route here carries a RequestRedirect filter — port 80 exists only as a
# redirect source; dev backends attach via per-service dev HTTPRoutes.
# Hostname shapes: the dev apex, plus the `*.homelab-dev.yansyah.my.id`
# wildcard (Gateway API `*.` matches dots, so nested
# `<sub>.<svc>.homelab-dev.yansyah.my.id` shapes are covered too).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-apex
spec:
  parentRefs:
    - name: main
      sectionName: http
  hostnames:
    - homelab-dev.yansyah.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-services
spec:
  parentRefs:
    - name: main
      sectionName: http
  hostnames:
    - "*.homelab-dev.yansyah.my.id"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
