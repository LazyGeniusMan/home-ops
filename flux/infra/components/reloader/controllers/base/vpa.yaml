# VPA recommender for the reloader Deployment (HPA-paired):
# updateMode Off — recommender-only, because the HPA scales the same CPU
# metric (known-limitations.md: never VPA-apply on a resource HPA scales on).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: reloader
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reloader-reloader
  updatePolicy:
    updateMode: 'Off'
