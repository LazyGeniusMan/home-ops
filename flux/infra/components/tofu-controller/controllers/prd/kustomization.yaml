apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd scaling: tofu-controller stays singleton (upstream single);
  # pin placeholder -> 1.
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: tofu-controller
  # TA discovery: the otel-gateway TargetAllocator object + namespace
  # selectors both match `otel-scrape: "true"` (tenant namespace carries it
  # from the fleet tenants/infra.yaml template). The chart supports
  # metrics.serviceMonitor.labels, so the label lands via this overlay
  # patch — base values stay untouched.
  - patch: |
      - op: add
        path: /spec/values/metrics/serviceMonitor/labels
        value:
          otel-scrape: "true"
    target:
      kind: HelmRelease
      name: tofu-controller
