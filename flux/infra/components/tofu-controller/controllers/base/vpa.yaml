# VPA applier for the tofu-controller Deployment (singleton reconciler, no
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tofu-controller
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tofu-controller
  updatePolicy:
    updateMode: Initial
    minReplicas: 1
