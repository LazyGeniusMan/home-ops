# Tofu Controller v0.16.5 (chart == app). Chart oci://ghcr.io/flux-iac/charts/tofu-controller.
# Runs in its tenant namespace (tofu-controller), not flux-system. Metrics + ServiceMonitor stay off (keep-off decision):
# `metrics.enabled: false` means no endpoint exists to scrape — flipping the monitor would render a monitoring.coreos.com
# resource unconditionally (no skipIfMissing guard) pointing at nothing. Revisit only after monitoring CRDs land via the
# otel pipeline AND `metrics.enabled` is turned on first (see the ESO `renderMode: skipIfMissing` template in
# external-secrets/controllers/base/externalsecrets.yaml).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tofu-controller-chart
spec:
  interval: 1h
  url: oci://ghcr.io/flux-iac/charts/tofu-controller
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "0.16.5" # {"$imagepolicy": "infra:tofu-controller:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  interval: 1h
  releaseName: tofu-controller
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: tofu-controller-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    # CRD policy mirrors upstream docs/release.yaml (chart ships crds/crds.yaml).
    crds: Create
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    crds: CreateReplace
  # https://github.com/flux-iac/tofu-controller (chart 0.16.5, app v0.16.5)
  values:
    # Replica placeholder - singleton, pinned to 1 in dev/prd overlays. NO HPA:
    # only the leader reconciles (use fixed 2-3 if HA is ever wanted).
    replicaCount: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
    concurrency: 24
    # Resource envelope mirrors upstream docs/release.yaml.
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 400m
        memory: 64Mi
    caCertValidityDuration: 24h
    certRotationCheckFrequency: 30m
    image:
      tag: v0.16.5
    # Watch Terraform CRs in every namespace (default true, stated explicitly).
    watchAllNamespaces: true
    # Allow cross-namespace sourceRefs (upstream default false since 0.16.0)
    # so tenant-namespace CRs share the central OCI-sourced artifacts.
    allowCrossNamespaceRefs: true
    # AWS primitive-modules package is irrelevant outside AWS; skip its
    # OCIRepository.
    awsPackage:
      install: false
    runner:
      image:
        tag: v0.16.5
      grpc:
        maxMessageSize: 30
      serviceAccount:
        # Namespaces the chart creates tf-runner ServiceAccounts (+ token
        # Secrets) in (the release namespace is appended automatically).
        # Extend this list when Terraform CRs land anywhere new.
        allowedNamespaces:
          - flux-system
          - zitadel
          - clickstack
          - hubble-ui
          - flux-operator-ui
          - headlamp
          - coder
          - seaweedfs
          - matrix
          - netbird
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
