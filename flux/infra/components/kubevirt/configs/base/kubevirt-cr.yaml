# KubeVirt CR v1.9.0 (extends upstream kubevirt-cr.yaml at https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-cr.yaml per the Talos install guide).
# featureGates LiveMigration + NetworkBindingPlugins (multus); smbios TalosCloud block; workloadUpdateStrategy LiveMigrate (single-node VMIs restart on upgrade).
# No storage knob in the CRD schema (default-class local-ssd-nvme implicit). Monitors unset. No spec.imageTag: operand locks to the operator version.
# {"$imagepolicy": "infra:kubevirt:tag"}
---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates:
        - LiveMigration
        - NetworkBindingPlugins
      useEmulation: false
    imagePullPolicy: IfNotPresent
    smbios:
      sku: "TalosCloud"
      version: "v0.1.0"
      manufacturer: "Talos Virtualization"
      product: "talosvm"
      family: "ccio"
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
