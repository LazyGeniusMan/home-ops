# KubeVirt CR (§13.2): enables virt-operator/api/controller onto the pinned
# v1.9.0 operator from controllers/base/kubevirt-operator.yaml.
# Source shape: upstream kubevirt-cr.yaml at v1.9.0
#   (https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-cr.yaml),
# extended per the Talos install guide (advanced-guides/install-kubevirt.mdx):
#   - featureGates LiveMigration + NetworkBindingPlugins (Multus
#     secondary-net support);
#   - smbios TalosCloud identity block from the upstream guide;
#   - workloadUpdateStrategy LiveMigrate (guide default);
#   - storage: the KubeVirt CRD has no top-level storage field, so
#     default-class local-ssd-nvme is used implicitly;
#   - metrics: upstream defaults (prometheus annotations, no ServiceMonitor
#     namespace/account pinned); telemetry: no phone-home flags upstream,
#     nothing to disable;
#   - unguarded monitors: monitorNamespace/monitorAccount/
#     serviceMonitorNamespace stay UNSET (defaults point at namespaces that
#     do not exist here).
# Version lock: NO spec.imageTag is set here — deliberately. An absent
# imageTag locks the operand to the operator version, so this CR always runs
# the pinned v1.9.0. Do NOT add imageTag to decouple them.
# No `metadata.namespace`: infra-configs applies with targetNamespace=kubevirt.
# infra-configs waits on infra-controllers, so the operator (with fresh RBAC)
# exists before this CR reconciles — keep it.
# {"$imagepolicy": "infra:kubevirt:tag"}
---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates:
        - LiveMigration
        - NetworkBindingPlugins
      useEmulation: false
    imagePullPolicy: IfNotPresent
    smbios:
      sku: "TalosCloud"
      version: "v0.1.0"
      manufacturer: "Talos Virtualization"
      product: "talosvm"
      family: "ccio"
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
