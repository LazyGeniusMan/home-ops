# KubeVirt operator v1.9.0 as a first-party Helm OCI chart (no official upstream chart).
# Chart source: projects/helm-kubevirt (Chart.yaml version = upstream release sans v;
# ci/fetch.sh stages kubevirt-operator.yaml at publish time; no YAML committed in the chart).
# Single chart holds the operator bundle only (operator Deployment + RBAC + KubeVirt CRD);
# the KubeVirt CR stays a Flux manifest in configs/base (operator before CR via
# infra-configs dependsOn infra-controllers). Upgrades N-1 -> N only, operator-first.
# Deletion order CR-first: delete the KubeVirt CR and wait for operands to drain before
# removing this release — deleting the operator first strands the CR Terminating
# behind its finalizer (recovery: strip the finalizer).
# No $imagepolicy — first-party Helm OCI bumps atomically (Chart.yaml + wrapper ref.tag in one PR, cf. helm-rclone).
# NO HPA: the operator Deployment replicas stay 2 per the upstream manifest
# (KubeVirt owns operator scaling itself). base/vpa.yaml (Initial) +
# base/pdb.yaml (minAvailable 1) own sizing/disruption instead.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kubevirt-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-kubevirt
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Tag MUST equal Chart.yaml `version` in projects/helm-kubevirt (bump
  # Chart.yaml + this ref.tag together; no $imagepolicy marker — Helm
  # OCIRepositories are untracked by image automation).
  ref:
    tag: "1.9.0"
  # No `verify:` block: first-party chart signed at publish time, no pinned
  # upstream identity — same shape as the helm-rclone wrappers.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubevirt
spec:
  interval: 1h
  releaseName: kubevirt
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: kubevirt-chart
  install:
    # CreateReplace: chart CRDs advance in place; HelmRelease deletion never
    # cascade-deletes CRs (replicates the old prune:false infra-crds intent).
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-kubevirt
