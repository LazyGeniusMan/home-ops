# VPA recommender for the virt-operator Deployment (upstream manifest, no HPA:
# KubeVirt reconcile until the pod restarts). Selector mirrors the upstream
# manifest matchLabels (`kubevirt.io: virt-operator`).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: virt-operator
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: virt-operator
  updatePolicy:
    updateMode: 'Initial'
