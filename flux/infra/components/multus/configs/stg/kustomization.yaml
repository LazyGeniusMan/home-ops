# Staging tracks the dev cluster (QEMU/KVM virtio NIC eth0), so the NAD
# master is repatched from the production default (enp45s0).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - patch: |
      - op: replace
        path: /spec/config
        value: '{
            "cniVersion": "0.3.1",
            "name": "lan-dhcp",
            "type": "macvlan",
            "master": "eth0",
            "mode": "bridge",
            "ipam": { "type": "dhcp" }
          }'
    target:
      kind: NetworkAttachmentDefinition
      name: lan-dhcp
