apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev node NIC (ens18, QEMU/KVM virtio — same NIC as the Cilium dev
  # L2AnnouncementPolicy and the Talos dev Layer2VIP link).
  - patch: |
      - op: replace
        path: /spec/config
        value: '{
            "cniVersion": "0.3.1",
            "name": "lan-dhcp",
            "type": "macvlan",
            "master": "ens18",
            "mode": "bridge",
            "ipam": { "type": "dhcp" }
          }'
    target:
      kind: NetworkAttachmentDefinition
      name: lan-dhcp
