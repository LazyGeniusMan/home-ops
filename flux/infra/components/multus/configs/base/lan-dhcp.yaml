# lan-dhcp NAD (single-writer: owned here; consumers reference multus/lan-dhcp, never define their own). No metadata.namespace (tenant targetNamespace lands it in multus).
# L2 macvlan bridge; guests DHCP against 192.168.1.1. __NODE_NIC__ placeholder patched per env.
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan-dhcp
spec:
  config: '{
      "cniVersion": "0.3.1",
      "name": "lan-dhcp",
      "type": "macvlan",
      "master": "__NODE_NIC__",
      "mode": "bridge",
      "ipam": { "type": "dhcp" }
    }'
