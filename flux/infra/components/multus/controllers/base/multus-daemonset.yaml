# Multus thick-plugin DaemonSet v4.3.0 as a first-party Helm OCI chart (no
# official upstream chart). Chart source: projects/helm-multus (Chart.yaml
# version = upstream release sans v; ci/fetch.sh stages
# multus-daemonset-thick.yml at publish time and re-applies the ClusterRole
# narrowing + image re-pin as script steps; no YAML committed in the chart).
# Thick mode serves KubeVirt secondary-net (kubevirt waits on multus via the
# fleet: infra-controllers kubevirt dependsOn multus). Node files + NAD CRD
# linger after release deletion (sweep explicitly); privileged/hostNetwork/
# hostPID stay (CNI moves host netns interfaces).
# No $imagepolicy — first-party Helm OCI bumps atomically (cf. helm-rclone).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: multus-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-multus
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Tag MUST equal Chart.yaml `version` in projects/helm-multus (bump
  # Chart.yaml + this ref.tag together; no $imagepolicy marker — Helm
  # OCIRepositories are untracked by image automation).
  ref:
    tag: "4.3.0"
  # No `verify:` block: first-party chart signed at publish time, no pinned
  # upstream identity — same shape as the helm-rclone wrappers.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  interval: 1h
  releaseName: multus
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: multus-chart
  install:
    # CreateReplace: chart CRDs advance in place; HelmRelease deletion never
    # cascade-deletes CRs (replicates the old prune:false infra-crds intent —
    # the NAD CRD ships in this bundle).
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-multus
