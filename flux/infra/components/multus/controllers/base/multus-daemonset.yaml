# Multus thick-plugin DaemonSet v4.3.0 as a first-party Helm OCI chart (no official upstream chart).
# Chart source: projects/helm-multus (Chart.yaml version = upstream release sans v;
# ci/fetch.sh stages multus-daemonset-thick.yml at publish time and re-applies the two
# local narrowings as script steps: ClusterRole narrowing (upstream grants
# k8s.cni.cncf.io:* on verbs * — the chart keeps NAD get/list/watch + pods
# get/list/watch/update + pods/status get/update/patch + events create/patch) and
# image re-pin (upstream ships snapshot-thick placeholders; both image fields re-pin
# together to ghcr.io/k8snetworkplumbingwg/multus-cni:<tag>-thick). No YAML committed
# in the chart. Thick mode serves KubeVirt secondary-net (kubevirt waits on multus via
# the fleet: infra-controllers kubevirt dependsOn multus).
# Node files + NAD CRD linger after release deletion (sweep /opt/cni/bin, /etc/cni/net.d,
# /run, /var/lib/cni/multus; delete NADs/CRD explicitly). privileged:true +
# hostNetwork/hostPID stay (CNI moves host netns interfaces). kube-system namespaces,
# DaemonSet mounts, and the initContainer -t thick arg are owned by the chart now.
# No $imagepolicy — first-party Helm OCI bumps atomically (Chart.yaml + wrapper ref.tag in one PR, cf. helm-rclone-sync).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: multus-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-multus
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Tag MUST equal Chart.yaml `version` in projects/helm-multus (bump
  # Chart.yaml + this ref.tag together; no $imagepolicy marker — Helm
  # OCIRepositories are untracked by image automation).
  ref:
    tag: "4.3.0"
  # No `verify:` block: first-party chart signed at publish time, no pinned
  # upstream identity — same shape as the helm-rclone-sync wrappers.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  interval: 1h
  releaseName: multus
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: multus-chart
  install:
    # CreateReplace: chart CRDs advance in place; HelmRelease deletion never
    # cascade-deletes CRs (replicates the old prune:false infra-crds intent —
    # the NAD CRD ships in this bundle).
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-multus
