# Standalone Corefile for CoreDNS §14 dev (ConfigMap `coredns`, key `Corefile`).
# Mirrors configs/base/corefile.yaml with the dev domain + dev LB VIP:
# homelab-dev.yansyah.my.id -> 192.168.1.249 (apex, single-level, nested).
# Plugin chain: template -> hosts -> forward (same as base).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
data:
  Corefile: |-
    homelab-dev.yansyah.my.id:53 {
        errors
        cache 30
        # Apex: homelab-dev.yansyah.my.id -> gateway LB VIP.
        template IN A {
            match "^homelab-dev\\.yansyah\\.my\\.id\\.$"
            answer "{{ .Name }} 60 IN A 192.168.1.249"
            fallthrough
        }
        # Single-level wildcard: *.homelab-dev.yansyah.my.id -> gateway LB VIP.
        template IN A {
            match "^[^.]+\\.homelab-dev\\.yansyah\\.my\\.id\\.$"
            answer "{{ .Name }} 60 IN A 192.168.1.249"
            fallthrough
        }
        # Nested wildcard: *.*.homelab-dev.yansyah.my.id -> gateway LB VIP.
        template IN A {
            match "^.+\\.homelab-dev\\.yansyah\\.my\\.id\\.$"
            answer "{{ .Name }} 60 IN A 192.168.1.249"
            fallthrough
        }
        # Static host entries (empty by default); falls through to forward.
        hosts {
            fallthrough
        }
        forward . /etc/resolv.conf
        loop
        reload
        loadbalance
    }
