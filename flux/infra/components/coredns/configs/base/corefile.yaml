# Standalone Corefile (ConfigMap coredns): chart ConfigMap skipped (deployment.skipConfig: true), chart Deployment mounts this one.
# Blocks: cluster.local via kubernetes plugin (Talos-managed CoreDNS disabled); __BASE_DOMAIN__ LAN zone (template -> hosts -> forward); `.` catch-all.
# dnsPolicy Default so forward reaches node upstream.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
data:
  Corefile: |-
    cluster.local:53 in-addr.arpa:53 ip6.arpa:53 {
        errors
        # Split cache: short denial TTL absorbs NXDOMAIN storms; success at the kubernetes ttl (30s).
        cache {
            success 9984 30
            denial 9984 5
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf
        loop
        reload
        loadbalance
    }
    __BASE_DOMAIN__:53 {
        errors
        cache 30
        # Apex -> __LB_VIP__.
        template IN A {
            match "^__BASE_DOMAIN_ESCAPED__\\.$"
            answer "{{ .Name }} 60 IN A __LB_VIP__"
            fallthrough
        }
        # Single-level wildcard -> __LB_VIP__.
        template IN A {
            match "^[^.]+\\.__BASE_DOMAIN_ESCAPED__\\.$"
            answer "{{ .Name }} 60 IN A __LB_VIP__"
            fallthrough
        }
        # Nested wildcard -> __LB_VIP__.
        template IN A {
            match "^.+\\.__BASE_DOMAIN_ESCAPED__\\.$"
            answer "{{ .Name }} 60 IN A __LB_VIP__"
            fallthrough
        }
        # Static hosts (empty); falls through to forward.
        hosts {
            fallthrough
        }
        forward . /etc/resolv.conf
        loop
        reload
        loadbalance
    }
    .:53 {
        errors
        health {
            lameduck 10s
        }
        ready
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }
