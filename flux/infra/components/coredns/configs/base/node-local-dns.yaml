# Node-local DNS cache: per-node CoreDNS DaemonSet + upstream Service + cache Corefile. Pods keep the kube-dns VIP (10.96.0.10); the cilium CiliumLocalRedirectPolicy steers it to the same-node cache pod.
# Pod network (no hostNetwork; Cilium LRP replaces the dummy-interface hijack). Image 1.26.8. Upstream Service static 10.96.0.11 (moves with serviceSubnet; see kube-dns.yaml).
# Objects pinned to namespace kube-system (LRP requires same-namespace backends).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-local-dns
  namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: kube-dns-upstream
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: KubeDNSUpstream
spec:
  # Static .10 + 1: cache -> upstream never re-enters the redirect.
  clusterIP: 10.96.0.11
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
  selector:
    app.kubernetes.io/instance: coredns
    app.kubernetes.io/name: coredns
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-local-dns
  namespace: kube-system
data:
  Corefile: |-
    cluster.local:53 {
        errors
        cache {
            success 9984 30
            denial 9984 5
        }
        reload
        loop
        bind 0.0.0.0
        forward . 10.96.0.11 {
            force_tcp
        }
        health :8080
        ready :8181
        prometheus :9253
    }
    in-addr.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 0.0.0.0
        forward . 10.96.0.11 {
            force_tcp
        }
        prometheus :9253
    }
    ip6.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 0.0.0.0
        forward . 10.96.0.11 {
            force_tcp
        }
        prometheus :9253
    }
    .:53 {
        errors
        cache 30
        reload
        loop
        bind 0.0.0.0
        forward . /etc/resolv.conf
        prometheus :9253
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
  selector:
    matchLabels:
      k8s-app: node-local-dns
  template:
    metadata:
      labels:
        k8s-app: node-local-dns
      annotations:
        # Skip conntrack for DNS (cache answers locally; LRP path is eBPF).
        policy.cilium.io/no-track-port: "53"
        prometheus.io/port: "9253"
        prometheus.io/scrape: "true"
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: node-local-dns
      # Pod network (hostNetwork false default) + node resolvers: with LRP
      # the pod never dials cluster DNS itself (upstreams are the .11
      # ClusterIP literal + node /etc/resolv.conf), so Default avoids any
      # 10.96.0.10 self-reference loop.
      dnsPolicy: Default
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: node-cache
          image: registry.k8s.io/dns/k8s-dns-node-cache:1.26.8 # {"$imagepolicy": "infra:node-cache:tag"}
          resources:
            requests:
              cpu: 25m
              memory: 5Mi
            limits:
              memory: 128Mi
          args:
            - -localip
            - 0.0.0.0
            - -conf
            - /etc/Corefile
            - -upstreamsvc
            - kube-dns-upstream
            - -skipteardown=true
            - -setupinterface=false
            - -setupiptables=false
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 9253
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
          # Readiness: the Corefile serves `ready :8181` in the
          # cluster.local block (line 86); unready pods leave the
          # kube-dns-upstream endpoints until the cache is live.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            initialDelaySeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
            - name: kube-dns-config
              mountPath: /etc/kube-dns
      volumes:
        - name: kube-dns-config
          configMap:
            name: kube-dns
            optional: true
        - name: config-volume
          configMap:
            name: node-local-dns
            items:
              - key: Corefile
                path: Corefile.base
