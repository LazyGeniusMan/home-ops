# STG OVERLAY — RESERVED/UNUSED: no cluster renders ./stg (ENVIRONMENT is
# dev on acme-dev-bdo1-talos-apps-01 and prd on acme-prd-bdo1-talos-apps-01;
# ENVIRONMENT=stg exists only on the update automation cluster, which
# reconciles update-policies — not component overlays). The patches below
# mirror prd values so the overlay stays buildable and prd-shaped if a real
# stg environment is ever defined; until then they are inert. Kept (not
# removed) so the {base,dev,stg,prd} layout stays uniform (see
# flux/fleet/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd Corefile (home-ops.yansyah.my.id -> .199) — replaces base placeholder block.
  # The replace carries the full Corefile: the cluster.local + `.` blocks are
  # env-independent (identical in every overlay); only the LAN zone differs.
  - patch: |
      - op: replace
        path: /data/Corefile
        value: |-
              cluster.local:53 in-addr.arpa:53 ip6.arpa:53 {
                  errors
                  cache 30
                  kubernetes cluster.local in-addr.arpa ip6.arpa {
                      pods insecure
                      fallthrough in-addr.arpa ip6.arpa
                      ttl 30
                  }
                  forward . /etc/resolv.conf
                  loop
                  reload
                  loadbalance
              }
              home-ops.yansyah.my.id:53 {
                  errors
                  cache 30
                  # Apex: home-ops.yansyah.my.id -> gateway LB VIP.
                  template IN A {
                      match "^home-ops\\.yansyah\\.my\\.id\\.$"
                      answer "{{ .Name }} 60 IN A 192.168.1.199"
                      fallthrough
                  }
                  # Single-level wildcard: *.home-ops.yansyah.my.id -> gateway LB VIP.
                  template IN A {
                      match "^[^.]+\\.home-ops\\.yansyah\\.my\\.id\\.$"
                      answer "{{ .Name }} 60 IN A 192.168.1.199"
                      fallthrough
                  }
                  # Nested wildcard: *.*.home-ops.yansyah.my.id -> gateway LB VIP.
                  template IN A {
                      match "^.+\\.home-ops\\.yansyah\\.my\\.id\\.$"
                      answer "{{ .Name }} 60 IN A 192.168.1.199"
                      fallthrough
                  }
                  # Static host entries (empty by default); falls through to forward.
                  hosts {
                      fallthrough
                  }
                  forward . /etc/resolv.conf
                  loop
                  reload
                  loadbalance
              }
              .:53 {
                  errors
                  health {
                      lameduck 10s
                  }
                  ready
                  forward . /etc/resolv.conf
                  cache 30
                  loop
                  reload
                  loadbalance
              }
    target:
      kind: ConfigMap
      name: coredns
