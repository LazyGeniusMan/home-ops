# kube-dns front door + RBAC for the Flux-managed CoreDNS (§8.3).
# Talos-managed CoreDNS is disabled (KubeCoreDNSConfig enabled: false), so no
# kube-dns Service exists; kubelets default clusterDNS to 10.96.0.10 (Talos
# default service subnet; no repo overrides), which must resolve
# *.cluster.local. This static-ClusterIP Service selects the chart pods; its
# selector pins the stable app.kubernetes.io labels so it keeps matching
# across the isClusterService flip (which adds the k8s-app label to pods).
# The explicit `namespace: kube-system` survives the tenant targetNamespace
# (cf. multus precedent for explicit kube-system namespaces).
# RBAC mirrors the chart's own ClusterRole (endpoints/services/pods/
# namespaces + endpointslices list+watch) but binds the standalone
# ServiceAccount `coredns`, which the chart Deployment runs as (via
# serviceAccount.name; chart rbac.create is false so it does not render a
# duplicate ClusterRole/coredns).
---
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: CoreDNS
spec:
  clusterIP: 10.96.0.10
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
  selector:
    app.kubernetes.io/instance: coredns
    app.kubernetes.io/name: coredns
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns
  namespace: coredns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coredns
rules:
  - apiGroups:
      - ""
    resources:
      - endpoints
      - services
      - pods
      - namespaces
    verbs:
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coredns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coredns
subjects:
  - kind: ServiceAccount
    name: coredns
    namespace: coredns
