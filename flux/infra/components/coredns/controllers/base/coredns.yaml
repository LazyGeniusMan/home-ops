# CoreDNS v1.14.7 (§8.3): in-cluster DNS for the home-ops Tailnet edge.
# Deployed at bootstrap alongside Cilium (§8.2) so cluster DNS is live before
# any workload that resolves *.home-ops.yansyah.my.id lands.
# Chart: coredns/coredns via classic HelmRepository (chart 1.47.0 carries app
# 1.14.6; app image pinned to 1.14.7 explicitly — see README for the
# OCI-first justification). App image verified live on Docker Hub.
# Telemetry: no usage-reporting/telemetry keys in chart values (verified:
# non-comment values lines matching telemetry|usageReporting|phoneHome|
# analytics are empty), so there is nothing to switch off.
# Monitoring: prometheus scrape annotations on (safe without a stack);
# ServiceMonitor stays disabled until monitoring.coreos.com CRDs land.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: coredns
spec:
  interval: 1h
  url: https://coredns.github.io/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  interval: 1h
  releaseName: coredns
  serviceAccountName: flux
  chart:
    spec:
      chart: coredns
      version: 1.47.0 # {"$imagepolicy": "infra:coredns:tag"}
      sourceRef:
        kind: HelmRepository
        name: coredns
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/coredns/helm/tree/master/charts/coredns
  values:
    image:
      repository: coredns/coredns
      tag: 1.14.7
    # Cluster DNS fronted by the standalone kube-dns Service (kube-dns.yaml):
    # isClusterService adds the k8s-app labels, the CriticalAddonsOnly
    # toleration, and (critically) dnsPolicy Default, so
    # `forward . /etc/resolv.conf` reaches the node upstream instead of
    # looping back into the 10.96.0.10 cluster DNS IP.
    isClusterService: true
    # Run as the standalone ServiceAccount (bound to ClusterRole coredns in
    # kube-dns.yaml); the chart must not render its own RBAC, which would
    # collide on the ClusterRole/coredns name and bind the wrong subject.
    serviceAccount:
      name: coredns
    rbac:
      create: false
    # The chart-owned ConfigMap would collide with configs/base/corefile.yaml
    # (both render <fullname>/Corefile), so skip it; the Deployment still
    # mounts config-volume from the standalone ConfigMap of the same name.
    deployment:
      skipConfig: true
      # Pinned to the pre-flip selector: flipping isClusterService changes the
      # default selector (adds k8s-app), and Deployment selectors are
      # immutable — without this pin the Helm upgrade would fail.
      selector:
        matchLabels:
          app.kubernetes.io/instance: coredns
          app.kubernetes.io/name: coredns
    # The servers: chain only carries the default "." zone; the
    # home-ops.yansyah.my.id zone block lives in the standalone ConfigMap.
    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            parameters: 30
          - name: loop
          - name: reload
          - name: loadbalance
    prometheus:
      service:
        enabled: true
      monitor:
        enabled: false
