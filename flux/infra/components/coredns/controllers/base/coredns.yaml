# CoreDNS chart 1.47.1 (app pinned to 1.14.7). Chart oci://ghcr.io/coredns/charts/coredns.
# Deployed at bootstrap alongside Cilium. ServiceMonitor disabled until monitoring.coreos.com CRDs land.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coredns-chart
spec:
  interval: 1h
  url: oci://ghcr.io/coredns/charts/coredns
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.47.1 # {"$imagepolicy": "infra:coredns:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  interval: 1h
  releaseName: coredns
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: coredns-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/coredns/helm/tree/master/charts/coredns
  values:
    # Replica seed - the out-of-band HPA in hpa.yaml owns the count at runtime
    # (chart 1.47.1 has no autoscaling knob — the CPA sub-chart stays
    # disabled). Dev seeds 1, prd seeds 2.
    # (Chart already defaults CPU requests 100m, so targetCPU has a denominator.)
    replicaCount: 1 # placeholder - overridden by dev/prd overlays
    # Resources: chart 1.47.1 defaults pinned explicit. CPU requests
    # REQUIRED for the targetCPU HPA denominator.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
    image:
      repository: coredns/coredns
      tag: 1.14.7
    # isClusterService adds the k8s-app labels, the CriticalAddonsOnly
    # toleration, and dnsPolicy Default, so `forward . /etc/resolv.conf`
    # reaches the node upstream instead of looping back into 10.96.0.10.
    isClusterService: true
    # Run as the standalone ServiceAccount (bound to ClusterRole coredns in
    # kube-dns.yaml); the chart must not render its own RBAC, which would
    # collide on the ClusterRole/coredns name and bind the wrong subject.
    serviceAccount:
      name: coredns
    rbac:
      create: false
    # The chart-owned ConfigMap would collide with configs/base/corefile.yaml
    # (both render <fullname>/Corefile), so skip it; the Deployment still
    # mounts config-volume from the standalone ConfigMap of the same name.
    deployment:
      skipConfig: true
      # Pinned to the pre-flip selector: flipping isClusterService changes the
      # default selector (adds k8s-app), and Deployment selectors are
      # immutable — without this pin the Helm upgrade would fail.
      selector:
        matchLabels:
          app.kubernetes.io/instance: coredns
          app.kubernetes.io/name: coredns
    # The servers: chain only carries the default "." zone; the
    # home-ops.yansyah.my.id zone block lives in the standalone ConfigMap.
    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            parameters: 30
          - name: loop
          - name: reload
          - name: loadbalance
    prometheus:
      service:
        enabled: true
      monitor:
        enabled: false
