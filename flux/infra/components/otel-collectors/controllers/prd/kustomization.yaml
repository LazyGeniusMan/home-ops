apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd database: replaces the __OTEL_DATABASE__ shape in base collectors.yaml
  # (real field /spec/config/exporters/clickhouse/database).
  - patch: |
      - op: replace
        path: /spec/config/exporters/clickhouse/database
        value: otel_prd
    target:
      kind: OpenTelemetryCollector
      name: otel-gateway
