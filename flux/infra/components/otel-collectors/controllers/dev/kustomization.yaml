apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev scaling: stateful gateway placeholder -> 1.
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: OpenTelemetryCollector
      name: otel-gateway
  # Dev database: replaces the __OTEL_DATABASE__ shape in base collectors.yaml
  # (real field /spec/config/exporters/clickhouse/database).
  - patch: |
      - op: replace
        path: /spec/config/exporters/clickhouse/database
        value: otel_dev
    target:
      kind: OpenTelemetryCollector
      name: otel-gateway
  # Dev drain-safety: single replica cannot tolerate maxUnavailable: 1, so pin
  # maxUnavailable: 0 (eviction blocked while the only pod would go down).
  - patch: |
      - op: replace
        path: /spec/podDisruptionBudget/maxUnavailable
        value: 0
    target:
      kind: OpenTelemetryCollector
      name: otel-gateway
