# ClickHouse auth for the gateway exporter: `default` user + empty password
# (shared infra CHI defines no users) via the cluster-wide proton-pass store.
# `__PROTON_PASS_BASE__` is an overlay-replaced placeholder
# (pass://<cluster>/otel-collectors/clickhouse-password).
# The gateway reads CLICKHOUSE_PASSWORD from this Secret (env source via the
# operator's pod env wiring); endpoint stays plaintext TCP/9000 in-cluster.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-clickhouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: otel-clickhouse
    template:
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/otel-collectors/clickhouse-password
