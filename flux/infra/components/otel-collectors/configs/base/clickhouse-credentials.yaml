# ClickHouse auth for the gateway exporter: dedicated `otel` CHI user via the
# cluster-wide proton-pass store (password from the same vault field as the
# CHI's `clickhouse-auth` Secret). `__PROTON_PASS_BASE__` is overlay-replaced
# (pass://<cluster>/otel-collectors/clickhouse-password — seed with the SAME
# value as pass://<cluster>/clickhouse/otel-password: one password, two vault
# mirrors, since the CHI and gateway cannot share one Secret across
# namespaces). The gateway reads CLICKHOUSE_PASSWORD from this Secret (env
# source); endpoint stays plaintext TCP/9000 in-cluster. Rotation takes effect
# on pod restart (no Reloader coverage on OpenTelemetryCollector CRs).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-clickhouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: otel-clickhouse
    template:
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/otel-collectors/clickhouse-password
