# ClickHouse auth for the gateway exporter: dedicated `otel` CHI user (password
# from the same vault field as the CHI's `clickhouse-auth` Secret) via the
# cluster-wide proton-pass store. `__PROTON_PASS_BASE__` is an overlay-replaced
# placeholder (pass://<cluster>/otel-collectors/clickhouse-password); seed it
# with the SAME value as pass://<cluster>/clickhouse/otel-password (one password,
# two vault mirrors — the CHI and the gateway cannot share one Secret object
# across namespaces, so both ExternalSecrets read the same password).
# The gateway reads CLICKHOUSE_PASSWORD from this Secret (env source via the
# operator's pod env wiring); endpoint stays plaintext TCP/9000 in-cluster.
# Reloader coverage: the operator propagates env-sourced Secret changes into the
# gateway StatefulSet on its next reconcile; no reloader annotation exists on
# OpenTelemetryCollector CRs (Reloader watches Deployments/StatefulSets
# directly, not operator-owned CRs). Rotation takes effect on pod restart.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-clickhouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: otel-clickhouse
    template:
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/otel-collectors/clickhouse-password
