apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd Proton vault + database (same shape as dev, prd segment).
  # Same password as pass://acme-prd-bdo1-talos-apps-01/clickhouse/otel-password
  # (one password, two vault mirrors — see configs/base/clickhouse-credentials.yaml).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/otel-collectors/clickhouse-password
    target:
      kind: ExternalSecret
      name: otel-clickhouse
