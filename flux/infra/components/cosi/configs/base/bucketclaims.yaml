# COSI-managed buckets for the SeaweedFS S3 consumers (central claims, one per
# live bucket — all land in the `cosi` tenant namespace via this
# kustomization's `namespace:` field).
# - Claims use BucketClass/seaweedfs, protocol S3. The central controller
#   creates the cluster-scoped Bucket; the driver (DriverCreateBucket =
#   req.GetName()) provisions the live bucket in SeaweedFS under a
#   controller-generated name (`bc-<uuid>`) — claim/access names do NOT map
#   to pre-existing bucket names, so `spec.existingBucketName` is intentionally
#   unset (it imports a manually pre-created cluster-scoped Bucket object,
#   not a SeaweedFS-side bucket).
# - Existing out-of-band buckets (`cnpg-backups`, `dragonfly-backups`,
#   `clickhouse`, `rclone-vault`) keep serving traffic until cutover: copy
#   data to the COSI-provisioned bucket (see cosi README "Bucket cutover"),
#   then repoint consumers at the new bucket/prefix.
# - Each BucketAccess (BucketAccessClass/seaweedfs-key, authenticationType
#   KEY) mints S3 keys into its `credentialsSecretName` Secret as a `BucketInfo`
#   JSON file (secretS3.endpoint/region/accessKeyID/accessSecretKey). The
#   driver hands back the INTERNAL endpoint
#   (http://seaweed-main-s3.seaweedfs:8333) — same contract as the consumer
#   endpoint switch in this change.
# - Credential bridge: the COSI secrets live in the `cosi` namespace while
#   consumers read same-namespace ExternalSecrets (Proton Pass) today, so the
#   existing ExternalSecrets stay the auth source of truth for now. To migrate
#   a consumer to COSI keys, copy `accessKeyID`/`accessSecretKey` out of the
#   BucketInfo JSON into that consumer's Proton Pass entries
#   (pass-cli seed), keeping the ExternalSecret shape unchanged. Do NOT point
#   consumers at the cosi-namespace Secret directly (cross-namespace refs).
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: cnpg-backups
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: cnpg-backups-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: cnpg-backups
  credentialsSecretName: cnpg-backups-cosi-creds
  protocol: S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: dragonfly-backups
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: dragonfly-backups-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: dragonfly-backups
  credentialsSecretName: dragonfly-backups-cosi-creds
  protocol: S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: clickhouse
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: clickhouse-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: clickhouse
  credentialsSecretName: clickhouse-cosi-creds
  protocol: S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: rclone-vault
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: rclone-vault-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: rclone-vault
  credentialsSecretName: rclone-vault-cosi-creds
  protocol: S3
