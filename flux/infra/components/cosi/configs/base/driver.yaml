# SeaweedFS COSI driver (mirrors upstream seaweedfs chart templates/cosi/
# cosi-deployment.yaml; auth/TLS branches dropped — plain in-cluster gRPC).
# Two containers share an emptyDir socket at /var/lib/cosi/cosi.sock:
# - seaweedfs-cosi-driver: the provisioner gRPC server (driver binary embeds
#   provisioner sidecar server via NewDefaultCOSIProvisionerServer). Env per
#   cmd/seaweedfs-cosi-driver/main.go: DRIVERNAME (default
#   seaweedfs.objectstorage.k8s.io), COSI_ENDPOINT (default
#   unix:///var/lib/cosi/cosi.sock), SEAWEEDFS_FILER (filer gRPC —
#   seaweed-main-filer.seaweedfs:8888, same as the CSI HelmRelease), ENDPOINT
#   (S3 URL handed back in BucketAccess secrets as secretS3.endpoint —
#   internal ClusterIP http://seaweed-main-s3.seaweedfs:8333 so credentials
#   work in-cluster without hairpinning), REGION (us-east-1 — SeaweedFS
#   ignores region; required non-empty by some S3 clients).
# - seaweedfs-cosi-sidecar: release-0.2 objectstorage-sidecar (Bucket +
#   BucketAccess listeners, --driver-addr unix:///var/lib/cosi/cosi.sock),
#   the release-0.2 counterpart of the chart's staging sidecar pin.
# Images: driver ghcr.io/seaweedfs/seaweedfs-cosi-driver:v0.1.2 (matches the
# chart default; quay.io/seaweedfs repo is disabled/unauthenticated).
# Driver binary runs as UID 65532 (distroless static); sidecar runs as
# nonroot (distroless static:nonroot).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-cosi-driver
  labels:
    app.kubernetes.io/name: seaweedfs-cosi-driver
    app.kubernetes.io/component: objectstorage-provisioner
    app.kubernetes.io/part-of: container-object-storage-interface
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-cosi-driver
      app.kubernetes.io/component: objectstorage-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-cosi-driver
        app.kubernetes.io/component: objectstorage-provisioner
    spec:
      serviceAccountName: seaweedfs-cosi-driver
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: seaweedfs-cosi-driver
          image: ghcr.io/seaweedfs/seaweedfs-cosi-driver:v0.1.2 # {"$imagepolicy": "infra:cosi-driver:tag"}
          imagePullPolicy: IfNotPresent
          env:
            - name: DRIVERNAME
              value: seaweedfs.objectstorage.k8s.io
            - name: COSI_ENDPOINT
              value: unix:///var/lib/cosi/cosi.sock
            - name: SEAWEEDFS_FILER
              value: seaweed-main-filer.seaweedfs:8888
            - name: ENDPOINT
              value: http://seaweed-main-s3.seaweedfs:8333
            - name: REGION
              value: us-east-1
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket
        - name: seaweedfs-cosi-sidecar
          image: gcr.io/k8s-staging-sig-storage/objectstorage-sidecar:v20250711-controllerv0.2.0-rc1-80-gc2f6e65 # {"$imagepolicy": "infra:cosi-sidecar:tag"}
          imagePullPolicy: IfNotPresent
          args:
            - --v=5
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket
      volumes:
        - name: socket
          emptyDir: {}
