# COSI CRDs (5 objectstorage.k8s.io/v1alpha1 files) v0.2.2 as a first-party Helm OCI chart.
# Chart source: projects/helm-cosi (Chart.yaml version = upstream release sans v;
# ci/fetch.sh stages all 5 files at publish time; no YAML committed in the chart).
# All 5 CRDs bump together; stays v0.2.x (SeaweedFS driver compat, see
# flux/infra/update-policies/seaweedfs.yaml caps). Rendered by the fleet through
# the prune:false infra-crds Kustomization — CRDs are never garbage-collected
# (see flux/fleet/tenants/infra.yaml).
# No $imagepolicy — first-party Helm OCI bumps atomically (Chart.yaml + wrapper ref.tag in one PR, cf. helm-rclone).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cosi-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-cosi
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Tag MUST equal Chart.yaml `version` in projects/helm-cosi (bump
  # Chart.yaml + this ref.tag together; no $imagepolicy marker — Helm
  # OCIRepositories are untracked by image automation).
  ref:
    tag: "0.2.2"
  # No `verify:` block: first-party chart signed at publish time, no pinned
  # upstream identity — same shape as the helm-rclone wrappers.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cosi
spec:
  interval: 1h
  releaseName: cosi
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: cosi-chart
  install:
    # CreateReplace: chart CRDs advance in place; HelmRelease deletion never
    # cascade-deletes CRs (replicates the prune:false infra-crds intent).
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-cosi
