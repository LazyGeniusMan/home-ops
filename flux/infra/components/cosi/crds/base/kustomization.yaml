# COSI CRDs (5 objectstorage.k8s.io/v1alpha1 files) v0.2.2 as a first-party
# Helm OCI chart (Chart source: projects/helm-cosi).
# CRDs are never garbage-collected (see flux/fleet/tenants/infra.yaml).
# Base holds the single wrapper; dev/prd track ../base with no patches
# (no per-env CRD forks). Bump: Chart.yaml + wrapper ref.tag together.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cosi-crds.yaml
