# COSI BucketClass CRD (Cluster-scoped, objectstorage.k8s.io/v1alpha1) — SeaweedFS class parameters live in the seaweedfs component).
# Pure vendor copy of tag v0.2.2, client/config/crd/objectstorage.k8s.io_bucketclasses.yaml:
# https://github.com/kubernetes-sigs/container-object-storage-interface/tree/v0.2.2/client/config/crd
# (verified byte-identical 2026-09-24; do NOT hand-edit — re-vendor all 5
# files together from the tag to bump). Pins + caps move together:
# controller/sidecar images (v0.2.2) + semver ranges
# (flux/infra/update-policies/cosi.yaml, seaweedfs.yaml, all <0.3.0) stay on
# the v0.2.x line; do NOT track main (v1alpha2, incompatible with the
# SeaweedFS driver). Renders through the fleet's prune:false infra-crds
# Kustomization (see flux/fleet/tenants/infra.yaml).
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: bucketclasses.objectstorage.k8s.io
spec:
  group: objectstorage.k8s.io
  names:
    kind: BucketClass
    listKind: BucketClassList
    plural: bucketclasses
    singular: bucketclass
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          deletionPolicy:
            default: Retain
            description: |-
              DeletionPolicy is used to specify how COSI should handle deletion of this
              bucket. There are 2 possible values:
               - Retain: Indicates that the bucket should not be deleted from the OSP
               - Delete: Indicates that the bucket should be deleted from the OSP
                     once all the workloads accessing this bucket are done
            type: string
          driverName:
            description: DriverName is the name of driver associated with this bucket
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          parameters:
            additionalProperties:
              type: string
            description: |-
              Parameters is an opaque map for passing in configuration to a driver
              for creating the bucket
            type: object
        required:
        - deletionPolicy
        - driverName
        type: object
    served: true
    storage: true
