# PDB for the HPA-scaled COSI controller (leader-elected): keep 1 replica
# during voluntary disruption so bucket provisioning stays up.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: controller
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: container-object-storage-interface-controller
