# HPA for the COSI central controller (leader-elected, so multi-replica is
# safe; RBAC already grants coordination.k8s.io/leases in namespace cosi).
# Autoscaling prerequisite (not managed here): metrics-server healthy
# (flux/infra/components/metrics-server).
# Bounds per env via the dev/prd overlay patches: dev min 1/max 2, prd min
# 2/max 4. Base replicas: 1 is the create-time seed, HPA owns runtime count.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: controller
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: controller
  minReplicas: 1 # placeholder - overridden by dev/prd overlays
  maxReplicas: 2 # placeholder - overridden by dev/prd overlays
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
