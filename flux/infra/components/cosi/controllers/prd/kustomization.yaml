apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd autoscaling: HPA controller min 2/max 4 (pinned image elects via
  # internal/runtime unconditionally). No Deployment /spec/replicas patch:
  # base replicas: 1 is the create-time seed, HPA owns runtime count.
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: controller
