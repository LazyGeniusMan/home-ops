apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd HA scaling: replica seeds -> 2 (all three Deployments are
  # leader-elected); out-of-band HPAs own the count (min 2/max 4, base values).
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 2
      - op: replace
        path: /spec/values/webhook/replicaCount
        value: 2
      - op: replace
        path: /spec/values/cainjector/replicaCount
        value: 2
    target:
      kind: HelmRelease
      name: cert-manager
