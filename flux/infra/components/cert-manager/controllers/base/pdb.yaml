# PDBs for the HPA-scaled cert-manager Deployments (all leader-elected):
# keep 1 replica during voluntary disruption so issuance + webhook admission
# stay up. Dev runs min 1 — minAvailable 1 means "evict nothing" there.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cert-manager
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/instance: cert-manager
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cert-manager-webhook
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook
      app.kubernetes.io/instance: cert-manager
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cert-manager-cainjector
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cainjector
      app.kubernetes.io/instance: cert-manager
