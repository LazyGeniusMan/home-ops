apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev scaling: replica seeds -> 1; out-of-band HPAs own the count (min 1/max 2).
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
      - op: replace
        path: /spec/values/webhook/replicaCount
        value: 1
      - op: replace
        path: /spec/values/cainjector/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: cert-manager
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: cert-manager
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: cert-manager-webhook
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: cert-manager-cainjector
  # TA discovery: the otel-gateway TargetAllocator object + namespace
  # selectors both match `otel-scrape: "true"` (tenant namespace carries it
  # from the fleet tenants/infra.yaml template). The chart spells the knob
  # `servicemonitor` (lowercase sm), so the label lands via this overlay
  # patch — base values stay untouched.
  - patch: |
      - op: add
        path: /spec/values/prometheus/servicemonitor/labels
        value:
          otel-scrape: "true"
    target:
      kind: HelmRelease
      name: cert-manager
