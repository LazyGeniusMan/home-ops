# Cloudflare DNS-01 ClusterIssuer (§9.3). The API token is synced by ESO from
# Proton Pass (pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token);
# the token needs Zone:Read + DNS:Edit on the home-ops.yansyah.my.id zone.
# ACME server is set per environment (production/staging overlays); the base
# intentionally leaves it unset like the upstream D2 reference.
# Renewal: cert-manager renews at 2/3 of the issued lifetime automatically;
# chart bumps flow through update-policies/cert-manager.yaml + PR automation.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: hostmaster@home-ops.yansyah.my.id
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
