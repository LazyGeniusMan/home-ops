# Cloudflare DNS-01 ClusterIssuer (§9.3). The API token is synced by ESO from
# Proton Pass (__PROTON_PASS_BASE__/cert-manager/cloudflare-api-token);
# the token needs Zone:Read + DNS:Edit on the __BASE_DOMAIN__ zone.
# ACME server is set per environment (prd/stg overlays); the base
# intentionally leaves it unset like the upstream D2 reference.
# Renewal: cert-manager renews at 2/3 of the issued lifetime automatically;
# chart bumps flow through update-policies/cert-manager.yaml + PR automation.
# PREREQUISITE (ordering): the ExternalSecret above resolves through
# ClusterSecretStore/proton-pass (external-secrets configs/) — it reports
# Ready=False until the store is Ready (webhook Deployment + out-of-band
# proton-pass-pat bootstrap; see the external-secrets README). The
# ClusterIssuer cannot issue, and the wildcard Certificate stays NotReady,
# until the cloudflare-api-token Secret syncs. Cross-tenant ordering is owned
# by tenants/*.yaml (parallel task — do not add it here). Fresh-cluster
# NotReady is EXPECTED and heals via ESO refreshInterval (1h) +
# cert-manager retries; alert past ~10m.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: __ACME_EMAIL__
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
