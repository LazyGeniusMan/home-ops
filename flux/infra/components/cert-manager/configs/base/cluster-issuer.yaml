# Cloudflare DNS-01 ClusterIssuer. Token from __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token (Zone:Read + DNS:Edit on __BASE_DOMAIN__).
# ACME server unset in base, set per env. Renewal automatic (2/3 lifetime).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: __ACME_EMAIL__
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
