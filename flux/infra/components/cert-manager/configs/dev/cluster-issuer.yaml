# Dev Cloudflare DNS-01 ClusterIssuer (§14). API token synced by ESO from
# the DEV Proton Pass vault (pass://acme-dev-bdo1-talos-apps-01/...); the
# token needs Zone:Read + DNS:Edit on the homelab-dev.yansyah.my.id zone.
# ACME server is set by the dev kustomization patch (LE prod, real dev
# certs); the base intentionally leaves it unset.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: hostmaster@homelab-dev.yansyah.my.id
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
