# Dev wildcard certificate (§14). Lives in the cert-manager namespace so
# Ready status is observable next to the issuer. Re-issues
# *.homelab-dev.yansyah.my.id (dev counterpart of the prd wildcard).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-homelab-dev
spec:
  secretName: wildcard-homelab-dev-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.homelab-dev.yansyah.my.id"
