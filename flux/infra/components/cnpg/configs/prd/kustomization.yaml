apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd S3 endpoint + wildcard DNS. (S3 keys are COSI-minted via the
  # in-namespace cnpg-cosi SecretStore — no per-env vault ref patch for
  # cnpg-s3-credentials, rclone-cnpg-backups-s3, or
  # rclone-cnpg-backups-s3-path.)
  # Prd rclone-sync-cnpg-backups identity: Proton Pass vault keys + the
  # Proton Drive destination cluster segment (base holds __PROTON_PASS_BASE__
  # / __CLUSTER_NAME__ placeholders).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cnpg/rclone-proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cnpg/rclone-proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backup/acme-prd-bdo1-talos-apps-01/cnpg/cnpg-backups
    target:
      kind: HelmRelease
      name: rclone-sync-cnpg-backups
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Cluster
      name: postgres-base
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.postgres.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-postgres
  # Prd production HA: pin the stateful placeholder to 3 instances.
  - patch: |
      - op: replace
        path: /spec/instances
        value: 3
    target:
      kind: Cluster
      name: postgres-base
