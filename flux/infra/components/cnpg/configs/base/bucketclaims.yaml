# COSI bucket cnpg-backups (BucketClass/seaweedfs, S3) for postgres-base WAL + base backups (s3://cnpg-backups/postgres/).
# Live bucket provisions under a controller-generated name (bc-<uuid>); s3:// prefix must pre-exist. Keys via same-namespace ExternalSecrets.
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: cnpg-backups
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: cnpg-backups-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: cnpg-backups
  credentialsSecretName: cnpg-backups-cosi-creds
  protocol: S3
