# S3 to Proton Drive backup of the cnpg-backups bucket (postgres-base WAL + base backups): mirrors <live-bucket>/cnpg-backups/postgres/ to /home-ops/backups/<cluster>/cnpg/cnpg-backups (sync, daily 03:45, Forbid; rclone 1.75.0).
# Live bucket via BucketInfo.spec.bucketName through the cnpg-cosi store. Per-instance clusters ship their own syncs.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-cnpg-backups-s3-path
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cnpg-cosi
    kind: SecretStore
  target:
    name: rclone-cnpg-backups-s3-path
    template:
      data:
        path: "{{ .bucketName }}/cnpg-backups/postgres/"
  data:
    - secretKey: bucketName
      remoteRef:
        key: cnpg-backups-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-cnpg-backups-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cnpg-cosi
    kind: SecretStore
  target:
    name: rclone-cnpg-backups-s3
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: cnpg-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: cnpg-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-proton-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: rclone-proton-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/proton-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/proton-password
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: helm-rclone-sync-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-rclone-sync
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Chart tag MUST equal Chart.yaml version in projects/helm-rclone-sync; bump
  # Chart.yaml + all six consumers in one commit.
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-sync-cnpg-backups
spec:
  interval: 1h
  releaseName: rclone-sync-cnpg-backups
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-rclone-sync
  values:
    schedule: "45 3 * * *"
    concurrencyPolicy: Forbid
    rclone:
      operation: sync
    source:
      type: s3
      remoteName: ""
      uri:
        esoRef:
          name: rclone-cnpg-backups-s3-path
          key: path
      credentials:
        provider:
          value: AWS
        accessKeyId:
          esoRef:
            name: rclone-cnpg-backups-s3
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: rclone-cnpg-backups-s3
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      remoteName: ""
      uri:
        value: /home-ops/backups/__CLUSTER_NAME__/cnpg/cnpg-backups
      credentials:
        username:
          esoRef:
            name: rclone-proton-credentials
            key: username
        password:
          esoRef:
            name: rclone-proton-credentials
            key: password
