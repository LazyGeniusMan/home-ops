# S3 -> Proton Drive backup of the `cnpg-backups` COSI bucket (colocated with
# the consuming component — lands in the `cnpg` tenant namespace via the Fleet
# `infra-configs` Kustomization's `targetNamespace`). One HelmRelease for this
# base/template bucket, per the colocated-backup rule (centralized backup is
# out of scope).
#
# What it syncs: the SeaweedFS bucket provisioned for BucketClaim/cnpg-backups
# (bucketclaims.yaml), which holds the postgres-base CNPG Cluster WAL + base
# backups under the barmanObjectStore prefix `cnpg-backups/postgres/` (see
# cluster-base.yaml `destinationPath: s3://cnpg-backups/postgres/`).
# rclone mirrors `<live-bucket>/cnpg-backups/postgres/` to Proton Drive
# `/home-ops/backup/<cluster>/cnpg/cnpg-backups` (operation `sync`, daily
# 03:45 — staggered off the coder 03:15 / ferretdb 03:30 ticks so the syncs
# never fight over Proton Drive rate limits, `concurrencyPolicy: Forbid`,
# image pinned via chart defaults rclone 1.75.0).
#
# Note: per-instance clusters (zitadel-db, coder-db, ferretdb) hold their own
# dedicated claims and ship their own colocated syncs — this file covers only
# the base/template `cnpg-backups` bucket claimed here.
#
# Live bucket name (NEVER hardcoded): the driver provisions the bucket under a
# controller-generated `bc-<uuid>` name (`spec.existingBucketName` is unset;
# the live name is only in `status.bucketName`). The BucketInfo JSON minted
# into Secret `cnpg-backups-cosi-creds` carries that same live name at
# `spec.bucketName` (COSI sidecar contract — same JSON the existing
# `cnpg-s3-credentials` ExternalSecret already reads keys from), so the
# `rclone-cnpg-backups-s3-path` ExternalSecret below templates
# `<live-bucket>/cnpg-backups/postgres/` via GJSON `property`
# `BucketInfo.spec.bucketName` into a synced Secret, and the chart consumes it
# through `source.uri.esoRef` (`SRC_PATH` env + `$(VAR)` expansion in the
# `SRC:` arg — the chart-supported dynamic ref).
#
# S3 credentials: dedicated `rclone-cnpg-backups-s3` ExternalSecret through the
# in-namespace `cnpg-cosi` SecretStore (cosi-keys.yaml), same GJSON pattern as
# `cnpg-s3-credentials`. Proton credentials: `rclone-proton-credentials`
# ExternalSecret through the `proton-pass` ClusterSecretStore into a synced
# Secret consumed via the chart's `esoRef` (consume, not create).
#
# MANUAL SEEDING (Proton Pass vault, rclone-obscured where noted — generate
# with `rclone obscure`, see projects/helm-rclone-sync/README.md):
# - pass://<cluster>/cnpg/rclone-proton-username (plain login, NOT obscured)
# - pass://<cluster>/cnpg/rclone-proton-password (OBSCURED)
# - optional, only if the Proton account needs them (also OBSCURED; extend the
#   ExternalSecret data[] + destination.credentials mailboxPassword/
#   otpSecretKey below): .../cnpg/rclone-proton-mailbox-password,
#   .../cnpg/rclone-proton-otp-secret-key
# Per-env overlay patches (dev/prd kustomization.yaml) repoint
# `__PROTON_PASS_BASE__` below to the full `pass://acme-<env>-...` keys and
# the destination uri to the full `/home-ops/backup/acme-<env>-...` path.
#
# Runtime note: provider AWS + the internal endpoint below mirror the chart's
# s3->proton-drive fixture
# (projects/helm-rclone-sync/ci/values-direction-05-s3-to-proton.yaml);
# region us-east-1 is ignored by SeaweedFS but required by S3 clients (same
# convention as the COSI README endpoint contract).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-cnpg-backups-s3-path
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cnpg-cosi
    kind: SecretStore
  target:
    name: rclone-cnpg-backups-s3-path
    template:
      data:
        path: "{{ .bucketName }}/cnpg-backups/postgres/"
  data:
    - secretKey: bucketName
      remoteRef:
        key: cnpg-backups-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-cnpg-backups-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cnpg-cosi
    kind: SecretStore
  target:
    name: rclone-cnpg-backups-s3
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: cnpg-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: cnpg-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-proton-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: rclone-proton-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/cnpg/rclone-proton-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/cnpg/rclone-proton-password
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: helm-rclone-sync-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-rclone-sync
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Version skew guard: this tag MUST equal Chart.yaml `version` in
  # projects/helm-rclone-sync (single source of truth). Chart version bumps
  # ship as one commit touching Chart.yaml + all six consumers — no floating
  # alias, no $imagepolicy marker (Helm OCIRepositories cannot be tracked by
  # image automation), no silent skew.
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-sync-cnpg-backups
spec:
  interval: 1h
  releaseName: rclone-sync-cnpg-backups
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-rclone-sync
  values:
    schedule: "45 3 * * *"
    concurrencyPolicy: Forbid
    rclone:
      operation: sync
    source:
      type: s3
      remoteName: ""
      uri:
        esoRef:
          name: rclone-cnpg-backups-s3-path
          key: path
      credentials:
        provider:
          value: AWS
        accessKeyId:
          esoRef:
            name: rclone-cnpg-backups-s3
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: rclone-cnpg-backups-s3
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      remoteName: ""
      uri:
        value: /home-ops/backup/__CLUSTER_NAME__/cnpg/cnpg-backups
      credentials:
        username:
          esoRef:
            name: rclone-proton-credentials
            key: username
        password:
          esoRef:
            name: rclone-proton-credentials
            key: password
