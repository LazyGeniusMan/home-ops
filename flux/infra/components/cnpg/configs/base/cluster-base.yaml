# Reusable PostgreSQL HA Cluster template (not a live cluster): copy into a namespace-local Cluster.
# 3 instances, sync quorum, pod anti-affinity; local-ssd-nvme; continuous WAL + daily base backup to SeaweedFS S3.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-base
spec:
  instances: 3 # placeholder - overridden by dev/prd overlays

  # Sync quorum: 1 of 2 standbys acknowledges every commit.
  postgresql:
    synchronous:
      standbyNames: ["*"]
      number: 1

  bootstrap:
    initdb:
      database: app
      owner: app
  # PITR: create a NEW Cluster from a backup instead of initdb (uncomment, set backup name + targetTime).
  # bootstrap:
  #   recovery:
  #     backup:
  #       name: postgres-base-backup
  #     recoveryTarget:
  #       targetTime: "2026-09-08 00:00:00.00000+00"

  storage:
    storageClass: local-ssd-nvme
    size: 20Gi

  affinity:
    enablePodAntiAffinity: true

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/postgres/
      endpointURL: __S3_ENDPOINT_URL__
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
---
# Daily base backup (streaming).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-base-backup
spec:
  schedule: "0 0 0 * * *" # midnight daily (CNPG 6-field cron)
  backupOwnerReference: self
  cluster:
    name: postgres-base
