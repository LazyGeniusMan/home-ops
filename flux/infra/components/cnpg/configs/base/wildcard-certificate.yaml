# In-namespace wildcard Certificate for Postgres TLS (Secrets are namespace-local). No DNSEndpoint CR: the nested wildcard rides the existing *.home-ops wildcard A automation.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __WILDCARD_CERT_NAME__
spec:
  secretName: __WILDCARD_TLS_SECRET__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.postgres.__BASE_DOMAIN__"
