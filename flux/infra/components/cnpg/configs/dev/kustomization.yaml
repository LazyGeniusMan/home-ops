apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - cloudflare-api-token.yaml
patches:
  # Dev S3 endpoint + wildcard DNS (keys COSI-minted) + rclone identity
  # (vault keys + destination cluster segment; base holds placeholders).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/rclone/proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/rclone/proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backups/acme-dev-bdo1-talos-apps-01/cnpg/cnpg-backups
    target:
      kind: HelmRelease
      name: rclone-sync-cnpg-backups
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs:8333
    target:
      kind: Cluster
      name: postgres-base
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-postgres
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-postgres-tls
    target:
      kind: Certificate
      name: wildcard-postgres
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.postgres.home-ops-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-postgres
  # Dev scaling: stateful placeholder -> 1.
  - patch: |
      - op: replace
        path: /spec/instances
        value: 1
    target:
      kind: Cluster
      name: postgres-base
