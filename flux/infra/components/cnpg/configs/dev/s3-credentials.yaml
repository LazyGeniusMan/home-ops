# SeaweedFS S3 credentials for Barman Cloud backups (§14 dev). Synced by ESO
# from the DEV Proton Pass vault
# (pass://acme-dev-bdo1-talos-apps-01/cnpg/s3-*); seed the vault entries with
# pass-cli (never commit):
#   pass insert 'acme-dev-bdo1-talos-apps-01/cnpg/s3-access-key-id'
#   pass insert 'acme-dev-bdo1-talos-apps-01/cnpg/s3-secret-access-key'
# The Cluster references cnpg-s3-credentials by name in
# spec.backup.barmanObjectStore.s3Credentials (same-namespace secret).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cnpg-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        ACCESS_SECRET_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/cnpg/s3-access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/cnpg/s3-secret-access-key
