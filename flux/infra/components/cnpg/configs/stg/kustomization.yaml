apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Stg (prd values) S3 endpoint + wildcard DNS. (S3 keys are COSI-minted
  # via the in-namespace cnpg-cosi SecretStore — no per-env vault ref patch.)
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Cluster
      name: postgres-base
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.postgres.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-postgres
