apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd HA scaling: replica seed -> 2; out-of-band HPA owns the count
  # (min 2/max 4, base values).
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 2
    target:
      kind: HelmRelease
      name: cnpg
  # TA discovery: the otel-gateway TargetAllocator object + namespace
  # selectors both match `otel-scrape: "true"` (tenant namespace carries it
  # from the fleet tenants/infra.yaml template). The chart renders a
  # PodMonitor (not ServiceMonitor) and supports
  # monitoring.podMonitorAdditionalLabels, so the label lands via this
  # overlay patch — base values stay untouched.
  - patch: |
      - op: add
        path: /spec/values/monitoring/podMonitorAdditionalLabels
        value:
          otel-scrape: "true"
    target:
      kind: HelmRelease
      name: cnpg
