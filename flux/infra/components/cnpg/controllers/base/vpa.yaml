# VPA recommender for the cnpg-cloudnative-pg operator Deployment
# (HPA-paired): updateMode Off — recommender-only, because the HPA scales
# the same CPU/memory metrics (known-limitations.md: never VPA-apply on a
# resource HPA scales on). Database Cluster CRs stay VPA-free (Group C).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cnpg-cloudnative-pg
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cnpg-cloudnative-pg
  updatePolicy:
    updateMode: 'Off'
