# Out-of-band HPA for the CNPG operator Deployment (chart 0.29.0 exposes no
# autoscaling knob; upstream HPA discouragement in resource_management.md
# applies to database Cluster CRs, not this stateless operator). Min/max
# patched per env (dev 1/2, prd 2/4); base carries the prd floor.
# Release name `cnpg` renders Deployment `cnpg-cloudnative-pg` in the
# release namespace.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cnpg-cloudnative-pg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cnpg-cloudnative-pg
  minReplicas: 2 # placeholder - overridden by dev/prd overlays
  maxReplicas: 4 # placeholder - overridden by dev/prd overlays
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
