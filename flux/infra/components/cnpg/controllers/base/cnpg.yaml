# CNPG operator 1.30.0 via chart 0.29.1 (chart embeds operator; see README mapping). Chart oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg.
# podMonitorEnabled false until monitoring.coreos.com CRDs land.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cnpg-chart
spec:
  interval: 1h
  url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "0.29.1" # {"$imagepolicy": "infra:cnpg:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
spec:
  interval: 1h
  releaseName: cnpg
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: cnpg-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/cloudnative-pg/charts/tree/main/charts/cloudnative-pg
  values:
    # Replica seed - the out-of-band HPA in hpa.yaml owns the count at runtime
    # (chart 0.29.1 has no autoscaling knob; operator-docs resource_management
    # discourages HPA for *database* Clusters, but this targets the stateless
    # operator Deployment, not a Cluster CR). Dev seeds 1, prd seeds 2.
    # CPU requests are REQUIRED for the targetCPU HPA (chart defaults {}).
    replicaCount: 1 # placeholder - overridden by dev/prd overlays
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    crds:
      create: true
    monitoring:
      podMonitorEnabled: false
