# Dragonfly operator 1.6.1 (§10.3): Redis-compatible cache clusters via the
# Dragonfly API. Chart: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator,
# tag v1.6.1 == app v1.6.1.
# Telemetry: no phone-home/usage-reporting knobs in the chart values.
# Monitoring: ServiceMonitor + Grafana dashboard stay disabled until
# monitoring.coreos.com CRDs land (same deviation as §9); flip notes in README.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: dragonfly-chart
spec:
  interval: 1h
  url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "v1.6.1" # {"$imagepolicy": "infra:dragonfly:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly
spec:
  interval: 1h
  releaseName: dragonfly
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: dragonfly-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    crds: CreateReplace
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    crds: CreateReplace
  # https://github.com/dragonflydb/dragonfly-operator/tree/v1.6.1/charts/dragonfly-operator
  values:
    # Replica seed - the out-of-band HPA in hpa.yaml owns the count at runtime
    # (chart v1.6.1 has no autoscaling knob; reference docs are a website
    # checkout with no chart source, so AUTOSCALING-N rests on helm-template
    # evidence: static `replicas:` with no HPA template). Dev seeds 1, prd 2.
    # CPU requests REQUIRED for the targetCPU HPA (manager defaults {}).
    replicaCount: 1 # placeholder - overridden by dev/prd overlays
    manager:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
    crds:
      install: true
      keep: true
    serviceMonitor:
      enabled: false
    grafanaDashboard:
      enabled: false
