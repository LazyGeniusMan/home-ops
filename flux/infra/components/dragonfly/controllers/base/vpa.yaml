# VPA recommender for the dragonfly-dragonfly-operator Deployment
# (HPA-paired): updateMode Off — recommender-only, because the HPA scales
# the same CPU/memory metrics (known-limitations.md: never VPA-apply on a
# resource HPA scales on). Dragonfly CRs stay VPA-free (Group C).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: dragonfly-dragonfly-operator
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dragonfly-dragonfly-operator
  updatePolicy:
    updateMode: 'Off'
