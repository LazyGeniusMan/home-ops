# S3 credentials for Dragonfly snapshots from the COSI BucketInfo (dragonfly-backups-cosi-creds) via the in-namespace dragonfly-cosi SecretStore.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dragonfly-cosi
    kind: SecretStore
  target:
    name: dragonfly-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: dragonfly-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: dragonfly-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
