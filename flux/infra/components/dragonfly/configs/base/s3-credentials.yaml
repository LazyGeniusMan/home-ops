# SeaweedFS S3 credentials for Dragonfly snapshots (§10.3). Synced by ESO
# from the COSI-minted BucketInfo JSON (Secret dragonfly-backups-cosi-creds,
# key BucketInfo) through the in-namespace `dragonfly-cosi` SecretStore
# (cosi-keys.yaml) — GJSON `property` extracts
# spec.secretS3.accessKeyID/accessSecretKey. Target literal keys are
# unchanged. Fallback: the Proton Pass entries (pass://.../dragonfly/s3-*)
# are retained in the vault; to roll back, repoint secretStoreRef to
# proton-pass/ClusterSecretStore with remoteRef keys
# __PROTON_PASS_BASE__/dragonfly/s3-access-key-id and
# __PROTON_PASS_BASE__/dragonfly/s3-secret-access-key (no `property`).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dragonfly-cosi
    kind: SecretStore
  target:
    name: dragonfly-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: dragonfly-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: dragonfly-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
