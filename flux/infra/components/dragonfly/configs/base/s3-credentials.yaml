# SeaweedFS S3 credentials for Dragonfly snapshots (§10.3). Synced by ESO from
# Proton Pass (pass://acme-prd-bdo1-talos-apps-01/dragonfly/s3-*); seed the
# vault entries with pass-cli. The Dragonfly object consumes
# dragonfly-s3-credentials via spec.env secretKeyRefs (same-namespace secret)
# — copy this ExternalSecret into each namespace that hosts a Dragonfly
# instance (same pattern as §10.1 cnpg s3-credentials).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: dragonfly-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: __PROTON_PASS_BASE__/dragonfly/s3-access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: __PROTON_PASS_BASE__/dragonfly/s3-secret-access-key
