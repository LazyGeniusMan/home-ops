# S3 to Proton Drive backup of the dragonfly-backups COSI bucket (bucketclaims.yaml),
# which holds dragonfly-base hourly snapshots (dir s3://dragonfly-backups/dragonfly/,
# cron hourly). rclone mirrors <live-bucket>/dragonfly-backups/dragonfly/ to
# /home-ops/backups/<cluster>/dragonfly/dragonfly-backups (operation sync, hourly at
# minute 30, concurrencyPolicy Forbid; chart defaults rclone 1.75.0).
# Live bucket name is never hardcoded: ExternalSecret rclone-dragonfly-backups-s3-path
# templates it from BucketInfo.spec.bucketName through the in-namespace dragonfly-cosi
# SecretStore (cosi-keys.yaml). S3 keys via rclone-dragonfly-backups-s3, Proton creds
# via rclone-proton-credentials (ClusterSecretStore proton-pass, password rclone-obscured
# via rclone obscure). Seed pass://<cluster>/dragonfly/rclone-proton-username and
# pass://<cluster>/dragonfly/rclone-proton-password. Overlays patch
# __PROTON_PASS_BASE__ and the destination cluster segment.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-dragonfly-backups-s3-path
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dragonfly-cosi
    kind: SecretStore
  target:
    name: rclone-dragonfly-backups-s3-path
    template:
      data:
        path: "{{ .bucketName }}/dragonfly-backups/dragonfly/"
  data:
    - secretKey: bucketName
      remoteRef:
        key: dragonfly-backups-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-dragonfly-backups-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dragonfly-cosi
    kind: SecretStore
  target:
    name: rclone-dragonfly-backups-s3
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: dragonfly-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: dragonfly-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-proton-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: rclone-proton-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/dragonfly/rclone-proton-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/dragonfly/rclone-proton-password
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: helm-rclone-sync-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-rclone-sync
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Chart tag MUST equal Chart.yaml version in projects/helm-rclone-sync; bump
  # Chart.yaml + all six consumers in one commit.
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-sync-dragonfly-backups
spec:
  interval: 1h
  releaseName: rclone-sync-dragonfly-backups
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-rclone-sync
  values:
    schedule: "30 * * * *"
    concurrencyPolicy: Forbid
    rclone:
      operation: sync
    source:
      type: s3
      remoteName: ""
      uri:
        esoRef:
          name: rclone-dragonfly-backups-s3-path
          key: path
      credentials:
        provider:
          value: AWS
        accessKeyId:
          esoRef:
            name: rclone-dragonfly-backups-s3
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: rclone-dragonfly-backups-s3
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      remoteName: ""
      uri:
        value: /home-ops/backups/__CLUSTER_NAME__/dragonfly/dragonfly-backups
      credentials:
        username:
          esoRef:
            name: rclone-proton-credentials
            key: username
        password:
          esoRef:
            name: rclone-proton-credentials
            key: password
