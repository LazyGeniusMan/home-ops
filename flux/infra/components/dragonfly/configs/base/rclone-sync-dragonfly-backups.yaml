# S3 -> Proton Drive backup of the `dragonfly-backups` COSI bucket (colocated
# with the consuming component — lands in the `dragonfly` tenant namespace via
# the Fleet `infra-configs` Kustomization's `targetNamespace`). One HelmRelease
# per bucket, per the colocated-backup rule (centralized backup is out of
# scope).
#
# What it syncs: the SeaweedFS bucket provisioned for
# BucketClaim/dragonfly-backups (bucketclaims.yaml), which holds the
# dragonfly-base hourly snapshots under the snapshot prefix `dragonfly/` (see
# dragonfly-base.yaml `dir: s3://dragonfly-backups/dragonfly/`,
# `cron: "0 * * * *"`). rclone mirrors `<live-bucket>/dragonfly-backups/dragonfly/`
# to Proton Drive `/home-ops/backup/<cluster>/dragonfly/dragonfly-backups`
# (operation `sync`, hourly at minute 30 — staggered off the snapshot top so
# each tick picks up the just-written dump, `concurrencyPolicy: Forbid`, image
# pinned via chart defaults rclone 1.75.0).
#
# Live bucket name (NEVER hardcoded): the driver provisions the bucket under a
# controller-generated `bc-<uuid>` name (`spec.existingBucketName` is unset;
# the live name is only in `status.bucketName`). The BucketInfo JSON minted
# into Secret `dragonfly-backups-cosi-creds` carries that same live name at
# `spec.bucketName` (COSI sidecar contract — same JSON the existing
# `dragonfly-s3-credentials` ExternalSecret already reads keys from), so the
# `rclone-dragonfly-backups-s3-path` ExternalSecret below templates
# `<live-bucket>/dragonfly-backups/dragonfly/` via GJSON `property`
# `BucketInfo.spec.bucketName` into a synced Secret, and the chart consumes it
# through `source.uri.esoRef` (`SRC_PATH` env + `$(VAR)` expansion in the
# `SRC:` arg — the chart-supported dynamic ref).
#
# S3 credentials: dedicated `rclone-dragonfly-backups-s3` ExternalSecret
# through the in-namespace `dragonfly-cosi` SecretStore (cosi-keys.yaml), same
# GJSON pattern as `dragonfly-s3-credentials`. Proton credentials:
# `rclone-proton-credentials` ExternalSecret through the `proton-pass`
# ClusterSecretStore into a synced Secret consumed via the chart's `esoRef`
# (consume, not create).
#
# MANUAL SEEDING (Proton Pass vault, rclone-obscured where noted — generate
# with `rclone obscure`, see projects/helm-rclone-sync/README.md):
# - pass://<cluster>/dragonfly/rclone-proton-username (plain login, NOT obscured)
# - pass://<cluster>/dragonfly/rclone-proton-password (OBSCURED)
# - optional, only if the Proton account needs them (also OBSCURED; extend the
#   ExternalSecret data[] + destination.credentials mailboxPassword/
#   otpSecretKey below): .../dragonfly/rclone-proton-mailbox-password,
#   .../dragonfly/rclone-proton-otp-secret-key
# Per-env overlay patches (dev/prd kustomization.yaml) repoint
# `__PROTON_PASS_BASE__` below to the full `pass://acme-<env>-...` keys and
# the destination uri to the full `/home-ops/backup/acme-<env>-...` path.
#
# Runtime note: provider AWS + the internal endpoint below mirror the chart's
# s3->proton-drive fixture
# (projects/helm-rclone-sync/ci/values-direction-05-s3-to-proton.yaml);
# region us-east-1 is ignored by SeaweedFS but required by S3 clients (same
# convention as the COSI README endpoint contract). rclone takes the FULL
# `http://…:8333` URL here — unlike Dragonfly's `--s3_endpoint`, which takes a
# bare host plus `--s3_use_https=false`. Those Dragonfly args are untouched by
# this file (patched per-env in dev/prd kustomization.yaml); no bare-host
# handling is needed for the sync itself.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-dragonfly-backups-s3-path
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dragonfly-cosi
    kind: SecretStore
  target:
    name: rclone-dragonfly-backups-s3-path
    template:
      data:
        path: "{{ .bucketName }}/dragonfly-backups/dragonfly/"
  data:
    - secretKey: bucketName
      remoteRef:
        key: dragonfly-backups-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-dragonfly-backups-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dragonfly-cosi
    kind: SecretStore
  target:
    name: rclone-dragonfly-backups-s3
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: dragonfly-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: dragonfly-backups-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-proton-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: rclone-proton-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/dragonfly/rclone-proton-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/dragonfly/rclone-proton-password
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: helm-rclone-sync-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-rclone-sync
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-sync-dragonfly-backups
spec:
  interval: 1h
  releaseName: rclone-sync-dragonfly-backups
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-rclone-sync
  values:
    schedule: "30 * * * *"
    concurrencyPolicy: Forbid
    rclone:
      operation: sync
    source:
      type: s3
      remoteName: ""
      uri:
        esoRef:
          name: rclone-dragonfly-backups-s3-path
          key: path
      credentials:
        provider:
          value: AWS
        accessKeyId:
          esoRef:
            name: rclone-dragonfly-backups-s3
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: rclone-dragonfly-backups-s3
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      remoteName: ""
      uri:
        value: /home-ops/backup/__CLUSTER_NAME__/dragonfly/dragonfly-backups
      credentials:
        username:
          esoRef:
            name: rclone-proton-credentials
            key: username
        password:
          esoRef:
            name: rclone-proton-credentials
            key: password
