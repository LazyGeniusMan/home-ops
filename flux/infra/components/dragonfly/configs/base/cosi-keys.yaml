# COSI credential bridge: in-namespace SecretStore reading the BucketInfo JSON (dragonfly-backups-cosi-creds) via eso-k8s-reader. Consumers use GJSON BucketInfo.spec.secretS3.accessKeyID/accessSecretKey.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dragonfly-backups-cosi-creds"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: dragonfly-cosi
spec:
  provider:
    kubernetes:
      remoteNamespace: dragonfly
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
