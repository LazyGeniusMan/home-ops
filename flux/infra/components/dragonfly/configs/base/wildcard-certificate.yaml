# Wildcard certificate for Dragonfly TLS. Namespace-local so server-TLS
# (spec.tlsSecretRef) and client connections stay in-namespace. DNS: no DNSEndpoint
# CR — the nested *.dragonfly wildcard rides on the existing *.home-ops wildcard A
# automation; verify with dig before cutting traffic over.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __WILDCARD_CERT_NAME__
spec:
  secretName: __WILDCARD_TLS_SECRET__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.dragonfly.__BASE_DOMAIN__"
