# COSI-managed bucket for the Dragonfly snapshots (colocated with the
# consuming component — lands in the `dragonfly` tenant namespace via the
# Fleet `infra-configs` Kustomization's `targetNamespace`).
# - Claim uses BucketClass/seaweedfs, protocol S3. The driver provisions the
#   live bucket under a controller-generated name (`bc-<uuid>`), so
#   `spec.existingBucketName` stays unset; read the live name from the
#   claim's `status.bucketName` once `status.bucketReady` is true.
# - `dragonfly-backups` backs the dragonfly-base snapshots
#   (`spec.snapshot.dir: s3://dragonfly-backups/dragonfly/`, see
#   dragonfly-base.yaml). The zitadel-cache instance holds its own dedicated
#   claim — see the cosi README. The `s3://` path prefix must exist before
#   the first Dragonfly object starts (Dragonfly never creates buckets).
# - The BucketAccess mints S3 keys into its `credentialsSecretName` Secret in
#   THIS namespace as a `BucketInfo` JSON file. The driver hands back the
#   internal endpoint
#   (http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333).
# - Credential bridge: consumers read COSI BucketInfo JSON through
#   same-namespace ExternalSecrets.
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: dragonfly-backups
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: dragonfly-backups-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: dragonfly-backups
  credentialsSecretName: dragonfly-backups-cosi-creds
  protocol: S3
