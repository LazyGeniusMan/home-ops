# COSI bucket dragonfly-backups (BucketClass/seaweedfs, S3) for dragonfly-base snapshots (s3://dragonfly-backups/dragonfly/).
# Live bucket provisions under a controller-generated name (bc-<uuid>); s3:// prefix must pre-exist. Keys via same-namespace ExternalSecrets.
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: dragonfly-backups
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: dragonfly-backups-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: dragonfly-backups
  credentialsSecretName: dragonfly-backups-cosi-creds
  protocol: S3
