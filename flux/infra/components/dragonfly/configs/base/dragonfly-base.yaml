# Reusable Dragonfly HA cache template (not a live instance): copy into a namespace-local Dragonfly object.
# 3 replicas (1 primary + 2), failover; tiering PVC on local-ssd-nvme; hourly S3 snapshots (plain HTTP: --s3_use_https=false with bare-host --s3_endpoint).
# Host <name>.<namespace>.svc.cluster.local:6379.
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-base
spec:
  replicas: 3 # placeholder - overridden by dev/prd overlays

  # Tiered-entries disk (S3 owns snapshots, no snapshot PVC).
  tiering:
    persistentVolumeClaimSpec:
      storageClassName: local-ssd-nvme
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi

  # Hourly S3 snapshots (auto-loaded from dir on startup).
  snapshot:
    dir: "s3://dragonfly-backups/dragonfly/"
    cron: "0 * * * *"
    enableOnMasterOnly: true

  # S3 creds from the synced Secret (same namespace); region required by the AWS SDK chain.
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: SECRET_ACCESS_KEY
    - name: AWS_REGION
      value: us-east-1

  args:
    - --s3_endpoint=__S3_HOST__
    - --dbfilename=dump-{timestamp}
    - --s3_use_https=false

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: dragonfly
            topologyKey: kubernetes.io/hostname
