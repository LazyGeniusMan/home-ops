# ESO-managed Dragonfly AUTH password (Proton Pass; Git holds the remoteRef only).
# Bootstrap: seed `pass://<cluster>/dragonfly/password` once via pass-cli with a
# 32+ char random value, then ESO syncs `dragonfly-auth` (key `password`).
# Trust boundary: AUTH travels cleartext on the service-domain :6379 wire —
# no in-cluster TLS by design; CNI-layer Cilium WireGuard encrypts pod traffic
# between nodes instead (see cilium/controllers/base/cilium.yaml).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: dragonfly-auth
    template:
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/dragonfly/password
