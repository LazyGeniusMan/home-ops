apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd S3 host + wildcard DNS. (S3 keys are COSI-minted via the
  # in-namespace dragonfly-cosi SecretStore — no per-env vault ref patch for
  # dragonfly-s3-credentials, rclone-dragonfly-backups-s3, or
  # rclone-dragonfly-backups-s3-path.)
  # Prd rclone-sync-dragonfly-backups identity: Proton Pass vault keys + the
  # Proton Drive destination cluster segment (base holds __PROTON_PASS_BASE__
  # / __CLUSTER_NAME__ placeholders).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/dragonfly/rclone-proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/dragonfly/rclone-proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backup/acme-prd-bdo1-talos-apps-01/dragonfly/dragonfly-backups
    target:
      kind: HelmRelease
      name: rclone-sync-dragonfly-backups
  - patch: |
      - op: replace
        path: /spec/args/0
        value: --s3_endpoint=seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Dragonfly
      name: dragonfly-base
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.dragonfly.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-dragonfly
