apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - cloudflare-api-token.yaml
patches:
  # Prd S3 host + wildcard DNS (keys COSI-minted) + rclone identity
  # (vault keys + destination cluster segment; base holds placeholders).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/rclone/proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/rclone/proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backups/acme-prd-bdo1-talos-apps-01/dragonfly/dragonfly-backups
    target:
      kind: HelmRelease
      name: rclone-sync-dragonfly-backups
  - patch: |
      - op: replace
        path: /spec/args/0
        value: --s3_endpoint=seaweed-main-s3.seaweedfs:8333
    target:
      kind: Dragonfly
      name: dragonfly-base
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-dragonfly
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-dragonfly-tls
    target:
      kind: Certificate
      name: wildcard-dragonfly
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.dragonfly.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-dragonfly
  # Prd scaling: stateful placeholder -> 3.
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Dragonfly
      name: dragonfly-base
