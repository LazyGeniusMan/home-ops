# Dragonfly HA cache template (§14 dev). Self-contained copy of
# configs/base/dragonfly-base.yaml with the §14 locked deltas:
# - Snapshot S3 endpoint → the dev SeaweedFS S3
#   (s3.seaweedfs.homelab-dev.yansyah.my.id — the batch-3 storage writer ships
#   the dev SeaweedFS cluster, referenced by DNS name only, no file
#   dependency). Credentials come from the dev s3-credentials ExternalSecret
#   in this directory (AWS_* env + s3_endpoint arg on the Dragonfly object).
# - Persistence IDENTICAL to the base: tiering PVC on local-ssd-nvme (the §9
#   default class); S3 carries the snapshots (upstream mounts a snapshot PVC
#   AT snapshot.dir, so a PVC snapshot volume cannot combine with an S3 dir).
# Like the base, this is a template: copy the stanza into a namespace-local
# Dragonfly object. Connection contract for consumers: host
# <name>.<namespace>.svc.cluster.local, port 6379 (Redis-compatible).
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-base
spec:
  replicas: 3

  # Persistent local disk for tiered entries (see header note for why the
  # snapshot PVC is NOT used here — S3 owns snapshots in this design).
  tiering:
    persistentVolumeClaimSpec:
      storageClassName: local-ssd-nvme
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi

  # Hourly snapshots to the dev SeaweedFS S3 (operator passes
  # --dir/--snapshot_cron; Dragonfly auto-loads the latest snapshot from dir
  # on startup).
  snapshot:
    dir: "s3://dragonfly-backups/dragonfly/"
    cron: "0 * * * *"
    enableOnMasterOnly: true

  # S3-compatible endpoint + static creds from the synced Secret (same
  # namespace). Region is required by the AWS SDK credential chain even for
  # S3-compatible backends.
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: SECRET_ACCESS_KEY
    - name: AWS_REGION
      value: us-east-1

  args:
    - --s3_endpoint=s3.seaweedfs.homelab-dev.yansyah.my.id
    - --dbfilename=dump-{timestamp}

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: dragonfly
            topologyKey: kubernetes.io/hostname
