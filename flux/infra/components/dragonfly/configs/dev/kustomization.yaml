apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - cloudflare-api-token.yaml
patches:
  # Dev S3 host + wildcard DNS. (S3 keys are COSI-minted via the
  # in-namespace dragonfly-cosi SecretStore — no per-env vault ref patch.)
  - patch: |
      - op: replace
        path: /spec/args/0
        value: --s3_endpoint=seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Dragonfly
      name: dragonfly-base
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.dragonfly.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-dragonfly
