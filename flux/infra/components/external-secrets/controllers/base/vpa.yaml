# VPA recommenders for the external-secrets + cert-controller Deployments
# (both HPA-paired): updateMode Off — recommender-only, because each HPA
# scales the same CPU/memory metrics (known-limitations.md: never VPA-apply
# on a resource HPA scales on). The webhook Deployment stays singleton with
# no VPA (Group B, Initial only).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets
  updatePolicy:
    updateMode: 'Off'
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets-cert-controller
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-cert-controller
  updatePolicy:
    updateMode: 'Off'
