# Out-of-band HPAs for the external-secrets controller + certController
# Deployments (chart 2.11.0 exposes no autoscaling knob — replicaCount,
# webhook.replicaCount, certController.replicaCount are static integers).
# The webhook Deployment stays singleton 1 (no HPA): it fronts a validating
# admission chain where a second replica adds risk without benefit.
# Min/max patched per env (dev 1/2, prd 2/4); base carries the prd floor.
# Release name `external-secrets` renders Deployments `external-secrets` and
# `external-secrets-cert-controller` in the release namespace
#.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: external-secrets
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets
  minReplicas: 2 # placeholder - overridden by dev/prd overlays
  maxReplicas: 4 # placeholder - overridden by dev/prd overlays
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: external-secrets-cert-controller
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-cert-controller
  minReplicas: 2 # placeholder - overridden by dev/prd overlays
  maxReplicas: 4 # placeholder - overridden by dev/prd overlays
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
