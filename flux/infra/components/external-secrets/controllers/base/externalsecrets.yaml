# External Secrets Operator v2.10.0 (§9.1) + in-cluster Proton Pass webhook.
# Chart: oci://ghcr.io/external-secrets/charts/external-secrets (verified
# 2.10.0, appVersion v2.10.0). CRDs managed by the chart (installCRDs).
# Telemetry: ESO exposes no usage-reporting knobs; defaults are telemetry-off.
# Monitoring: controller metrics Service enabled + ServiceMonitor rendered
# only when the monitoring.coreos.com CRD exists (renderMode skipIfMissing),
# so this release stays Ready on clusters without a Prometheus stack yet.
# Webhook companion (eso-proton-pass, projects/eso-proton-pass) is deployed
# from configs/base — ESO reaches it per-SecretStore, not via this chart.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-secrets-chart
spec:
  interval: 1h
  url: oci://ghcr.io/external-secrets/charts/external-secrets
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "2.10.0" # {"$imagepolicy": "infra:external-secrets:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 1h
  releaseName: external-secrets
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: external-secrets-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/external-secrets/external-secrets/blob/main/deploy/charts/external-secrets/values.yaml
  values:
    # Replica seeds - the out-of-band HPAs in hpa.yaml own controller +
    # certController counts at runtime (chart 2.10.0 has no autoscaling knob;
    # webhook stays singleton 1 — it fronts a validating admission chain).
    # CPU requests REQUIRED for the targetCPU HPAs (chart defaults {}).
    replicaCount: 1 # placeholder - overridden by dev/prd overlays
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    installCRDs: true
    serviceMonitor:
      enabled: true
      renderMode: skipIfMissing
      interval: 30s
      scrapeTimeout: 25s
    metrics:
      service:
        enabled: true
        port: 8080
    webhook:
      replicaCount: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
      # Webhook is a lightweight admission/conversion server (see
      # external-secret-operator-docs/docs/api/components.md); sized near the
      # certController (50m/64Mi), above the chart's 10m/32Mi stub comment.
      # Requests-only (no limits) matches the file's existing convention.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
      metrics:
        service:
          enabled: true
          port: 8080
    certController:
      replicaCount: 1 # placeholder - overridden by dev/prd overlays
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
      metrics:
        service:
          enabled: true
          port: 8080
