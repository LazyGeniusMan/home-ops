# External Secrets Operator chart 2.11.0 (app v2.11.0). Chart oci://ghcr.io/external-secrets/charts/external-secrets; CRDs chart-managed.
# Webhook companion (eso-proton-pass) deployed from configs/base.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-secrets-chart
spec:
  interval: 1h
  url: oci://ghcr.io/external-secrets/charts/external-secrets
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "2.11.0" # {"$imagepolicy": "infra:external-secrets:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 1h
  releaseName: external-secrets
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: external-secrets-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/external-secrets/external-secrets/blob/main/deploy/charts/external-secrets/values.yaml
  values:
    # Replica seeds - the out-of-band HPAs in hpa.yaml own controller +
    # certController counts at runtime (the chart has no autoscaling knob;
    # webhook stays singleton 1). CPU requests REQUIRED for the targetCPU HPAs.
    replicaCount: 1 # placeholder - overridden by dev/prd overlays
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    installCRDs: true
    serviceMonitor:
      enabled: true
      renderMode: skipIfMissing
      interval: 30s
      scrapeTimeout: 25s
    metrics:
      service:
        enabled: true
        port: 8080
    webhook:
      replicaCount: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
      # Webhook is a lightweight admission/conversion server sized near the
      # certController (50m/64Mi). Requests-only (no limits).
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
      metrics:
        service:
          enabled: true
          port: 8080
    certController:
      replicaCount: 1 # placeholder - overridden by dev/prd overlays
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
      metrics:
        service:
          enabled: true
          port: 8080
