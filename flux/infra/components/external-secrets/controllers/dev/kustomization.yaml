apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev scaling: replica seeds -> 1 (webhook stays singleton); out-of-band
  # HPAs own controller + certController counts (min 1/max 2).
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
      - op: replace
        path: /spec/values/webhook/replicaCount
        value: 1
      - op: replace
        path: /spec/values/certController/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: external-secrets
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: external-secrets
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: external-secrets-cert-controller
  # TA discovery: the otel-gateway TargetAllocator object + namespace
  # selectors both match `otel-scrape: "true"` (tenant namespace carries it
  # from the fleet tenants/infra.yaml template). The chart supports
  # serviceMonitor.additionalLabels, so the label lands via this overlay
  # patch — base values stay untouched.
  - patch: |
      - op: add
        path: /spec/values/serviceMonitor/additionalLabels
        value:
          otel-scrape: "true"
    target:
      kind: HelmRelease
      name: external-secrets
