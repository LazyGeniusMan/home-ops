# eso-proton-pass (projects/eso-proton-pass, pull-only): in-cluster generic-webhook provider, addressed by Service DNS. proton-pass-pat Secret must exist before first reconcile; restart the Deployment after PAT rotation.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-proton-pass
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: eso-proton-pass
  labels:
    app.kubernetes.io/name: eso-proton-pass
spec:
  selector:
    app.kubernetes.io/name: eso-proton-pass
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eso-proton-pass
  labels:
    app.kubernetes.io/name: eso-proton-pass
spec:
  replicas: 1 # create-time seed, HPA owns runtime count
  selector:
    matchLabels:
      app.kubernetes.io/name: eso-proton-pass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eso-proton-pass
    spec:
      serviceAccountName: eso-proton-pass
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eso-proton-pass
          # Webhook image tracks single-stream :dev in all envs; prd pins
          # :stable once the first eso-proton-pass-v* tag lands.
          image: ghcr.io/lazygeniusman/home-ops/projects/eso-proton-pass:dev # {"$imagepolicy": "infra:eso-proton-pass:tag"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: PROTON_PASS_PAT_FILE
              value: /secrets/pat
            # Infra OTLP endpoint (overrides code default; OTEL_SDK_DISABLED=true disables export).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-collector.otel-collectors.svc:4318"
          volumeMounts:
            - name: pat
              mountPath: /secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: pat
          secret:
            secretName: proton-pass-pat
            items:
              - key: pat
                path: pat
