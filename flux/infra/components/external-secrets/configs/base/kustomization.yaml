# Store + webhook ship in this ONE Kustomization deliberately (splitting them would
# need a cross-Kustomization dependsOn the tenants/infra.yaml layout does not express).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clustersecretstore.yaml
  - eso-proton-pass-webhook.yaml
  - eso-proton-pass-hpa.yaml
  - eso-proton-pass-pdb.yaml
  - eso-proton-pass-vpa.yaml
