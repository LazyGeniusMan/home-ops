# Store + webhook ship in this ONE Kustomization deliberately (splitting them would
# need a cross-Kustomization dependsOn the tenants/infra.yaml layout does not express).
# Fresh-cluster NotReady heals via store retrySettings + ESO refreshInterval (1h).
# Bootstrap: proton-pass-pat must exist BEFORE first reconcile (see
# eso-proton-pass-webhook.yaml and README). Alert past ~10m.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clustersecretstore.yaml
  - eso-proton-pass-webhook.yaml
  - eso-proton-pass-hpa.yaml
  - eso-proton-pass-vpa.yaml
