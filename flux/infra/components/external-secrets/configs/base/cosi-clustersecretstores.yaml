# Cross-namespace COSI credential bridges (§§10.1-10.3): ClusterSecretStores
# reading the COSI-minted BucketInfo JSON Secrets out of the CLAIM
# namespaces. No per-namespace BucketClaims: a second claim would provision a
# second bc-<uuid> bucket instead of sharing the owner's, so cross-namespace
# sharers (same bucket, own prefix) read the owner's keys:
# - cosi-cnpg (Secret cnpg-backups-cosi-creds in cnpg): zitadel-db +
#   coder-db + ferretdb `cnpg-s3-credentials` (zitadel/coder/clickstack ns).
# - cosi-dragonfly (dragonfly-backups-cosi-creds in dragonfly): zitadel-cache
#   `dragonfly-s3-credentials` (zitadel ns).
# - cosi-clickhouse (clickhouse-cosi-creds in clickhouse): clickstack CHI
#   `clickhouse-s3-backup` (clickstack ns).
# Consumers use the same GJSON `property` as the part-1 in-namespace stores
# (BucketInfo.spec.secretS3.accessKeyID/accessSecretKey); target literal
# keys are unchanged. Auth pins the claim-ns `eso-k8s-reader` SA created by
# part 1 (cosi-keys.yaml in each claim ns): its Role already grants secrets
# get/list/watch on the *-cosi-creds Secret + selfsubjectrulesreviews create
# for ESO validation, so NO new RBAC ships here. server.url is omitted
# (defaults to kubernetes.default); the claim-ns `kube-root-ca.crt`
# ConfigMap supplies the API CA (caProvider.namespace is mandatory on a
# ClusterSecretStore).
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cosi-cnpg
spec:
  refreshInterval: 1h
  retrySettings:
    maxRetries: 5
    retryInterval: 5m
  provider:
    kubernetes:
      remoteNamespace: cnpg
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: cnpg
      auth:
        serviceAccount:
          name: eso-k8s-reader
          namespace: cnpg
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cosi-dragonfly
spec:
  refreshInterval: 1h
  retrySettings:
    maxRetries: 5
    retryInterval: 5m
  provider:
    kubernetes:
      remoteNamespace: dragonfly
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: dragonfly
      auth:
        serviceAccount:
          name: eso-k8s-reader
          namespace: dragonfly
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cosi-clickhouse
spec:
  refreshInterval: 1h
  retrySettings:
    maxRetries: 5
    retryInterval: 5m
  provider:
    kubernetes:
      remoteNamespace: clickhouse
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: clickhouse
      auth:
        serviceAccount:
          name: eso-k8s-reader
          namespace: clickhouse
