# Cluster-wide Proton Pass backend (§9.1). Every namespace gets its secrets
# through this store with keys shaped
# pass://acme-prd-bdo1-talos-apps-01/{namespace}/{field}; the per-namespace
# ExternalSecrets live in each consuming component's configs/ (cert-manager,
# external-dns) and data-layer/SSO sections (§§10-13) follow the same shape.
# Refresh/rotation: each ExternalSecret sets refreshInterval (1h) so changed
# vault values resync; ESO retries failed syncs with backoff and surfaces
# status on the ExternalSecret (alert on Ready=False once monitoring lands).
# The webhook URL is templated per remoteRef: eso-proton-pass serves
# GET /get?key=<pass://...> -> {"value": ...}, extracted via $.value.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: proton-pass
spec:
  refreshInterval: 1h
  retrySettings:
    maxRetries: 5
    retryInterval: 5m
  provider:
    webhook:
      url: "http://eso-proton-pass.external-secrets.svc.cluster.local:8080/get?key={{ .remoteRef.key }}"
      method: GET
      timeout: 30s
      result:
        jsonPath: "$.value"
