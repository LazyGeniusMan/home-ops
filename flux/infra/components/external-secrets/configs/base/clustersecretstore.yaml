# Cluster-wide Proton Pass backend: keys pass://<cluster>/{namespace}/{field}. Per-namespace ExternalSecrets live in each consuming component. Refresh 1h; webhook serves GET /get?key=<pass://...> extracted via $.value.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: proton-pass
spec:
  refreshInterval: 1h
  retrySettings:
    maxRetries: 5
    retryInterval: 5m
  provider:
    webhook:
      url: "http://eso-proton-pass.external-secrets:8080/get?key={{ .remoteRef.key }}"
      method: GET
      timeout: 30s
      result:
        jsonPath: "$.value"
