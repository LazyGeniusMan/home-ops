# VPA recommender for the eso-proton-pass Deployment (HPA-paired):
# updateMode Off — recommender-only, because the HPA scales the same
# CPU/memory metrics (known-limitations.md: never VPA-apply on a resource
# HPA scales on).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: eso-proton-pass
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eso-proton-pass
  updatePolicy:
    updateMode: 'Off'
