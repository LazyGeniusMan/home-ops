# VPA recommender-only for eso-proton-pass (HPA-paired; updateMode Off).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: eso-proton-pass
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eso-proton-pass
  updatePolicy:
    updateMode: 'Off'
