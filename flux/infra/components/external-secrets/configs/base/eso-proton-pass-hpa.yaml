# HPA for the eso-proton-pass webhook (stateless; dev 1/2, prd 2/4 via overlays). Requires metrics-server healthy.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eso-proton-pass
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eso-proton-pass
  minReplicas: 1 # placeholder - overridden by dev/prd overlays
  maxReplicas: 2 # placeholder - overridden by dev/prd overlays
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
