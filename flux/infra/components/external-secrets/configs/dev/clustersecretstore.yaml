# Dev ClusterSecretStore (§14). Same webhook shape as base, but the comment
# contract is dev-scoped: every namespace gets its secrets through this store
# with keys shaped pass://acme-dev-bdo1-talos-apps-01/{namespace}/{field};
# the per-namespace ExternalSecrets live in each consuming component's dev
# configs/ and follow the same shape. No prd vault references on dev.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: proton-pass
spec:
  refreshInterval: 1h
  retrySettings:
    maxRetries: 5
    retryInterval: 5m
  provider:
    webhook:
      url: "http://eso-proton-pass.external-secrets.svc.cluster.local:8080/get?key={{ .remoteRef.key }}"
      method: GET
      timeout: 30s
      result:
        jsonPath: "$.value"
