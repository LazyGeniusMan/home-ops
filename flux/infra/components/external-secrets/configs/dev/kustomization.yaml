apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev autoscaling: HPA eso-proton-pass min 1/max 2. No Deployment
  # /spec/replicas patch: base replicas: 1 is the create-time seed, HPA
  # owns runtime count.
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: eso-proton-pass
