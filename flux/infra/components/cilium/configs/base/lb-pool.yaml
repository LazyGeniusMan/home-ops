# Cilium LB IP pool + L2 announcement (§8.2). .199 is the single
# LoadBalancer VIP; .198 is the Talos API VIP (Layer2VIP) — see README.
# L2 announcements go out on the Talos NIC enp45s0.
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: default
spec:
  blocks:
    - start: 192.168.1.199
      stop: 192.168.1.199
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  externalIPs: true
  loadBalancerIPs: true
  interfaces:
    - enp45s0
