# Node-local DNS redirect: steers kube-dns VIP (10.96.0.10) to the same-node cache pod. Backends must be in kube-system (same namespace as the policy).
# toPorts names match the DaemonSet ports. LRP updates unsupported: DELETE + RECREATE to change. Requires localRedirectPolicies.enabled in the Cilium HelmRelease.
---
apiVersion: cilium.io/v2
kind: CiliumLocalRedirectPolicy
metadata:
  name: nodelocaldns
  namespace: kube-system
spec:
  redirectFrontend:
    serviceMatcher:
      serviceName: kube-dns
      namespace: kube-system
  redirectBackend:
    localEndpointSelector:
      matchLabels:
        k8s-app: node-local-dns
    toPorts:
      - port: "53"
        name: dns
        protocol: UDP
      - port: "53"
        name: dns-tcp
        protocol: TCP
