apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # STG OVERLAY — RESERVED/UNUSED: no cluster renders ./stg (see note in
  # controllers/stg/kustomization.yaml). These patches mirror the PRD LB VIP
  # (.199, single-IP pool — NOT an stg VIP; no stg VIP exists) + prd node NIC
  # (enp45s0) — see base/lb-pool.yaml placeholders __LB_VIP__ / __NODE_NIC__ —
  # so the overlay stays buildable and prd-shaped if a real stg environment
  # is ever defined; until then they are inert. Kept (not removed) so the
  # {base,dev,stg,prd} layout stays uniform (see flux/fleet/README.md).
  - patch: |
      - op: replace
        path: /spec/blocks/0/start
        value: 192.168.1.199
      - op: replace
        path: /spec/blocks/0/stop
        value: 192.168.1.199
    target:
      kind: CiliumLoadBalancerIPPool
      name: default
  - patch: |
      - op: replace
        path: /spec/interfaces/0
        value: enp45s0
    target:
      kind: CiliumL2AnnouncementPolicy
      name: default
