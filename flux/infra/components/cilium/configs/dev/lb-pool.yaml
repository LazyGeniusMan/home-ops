# Cilium LB IP pool + L2 announcement (§14 dev). .249 is the single dev
# LoadBalancer VIP; the Talos API VIP (.248, Layer2VIP) is NOT in this pool —
# see talos/clusters/acme-dev-bdo1-talos-apps-01 (endpoint .248, link eth0).
# L2 announcements go out on the dev node NIC eth0 (QEMU/KVM virtio).
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: default
spec:
  blocks:
    - start: 192.168.1.249
      stop: 192.168.1.249
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  externalIPs: true
  loadBalancerIPs: true
  interfaces:
    - eth0
