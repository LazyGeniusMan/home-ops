# VPA recommenders for the cilium-operator Deployment + cilium agent
# DaemonSet (CNI, no HPA — agent is a DaemonSet, N/A by design): updateMode
# Off — recommendations only; never auto-evict CNI pods (Recreate on the
# operator/agent would flap node networking). Release `cilium` renders
# operator Deployment `cilium-operator` in kube-system (release
# targetNamespace) + agent DaemonSet `cilium` (chart 1.20.2 Values.name
# default; see cilium.yaml header).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cilium-operator
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cilium-operator
  updatePolicy:
    updateMode: 'Off'
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cilium-agent
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: cilium
  updatePolicy:
    updateMode: 'Off'
