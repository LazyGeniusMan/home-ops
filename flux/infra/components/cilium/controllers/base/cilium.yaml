# Cilium v1.20.2 (§8.2): eBPF dataplane with kube-proxy replacement (Talos
# runs without kube-proxy), Gateway API support, Hubble observability, and a
# single-IP LoadBalancer pool. Chart: oci://quay.io/cilium/charts/cilium
# (verified tag 1.20.2; OCI is the upstream source of truth).
# NAMESPACE / BOOTSTRAP HANDOFF: this HelmRelease and the Terraform bootstrap
# Job (flux/fleet/terraform/main.tf, prerequisites.charts[0]) manage a SINGLE
# Helm release identity — release `cilium` in namespace `kube-system` on both
# sides. The Job installs there first (kube-system pre-exists on Talos, so the
# Job uses create_namespace = false); spec.targetNamespace + spec.
# storageNamespace below force helm-controller to render AND store the release
# in kube-system too, instead of defaulting to the HelmRelease object
# namespace (`cilium`, forced by the infra tenant Kustomization
# targetNamespace). Without both overrides Flux would install a second,
# conflicting copy of the CNI while the Job kept managing kube-system. Once
# helm-controller reconciles, the agent DaemonSet (`cilium` — chart
# Values.name default — in kube-system) carries the Flux ownership labels and
# the Job's flux_adoption_check skips the chart (Terraform then stops touching
# it; kube-system itself stays user-owned and is never adopted). The `cilium`
# Namespace created by the infra ResourceSet only hosts Flux bookkeeping
# (OCIRepository/Kustomizations/ServiceAccount) for this tenant.
# Telemetry: the chart has no usage-reporting/telemetry keys (verified: non-
# comment values lines matching telemetry|usageReporting|phoneHome|analytics
# are empty), so there is nothing to switch off.
# Monitoring: plain prometheus endpoints on, ServiceMonitors off until the
# monitoring stack (monitoring.coreos.com CRDs) lands — see README.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium-chart
spec:
  interval: 1h
  url: oci://quay.io/cilium/charts/cilium
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.20.2 # {"$imagepolicy": "infra:cilium:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  releaseName: cilium
  # Single release identity with the bootstrap Job: render and store in
  # kube-system (see header comment). serviceAccountName `flux` still resolves
  # in the HelmRelease object namespace (`cilium`).
  targetNamespace: kube-system
  storageNamespace: kube-system
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: cilium-chart
  install:
    # kube-system pre-exists on Talos — never create it (mirrors the Job's
    # create_namespace = false).
    createNamespace: false
    # CRD adoption (Flux helm-controller, chart 1.20.2): CreateReplace keeps
    # the Cilium CRDs advanced with the chart on every ImagePolicy bump.
    # Without it CRDs freeze at bootstrap (install default Create, upgrade
    # default Skip) while the dataplane auto-advances — schema drift.
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://docs.cilium.io/en/v1.20/helm-reference/
  values:
    # upgradeCompatibility: the initial Cilium minor installed in this
    # cluster (1.20). Bump only deliberately per the 1.20 upgrade guide —
    # it pins datapath behaviour so minor bumps never disrupt connections.
    upgradeCompatibility: "1.20"
    # Strict kube-proxy replacement: Talos runs with kube-proxy disabled.
    kubeProxyReplacement: true
    # LRP for the node-local DNS cache (§8.3): CiliumLocalRedirectPolicy
    # `nodelocaldns` (configs/base/node-local-dns-lrp.yaml) steers the
    # kube-dns VIP to the cache pod on the same node. CRD ships with the
    # chart (ciliumlocalredirectpolicies.cilium.io).
    localRedirectPolicies:
      enabled: true
    # Talos K8s API VIP (Layer2VIP) — NOT the LB pool VIP (__LB_VIP__),
    # see README. Placeholder patched per environment: prd 192.168.1.198,
    # dev 192.168.1.248.
    k8sServiceHost: __TALOS_API_VIP__
    k8sServicePort: 6443
    gatewayAPI:
      enabled: true
    hubble:
      relay:
        enabled: true
        # Resources: upstream defaults {} (cilium-docs values.yaml); light Go
        # server pinned requests-only so it is never CPU-throttled.
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: false
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
        serviceMonitor:
          enabled: false
    operator:
      # Operator replica placeholder - overridden by dev/prd overlays.
      # NO HPA: chart 1.20.2 has no operator autoscaling knob, and the operator
      # Deployment renders in kube-system (release targetNamespace) while the
      # tenant Kustomization targets namespace `cilium` — a same-base HPA would
      # land cross-namespace from its scaleTargetRef and never bind. Static
      # dev 1 / prd 2 is the correct scaling posture (agent is a DaemonSet, N/A).
      replicas: 1 # placeholder - overridden by dev/prd overlays
      # Resources: upstream defaults {} (cilium-docs values.yaml); requests
      # pinned (control-plane only, flat memory per the scalability report).
      # Requests-only, no limits: the operator must never be CPU-throttled.
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: false
    # Agent resources (top-level key, NOT agent.resources): requests pinned
    # per the chart's commented example (100m/512Mi — eBPF maps + per-pod
    # state). No limits: the CNI agent must never be throttled/OOM-killed.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    # Envoy DaemonSet (renders with gatewayAPI/L7): upstream defaults {}
    # (cilium-docs envoy.resources); idles without L7 policy so requests stay
    # light. Requests-only, no limits: data-plane must never throttle.
    envoy:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    # Agent prometheus + ServiceMonitor stay disabled (plain `if enabled`
    # gates); flip when the monitoring stack lands — see README.
    prometheus:
      enabled: false
      serviceMonitor:
        enabled: false
