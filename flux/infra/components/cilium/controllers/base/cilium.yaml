# Cilium v1.20.1 (§8.2): eBPF dataplane with kube-proxy replacement (Talos
# runs without kube-proxy), Gateway API support, Hubble observability, and a
# single-IP LoadBalancer pool. Chart: oci://quay.io/cilium/charts/cilium
# (verified tag 1.20.1; OCI is the upstream source of truth).
# Telemetry: the chart has no usage-reporting/telemetry keys (verified: non-
# comment values lines matching telemetry|usageReporting|phoneHome|analytics
# are empty), so there is nothing to switch off.
# Monitoring: plain prometheus endpoints on, ServiceMonitors off until the
# monitoring stack (monitoring.coreos.com CRDs) lands — see README.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium-chart
spec:
  interval: 1h
  url: oci://quay.io/cilium/charts/cilium
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.20.1 # {"$imagepolicy": "infra:cilium:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  releaseName: cilium
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: cilium-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://docs.cilium.io/en/v1.20/helm-reference/
  values:
    # Strict kube-proxy replacement: Talos runs with kube-proxy disabled.
    kubeProxyReplacement: true
    # Talos K8s API VIP (Layer2VIP) — NOT the LB pool VIP (.199), see README.
    k8sServiceHost: 192.168.1.198
    k8sServicePort: 6443
    gatewayAPI:
      enabled: true
    hubble:
      relay:
        enabled: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: false
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
        serviceMonitor:
          enabled: false
    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: false
    # Agent prometheus + ServiceMonitor stay disabled (plain `if enabled`
    # gates); flip when the monitoring stack lands — see README.
    prometheus:
      enabled: false
      serviceMonitor:
        enabled: false
