# Cilium 1.20.2: eBPF dataplane, kube-proxy replacement, Gateway API, Hubble, single-IP LB pool. Chart oci://quay.io/cilium/charts/cilium.
# Monitors `enabled: true`: monitoring CRDs land first via the prune:false infra-crds tenant (fleet/tenants/infra.yaml gates
# dependents on Established); the otel gateway TA discovers ServiceMonitors via the `otel-scrape: "true"` label. The cilium chart
# renders monitoring.coreos.com resources unconditionally (no skipIfMissing guard like ESO
# external-secrets/controllers/base/externalsecrets.yaml). All four telemetry endpoints (`prometheus.enabled`) stay on.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium-chart
spec:
  interval: 1h
  url: oci://quay.io/cilium/charts/cilium
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.20.2 # {"$imagepolicy": "infra:cilium:tag"}
  # No `verify:` block: no cosign identity pinned for this upstream chart —
  # tracked by tag + `$imagepolicy` under the fleet source allowlist.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  releaseName: cilium
  # Render + store in kube-system (see header); serviceAccountName resolves in the object namespace.
  targetNamespace: kube-system
  storageNamespace: kube-system
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: cilium-chart
  install:
    # kube-system pre-exists on Talos; never create it.
    createNamespace: false
    # Keep guardrail: chart 1.20.2 ships no Helm-owned CRDs (cilium.io CRDs
    # are applied at runtime by the operator), so HelmRelease deletion never
    # cascade-deletes them; CreateReplace advances the operator CRD path on
    # every bump instead of re-creating cluster state.
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    # Same keep guardrail as install: advance operator-managed CRDs in place.
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://docs.cilium.io/en/v1.20/helm-reference/
  values:
    # upgradeCompatibility pins datapath behaviour to the install minor (1.20); bump only per the upgrade guide.
    upgradeCompatibility: "1.20"
    # Talos runs kube-proxy disabled.
    kubeProxyReplacement: true
    # LRP for the node-local DNS cache: CiliumLocalRedirectPolicy `nodelocaldns` steers the kube-dns VIP to the same-node cache pod.
    localRedirectPolicies:
      enabled: true
    # Talos K8s API VIP (Layer2VIP), not the LB pool VIP (__LB_VIP__); patched per env (prd .198, dev .248).
    k8sServiceHost: __TALOS_API_VIP__
    k8sServicePort: 6443
    gatewayAPI:
      enabled: true
    # Pod/node/cluster wire encryption (WireGuard): every service-domain
    # `http://` endpoint in this repo (S3 :8333, OTLP :4317/:4318, ESO webhook
    # :8080, Dragonfly :6379) stays cleartext by design — no in-cluster TLS
    # termination — and Cilium WireGuard encrypts the pod traffic between
    # nodes instead. Fully automatic key management (per-node keypairs via
    # CiliumNode annotations); preferred over IPSec (manual
    # cilium-ipsec-keys Secret + manual rotation). Outside-cluster access
    # stays TLS-terminated at the Gateway API + cert-manager layer.
    encryption:
      enabled: true
      type: wireguard
      # nodeEncryption off: pod-to-pod encrypted, host traffic (metrics
      # hostPorts, kubelet) stays plain on the trusted LAN.
      nodeEncryption: false
    hubble:
      relay:
        enabled: true
        # Requests-only so the relay is never CPU-throttled.
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
        serviceMonitor:
          enabled: true
    operator:
      # Operator replica placeholder (dev/prd overlays). No HPA: chart has no operator autoscaling knob.
      replicas: 1 # placeholder - overridden by dev/prd overlays
      # Requests-only so the operator is never CPU-throttled.
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    # Agent resources (top-level key): requests-only, no limits; the CNI agent must never throttle.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    # Envoy DaemonSet: requests-only, no limits.
    envoy:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    # Agent ServiceMonitor on (CRDs via infra-crds, discovery via the otel-scrape label); agent metrics
    # endpoint (`prometheus.enabled: true`, port :9962 hostPort per node, 10s scrape, full metric
    # list — chart 1.20.2 has no allow-list knob, gateway ClickHouse sizing owns cardinality).
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
