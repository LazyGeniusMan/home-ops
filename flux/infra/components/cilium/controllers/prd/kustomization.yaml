apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd Talos K8s API VIP (Layer2VIP .198) — see base/cilium.yaml
  # placeholder __TALOS_API_VIP__.
  - patch: |
      - op: replace
        path: /spec/values/k8sServiceHost
        value: 192.168.1.198
    target:
      kind: HelmRelease
      name: cilium
  # Prd HA scaling: operator placeholder -> 2 (chart default).
  - patch: |
      - op: replace
        path: /spec/values/operator/replicas
        value: 2
    target:
      kind: HelmRelease
      name: cilium
  # TA discovery: the otel-gateway TargetAllocator object + namespace
  # selectors both match `otel-scrape: "true"` (tenant namespace carries it
  # from the fleet tenants/infra.yaml template). The chart renders one
  # ServiceMonitor per prometheus block (relay/metrics/operator/agent), each
  # with its own `labels` knob, so all four land via this overlay patch —
  # base values stay untouched. The agent monitor is gated on
  # `prometheus.enabled` (currently false), so its labels are dormant there
  # until that knob flips.
  - patch: |
      - op: add
        path: /spec/values/hubble/relay/prometheus/serviceMonitor/labels
        value:
          otel-scrape: "true"
      - op: add
        path: /spec/values/hubble/metrics/serviceMonitor/labels
        value:
          otel-scrape: "true"
      - op: add
        path: /spec/values/operator/prometheus/serviceMonitor/labels
        value:
          otel-scrape: "true"
      - op: add
        path: /spec/values/prometheus/serviceMonitor/labels
        value:
          otel-scrape: "true"
    target:
      kind: HelmRelease
      name: cilium
