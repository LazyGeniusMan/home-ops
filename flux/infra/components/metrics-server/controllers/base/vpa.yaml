# VPA recommender for the metrics-server Deployment (HPA-paired):
# updateMode Off — recommender-only, because the HPA scales the same CPU
# metric (known-limitations.md: never VPA-apply on a resource HPA scales
# on). Metrics-server feeds the Metrics API every sibling HPA consumes.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metrics-server
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metrics-server
  updatePolicy:
    updateMode: 'Off'
