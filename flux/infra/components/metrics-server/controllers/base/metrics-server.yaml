# Metrics Server (app v0.9.0, §9.2): in-cluster Metrics API feeding
# kubectl top + HPA/VPA. Chart mirror: oci://ghcr.io/controlplaneio-fluxcd/charts/metrics-server
# (verified tag 3.14.0 == app v0.9.0), same source the upstream D2 reference uses.
# Telemetry: metrics-server has no usage reporting; only kubelet scrape args.
# Monitoring: /metrics exposed (metrics.enabled) for the future Prometheus
# stack; ServiceMonitor stays disabled until monitoring.coreos.com CRDs land
# (unconditional render would wedge the release) — see README.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: metrics-server-chart
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/metrics-server
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "3.14.0" # {"$imagepolicy": "infra:metrics-server:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 1h
  releaseName: metrics-server
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: metrics-server-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/kubernetes-sigs/metrics-server/blob/master/charts/metrics-server/values.yaml
  values:
    # Replica seed (chart key is `replicas`) - the out-of-band HPA in hpa.yaml
    # owns the count at runtime (chart 3.14.0 has no autoscaling knob, only the
    # addonResizer sidecar default off). Dev seeds 1, prd seeds 2.
    # NOTE: metrics-server feeds the Metrics API that every other HPA in this
    # refactor consumes — keep it Ready (apiService.create stays true) or all
    # targetCPU HPAs go blind. Chart already defaults CPU requests 100m.
    replicas: 1 # placeholder - overridden by dev/prd overlays
    # Resources: upstream chart defaults pinned explicit (verified via helm
    # show values at 3.14.0: requests 100m/200Mi, no limits — limits stay
    # unset per upstream intent, see metrics-server-docs scaling note: 1m CPU
    # + 2MB memory per node). CPU requests REQUIRED for the targetCPU HPA.
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
    apiService:
      create: true
    metrics:
      enabled: true
    serviceMonitor:
      enabled: false
