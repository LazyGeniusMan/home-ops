# Metrics Server app v0.9.0 (chart 3.14.0 == app). Chart mirror oci://ghcr.io/controlplaneio-fluxcd/charts/metrics-server. /metrics exposed;
# ServiceMonitor `enabled: true`: monitoring CRDs land first via the prune:false infra-crds tenant (fleet/tenants/infra.yaml gates dependents
# on Established); the otel gateway TA discovers ServiceMonitors via the `otel-scrape: "true"` label. The chart renders monitoring.coreos.com
# resources unconditionally (no skipIfMissing guard like ESO external-secrets/controllers/base/externalsecrets.yaml).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: metrics-server-chart
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/metrics-server
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "3.14.0" # {"$imagepolicy": "infra:metrics-server:tag"}
  # No `verify:` block: no cosign identity pinned for this upstream chart —
  # tracked by tag + `$imagepolicy` under the fleet source allowlist.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 1h
  releaseName: metrics-server
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: metrics-server-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/kubernetes-sigs/metrics-server/blob/master/charts/metrics-server/values.yaml
  values:
    # Fixed replicas (chart key is `replicas`): NO HPA — metrics-server feeds
    # the Metrics API every other HPA consumes, so an HPA on itself is
    # circular (a Metrics API outage would freeze its own scaling). Dev pins
    # 1, prd pins 2. Keep it Ready (apiService.create stays true).
    replicas: 1 # placeholder - overridden by dev/prd overlays
    # Resources: upstream chart defaults pinned explicit (no limits per
    # upstream intent). No HPA consumes these (fixed replicas by design).
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
    apiService:
      create: true
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
