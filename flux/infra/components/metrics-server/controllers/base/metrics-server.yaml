# Metrics Server app v0.9.0 (chart 3.14.0 == app). Chart mirror oci://ghcr.io/controlplaneio-fluxcd/charts/metrics-server. /metrics exposed; ServiceMonitor stays disabled:
# the chart renders monitoring.coreos.com resources unconditionally (no skipIfMissing guard), so the flip waits for monitoring CRDs via the otel
# pipeline (see the ESO `renderMode: skipIfMissing` template in external-secrets/controllers/base/externalsecrets.yaml).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: metrics-server-chart
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/metrics-server
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "3.14.0" # {"$imagepolicy": "infra:metrics-server:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 1h
  releaseName: metrics-server
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: metrics-server-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/kubernetes-sigs/metrics-server/blob/master/charts/metrics-server/values.yaml
  values:
    # Replica seed (chart key is `replicas`) - the out-of-band HPA in hpa.yaml
    # owns the count at runtime (the chart has no autoscaling knob). Dev seeds
    # 1, prd seeds 2. metrics-server feeds the Metrics API every other HPA
    # consumes — keep it Ready (apiService.create stays true).
    replicas: 1 # placeholder - overridden by dev/prd overlays
    # Resources: upstream chart defaults pinned explicit (no limits per
    # upstream intent). CPU requests REQUIRED for the targetCPU HPA.
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
    apiService:
      create: true
    metrics:
      enabled: true
    serviceMonitor:
      enabled: false
