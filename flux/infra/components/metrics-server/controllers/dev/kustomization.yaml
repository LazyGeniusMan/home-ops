apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev single-instance scaling: metrics-server placeholder -> 1.
  - patch: |
      - op: replace
        path: /spec/values/replicas
        value: 1
    target:
      kind: HelmRelease
      name: metrics-server
