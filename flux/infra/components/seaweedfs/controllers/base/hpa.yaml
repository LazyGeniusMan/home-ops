# Out-of-band HPAs for the seaweedfs-operator + seaweedfs-csi-driver controller
# Deployments (charts 0.1.40 / 0.2.36 expose no autoscaling knobs — static
# replicaCount / controller.replicas). Node plugin + mount service are
# DaemonSets, N/A. Min/max patched per env (dev 1/2, prd 2/4); base carries
# the prd floor.
# Release `seaweedfs-operator` renders Deployment `seaweedfs-operator`;
# release `seaweedfs-csi-driver` renders Deployment
# `<release>-controller` (`helm template ...`, verified).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seaweedfs-operator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seaweedfs-operator
  minReplicas: 2 # placeholder - overridden by dev/prd overlays
  maxReplicas: 4 # placeholder - overridden by dev/prd overlays
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seaweedfs-csi-driver-controller
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seaweedfs-csi-driver-controller
  minReplicas: 2 # placeholder - overridden by dev/prd overlays
  maxReplicas: 4 # placeholder - overridden by dev/prd overlays
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
