# SeaweedFS operator (0.1.40) + CSI driver (0.2.36) via chartproxy OCI (proxy of https://seaweedfs.github.io/seaweedfs-operator/); chart versions pinned, images track update-policies/seaweedfs.yaml.
# Operator CRDs Helm-managed (crds.create); COSI CRDs vendored in cosi/crds/base (prune:false); driver classes hand-vendored in configs/base (chart cosi.enabled off).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: seaweedfs-operator
spec:
  interval: 1h
  url: oci://chartproxy.container-registry.com/seaweedfs.github.io/seaweedfs-operator/seaweedfs-operator
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.1.40
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: seaweedfs-csi-driver
spec:
  interval: 1h
  url: oci://chartproxy.container-registry.com/seaweedfs.github.io/seaweedfs-csi-driver/helm/seaweedfs-csi-driver
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.2.36
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
spec:
  interval: 1h
  releaseName: seaweedfs-operator
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: seaweedfs-operator
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/seaweedfs/seaweedfs-operator/tree/master/deploy/helm
  values:
    # Replica seed (dev 1, prd 2); HPA owns the count. CPU requests required for the targetCPU HPA.
    resources:
      requests:
        cpu: 100m
        memory: 50Mi
      limits:
        cpu: 500m
        memory: 500Mi
    replicaCount: 1 # placeholder - overridden by dev/prd overlays
    crds:
      create: true
    csiDriver:
      # Driver ships as the seaweedfs-csi-driver HelmRelease below, not via the operator.
      enabled: false
    serviceMonitor:
      enabled: false
    grafanaDashboard:
      enabled: false
    webhook:
      enabled: true
      certManager:
        # §9 cert-manager mints the webhook cert; skips the certgen Jobs.
        enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-csi-driver
spec:
  interval: 1h
  releaseName: seaweedfs-csi-driver
  serviceAccountName: flux
  dependsOn:
    - name: seaweedfs-operator
  chartRef:
    kind: OCIRepository
    name: seaweedfs-csi-driver
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/seaweedfs/seaweedfs-csi-driver/tree/master/deploy/helm/seaweedfs-csi-driver
  values:
    # Controller replica seed (dev 1, prd 2); HPA owns the count.
    controller:
      replicas: 1 # placeholder - overridden by dev/prd overlays
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    # Sidecar requests required (HPA averages across all containers).
    csiProvisioner:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    csiResizer:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    csiAttacher:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    csiLivenessProbe:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    driverName: seaweedfs-csi-driver
    seaweedfsFiler: "seaweed-main-filer.seaweedfs:8888"
    # Empty disables the chart's built-in class; tiered classes in configs/base/storageclasses.yaml.
    storageClassName: ""
    seaweedfsCsiPlugin:
      image: chrislusf/seaweedfs-csi-driver
      tag: "v1.4.32" # {"$imagepolicy": "infra:seaweedfs-csi:tag"}
    mountService:
      enabled: true
      image: chrislusf/seaweedfs-mount
      tag: "v1.4.32" # {"$imagepolicy": "infra:seaweedfs-csi:tag"}
