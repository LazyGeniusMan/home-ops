# SeaweedFS operator + CSI driver (§12.1). Charts are classic HelmRepository
# sources: OCI pulls 403 on both seaweedfs repos (verified 2026-09-08; they
# publish only a classic index.yaml), so chart versions below are bumped
# manually (see README) while container images track
# flux/infra/update-policies/seaweedfs.yaml via $imagepolicy markers.
# CRD lifecycles in this repo (do not confuse them):
# - Vendored COSI CRDs: cosi/crds/base (5 files, tag v0.2.2) render through
#   the fleet's prune:false infra-crds Kustomization — never garbage-collected.
# - Chart-templated operator CRDs: this file's `crds.create: true` below —
#   the operator chart owns its own CRDs, Helm-managed, out of scope here.
# - Hand-vendored driver classes: seaweedfs/configs/base/bucketclasses.yaml
#   (BucketClass/BucketAccessClass CRs, NOT CRDs) + driver.yaml/driver-rbac.yaml
#   mirror the upstream seaweedfs chart templates/cosi/ (chart `cosi.enabled`
#   stays off — see the seaweedfs README "COSI driver sourcing": it assumes a
#   chart-managed cluster, so the three hand-vendored files are less drift
#   surface than a second HelmRelease).
# Telemetry: operator serviceMonitor + grafanaDashboard stay disabled
# (unguarded monitors OFF); no usage-reporting knobs exist upstream.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: seaweedfs-operator
spec:
  interval: 1h
  url: https://seaweedfs.github.io/seaweedfs-operator/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: seaweedfs-csi-driver
spec:
  interval: 1h
  url: https://seaweedfs.github.io/seaweedfs-csi-driver/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
spec:
  interval: 1h
  releaseName: seaweedfs-operator
  serviceAccountName: flux
  chart:
    spec:
      chart: seaweedfs-operator
      version: 0.1.40
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/seaweedfs/seaweedfs-operator/tree/master/deploy/helm
  values:
    # Replica seed - the out-of-band HPA in hpa.yaml owns the operator count at
    # runtime (chart 0.1.40 has no autoscaling knob). Dev seeds 1, prd seeds 2.
    # Resources: chart 0.1.40 defaults pinned explicit (verified via helm show
    # values: requests 100m/50Mi, limits 500m/500Mi on container
    # seaweedfs-operator). CPU requests REQUIRED for the targetCPU HPA.
    resources:
      requests:
        cpu: 100m
        memory: 50Mi
      limits:
        cpu: 500m
        memory: 500Mi
    replicaCount: 1 # placeholder - overridden by dev/prd overlays
    crds:
      create: true
    csiDriver:
      # The driver ships as the `seaweedfs-csi-driver` HelmRelease below, not via
      # the operator: bundled CSI pins v1.4.20 vs chart-tracked v1.4.30 ($imagepolicy),
      # manages one StorageClass per SeaweedCSIDriver CR vs our two tiered (nvme/sata)
      # classes, and couples driver upgrades to the operator — so it stays off.
      enabled: false
    serviceMonitor:
      enabled: false
    grafanaDashboard:
      enabled: false
    webhook:
      enabled: true
      certManager:
        # §9 cert-manager mints the webhook cert; skips the certgen Jobs.
        enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-csi-driver
spec:
  interval: 1h
  releaseName: seaweedfs-csi-driver
  serviceAccountName: flux
  dependsOn:
    - name: seaweedfs-operator
  chart:
    spec:
      chart: seaweedfs-csi-driver
      version: 0.2.36
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-csi-driver
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/seaweedfs/seaweedfs-csi-driver/tree/master/deploy/helm/seaweedfs-csi-driver
  values:
    # Controller replica seed - the out-of-band HPA in hpa.yaml owns the count
    # at runtime (chart 0.2.36 has no autoscaling knob; node plugin + mount
    # service are DaemonSets, N/A). Dev seeds 1, prd seeds 2.
    # CPU requests REQUIRED for the targetCPU HPA (controller + sidecars
    # default resources {}).
    controller:
      replicas: 1 # placeholder - overridden by dev/prd overlays
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    # Sidecar requests REQUIRED too: the HPA averages CPU utilization across
    # ALL containers, and sidecars default resources {} (no denominator).
    csiProvisioner:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    csiResizer:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    csiAttacher:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    csiLivenessProbe:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    driverName: seaweedfs-csi-driver
    seaweedfsFiler: "seaweed-main-filer.seaweedfs:8888"
    # Empty disables the chart's single built-in class; the tiered
    # seaweedfs-ssd-* classes live in configs/base/storageclasses.yaml.
    storageClassName: ""
    seaweedfsCsiPlugin:
      image: chrislusf/seaweedfs-csi-driver
      tag: "v1.4.32" # {"$imagepolicy": "infra:seaweedfs-csi:tag"}
    mountService:
      enabled: true
      image: chrislusf/seaweedfs-mount
      tag: "v1.4.32" # {"$imagepolicy": "infra:seaweedfs-csi:tag"}
