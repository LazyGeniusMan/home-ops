apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd HA scaling: operator + CSI controller placeholders -> 2
  # (node plugin + mount service are DaemonSets, N/A).
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 2
    target:
      kind: HelmRelease
      name: seaweedfs-operator
  - patch: |
      - op: replace
        path: /spec/values/controller/replicas
        value: 2
    target:
      kind: HelmRelease
      name: seaweedfs-csi-driver
