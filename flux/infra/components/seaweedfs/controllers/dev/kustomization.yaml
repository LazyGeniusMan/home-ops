apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev scaling: operator + CSI controller seeds -> 1; out-of-band HPAs own
  # the counts (min 1/max 2).
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: seaweedfs-operator
  - patch: |
      - op: replace
        path: /spec/values/controller/replicas
        value: 1
    target:
      kind: HelmRelease
      name: seaweedfs-csi-driver
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: seaweedfs-operator
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: seaweedfs-csi-driver-controller
