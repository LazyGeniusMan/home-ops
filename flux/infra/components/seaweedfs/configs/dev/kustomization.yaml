apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev UI/S3 hostnames (ui.seaweedfs.homelab-dev.yansyah.my.id / s3.seaweedfs.homelab-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: ui.seaweedfs.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-ui
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: ui.seaweedfs.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-ui-tls
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: s3.seaweedfs.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-s3
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: s3.seaweedfs.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-s3-tls
  # Dev proxy vault refs + issuer/callback/cookie-domain.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/seaweedfs/oauth2-proxy-client-id
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/seaweedfs/oauth2-proxy-client-secret
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/seaweedfs/oauth2-proxy-cookie-secret
    target:
      kind: ExternalSecret
      name: ui-auth-credentials
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --oidc-issuer-url=https://zitadel.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --redirect-url=https://ui.seaweedfs.homelab-dev.yansyah.my.id/oauth2/callback
      - op: replace
        path: /spec/template/spec/containers/0/args/8
        value: --cookie-domain=.homelab-dev.yansyah.my.id
    target:
      kind: Deployment
      name: ui-auth
  # Dev SeaweedFS SSO Terraform identity: vault ref for the shared instance
  # JWT key + CR vars (dev issuer host, dev emails, dev UI host). org_id is a
  # one-time manual fill from `zitadel-bootstrap-outputs` (zitadel ns).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/terraform-jwt-profile-json
    target:
      kind: ExternalSecret
      name: seaweedfs-terraform-vars
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: zitadel.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/1/value
        value: REPLACE-ME-WITH-ORG-ID-FROM-zitadel-bootstrap-outputs
      - op: replace
        path: /spec/vars/2/value
        value: admin@homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/3/value
        value: user@homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/4/value
        value: ui.seaweedfs.homelab-dev.yansyah.my.id
    target:
      kind: Terraform
      name: seaweedfs-sso
  # Dev token vault + wildcard DNS.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.seaweedfs.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-seaweedfs
