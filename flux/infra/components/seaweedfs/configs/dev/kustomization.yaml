apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev UI/S3 hostnames (ui.seaweedfs.homelab-dev.yansyah.my.id / s3.seaweedfs.homelab-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: ui.seaweedfs.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-ui
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: ui.seaweedfs.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-ui-tls
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: s3.seaweedfs.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-s3
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: s3.seaweedfs.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-s3-tls
  # Dev proxy issuer/callback/cookie-domain.
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --oidc-issuer-url=https://zitadel.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --redirect-url=https://ui.seaweedfs.homelab-dev.yansyah.my.id/oauth2/callback
      - op: replace
        path: /spec/template/spec/containers/0/args/8
        value: --cookie-domain=.homelab-dev.yansyah.my.id
    target:
      kind: Deployment
      name: ui-auth
  # Dev SeaweedFS SSO Terraform identity: CR vars (dev issuer host, dev
  # redirect URIs) against the shared infra/zitadel root (see
  # base/terraform.yaml cross-namespace sourceRef). IDs flow from the
  # FirstInstance handoff via the cross-namespace SecretStore — no per-env
  # ID literals, no vault ref patch. project_name, create_user_role,
  # create_cookie_secret are env-invariant — only hosts vary per env.
  # Positional: /spec/vars/0 (domain) + /spec/vars/2/value/0 (redirect) +
  # /spec/vars/3/value/0 (post-logout).
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: zitadel.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value/0
        value: https://ui.seaweedfs.homelab-dev.yansyah.my.id/oauth2/callback
      - op: replace
        path: /spec/vars/3/value/0
        value: https://ui.seaweedfs.homelab-dev.yansyah.my.id/
    target:
      kind: Terraform
      name: seaweedfs-sso
  # Dev token vault + wildcard DNS.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.seaweedfs.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-seaweedfs
  # Dev single-instance scaling: stateful HA placeholders -> 1.
  # The COSI driver stays a singleton (1) in both envs.
  - patch: |
      - op: replace
        path: /spec/master/replicas
        value: 1
    target:
      kind: Seaweed
      name: seaweed-main
  - patch: |
      - op: replace
        path: /spec/volume/replicas
        value: 1
    target:
      kind: Seaweed
      name: seaweed-main
  - patch: |
      - op: replace
        path: /spec/volumeTopology/sata-bulk/replicas
        value: 1
    target:
      kind: Seaweed
      name: seaweed-main
  - patch: |
      - op: replace
        path: /spec/filer/replicas
        value: 1
    target:
      kind: Seaweed
      name: seaweed-main
  - patch: |
      - op: replace
        path: /spec/s3/replicas
        value: 1
    target:
      kind: Seaweed
      name: seaweed-main
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: ui-auth
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: seaweedfs-cosi-driver
