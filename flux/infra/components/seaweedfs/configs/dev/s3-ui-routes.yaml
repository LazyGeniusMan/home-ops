# SeaweedFS Gateway HTTPRoutes dev (§14): filer UI behind the admin-only
# oauth2-proxy (ui-auth, reverse-proxy mode — see ui-auth.yaml) + standalone
# S3 API DIRECT to the S3 Service. Port 80 carries only the RequestRedirect
# filter (mirrors the §8.1 httproutes.yaml discipline); TLS terminates on
# 443 with the in-namespace wildcard Secret. The S3 endpoint
# https://s3.seaweedfs.homelab-dev.yansyah.my.id is THE dev contract other
# components use and stays proxy-free on purpose: it is a SigV4-gated
# machine endpoint (rclone dev addresses it directly), and browser-cookie
# OIDC would break it.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-ui
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - ui.seaweedfs.homelab-dev.yansyah.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-ui-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - ui.seaweedfs.homelab-dev.yansyah.my.id
  rules:
    - backendRefs:
        - name: ui-auth
          port: 4180
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - s3.seaweedfs.homelab-dev.yansyah.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - s3.seaweedfs.homelab-dev.yansyah.my.id
  rules:
    - backendRefs:
        - name: seaweed-main-s3
          port: 8333
