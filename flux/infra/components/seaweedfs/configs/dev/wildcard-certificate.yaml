# *.seaweedfs.homelab-dev.yansyah.my.id wildcard Certificate dev (§14).
# Mirrors the gateway-api/configs/dev/wildcard-certificate.yaml discipline:
# cert-manager Secrets are namespace-local, so this duplicate Certificate
# mints seaweedfs-wildcard-tls HERE via ClusterIssuer/letsencrypt. The token
# ExternalSecret mirrors cert-manager/configs/dev/cluster-issuer.yaml
# (same DEV Proton Pass remoteRef) so the DNS-01 solver credential exists in
# this namespace too.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-seaweedfs
spec:
  secretName: seaweedfs-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.seaweedfs.homelab-dev.yansyah.my.id"
