apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd UI/S3 hostnames (admin.seaweedfs.home-ops.yansyah.my.id / s3.seaweedfs.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: admin.seaweedfs.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-ui
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: admin.seaweedfs.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-ui-tls
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: s3.seaweedfs.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-s3
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: s3.seaweedfs.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: seaweedfs-s3-tls
  # Prd proxy issuer/callback/cookie-domain (values keys, not arg indices —
  # the chart takes every flag from extraArgs).
  - patch: |
      - op: replace
        path: /spec/values/extraArgs/oidc-issuer-url
        value: https://admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/redirect-url
        value: https://admin.seaweedfs.home-ops.yansyah.my.id/oauth2/callback
      - op: replace
        path: /spec/values/extraArgs/cookie-domain
        value: .home-ops.yansyah.my.id
    target:
      kind: HelmRelease
      name: ui-auth
  # Prd SeaweedFS SSO Terraform identity: CR vars (prd issuer host, prd
  # redirect URIs) against the shared infra/zitadel root (see
  # base/terraform.yaml cross-namespace sourceRef). IDs flow from the
  # FirstInstance handoff via the cross-namespace SecretStore — no per-env
  # ID literals, no vault ref patch. project_name, create_user_role,
  # create_cookie_secret are env-invariant — only hosts vary per env.
  # Positional: /spec/vars/0 (domain) + /spec/vars/2 (login_base_uri) + /spec/vars/3/value/0 (redirect) +
  # /spec/vars/4/value/0 (post-logout).
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: https://login.zitadel.home-ops.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/3/value/0
        value: https://admin.seaweedfs.home-ops.yansyah.my.id/oauth2/callback
      - op: replace
        path: /spec/vars/4/value/0
        value: https://admin.seaweedfs.home-ops.yansyah.my.id/
    target:
      kind: Terraform
      name: seaweedfs-sso
  # Prd token vault + wildcard DNS.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-seaweedfs
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: seaweedfs-wildcard-tls
    target:
      kind: Certificate
      name: wildcard-seaweedfs
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.seaweedfs.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-seaweedfs
  # Prd production HA: pin the stateful placeholders (master/volume 3,
  # filer/s3 2). Stateless Deployments (ui-auth, COSI driver) autoscale via
  # HPA (prd min 2/max 4). No Deployment /spec/replicas patches: base
  # replicas: 1 is the create-time seed, HPA owns runtime count.
  - patch: |
      - op: replace
        path: /spec/master/replicas
        value: 3
    target:
      kind: Seaweed
      name: seaweed-main
  - patch: |
      - op: replace
        path: /spec/volume/replicas
        value: 3
    target:
      kind: Seaweed
      name: seaweed-main
  - patch: |
      - op: replace
        path: /spec/volumeTopology/sata-bulk/replicas
        value: 3
    target:
      kind: Seaweed
      name: seaweed-main
  - patch: |
      - op: replace
        path: /spec/filer/replicas
        value: 2
    target:
      kind: Seaweed
      name: seaweed-main
  - patch: |
      - op: replace
        path: /spec/s3/replicas
        value: 2
    target:
      kind: Seaweed
      name: seaweed-main
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: ui-auth
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: seaweedfs-cosi-driver
