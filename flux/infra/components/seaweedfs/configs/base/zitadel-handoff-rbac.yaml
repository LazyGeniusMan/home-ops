# Narrow cross-namespace handoff grant for the seaweedfs ESO reader (§12).
# ESO mirrors the FirstInstance handoff Secrets (`zitadel-bootstrap-credentials`
# + `zitadel-bootstrap-outputs`, both in the `zitadel` namespace) into this
# namespace's `seaweedfs-terraform-vars` Secret through the cross-namespace
# `seaweedfs-zitadel` SecretStore (configs/base/terraform.yaml) — replacing the retired
# `data.terraform_remote_state` read off
# `tfstate-default-zitadel-bootstrap-identity` (owned by the deleted bootstrap
# Terraform CR) and its `seaweedfs-terraform-remote-state-reader` grant.
# The store authenticates as THIS namespace SA `eso-zitadel-handoff-reader`,
# so the SA needs get/list/watch on the two handoff Secrets only
# (resourceNames pins both) plus selfsubjectrulesreviews create (ESO
# Kubernetes-provider validation) — and nothing else.
# Ownership note: the Role + RoleBinding below carry explicit
# `metadata.namespace: zitadel` but are OWNED BY the seaweedfs component — they
# ship in the seaweedfs configs dir so they reconcile (and prune) with the component.
# Same-namespace `varsFrom` CANNOT cross namespaces (no namespace field),
# which is why the ESO mirror + this RBAC is the mechanism.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seaweedfs-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zitadel-bootstrap-credentials", "zitadel-bootstrap-outputs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seaweedfs-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
subjects:
  - kind: ServiceAccount
    name: eso-zitadel-handoff-reader
    namespace: seaweedfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seaweedfs-zitadel-handoff-reader
