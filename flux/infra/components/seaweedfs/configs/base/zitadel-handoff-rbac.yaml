# Narrow cross-namespace handoff grant for the seaweedfs ESO reader. ESO mirrors
# the zitadel handoff Secrets into this namespace's seaweedfs-terraform-vars
# Secret through the cross-namespace seaweedfs-zitadel SecretStore
# (configs/base/terraform.yaml). The store authenticates as this namespace SA
# eso-zitadel-handoff-reader, so the SA needs get/list/watch on the two handoff
# Secrets only plus selfsubjectrulesreviews create (ESO validation).
# The Role + RoleBinding carry metadata.namespace: zitadel but are OWNED BY the
# seaweedfs component (reconcile and prune with it).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seaweedfs-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zitadel-bootstrap-credentials", "zitadel-bootstrap-outputs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seaweedfs-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
subjects:
  - kind: ServiceAccount
    name: eso-zitadel-handoff-reader
    namespace: seaweedfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seaweedfs-zitadel-handoff-reader
