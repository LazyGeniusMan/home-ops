# HPA for the SeaweedFS COSI driver. Multi-replica is safe (sidecar leader
# election, standbys never double-act). Bounds per env via overlays (dev 1/2,
# prd 2/4); base replicas: 1 is the seed, HPA owns runtime count.
# Prerequisite: metrics-server healthy.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seaweedfs-cosi-driver
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seaweedfs-cosi-driver
  minReplicas: 1 # placeholder - overridden by dev/prd overlays
  maxReplicas: 2 # placeholder - overridden by dev/prd overlays
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
