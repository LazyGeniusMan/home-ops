# SeaweedFS COSI driver RBAC (pairs with driver.yaml; NARROWED from the upstream seaweedfs chart templates/cosi/cosi-cluster-role.yaml:
# read-only COSI inventory + status updates only, leases without delete, secrets read-only, events write-only —
# the driver provisions from BucketInfo and never manages Secrets).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs-cosi-driver
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: seaweedfs-cosi-driver
rules:
  # Read-only COSI inventory for the driver (buckets/claims/accesses +
  # classes + their /status subresources); the controller owns writes.
  - apiGroups: ["objectstorage.k8s.io"]
    resources:
      - "buckets"
      - "bucketaccesses"
      - "bucketclaims"
      - "bucketaccessclasses"
      - "buckets/status"
      - "bucketaccesses/status"
      - "bucketclaims/status"
      - "bucketaccessclasses/status"
    verbs:
      - "get"
      - "list"
      - "watch"
  # Driver status updates only (sidecar leader election + COSI status
  # writes); drops the upstream template's broad create/delete on leases.
  - apiGroups: ["objectstorage.k8s.io"]
    resources:
      - "buckets/status"
      - "bucketaccesses/status"
      - "bucketclaims/status"
      - "bucketaccessclasses/status"
    verbs:
      - "update"
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs:
      - "get"
      - "watch"
      - "list"
      - "update"
      - "create"
  # Secrets read-only + events write-only: the driver reads provisioned
  # BucketInfo credentials and emits events; it never manages Secrets.
  - apiGroups: [""]
    resources:
      - "secrets"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups: [""]
    resources:
      - "events"
    verbs:
      - "create"
      - "patch"
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: seaweedfs-cosi-driver
subjects:
  - kind: ServiceAccount
    name: seaweedfs-cosi-driver
    namespace: seaweedfs
roleRef:
  kind: ClusterRole
  name: seaweedfs-cosi-driver
  apiGroup: rbac.authorization.k8s.io
