# SeaweedFS COSI driver RBAC (pairs with driver.yaml; mirrors upstream seaweedfs chart templates/cosi/cosi-cluster-role.yaml; SA namespace-local in the seaweedfs tenant).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs-cosi-driver
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: seaweedfs-cosi-driver
rules:
  - apiGroups: ["objectstorage.k8s.io"]
    resources:
      - "buckets"
      - "bucketaccesses"
      - "bucketclaims"
      - "bucketaccessclasses"
      - "buckets/status"
      - "bucketaccesses/status"
      - "bucketclaims/status"
      - "bucketaccessclasses/status"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "create"
      - "delete"
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs:
      - "get"
      - "watch"
      - "list"
      - "delete"
      - "update"
      - "create"
  - apiGroups: [""]
    resources:
      - "secrets"
      - "events"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "create"
      - "delete"
      - "patch"
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: seaweedfs-cosi-driver
subjects:
  - kind: ServiceAccount
    name: seaweedfs-cosi-driver
    namespace: seaweedfs
roleRef:
  kind: ClusterRole
  name: seaweedfs-cosi-driver
  apiGroup: rbac.authorization.k8s.io
