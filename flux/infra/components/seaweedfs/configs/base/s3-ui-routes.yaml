# SeaweedFS Gateway HTTPRoutes (§§8.1/12.1): filer UI behind the admin-only
# oauth2-proxy (ui-auth, reverse-proxy mode — see ui-auth.yaml) + standalone
# S3 API DIRECT to the S3 Service. Port 80 carries only the RequestRedirect
# filter (mirrors the §8.1 httproutes.yaml discipline); TLS terminates on
# 443 with the in-namespace wildcard Secret. The S3 endpoint
# https://__SEAWEEDFS_S3_HOST__ is THE contract other
# components use (see README) and stays proxy-free on purpose: it is a
# SigV4-gated machine endpoint (rclone + CNPG/clickhouse/dragonfly backup
# writers address it directly), and browser-cookie OIDC would break them.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-ui
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - __SEAWEEDFS_UI_HOST__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-ui-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SEAWEEDFS_UI_HOST__
  rules:
    - backendRefs:
        - name: ui-auth
          port: 4180
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - __SEAWEEDFS_S3_HOST__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SEAWEEDFS_S3_HOST__
  rules:
    - backendRefs:
        - name: seaweed-main-s3
          port: 8333
