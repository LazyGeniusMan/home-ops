# SeaweedFS Gateway HTTPRoutes (§§8.1/12.1): filer UI + standalone S3 API
# behind the shared Gateway. Port 80 carries only the RequestRedirect
# filter (mirrors the §8.1 httproutes.yaml discipline); TLS terminates on
# 443 with the in-namespace wildcard Secret. The S3 endpoint
# https://s3.seaweedfs.home-ops.yansyah.my.id is THE contract other
# components use (see README). Names leave room for wave 3c to add
# ExternalAuth (Zitadel/OIDC) without renaming routes.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-ui
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - ui.seaweedfs.home-ops.yansyah.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-ui-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - ui.seaweedfs.home-ops.yansyah.my.id
  rules:
    - backendRefs:
        - name: seaweed-main-filer
          port: 8888
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - s3.seaweedfs.home-ops.yansyah.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - s3.seaweedfs.home-ops.yansyah.my.id
  rules:
    - backendRefs:
        - name: seaweed-main-s3
          port: 8333
