# SeaweedFS Gateway HTTPRoutes: filer UI behind admin-only ui-auth proxy; S3 API direct to the S3 Service (SigV4 machine endpoint; OIDC would break clients). Port 80 redirect only; TLS on 443 with the in-namespace wildcard Secret.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-ui
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - __SEAWEEDFS_UI_HOST__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-ui-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SEAWEEDFS_UI_HOST__
  rules:
    - backendRefs:
        - name: ui-auth
          port: 4180
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - __SEAWEEDFS_S3_HOST__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SEAWEEDFS_S3_HOST__
  rules:
    - backendRefs:
        - name: seaweed-main-s3
          port: 8333
