# SeaweedFS filer-UI SSO identity (§12 follow-up), machine-applied by Tofu
# Controller. Owns ONLY this component's slice: the `seaweedfs` Zitadel
# project + project-scoped admin role (seaweedfs-admin) + admin grant
# + the `seaweedfs` OIDC client for the oauth2-proxy UI gate.
# Project-scoped means seaweedfs-admin NEVER implies org admin.
#
# Ordering: this object ships in configs/ (fleet `infra-configs`
# Kustomization dependsOn `infra-controllers`), so it only reconciles after
# the Zitadel HelmRelease is Ready. Terraform `dependsOn` is Terraform-CR-only
# upstream (checkDependencies resolves every entry as kind Terraform), so NO
# dependsOn entry here — the fleet ordering above is the mechanism. Same
# shape as flux/infra/components/zitadel/configs/base/terraform-bootstrap.yaml.
# Upstream wiring: org_id + admin ID flows from the zitadel bootstrap
# slice via `data.terraform_remote_state` (in-cluster Kubernetes backend,
# state Secret `tfstate-default-zitadel-bootstrap-identity` in the `zitadel`
# namespace) — NO org_id var, NO manual per-env fill, NO email lookups.
# The read runs as this namespace's tofu runner SA
# (`system:serviceaccount:seaweedfs:tf-runner`); its narrow cross-namespace
# grant (Role + RoleBinding in the zitadel namespace, get+list on the
# bootstrap state Secret only) ships in `terraform-remote-state-rbac.yaml` in
# this SAME base dir so it reconciles with the component — the Role lives in
# the zitadel namespace but is owned by the seaweedfs component (prune it if
# seaweedfs is ever removed). Same-namespace `varsFrom` CANNOT cross
# namespaces (no namespace field), which is why remote-state + RBAC is the
# mechanism here.
# First-run prerequisite (one-time, manual): the Zitadel bootstrap must have
# applied first (org + users exist), and the IAM_OWNER service-user key JSON
# must be seeded at pass://<env-vault>/zitadel/terraform-jwt-profile-json
# (shared instance key, mirrored into this namespace — same pattern as the
# cloudflare-api-token mirror). Without the key the CR retries on interval.
# Backend: in-cluster Kubernetes default (state Secrets in the seaweedfs
# namespace) — no backendConfig needed. Drift detection stays on (default).
# Outputs: client_id + client_secret (sensitive) + cookie_secret (sensitive)
# land in `seaweedfs-sso-outputs`; the `ui-auth-credentials` ExternalSecret
# consumes all three from that Secret through the in-cluster `seaweedfs-k8s`
# SecretStore (ui-auth.yaml) — never Git, never Proton Pass.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: seaweedfs-terraform-vars
    template:
      data:
        jwt_profile_json: "{{ .jwt_profile_json }}"
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/terraform-jwt-profile-json
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: seaweedfs-sso
spec:
  interval: 30m
  approvePlan: auto
  # Component OCI artifact (same namespace, in-tenant `infra` OCIRepository):
  # the artifact packs the whole component dir, terraform/ included.
  sourceRef:
    kind: OCIRepository
    name: infra
  path: ./terraform
  # Plain (non-sensitive) per-env values; secrets come from varsFrom below.
  # varsFrom overrides vars on key collision (upstream GenerateVarsForTF).
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: ui_host
      value: __SEAWEEDFS_UI_HOST__
  varsFrom:
    - kind: Secret
      name: seaweedfs-terraform-vars
  writeOutputsToSecret:
    name: seaweedfs-sso-outputs
    outputs:
      - client_id
      - client_secret
      - cookie_secret
