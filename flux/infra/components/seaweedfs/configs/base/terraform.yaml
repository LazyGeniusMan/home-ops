# SeaweedFS filer-UI SSO identity (§12 follow-up), machine-applied by Tofu
# Controller. Owns ONLY this component's slice: the `seaweedfs` Zitadel
# project + project-scoped admin role (seaweedfs-admin) + admin grant
# + the `seaweedfs` OIDC client for the oauth2-proxy UI gate.
# Project-scoped means seaweedfs-admin NEVER implies org admin.
#
# Ordering: this object ships in configs/ (fleet `infra-configs`
# Kustomization dependsOn `infra-controllers`), so it only reconciles after
# the Zitadel HelmRelease + FirstInstance setup Job are Ready. Terraform `dependsOn`
# is Terraform-CR-only upstream (checkDependencies resolves every entry as kind Terraform),
# so NO dependsOn entry here — the fleet ordering above is the mechanism.
# Upstream wiring: org_id + admin ID flow from the FirstInstance handoff
# (`zitadel-bootstrap-outputs` Secret in the `zitadel` namespace, operator-created
# once per the zitadel README runbook) via the ESO-synced `seaweedfs-terraform-vars`
# Secret (same-namespace `varsFrom` below; the cross-namespace `seaweedfs-zitadel`
# SecretStore + narrow `seaweedfs-zitadel-handoff-reader` Role in `zitadel-handoff-rbac.yaml` do the
# mirroring). NO org_id literal in git, NO manual per-env fill, NO email lookups,
# NO remote-state read off the retired bootstrap state. Provider auth likewise
# flows from the chart handoff (`zitadel-bootstrap-credentials` key
# `jwt_profile_json`) through the same Secret. Same-namespace `varsFrom` CANNOT
# cross namespaces (no namespace field), which is why the ESO mirror + RBAC is
# the mechanism here.
# First-run prerequisite (zero-UI): chart setup Job mints the key + ESO mirrors
# both handoff Secrets. Without the mirrored `seaweedfs-terraform-vars` the CR
# retries on interval — no vault seeding, no console step.
# Backend: in-cluster Kubernetes default (state Secrets in the seaweedfs
# namespace) — no backendConfig needed. Drift detection stays on (default).
# Outputs: client_id + client_secret (sensitive) + cookie_secret (sensitive)
# land in `seaweedfs-sso-outputs`; the `ui-auth-credentials` ExternalSecret
# consumes all three from that Secret through the in-cluster `seaweedfs-k8s`
# SecretStore (ui-auth.yaml) — never Git, never Proton Pass.
---
# Cross-namespace handoff reader: mirrors the two chart-minted handoff Secrets
# from the `zitadel` namespace into this namespace's `seaweedfs-terraform-vars`
# Secret (remoteNamespace MUST be `zitadel` — ESO reads REMOTE secrets through
# this namespace's `eso-zitadel-handoff-reader` SA; the narrow Role + RoleBinding
# in `zitadel-handoff-rbac.yaml` grant get/list/watch on the two handoff Secrets
# only). Same pattern as the in-namespace `seaweedfs-k8s` store
# (server.url omitted = kubernetes.default, kube-root-ca.crt supplies the API CA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-handoff-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs-zitadel
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-handoff-reader
---
# Zero-UI vars mirror: provider auth (`jwt_profile_json`) from the chart-kept
# `zitadel-bootstrap-credentials`, IDs (`org_id`, `admin_user_id`) from the
# operator-created `zitadel-bootstrap-outputs` — no Proton Pass seeding, no
# manual vault step. Keys land under the module var names so `varsFrom` below
# needs no varsKeys renames.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: seaweedfs-zitadel
    kind: SecretStore
  target:
    name: seaweedfs-terraform-vars
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: zitadel-bootstrap-credentials
        property: jwt_profile_json
    - secretKey: org_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: org_id
    - secretKey: admin_user_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: admin_user_id

---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: seaweedfs-sso
spec:
  interval: 30m
  approvePlan: auto
  # Component OCI artifact (same namespace, in-tenant `infra` OCIRepository):
  # the artifact packs the whole component dir, terraform/ included.
  sourceRef:
    kind: OCIRepository
    name: infra
  path: ./terraform
  # Plain (non-sensitive) per-env values; secrets come from varsFrom below.
  # varsFrom overrides vars on key collision (upstream GenerateVarsForTF).
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: ui_host
      value: __SEAWEEDFS_UI_HOST__
  varsFrom:
    - kind: Secret
      name: seaweedfs-terraform-vars
  writeOutputsToSecret:
    name: seaweedfs-sso-outputs
    outputs:
      - client_id
      - client_secret
      - cookie_secret
