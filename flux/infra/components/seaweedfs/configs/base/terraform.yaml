# seaweedfs-sso Terraform: owns this component's Zitadel slice (project + seaweedfs-admin role + grant + seaweedfs OIDC client, project-scoped).
# Ships in configs/ so fleet infra-configs ordering applies (after Zitadel Ready). IDs/auth mirror from the FirstInstance handoff via seaweedfs-terraform-vars (same-namespace varsFrom); no org_id literal in git.
# Backend: in-cluster Kubernetes default. Outputs land in seaweedfs-sso-outputs, consumed by ui-auth-credentials via the seaweedfs-k8s store.
---
# Cross-namespace handoff reader: mirrors the two handoff Secrets from remoteNamespace zitadel (RBAC in zitadel-handoff-rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-handoff-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs-zitadel
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-handoff-reader
---
# Vars mirror: jwt_profile_json from zitadel-bootstrap-credentials, IDs from zitadel-bootstrap-outputs; keys match module vars so varsFrom needs no renames.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: seaweedfs-zitadel
    kind: SecretStore
  target:
    name: seaweedfs-terraform-vars
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: zitadel-bootstrap-credentials
        property: jwt_profile_json
    - secretKey: org_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: org_id
    - secretKey: admin_user_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: admin_user_id

---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: seaweedfs-sso
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: destroy + destroyResourcesOnDeletion false (no destroy path via Flux).
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared zitadel SSO root (infra/zitadel OCI artifact, ./terraform).
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: zitadel
  path: ./terraform
  # Plain per-env values; secrets come from varsFrom below.
  # Redirect URIs fully rendered: __SEAWEEDFS_UI_HOST__ replaced per env (exact https://<ui-host>/oauth2/callback, not a wildcard).
  # Admin-only gate: no user role, generated in-Terraform cookie secret.
  # POSITIONAL: dev/prd overlays patch /spec/vars by index; keep this order.
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: project_name
      value: seaweedfs
    - name: login_base_uri
      value: __ZITADEL_LOGIN_URI__
    - name: redirect_uris
      value:
        - https://__SEAWEEDFS_UI_HOST__/oauth2/callback
    - name: post_logout_redirect_uris
      value:
        - https://__SEAWEEDFS_UI_HOST__/
    - name: create_user_role
      value: "false"
    - name: create_cookie_secret
      value: "true"
  varsFrom:
    - kind: Secret
      name: seaweedfs-terraform-vars
  writeOutputsToSecret:
    name: seaweedfs-sso-outputs
    outputs:
      - client_id
      - client_secret
      - cookie_secret
