# SeaweedFS cluster (§12.1): operator-managed Enterprise v4.45. Volume
# servers ride the §9.5 local-path classes (nvme PINNED to nvme, bulk to
# sata); masters/filer are small and stay on the nvme default. Enterprise
# image + CSI image tags carry $imagepolicy markers consumed by
# flux/infra/update-policies/seaweedfs.yaml.
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed-main
spec:
  version: "4.45" # {"$imagepolicy": "infra:seaweedfs:tag"}
  volumeServerDiskCount: 1
  master:
    replicas: 3
    volumeSizeLimitMB: 1024
    persistence:
      enabled: true
      storageClassName: local-ssd-nvme
      resources:
        requests:
          storage: 4Gi
  volume:
    replicas: 3
    requests:
      storage: 100Gi
    storageClassName: local-ssd-nvme
    rack: nvme
    dataCenter: dc1
  volumeTopology:
    sata-bulk:
      replicas: 3
      requests:
        storage: 500Gi
      storageClassName: local-ssd-sata
      rack: sata
      dataCenter: dc1
  filer:
    replicas: 2
    persistence:
      enabled: true
      storageClassName: local-ssd-nvme
      resources:
        requests:
          storage: 10Gi
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
    s3:
      enabled: true
    service:
      type: ClusterIP
  s3:
    replicas: 2
    service:
      type: ClusterIP
