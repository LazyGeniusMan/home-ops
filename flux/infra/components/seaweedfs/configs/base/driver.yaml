# SeaweedFS COSI driver (hand-vendored workload — NOT a CRD: the 5 COSI CRDs
# live in cosi/crds/base under fleet prune:false; chart `cosi.enabled` stays
# off per the seaweedfs README). Mirrors upstream seaweedfs chart
# templates/cosi/cosi-deployment.yaml; auth/TLS branches dropped — plain
# in-cluster gRPC.
# Two containers share an emptyDir socket at /var/lib/cosi/cosi.sock:
# - seaweedfs-cosi-driver: the provisioner gRPC server. Env: DRIVERNAME
#   (default seaweedfs.objectstorage.k8s.io), COSI_ENDPOINT (default
#   unix:///var/lib/cosi/cosi.sock), SEAWEEDFS_FILER (filer gRPC —
#   seaweed-main-filer.seaweedfs:8888, same as the CSI HelmRelease), ENDPOINT
#   (S3 URL handed back in BucketAccess secrets as secretS3.endpoint —
#   in-cluster short name http://seaweed-main-s3.seaweedfs:8333), REGION
#   (us-east-1 — SeaweedFS ignores region; required non-empty by some S3
#   clients).
# - seaweedfs-cosi-sidecar: objectstorage-sidecar v0.2.2 (Bucket +
#   BucketAccess listeners), the counterpart of the COSI controller v0.2.2 pin.
# Images: driver ghcr.io/seaweedfs/seaweedfs-cosi-driver:v0.3.1.
# Driver binary runs as UID 65532 (distroless static); sidecar runs as
# nonroot (distroless static:nonroot).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-cosi-driver
  labels:
    app.kubernetes.io/name: seaweedfs-cosi-driver
    app.kubernetes.io/component: objectstorage-provisioner
    app.kubernetes.io/part-of: container-object-storage-interface
spec:
  replicas: 1 # create-time seed, HPA owns runtime count
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-cosi-driver
      app.kubernetes.io/component: objectstorage-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-cosi-driver
        app.kubernetes.io/component: objectstorage-provisioner
    spec:
      serviceAccountName: seaweedfs-cosi-driver
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: seaweedfs-cosi-driver
          image: ghcr.io/seaweedfs/seaweedfs-cosi-driver:v0.3.1 # {"$imagepolicy": "infra:cosi-driver:tag"}
          imagePullPolicy: IfNotPresent
          env:
            - name: DRIVERNAME
              value: seaweedfs.objectstorage.k8s.io
            - name: COSI_ENDPOINT
              value: unix:///var/lib/cosi/cosi.sock
            - name: SEAWEEDFS_FILER
              value: seaweed-main-filer.seaweedfs:8888
            - name: ENDPOINT
              value: http://seaweed-main-s3.seaweedfs:8333
            - name: REGION
              value: us-east-1
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket
          # No probes: driver serves gRPC on the COSI unix socket only
          # (cmd/seaweedfs-cosi-driver/main.go exposes no HTTP/health flags),
          # so no httpGet/tcpSocket target exists.
          # CPU request required for the CPU-utilization HPA
          # (driver-hpa.yaml) — utilization needs requests on every
          # container in the pod.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
        - name: seaweedfs-cosi-sidecar
          image: gcr.io/k8s-staging-sig-storage/objectstorage-sidecar:v0.2.2 # {"$imagepolicy": "infra:cosi-sidecar:tag"}
          imagePullPolicy: IfNotPresent
          args:
            - --v=5
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket
          # No probes: sidecar cobra (sidecar/cmd/cmd.go) exposes no
          # health-probe flags; it blocks dialing the driver socket.
          # CPU request required for the CPU-utilization HPA
          # (driver-hpa.yaml) — utilization needs requests on every
          # container in the pod.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: socket
          emptyDir: {}
