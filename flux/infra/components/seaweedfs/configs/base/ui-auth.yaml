# SeaweedFS filer-UI auth: admin-only Zitadel OIDC via a namespace-local
# oauth2-proxy (reverse-proxy mode) in front of the filer. The public S3 API
# route stays DIRECT (SigV4-gated); only admin.seaweedfs flows through this proxy.
# Own client (seaweedfs-sso Terraform CR in terraform.yaml): issuer
# __ZITADEL_ISSUER_URL__, redirect https://__SEAWEEDFS_UI_HOST__/oauth2/callback,
# scopes openid profile email groups, admin-only via --allowed-group=seaweedfs-admin,
# cookie domain .__BASE_DOMAIN__.
# Credentials from seaweedfs-sso-outputs via the seaweedfs-k8s SecretStore.
# Chart oci://ghcr.io/oauth2-proxy/charts/oauth2-proxy 10.7.0 (app v7.15.4); tags track update-policies/seaweedfs.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs-k8s
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
spec:
  provider:
    kubernetes:
      remoteNamespace: seaweedfs
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ui-auth-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: seaweedfs-k8s
    kind: SecretStore
  target:
    name: ui-auth-credentials
    template:
      data:
        OAUTH2_PROXY_CLIENT_ID: "{{ .clientId }}"
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .clientSecret }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .cookieSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: seaweedfs-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: seaweedfs-sso-outputs
        property: client_secret
    - secretKey: cookieSecret
      remoteRef:
        key: seaweedfs-sso-outputs
        property: cookie_secret
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ui-auth-chart
spec:
  interval: 1h
  url: oci://ghcr.io/oauth2-proxy/charts/oauth2-proxy
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 10.7.0 # {"$imagepolicy": "infra:seaweedfs-ui-auth-chart:tag"}
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/oauth2-proxy/manifests/.github/workflows/release.yaml@refs/heads/main$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ui-auth
spec:
  interval: 1h
  releaseName: ui-auth
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: ui-auth-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/oauth2-proxy/manifests/tree/main/helm/oauth2-proxy
  values:
    fullnameOverride: ui-auth
    config:
      existingSecret: ui-auth-credentials
      forceLegacyConfig: false
    image:
      repository: oauth2-proxy/oauth2-proxy
      tag: v7.15.4 # {"$imagepolicy": "infra:seaweedfs-ui-auth:tag"}
      pullPolicy: IfNotPresent
    # ESO owns the ui-auth-credentials Secret — the chart renders none.
    proxyVarsAsSecrets: false
    extraArgs:
      provider: oidc
      provider-display-name: Zitadel
      oidc-issuer-url: __ZITADEL_ISSUER_URL__
      redirect-url: https://__SEAWEEDFS_UI_HOST__/oauth2/callback
      scope: openid profile email groups
      oidc-groups-claim: groups
      allowed-group: seaweedfs-admin
      email-domain: "*"
      cookie-domain: .__BASE_DOMAIN__
      cookie-name: _seaweedfs_ui_auth
      cookie-secure: "true"
      cookie-samesite: lax
      cookie-expire: 12h
      cookie-refresh: 1h
      reverse-proxy: "true"
      upstream: http://seaweed-main-filer:8888
      skip-provider-button: "true"
    envFrom:
      - secretRef:
          name: ui-auth-credentials
    service:
      portNumber: 4180
      targetPort: http
    # Metrics endpoint + ServiceMonitor on (two-step: `metrics.enabled: true` renders the :44180
    # metrics port first, then the monitor scrapes it). Monitoring CRDs arrive via the otel-operator
    # infra-crds delivery (prune:false), and the gateway TA scrapes monitors labeled `otel-scrape: "true"`
    # (labels land via sibling; see the ESO `renderMode: skipIfMissing` template in
    # external-secrets/controllers/base/externalsecrets.yaml). No telemetry knob exists on this chart.
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    serviceAccount:
      enabled: false
      automountServiceAccountToken: false
    redis-ha:
      enabled: false
    # External HPA/VPA own scaling — chart autoscaling + PDB stay off.
    autoscaling:
      enabled: false
    podDisruptionBudget:
      enabled: false
    # Slow-start: ui-auth reverse-proxies the filer with OIDC discovery
    # against Zitadel — cold Zitadel means slow first readiness. The chart
    # (10.7.0) has no startupProbe knob, so readiness carries a generous
    # initial delay (60s) instead of the thin 5s default; liveness keeps a
    # 30s delay so slow starts are never restart-killed.
    livenessProbe:
      initialDelaySeconds: 30
    readinessProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
