# SeaweedFS filer-UI auth (SSO decoupling): admin-only Zitadel OIDC via a
# namespace-local oauth2-proxy (reverse-proxy mode) in front of the filer.
# The public S3 API route stays DIRECT (SigV4-gated machine endpoint — see
# README); only admin.seaweedfs.… flows through this proxy.
#
# Own client (managed by the `seaweedfs-sso` Terraform CR in terraform.yaml):
# - issuer __ZITADEL_ISSUER_URL__, OWN client `seaweedfs`
#   (redirect https://__SEAWEEDFS_UI_HOST__/oauth2/callback — the
#   --redirect-url below), scopes `openid profile email groups`.
# - Admin-only via --allowed-group=seaweedfs-admin against the `groups`
#   claim (admin@__BASE_DOMAIN__ holds the seaweedfs-admin grant; see
#   README role matrix).
# - Cookie domain .__BASE_DOMAIN__ (shared with sibling proxies).
#
# Credentials flow end-to-end from stored outputs: the `seaweedfs-sso`
# Terraform module outputs client_id + client_secret + cookie_secret into the
# `seaweedfs-sso-outputs` Secret (CR writeOutputsToSecret in terraform.yaml),
# and the `ui-auth-credentials` ExternalSecret consumes all three keys from
# that Secret through the in-cluster `seaweedfs-k8s` SecretStore below (ESO
# Kubernetes provider). NO pass:// seeding for OIDC creds — no manual step
# after the CR applies. The writeOutputsToSecret Secret stores outputs
# base64-encoded under their output names (`client_id`, `client_secret`,
# `cookie_secret`); the `property` fields below map those onto the
# OAUTH2_PROXY_* env keys the proxy consumes via envFrom.
#
# Delivered by the official OCI chart
# (oci://ghcr.io/oauth2-proxy/charts/oauth2-proxy, tag 10.7.0, digest
# sha256:47193ebe7052f414c8c05ac2277b5b2b8fd62faf6f4f8ea6c7263a741e62acd,
# cosign-signed by the upstream release workflow — verified by the
# OCIRepository verify block below; app v7.15.4 set explicitly, chart 10.7.0
# pins 7.15.3, delta is CVE/Go only).
#
# Chart contract: release + fullname ui-auth keeps the Deployment + Service
# names at ui-auth (HTTPRoute backend seaweedfs-ui-tls, HPA/VPA targets, and
# ESO target ui-auth-credentials untouched); existingSecret +
# proxyVarsAsSecrets: false keep credential ownership in ESO (chart renders
# no Secret); no-config mode (forceLegacyConfig: false, no configFile) keeps
# every flag in extraArgs; metrics/ServiceMonitor off (no telemetry);
# ServiceAccount, autoscaling, and PDB off (no SA token, create-time seed
# replica, external HPA/VPA own scaling). Probes: liveness /ping (10s
# delay); readiness is the chart default /ready (deep check, 5s delay),
# same binary.
# The chart tag auto-tracks flux/infra/update-policies/seaweedfs.yaml via the
# $imagepolicy marker (chart marker infra:seaweedfs-ui-auth-chart; image
# marker infra:seaweedfs-ui-auth — per-copy own policy, see
# update-policies/seaweedfs.yaml).
# Ordering: the ESO ExternalSecret lives alongside the release in this same
# Kustomization, so the first install attempt pends until ESO syncs it and
# Flux retries (RetryOnFailure below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs-k8s
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
spec:
  provider:
    kubernetes:
      remoteNamespace: seaweedfs
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ui-auth-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: seaweedfs-k8s
    kind: SecretStore
  target:
    name: ui-auth-credentials
    template:
      data:
        OAUTH2_PROXY_CLIENT_ID: "{{ .clientId }}"
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .clientSecret }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .cookieSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: seaweedfs-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: seaweedfs-sso-outputs
        property: client_secret
    - secretKey: cookieSecret
      remoteRef:
        key: seaweedfs-sso-outputs
        property: cookie_secret
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ui-auth-chart
spec:
  interval: 1h
  url: oci://ghcr.io/oauth2-proxy/charts/oauth2-proxy
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 10.7.0 # {"$imagepolicy": "infra:seaweedfs-ui-auth-chart:tag"}
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/oauth2-proxy/manifests/.github/workflows/release.yaml@refs/heads/main$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ui-auth
spec:
  interval: 1h
  releaseName: ui-auth
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: ui-auth-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/oauth2-proxy/manifests/tree/main/helm/oauth2-proxy
  values:
    fullnameOverride: ui-auth
    config:
      existingSecret: ui-auth-credentials
      forceLegacyConfig: false
    image:
      repository: oauth2-proxy/oauth2-proxy
      tag: v7.15.4 # {"$imagepolicy": "infra:seaweedfs-ui-auth:tag"}
      pullPolicy: IfNotPresent
    # ESO owns the ui-auth-credentials Secret — the chart renders none.
    proxyVarsAsSecrets: false
    extraArgs:
      provider: oidc
      provider-display-name: Zitadel
      oidc-issuer-url: __ZITADEL_ISSUER_URL__
      redirect-url: https://__SEAWEEDFS_UI_HOST__/oauth2/callback
      scope: openid profile email groups
      oidc-groups-claim: groups
      allowed-group: seaweedfs-admin
      email-domain: "*"
      cookie-domain: .__BASE_DOMAIN__
      cookie-name: _seaweedfs_ui_auth
      cookie-secure: "true"
      cookie-samesite: lax
      cookie-expire: 12h
      cookie-refresh: 1h
      reverse-proxy: "true"
      upstream: http://seaweed-main-filer:8888
      skip-provider-button: "true"
    envFrom:
      - secretRef:
          name: ui-auth-credentials
    service:
      portNumber: 4180
      targetPort: http
    # No telemetry: metrics endpoint + ServiceMonitor stay off.
    metrics:
      enabled: false
    serviceAccount:
      enabled: false
      automountServiceAccountToken: false
    redis-ha:
      enabled: false
    # External HPA/VPA own scaling — chart autoscaling + PDB stay off.
    autoscaling:
      enabled: false
    podDisruptionBudget:
      enabled: false
    livenessProbe:
      initialDelaySeconds: 10
    readinessProbe:
      initialDelaySeconds: 5
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
