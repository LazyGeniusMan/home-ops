# SeaweedFS filer-UI auth (SSO decoupling): admin-only Zitadel OIDC via a
# namespace-local oauth2-proxy (reverse-proxy mode) in front of the filer.
# The public S3 API route stays DIRECT (SigV4-gated machine endpoint — see
# README); only ui.seaweedfs.… flows through this proxy.
#
# Own client (managed by the `seaweedfs-sso` Terraform CR in terraform.yaml):
# - issuer __ZITADEL_ISSUER_URL__, OWN client `seaweedfs`
#   (redirect https://__SEAWEEDFS_UI_HOST__/oauth2/callback — the
#   --redirect-url below), scopes `openid profile email groups`.
# - Admin-only via --allowed-group=seaweedfs-admin against the `groups`
#   claim (admin@__BASE_DOMAIN__ holds the seaweedfs-admin grant; see
#   README role matrix).
# - Cookie domain .__BASE_DOMAIN__ (shared with sibling proxies).
#
# Credentials flow end-to-end from stored outputs: the `seaweedfs-sso`
# Terraform module outputs client_id + client_secret + cookie_secret into the
# `seaweedfs-sso-outputs` Secret (CR writeOutputsToSecret in terraform.yaml),
# and the `ui-auth-credentials` ExternalSecret consumes all three keys from
# that Secret through the in-cluster `seaweedfs-k8s` SecretStore below (ESO
# Kubernetes provider). NO pass:// seeding for OIDC creds — no manual step
# after the CR applies. The writeOutputsToSecret Secret stores outputs
# base64-encoded under their output names (`client_id`, `client_secret`,
# `cookie_secret`); the `property` fields below map those onto the
# OAUTH2_PROXY_* env keys the proxy consumes via envFrom.
#
# Image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0 (verified real on Quay;
# hand-bumped — no ImageRepository/ImagePolicy tracks it yet, unlike the
# seaweedfs images in flux/infra/update-policies/seaweedfs.yaml).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs-k8s
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: seaweedfs
spec:
  provider:
    kubernetes:
      remoteNamespace: seaweedfs
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ui-auth-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: seaweedfs-k8s
    kind: SecretStore
  target:
    name: ui-auth-credentials
    template:
      data:
        OAUTH2_PROXY_CLIENT_ID: "{{ .clientId }}"
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .clientSecret }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .cookieSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: seaweedfs-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: seaweedfs-sso-outputs
        property: client_secret
    - secretKey: cookieSecret
      remoteRef:
        key: seaweedfs-sso-outputs
        property: cookie_secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-auth
  labels:
    app.kubernetes.io/name: seaweedfs-ui-auth
    app.kubernetes.io/component: oauth2-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-ui-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-ui-auth
        app.kubernetes.io/component: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --provider-display-name=Zitadel
            - --oidc-issuer-url=__ZITADEL_ISSUER_URL__
            - --redirect-url=https://__SEAWEEDFS_UI_HOST__/oauth2/callback
            - --scope=openid profile email groups
            - --oidc-groups-claim=groups
            - --allowed-group=seaweedfs-admin
            - --email-domain=*
            - --cookie-domain=.__BASE_DOMAIN__
            - --cookie-name=_seaweedfs_ui_auth
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=12h
            - --cookie-refresh=1h
            - --reverse-proxy=true
            - --upstream=http://seaweed-main-filer:8888
            - --http-address=0.0.0.0:4180
            - --skip-provider-button=true
          envFrom:
            - secretRef:
                name: ui-auth-credentials
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ui-auth
  labels:
    app.kubernetes.io/name: seaweedfs-ui-auth
    app.kubernetes.io/component: oauth2-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seaweedfs-ui-auth
  ports:
    - name: http
      port: 4180
      targetPort: http
