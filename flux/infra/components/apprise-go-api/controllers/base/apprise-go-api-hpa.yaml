# apprise-go-api HPA (autoscaling/v2 over the hand-vendored Deployment).
# Stateless (request-scoped state only), so horizontal scaling is safe. Base
# replicas: 1 is the create-time seed, HPA owns runtime count. Dev min 1/max 2,
# prd min 2/max 4 (base carries the prd floor) via overlay patches.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apprise-go-api
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apprise-go-api
  minReplicas: 2 # placeholder - overridden by dev/prd
  maxReplicas: 4 # placeholder - overridden by dev/prd
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
