# apprise-go-api (projects/apprise-go-api): stateless credential-free webhook sink for Alert/Provider posts. Internal ClusterIP only.
# Callers pass full apprise URLs per POST /notify (missing urls -> HTTP 204). No volumes: attachments stage under os.TempDir().
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apprise-go-api
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  replicas: 1 # create-time seed, HPA owns runtime count
  selector:
    matchLabels:
      app.kubernetes.io/name: apprise-go-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apprise-go-api
        app.kubernetes.io/part-of: apprise-go-api
    spec:
      containers:
        - name: apprise-go-api
          image: ghcr.io/lazygeniusman/home-ops/projects/apprise-go-api:dev # {"$imagepolicy": "infra:apprise-go-api:tag"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            - name: WORKER_COUNT
              value: "0"
            - name: TIMEOUT
              value: "30"
            # Mandatory stateless guards: any other value fails startup.
            - name: APPRISE_STATEFUL_MODE
              value: "disabled"
            - name: APPRISE_STATELESS_STORAGE
              value: "no"
            # Matrix-only allowlist ("matrix" prefix-matches both matrix URL schemes).
            - name: APPRISE_ALLOW_SERVICES
              value: "matrix"
            # SSRF posture: allow all, reject loopback/hostname tricks plus `internal`.
            - name: APPRISE_ATTACH_ALLOW_URL
              value: "*"
            - name: APPRISE_ATTACH_REJECT_URL
              value: "127.0.* localhost* internal"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: apprise-go-api
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  selector:
    app.kubernetes.io/name: apprise-go-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
