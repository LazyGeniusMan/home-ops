# Zitadel secrets (ESO from Proton Pass; Git holds remoteRefs only).
# masterkey: 32-byte immutable (no re-key). db-credentials: DSN composed from literal parts + .../zitadel/db-password (sslmode=require). smtp-credentials optional, unwired.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    template:
      data:
        masterkey: "{{ .masterkey }}"
  data:
    - secretKey: masterkey
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/masterkey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-db-credentials
    template:
      data:
        dsn: "postgresql://zitadel:{{ .password }}@zitadel-db-rw.zitadel.svc:5432/zitadel?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-smtp-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-smtp-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/smtp-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/smtp-password
---
# CNPG initdb app-user secret (basic-auth, ESO-managed so Git holds refs only):
# username MUST equal spec.bootstrap.initdb.owner (upstream contract) and the
# password comes from the same .../zitadel/db-password vault field the DSN
# above is composed from — seed it once via pass-cli and rotate in one place.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-db-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: zitadel
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/db-password
