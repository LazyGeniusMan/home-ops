# Zitadel secrets (§11.1). All synced by ESO from Proton Pass — Git holds
# remoteRefs only, never values. Seed each vault entry with pass-cli.
# - zitadel-masterkey: the 32-byte masterkey (encrypts tokens/keys at rest;
#   generate with `tr -dc A-Za-z0-9 </dev/urandom | head -c 32`). IMMUTABLE:
#   Zitadel cannot re-key — losing it loses all encrypted data. The HelmRelease
#   consumes it via zitadel.masterkeySecretName (key "masterkey").
# - zitadel-db-credentials: DSN for the §10.1 CNPG instance in zitadel-db.yaml
#   (key "dsn", e.g.
#   postgresql://zitadel:<pw>@zitadel-db-rw.zitadel.svc:5432/zitadel?sslmode=require).
#   The URI is COMPOSED here in ESO target.template from literal parts
#   (user zitadel, host zitadel-db-rw.zitadel.svc, port 5432, db zitadel,
#   sslmode=require) plus the app-user password pulled from the SINGLE
#   vault field .../zitadel/db-password — the same field consumed by
#   zitadel-db-app-secret below. One password source, no dual-write.
#   sslmode=require: CNPG serves TLS with a self-signed cert the app cannot
#   verify, so verify-full is impossible; require still encrypts in transit
#   (same trade-off as the upstream TLS-without-verification recipe).
# - zitadel-smtp-credentials (optional, not referenced yet): SMTP relay
#   user/password for notification emails. Wire into secretConfig.SMTP once a
#   relay exists; until then Zitadel logs mail links to pod output.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    template:
      data:
        masterkey: "{{ .masterkey }}"
  data:
    - secretKey: masterkey
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/masterkey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-db-credentials
    template:
      data:
        dsn: "postgresql://zitadel:{{ .password }}@zitadel-db-rw.zitadel.svc:5432/zitadel?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-smtp-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-smtp-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/smtp-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/smtp-password
---
# CNPG initdb app-user secret (basic-auth, ESO-managed so Git holds refs only):
# username MUST equal spec.bootstrap.initdb.owner (upstream contract) and the
# password comes from the same .../zitadel/db-password vault field the DSN
# above is composed from — seed it once via pass-cli and rotate in one place.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-db-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: zitadel
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/db-password
