# Zitadel admin HTTPRoute: attaches to the shared Gateway (listeners accept routes
# from all namespaces). Chart-native gateway templating stays OFF. Admin route
# (hostname __ZITADEL_ADMIN_HOST__, path /) points at the zitadel Service (port 8080,
# h2c) and covers console UI, management/API endpoints, and the OIDC issuer in one
# catch-all rule. End-user login UI (/ui/v2/login, zitadel-login Service port 3000)
# is NOT on this Gateway: it lives on __ZITADEL_LOGIN_HOST__ via the NetBird
# reverse-proxy consumer (zitadel-login-proxy.yaml), reached via instance
# LoginV2.BaseURI / per-app login_base_uri.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __ZITADEL_ADMIN_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zitadel
          port: 8080
