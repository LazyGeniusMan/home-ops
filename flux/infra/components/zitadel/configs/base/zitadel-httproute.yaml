# Zitadel HTTPRoutes (§11.1): attach to the shared §8.1 Gateway (listeners
# accept routes from all namespaces — cross-namespace parentRef, no
# targetNamespace override needed). Chart-native gateway templating stays OFF
# (we own the §8.1 pattern explicitly rather than through chart values).
# - API route (hostname zitadel.home-ops.yansyah.my.id, path /) → the
#   zitadel Service (port 8080, h2c — see the console HTTP/2 note in README).
#   The backend serves both the console UI and the OIDC endpoints, so a single
#   catch-all rule covers issuer + client redirects.
# - Login route (same hostname, path /ui/v2/login) → the zitadel-login
#   Service (port 3000). Prefix match keeps /ui/v2/login/* on the login UI.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - zitadel.home-ops.yansyah.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zitadel
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel-login
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - zitadel.home-ops.yansyah.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ui/v2/login
      backendRefs:
        - name: zitadel-login
          port: 3000
