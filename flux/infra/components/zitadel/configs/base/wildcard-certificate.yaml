# In-namespace wildcard Certificate (§§8.1/9.3/11.1). cert-manager Secrets are
# namespace-local, so the §9 Certificate (cert-manager namespace) cannot feed
# this component's Gateway listener — this duplicate Certificate mints
# wildcard-home-ops-tls HERE via the same ClusterIssuer/letsencrypt and
# dnsNames (same pattern as §8.1 gateway-api). The token ExternalSecret mirrors
# cert-manager/configs/base/cluster-issuer.yaml (same Proton Pass remoteRef)
# so the DNS-01 solver credential exists in this namespace too.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
---
# SANs: single-level wildcard (covers the admin host
# admin.zitadel.<base>) + nested wildcards for the zitadel subdomain level
# (covers BOTH login.zitadel.<base> and any future siblings). Wildcard certs
# only match one label, so *.base does NOT cover login.zitadel.base — the
# nested *.zitadel.<base> SAN is load-bearing for the NetBird login host
# (same nested-wildcard precedent as the cnpg *.postgres.<base> Certificate).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __WILDCARD_CERT_NAME__
spec:
  secretName: __WILDCARD_TLS_SECRET__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.__BASE_DOMAIN__"
    - "*.zitadel.__BASE_DOMAIN__"
