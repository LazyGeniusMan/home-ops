# Zitadel Dragonfly cache (§11.1): namespace-local instantiation of the §10.3
# dragonfly-base template (reference/instantiate pattern — same shape:
# 3 replicas with automatic failover, tiered persistence on local-ssd-nvme,
# hourly S3 snapshots, S3 endpoint/region args).
# - Connection contract (per §10.3 README): host
#   zitadel-cache.zitadel.svc.cluster.local, port 6379 (Redis-compatible).
#   No password/TLS (the base ships neither passwordFromSecret nor
#   tlsSecretRef); Zitadel connects via ZITADEL_CACHES_CONNECTORS_REDIS_URL
#   (see the HelmRelease). Zitadel owns its DB indexes and issues FLUSHDB, so
#   this instance is Zitadel-dedicated — never share it with other apps.
# - Snapshots land under s3://dragonfly-backups/zitadel-cache/ (own prefix, not
#   the base's). The bucket prefix must exist before the first object starts
#   (Dragonfly never creates buckets). Credentials:
#   dragonfly-s3-credentials ExternalSecret synced by ESO from the
#   COSI-minted BucketInfo JSON (Secret zitadel-cache-cosi-creds in THIS
#   namespace) through the in-namespace `zitadel-cosi` SecretStore
#   (cosi-keys.yaml) — GJSON `property` extracts
#   spec.secretS3.accessKeyID/accessSecretKey. Target literal keys
#   (ACCESS_KEY_ID/SECRET_ACCESS_KEY) are unchanged, so spec.env
#   secretKeyRefs are untouched. Dedicated claim `zitadel-cache`
#   (bucketclaims.yaml) mints these keys; the dir keeps pointing at the
#   legacy bucket until cutover (see cosi README "Bucket cutover": copy data
#   to the COSI-provisioned bucket, then repoint `dir`).
#   Fallback: the Proton Pass entries (pass://.../dragonfly/s3-*) are
#   retained in the vault; to roll back, repoint secretStoreRef to
#   proton-pass/ClusterSecretStore with remoteRef keys
#   __PROTON_PASS_BASE__/dragonfly/s3-access-key-id and
#   __PROTON_PASS_BASE__/dragonfly/s3-secret-access-key (no `property`).
# - Restore: same runbook as §10.3 — delete pods for latest-snapshot reload,
#   or point a NEW Dragonfly object at a pinned dump prefix.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cosi
    kind: SecretStore
  target:
    name: dragonfly-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: zitadel-cache-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: zitadel-cache-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: zitadel-cache
spec:
  replicas: 3

  tiering:
    persistentVolumeClaimSpec:
      storageClassName: local-ssd-nvme
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi

  snapshot:
    dir: "s3://dragonfly-backups/zitadel-cache/"
    cron: "0 * * * *"
    enableOnMasterOnly: true

  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: SECRET_ACCESS_KEY
    - name: AWS_REGION
      value: us-east-1

  # Internal S3 serves plain HTTP: --s3_use_https=false must stay paired
  # with --s3_endpoint (bare host, no scheme; s3_use_https defaults true).
  args:
    - --s3_endpoint=__S3_HOST__
    - --dbfilename=dump-{timestamp}
    - --s3_use_https=false

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: dragonfly
            topologyKey: kubernetes.io/hostname
