# Zitadel Dragonfly cache: namespace-local Dragonfly (3 replicas, failover, local-ssd-nvme, hourly S3 snapshots to s3://dragonfly-backups/zitadel-cache/).
# Host zitadel-cache.zitadel.svc.cluster.local:6379, AUTH password from the ESO-synced `zitadel-cache-auth` Secret
# (cache-password.yaml); wire stays cleartext by design — Cilium WireGuard covers pod traffic (see cilium/controllers/base/cilium.yaml). Zitadel-dedicated.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cosi
    kind: SecretStore
  target:
    name: dragonfly-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: zitadel-cache-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: zitadel-cache-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: zitadel-cache
spec:
  replicas: 3 # placeholder - overridden by dev/prd overlays

  # AUTH password from the ESO-synced Secret (cache-password.yaml); the
  # operator injects DFLY_requirepass from it. Same-namespace Secret.
  authentication:
    passwordFromSecret:
      name: zitadel-cache-auth
      key: password

  tiering:
    persistentVolumeClaimSpec:
      storageClassName: local-ssd-nvme
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi

  snapshot:
    dir: "s3://dragonfly-backups/zitadel-cache/"
    cron: "0 * * * *"
    enableOnMasterOnly: true

  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: SECRET_ACCESS_KEY
    - name: AWS_REGION
      value: us-east-1

  # Internal S3 serves plain HTTP: --s3_use_https=false must stay paired
  # with --s3_endpoint (bare host, no scheme; s3_use_https defaults true).
  args:
    - --s3_endpoint=__S3_HOST__
    - --dbfilename=dump-{timestamp}
    - --s3_use_https=false

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: dragonfly
            topologyKey: kubernetes.io/hostname
