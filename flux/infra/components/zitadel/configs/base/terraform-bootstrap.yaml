# Bootstrap identity (§11.1), machine-applied by Tofu Controller.
# Manages ONLY the Zitadel-side bootstrap: org, 2 human users, org membership
# (admin=ORG_OWNER), project + project roles + user grants. OIDC clients stay
# in terraform/ for now (a per-app task moves them out).
# The pinned provider (zitadel ~> 3.3) ships no zitadel_user_group resources —
# groups are emulated via org membership + project grants (same pattern as
# terraform/): admin ≡ ORG_OWNER + admin grant; user ≡ plain member + user
# grant, asserted into the `groups` claim via the project role assertion.
#
# Ordering: this object ships in configs/ (fleet `infra-configs` Kustomization
# dependsOn `infra-controllers`), so it only reconciles after the zitadel
# HelmRelease is Ready. Terraform `dependsOn` is Terraform-CR-only upstream
# (checkDependencies resolves every entry as kind Terraform), so a HelmRelease
# entry here would wedge the CR — the fleet ordering above is the mechanism.
# First-run prerequisite (one-time, manual): the chart has NO FirstInstance
# bootstrap stanza, so create the IAM_OWNER service user via the Zitadel
# FirstInstance machine user, download its key JSON, and seed
# `pass://<env-vault>/zitadel/terraform-jwt-profile-json` (+ initial
# passwords) BEFORE this CR first reconciles. Without the key the runner
# fails auth and retries on interval.
# Backend: in-cluster Kubernetes default (state Secrets in the zitadel
# namespace) — no backendConfig needed. Drift detection stays on (default).
# Rotation: update the Proton Pass entries; ESO syncs the Secret and the next
# reconcile picks the new values up (password rotation takes effect on next
# user-resource change; JWT rotation is immediate).
# Outputs: org_id + project_id land in `zitadel-bootstrap-outputs` for the
# later per-app Terraform task (data zitadel_org needs id; data
# zitadel_project needs project_id).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-terraform-vars
    template:
      data:
        admin_initial_password: "{{ .admin_password }}"
        user_initial_password: "{{ .user_password }}"
        jwt_profile_json: "{{ .jwt_profile_json }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/terraform-admin-initial-password
    - secretKey: user_password
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/terraform-user-initial-password
    - secretKey: jwt_profile_json
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/terraform-jwt-profile-json
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: zitadel-bootstrap-identity
spec:
  interval: 30m
  approvePlan: auto
  # Component OCI artifact (same namespace, in-tenant `infra` OCIRepository):
  # the artifact packs the whole component dir, terraform/ included.
  sourceRef:
    kind: OCIRepository
    name: infra
  path: ./terraform
  # Plain (non-sensitive) per-env values; secrets come from varsFrom below.
  # varsFrom overrides vars on key collision (upstream GenerateVarsForTF).
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: admin_email
      value: admin@__BASE_DOMAIN__
    - name: user_email
      value: user@__BASE_DOMAIN__
  varsFrom:
    - kind: Secret
      name: zitadel-terraform-vars
  writeOutputsToSecret:
    name: zitadel-bootstrap-outputs
    outputs:
      - org_id
      - project_id
