# Bootstrap handoff: mirrors the setup-Job kept Secrets into zitadel-bootstrap-credentials (jwt_profile_json + pat) via the in-namespace zitadel-bootstrap SecretStore.
# zitadel-bootstrap-outputs (org_id + admin_user_id) is a plain Secret created once by the operator. zitadel-asset-storage mirrors the zitadel-assets claim via the zitadel-cosi store.
#
# BOOTSTRAP OBTAIN (first install):
# 1. Flux applies controllers -> chart setup Job creates org home-ops + IAM_OWNER machine user (zitadel-bootstrap-sa, non-expiring key JSON + PAT)
#    and the kept Secrets `zitadel-bootstrap-sa` / `zitadel-bootstrap-sa-pat`.
# 2. ESO mirrors them into `zitadel-bootstrap-credentials` (jwt_profile_json + pat); the operator records
#    `zitadel-bootstrap-outputs` (org_id + admin_user_id) once.
# 3. Invite the human admin via the console; per-app Terraform slices consume the handoff via same-namespace varsFrom.
#
# ROTATE (every 90 days; Reloader restarts consumers on Secret change):
# 1. Create a new machine key + PAT for zitadel-bootstrap-sa in the Zitadel console (90-day expiry).
# 2. Patch the kept Secrets (`zitadel-bootstrap-sa.json` / `zitadel-bootstrap-sa-pat:pat`) with the new values.
# 3. ESO syncs within 1h into `zitadel-bootstrap-credentials`; Reloader (annotation on consumer workloads)
#    rolls the Zitadel Deployments + Terraform runners. Verify login + one per-app plan, then delete the old key/PAT.
# 4. Never rotate by reinstalling (cleanupJob stays disabled — reinstall would orphan the handoff mirror).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-zitadel-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zitadel-bootstrap-sa", "zitadel-bootstrap-sa-pat"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-zitadel-reader
subjects:
  - kind: ServiceAccount
    name: eso-zitadel-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-zitadel-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: zitadel-bootstrap
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-bootstrap-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-bootstrap
    kind: SecretStore
  target:
    name: zitadel-bootstrap-credentials
    template:
      data:
        jwt_profile_json: "{{ .machinekey }}"
        pat: "{{ .pat }}"
  data:
    - secretKey: machinekey
      remoteRef:
        key: zitadel-bootstrap-sa
        property: zitadel-bootstrap-sa.json
    - secretKey: pat
      remoteRef:
        key: zitadel-bootstrap-sa-pat
        property: pat
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-asset-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cosi
    kind: SecretStore
  target:
    name: zitadel-asset-storage
    template:
      data:
        endpoint: http://seaweed-main-s3.seaweedfs:8333
        accessKeyId: "{{ .accessKeyId }}"
        secretAccessKey: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: zitadel-assets-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: zitadel-assets-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
