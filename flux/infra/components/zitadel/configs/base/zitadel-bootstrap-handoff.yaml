# Bootstrap handoff: zero-UI FirstInstance wiring, no Tofu Controller. The chart setup
# Job (controllers/base/zitadel.yaml FirstInstance stanza) creates org home-ops + the
# IAM_OWNER machine user zitadel-bootstrap-sa and writes two kept Secrets
# (cleanupJob.enabled=false): zitadel-bootstrap-sa (machine-key JSON) and
# zitadel-bootstrap-sa-pat (PAT). This file mirrors both into consumer-ready
# zitadel-bootstrap-credentials (jwt_profile_json + pat) via the in-namespace
# zitadel-bootstrap SecretStore; per-app tofu-controller varsFrom/fileMappings consume
# it. zitadel-bootstrap-outputs (org_id + admin_user_id) is a PLAIN Secret created
# once by the operator after first install (see README runbook). AssetStorage S3
# (zitadel-asset-storage) is ESO-mirrored here from the colocated zitadel-assets claim
# through the in-namespace zitadel-cosi SecretStore; overlays patch only the endpoint
# literal.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-zitadel-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zitadel-bootstrap-sa", "zitadel-bootstrap-sa-pat"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-zitadel-reader
subjects:
  - kind: ServiceAccount
    name: eso-zitadel-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-zitadel-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: zitadel-bootstrap
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-bootstrap-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-bootstrap
    kind: SecretStore
  target:
    name: zitadel-bootstrap-credentials
    template:
      data:
        jwt_profile_json: "{{ .machinekey }}"
        pat: "{{ .pat }}"
  data:
    - secretKey: machinekey
      remoteRef:
        key: zitadel-bootstrap-sa
        property: zitadel-bootstrap-sa.json
    - secretKey: pat
      remoteRef:
        key: zitadel-bootstrap-sa-pat
        property: pat
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-asset-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cosi
    kind: SecretStore
  target:
    name: zitadel-asset-storage
    template:
      data:
        endpoint: http://seaweed-main-s3.seaweedfs:8333
        accessKeyId: "{{ .accessKeyId }}"
        secretAccessKey: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: zitadel-assets-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: zitadel-assets-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
