# Bootstrap handoff: mirrors the setup-Job kept Secrets into zitadel-bootstrap-credentials (jwt_profile_json + pat) via the in-namespace zitadel-bootstrap SecretStore.
# zitadel-bootstrap-outputs (org_id + admin_user_id) is a plain Secret created once by the operator. zitadel-asset-storage mirrors the zitadel-assets claim via the zitadel-cosi store.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-zitadel-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zitadel-bootstrap-sa", "zitadel-bootstrap-sa-pat"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-zitadel-reader
subjects:
  - kind: ServiceAccount
    name: eso-zitadel-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-zitadel-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: zitadel-bootstrap
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-bootstrap-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-bootstrap
    kind: SecretStore
  target:
    name: zitadel-bootstrap-credentials
    template:
      data:
        jwt_profile_json: "{{ .machinekey }}"
        pat: "{{ .pat }}"
  data:
    - secretKey: machinekey
      remoteRef:
        key: zitadel-bootstrap-sa
        property: zitadel-bootstrap-sa.json
    - secretKey: pat
      remoteRef:
        key: zitadel-bootstrap-sa-pat
        property: pat
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-asset-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cosi
    kind: SecretStore
  target:
    name: zitadel-asset-storage
    template:
      data:
        endpoint: http://seaweed-main-s3.seaweedfs:8333
        accessKeyId: "{{ .accessKeyId }}"
        secretAccessKey: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: zitadel-assets-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: zitadel-assets-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
