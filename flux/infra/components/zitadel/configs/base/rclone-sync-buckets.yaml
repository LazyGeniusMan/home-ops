# S3 to ProtonDrive backups for zitadel-db, zitadel-cache, zitadel-assets (one helm-rclone-sync CronJob per bucket, direction 05; chart 0.1.0).
# Chart source: projects/helm-rclone-sync.
# Source is the live bc-<uuid> bucket via BucketInfo.spec.bucketName (assets sync reads the account root with --include "zitadel-assets*/**"). Destination /home-ops/backups/<cluster>/zitadel/<bucket>. Schedules db 01:15, cache 02:15, assets 03:15 UTC; sync, Forbid.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-rclone-proton
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-rclone-proton
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/rclone-proton-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/rclone-proton-password-obscured
---
# Per-bucket S3 source secrets: mirror BucketInfo JSON (keys plus bucketName
# templated from BucketInfo.spec.bucketName for SRC_PATH esoRef).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-rclone-src
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cosi
    kind: SecretStore
  target:
    name: zitadel-db-rclone-src
    template:
      data:
        accessKeyId: "{{ .accessKeyId }}"
        secretAccessKey: "{{ .secretAccessKey }}"
        bucketName: "{{ .bucketName }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: zitadel-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: zitadel-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
    - secretKey: bucketName
      remoteRef:
        key: zitadel-db-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-cache-rclone-src
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cosi
    kind: SecretStore
  target:
    name: zitadel-cache-rclone-src
    template:
      data:
        accessKeyId: "{{ .accessKeyId }}"
        secretAccessKey: "{{ .secretAccessKey }}"
        bucketName: "{{ .bucketName }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: zitadel-cache-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: zitadel-cache-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
    - secretKey: bucketName
      remoteRef:
        key: zitadel-cache-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-assets-rclone-src
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cosi
    kind: SecretStore
  target:
    name: zitadel-assets-rclone-src
    template:
      data:
        accessKeyId: "{{ .accessKeyId }}"
        secretAccessKey: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: zitadel-assets-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: zitadel-assets-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
# Chart tag MUST equal Chart.yaml version in projects/helm-rclone-sync; bump
# Chart.yaml + all six consumers in one commit (no $imagepolicy marker on Helm
# OCIRepositories).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: helm-rclone-sync-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-rclone-sync
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel-db-rclone-sync
spec:
  interval: 1h
  releaseName: zitadel-db-rclone-sync
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    schedule: "15 1 * * *"
    rclone:
      operation: sync
      extraArgs:
        - --fast-list
        - --checksum
    source:
      type: s3
      uri:
        esoRef:
          name: zitadel-db-rclone-src
          key: bucketName
      credentials:
        provider:
          value: SeaweedFS
        accessKeyId:
          esoRef:
            name: zitadel-db-rclone-src
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: zitadel-db-rclone-src
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      uri:
        value: /home-ops/backups/__CLUSTER_NAME__/zitadel/zitadel-db
      credentials:
        username:
          esoRef:
            name: zitadel-rclone-proton
            key: username
        password:
          esoRef:
            name: zitadel-rclone-proton
            key: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel-cache-rclone-sync
spec:
  interval: 1h
  releaseName: zitadel-cache-rclone-sync
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    schedule: "15 2 * * *"
    rclone:
      operation: sync
      extraArgs:
        - --fast-list
        - --checksum
    source:
      type: s3
      uri:
        esoRef:
          name: zitadel-cache-rclone-src
          key: bucketName
      credentials:
        provider:
          value: SeaweedFS
        accessKeyId:
          esoRef:
            name: zitadel-cache-rclone-src
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: zitadel-cache-rclone-src
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      uri:
        value: /home-ops/backups/__CLUSTER_NAME__/zitadel/zitadel-cache
      credentials:
        username:
          esoRef:
            name: zitadel-rclone-proton
            key: username
        password:
          esoRef:
            name: zitadel-rclone-proton
            key: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel-assets-rclone-sync
spec:
  interval: 1h
  releaseName: zitadel-assets-rclone-sync
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    schedule: "15 3 * * *"
    rclone:
      operation: sync
      extraArgs:
        - --fast-list
        - --checksum
        - --include
        - zitadel-assets*/**
    source:
      type: s3
      uri:
        value: ""
      credentials:
        provider:
          value: SeaweedFS
        accessKeyId:
          esoRef:
            name: zitadel-assets-rclone-src
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: zitadel-assets-rclone-src
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      uri:
        value: /home-ops/backups/__CLUSTER_NAME__/zitadel/zitadel-assets
      credentials:
        username:
          esoRef:
            name: zitadel-rclone-proton
            key: username
        password:
          esoRef:
            name: zitadel-rclone-proton
            key: password
