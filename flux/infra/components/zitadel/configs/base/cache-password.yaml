# ESO-managed Zitadel-cache AUTH password (Proton Pass; Git holds the remoteRef only).
# Bootstrap: seed `pass://<cluster>/zitadel/cache-password` once via pass-cli with a
# 32+ char random value, then ESO syncs `zitadel-cache-auth` (key `password`).
# Rotation: write the new value to the same Proton Pass field, wait for the
# 1h ESO refresh, then Reloader restarts the operator Deployment — the operator
# reconcile propagates DFLY_requirepass on pod restart. Zitadel reconnects with
# the password-bearing REDIS_URL in controllers/base/zitadel.yaml.
# Trust boundary: AUTH travels cleartext on the service-domain :6379 wire —
# no in-cluster TLS by design; CNI-layer Cilium WireGuard encrypts pod traffic
# between nodes instead (see cilium/controllers/base/cilium.yaml).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-cache-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-cache-auth
    template:
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/cache-password
