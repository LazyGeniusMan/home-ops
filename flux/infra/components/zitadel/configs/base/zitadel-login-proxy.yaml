# Zitadel login reverse-proxy consumer: exposes the end-user login UI
# (__ZITADEL_LOGIN_HOST__) through the shared NetBird reverse-proxy root (same
# consumer pattern as the SSO slices; cross-namespace sourceRef to the
# infra/netbird OCI artifact, path ./terraform). Owns only this login slice: one
# reverse-proxy service (login host to in-mesh zitadel-login backend) + shared
# base-domain registration + Cloudflare wildcard CNAME for NetBird ownership
# verification.
# Backend is plain http (in-pod TLS OFF; NetBird terminates public TLS at the edge);
# pass_host_header + rewrite_redirects stay true so the login app sees the public
# host. Target rides the shared Service-LB subnet the root appends automatically
# (port 3000 http, path /ui/v2/login); per-env values are domain + network_name +
# service_lb_ip only (patched by dev/prd overlays by index - keep vars order).
# Tokens flow from Proton Pass via the ESO-synced zitadel-login-proxy-vars Secret
# (same-namespace varsFrom); backend is in-cluster Kubernetes default; drift
# detection stays on. First-run: complete the dashboard Verify within 48h.
---
# Vars mirror: provider tokens from Proton Pass through cluster-scoped
# `proton-pass` ClusterSecretStore. Keys land under module var names, so
# `varsFrom` needs no renames. Per-env overlays set the cluster vault path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-login-proxy-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-login-proxy-vars
  data:
    - secretKey: netbird_token
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/netbird-pat
    - secretKey: cloudflare_api_token
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/cloudflare-api-token
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: zitadel-login-proxy
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: no destroy path via Flux (both destroy knobs false); drift
  # detection stays on.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared reverse-proxy root: infra/netbird OCI artifact (namespace netbird),
  # path ./terraform (cross-namespace sourceRef allowed).
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: netbird
  path: ./terraform
  # Plain per-env values here; secrets come from varsFrom (overrides vars on
  # collision). Login FQDN fully rendered (__ZITADEL_LOGIN_HOST__, patched per
  # env). Backend rides the shared Service-LB subnet target the root appends
  # (plain http, path pins /ui/v2/login; network_name selects the Talos-owned
  # parent network, service_lb_ip is the per-env Cilium LB VIP). POSITIONAL:
  # overlays patch /spec/vars/0, /spec/vars/2, /spec/vars/3 by index — keep
  # this order. cloudflare_zone_id absent (null = DNS self-managed).
  vars:
    - name: domain
      value: __ZITADEL_LOGIN_HOST__
    - name: service_name
      value: zitadel-login
    - name: network_name
      value: __CLUSTER_NAME__
    - name: service_lb_ip
      value: __SERVICE_LB_IP__
    - name: target_path
      value: /ui/v2/login
  varsFrom:
    - kind: Secret
      name: zitadel-login-proxy-vars
  writeOutputsToSecret:
    name: zitadel-login-proxy-outputs
    outputs:
      - service_id
      - service_domain
      - proxy_url
      - service_lb_resource_id
