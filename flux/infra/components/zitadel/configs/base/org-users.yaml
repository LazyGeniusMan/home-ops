# Static identity intent: org, users, groups, OIDC client ownership. The chart setup
# Job (controllers/base/zitadel.yaml FirstInstance stanza, Helm setup Job) creates org
# home-ops plus the IAM_OWNER machine user zitadel-bootstrap-sa (mirrored by
# zitadel-bootstrap-handoff.yaml). Human admin onboarding is operator-driven via
# invite/reset after install. OIDC clients live in each app's own per-app terraform/
# slice; this bootstrap slice owns no clients. This ConfigMap mirrors that intent -
# keep it in sync with the HelmRelease FirstInstance stanza.
# Hosts: admin UI/console/API + OIDC issuer on admin.zitadel.<base> (ExternalDomain,
# per-env overlay); end-user login UI on login.zitadel.<base> (NetBird
# zitadel-login-proxy + instance LoginV2.BaseURI + per-app login_base_uri).
# Org: home-ops. Machine admin: zitadel-bootstrap-sa (key JSON + PAT kept Secrets).
# Users: admin@<base domain> super-admin (org owner; invite via console).
# Groups: admin (asserted into the groups claim via per-app project roles/grants).
# Roles/grants: home-ops project with role admin. Scopes for every client:
# openid profile email groups (code flow + PKCE, refresh tokens on; secrets via ESO).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-identity-intent
  annotations:
    __ZITADEL_HOST__/managed-by: zitadel-setup-job
data:
  org: home-ops
  users: |
    - email: admin@__BASE_DOMAIN__
      firstName: Home-Ops
      lastName: Admin
      groups: [admin]
      roles: [admin]
  groups: |
    - admin
  clients: |
    owned-by: per-app terraform slices (this bootstrap slice owns no clients)
    - coder owns client `coder`: https://coder.__BASE_DOMAIN__/*
    - clickstack owns client `clickstack`: https://clickstack.__BASE_DOMAIN__/*
    - hubble-ui owns client `hubble`: https://hubble.__BASE_DOMAIN__/*
    - flux-operator-ui owns client `flux-operator-ui`: https://flux-operator.__BASE_DOMAIN__/*
    - headlamp owns client `headlamp`: https://headlamp.__BASE_DOMAIN__/*
    - seaweedfs owns client `seaweedfs`: https://admin.seaweedfs.__BASE_DOMAIN__/oauth2/callback
  scopes: openid profile email groups
