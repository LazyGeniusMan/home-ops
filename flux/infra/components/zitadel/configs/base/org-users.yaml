# Static identity intent (§11.1): org, users, groups, OIDC clients.
# Machine-applied: the `zitadel-bootstrap-identity` Terraform CR
# (terraform-bootstrap.yaml, Tofu Controller) applies the bootstrap slice
# (org, users, membership, project/roles/grants) from terraform/; OIDC
# clients still live in terraform/ until the per-app task moves them. This
# ConfigMap is the human-readable mirror of that intent — keep it in sync
# with terraform/ + the Terraform CR vars when the contract changes.
#
# Org: home-ops
# Users (human, email-verified, initial passwords rotated after first login):
# - admin@home-ops.yansyah.my.id — super-admin (instance IAM_OWNER via the
#   chart's FirstInstance machine bootstrap, then org owner)
# - user@home-ops.yansyah.my.id — normal member, no admin roles
# Groups (provider zitadel ~> 3.3 ships no user_group resources — mapped to
# org membership + project grants, asserted into the `groups` claim):
# - admin: admin@ as ORG_OWNER + project admin grant
# - users: user@ as plain org member + project user grant
# Roles/grants: home-ops project with roles admin / user; user grants bind
# each user to their role (drives id_token role assertion alongside the
# groups claim above).
# OIDC clients (all: code flow + PKCE, refresh tokens on; secrets via ESO,
# never in Git — see the OIDC contract table in the README):
# - clickstack, hubble, flux-operator-ui, headlamp, coder: per-app redirect
#   https://<app>.home-ops.yansyah.my.id/*, post-logout → https://<app> root
# - oauth2-proxy-shared: redirect https://*/oauth2/callback (wildcard covers
#   the ExternalAuth routes clickstack, hubble, flux-operator-ui)
# Scopes for every client: openid profile email groups.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-identity-intent
  annotations:
    __ZITADEL_HOST__/managed-by: tofu-controller
data:
  org: home-ops
  users: |
    - email: admin@__BASE_DOMAIN__
      firstName: Home-Ops
      lastName: Admin
      groups: [admin]
      roles: [admin]
    - email: user@__BASE_DOMAIN__
      firstName: Home-Ops
      lastName: User
      groups: [users]
      roles: [user]
  groups: |
    - admin
    - users
  clients: |
    - clickstack: https://clickstack.__BASE_DOMAIN__/*
    - hubble: https://hubble.__BASE_DOMAIN__/*
    - flux-operator-ui: https://flux-operator.__BASE_DOMAIN__/*
    - headlamp: https://headlamp.__BASE_DOMAIN__/*
    - coder: https://coder.__BASE_DOMAIN__/*
    - oauth2-proxy-shared: https://*/oauth2/callback
  scopes: openid profile email groups
