# Static identity intent (§11.1): org, users, groups, OIDC client ownership.
# Machine-applied: the `zitadel-bootstrap-identity` Terraform CR
# (terraform-bootstrap.yaml, Tofu Controller) applies the bootstrap slice
# (org, users, membership, legacy home-ops project/roles/grants) from
# terraform/; OIDC clients live in each app's own per-app `terraform/` slice.
# This ConfigMap is the human-readable mirror of that intent — keep it in
# sync with terraform/ + the Terraform CR vars when the contract changes.
#
# Org: home-ops
# Users (human, email-verified, initial passwords rotated after first login):
# - admin@home-ops.yansyah.my.id — super-admin (instance IAM_OWNER via the
#   chart's FirstInstance machine bootstrap, then org owner)
# - user@home-ops.yansyah.my.id — normal member, no admin roles
# Groups (provider zitadel ~> 3.3 ships no user_group resources — mapped to
# org membership + project grants, asserted into the `groups` claim):
# - admin: admin@ as ORG_OWNER + project admin grant
# - users: user@ as plain org member + project user grant
# Roles/grants: home-ops project with roles admin / user; user grants bind
# each user to their role (drives id_token role assertion alongside the
# groups claim above).
# OIDC clients (all: code flow + PKCE, refresh tokens on; secrets via ESO,
# never in Git — see the OIDC contract table in the README). Each app owns
# its own `zitadel_project` + `zitadel_application_oidc` client in its
# per-app `terraform/` slice (own project roles/grants assert the `groups`
# claim); this bootstrap slice owns no clients:
# - coder → client `coder` (redirect https://coder.<parent>/*, post-logout →
#   https://coder.<parent>/)
# - clickstack → client `clickstack` (redirect
#   https://clickstack.<parent>/*, covers the per-instance oauth2-proxy
#   callback under /oauth2/callback)
# - hubble-ui → client `hubble` (redirect https://hubble.<parent>/*, covers
#   the per-instance oauth2-proxy callback under /oauth2/callback)
# - flux-operator-ui → client `flux-operator-ui` (redirect
#   https://flux-operator.<parent>/*, covers the per-instance oauth2-proxy
#   callback under /oauth2/callback)
# - headlamp → client `headlamp` (redirect https://headlamp.<parent>/*)
# - seaweedfs → client `seaweedfs` (redirect
#   https://ui.seaweedfs.<parent>/oauth2/callback, serves the filer-UI proxy)
# Scopes for every client: openid profile email groups.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-identity-intent
  annotations:
    __ZITADEL_HOST__/managed-by: tofu-controller
data:
  org: home-ops
  users: |
    - email: admin@__BASE_DOMAIN__
      firstName: Home-Ops
      lastName: Admin
      groups: [admin]
      roles: [admin]
    - email: user@__BASE_DOMAIN__
      firstName: Home-Ops
      lastName: User
      groups: [users]
      roles: [user]
  groups: |
    - admin
    - users
  clients: |
    owned-by: per-app terraform slices (this bootstrap slice owns no clients)
    - coder owns client `coder`: https://coder.__BASE_DOMAIN__/*
    - clickstack owns client `clickstack`: https://clickstack.__BASE_DOMAIN__/*
    - hubble-ui owns client `hubble`: https://hubble.__BASE_DOMAIN__/*
    - flux-operator-ui owns client `flux-operator-ui`: https://flux-operator.__BASE_DOMAIN__/*
    - headlamp owns client `headlamp`: https://headlamp.__BASE_DOMAIN__/*
    - seaweedfs owns client `seaweedfs`: https://ui.seaweedfs.__BASE_DOMAIN__/oauth2/callback
  scopes: openid profile email groups
