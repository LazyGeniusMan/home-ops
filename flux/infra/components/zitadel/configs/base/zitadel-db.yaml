# Zitadel PostgreSQL Cluster: namespace-local CNPG Cluster (dbname/owner zitadel; 3 instances, sync quorum 1, local-ssd-nvme).
# Backup: continuous WAL + daily base backup to s3://cnpg-backups/zitadel/ (bucket prefix must pre-exist).
# Credentials: cnpg-s3-credentials from the COSI BucketInfo (zitadel-db-cosi-creds) via in-namespace zitadel-cosi SecretStore.
# PITR: apply a NEW Cluster with bootstrap.recovery (example below) instead of initdb.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cosi
    kind: SecretStore
  target:
    name: cnpg-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        ACCESS_SECRET_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: zitadel-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: zitadel-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
spec:
  instances: 3 # placeholder - overridden by dev/prd overlays

  postgresql:
    synchronous:
      standbyNames: ["*"]
      number: 1

  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-db-app-secret
  # Point-in-time recovery: create a NEW Cluster bootstrapping from an
  # existing backup instead of initdb (uncomment, set the Backup/ScheduledBackup
  # object name and the target timestamp). WAL replay reaches any instant
  # covered by the retained WAL archive.
  # bootstrap:
  #   recovery:
  #     backup:
  #       name: zitadel-db-backup
  #     recoveryTarget:
  #       targetTime: "2026-09-08 00:00:00.00000+00"

  storage:
    storageClass: local-ssd-nvme
    size: 20Gi

  affinity:
    enablePodAntiAffinity: true

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/zitadel/
      endpointURL: __S3_ENDPOINT_URL__
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
---
# Daily base backup to the same Barman object store (streaming method).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zitadel-db-backup
spec:
  schedule: "0 0 0 * * *" # midnight daily (CNPG uses 6-field cron)
  backupOwnerReference: self
  cluster:
    name: zitadel-db
