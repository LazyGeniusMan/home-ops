# Zitadel PostgreSQL HA Cluster: namespace-local instantiation of the
# cluster-base template (flux/infra/components/cnpg/configs/base/cluster-base.yaml —
# same shape, adjusted: dbname zitadel, single-purpose S3 prefix). Live
# cluster, not a template: spec.bootstrap.initdb creates database+owner
# zitadel, with the app password from zitadel-db-app-secret (ESO, see
# zitadel-secrets.yaml — the secret's username MUST equal
# spec.bootstrap.initdb.owner per upstream).
# - HA: 3 instances, sync quorum 1, pod anti-affinity (copied from the base).
# - Storage: local-ssd-nvme (the default StorageClass).
# - Backup: continuous WAL + daily base backup to SeaweedFS S3 (DNS name
#   only, no file dependency; see the seaweedfs README S3 contract) under
#   s3://cnpg-backups/zitadel/. The bucket prefix must exist before the first
#   Cluster starts (CNPG never creates buckets). Credentials:
#   cnpg-s3-credentials ExternalSecret synced by ESO from the COSI-minted
#   BucketInfo JSON (Secret zitadel-db-cosi-creds in THIS namespace, from the
#   colocated `zitadel-db` BucketClaim in bucketclaims.yaml) through the
#   in-namespace `zitadel-cosi` SecretStore (cosi-keys.yaml) — GJSON
#   `property` extracts spec.secretS3.accessKeyID/accessSecretKey. Target
#   literal keys are unchanged. Fallback: the Proton Pass entries
#   (pass://.../cnpg/s3-*) are retained in the vault; to roll back, repoint
#   secretStoreRef to proton-pass/ClusterSecretStore with remoteRef keys
#   __PROTON_PASS_BASE__/cnpg/s3-access-key-id and
#   __PROTON_PASS_BASE__/cnpg/s3-secret-access-key (no `property`).
# - PITR/restore: same runbook as the base template — apply a NEW Cluster
#   with bootstrap.recovery (example stanza commented out below) instead of
#   initdb.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: zitadel-cosi
    kind: SecretStore
  target:
    name: cnpg-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        ACCESS_SECRET_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: zitadel-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: zitadel-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
spec:
  instances: 3 # placeholder - overridden by dev/prd overlays

  postgresql:
    synchronous:
      standbyNames: ["*"]
      number: 1

  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-db-app-secret
  # Point-in-time recovery: create a NEW Cluster bootstrapping from an
  # existing backup instead of initdb (uncomment, set the Backup/ScheduledBackup
  # object name and the target timestamp). WAL replay reaches any instant
  # covered by the retained WAL archive.
  # bootstrap:
  #   recovery:
  #     backup:
  #       name: zitadel-db-backup
  #     recoveryTarget:
  #       targetTime: "2026-09-08 00:00:00.00000+00"

  storage:
    storageClass: local-ssd-nvme
    size: 20Gi

  affinity:
    enablePodAntiAffinity: true

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/zitadel/
      endpointURL: __S3_ENDPOINT_URL__
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
---
# Daily base backup to the same Barman object store (streaming method).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zitadel-db-backup
spec:
  schedule: "0 0 0 * * *" # midnight daily (CNPG uses 6-field cron)
  backupOwnerReference: self
  cluster:
    name: zitadel-db
