# COSI buckets for Zitadel (BucketClass/seaweedfs, S3): zitadel-db (CNPG WAL + base backups), zitadel-cache (Dragonfly snapshots), zitadel-assets (AssetStorage S3, BucketPrefix zitadel-assets).
# Live buckets provision under controller-generated names (bc-<uuid>); read from status.bucketName. Keys via the in-namespace zitadel-cosi SecretStore (cosi-keys.yaml).
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: zitadel-db
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: zitadel-db-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: zitadel-db
  credentialsSecretName: zitadel-db-cosi-creds
  protocol: S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: zitadel-cache
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: zitadel-cache-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: zitadel-cache
  credentialsSecretName: zitadel-cache-cosi-creds
  protocol: S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: zitadel-assets
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: zitadel-assets-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: zitadel-assets
  credentialsSecretName: zitadel-assets-cosi-creds
  protocol: S3
