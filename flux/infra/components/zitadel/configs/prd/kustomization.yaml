apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd DB/cache S3 endpoints. (S3 keys are COSI-minted via the in-namespace
  # zitadel-cosi SecretStore — no per-env vault ref patch.)
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Cluster
      name: zitadel-db
  - patch: |
      - op: replace
        path: /spec/args/0
        value: --s3_endpoint=seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Dragonfly
      name: zitadel-cache
  # Prd identity secrets vault refs.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/zitadel/masterkey
    target:
      kind: ExternalSecret
      name: zitadel-masterkey
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/zitadel/db-dsn
    target:
      kind: ExternalSecret
      name: zitadel-db-credentials
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/zitadel/smtp-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/zitadel/smtp-password
    target:
      kind: ExternalSecret
      name: zitadel-smtp-credentials
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/zitadel/db-password
    target:
      kind: ExternalSecret
      name: zitadel-db-app-secret
  # Prd token vault + cert rename + wildcard DNS.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
  # Prd route hostnames (zitadel.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: zitadel.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: zitadel
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: zitadel.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: zitadel-login
  # Prd Terraform bootstrap secrets: vault refs (same prd vault as above).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/zitadel/terraform-admin-initial-password
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/zitadel/terraform-user-initial-password
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/zitadel/terraform-jwt-profile-json
    target:
      kind: ExternalSecret
      name: zitadel-terraform-vars
  # Prd Terraform bootstrap vars: prd issuer host + prd user emails.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/1/value
        value: admin@home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: user@home-ops.yansyah.my.id
    target:
      kind: Terraform
      name: zitadel-bootstrap-identity
  # Prd identity intent: annotation key, users, client ownership.
  - patch: |
      - op: remove
        path: /metadata/annotations/__ZITADEL_HOST__~1managed-by
      - op: add
        path: /metadata/annotations/zitadel.home-ops.yansyah.my.id~1managed-by
        value: tofu-controller
    target:
      kind: ConfigMap
      name: zitadel-identity-intent
  - patch: |
      - op: replace
        path: /data/users
        value: |
          - email: admin@home-ops.yansyah.my.id
            firstName: Home-Ops
            lastName: Admin
            groups: [admin]
            roles: [admin]
          - email: user@home-ops.yansyah.my.id
            firstName: Home-Ops
            lastName: User
            groups: [users]
            roles: [user]
    target:
      kind: ConfigMap
      name: zitadel-identity-intent
  - patch: |
      - op: replace
        path: /data/clients
        value: |
          owned-by: per-app terraform slices (this bootstrap slice owns no clients)
          - coder owns client `coder`: https://coder.home-ops.yansyah.my.id/*
          - clickstack owns client `clickstack`: https://clickstack.home-ops.yansyah.my.id/*
          - hubble-ui owns client `hubble`: https://hubble.home-ops.yansyah.my.id/*
          - flux-operator-ui owns client `flux-operator-ui`: https://flux-operator.home-ops.yansyah.my.id/*
          - headlamp owns client `headlamp`: https://headlamp.home-ops.yansyah.my.id/*
          - seaweedfs owns client `seaweedfs`: https://ui.seaweedfs.home-ops.yansyah.my.id/oauth2/callback
    target:
      kind: ConfigMap
      name: zitadel-identity-intent
