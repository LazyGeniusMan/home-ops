# Static identity intent (§14 dev): org, users, groups, OIDC clients for the
# DEV issuer https://zitadel.homelab-dev.yansyah.my.id.
# NOT machine-applied (same discipline as the base — no Tofu Controller in
# this repo). Apply it once via the provider-ready modules in terraform/ (see
# the DEV note there: override domain/admin_email/user_email + the client
# redirect/post-logout locals for the dev domain), which is the single source
# of truth for the OIDC contract in the component README dev note. Keep this
# file and terraform/ in sync by hand until a controller lands — do NOT invent
# a controller component (out of scope).
#
# Org: home-ops
# Users (human, email-verified, initial passwords rotated after first login):
# - admin@homelab-dev.yansyah.my.id — super-admin (instance IAM_OWNER via the
#   chart's FirstInstance machine bootstrap, then org owner)
# - user@homelab-dev.yansyah.my.id — normal member, no admin roles
# Groups (provider zitadel ~> 3.3 ships no user_group resources — mapped to
# org membership + project grants, asserted into the `groups` claim):
# - admin: admin@ as ORG_OWNER + project admin grant
# - users: user@ as plain org member + project user grant
# Roles/grants: home-ops project with roles admin / user; user grants bind
# each user to their role (drives id_token role assertion alongside the
# groups claim above).
# OIDC clients (all: code flow + PKCE, refresh tokens on; secrets via ESO,
# never in Git — see the OIDC contract table in the component README dev note):
# - clickstack, hubble, flux-operator-ui, headlamp, coder: per-app redirect
#   https://<app>.homelab-dev.yansyah.my.id/*, post-logout → https://<app> root
# - oauth2-proxy-shared: redirect https://*/oauth2/callback (wildcard covers
#   the ExternalAuth routes clickstack, hubble, flux-operator-ui)
# Scopes for every client: openid profile email groups.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-identity-intent
  annotations:
    zitadel.homelab-dev.yansyah.my.id/managed-by: terraform-runbook
data:
  org: home-ops
  users: |
    - email: admin@homelab-dev.yansyah.my.id
      firstName: Home-Ops
      lastName: Admin
      groups: [admin]
      roles: [admin]
    - email: user@homelab-dev.yansyah.my.id
      firstName: Home-Ops
      lastName: User
      groups: [users]
      roles: [user]
  groups: |
    - admin
    - users
  clients: |
    - clickstack: https://clickstack.homelab-dev.yansyah.my.id/*
    - hubble: https://hubble.homelab-dev.yansyah.my.id/*
    - flux-operator-ui: https://flux-operator.homelab-dev.yansyah.my.id/*
    - headlamp: https://headlamp.homelab-dev.yansyah.my.id/*
    - coder: https://coder.homelab-dev.yansyah.my.id/*
    - oauth2-proxy-shared: https://*/oauth2/callback
  scopes: openid profile email groups
