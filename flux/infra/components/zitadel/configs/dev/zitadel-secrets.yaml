# Zitadel secrets (§14 dev). All synced by ESO from the DEV Proton Pass
# vault — Git holds remoteRefs only, never values. Seed each vault entry with
# pass-cli (never commit):
#   pass insert 'acme-dev-bdo1-talos-apps-01/zitadel/masterkey'
#   pass insert 'acme-dev-bdo1-talos-apps-01/zitadel/db-dsn'
#   pass insert 'acme-dev-bdo1-talos-apps-01/zitadel/smtp-username'
#   pass insert 'acme-dev-bdo1-talos-apps-01/zitadel/smtp-password'
#   pass insert 'acme-dev-bdo1-talos-apps-01/zitadel/db-password'
# - zitadel-masterkey: the 32-byte masterkey (encrypts tokens/keys at rest;
#   generate with `tr -dc A-Za-z0-9 </dev/urandom | head -c 32`). IMMUTABLE:
#   Zitadel cannot re-key — losing it loses all encrypted data. The HelmRelease
#   consumes it via zitadel.masterkeySecretName (key "masterkey").
# - zitadel-db-credentials: DSN for the §14 DEV CNPG instance in
#   zitadel-db.yaml below (key "dsn", e.g.
#   postgresql://zitadel:<pw>@zitadel-db-rw.zitadel.svc:5432/zitadel). The app
#   user password MUST match password: in zitadel-db-app-secret below.
#   sslmode=require: CNPG serves TLS with a self-signed cert the app cannot
#   verify, so verify-full is impossible; require still encrypts in transit
#   (same trade-off as the upstream TLS-without-verification recipe).
# - zitadel-smtp-credentials (optional, not referenced yet): SMTP relay
#   user/password for notification emails. Wire into secretConfig.SMTP once a
#   relay exists; until then Zitadel logs mail links to pod output.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    template:
      data:
        masterkey: "{{ .masterkey }}"
  data:
    - secretKey: masterkey
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/zitadel/masterkey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-db-credentials
    template:
      data:
        dsn: "{{ .dsn }}"
  data:
    - secretKey: dsn
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/zitadel/db-dsn
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-smtp-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-smtp-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/zitadel/smtp-username
    - secretKey: password
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/zitadel/smtp-password
---
# CNPG initdb app-user secret (basic-auth, ESO-managed so Git holds refs only):
# username MUST equal spec.bootstrap.initdb.owner (upstream contract) and the
# password MUST match the password embedded in the DSN above — seed both vault
# entries with the same value via pass-cli and rotate them together.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: zitadel-db-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: zitadel
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/zitadel/db-password
