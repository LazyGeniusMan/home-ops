# Zitadel PostgreSQL HA Cluster (§14 dev): namespace-local instantiation of
# the §14 DEV cluster template (flux/infra/components/cnpg/configs/dev —
# referenced by shape, no file dependency). Same classes as the base: 3
# instances, sync quorum 1, pod anti-affinity, storageClass local-ssd-nvme,
# 20Gi, continuous WAL + daily base backup with a 30d retention policy.
# Dev deltas: S3 endpoint → the DEV SeaweedFS S3
# (s3.seaweedfs.homelab-dev.yansyah.my.id), own Barman prefix
# s3://cnpg-backups/zitadel/ (the bucket prefix must exist before the first
# Cluster starts — CNPG never creates buckets). Credentials: cnpg-s3-credentials
# ExternalSecret with DEV Proton Pass remoteRefs (same-namespace secret).
# - PITR/restore: same runbook as the base — apply a NEW Cluster with
#   bootstrap.recovery (example stanza commented out below) instead of initdb.
# - initdb creates database+owner zitadel, with the app password from
#   zitadel-db-app-secret (ESO, see zitadel-secrets.yaml — the secret's
#   username MUST equal spec.bootstrap.initdb.owner per upstream).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cnpg-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        ACCESS_SECRET_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/cnpg/s3-access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/cnpg/s3-secret-access-key
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
spec:
  instances: 3

  postgresql:
    synchronous:
      standbyNames: ["*"]
      number: 1

  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-db-app-secret
  # Point-in-time recovery: create a NEW Cluster bootstrapping from an
  # existing backup instead of initdb (uncomment, set the Backup/ScheduledBackup
  # object name and the target timestamp). WAL replay reaches any instant
  # covered by the retained WAL archive.
  # bootstrap:
  #   recovery:
  #     backup:
  #       name: zitadel-db-backup
  #     recoveryTarget:
  #       targetTime: "2026-09-08 00:00:00.00000+00"

  storage:
    storageClass: local-ssd-nvme
    size: 20Gi

  affinity:
    enablePodAntiAffinity: true

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/zitadel/
      endpointURL: https://s3.seaweedfs.homelab-dev.yansyah.my.id
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
---
# Daily base backup to the same Barman object store (streaming method).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zitadel-db-backup
spec:
  schedule: "0 0 0 * * *" # midnight daily (CNPG uses 6-field cron)
  backupOwnerReference: self
  cluster:
    name: zitadel-db
