apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev Proton Pass base + rclone-sync cluster segment + Proton refs. Base
  # carries __PROTON_PASS_BASE__/__CLUSTER_NAME__ placeholders (same
  # convention as __S3_ENDPOINT_URL__/__S3_HOST__); dev fills the vault base
  # (pass://acme-dev-bdo1-talos-apps-01) and the cluster segment
  # (acme-dev-bdo1-talos-apps-01).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/rclone-proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/rclone-proton-password-obscured
    target:
      kind: ExternalSecret
      name: zitadel-rclone-proton
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backup/acme-dev-bdo1-talos-apps-01/zitadel/zitadel-db
    target:
      kind: HelmRelease
      name: zitadel-db-rclone-sync
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backup/acme-dev-bdo1-talos-apps-01/zitadel/zitadel-cache
    target:
      kind: HelmRelease
      name: zitadel-cache-rclone-sync
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backup/acme-dev-bdo1-talos-apps-01/zitadel/zitadel-assets
    target:
      kind: HelmRelease
      name: zitadel-assets-rclone-sync
  # Dev DB/cache/asset S3 endpoints. (S3 keys are COSI-minted via the
  # in-namespace zitadel-cosi SecretStore — no per-env vault ref patch.
  # The asset endpoint below is the same internal S3 literal as base; kept
  # explicit so dev/prd stay greppable alongside the CNPG/Dragonfly patches.)
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Cluster
      name: zitadel-db
  - patch: |
      - op: replace
        path: /spec/args/0
        value: --s3_endpoint=seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Dragonfly
      name: zitadel-cache
  - patch: |
      - op: replace
        path: /spec/target/template/data/endpoint
        value: http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: ExternalSecret
      name: zitadel-asset-storage
  # Dev identity secrets vault refs.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/masterkey
    target:
      kind: ExternalSecret
      name: zitadel-masterkey
  - patch: |
      # zitadel-db-credentials composes the full DSN in ESO template from
      # this single db-password source (same field as zitadel-db-app-secret).
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/db-password
    target:
      kind: ExternalSecret
      name: zitadel-db-credentials
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/smtp-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/smtp-password
    target:
      kind: ExternalSecret
      name: zitadel-smtp-credentials
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/db-password
    target:
      kind: ExternalSecret
      name: zitadel-db-app-secret
  # Dev login-proxy vars mirror (vault path) + login domain.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/netbird-pat
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: zitadel-login-proxy-vars
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: login.zitadel.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: __CLOUDFLARE_ZONE_ID_HOMELAB_DEV__
      - op: replace
        path: /spec/vars/3/value
        value: acme-dev-bdo1-talos-apps-01
      - op: replace
        path: /spec/vars/4/value
        value: 192.168.1.249
    target:
      kind: Terraform
      name: zitadel-login-proxy
  # Dev token vault + cert rename + wildcard DNS.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops-dev
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-dev-tls
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops-dev.yansyah.my.id"
      - op: replace
        path: /spec/dnsNames/1
        value: "*.zitadel.home-ops-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  # Dev admin route hostname (admin.zitadel.home-ops-dev.yansyah.my.id). The
  # end-user login host (login.zitadel.home-ops-dev.yansyah.my.id) is exposed
  # via the NetBird reverse-proxy consumer (zitadel-login-proxy.yaml) — no
  # Gateway zitadel-login route ships.
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: admin.zitadel.home-ops-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: zitadel
  # Dev single-instance scaling: stateful HA placeholders -> 1.
  - patch: |
      - op: replace
        path: /spec/instances
        value: 1
    target:
      kind: Cluster
      name: zitadel-db
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Dragonfly
      name: zitadel-cache
  # Dev identity intent: annotation key, users, client ownership.
  - patch: |
      - op: remove
        path: /metadata/annotations/__ZITADEL_HOST__~1managed-by
      - op: add
        path: /metadata/annotations/admin.zitadel.home-ops-dev.yansyah.my.id~1managed-by
        value: zitadel-setup-job
    target:
      kind: ConfigMap
      name: zitadel-identity-intent
  - patch: |
      - op: replace
        path: /data/users
        value: |
          - email: admin@home-ops-dev.yansyah.my.id
            firstName: Home-Ops
            lastName: Admin
            groups: [admin]
            roles: [admin]
    target:
      kind: ConfigMap
      name: zitadel-identity-intent
  - patch: |
      - op: replace
        path: /data/clients
        value: |
          owned-by: per-app terraform slices (this bootstrap slice owns no clients)
          - coder owns client `coder`: https://coder.home-ops-dev.yansyah.my.id/*
          - clickstack owns client `clickstack`: https://clickstack.home-ops-dev.yansyah.my.id/*
          - hubble-ui owns client `hubble`: https://hubble.home-ops-dev.yansyah.my.id/*
          - flux-operator-ui owns client `flux-operator-ui`: https://flux-operator.home-ops-dev.yansyah.my.id/*
          - headlamp owns client `headlamp`: https://headlamp.home-ops-dev.yansyah.my.id/*
          - seaweedfs owns client `seaweedfs`: https://admin.seaweedfs.home-ops-dev.yansyah.my.id/oauth2/callback
    target:
      kind: ConfigMap
      name: zitadel-identity-intent
