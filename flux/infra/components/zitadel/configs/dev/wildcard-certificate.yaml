# In-namespace wildcard Certificate (§14 dev). cert-manager Secrets are
# namespace-local, so the §14 DEV cert-manager Certificate cannot feed this
# component's Gateway listener — this duplicate Certificate mints
# wildcard-homelab-dev-tls HERE via the same ClusterIssuer/letsencrypt and
# the DEV dnsNames. The token ExternalSecret mirrors
# cert-manager/configs/dev/cluster-issuer.yaml (same DEV Proton Pass
# remoteRef) so the DNS-01 solver credential exists in this namespace too.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-homelab-dev
spec:
  secretName: wildcard-homelab-dev-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.homelab-dev.yansyah.my.id"
