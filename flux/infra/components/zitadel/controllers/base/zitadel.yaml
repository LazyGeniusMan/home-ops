# Zitadel app v4.18.0 (chart 10.0.4; chart/app lockstep checklist in update-policies/zitadel.yaml).
# Logins run on the separate NetBird-exposed login host. First install pends until the configs ExternalSecrets sync (RetryOnFailure).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: zitadel-chart
spec:
  interval: 1h
  url: oci://ghcr.io/zitadel/zitadel-charts/zitadel
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 10.0.4 # {"$imagepolicy": "infra:zitadel:tag"}
  # No `verify:` block: no cosign identity pinned for this upstream chart —
  # tracked by tag + `$imagepolicy` under the fleet source allowlist.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
spec:
  interval: 1h
  releaseName: zitadel
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: zitadel-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://zitadel.com/docs/self-hosting/deploy/kubernetes
  values:
    # Replica placeholders (dev/prd overlays); HPA owns the count.
    replicaCount: 2 # placeholder - overridden by dev/prd overlays
    # CPU requests required for the targetCPU HPA (chart defaults resources {} — utilization has no denominator without requests).
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
    image:
      repository: ghcr.io/zitadel/zitadel
      tag: v4.18.0 # {"$imagepolicy": "infra:zitadel-app:tag"}
      pullPolicy: IfNotPresent
    login:
      replicaCount: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
      # CPU requests REQUIRED for the login targetCPU HPA (chart default {}).
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
      image:
        repository: ghcr.io/zitadel/zitadel-login
        tag: v4.18.0 # {"$imagepolicy": "infra:zitadel-login:tag"}
        pullPolicy: IfNotPresent
      # Slow-start: cold Zitadel + S3-backed login assets are slow on first
      # render — gate liveness/readiness behind a startupProbe (period 1 x
      # threshold 60 = 60s budget) instead of the chart default (disabled).
      startupProbe:
        enabled: true
        periodSeconds: 1
        failureThreshold: 60
      ingress:
        enabled: false
      gateway:
        httpRoute:
          enabled: false
    zitadel:
      # ESO-synced secret (configs/base/zitadel-secrets.yaml); must exist before install — see ordering note in the header.
      masterkeySecretName: zitadel-masterkey
      configmapConfig:
        ExternalDomain: __ZITADEL_HOST__
        ExternalPort: 443
        ExternalSecure: true
        TLS:
          Enabled: false # terminated at the §8 Gateway, not in-pod
        # FirstInstance zero-UI bootstrap: setup Job creates org home-ops + IAM_OWNER machine user into kept Secrets.
        # BOOTSTRAP-ONLY non-expiring auth (first install only; rotate to 90-day expiries per the handoff runbook).
        # Rotation tracker (owner: platform; seeded at first install):
        # | credential | first-install date | rotated-to-90d date |
        # | machine key (zitadel-bootstrap-sa) | __SEED_DATE__ | __ROTATE_DATE__ |
        # | PAT (zitadel-bootstrap-sa-pat) | __SEED_DATE__ | __ROTATE_DATE__ |
        # Fill both dates at install; alert if 90d past seed with no rotation.
        # Scopes: [] keeps PAT wiring rendered (a bare Pat: {} would drop it).
        FirstInstance:
          Org:
            Name: home-ops
            Machine:
              Machine:
                Username: zitadel-bootstrap-sa
                Name: Bootstrap Service Account
              MachineKey:
                ExpirationDate: null
                Type: 1
              Pat:
                ExpirationDate: null
                Scopes: []
    cleanupJob:
      # Keep bootstrap Secrets across reinstalls: the kept Secrets feed the
      # ESO handoff mirror (zitadel-bootstrap-credentials); enabling cleanup
      # would delete the only copy of the bootstrap machine key + PAT. Rotate
      # them via the handoff runbook instead, never by reinstalling.
      enabled: false
    env:
      # DSN mode: Zitadel reads the connection string from this secret key.
      - name: ZITADEL_DATABASE_POSTGRES_DSN
        valueFrom:
          secretKeyRef:
            name: zitadel-db-credentials
            key: dsn
      # Dragonfly cache AUTH password (ESO-synced `zitadel-cache-auth`, key
      # `password`; see configs/base/cache-password.yaml). Wire stays
      # cleartext redis:// by design — Cilium WireGuard covers pod traffic.
      - name: ZITADEL_CACHES_CONNECTORS_REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: zitadel-cache-auth
            key: password
      - name: ZITADEL_CACHES_CONNECTORS_REDIS_URL
        value: "redis://zitadel-cache.zitadel:6379"
      - name: ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED
        value: "true"
      # AssetStorage S3 (avatars/org logos from zitadel-asset-storage; type s3, not the db default).
      - name: ZITADEL_ASSET_STORAGE_TYPE
        value: "s3"
      - name: ZITADEL_ASSETSTORAGE_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: zitadel-asset-storage
            key: endpoint
      - name: ZITADEL_ASSETSTORAGE_ACCESSKEYID
        valueFrom:
          secretKeyRef:
            name: zitadel-asset-storage
            key: accessKeyId
      - name: ZITADEL_ASSETSTORAGE_SECRETACCESSKEY
        valueFrom:
          secretKeyRef:
            name: zitadel-asset-storage
            key: secretAccessKey
      - name: ZITADEL_ASSETSTORAGE_SSL
        value: "false" # internal S3 is plain HTTP (same as Dragonfly/CNPG)
      - name: ZITADEL_ASSETSTORAGE_LOCATION
        value: "us-east-1"
      - name: ZITADEL_ASSETSTORAGE_BUCKETPREFIX
        value: "zitadel-assets"
    # No chart-managed routing or bundled Postgres: HTTPRoutes are hand-written
    # in configs/base/zitadel-httproute.yaml; the database is the CNPG
    # instance in configs/base/zitadel-db.yaml.
    # Slow-start: startupProbe covers CNPG migrations + OIDC discovery warmup
    # (bumped to 60s below). Login enables its own startupProbe (see login block).
    startupProbe:
      enabled: true
      periodSeconds: 1
      failureThreshold: 60
    ingress:
      enabled: false
    gateway:
      httpRoute:
        enabled: false
      grpcRoute:
        enabled: false
    postgresql:
      enabled: false
    # Reloader opt-in (chart-native podAnnotations knob): roll API + login pods
    # when the ESO-synced Secrets rotate (zitadel-db-credentials DSN,
    # zitadel-cache-auth password, zitadel-asset-storage keys). Complements the
    # Deployment-level patch in controllers/base/kustomization.yaml.
    podAnnotations:
      reloader.stakater.com/auto: "true"
    # Metrics endpoint + ServiceMonitor on (two-step: `metrics.enabled: true` adds the prometheus.io
    # scrape annotations first, then the monitor scrapes them). Monitoring CRDs arrive via the otel-operator
    # infra-crds delivery (prune:false), and the gateway TA scrapes monitors labeled `otel-scrape: "true"`
    # (labels land via sibling; see the ESO `renderMode: skipIfMissing` template in
    # external-secrets/controllers/base/externalsecrets.yaml).
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
