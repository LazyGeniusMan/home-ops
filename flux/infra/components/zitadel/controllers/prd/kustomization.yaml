apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd external domain = the admin host (issuer/console/API) +
  # LoginV2.BaseURI = the NetBird-exposed login host. ExternalDomain stays
  # the single Zitadel issuer per custom-domain.mdx; LoginV2.BaseURI (env
  # ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI, defaults.yaml) is what
  # redirects end-user auth requests to the separate login origin. The login
  # host is also registered as an instance trusted domain (terraform root)
  # so Zitadel serves it without "Instance not found".
  - patch: |
      - op: replace
        path: /spec/values/zitadel/configmapConfig/ExternalDomain
        value: admin.zitadel.home-ops.yansyah.my.id
      - op: add
        path: /spec/values/zitadel/configmapConfig/DefaultInstance
        value:
          Features:
            LoginV2:
              Required: true
              BaseURI: https://login.zitadel.home-ops.yansyah.my.id/ui/v2/login
    target:
      kind: HelmRelease
      name: zitadel
  # Prd autoscaling: API seed 2 (HA floor), login seed 2; chart-native HPA
  # owns the count (zitadel + login Deployments omit `replicas:` when enabled).
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 2
      - op: replace
        path: /spec/values/login/replicaCount
        value: 2
      - op: add
        path: /spec/values/zitadel/autoscaling
        value:
          enabled: true
          minReplicas: 2
          maxReplicas: 4
          targetCPU: 70
      - op: add
        path: /spec/values/login/autoscaling
        value:
          enabled: true
          minReplicas: 2
          maxReplicas: 4
          targetCPU: 70
    target:
      kind: HelmRelease
      name: zitadel
  # TA discovery: the otel-gateway TargetAllocator object + namespace
  # selectors both match `otel-scrape: "true"` (tenant namespace carries it
  # from the fleet tenants/infra.yaml template). The chart supports
  # metrics.serviceMonitor.additionalLabels, so the label lands via this
  # overlay patch — base values stay untouched.
  - patch: |
      - op: add
        path: /spec/values/metrics/serviceMonitor/additionalLabels
        value:
          otel-scrape: "true"
    target:
      kind: HelmRelease
      name: zitadel
