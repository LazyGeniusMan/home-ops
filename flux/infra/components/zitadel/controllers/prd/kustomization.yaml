apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd external domain (zitadel.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/values/zitadel/configmapConfig/ExternalDomain
        value: zitadel.home-ops.yansyah.my.id
    target:
      kind: HelmRelease
      name: zitadel
  # Prd autoscaling: API seed 2 (HA floor), login seed 2; chart-native HPA
  # owns the count (zitadel + login Deployments omit `replicas:` when enabled).
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 2
      - op: replace
        path: /spec/values/login/replicaCount
        value: 2
      - op: add
        path: /spec/values/zitadel/autoscaling
        value:
          enabled: true
          minReplicas: 2
          maxReplicas: 4
          targetCPU: 70
      - op: add
        path: /spec/values/login/autoscaling
        value:
          enabled: true
          minReplicas: 2
          maxReplicas: 4
          targetCPU: 70
    target:
      kind: HelmRelease
      name: zitadel
