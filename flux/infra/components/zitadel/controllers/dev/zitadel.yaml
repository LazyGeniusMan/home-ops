# Zitadel v4.17.1 identity provider (§14 dev): self-contained copy of
# controllers/base/zitadel.yaml with the §14 locked deltas. NO cross-directory
# file refs — every dev manifest below carries its own copy.
# - ExternalDomain → zitadel.homelab-dev.yansyah.my.id (the dev OIDC issuer
#   https://zitadel.homelab-dev.yansyah.my.id every §14 app builds against;
#   see the component README dev note).
# - The DSN/cache env contract is UNCHANGED: the masterkey/DSN ExternalSecrets
#   and the namespace-local DB/cache objects live in configs/dev (applied AFTER
#   controllers, same ordering discipline as the base — first install pends
#   until ESO syncs them and Flux retries).
# - Telemetry/monitoring: same as base (metrics.enabled false, no
#   ServiceMonitor until monitoring.coreos.com CRDs land).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: zitadel-chart
spec:
  interval: 1h
  url: oci://ghcr.io/zitadel/zitadel-charts/zitadel
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 10.0.4 # {"$imagepolicy": "infra:zitadel:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
spec:
  interval: 1h
  releaseName: zitadel
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: zitadel-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://zitadel.com/docs/self-hosting/deploy/kubernetes
  values:
    # Two API replicas survive a node loss; the login UI keeps one (stateless
    # Next.js front for /ui/v2/login — scale with the first real load, not here).
    replicaCount: 2
    image:
      repository: ghcr.io/zitadel/zitadel
      tag: v4.17.1
      pullPolicy: IfNotPresent
    login:
      replicaCount: 1
      image:
        repository: ghcr.io/zitadel/zitadel-login
        tag: v4.17.1
        pullPolicy: IfNotPresent
      ingress:
        enabled: false
      gateway:
        httpRoute:
          enabled: false
    zitadel:
      # Existing secret synced by ESO (configs/dev/zitadel-secrets.yaml);
      # must exist before install — see ordering note in the header.
      masterkeySecretName: zitadel-masterkey
      configmapConfig:
        ExternalDomain: zitadel.homelab-dev.yansyah.my.id
        ExternalPort: 443
        ExternalSecure: true
        TLS:
          Enabled: false # terminated at the §8 Gateway, not in-pod
    env:
      # DSN mode (recommended): discrete Database.Postgres.* fields stay unset
      # and Zitadel reads the connection string from this secret key.
      - name: ZITADEL_DATABASE_POSTGRES_DSN
        valueFrom:
          secretKeyRef:
            name: zitadel-db-credentials
            key: dsn
      # Dragonfly cache (§14 dev instance in configs/dev/zitadel-cache.yaml):
      # host <name>.<namespace>.svc.cluster.local, port 6379, no auth (dev
      # instance ships neither password nor TLS — same contract as the base).
      - name: ZITADEL_CACHES_CONNECTORS_REDIS_URL
        value: "redis://zitadel-cache.zitadel.svc.cluster.local:6379"
      - name: ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED
        value: "true"
    # No chart-managed routing or bundled Postgres: HTTPRoutes are hand-written
    # in configs/dev/zitadel-httproute.yaml (own the §8.1 pattern explicitly)
    # and the database is the §14 dev CNPG instance in configs/dev/zitadel-db.yaml.
    ingress:
      enabled: false
    gateway:
      httpRoute:
        enabled: false
      grpcRoute:
        enabled: false
    postgresql:
      enabled: false
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
