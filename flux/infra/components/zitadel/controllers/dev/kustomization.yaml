apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev external domain (zitadel.homelab-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/values/zitadel/configmapConfig/ExternalDomain
        value: zitadel.homelab-dev.yansyah.my.id
    target:
      kind: HelmRelease
      name: zitadel
  # Dev autoscaling: API + login seed replicas 1; chart-native HPA owns the
  # count (zitadel + login Deployments omit `replicas:` when enabled).
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
      - op: replace
        path: /spec/values/login/replicaCount
        value: 1
      - op: add
        path: /spec/values/zitadel/autoscaling
        value:
          enabled: true
          minReplicas: 1
          maxReplicas: 2
          targetCPU: 70
      - op: add
        path: /spec/values/login/autoscaling
        value:
          enabled: true
          minReplicas: 1
          maxReplicas: 2
          targetCPU: 70
    target:
      kind: HelmRelease
      name: zitadel
