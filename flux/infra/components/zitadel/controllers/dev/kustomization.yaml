apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev external domain (zitadel.homelab-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/values/zitadel/configmapConfig/ExternalDomain
        value: zitadel.homelab-dev.yansyah.my.id
    target:
      kind: HelmRelease
      name: zitadel
