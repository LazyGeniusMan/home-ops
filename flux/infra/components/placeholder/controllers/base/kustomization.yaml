# Placeholder component skeleton (§7 base). Real platform components land in
# §§8-14, each as its own directory under components/ following this shape:
# <name>/controllers/{base,production,staging} + <name>/configs/{base,production,staging}.
#
# The base holds Helm OCI sources (OCIRepository with Helm layerSelector) +
# HelmReleases with telemetry-off defaults; monitoring wiring
# (ServiceMonitors, alerts) is enabled per component in §§8-14.
# This placeholder directory is removed when the first real component lands.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - placeholder.yaml
