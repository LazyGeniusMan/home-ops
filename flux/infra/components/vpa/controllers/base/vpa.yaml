# VPA chart 0.12.0 (app 1.7.1) via chartproxy OCI (proxy of https://kubernetes.github.io/autoscaler).
# Recommender-only for HPA-paired workloads, Recreate for singletons. CRDs render as templates (crds.enabled/keep true, CreateReplace).
# Admission: Helm-managed certgen (cert-manager path mutually exclusive, skipped).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: vpa
spec:
  interval: 1h
  url: oci://chartproxy.container-registry.com/kubernetes.github.io/autoscaler/vertical-pod-autoscaler
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: ">=0.12.0 <0.13.0" # {"$imagepolicy": "infra:vpa:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  interval: 1h
  releaseName: vpa
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: vpa
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    # Chart templates/ CRDs applied declaratively.
    crds: CreateReplace
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    crds: CreateReplace
  # https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler/charts/vertical-pod-autoscaler
  values:
    # Resources pinned explicit (chart defaults {}); singleton seeds 1, static (no autoscaling knob).
    crds:
      enabled: true
      keep: true
    recommender:
      replicas: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
      logLevel: 4
      extraArgs: []
      resources:
        requests:
          cpu: 50m
          memory: 500Mi
        limits:
          memory: 1000Mi
    # Updater --min-replicas=2 stands: singleton targets need updatePolicy.minReplicas: 1 to ever evict.
    updater:
      replicas: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
      logLevel: 4
      resources:
        requests:
          cpu: 50m
          memory: 500Mi
        limits:
          memory: 1000Mi
    admissionController:
      enabled: true
      replicas: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
      logLevel: 4
      extraArgs: []
      registerWebhook: false
      certGen:
        enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 200Mi
        limits:
          memory: 500Mi
