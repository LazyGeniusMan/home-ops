# VPA (§9.x): Vertical Pod Autoscaler — recommender-only for HPA-paired
# workloads, applying (Recreate/Initial) for singletons; see VPA CRs next to
# each target Deployment. Chart: official upstream vertical-pod-autoscaler
# 0.12.0 (app 1.7.1) via OCI
# oci://chartproxy.container-registry.com/kubernetes.github.io/autoscaler/vertical-pod-autoscaler
# (chartproxy proxy of the official classic repo
# https://kubernetes.github.io/autoscaler). No cosign verify block: proxied
# tarballs are live-translated by chartproxy, so no upstream signature applies.
# CRD handling: the chart ships verticalpodautoscalers +
# verticalpodautoscalercheckpoints CRDs as regular templates
# (crds.enabled/keep true); Flux applies them via install/upgrade
# crds.CreateReplace below.
# Telemetry: no usage-reporting keys in chart values, nothing to switch off.
# Monitoring: recommender/updater/admissionController expose no ServiceMonitor
# keys; ServiceMonitor stays out until monitoring.coreos.com CRDs land.
# Admission: Helm-managed certgen (admissionController.registerWebhook=false
# + certGen.enabled=true). cert-manager path skipped: certManager.enabled is
# mutually exclusive with certGen, and its Issuer+Certificate CRs would wedge
# the release when cert-manager CRDs are momentarily unavailable during
# bootstrap ordering; certgen has no such cross-component dependency.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: vpa
spec:
  interval: 1h
  url: oci://chartproxy.container-registry.com/kubernetes.github.io/autoscaler/vertical-pod-autoscaler
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: ">=0.12.0 <0.13.0" # {"$imagepolicy": "infra:vpa:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  interval: 1h
  releaseName: vpa
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: vpa
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    # Flux applies the chart's templates/ CRDs declaratively.
    crds: CreateReplace
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    crds: CreateReplace
  # https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler/charts/vertical-pod-autoscaler
  values:
    # Resources: upstream chart defaults are resources: {} everywhere, so pin
    # explicit (recommender 50m/500Mi req, updater 50m/500Mi req,
    # admission-controller 50m/200Mi req; memory-only limits pinned so bursty
    # recommenders are never CPU-throttled).
    # Replica seed 1 everywhere (singleton; leader election auto-enables only
    # when replicas > 1, so no lease churn at this scale). Chart PDBs default
    # minAvailable 1 — at replicas 1 any voluntary eviction blocks, which is
    # the safe stance for the stack that owns evictions cluster-wide.
    # No autoscaling knob for the stack itself — keep static.
    crds:
      enabled: true
      keep: true
    recommender:
      replicas: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
      logLevel: 4
      extraArgs: []
      resources:
        requests:
          cpu: 50m
          memory: 500Mi
        limits:
          memory: 1000Mi
    # Updater note: extraArgs left at the chart default
    # (--in-place-skip-disruption-budget=true); the updater binary default
    # --min-replicas=2 (flags.md) stands, so singleton (1-replica) targets
    # recommend but never evict unless their VPA CR sets
    # updatePolicy.minReplicas: 1 — see the Recreate singleton VPAs.
    updater:
      replicas: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
      logLevel: 4
      resources:
        requests:
          cpu: 50m
          memory: 500Mi
        limits:
          memory: 1000Mi
    admissionController:
      enabled: true
      replicas: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
      logLevel: 4
      extraArgs: []
      registerWebhook: false
      certGen:
        enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 200Mi
        limits:
          memory: 500Mi
