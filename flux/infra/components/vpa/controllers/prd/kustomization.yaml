apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd: VPA stack stays singleton 1 per component (recommender/updater run
  # a single active pod; admission-controller may scale via replicas but a
  # second node-loss survivor is out of scope until multi-node lands).
  - patch: |
      - op: replace
        path: /spec/values/recommender/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: vpa
