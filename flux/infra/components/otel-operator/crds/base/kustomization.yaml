# ServiceMonitor + PodMonitor CRDs (prometheus-operator v0.93.1, monitoring scope ONLY)
# as a first-party Helm OCI chart (Chart source: projects/helm-otel-monitoring-crds).
# Rendered by the fleet through a prune:false infra-crds Kustomization — CRDs are never garbage-collected
# (see flux/fleet/tenants/infra.yaml). No Prometheus/PrometheusRule/Alertmanager/Grafana objects.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - monitoring-crds.yaml
