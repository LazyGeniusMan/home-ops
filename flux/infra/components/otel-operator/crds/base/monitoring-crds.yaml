# ServiceMonitor + PodMonitor CRDs (prometheus-operator v0.93.1, monitoring scope ONLY)
# as a first-party Helm OCI chart.
# Chart source: projects/helm-otel-monitoring-crds (Chart.yaml version = upstream release
# sans v; ci/fetch.sh stages both files at publish time; no YAML committed in the chart).
# Rendered by the fleet through the prune:false infra-crds Kustomization — CRDs are
# never garbage-collected (see flux/fleet/tenants/infra.yaml).
# No Prometheus/PrometheusRule/Alertmanager/Grafana objects.
# No $imagepolicy — first-party Helm OCI bumps atomically (Chart.yaml + wrapper ref.tag in one PR, cf. helm-rclone).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: monitoring-crds-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-otel-monitoring-crds
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Tag MUST equal Chart.yaml `version` in projects/helm-otel-monitoring-crds (bump
  # Chart.yaml + this ref.tag together; no $imagepolicy marker — Helm
  # OCIRepositories are untracked by image automation).
  ref:
    tag: "0.94.1"
    # No `verify:` block: first-party chart signed at publish time, no pinned
    # upstream identity — same shape as the helm-rclone wrappers.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring-crds
spec:
  interval: 1h
  releaseName: monitoring-crds
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: monitoring-crds-chart
  install:
    # CreateReplace: chart CRDs advance in place; HelmRelease deletion never
    # cascade-deletes CRs (replicates the prune:false infra-crds intent).
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-otel-monitoring-crds
