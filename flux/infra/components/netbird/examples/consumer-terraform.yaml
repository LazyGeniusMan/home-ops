# Example NetBird reverse-proxy consumer skeleton - copy into
# flux/apps/components/<app>/base/ (or flux/infra/components/<comp>/configs/base/)
# and replace every <app> / __PLACEHOLDER__. Owns only this app slice: one
# custom-domain registration (shared per base domain; second slice imports it, see
# terraform/README.md) + one wildcard CNAME + one reverse-proxy service.
# Ordering comes from the fleet Kustomization (apps dependsOn infra-configs); no
# Terraform dependsOn (checkDependencies only resolves kind Terraform). Tokens flow
# from Proton Pass via the ESO-synced <app>-terraform-vars Secret (same-namespace
# varsFrom); backend is in-cluster Kubernetes default; drift detection stays on.
# Outputs service_id + service_domain + proxy_url land in <app>-proxy-outputs.
# First-run: complete the dashboard Verify within 48h.
---
# Provider tokens from Proton Pass (ClusterSecretStore proton-pass, direct -
# no cross-namespace SecretStore needed). Keys land under module var names so
# varsFrom needs no renames; overlays patch the pass:// keys per env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: <app>-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: <app>-terraform-vars
  data:
    - secretKey: netbird_token
      remoteRef:
        key: __PROTON_PASS_BASE__/<app>/netbird-pat
    - secretKey: cloudflare_api_token
      remoteRef:
        key: __PROTON_PASS_BASE__/<app>/cloudflare-api-token
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: <app>-proxy
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: no destroy path via Flux (both destroy knobs false); drift
  # detection stays on.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared reverse-proxy root: infra/netbird OCI artifact (namespace netbird),
  # path ./terraform (cross-namespace sourceRef allowed).
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: netbird
  path: ./terraform
  # Plain per-env values here; secrets come from varsFrom (overrides vars on
  # collision). Service FQDN is fully rendered (__SERVICE_HOST__, patched per
  # env). Backend rides the shared Service-LB subnet target the root appends
  # (pass network_name + service_lb_ip; tune via target_*). POSITIONAL: overlays
  # patch /spec/vars/0 by index - keep this order.
  vars:
    - name: domain
      value: __SERVICE_HOST__
    - name: service_name
      value: <app>
    - name: cloudflare_zone_id
      value: __CLOUDFLARE_ZONE_ID__
    - name: network_name
      value: __NETWORK_NAME__
    - name: service_lb_ip
      value: __SERVICE_LB_IP__
    - name: target_port
      value: 8080
    - name: target_protocol
      value: https
  varsFrom:
    - kind: Secret
      name: <app>-terraform-vars
  writeOutputsToSecret:
    name: <app>-proxy-outputs
    outputs:
      - service_id
      - service_domain
      - proxy_url
      - service_lb_resource_id
