# NetBird consumer skeleton: copy into the app base, replace <app> / __PLACEHOLDER__. One custom-domain registration + wildcard CNAME + reverse-proxy service per slice (second slice imports the shared domain).
# Tokens via <app>-terraform-vars (same-namespace varsFrom); backend in-cluster Kubernetes default. Outputs land in <app>-proxy-outputs. Dashboard Verify within 48h.
---
# Provider tokens from Proton Pass (ClusterSecretStore proton-pass, direct -
# no cross-namespace SecretStore needed). Keys land under module var names so
# varsFrom needs no renames; overlays patch the pass:// keys per env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: <app>-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: <app>-terraform-vars
  data:
    - secretKey: netbird_token
      remoteRef:
        key: __PROTON_PASS_BASE__/<app>/netbird-pat
    - secretKey: cloudflare_api_token
      remoteRef:
        key: __PROTON_PASS_BASE__/<app>/cloudflare-api-token
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: <app>-proxy
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: no destroy path via Flux (both destroy knobs false); drift
  # detection stays on.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared reverse-proxy root: infra/netbird OCI artifact (namespace netbird),
  # path ./terraform (cross-namespace sourceRef allowed).
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: netbird
  path: ./terraform
  # Plain per-env values here; secrets come from varsFrom (overrides vars on
  # collision). Service FQDN is fully rendered (__SERVICE_HOST__, patched per
  # env). Backend rides the shared Service-LB subnet target the root appends.
  # service_lb_ip is REQUIRED (module has no default): pass the per-env Cilium
  # LB VIP explicitly (dev 192.168.1.249, prd 192.168.1.199; overlays replace
  # __SERVICE_LB_IP__). target_port is a per-consumer override of the 3000
  # default — set the in-mesh backend listener port (e.g. 80 for plain-HTTP
  # backends like element-web, 3000 for zitadel-login). POSITIONAL: overlays
  # patch /spec/vars/0 by index - keep this order.
  vars:
    - name: domain
      value: __SERVICE_HOST__
    - name: service_name
      value: <app>
    - name: cloudflare_zone_id
      value: __CLOUDFLARE_ZONE_ID__
    - name: network_name
      value: __NETWORK_NAME__
    - name: service_lb_ip
      value: __SERVICE_LB_IP__
    - name: target_port
      value: 8080 # example only: replace with the backend listener port
    - name: target_protocol
      value: https
  varsFrom:
    - kind: Secret
      name: <app>-terraform-vars
  writeOutputsToSecret:
    name: <app>-proxy-outputs
    outputs:
      - service_id
      - service_domain
      - proxy_url
      - service_lb_resource_id
