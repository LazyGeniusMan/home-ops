# SeaweedFS S3 credentials synced by ESO from the DEV Proton Pass vault
# (§14 dev). The CHI references this Secret by name (podTemplate env ->
# storage.xml from_env); no credential value is committed here. Bootstrap the
# vault entries with pass-cli (never commit):
#   pass insert 'acme-dev-bdo1-talos-apps-01/clickhouse/s3-access-key-id'
#   pass insert 'acme-dev-bdo1-talos-apps-01/clickhouse/s3-secret-access-key'
# The bucket/prefix `clickhouse/` at s3.seaweedfs.homelab-dev.yansyah.my.id
# must exist (create once via the dev SeaweedFS S3 API); the keys need
# read/write on it.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-s3-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: clickhouse-s3-backup
    template:
      data:
        access-key-id: "{{ .accessKeyID }}"
        secret-access-key: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyID
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/clickhouse/s3-access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/clickhouse/s3-secret-access-key
