apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - cloudflare-api-token.yaml
patches:
  # Dev S3 endpoint + wildcard DNS. (S3 keys are COSI-minted via the
  # in-namespace clickhouse-cosi SecretStore — no per-env vault ref patch.)
  - patch: |
      - op: replace
        path: /spec/configuration/files/storage.xml
        value: |
          <yandex>
            <storage_configuration>
              <disks>
                <backups_s3>
                  <type>s3</type>
                  <endpoint>http://seaweed-main-s3.seaweedfs:8333/clickhouse/</endpoint>
                  <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                  <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
                </backups_s3>
              </disks>
            </storage_configuration>
          </yandex>
    target:
      kind: ClickHouseInstallation
      name: clickhouse
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.clickhouse.home-ops-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-clickhouse
  # Dev Proton Pass vault (pass://acme-dev-bdo1-talos-apps-01) for the
  # rclone Proton credentials; dev off-site destination segment.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/clickhouse/rclone-proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/clickhouse/rclone-proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/target/template/data/dest-path
        value: "/home-ops/backup/acme-dev-bdo1-talos-apps-01/clickhouse/{{ .bucketName }}"
    target:
      kind: ExternalSecret
      name: rclone-sync-clickhouse-paths
  # Dev single-instance scaling: stateful HA placeholders -> 1.
  - patch: |
      - op: replace
        path: /spec/configuration/clusters/0/layout/replicasCount
        value: 1
    target:
      kind: ClickHouseKeeperInstallation
      name: clickhouse-keeper
  - patch: |
      - op: replace
        path: /spec/configuration/clusters/0/layout/replicasCount
        value: 1
    target:
      kind: ClickHouseInstallation
      name: clickhouse
