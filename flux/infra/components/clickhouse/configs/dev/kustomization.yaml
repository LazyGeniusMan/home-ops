apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - cloudflare-api-token.yaml
patches:
  # Dev S3 endpoint + wildcard DNS. (S3 keys are COSI-minted via the
  # in-namespace clickhouse-cosi SecretStore — no per-env vault ref patch.)
  - patch: |
      - op: replace
        path: /spec/configuration/files/storage.xml
        value: |
          <yandex>
            <storage_configuration>
              <disks>
                <backups_s3>
                  <type>s3</type>
                  <endpoint>http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333/clickhouse/</endpoint>
                  <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                  <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
                </backups_s3>
              </disks>
            </storage_configuration>
          </yandex>
    target:
      kind: ClickHouseInstallation
      name: clickhouse
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.clickhouse.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-clickhouse
