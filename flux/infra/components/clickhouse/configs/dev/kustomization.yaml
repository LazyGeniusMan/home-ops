apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - cloudflare-api-token.yaml
patches:
  # Dev S3 endpoint + wildcard DNS (keys COSI-minted).
  - patch: |
      - op: replace
        path: /spec/configuration/files/storage.xml
        value: |
          <yandex>
            <storage_configuration>
              <disks>
                <backups_s3>
                  <type>s3</type>
                  <endpoint>http://seaweed-main-s3.seaweedfs:8333/clickhouse/</endpoint>
                  <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                  <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
                </backups_s3>
              </disks>
            </storage_configuration>
          </yandex>
    target:
      kind: ClickHouseInstallation
      name: clickhouse
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-clickhouse
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-clickhouse-tls
    target:
      kind: Certificate
      name: wildcard-clickhouse
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.clickhouse.home-ops-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-clickhouse
  # Dev Proton vault + off-site destination segment.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/clickhouse/rclone-proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/clickhouse/rclone-proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/target/template/data/dest-path
        value: "/home-ops/backups/acme-dev-bdo1-talos-apps-01/clickhouse/{{ .bucketName }}"
    target:
      kind: ExternalSecret
      name: rclone-sync-clickhouse-paths
  # Dev scaling: stateful placeholders -> 1.
  - patch: |
      - op: replace
        path: /spec/configuration/clusters/0/layout/replicasCount
        value: 1
    target:
      kind: ClickHouseKeeperInstallation
      name: clickhouse-keeper
  - patch: |
      - op: replace
        path: /spec/configuration/clusters/0/layout/replicasCount
        value: 1
    target:
      kind: ClickHouseInstallation
      name: clickhouse
