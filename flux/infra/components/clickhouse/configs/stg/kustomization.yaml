# STG OVERLAY — RESERVED/UNUSED: no cluster renders ./stg (ENVIRONMENT is
# dev on acme-dev-bdo1-talos-apps-01 and prd on acme-prd-bdo1-talos-apps-01;
# ENVIRONMENT=stg exists only on the update automation cluster, which
# reconciles update-policies — not component overlays). The patches below
# mirror prd values so the overlay stays buildable and prd-shaped if a real
# stg environment is ever defined; until then they are inert. Kept (not
# removed) so the {base,dev,stg,prd} layout stays uniform (see
# flux/fleet/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - patch: |
      - op: replace
        path: /spec/configuration/clusters/0/layout/shardsCount
        value: 1
      - op: replace
        path: /spec/configuration/clusters/0/layout/replicasCount
        value: 1
      - op: replace
        path: /spec/templates/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi
    target:
      kind: ClickHouseInstallation
      name: clickhouse
  - patch: |
      - op: add
        path: /spec/suspend
        value: true
    target:
      kind: CronJob
      name: clickhouse-backup
  # Stg (prd values) S3 endpoint + wildcard DNS. (S3 keys are COSI-minted
  # via the in-namespace clickhouse-cosi SecretStore — no per-env vault ref
  # patch.)
  - patch: |
      - op: replace
        path: /spec/configuration/files/storage.xml
        value: |
          <yandex>
            <storage_configuration>
              <disks>
                <backups_s3>
                  <type>s3</type>
                  <endpoint>http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333/clickhouse/</endpoint>
                  <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                  <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
                </backups_s3>
              </disks>
            </storage_configuration>
          </yandex>
    target:
      kind: ClickHouseInstallation
      name: clickhouse
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.clickhouse.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-clickhouse
