# S3 to ProtonDrive off-site backup for BucketClaim/clickhouse. Syncs the live COSI
# bucket path <bc-uuid>/clickhouse (never the claim name) to
# /home-ops/backups/<cluster>/clickhouse/<bucket>, capturing nightly snapshots
# (backup-cronjob.yaml BACKUP TO Disk backs up under nightly/).
# S3 keys esoRef-consume the ESO-synced clickhouse-s3-backup Secret; Proton creds sync
# from ClusterSecretStore/proton-pass (password rclone-obscured). Seed
# pass://<cluster>/clickhouse/rclone-proton-username and
# pass://<cluster>/clickhouse/rclone-proton-password. Schedule 30 4 * * * (after the
# 0 3 nightly backup), operation sync, concurrencyPolicy Forbid. Chart
# oci://ghcr.io/lazygeniusman/home-ops/projects/helm-rclone-sync tag 0.1.0
# (projects/helm-rclone-sync, direction-05 shape).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-proton-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: rclone-proton-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/clickhouse/rclone-proton-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/clickhouse/rclone-proton-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-sync-clickhouse-paths
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickhouse-cosi
    kind: SecretStore
  target:
    name: rclone-sync-clickhouse-paths
    template:
      data:
        source-path: "{{ .bucketName }}/clickhouse"
        # __CLUSTER_NAME__ placeholder: dev/prd overlays patch the full literal.
        dest-path: "/home-ops/backups/__CLUSTER_NAME__/clickhouse/{{ .bucketName }}"
  data:
    - secretKey: bucketName
      remoteRef:
        key: clickhouse-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: helm-rclone-sync-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-rclone-sync
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Chart tag MUST equal Chart.yaml version in projects/helm-rclone-sync; bump
  # Chart.yaml + all six consumers in one commit.
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-sync-clickhouse
spec:
  interval: 1h
  releaseName: rclone-sync-clickhouse
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-rclone-sync
  values:
    schedule: "30 4 * * *"
    concurrencyPolicy: Forbid
    rclone:
      operation: sync
    source:
      type: s3
      uri:
        esoRef:
          name: rclone-sync-clickhouse-paths
          key: source-path
      credentials:
        provider:
          value: AWS
        accessKeyId:
          esoRef:
            name: clickhouse-s3-backup
            key: access-key-id
        secretAccessKey:
          esoRef:
            name: clickhouse-s3-backup
            key: secret-access-key
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      uri:
        esoRef:
          name: rclone-sync-clickhouse-paths
          key: dest-path
      credentials:
        username:
          esoRef:
            name: rclone-proton-credentials
            key: username
        password:
          esoRef:
            name: rclone-proton-credentials
            key: password
