# SeaweedFS S3 credentials synced by ESO from Proton Pass (§10.2). The CHI
# references this Secret by name (podTemplate env -> storage.xml from_env);
# no credential value is committed here. Bootstrap the vault entries with
# pass-cli (never commit):
#   pass insert '__VAULT_CLUSTER__/clickhouse/s3-access-key-id'
#   pass insert '__VAULT_CLUSTER__/clickhouse/s3-secret-access-key'
# The bucket/prefix `clickhouse/` at __S3_HOST__ must
# exist (create once via the SeaweedFS S3 API); the keys need read/write on it.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-s3-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: clickhouse-s3-backup
    template:
      data:
        access-key-id: "{{ .accessKeyID }}"
        secret-access-key: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyID
      remoteRef:
        key: __PROTON_PASS_BASE__/clickhouse/s3-access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: __PROTON_PASS_BASE__/clickhouse/s3-secret-access-key
