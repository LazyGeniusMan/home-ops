# S3 credentials from the COSI BucketInfo (clickhouse-cosi-creds) via the in-namespace clickhouse-cosi SecretStore. Bucket/prefix clickhouse/ must pre-exist.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-s3-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickhouse-cosi
    kind: SecretStore
  target:
    name: clickhouse-s3-backup
    template:
      data:
        access-key-id: "{{ .accessKeyID }}"
        secret-access-key: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyID
      remoteRef:
        key: clickhouse-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: clickhouse-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
