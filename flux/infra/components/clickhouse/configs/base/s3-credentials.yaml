# SeaweedFS S3 credentials synced by ESO from the COSI-minted BucketInfo
# JSON (§10.2; Secret clickhouse-cosi-creds, key BucketInfo) through the
# in-namespace `clickhouse-cosi` SecretStore (cosi-keys.yaml) — GJSON
# `property` extracts spec.secretS3.accessKeyID/accessSecretKey. The CHI
# references this Secret by name (podTemplate env -> storage.xml from_env);
# target literal keys (access-key-id/secret-access-key) are unchanged, so no
# credential value is committed here. Keys only: bucket/prefix endpoints in
# storage.xml overlays are out of scope.
# Fallback: the Proton Pass entries (pass://.../clickhouse/s3-*) are
# retained in the vault; to roll back, repoint secretStoreRef to
# proton-pass/ClusterSecretStore with remoteRef keys
# __PROTON_PASS_BASE__/clickhouse/s3-access-key-id and
# __PROTON_PASS_BASE__/clickhouse/s3-secret-access-key (no `property`).
# The bucket/prefix `clickhouse/` at __S3_HOST__ must
# exist (create once via the SeaweedFS S3 API); the keys need read/write on it.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-s3-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickhouse-cosi
    kind: SecretStore
  target:
    name: clickhouse-s3-backup
    template:
      data:
        access-key-id: "{{ .accessKeyID }}"
        secret-access-key: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyID
      remoteRef:
        key: clickhouse-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: clickhouse-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
