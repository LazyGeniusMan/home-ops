# COSI bucket clickhouse (BucketClass/seaweedfs, S3) for infra ClickHouse nightly backups (CHI storage.xml target).
# Live bucket provisions under a controller-generated name (bc-<uuid>). Keys via same-namespace ExternalSecrets.
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: clickhouse
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: clickhouse-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: clickhouse
  credentialsSecretName: clickhouse-cosi-creds
  protocol: S3
