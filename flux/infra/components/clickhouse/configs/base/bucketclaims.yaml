# COSI-managed bucket for the ClickHouse backups (colocated with the
# consuming component — lands in the `clickhouse` tenant namespace via the
# Fleet `infra-configs` Kustomization's `targetNamespace`). The apps
# `clickstack` component has its own dedicated claim (see
# flux/apps/components/clickstack/base/bucketclaims.yaml), not a prefix on
# this bucket.
# - Claim uses BucketClass/seaweedfs, protocol S3. The driver provisions the
#   live bucket under a controller-generated name (`bc-<uuid>`), so
#   `spec.existingBucketName` stays unset; read the live name from the
#   claim's `status.bucketName` once `status.bucketReady` is true.
# - `clickhouse` backs the infra ClickHouse nightly backups: the CHI
#   `storage.xml` endpoint (see installation-base.yaml) targets the
#   COSI-provisioned bucket.
# - The BucketAccess mints S3 keys into its `credentialsSecretName` Secret in
#   THIS namespace as a `BucketInfo` JSON file. The driver hands back the
#   internal endpoint
#   (http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333).
# - Credential bridge: consumers read COSI BucketInfo JSON through
#   same-namespace ExternalSecrets.
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: clickhouse
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: clickhouse-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: clickhouse
  credentialsSecretName: clickhouse-cosi-creds
  protocol: S3
