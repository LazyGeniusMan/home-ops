# Nightly full-cluster backup to SeaweedFS S3 (immutable snapshots under nightly/; retention via bucket lifecycle). Uses the CHI Service clickhouse (8123/9000).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-backup
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: clickhouse/clickhouse-server:26.8.10.6 # {"$imagepolicy": "infra:clickhouse-server:tag"}
              command: ["clickhouse-client"]
              args:
                - --host=clickhouse
                - --query=BACKUP ALL ON CLUSTER 'main' TO Disk('backups_s3', 'nightly/')
