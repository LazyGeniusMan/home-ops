# Nightly full-cluster backup to SeaweedFS S3 (§10.2). Each BACKUP is an
# immutable point-in-time snapshot under the `nightly/` prefix; retention is
# enforced by bucket lifecycle (see README runbook). The operator creates a
# CHI-level Service named exactly `clickhouse` (ports 8123/9000), so the job
# needs no hardcoded pod addresses. Suspended in stg (see overlay).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-backup
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: clickhouse/clickhouse-server:25.9.7.56
              command: ["clickhouse-client"]
              args:
                - --host=clickhouse
                - --query=BACKUP ALL ON CLUSTER 'main' TO Disk('backups_s3', 'nightly/')
