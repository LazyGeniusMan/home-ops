# Reusable ClickHouseInstallation base: 2 shards x 2 replicas against a 3-replica Keeper; local-ssd-nvme; S3 backups via backups_s3 disk (clickhouse-s3-backup Secret).
# Server/keeper images pinned to the 26.8 LTS line in lockstep. Tables use ReplicatedMergeTree + ON CLUSTER DDL.
# Auth: dedicated `otel` user (password from the ESO-synced `clickhouse-auth` Secret, key `otel-password`);
# the operator-locked `default` user keeps its empty password for localhost/distributed-query only (never over the wire).
---
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: clickhouse-keeper
spec:
  configuration:
    clusters:
      - name: keeper
        layout:
          replicasCount: 3 # placeholder - overridden by dev/prd overlays
    settings:
      # Keeper listens on all pod interfaces (quorum peers dial each other
      # over the pod network; ClusterIP Services front clients). Pod traffic
      # itself is encrypted at the CNI layer (Cilium WireGuard), not here.
      listen_host: "0.0.0.0"
      # Four-letter commands restricted to read-only diagnostics (stat/srvr/
      # cons/mntr); `conf`/`envi` leak config, `stmk`/`srst`/kill paths stay off.
      keeper_server/four_letter_word_white_list: "stat,srvr,cons,mntr"
      prometheus/endpoint: "/metrics"
      prometheus/port: "7000"
      prometheus/metrics: "true"
      prometheus/events: "true"
      prometheus/asynchronous_metrics: "true"
      prometheus/status_info: "false"
  defaults:
    templates:
      podTemplate: keeper
      dataVolumeClaimTemplate: keeper-data
  templates:
    podTemplates:
      - name: keeper
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "7000"
        spec:
          # Preferred (not required) hostname spread: dev runs a single node
          # where required anti-affinity would strand keeper replicas Pending;
          # prd still spreads 3 keepers across nodes (weight 100, dragonfly-base.yaml style).
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app: clickhouse-keeper
                    topologyKey: "kubernetes.io/hostname"
          containers:
            - name: clickhouse-keeper
              image: clickhouse/clickhouse-keeper:26.8.10.6 # {"$imagepolicy": "infra:clickhouse-keeper:tag"}
    volumeClaimTemplates:
      - name: keeper-data
        provisioner: Operator
        reclaimPolicy: Retain
        spec:
          storageClassName: local-ssd-nvme
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse
spec:
  defaults:
    templates:
      dataVolumeClaimTemplate: clickhouse-data
      logVolumeClaimTemplate: clickhouse-log
      podTemplate: clickhouse-server
  configuration:
    zookeeper:
      keeper:
        name: clickhouse-keeper
    clusters:
      - name: main
        layout:
          shardsCount: 2
          replicasCount: 2 # placeholder - overridden by dev/prd overlays
    settings:
      backups/allowed_disk: backups_s3
    users:
      # Dedicated telemetry writer: password injected from the ESO-synced
      # `clickhouse-auth` Secret (key `otel-password`) via same-namespace
      # secretKeyRef (operator renders it as from_env; never committed).
      otel/password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-auth
            key: otel-password
    files:
      storage.xml: |
        <yandex>
          <storage_configuration>
            <disks>
              <backups_s3>
                <type>s3</type>
                <endpoint>__S3_ENDPOINT_URL__/clickhouse/</endpoint>
                <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
              </backups_s3>
            </disks>
          </storage_configuration>
        </yandex>
  templates:
    podTemplates:
      - name: clickhouse-server
        spec:
          containers:
            - name: clickhouse-pod
              image: clickhouse/clickhouse-server:26.8.10.6 # {"$imagepolicy": "infra:clickhouse-server:tag"}
              env:
                - name: CLICKHOUSE_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-s3-backup
                      key: access-key-id
                - name: CLICKHOUSE_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-s3-backup
                      key: secret-access-key
    volumeClaimTemplates:
      - name: clickhouse-data
        spec:
          storageClassName: local-ssd-nvme
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
      - name: clickhouse-log
        spec:
          storageClassName: local-ssd-nvme
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
