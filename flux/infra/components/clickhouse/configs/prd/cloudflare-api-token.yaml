# Prd DNS-01 token: mirrors the dev overlay doc (base carries no token doc),
# so the wildcard Certificate DNS-01 solver credential exists in this
# namespace too (same pattern as gateway-api/configs/base).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
