# ClickHouse operator 0.27.3 (§10.2): Altinity clickhouse-operator backing the
# infra data layer. Chart: oci://registry-1.docker.io/altinity/clickhouse-operator,
# tag 0.27.3.
# Telemetry: no usage-reporting keys in chart values, nothing to switch off.
# Monitoring: metrics exporter on (prometheus.io annotations, safe without a
# stack); ServiceMonitor stays disabled until monitoring.coreos.com CRDs land.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: clickhouse-operator-chart
spec:
  interval: 1h
  url: oci://registry-1.docker.io/altinity/clickhouse-operator
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.27.3 # {"$imagepolicy": "infra:clickhouse:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
spec:
  interval: 1h
  releaseName: clickhouse-operator
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: clickhouse-operator-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/Altinity/clickhouse-operator/tree/master/deploy/helm/clickhouse-operator
  # NOTE: the chart exposes no operator replica knob (the Deployment template
  # hardcodes `replicas: 1`); dev/prd carry no replica patches. NO HPA: the
  # operator has no leader-election wiring, so >1 replica would
  # double-reconcile.
  values:
    # Resources: chart defaults {}; operator sized with Go watch-cache
    # headroom; exporter is a light sidecar.
    operator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    metrics:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    serviceMonitor:
      enabled: false
      keeperMetrics:
        enabled: false
