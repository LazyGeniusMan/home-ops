# ClickHouse operator 0.27.3 (chart == operator line; server/keeper images pinned separately on the 26.8 LTS line — skew guard in update-policies/clickhouse.yaml: keep all three together). Chart oci://registry-1.docker.io/altinity/clickhouse-operator.
# ServiceMonitors on (operator + keeper): monitoring CRDs arrive via the otel-operator infra-crds delivery
# (prune:false), and the gateway TA scrapes monitors labeled `otel-scrape: "true"` (labels land via sibling;
# see the ESO `renderMode: skipIfMissing` template in external-secrets/controllers/base/externalsecrets.yaml).
# Telemetry endpoint (`metrics.enabled: true`) stays as-is.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: clickhouse-operator-chart
spec:
  interval: 1h
  url: oci://registry-1.docker.io/altinity/clickhouse-operator
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.27.3 # {"$imagepolicy": "infra:clickhouse:tag"}
  # No `verify:` block: no cosign identity pinned for this upstream chart —
  # tracked by tag + `$imagepolicy` under the fleet source allowlist.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
spec:
  interval: 1h
  releaseName: clickhouse-operator
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: clickhouse-operator-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/Altinity/clickhouse-operator/tree/master/deploy/helm/clickhouse-operator
  # NOTE: the chart exposes no operator replica knob (the Deployment template
  # hardcodes `replicas: 1`); dev/prd carry no replica patches. NO HPA: the
  # operator has no leader-election wiring, so >1 replica would
  # double-reconcile.
  values:
    # Resources: chart defaults {}; operator sized with Go watch-cache
    # headroom (CPU limit 5x request caps watch-relist bursts); exporter is
    # a light sidecar (limit 4x request for scrape bursts only).
    operator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    metrics:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    serviceMonitor:
      enabled: true
      keeperMetrics:
        enabled: true
