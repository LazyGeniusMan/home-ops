# ClickHouse operator 0.27.3 (§10.2): Altinity clickhouse-operator backing the
# infra data layer. Chart: oci://registry-1.docker.io/altinity/clickhouse-operator
# (tag 0.27.3 verified present on Docker Hub; OCI-first so chart bumps flow
# through the §7 update-policy contract like every other §9 component — the
# classic https://helm.altinity.com repo is the documented fallback if the OCI
# artifact ever fails to resolve, same justification as the coredns precedent).
# Telemetry: no usage-reporting/telemetry keys in chart values (verified:
# non-comment values lines matching telemetry|usageReporting|phoneHome|
# analytics are empty), so there is nothing to switch off.
# Monitoring: metrics exporter on (prometheus.io annotations, safe without a
# stack); ServiceMonitor stays disabled until monitoring.coreos.com CRDs land.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: clickhouse-operator-chart
spec:
  interval: 1h
  url: oci://registry-1.docker.io/altinity/clickhouse-operator
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.27.3 # {"$imagepolicy": "infra:clickhouse:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
spec:
  interval: 1h
  releaseName: clickhouse-operator
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: clickhouse-operator-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/Altinity/clickhouse-operator/tree/master/deploy/helm/clickhouse-operator
  values:
    metrics:
      enabled: true
    serviceMonitor:
      enabled: false
      keeperMetrics:
        enabled: false
