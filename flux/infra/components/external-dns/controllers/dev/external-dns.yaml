# ExternalDNS dev (§14): two synced providers over homelab-dev.yansyah.my.id.
# Mirrors the prd chart (same OCI mirror, tags via update-policies) with:
#  - domainFilters → homelab-dev.yansyah.my.id
#  - txtOwnerId → home-ops-dev-* (distinct from prd so registries never clash)
#  - DOMAIN_FILTER env → homelab-dev.yansyah.my.id
#  - the *.homelab-dev.yansyah.my.id A record materializes from the dev
#    Gateway LB target (192.168.1.249).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-dns-chart
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/external-dns
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "1.21.1" # {"$imagepolicy": "infra:external-dns:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare
spec:
  interval: 1h
  releaseName: external-dns-cloudflare
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: external-dns-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    image:
      tag: v0.22.0
    provider:
      name: cloudflare
    sources:
      - service
      - ingress
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - crd
    policy: sync
    registry: txt
    txtOwnerId: home-ops-dev-cloudflare
    txtPrefix: extdns-cf-
    domainFilters:
      - homelab-dev.yansyah.my.id
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    serviceMonitor:
      enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-netbird
spec:
  interval: 1h
  releaseName: external-dns-netbird
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: external-dns-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    image:
      tag: v0.22.0
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/lazygeniusman/home-ops/infra/external-dns-netbird
          tag: dev # {"$imagepolicy": "infra:external-dns-netbird:tag"}
        env:
          - name: NETBIRD_PAT_FILE
            value: /secrets/pat
          - name: DOMAIN_FILTER
            value: homelab-dev.yansyah.my.id
        extraVolumeMounts:
          - name: pat
            mountPath: /secrets
            readOnly: true
    extraVolumes:
      - name: pat
        secret:
          secretName: netbird-pat
          items:
            - key: pat
              path: pat
    extraArgs:
      webhook-provider-url: http://localhost:8888
    sources:
      - service
      - ingress
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - crd
    policy: sync
    registry: txt
    txtOwnerId: home-ops-dev-netbird
    txtPrefix: extdns-nb-
    domainFilters:
      - homelab-dev.yansyah.my.id
    serviceMonitor:
      enabled: false
