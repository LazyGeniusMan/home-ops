apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev DNS scope: home-ops-dev.yansyah.my.id (home-ops-dev-netbird, single
  # NetBird webhook instance — no Cloudflare provider).
  # Merge patches (no positional paths): txtOwnerId + domainFilters are
  # wholesale scalar/single-item values, so a merge replaces them cleanly.
  # The webhook DOMAIN_FILTER env entry below stays a test-guarded RFC 6902
  # patch — provider.webhook.env is an ordered list with no merge key on
  # this CRD, so wholesale replacement would silently drop future base env
  # entries; the `test` op fails the build loudly if the entry ever moves
  # from index 1 (same guard pattern as flux/fleet/tenants/overlays).
  - target:
      kind: HelmRelease
      name: external-dns-netbird
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: external-dns-netbird
      spec:
        values:
          txtOwnerId: home-ops-dev-netbird
          domainFilters:
            - home-ops-dev.yansyah.my.id
  - patch: |
      - op: test
        path: /spec/values/provider/webhook/env/1/name
        value: DOMAIN_FILTER
      - op: replace
        path: /spec/values/provider/webhook/env/1/value
        value: home-ops-dev.yansyah.my.id
    target:
      kind: HelmRelease
      name: external-dns-netbird
  # Dev single-instance scaling: the webhook instance is a singleton (no
  # leader election caps replicaCount at 1); pin placeholder -> 1.
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: external-dns-netbird
