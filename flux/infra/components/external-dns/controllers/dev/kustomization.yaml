apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev DNS scope: home-ops-dev.yansyah.my.id (home-ops-dev-netbird). Merge patch for scalar values; test-guarded RFC 6902 patch for the ordered webhook env list (test op fails loudly if the entry moves).
  - target:
      kind: HelmRelease
      name: external-dns-netbird
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: external-dns-netbird
      spec:
        values:
          txtOwnerId: home-ops-dev-netbird
          domainFilters:
            - home-ops-dev.yansyah.my.id
  - patch: |
      - op: test
        path: /spec/values/provider/webhook/env/1/name
        value: DOMAIN_FILTER
      - op: replace
        path: /spec/values/provider/webhook/env/1/value
        value: home-ops-dev.yansyah.my.id
    target:
      kind: HelmRelease
      name: external-dns-netbird
  # Dev single-instance scaling: the webhook instance is a singleton (no
  # leader election caps replicaCount at 1); pin placeholder -> 1.
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: external-dns-netbird
