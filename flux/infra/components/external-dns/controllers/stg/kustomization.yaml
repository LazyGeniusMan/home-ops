apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd DNS scope: home-ops.yansyah.my.id (home-ops-prd-cloudflare / home-ops-prd-netbird).
  - patch: |
      - op: replace
        path: /spec/values/txtOwnerId
        value: home-ops-prd-cloudflare
      - op: replace
        path: /spec/values/domainFilters/0
        value: home-ops.yansyah.my.id
    target:
      kind: HelmRelease
      name: external-dns-cloudflare
  - patch: |
      - op: replace
        path: /spec/values/txtOwnerId
        value: home-ops-prd-netbird
      - op: replace
        path: /spec/values/provider/webhook/env/1/value
        value: home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/domainFilters/0
        value: home-ops.yansyah.my.id
    target:
      kind: HelmRelease
      name: external-dns-netbird
