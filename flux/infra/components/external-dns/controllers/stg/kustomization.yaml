# STG OVERLAY — RESERVED/UNUSED: no cluster renders ./stg (ENVIRONMENT is
# dev on acme-dev-bdo1-talos-apps-01 and prd on acme-prd-bdo1-talos-apps-01;
# ENVIRONMENT=stg exists only on the update automation cluster, which
# reconciles update-policies — not component overlays). The patches below
# mirror prd DNS scope (home-ops.yansyah.my.id — NOT a distinct stg domain;
# no stg domain exists) so the overlay stays buildable and prd-shaped if a
# real stg environment is ever defined; until then it is inert and CANNOT
# fight prd over the TXT registry/domain because it is never rendered. Kept
# (not removed) so the {base,dev,stg,prd} layout stays uniform (see
# flux/fleet/README.md). If stg ever becomes real, give it its own domain
# and txtOwnerIds — do not point it at prd scope.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Merge patches (no positional paths): txtOwnerId + domainFilters are
  # wholesale scalar/single-item values, so a merge replaces them cleanly.
  # The webhook DOMAIN_FILTER env entry below stays a test-guarded RFC 6902
  # patch — provider.webhook.env is an ordered list with no merge key on
  # this CRD, so wholesale replacement would silently drop future base env
  # entries; the `test` op fails the build loudly if the entry ever moves
  # from index 1 (same guard pattern as flux/fleet/tenants/overlays).
  - target:
      kind: HelmRelease
      name: external-dns-cloudflare
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: external-dns-cloudflare
      spec:
        values:
          txtOwnerId: home-ops-prd-cloudflare
          domainFilters:
            - home-ops.yansyah.my.id
  - target:
      kind: HelmRelease
      name: external-dns-netbird
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: external-dns-netbird
      spec:
        values:
          txtOwnerId: home-ops-prd-netbird
          domainFilters:
            - home-ops.yansyah.my.id
  - patch: |
      - op: test
        path: /spec/values/provider/webhook/env/1/name
        value: DOMAIN_FILTER
      - op: replace
        path: /spec/values/provider/webhook/env/1/value
        value: home-ops.yansyah.my.id
    target:
      kind: HelmRelease
      name: external-dns-netbird
