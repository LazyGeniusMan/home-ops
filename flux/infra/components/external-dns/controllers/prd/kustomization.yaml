apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd DNS scope: home-ops.yansyah.my.id (home-ops-prd-netbird). Merge patch for scalar values; test-guarded RFC 6902 patch for the ordered webhook env list (test op fails loudly if the entry moves).
  - target:
      kind: HelmRelease
      name: external-dns-netbird
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: external-dns-netbird
      spec:
        values:
          txtOwnerId: home-ops-prd-netbird
          domainFilters:
            - home-ops.yansyah.my.id
  - patch: |
      - op: test
        path: /spec/values/provider/webhook/env/1/name
        value: DOMAIN_FILTER
      - op: replace
        path: /spec/values/provider/webhook/env/1/value
        value: home-ops.yansyah.my.id
    target:
      kind: HelmRelease
      name: external-dns-netbird
  # Prd scaling: external-dns has no leader election (chart schema caps
  # replicaCount at 1), so prd stays singleton like dev.
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: external-dns-netbird
  # TA discovery: the otel-gateway TargetAllocator object + namespace
  # selectors both match `otel-scrape: "true"` (tenant namespace carries it
  # from the fleet tenants/infra.yaml template). The chart supports
  # serviceMonitor.additionalLabels, so the label lands via this overlay
  # patch — base values stay untouched.
  - patch: |
      - op: add
        path: /spec/values/serviceMonitor/additionalLabels
        value:
          otel-scrape: "true"
    target:
      kind: HelmRelease
      name: external-dns-netbird
