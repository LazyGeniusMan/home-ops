# ExternalDNS chart 1.22.0 (app v0.22.0) + NetBird webhook sidecar (projects/external-dns-netbird, :dev, PAT via NETBIRD_PAT_FILE).
# Gateway routes are the only sync source (no Cloudflare provider, no Record/DNSEndpoint CRs); wildcard A from the Gateway LB target (__LB_VIP__).
# serviceMonitor `enabled: true`: monitoring CRDs land first via the prune:false infra-crds tenant (fleet/tenants/infra.yaml gates
# dependents on Established); the otel gateway TA discovers ServiceMonitors via the `otel-scrape: "true"` label. The chart renders
# monitoring.coreos.com resources unconditionally (no skipIfMissing guard like ESO
# external-secrets/controllers/base/externalsecrets.yaml).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-dns-chart
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/external-dns
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "1.22.0" # {"$imagepolicy": "infra:external-dns:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-netbird
spec:
  interval: 1h
  releaseName: external-dns-netbird
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: external-dns-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://kubernetes-sigs.github.io/external-dns/latest/charts/external-dns/
  values:
    # Singleton placeholder: external-dns has no leader election (chart schema
    # caps replicaCount at 1); pinned to 1 in dev/prd overlays. NO HPA: >1
    # replica would issue duplicate/conflicting DNS writes.
    replicaCount: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
    # Resources: upstream chart defaults {}; tiny-singleton requests pinned
    # for scheduling/QoS, memory-only limit so the sync loop is never
    # CPU-throttled. The webhook sidecar (provider.webhook.resources) is a Go
    # distroless server, sized lighter with a memory-only limit.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    image:
      tag: v0.22.0
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/lazygeniusman/home-ops/projects/external-dns-netbird
          tag: dev # {"$imagepolicy": "infra:external-dns-netbird:tag"}
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 64Mi
        env:
          - name: NETBIRD_PAT_FILE
            value: /secrets/pat
          - name: DOMAIN_FILTER
            value: __BASE_DOMAIN__
          - name: METRICS_ADDR
            value: ":8080"
          - name: LOG_LEVEL
            value: info
          # Infra OTLP endpoint (overrides code default; OTEL_SDK_DISABLED=true disables export).
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-gateway-collector.otel-collectors.svc:4318"
        # Probes hit the sidecar ops listener: `http-webhook` renders (helm
        # template, chart 1.22.0) to containerPort 8080 (METRICS_ADDR), which
        # serves /healthz + /readyz (projects/external-dns-netbird
        # internal/server/ops.go) — NOT the :8888 webhook API (no /healthz).
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          successThreshold: 1
        extraVolumeMounts:
          - name: pat
            mountPath: /secrets
            readOnly: true
    extraVolumes:
      - name: pat
        secret:
          secretName: netbird-pat
          items:
            - key: pat
              path: pat
    extraArgs:
      webhook-provider-url: http://localhost:8888
    sources:
      - service
      - ingress
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - crd
    policy: sync
    registry: txt
    txtOwnerId: __TXT_OWNER_NB__
    txtPrefix: extdns-nb-
    domainFilters:
      - __BASE_DOMAIN__
    serviceMonitor:
      enabled: true
