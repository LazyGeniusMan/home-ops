# ExternalDNS (§9.4): single NetBird webhook provider over __BASE_DOMAIN__.
# Chart mirror: oci://ghcr.io/controlplaneio-fluxcd/charts/external-dns
# (verified tag 1.21.1); app image pinned to v0.22.0 per scope (chart default
# is v0.21.0 — both tags verified present on registry.k8s.io).
#  - external-dns-netbird: NetBird Custom Zones via the in-repo webhook
#    sidecar (projects/external-dns-netbird, :dev), PAT via NETBIRD_PAT_FILE.
# Image-stream decision (G5, recorded — no undocumented prd-tracks-dev):
# the webhook sidecar tag below is an intentional single-stream :dev
# (branch pushes) for ALL envs — prd runs the dev stream too. Risk: prd
# inherits every main-branch webhook push with no release gate; a bad NetBird
# push breaks prd DNS sync directly. Accepted because no
# external-dns-netbird-v* tagged release exists yet and the sidecar is a
# localhost-only translator behind the singleton external-dns instance.
# Promotion trigger: when the first external-dns-netbird-v* tag lands, CI
# publishes the :stable + semver leg and prd pins :stable (policy
# infra:external-dns-netbird:tag in update-policies/external-dns.yaml tracks
# the new leg) while dev stays on :dev.
# TXT ownership: txtOwnerId/txtPrefix pin the single txt registry.
# policy sync.
# Sources include Gateway API routes so §8 Gateways/HTTPRoutes sync without
# any file overlap; the wildcard A record materializes from
# the section 8 Gateway LB target (__LB_VIP__). No Cloudflare provider and
# no manual Record/DNSEndpoint CRs — the Gateway routes are the only sync
# source (verified: no DNSEndpoint/Record CRs ship anywhere in flux/).
# Telemetry: external-dns phones home nothing. Monitoring: ServiceMonitor
# stays disabled until monitoring.coreos.com CRDs land (see README).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-dns-chart
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/external-dns
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "1.21.1" # {"$imagepolicy": "infra:external-dns:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-netbird
spec:
  interval: 1h
  releaseName: external-dns-netbird
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: external-dns-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://kubernetes-sigs.github.io/external-dns/latest/charts/external-dns/
  values:
    # Singleton placeholder: external-dns has no leader election (chart
    # schema caps replicaCount at 1 AND the Deployment template fails the
    # render above 1); pinned to 1 in dev/prd overlays. NO HPA: >1 replica
    # would issue duplicate/conflicting DNS writes (verified against
    # external-dns-docs/charts/external-dns: values.schema.json maximum 1,
    # templates/deployment.yaml fail guard, proposal/001-leader-election
    # status not-planned).
    replicaCount: 1 # placeholder - singleton, pinned to 1 in dev/prd overlays
    # Resources: upstream chart defaults {} (no doc sizing); tiny-singleton
    # requests pinned for scheduling/QoS, memory-only limit so the sync loop
    # is never CPU-throttled. The webhook sidecar
    # (provider.webhook.resources) is a Go distroless server, sized lighter
    # with a memory-only limit.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    image:
      tag: v0.22.0
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/lazygeniusman/home-ops/projects/external-dns-netbird
          tag: dev # {"$imagepolicy": "infra:external-dns-netbird:tag"}
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 64Mi
        env:
          - name: NETBIRD_PAT_FILE
            value: /secrets/pat
          - name: DOMAIN_FILTER
            value: __BASE_DOMAIN__
        extraVolumeMounts:
          - name: pat
            mountPath: /secrets
            readOnly: true
    extraVolumes:
      - name: pat
        secret:
          secretName: netbird-pat
          items:
            - key: pat
              path: pat
    extraArgs:
      webhook-provider-url: http://localhost:8888
    sources:
      - service
      - ingress
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - crd
    policy: sync
    registry: txt
    txtOwnerId: __TXT_OWNER_NB__
    txtPrefix: extdns-nb-
    domainFilters:
      - __BASE_DOMAIN__
    serviceMonitor:
      enabled: false
