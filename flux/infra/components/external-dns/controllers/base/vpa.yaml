# VPA appliers for the external-dns singleton Deployments (no leader
# election — chart schema caps replicaCount at 1, NO HPA by design):
# updateMode Recreate (modern Auto) — evict-and-recreate is safe because each
# instance is a single stateless sync loop. minReplicas 1: the updater
# default --min-replicas=2 (flags.md) never evicts single-replica targets,
# and no PDB exists here to gate on — without this the CRs would
# recommend-but-never-apply. Release names render Deployments
# `<release>-external-dns` (helm template, verified for the cloudflare
# release: `edns-cf-external-dns` pattern).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-dns-cloudflare
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-dns-cloudflare-external-dns
  updatePolicy:
    updateMode: Recreate
    minReplicas: 1
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-dns-netbird
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-dns-netbird-external-dns
  updatePolicy:
    updateMode: Recreate
    minReplicas: 1
