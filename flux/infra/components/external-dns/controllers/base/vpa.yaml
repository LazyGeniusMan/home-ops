# VPA applier for the external-dns-netbird singleton Deployment (no leader
# election — chart schema caps replicaCount at 1, NO HPA by design):
# updateMode Recreate (modern Auto) — evict-and-recreate is safe because the
# instance is a single stateless sync loop. minReplicas 1: the updater
# default --min-replicas=2 (flags.md) never evicts single-replica targets,
# and no PDB exists here to gate on — without this the CR would
# recommend-but-never-apply. The release name renders Deployment
# `external-dns-netbird-external-dns` (helm template).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-dns-netbird
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-dns-netbird-external-dns
  updatePolicy:
    updateMode: Recreate
    minReplicas: 1
