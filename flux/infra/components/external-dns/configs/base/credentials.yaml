# Provider credentials synced by ESO from Proton Pass (§9.4). Cloudflare token
# needs Zone:Read + DNS:Edit on home-ops.yansyah.my.id; NetBird PAT needs DNS
# zone/record access. Bootstrap the vault values with pass-cli (never commit):
#   pass insert 'acme-prd-bdo1-talos-apps-01/external-dns/cloudflare-api-token'
#   pass insert 'acme-prd-bdo1-talos-apps-01/external-dns/netbird-pat'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: pass://acme-prd-bdo1-talos-apps-01/external-dns/cloudflare-api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-pat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: netbird-pat
    template:
      data:
        pat: "{{ .pat }}"
  data:
    - secretKey: pat
      remoteRef:
        key: pass://acme-prd-bdo1-talos-apps-01/external-dns/netbird-pat
