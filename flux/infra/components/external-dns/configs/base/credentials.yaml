# Provider credential synced by ESO from Proton Pass (§9.4). The NetBird PAT
# needs DNS zone/record access. Bootstrap the vault value with pass-cli
# (never commit):
#   pass insert '__VAULT_CLUSTER__/external-dns/netbird-pat'
# PREREQUISITE (ordering): this ExternalSecret resolves through
# ClusterSecretStore/proton-pass (external-secrets configs/), which itself
# needs the eso-proton-pass webhook Deployment Ready AND the out-of-band
# proton-pass-pat Secret bootstrapped (see the external-secrets README "PAT
# renewal" runbook). Cross-tenant ordering (external-dns configs after
# external-secrets configs) is NOT expressible from this component layer —
# the per-tenant Kustomizations only order configs after controllers WITHIN
# one tenant, and tenants/*.yaml is owned by a parallel task, so do not add
# ordering there. Fresh-cluster behavior is EXPECTED to fail-then-heal:
# this ExternalSecret reports Ready=False until the store is Ready, and the
# controllers/ HelmRelease CrashLoops on the missing netbird-pat Secret
# until ESO syncs it. Both heal via ESO refreshInterval (1h) + Flux
# retryInterval (5m). Alert only if Ready=False persists past ~10m.
# Verify: kubectl get clustersecretstore proton-pass;
# kubectl -n external-dns get externalsecret,secret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-pat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: netbird-pat
    template:
      data:
        pat: "{{ .pat }}"
  data:
    - secretKey: pat
      remoteRef:
        key: __PROTON_PASS_BASE__/external-dns/netbird-pat
