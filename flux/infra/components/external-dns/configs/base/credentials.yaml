# Provider credentials synced by ESO from Proton Pass (§9.4). Cloudflare token
# needs Zone:Read + DNS:Edit on __BASE_DOMAIN__; NetBird PAT needs DNS
# zone/record access. Bootstrap the vault values with pass-cli (never commit):
#   pass insert '__VAULT_CLUSTER__/external-dns/cloudflare-api-token'
#   pass insert '__VAULT_CLUSTER__/external-dns/netbird-pat'
# PREREQUISITE (ordering): these ExternalSecrets resolve through
# ClusterSecretStore/proton-pass (external-secrets configs/), which itself
# needs the eso-proton-pass webhook Deployment Ready AND the out-of-band
# proton-pass-pat Secret bootstrapped (see the external-secrets README "PAT
# renewal" runbook). Cross-tenant ordering (external-dns configs after
# external-secrets configs) is NOT expressible from this component layer —
# the per-tenant Kustomizations only order configs after controllers WITHIN
# one tenant, and tenants/*.yaml is owned by a parallel task, so do not add
# ordering there. Fresh-cluster behavior is EXPECTED to fail-then-heal:
# these ExternalSecrets report Ready=False until the store is Ready, and the
# controllers/ HelmReleases CrashLoop on the missing cloudflare-api-token /
# netbird-pat Secrets until ESO syncs them. Both heal via ESO
# refreshInterval (1h) + Flux retryInterval (5m). Alert only if Ready=False
# persists past ~10m. Verify: kubectl get clustersecretstore proton-pass;
# kubectl -n external-dns get externalsecret,secret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/external-dns/cloudflare-api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-pat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: netbird-pat
    template:
      data:
        pat: "{{ .pat }}"
  data:
    - secretKey: pat
      remoteRef:
        key: __PROTON_PASS_BASE__/external-dns/netbird-pat
