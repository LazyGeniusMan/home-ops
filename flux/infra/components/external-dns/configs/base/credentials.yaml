# Provider credential synced by ESO from Proton Pass (NetBird PAT needs DNS
# zone/record access; seed pass://<cluster>/external-dns/netbird-pat, never
# commit). Resolves through ClusterSecretStore/proton-pass; fresh-cluster
# NotReady heals via ESO refreshInterval (1h) + Flux retryInterval (5m).
# Cross-tenant ordering is owned by tenants/*.yaml. Alert past ~10m.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-pat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: netbird-pat
    template:
      data:
        pat: "{{ .pat }}"
  data:
    - secretKey: pat
      remoteRef:
        key: __PROTON_PASS_BASE__/external-dns/netbird-pat
