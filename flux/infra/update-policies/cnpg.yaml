# cnpg chart policy. Chart 0.29.x embeds operator 1.30.x: floor tracks the chart line, re-verify Chart.yaml on every PR.
# Changelog: https://github.com/cloudnative-pg/charts/releases, https://github.com/cloudnative-pg/cloudnative-pg/releases.
# Coupled: controllers/base/cnpg.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cnpg
spec:
  image: "ghcr.io/cloudnative-pg/charts/cloudnative-pg"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cnpg
spec:
  imageRepositoryRef:
    name: cnpg
  policy:
    semver:
      range: ">=0.29.1"
