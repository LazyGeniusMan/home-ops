# clickhouse chart + server/keeper (26.8 LTS lockstep) policy.
# Changelog: https://github.com/Altinity/clickhouse-operator/releases, https://github.com/ClickHouse/ClickHouse/releases.
# Coupled: configs/base/installation-base.yaml, configs/base/backup-cronjob.yaml, apps clickstack-clickhouse.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: clickhouse
spec:
  image: "registry-1.docker.io/altinity/clickhouse-operator"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: clickhouse
spec:
  imageRepositoryRef:
    name: clickhouse
  policy:
    semver:
      range: ">=0.27.3"
# Server + keeper runtime images (pinned 26.8 LTS line). Markers live on the ClickHouseInstallation pod templates
# (installation-base.yaml + clickstack-clickhouse.yaml) and the nightly
# backup CronJob (backup-cronjob.yaml).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: clickhouse-server
spec:
  image: "clickhouse/clickhouse-server"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: clickhouse-server
spec:
  imageRepositoryRef:
    name: clickhouse-server
  policy:
    semver:
      range: ">=26.8.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: clickhouse-keeper
spec:
  image: "clickhouse/clickhouse-keeper"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: clickhouse-keeper
spec:
  imageRepositoryRef:
    name: clickhouse-keeper
  policy:
    semver:
      range: ">=26.8.0"
