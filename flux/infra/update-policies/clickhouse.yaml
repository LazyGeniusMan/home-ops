# Update policy for the clickhouse component (§10): tracks the OCI Helm chart
# plus the server + keeper runtime images (installation-base.yaml,
# backup-cronjob.yaml, and the clickstack ClickHouseInstallation), and the
# ImageUpdateAutomation (update cluster) opens PRs via markers in
# components/clickhouse (see README). Follows the §7 update-policy contract (ImageRepository + ImagePolicy + $imagepolicy markers).
# Changelog (operator): https://github.com/Altinity/clickhouse-operator/releases.
# Changelog (server/keeper 26.8 LTS lockstep): https://github.com/ClickHouse/ClickHouse/releases.
# Mode: auto (read the server changelog before taking a new LTS — 25.9 went EOL, 26.x crosses breaking changes).
# Coupled files: [configs/base/installation-base.yaml, configs/base/backup-cronjob.yaml, ../../../apps/components/clickstack/base/clickstack-clickhouse.yaml].
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: clickhouse
spec:
  image: "registry-1.docker.io/altinity/clickhouse-operator"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: clickhouse
spec:
  imageRepositoryRef:
    name: clickhouse
  policy:
    semver:
      range: ">=0.27.3"
# Server + keeper runtime images (G5: pinned 25.9 line, tags verified live on
# Docker Hub). Markers live on the ClickHouseInstallation pod templates
# (installation-base.yaml + clickstack-clickhouse.yaml) and the nightly
# backup CronJob (backup-cronjob.yaml).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: clickhouse-server
spec:
  image: "clickhouse/clickhouse-server"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: clickhouse-server
spec:
  imageRepositoryRef:
    name: clickhouse-server
  policy:
    semver:
      range: ">=26.8.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: clickhouse-keeper
spec:
  image: "clickhouse/clickhouse-keeper"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: clickhouse-keeper
spec:
  imageRepositoryRef:
    name: clickhouse-keeper
  policy:
    semver:
      range: ">=26.8.0"
