# cilium chart policy. Minor upgrades need the manual preflight runbook first.
# Changelog: https://github.com/cilium/cilium/releases.
# Coupled: controllers/base/cilium.yaml, gateway-api/crds/base/standard-install.yaml (minor pairing), apps/update-policies/hubble-ui.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cilium
spec:
  image: "quay.io/cilium/charts/cilium"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cilium
spec:
  imageRepositoryRef:
    name: cilium
  policy:
    semver:
      range: ">=1.20.2"
