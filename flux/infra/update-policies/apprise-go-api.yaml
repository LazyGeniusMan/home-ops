# Update policy for the apprise-go-api infra component: tracks the first-party
# apprise-go-api image (stable + semver tag leg published by
# .github/workflows/apprise-go-api.yml), and the ImageUpdateAutomation
# (update cluster) opens PRs via the marker in
# components/apprise-go-api/controllers/base/apprise-go-api.yaml. Follows the
# §7 update-policy contract (ImageRepository + ImagePolicy + $imagepolicy
# markers).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: apprise-go-api
spec:
  image: "ghcr.io/lazygeniusman/home-ops/projects/apprise-go-api"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: apprise-go-api
spec:
  imageRepositoryRef:
    name: apprise-go-api
  policy:
    semver:
      range: ">=0.1.0"
