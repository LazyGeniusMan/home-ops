# apprise-go-api image policy (first-party, tags apprise-go-api-v*).
# Coupled: controllers/base/apprise-go-api.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: apprise-go-api
spec:
  image: "ghcr.io/lazygeniusman/home-ops/projects/apprise-go-api"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: apprise-go-api
spec:
  imageRepositoryRef:
    name: apprise-go-api
  policy:
    semver:
      range: ">=0.1.0"
