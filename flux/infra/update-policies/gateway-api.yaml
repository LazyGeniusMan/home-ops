# gateway-api release policy. Re-vendor the whole standard-install.yaml on every bump.
# Changelog: https://github.com/kubernetes-sigs/gateway-api/releases.
# Coupled: crds/base/standard-install.yaml, cilium/controllers/base/cilium.yaml (minor pairing).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gateway-api
spec:
  image: "sigs.k8s.io/gateway-api"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gateway-api
spec:
  imageRepositoryRef:
    name: gateway-api
  policy:
    semver:
      range: ">=1.6.1"
