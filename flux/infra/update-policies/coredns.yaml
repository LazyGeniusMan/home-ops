# coredns chart + runtime app image + node-cache image policy.
# Changelog: https://github.com/coredns/coredns/releases, https://github.com/coredns/helm/releases.
# Coupled: controllers/base/coredns.yaml, configs/base/node-local-dns.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: coredns
spec:
  image: "ghcr.io/coredns/charts/coredns"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: coredns
spec:
  imageRepositoryRef:
    name: coredns
  policy:
    semver:
      range: ">=1.47.1"
# CoreDNS runtime image (chart default registry; app pinned to 1.14.7 in
# controllers/base/coredns.yaml via the values.image.tag override). Marker
# lives on values.image.tag in controllers/base/coredns.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: coredns-app
spec:
  image: "coredns/coredns"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: coredns-app
spec:
  imageRepositoryRef:
    name: coredns-app
  policy:
    semver:
      range: ">=1.14.7"
# Node-local DNS cache image (G5: pinned 1.26.8, matches upstream
# nodelocaldns.yaml master; requires >= 1.15.16 for the LRP interface/
# iptables knobs). Marker lives on the DaemonSet in
# configs/base/node-local-dns.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: node-cache
spec:
  image: "registry.k8s.io/dns/k8s-dns-node-cache"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: node-cache
spec:
  imageRepositoryRef:
    name: node-cache
  policy:
    semver:
      range: ">=1.26.0"
