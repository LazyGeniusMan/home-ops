# local-path-provisioner chart policy.
# Changelog: https://github.com/rancher/local-path-provisioner/releases.
# Coupled: controllers/base/local-path-provisioner.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: local-path-provisioner
spec:
  image: "ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: local-path-provisioner
spec:
  imageRepositoryRef:
    name: local-path-provisioner
  policy:
    semver:
      range: ">=0.0.37"
