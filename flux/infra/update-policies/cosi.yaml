# cosi controller image policy (driver + sidecar policies in seaweedfs.yaml). Capped <0.3.0 (v1alpha2 breaking for the driver); bump all three caps together.
# Changelog: kubernetes-sigs/container-object-storage-interface.
# Coupled: controllers/base/deployment.yaml, crds/base/objectstorage*.yaml (5, re-vendor together).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cosi-controller
spec:
  image: "gcr.io/k8s-staging-sig-storage/objectstorage-controller"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cosi-controller
spec:
  imageRepositoryRef:
    name: cosi-controller
  policy:
    semver:
      range: ">=0.2.2 <0.3.0"
