# Update policy for the cosi component: tracks the COSI central controller
# image. The ImageUpdateAutomation (update cluster) opens PRs via
# $imagepolicy markers in components/cosi (see README). Follows the §7
# update-policy contract (ImageRepository + ImagePolicy + $imagepolicy
# markers).
#
# The SeaweedFS COSI driver + its sidecar moved to the seaweedfs component
# (configs/base/driver.yaml) — their policies live in seaweedfs.yaml now.
#
# COSI note: release-0.2 is now tagged (v0.2.2 on
# gcr.io/k8s-staging-sig-storage — no registry.k8s.io promotion yet), so the
# controller pin tracks the v0.2.x semver tag. The range is capped <0.3.0:
# main-line v1alpha2 (breaking, incompatible with the SeaweedFS driver)
# versions above v0.2.x, so automation must never PR past the v0.2 line.
# Bump pins + all three caps (here + seaweedfs.yaml sidecar/driver) together.
# Changelog: https://github.com/kubernetes-sigs/container-object-storage-interface/releases.
# Mode: auto (capped <0.3.0 — main-line v1alpha2 is breaking for the SeaweedFS driver).
# Coupled files: [controllers/base/deployment.yaml, crds/base/objectstorage.k8s.io_*.yaml (5 files, re-vendor together), ../seaweedfs.yaml (sidecar/driver caps move together)].
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cosi-controller
spec:
  image: "gcr.io/k8s-staging-sig-storage/objectstorage-controller"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cosi-controller
spec:
  imageRepositoryRef:
    name: cosi-controller
  policy:
    semver:
      range: ">=0.2.2 <0.3.0"
