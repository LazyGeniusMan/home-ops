# cert-manager chart policy.
# Changelog: https://github.com/cert-manager/cert-manager/releases.
# Coupled: controllers/base/cert-manager.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cert-manager
spec:
  image: "quay.io/jetstack/charts/cert-manager"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cert-manager
spec:
  imageRepositoryRef:
    name: cert-manager
  policy:
    semver:
      range: ">=1.21.2"
