# Update policy for the external-secrets component (§9): tracks the OCI Helm chart, and the
# ImageUpdateAutomation (update cluster) opens PRs via markers in
# components/external-secrets (see README). Follows the §7 update-policy contract (ImageRepository + ImagePolicy + $imagepolicy markers).
# Webhook policy tracks the :dev stream configs/base pins (intentional
# single-stream; promotion to :stable on the first eso-proton-pass-v* release).
# Changelog: chart — https://github.com/external-secrets/external-secrets/releases.
# Changelog: webhook, in-repo — projects/eso-proton-pass.
# Mode: auto (chart) + auto single-stream :dev (webhook).
# Coupled files: [controllers/base/externalsecrets.yaml, configs/base/eso-proton-pass-webhook.yaml].
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: external-secrets
spec:
  image: "ghcr.io/external-secrets/charts/external-secrets"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: external-secrets
spec:
  imageRepositoryRef:
    name: external-secrets
  policy:
    semver:
      range: ">=2.11.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: eso-proton-pass
spec:
  image: "ghcr.io/lazygeniusman/home-ops/projects/eso-proton-pass"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: eso-proton-pass
spec:
  imageRepositoryRef:
    name: eso-proton-pass
  policy:
    semver:
      range: ">=0.0.0"
