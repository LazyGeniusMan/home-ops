# Update policy for the external-secrets component (§9): tracks the OCI Helm chart, and the
# ImageUpdateAutomation (update cluster) opens PRs via markers in
# components/external-secrets (see README). Follows the §7 update-policy contract (ImageRepository + ImagePolicy + $imagepolicy markers).
# Image-stream alignment: the infra:eso-proton-pass policy tracks the :dev
# stream that configs/base pins (intentional single-stream — see the note in
# configs/base/eso-proton-pass-webhook.yaml). Scoping prd to :latest stays
# deferred until the first eso-proton-pass-v* tagged release exists.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: external-secrets
spec:
  image: "ghcr.io/external-secrets/charts/external-secrets"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: external-secrets
spec:
  imageRepositoryRef:
    name: external-secrets
  policy:
    semver:
      range: ">=2.10.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: eso-proton-pass
spec:
  image: "ghcr.io/lazygeniusman/home-ops/projects/eso-proton-pass"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: eso-proton-pass
spec:
  imageRepositoryRef:
    name: eso-proton-pass
  policy:
    semver:
      range: ">=0.0.0"
