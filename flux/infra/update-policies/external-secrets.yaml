# external-secrets chart + webhook (:dev single-stream) policy.
# Changelog: https://github.com/external-secrets/external-secrets/releases (webhook in-repo).
# Coupled: controllers/base/externalsecrets.yaml, configs/base/eso-proton-pass-webhook.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: external-secrets
spec:
  image: "ghcr.io/external-secrets/charts/external-secrets"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: external-secrets
spec:
  imageRepositoryRef:
    name: external-secrets
  policy:
    semver:
      range: ">=2.11.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: eso-proton-pass
spec:
  image: "ghcr.io/lazygeniusman/home-ops/projects/eso-proton-pass"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: eso-proton-pass
spec:
  imageRepositoryRef:
    name: eso-proton-pass
  policy:
    semver:
      range: ">=0.0.0"
