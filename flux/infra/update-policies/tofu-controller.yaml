# tofu-controller chart policy. Chart == app: on bumps set chart tag + image.tag + runner.image.tag together.
# Changelog: https://github.com/flux-iac/tofu-controller/releases.
# Coupled: controllers/base/tofu-controller.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tofu-controller
spec:
  image: "ghcr.io/flux-iac/charts/tofu-controller"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tofu-controller
spec:
  imageRepositoryRef:
    name: tofu-controller
  policy:
    semver:
      range: ">=0.16.5"
