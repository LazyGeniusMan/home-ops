# Update policy for the tofu-controller component: tracks the OCI Helm chart, and the
# ImageUpdateAutomation (update cluster) opens PRs via markers in
# components/tofu-controller (see README). Follows the §7 update-policy contract (ImageRepository + ImagePolicy + $imagepolicy markers).
# Chart-to-app lockstep: chart 0.16.5 == app v0.16.5, but the app images are
# pinned separately (image.tag + runner.image.tag) — the semver floor below is
# the CHART version; on bumps set the chart tag AND both image tags together.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tofu-controller
spec:
  image: "ghcr.io/flux-iac/charts/tofu-controller"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tofu-controller
spec:
  imageRepositoryRef:
    name: tofu-controller
  policy:
    semver:
      range: ">=0.16.5"
