# metrics-server chart policy.
# Changelog: https://github.com/kubernetes-sigs/metrics-server/releases.
# Coupled: controllers/base/metrics-server.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: metrics-server
spec:
  image: "ghcr.io/controlplaneio-fluxcd/charts/metrics-server"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: metrics-server
spec:
  imageRepositoryRef:
    name: metrics-server
  policy:
    semver:
      range: ">=3.14.0"
