# kubevirt release policy. N-1 -> N only; operator roll is the upgrade (CR sets no imageTag).
# Changelog: https://github.com/kubevirt/kubevirt/releases.
# Coupled: controllers/base/kubevirt-operator.yaml, configs/base/kubevirt-cr.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: kubevirt
spec:
  image: "quay.io/kubevirt/virt-operator"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: kubevirt
spec:
  imageRepositoryRef:
    name: kubevirt
  policy:
    semver:
      range: ">=1.9.0"
