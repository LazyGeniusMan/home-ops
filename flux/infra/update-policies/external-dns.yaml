# external-dns chart + webhook sidecar (:dev single-stream) policy.
# Changelog: https://github.com/kubernetes-sigs/external-dns/releases (sidecar in-repo).
# Coupled: controllers/base/external-dns.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: external-dns
spec:
  image: "ghcr.io/controlplaneio-fluxcd/charts/external-dns"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: external-dns
spec:
  imageRepositoryRef:
    name: external-dns
  policy:
    semver:
      range: ">=1.22.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: external-dns-netbird
spec:
  image: "ghcr.io/lazygeniusman/home-ops/projects/external-dns-netbird"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: external-dns-netbird
spec:
  imageRepositoryRef:
    name: external-dns-netbird
  policy:
    semver:
      range: ">=0.0.0"
