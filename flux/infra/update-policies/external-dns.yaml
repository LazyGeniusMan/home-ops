# Update policy for the external-dns component (§9): tracks the OCI Helm chart, and the
# ImageUpdateAutomation (update cluster) opens PRs via markers in
# components/external-dns (see README). Follows the §7 update-policy contract (ImageRepository + ImagePolicy + $imagepolicy markers).
# Image-stream alignment (G5 decision, recorded): the
# infra:external-dns-netbird policy tracks the :dev stream that
# controllers/base pins (intentional single-stream — see the decision note in
# controllers/base/external-dns.yaml: prd-on-dev risk accepted, promotion to
# :stable triggered by the first external-dns-netbird-v* tagged release).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: external-dns
spec:
  image: "ghcr.io/controlplaneio-fluxcd/charts/external-dns"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: external-dns
spec:
  imageRepositoryRef:
    name: external-dns
  policy:
    semver:
      range: ">=1.22.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: external-dns-netbird
spec:
  image: "ghcr.io/lazygeniusman/home-ops/projects/external-dns-netbird"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: external-dns-netbird
spec:
  imageRepositoryRef:
    name: external-dns-netbird
  policy:
    semver:
      range: ">=0.0.0"
