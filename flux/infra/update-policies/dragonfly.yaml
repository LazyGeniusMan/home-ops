# dragonfly chart policy. Chart v1.6.x == operator v1.6.x, no mapping to re-verify.
# Changelog: https://github.com/dragonflydb/dragonfly-operator/releases.
# Coupled: controllers/base/dragonfly.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: dragonfly
spec:
  image: "ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: dragonfly
spec:
  imageRepositoryRef:
    name: dragonfly
  policy:
    semver:
      range: ">=1.6.1"
