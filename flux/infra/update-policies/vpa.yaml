# vpa chart policy. Feed polls the recommender app image while the range pins the chart line, so chart bumps move by hand via the marker.
# Changelog: https://github.com/kubernetes/autoscaler/releases.
# Coupled: controllers/base/vpa.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vpa
spec:
  image: "registry.k8s.io/autoscaling/vpa-recommender"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vpa
spec:
  imageRepositoryRef:
    name: vpa
  policy:
    semver:
      range: ">=0.12.0 <0.13.0"
