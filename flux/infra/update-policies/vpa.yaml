# Update policy for the vpa component (§9.x): tracks the official upstream
# vertical-pod-autoscaler chart, and the ImageUpdateAutomation (update
# cluster) opens PRs via markers in components/vpa (see README). No OCI
# chart mirror exists upstream, so the HelmRelease pins the classic-repo
# chart (https://kubernetes.github.io/autoscaler) and this feed is nominal:
# it polls the recommender app image (tags are app versions like 1.7.1)
# while the range pins the 0.12.x chart line, so no tag ever matches and
# chart bumps stay manual via the $imagepolicy marker (same stance as the
# retired fairwinds-stable/vpa feed). Follows the §7 update-policy contract
# (ImageRepository + ImagePolicy + $imagepolicy markers).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vpa
spec:
  image: "registry.k8s.io/autoscaling/vpa-recommender"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vpa
spec:
  imageRepositoryRef:
    name: vpa
  policy:
    semver:
      range: ">=0.12.0 <0.13.0"
