# zitadel chart policy. Chart 10.0.4 embeds app v4.15.3, app pinned to v4.18.0: on bumps set chart tag + both image tags together.
# Changelog: https://github.com/zitadel/zitadel-charts/releases, https://github.com/zitadel/zitadel/releases.
# Coupled: controllers/base/zitadel.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: zitadel
spec:
  image: "ghcr.io/zitadel/zitadel-charts/zitadel"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: zitadel
spec:
  imageRepositoryRef:
    name: zitadel
  policy:
    semver:
      range: ">=10.0.4"
