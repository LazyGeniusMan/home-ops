# Update policy for the multus component (§13.1): tracks the upstream Multus
# release, and the ImageUpdateAutomation (update cluster) opens PRs via markers
# in components/multus (see README). Follows the §7 update-policy contract
# (ImageRepository + ImagePolicy + $imagepolicy markers).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: multus
spec:
  image: "ghcr.io/k8snetworkplumbingwg/multus-cni"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: multus
spec:
  imageRepositoryRef:
    name: multus
  policy:
    semver:
      range: ">=4.3.0"
