# multus release policy. Daemon + initContainer pins move together.
# Changelog: https://github.com/k8snetworkplumbingwg/multus-cni/releases.
# Coupled: controllers/base/multus-daemonset.yaml, configs/base/lan-dhcp.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: multus
spec:
  image: "ghcr.io/k8snetworkplumbingwg/multus-cni"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: multus
spec:
  imageRepositoryRef:
    name: multus
  policy:
    semver:
      range: ">=4.3.0"
