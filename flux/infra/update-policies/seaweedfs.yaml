# seaweedfs images policy. Charts hand-bump (operator 0.1.40 + CSI 0.2.36); only image tags automate.
# Changelog: https://github.com/seaweedfs/seaweedfs/releases (ui-auth: oauth2-proxy chart + image).
# Coupled: controllers/base/seaweedfs.yaml, configs/base/cluster.yaml, configs/base/driver.yaml, configs/base/ui-auth.yaml, cosi.yaml (caps move together).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: seaweedfs
spec:
  image: "chrislusf/seaweedfs"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seaweedfs
spec:
  imageRepositoryRef:
    name: seaweedfs
  policy:
    semver:
      range: ">=4.47"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: seaweedfs-csi
spec:
  image: "chrislusf/seaweedfs-csi-driver"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seaweedfs-csi
spec:
  imageRepositoryRef:
    name: seaweedfs-csi
  policy:
    semver:
      range: ">=1.4.32"
# COSI driver + sidecar (markers in configs/base/driver.yaml). Caps move together with cosi.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cosi-sidecar
spec:
  image: "gcr.io/k8s-staging-sig-storage/objectstorage-sidecar"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cosi-sidecar
spec:
  imageRepositoryRef:
    name: cosi-sidecar
  policy:
    semver:
      range: ">=0.2.2 <0.3.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cosi-driver
spec:
  image: "ghcr.io/seaweedfs/seaweedfs-cosi-driver"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cosi-driver
spec:
  imageRepositoryRef:
    name: cosi-driver
  policy:
    semver:
      range: ">=0.3.1 <0.4.0"
# Filer-UI auth proxy (markers in configs/base/ui-auth.yaml; own infra: markers, not the apps: markers).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: seaweedfs-ui-auth
spec:
  image: "quay.io/oauth2-proxy/oauth2-proxy"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seaweedfs-ui-auth
spec:
  imageRepositoryRef:
    name: seaweedfs-ui-auth
  policy:
    semver:
      range: ">=7.15.4"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: seaweedfs-ui-auth-chart
spec:
  image: "ghcr.io/oauth2-proxy/charts/oauth2-proxy"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seaweedfs-ui-auth-chart
spec:
  imageRepositoryRef:
    name: seaweedfs-ui-auth-chart
  policy:
    semver:
      range: ">=10.7.0"
