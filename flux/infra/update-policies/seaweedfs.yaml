# Update policy for the seaweedfs component (§12.1): tracks the Enterprise + CSI
# container images, and the ImageUpdateAutomation (update cluster) opens PRs via
# markers in components/seaweedfs (see README). Chart versions are pinned in the
# HelmReleases (classic HelmRepository — no OCI index exists upstream), so only
# image tags automate here. Follows the §7 update-policy contract (ImageRepository + ImagePolicy + $imagepolicy markers).
# Changelog: server/driver/CSI — https://github.com/seaweedfs/seaweedfs/releases.
# Mode: manual (operator chart 0.1.40 + CSI chart 0.2.36 `version:` hand-bumps — no OCI upstream) + auto (images; sidecar/driver caps <0.3.0 move together with cosi.yaml).
# Coupled files: [controllers/base/seaweedfs.yaml (both chart `version:` pins), configs/base/cluster.yaml, configs/base/driver.yaml (sidecar/driver pins + markers), ../cosi.yaml (controller cap moves together)].
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: seaweedfs
spec:
  image: "chrislusf/seaweedfs"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seaweedfs
spec:
  imageRepositoryRef:
    name: seaweedfs
  policy:
    semver:
      range: ">=4.47"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: seaweedfs-csi
spec:
  image: "chrislusf/seaweedfs-csi-driver"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seaweedfs-csi
spec:
  imageRepositoryRef:
    name: seaweedfs-csi
  policy:
    semver:
      range: ">=1.4.32"
# SeaweedFS COSI driver + sidecar (moved here from cosi.yaml with the driver
# move — markers live in components/seaweedfs/configs/base/driver.yaml).
# Sidecar tracks the k8s-staging repo v0.2.x tags (no registry.k8s.io
# promotion for v0.2.2 yet); driver tracks ghcr.io semver >=0.3.1. Both
# ranges are capped <0.3.0 alongside the controller (cosi.yaml): main-line
# v1alpha2 (breaking, incompatible with this driver) versions above v0.2.x,
# so automation must never PR past the v0.2 line. Bump pins + all three
# caps together.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cosi-sidecar
spec:
  image: "gcr.io/k8s-staging-sig-storage/objectstorage-sidecar"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cosi-sidecar
spec:
  imageRepositoryRef:
    name: cosi-sidecar
  policy:
    semver:
      range: ">=0.2.2 <0.3.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cosi-driver
spec:
  image: "ghcr.io/seaweedfs/seaweedfs-cosi-driver"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cosi-driver
spec:
  imageRepositoryRef:
    name: cosi-driver
  policy:
    semver:
      range: ">=0.3.1 <0.4.0"
