# Shared per-component infra OCI delivery logic (main -> tag latest).
# Called by the root wiring workflow .github/workflows/flux-infra-push.yaml
# (via `uses: ./flux/infra/.github/actions/oci-push`) and by the area-local
# flux/infra/.github/workflows/push.yaml. Unchanged components are no-ops
# (push action only pushes on diff). Step-level composite action: the
# documented pattern for sharing local logic, since GitHub only executes
# reusable workflows placed directly under .github/workflows/.
# To onboard a component (§§8-14): add its directory name to the components
# input in both callers AND add a matching tenant in
# ../../fleet/tenants/infra.yaml.
# On the per-area repo split this directory moves with flux/infra and callers
# switch to <new-repo>/.github/workflows/push.yaml@<ref> (workflow_call).
name: infra-oci-push
description: Push one infra component OCI artifact and sign it with cosign.

inputs:
  component:
    description: 'Component directory under flux/infra/components (monorepo) or components (split repo)'
    required: true
  repository-prefix:
    description: 'OCI repository prefix, e.g. ghcr.io/<owner>/home-ops/infra'
    required: true
  source-prefix:
    description: 'Artifact source directory prefix, relative to the repository root'
    required: false
    default: 'components'
  diff-tag:
    description: 'Diff tag for the push (e.g. latest)'
    required: true
  github-token:
    description: 'Token used for GHCR login'
    required: true

runs:
  using: composite
  steps:
    - name: Install flux
      uses: controlplaneio-fluxcd/distribution/actions/setup@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - name: Push artifact
      uses: controlplaneio-fluxcd/distribution/actions/push@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
      id: push
      with:
        repository: ${{ inputs.repository-prefix }}/${{ inputs.component }}
        path: ${{ inputs.source-prefix }}/${{ inputs.component }}
        diff-tag: ${{ inputs.diff-tag }}
    - name: Sign artifact
      if: steps.push.outputs.pushed == 'true'
      shell: bash
      run: cosign sign --yes $DIGEST_URL
      env:
        DIGEST_URL: ${{ steps.push.outputs.digest-url }}
