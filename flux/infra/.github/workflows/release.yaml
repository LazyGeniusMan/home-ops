# Canonical infra area releases: tag flux-infra-vX.Y.Z to publish every matrix
# component as oci://ghcr.io/<owner>/home-ops/infra/<component> with tags
# stable + stable-X.Y.Z (version stripped from the git ref). The prd cluster verifies this workflow
# + tag via the cosign subject pinned in ../../fleet/tenants/infra.yaml
# (refs/tags/flux-infra-v\d+\.\d+\.\d+).
# Split-ready layout: paths assume the area directory is the repository root.
# After the per-area repo split this file executes as-is (callable via
# workflow_call); until then GitHub only executes the root wiring file
# .github/workflows/flux-infra-release.yaml, which calls the same shared logic
# in ../actions/oci-release with monorepo-relative paths.
name: release-artifact

# OCI: oci://ghcr.io/<owner>/home-ops/infra/<component>:stable + stable-<version>.

on:
  workflow_call:
    inputs:
      repository-prefix:
        description: 'OCI repository prefix'
        required: false
        type: string
        default: ''
      source-prefix:
        description: 'Artifact source directory prefix, relative to the repository root'
        required: false
        type: string
        default: 'components'
  push:
    tags:
      - 'flux-infra-v*'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - cilium
          - coredns
          - gateway-api
          - external-secrets
          - metrics-server
          - cert-manager
          - external-dns
          - local-path-provisioner
          - cnpg
          - clickhouse
          - dragonfly
          - seaweedfs
          - multus
          - kubevirt
          - zitadel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish component release
        uses: ./.github/actions/oci-release
        with:
          component: ${{ matrix.component }}
          repository-prefix: ${{ inputs.repository-prefix || format('ghcr.io/{0}/infra', github.repository) }}
          source-prefix: ${{ inputs.source-prefix || 'components' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
