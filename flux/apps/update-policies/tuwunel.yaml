# tuwunel image policy (auto; singleton Recreate — snapshot/export before major bumps; server_name immutable).
# Changelog: https://github.com/matrix-construct/tuwunel/releases. Coupled: components/matrix/base/tuwunel.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tuwunel
spec:
  image: "ghcr.io/matrix-construct/tuwunel"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tuwunel
spec:
  imageRepositoryRef:
    name: tuwunel
  policy:
    semver:
      range: ">=1.9.2"
