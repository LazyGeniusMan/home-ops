# Update policy for the flux-operator-ui component: tracks the Flux Operator
# OCI chart (same chart+version as bootstrap — bump the chart tag here AND
# operator_chart_version in flux/fleet/terraform/versions.yaml together).
# Never touches fleet sync (serverOnly + installCRDs: false).
# Changelog: controlplaneio-fluxcd/flux-operator releases.
# Changelog: oauth2-proxy chart + image — manifests releases (chart) + oauth2-proxy releases (image, shared marker).
# Mode: auto (proxy chart marker apps:oauth2-proxy-chart and image marker apps:oauth2-proxy shared with clickstack + hubble-ui — bump together).
# Coupled files: [components/flux-operator-ui/base/flux-operator-ui.yaml, base/oauth2-proxy.yaml, ../../../fleet/terraform/versions.yaml].
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: flux-operator-ui
spec:
  image: "ghcr.io/controlplaneio-fluxcd/charts/flux-operator"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: flux-operator-ui
spec:
  imageRepositoryRef:
    name: flux-operator-ui
  policy:
    semver:
      range: ">=0.60.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: oauth2-proxy
spec:
  image: "quay.io/oauth2-proxy/oauth2-proxy"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: oauth2-proxy
spec:
  imageRepositoryRef:
    name: oauth2-proxy
  policy:
    semver:
      range: ">=7.15.4"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: oauth2-proxy-chart
spec:
  image: "ghcr.io/oauth2-proxy/charts/oauth2-proxy"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: oauth2-proxy-chart
spec:
  imageRepositoryRef:
    name: oauth2-proxy-chart
  policy:
    semver:
      range: ">=10.7.0"
