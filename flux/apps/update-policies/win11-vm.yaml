# win11-vm staged ISO policy (static; manual ISO refresh, marker anchors the staged source; record bumps in the README).
# No public changelog (licensed Microsoft ISO on local infra). Coupled: components/win11-vm/base/win11-vm.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: win11-vm
spec:
  image: "files.home-ops.yansyah.my.id/iso/win11"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: win11-vm
spec:
  imageRepositoryRef:
    name: win11-vm
  policy:
    semver:
      range: ">=24H2"
