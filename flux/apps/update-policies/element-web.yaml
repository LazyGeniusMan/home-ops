# element-web image policy (auto; stateless SPA — safe to roll).
# Changelog: https://github.com/element-hq/element-web/releases. Coupled: components/matrix/base/element-web.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: element-web
spec:
  image: "vectorim/element-web"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: element-web
spec:
  imageRepositoryRef:
    name: element-web
  policy:
    semver:
      range: ">=1.12.29"
