# Update policy for the hubble-ui app: tracks the Hubble UI images (pins follow
# the Cilium chart defaults).
# Changelog: cilium/cilium releases.
# Changelog: oauth2-proxy chart + image — manifests releases (chart) + oauth2-proxy releases (image, shared marker).
# Mode: auto (frontend+backend move together; check the new Cilium chart defaults on every Cilium minor; proxy markers shared with clickstack + flux-operator-ui — bump together).
# Coupled files: [components/hubble-ui/base/hubble-ui.yaml, base/oauth2-proxy.yaml, ../../infra/update-policies/cilium.yaml].
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: hubble-ui
spec:
  image: "quay.io/cilium/hubble-ui"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: hubble-ui
spec:
  imageRepositoryRef:
    name: hubble-ui
  policy:
    semver:
      range: ">=0.13.6"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: hubble-ui-backend
spec:
  image: "quay.io/cilium/hubble-ui-backend"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: hubble-ui-backend
spec:
  imageRepositoryRef:
    name: hubble-ui-backend
  policy:
    semver:
      range: ">=0.13.6"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: oauth2-proxy
spec:
  image: "quay.io/oauth2-proxy/oauth2-proxy"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: oauth2-proxy
spec:
  imageRepositoryRef:
    name: oauth2-proxy
  policy:
    semver:
      range: ">=7.15.4"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: oauth2-proxy-chart
spec:
  image: "ghcr.io/oauth2-proxy/charts/oauth2-proxy"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: oauth2-proxy-chart
spec:
  imageRepositoryRef:
    name: oauth2-proxy-chart
  policy:
    semver:
      range: ">=10.7.0"
