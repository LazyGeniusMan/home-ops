# Update policy for clickstack: HyperDX app + collector (hdx-oss-v2 appVersion
# line), FerretDB, locked oauth2-proxy line (markers shared with hubble-ui +
# flux-operator-ui — bump together). Automation opens PRs via markers in
# components/clickstack. Mode: auto.
# Changelog: hyperdxio/hyperdx, FerretDB/FerretDB, oauth2-proxy/manifests (chart),
# oauth2-proxy/oauth2-proxy (image) releases.
# Coupled: [base/clickstack.yaml, base/ferretdb.yaml, base/oauth2-proxy.yaml,
# base/clickstack-clickhouse.yaml (server line follows the infra clickhouse policy)].
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: hyperdx
spec:
  image: "docker.hyperdx.io/hyperdx/hyperdx"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: hyperdx
spec:
  imageRepositoryRef:
    name: hyperdx
  policy:
    semver:
      range: ">=2.7.1"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: hyperdx-otel-collector
spec:
  image: "docker.hyperdx.io/hyperdx/hyperdx-otel-collector"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: hyperdx-otel-collector
spec:
  imageRepositoryRef:
    name: hyperdx-otel-collector
  policy:
    semver:
      range: ">=2.7.1"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: ferretdb
spec:
  image: "ghcr.io/ferretdb/ferretdb"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ferretdb
spec:
  imageRepositoryRef:
    name: ferretdb
  policy:
    semver:
      range: ">=2.7.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: oauth2-proxy
spec:
  image: "quay.io/oauth2-proxy/oauth2-proxy"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: oauth2-proxy
spec:
  imageRepositoryRef:
    name: oauth2-proxy
  policy:
    semver:
      range: ">=7.15.4"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: oauth2-proxy-chart
spec:
  image: "ghcr.io/oauth2-proxy/charts/oauth2-proxy"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: oauth2-proxy-chart
spec:
  imageRepositoryRef:
    name: oauth2-proxy-chart
  policy:
    semver:
      range: ">=10.7.0"
