# talos-vm nocloud ISO policy (auto; stays aligned to talos/ansible/group_vars/all.yml — refresh together).
# Changelog: https://github.com/siderolabs/talos/releases. Coupled: components/talos-vm/base/talos-vm.yaml.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: talos-vm
spec:
  image: "factory.talos.dev/image/nocloud/amd64"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: talos-vm
spec:
  imageRepositoryRef:
    name: talos-vm
  policy:
    semver:
      range: ">=1.14.0"
