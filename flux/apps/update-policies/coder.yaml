# Update policy for coder: OCI chart + app image (chart<->app lockstep — bump
# both together, never one side alone). Automation opens PRs via markers in
# components/coder.
# Changelog: app+chart — https://github.com/coder/coder/releases.
# Mode: auto. Coupled: [components/coder/base/coder.yaml (chart + image tags),
# base/coder-db.yaml (snapshot before major bumps)].
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: coder
spec:
  image: "ghcr.io/coder/coder"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: coder
spec:
  imageRepositoryRef:
    name: coder
  policy:
    semver:
      range: ">=2.37.3"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: coder-chart
spec:
  image: "ghcr.io/coder/chart/coder"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: coder-chart
spec:
  imageRepositoryRef:
    name: coder-chart
  policy:
    semver:
      range: ">=2.37.3"
