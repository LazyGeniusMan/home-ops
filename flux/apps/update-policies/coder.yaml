# Update policy for the coder component (§13.6): tracks the OCI Helm chart plus
# the Coder app container image (chart<->app lockstep — chart 2.37.3 embeds
# app v2.37.3), and the ImageUpdateAutomation (update cluster) opens PRs via
# the markers in components/coder (see README). Follows the §7 update-policy contract (ImageRepository + ImagePolicy + $imagepolicy markers).
# Changelog: app+chart — https://github.com/coder/coder/releases.
# Mode: auto (chart tag + app image tag move together — bump both, never one side alone).
# Coupled files: [components/coder/base/coder.yaml (chart tag + image tag), base/coder-db.yaml (CNPG — snapshot before major bumps)].
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: coder
spec:
  image: "ghcr.io/coder/coder"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: coder
spec:
  imageRepositoryRef:
    name: coder
  policy:
    semver:
      range: ">=2.37.3"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: coder-chart
spec:
  image: "ghcr.io/coder/chart/coder"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: coder-chart
spec:
  imageRepositoryRef:
    name: coder-chart
  policy:
    semver:
      range: ">=2.37.3"
