# Placeholder update policy skeleton (§7 base). Each real app (§§8-14) gets
# its own policy file here: an ImageRepository + ImagePolicy pair whose marker
# is referenced from the app's Helm chart version field via a
# {"$imagepolicy": "<area>:<name>:tag"} setter comment consumed by the update
# cluster's ImageUpdateAutomation (flux/fleet/clusters/update/automation.yaml).
# Removed with the placeholder component when the first real one lands.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: placeholder
spec:
  image: "oci://ghcr.io/lazygeniusman/home-ops/charts/placeholder"
  interval: 10m
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: placeholder
spec:
  imageRepositoryRef:
    name: placeholder
  policy:
    semver:
      range: ">=0.1.0"
