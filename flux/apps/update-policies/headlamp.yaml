# Update policy for the headlamp component: tracks the headlamp image (and, by
# lockstep, the chart — chart 0.45.0 carries app 0.45.0). Plugin pins
# (ai-assistant, flux, kubevirt in configContent) are hand-bumped in the same PR.
# Changelog: headlamp-k8s/headlamp releases (plugins via the ArtifactHub links in the README).
# Mode: auto (image) + manual same-PR (`ref.tag` to match + plugin pins).
# Coupled files: [components/headlamp/base/headlamp.yaml].
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: headlamp
spec:
  image: "ghcr.io/headlamp-k8s/headlamp"
  interval: 12h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: headlamp
spec:
  imageRepositoryRef:
    name: headlamp
  policy:
    semver:
      range: ">=0.45.0"
