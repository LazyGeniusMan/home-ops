# Canonical apps validation.
# Canonical definition: the root wiring file .github/workflows/flux-apps-validate.yaml
# mirrors this job (both run ./flux/scripts/validate.sh -d flux/apps from the repo root).
name: validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ 'main' ]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
      - name: Validate manifests
        run: ./flux/scripts/validate.sh -d flux/apps
