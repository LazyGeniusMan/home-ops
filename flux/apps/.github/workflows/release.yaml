# Canonical apps area releases: tag apps-vX.Y.Z to publish every matrix
# component as oci://ghcr.io/<owner>/home-ops/apps/<component> with diff-tag
# apps-vX.Y.Z and move latest-stable. The home cluster verifies this workflow
# + tag via the cosign subject pinned in ../../fleet/tenants/apps.yaml
# (refs/tags/apps-v\d+\.\d+\.\d+).
# Canonical definition: the root wiring file .github/workflows/flux-apps-release.yaml
# mirrors this job.
name: release-artifact

# OCI: oci://ghcr.io/<owner>/home-ops/apps/<component>:<apps-vX.Y.Z> + latest-stable.

on:
  push:
    tags:
      - 'apps-v*'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - rclone
          - win11-vm
          - talos-vm
          - clickstack
          - hubble-ui
          - flux-operator-ui
          - headlamp
          - coder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push artifact
        uses: controlplaneio-fluxcd/distribution/actions/push@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
        id: push
        with:
          repository: ghcr.io/${{ github.repository }}/apps/${{ matrix.component }}
          path: "./components/${{ matrix.component }}"
          diff-tag: ${{ github.ref_name }}
          tags: latest-stable
      - name: Sign artifact
        if: steps.push.outputs.pushed == 'true'
        run: cosign sign --yes $DIGEST_URL
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
