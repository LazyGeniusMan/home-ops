# Canonical apps area releases: tag flux-cluster-vX.Y.Z to publish every matrix
# component as oci://ghcr.io/<owner>/home-ops/apps/<component> with diff-tag
# flux-cluster-vX.Y.Z and move latest-stable. The home cluster verifies this workflow
# + tag via the cosign subject pinned in ../../fleet/tenants/apps.yaml
# (refs/tags/flux-cluster-v\d+\.\d+\.\d+).
# Split-ready layout: paths assume the area directory is the repository root.
# After the per-area repo split this file executes as-is (callable via
# workflow_call); until then GitHub only executes the root wiring file
# .github/workflows/flux-apps-release.yaml, which calls the same shared logic
# in ../actions/oci-release with monorepo-relative paths.
name: release-artifact

# OCI: oci://ghcr.io/<owner>/home-ops/apps/<component>:<flux-cluster-vX.Y.Z> + latest-stable.

on:
  workflow_call:
    inputs:
      repository-prefix:
        description: 'OCI repository prefix'
        required: false
        type: string
        default: ''
      source-prefix:
        description: 'Artifact source directory prefix, relative to the repository root'
        required: false
        type: string
        default: 'components'
      diff-tag:
        description: 'Diff tag for the push (the release tag)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'flux-cluster-v*'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - rclone
          - win11-vm
          - talos-vm
          - clickstack
          - hubble-ui
          - flux-operator-ui
          - headlamp
          - coder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish component release
        uses: ./.github/actions/oci-release
        with:
          component: ${{ matrix.component }}
          repository-prefix: ${{ inputs.repository-prefix || format('ghcr.io/{0}/apps', github.repository) }}
          source-prefix: ${{ inputs.source-prefix || 'components' }}
          diff-tag: ${{ inputs.diff-tag || github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
