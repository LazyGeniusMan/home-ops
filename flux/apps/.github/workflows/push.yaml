# Canonical per-component apps OCI delivery (main -> tag latest).
# Split-ready layout: paths assume the area directory is the repository root.
# After the per-area repo split this file executes as-is (callable via
# workflow_call); until then GitHub only executes the root wiring file
# .github/workflows/flux-apps-push.yaml, which calls the same shared logic
# in ../actions/oci-push with monorepo-relative paths.
# To onboard an app (§§8-14): add its directory name to the components input
# here AND in the root wiring file AND add a matching tenant input in
# ../../fleet/tenants/apps.yaml.
# Unchanged components are no-ops (push action only pushes on diff).
name: push-artifact

# OCI: oci://ghcr.io/<owner>/home-ops/apps/<component>:latest.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      repository-prefix:
        description: 'OCI repository prefix'
        required: false
        type: string
        default: ''
      source-prefix:
        description: 'Artifact source directory prefix, relative to the repository root'
        required: false
        type: string
        default: 'components'
      diff-tag:
        description: 'Diff tag for the push'
        required: false
        type: string
        default: 'latest'
  push:
    branches:
      - 'main'
    paths:
      - 'components/**'

jobs:
  flux-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - rclone
          - win11-vm
          - talos-vm
          - clickstack
          - hubble-ui
          - flux-operator-ui
          - headlamp
          - coder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Push component artifact
        uses: ./.github/actions/oci-push
        with:
          component: ${{ matrix.component }}
          repository-prefix: ${{ inputs.repository-prefix || format('ghcr.io/{0}/apps', github.repository) }}
          source-prefix: ${{ inputs.source-prefix || 'components' }}
          diff-tag: ${{ inputs.diff-tag || 'latest' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
