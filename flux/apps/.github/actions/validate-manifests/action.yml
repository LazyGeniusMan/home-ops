# Shared apps manifest validation logic.
# Called by the root wiring workflow .github/workflows/flux-apps-validate.yaml
# (via `uses: ./flux/apps/.github/actions/validate-manifests`) and by the
# area-local flux/apps/.github/workflows/validate.yaml. Defaults assume the
# area directory is the repository root (true after the per-area repo split);
# the monorepo root caller overrides script/validate-dir with flux/-prefixed
# paths.
name: apps-validate-manifests
description: Validate apps manifests with the shared validate script.

inputs:
  script:
    description: 'Validate script, relative to the repository root'
    required: false
    default: './scripts/validate.sh'
  validate-dir:
    description: 'Directory to validate, relative to the repository root'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Setup yq
      uses: fluxcd/pkg/actions/yq@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
    - name: Setup kubeconform
      uses: fluxcd/pkg/actions/kubeconform@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
    - name: Setup kustomize
      uses: fluxcd/pkg/actions/kustomize@6d8d5d9e03f8da11e9685652e205f20aeb99c4ba # main
    - name: Validate manifests
      shell: bash
      run: ${{ inputs.script }} -d ${{ inputs.validate-dir }}
