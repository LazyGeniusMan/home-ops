apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Stg (prd values) route hostname (headlamp.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: headlamp.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: headlamp
  # No headlamp-oidc vault patches: client_id + client_secret flow end-to-end
  # from the headlamp-sso outputs Secret via the in-cluster `headlamp-k8s`
  # SecretStore (base/headlamp-secrets.yaml) — no Proton Pass seeding.
  # Stg (prd values) OIDC issuer.
  - patch: |
      - op: replace
        path: /spec/target/template/data/OIDC_ISSUER_URL
        value: https://zitadel.home-ops.yansyah.my.id
    target:
      kind: ExternalSecret
      name: headlamp-oidc
  # Stg (prd values) wildcard Certificate (wildcard-home-ops).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
