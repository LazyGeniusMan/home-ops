apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd route hostname (headlamp.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: headlamp.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: headlamp
  # No headlamp-oidc vault patches: client_id + client_secret flow end-to-end
  # from the headlamp-sso outputs Secret via the in-cluster `headlamp-k8s`
  # SecretStore (base/headlamp-secrets.yaml) — no Proton Pass seeding.
  # Prd OIDC issuer.
  - patch: |
      - op: replace
        path: /spec/target/template/data/OIDC_ISSUER_URL
        value: https://admin.zitadel.home-ops.yansyah.my.id
    target:
      kind: ExternalSecret
      name: headlamp-oidc
  # Prd Headlamp SSO Terraform identity: CR vars (prd issuer host, prd
  # redirect URIs) against the shared infra/zitadel root (base/terraform.yaml
  # cross-namespace sourceRef). Provider auth (jwt_profile_json) + org_id +
  # admin_user_id mirror from the FirstInstance handoff via the
  # cross-namespace `headlamp-zitadel` SecretStore — no vault ref patch, no
  # pass:// JWT seeding, no per-env ID literals. project_name,
  # create_user_role, user_emails, create_cookie_secret are env-invariant —
  # only hosts vary per env. Positional: /spec/vars/0 (domain) +
  # /spec/vars/2 (login_base_uri) + /spec/vars/3/value/0 (redirect) + /spec/vars/4/value/0 (post-logout).
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: https://login.zitadel.home-ops.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/4/value/0
        value: https://headlamp.home-ops.yansyah.my.id/*
      - op: replace
        path: /spec/vars/4/value/0
        value: https://headlamp.home-ops.yansyah.my.id/
    target:
      kind: Terraform
      name: headlamp-sso
  # Prd wildcard Certificate (wildcard-home-ops).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
  # Prd replica counts: stateless HA floor (2). Static `replicaCount`
  # stays at the HPA min (chart 0.45.0 has no autoscaling knob); the HPA
  # below scales 2-4 on CPU+memory.
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 2
    target:
      kind: HelmRelease
      name: headlamp
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: headlamp
