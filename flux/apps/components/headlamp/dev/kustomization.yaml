apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev route hostname (headlamp.home-ops-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: headlamp.home-ops-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: headlamp
  # No OIDC vault patch: client creds flow from the sso outputs Secret via the
  # in-cluster SecretStore. Dev OIDC issuer.
  - patch: |
      - op: replace
        path: /spec/target/template/data/OIDC_ISSUER_URL
        value: https://admin.zitadel.home-ops-dev.yansyah.my.id
    target:
      kind: ExternalSecret
      name: headlamp-oidc
  # Dev SSO CR vars (issuer host, redirect URIs). Env-invariant vars stay in
  # base; only hosts vary per env. Positional: /spec/vars/0,2,3,4 — base var
  # order must not change without updating this.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: https://login.zitadel.home-ops-dev.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/3/value/0
        value: https://headlamp.home-ops-dev.yansyah.my.id/*
      - op: replace
        path: /spec/vars/4/value/0
        value: https://headlamp.home-ops-dev.yansyah.my.id/
    target:
      kind: Terraform
      name: headlamp-sso
  # Dev wildcard Certificate (wildcard-home-ops-dev).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops-dev
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-dev-tls
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  # Dev replicas: single-replica footprint (HPA scales 1-2).
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: headlamp
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: headlamp
