apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev route hostname (headlamp.homelab-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: headlamp.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: headlamp
  # No headlamp-oidc vault patches: client_id + client_secret flow end-to-end
  # from the headlamp-sso outputs Secret via the in-cluster `headlamp-k8s`
  # SecretStore (base/headlamp-secrets.yaml) — no Proton Pass seeding.
  # Dev OIDC issuer.
  - patch: |
      - op: replace
        path: /spec/target/template/data/OIDC_ISSUER_URL
        value: https://zitadel.homelab-dev.yansyah.my.id
    target:
      kind: ExternalSecret
      name: headlamp-oidc
  # Dev Headlamp SSO Terraform identity: CR vars (dev issuer host, dev
  # redirect URIs) against the shared infra/zitadel root (base/terraform.yaml
  # cross-namespace sourceRef). Provider auth (jwt_profile_json) + org_id +
  # admin_user_id mirror from the FirstInstance handoff via the
  # cross-namespace `headlamp-zitadel` SecretStore — no vault ref patch, no
  # pass:// JWT seeding, no per-env ID literals. project_name,
  # create_user_role, user_emails, create_cookie_secret are env-invariant —
  # only hosts vary per env. Positional: /spec/vars/0 (domain) +
  # /spec/vars/2/value/0 (redirect) + /spec/vars/3/value/0 (post-logout).
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: zitadel.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value/0
        value: https://headlamp.homelab-dev.yansyah.my.id/*
      - op: replace
        path: /spec/vars/3/value/0
        value: https://headlamp.homelab-dev.yansyah.my.id/
    target:
      kind: Terraform
      name: headlamp-sso
  # Dev wildcard Certificate (wildcard-homelab-dev).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-homelab-dev
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-homelab-dev-tls
    target:
      kind: Certificate
      name: wildcard-homelab-dev
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-homelab-dev
  # Dev replica counts: minimal single-replica footprint.
  - patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: headlamp
