# Headlamp v0.45.0: Kubernetes web UI with native OIDC login via Zitadel plus
# the locked plugin set (ai-assistant, flux, kubevirt).
# Chart: oci://chartproxy.container-registry.com/kubernetes-sigs.github.io/headlamp/headlamp
# tag 0.45.0 (proxy of classic chart https://kubernetes-sigs.github.io/headlamp/;
# chart 0.45.0 carries app 0.45.0 — bump OCIRepository ref.tag AND image.tag
# together). No cosign verify block (chartproxy live-translates tarballs, so no
# upstream signature applies). App image ghcr.io/headlamp-k8s/headlamp:v0.45.0.
# No telemetry knobs, no ServiceMonitor.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: headlamp
spec:
  interval: 1h
  url: oci://chartproxy.container-registry.com/kubernetes-sigs.github.io/headlamp/headlamp
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.45.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 1h
  releaseName: headlamp
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: headlamp
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/kubernetes-sigs/headlamp/tree/main/charts/headlamp
  values:
    # Chart has no autoscaling knob — static replicas stay at the env min;
    # base/headlamp-hpa.yaml scales via overlays.
    replicaCount: 1 # placeholder - overridden by dev/prd
    # Chart defaults `resources: {}` — requests required for the HPA metric.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # Chart 0.45.0 = app 0.45.0 (lockstep); image.tag pinned explicit for
    # update automation (marker below) — bump the chart version to match.
    image:
      tag: v0.45.0 # {"$imagepolicy": "apps:headlamp:tag"}
    config:
      watchPlugins: true
      oidc:
        # No chart-managed Secret — credentials come from the ESO-synced
        # headlamp-oidc Secret.
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc
          # The synced Secret carries OIDC_SCOPES, so pass -oidc-scopes.
          hasScopes: true
    # Chart-owned ClusterRoleBinding (pod SA → cluster-admin) authorizes the
    # in-cluster `main` context only; per-user auth is base/headlamp-rbac.yaml.
    # Chart-native httpRoute stays OFF — the route is owned explicitly in base.
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: headlamp_ai_assistant
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_ai_assistant
            version: 0.4.1-alpha
          - name: headlamp_flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.7.0
          - name: headlamp_kubevirt
            source: https://artifacthub.io/packages/headlamp/headlamp-kubevirt/headlamp_kubevirt
            version: 0.3.1
        installOptions:
          parallel: true
          maxConcurrent: 3
