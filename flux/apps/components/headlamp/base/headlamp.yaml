# Headlamp v0.45.0 (§13.3): Kubernetes web UI with native OIDC login via
# Zitadel (§11.1) plus the locked plugin set (ai-assistant, flux, kubevirt).
# Chart: OCI oci://ghcr.io/home-operations/charts-mirror/headlamp tag 0.45.0
# (chart 0.45.0 carries app 0.45.0 — NO chart↔app divergence, unlike §11.1
# Zitadel; on bumps set the OCIRepository ref.tag AND image.tag to the new
# version together). Mirror stop-gap: the official upstream OCI
# (oci://ghcr.io/kubernetes-sigs/headlamp/charts/headlamp) is private
# (upstream issue kubernetes-sigs/headlamp#5684 open — 401/403 at authoring
# time), so delivery flows through the home-operations charts-mirror
# republish (same chart version, byte-identical, cosign-signed, verified
# per the mirror README). Subscribe to #5684 and switch to the official OCI
# chart once it goes public — mirrored charts are deprecated 6 months after
# upstream support lands. App image verified live on GHCR
# (ghcr.io/headlamp-k8s/headlamp:v0.45.0 tag listed at authoring time).
# Telemetry: chart values carry no phone-home/analytics/usage-reporting knobs
# (checked at authoring time); bundled static plugins stay on (pure UI, no
# reporting). No ServiceMonitor is shipped until monitoring.coreos.com CRDs
# land (same §9 deviation).
# Ordering: the headlamp-oidc ExternalSecret lives alongside the release in
# this same Kustomization, so the first install attempt pends until ESO syncs
# it and Flux retries (RetryOnFailure below).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: headlamp
spec:
  interval: 1h
  url: oci://ghcr.io/home-operations/charts-mirror/headlamp
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.45.0
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/home-operations/charts-mirror.*$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 1h
  releaseName: headlamp
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: headlamp
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/kubernetes-sigs/headlamp/tree/main/charts/headlamp
  values:
    # Chart schema `replicaCount` (default 1). No autoscaling knob exists in
    # chart 0.45.0, so static replicas stay at the env min (dev 1 / prd 2)
    # and base/headlamp-hpa.yaml scales 1-2 dev / 2-4 prd via overlays.
    replicaCount: 1 # placeholder - overridden by dev/prd
    # Chart defaults `resources: {}` (empty) — requests are REQUIRED for the
    # HPA CPU metric to work, so pin them here (limits cap noisy-neighbor).
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # Chart 0.45.0 = app 0.45.0 (lockstep); image.tag defaults to
    # v<appVersion>, pinned explicitly so update automation owns it via
    # update-policies/headlamp.yaml (marker below). On automation PRs bump
    # the chart version above to match.
    image:
      tag: v0.45.0 # {"$imagepolicy": "apps:headlamp:tag"}
    config:
      # Hot-reload plugins the manager installs without recreating the Pod.
      watchPlugins: true
      oidc:
        # No chart-managed Secret — credentials come from the ESO-synced
        # headlamp-oidc Secret (see base/headlamp-secrets.yaml).
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc
          # The synced Secret carries OIDC_SCOPES, so pass -oidc-scopes.
          hasScopes: true
    # Chart-owned ClusterRoleBinding (pod SA → cluster-admin) stays on: it
    # authorizes the in-cluster `main` context only. Per-USER authorization
    # is the hand-written bindings in base/headlamp-rbac.yaml.
    # Chart-native httpRoute stays OFF — the §8.1 route is owned explicitly
    # in base (same as §11.1 Zitadel).
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: headlamp_ai_assistant
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_ai_assistant
            version: 0.4.1-alpha
          - name: headlamp_flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.7.0
          - name: headlamp_kubevirt
            source: https://artifacthub.io/packages/headlamp/headlamp-kubevirt/headlamp_kubevirt
            version: 0.3.1
        installOptions:
          parallel: true
          maxConcurrent: 3
