# Narrow cross-namespace handoff grant for the ESO reader. Mirrors the two
# FirstInstance handoff Secrets from the `zitadel` namespace into
# `headlamp-terraform-vars` via the `headlamp-zitadel` SecretStore
# (base/terraform.yaml). Owned by this component (explicit
# `metadata.namespace: zitadel`) so it reconciles and prunes with the app.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zitadel-bootstrap-credentials", "zitadel-bootstrap-outputs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
subjects:
  - kind: ServiceAccount
    name: eso-zitadel-handoff-reader
    namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-zitadel-handoff-reader
