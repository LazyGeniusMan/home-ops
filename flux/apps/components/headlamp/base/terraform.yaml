# Headlamp SSO identity, machine-applied by Tofu Controller: the `headlamp`
# Zitadel project + project-scoped roles + user grants + OIDC client.
# Ships in the app Kustomization (fleet `apps` dependsOn `infra-configs`).
# IDs + provider auth flow from the FirstInstance handoff via the ESO-synced
# `headlamp-terraform-vars` Secret — no org_id literal in git.
# Outputs land in `headlamp-sso-outputs` for the `headlamp-oidc`
# ExternalSecret.
---
# Cross-namespace handoff reader: mirrors the two chart-minted handoff Secrets
# from the `zitadel` namespace into `headlamp-terraform-vars`
# (remoteNamespace MUST be `zitadel`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-handoff-reader
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: headlamp-zitadel
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-handoff-reader
---
# Vars mirror: provider auth from `zitadel-bootstrap-credentials`, IDs from
# `zitadel-bootstrap-outputs` — keys land under module var names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: headlamp-zitadel
    kind: SecretStore
  target:
    name: headlamp-terraform-vars
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: zitadel-bootstrap-credentials
        property: jwt_profile_json
    - secretKey: org_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: org_id
    - secretKey: admin_user_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: admin_user_id

---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: headlamp-sso
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: no `tofu destroy` path exists via Flux.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared zitadel SSO root (cross-namespace `infra` OCIRepository in the
  # `zitadel` namespace).
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: zitadel
  path: ./terraform
  # Plain per-env values; secrets come from varsFrom. `user_emails` empty =
  # admin-only. Positional: overlays patch /spec/vars by index — var order
  # must not change without updating them. Never commit passwords.
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: project_name
      value: headlamp
    - name: login_base_uri
      value: __ZITADEL_LOGIN_URI__
    - name: redirect_uris
      value:
        - https://__SERVICE_HOST__/*
    - name: post_logout_redirect_uris
      value:
        - https://__SERVICE_HOST__/
    - name: create_user_role
      value: "true"
    - name: user_emails
      value: []
    - name: create_cookie_secret
      value: "false"
  varsFrom:
    - kind: Secret
      name: headlamp-terraform-vars
  writeOutputsToSecret:
    name: headlamp-sso-outputs
    outputs:
      - client_id
      - client_secret
