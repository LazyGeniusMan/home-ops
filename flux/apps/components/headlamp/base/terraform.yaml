# Headlamp SSO identity (§13.3), machine-applied by Tofu Controller.
# Owns ONLY this app's slice: the `headlamp` Zitadel project + project-scoped
# roles (headlamp-admin/headlamp-user) + user grants + the `headlamp` OIDC client.
# Project-scoped means headlamp-admin NEVER implies org admin.
#
# Ordering: this object ships in the app Kustomization (fleet `apps`
# Kustomization dependsOn `infra-configs`), so it only reconciles after the
# Zitadel HelmRelease + bootstrap identity are Ready. Terraform `dependsOn`
# is Terraform-CR-only upstream (checkDependencies resolves every entry as
# kind Terraform), so NO dependsOn entry here — the fleet ordering above is
# the mechanism. Same shapes as
# flux/infra/components/zitadel/configs/base/terraform-bootstrap.yaml.
# First-run prerequisite (one-time, manual): the Zitadel bootstrap must have
# applied first (org + users exist), and the IAM_OWNER service-user key JSON
# must be seeded at pass://<env-vault>/zitadel/terraform-jwt-profile-json
# (shared instance key, mirrored into this namespace — same pattern as the
# cloudflare-api-token mirrors). Without the key the CR retries on interval.
# Upstream wiring: org_id + admin/user IDs flow from the zitadel bootstrap
# slice via `data.terraform_remote_state` (in-cluster Kubernetes backend,
# state Secret `tfstate-default-zitadel-bootstrap-identity` in the `zitadel`
# namespace) — NO org_id var, NO manual per-env fill, NO email lookups.
# The read runs as this namespace's tofu runner SA
# (`system:serviceaccount:headlamp:tf-runner`); its narrow cross-namespace grant
# (Role + RoleBinding in the zitadel namespace, get+list on the bootstrap
# state Secret only) ships in `terraform-remote-state-rbac.yaml` in this SAME
# base dir so it reconciles with the app — the Role lives in the zitadel
# namespace but is owned by the headlamp component (prune it if headlamp is ever
# removed). Same-namespace `varsFrom` CANNOT cross namespaces (no namespace
# field), which is why remote-state + RBAC is the mechanism here.
# Backend: in-cluster Kubernetes default (state Secrets in the headlamp
# namespace) — no backendConfig needed. Drift detection stays on (default).
# Outputs: client_id + client_secret land in `headlamp-sso-outputs` (sensitive);
# the `headlamp-oidc` ExternalSecret consumes BOTH from that Secret through the
# in-cluster `headlamp-k8s` SecretStore (base/headlamp-secrets.yaml) — never Git,
# never Proton Pass.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: headlamp-terraform-vars
    template:
      data:
        jwt_profile_json: "{{ .jwt_profile_json }}"
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: __PROTON_PASS_BASE__/zitadel/terraform-jwt-profile-json
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: headlamp-sso
spec:
  interval: 30m
  approvePlan: auto
  # App OCI artifact (same namespace, in-tenant `apps` OCIRepository):
  # the artifact packs the whole component dir, terraform/ included.
  sourceRef:
    kind: OCIRepository
    name: apps
  path: ./terraform
  # Plain (non-sensitive) per-env values; secrets come from varsFrom below.
  # varsFrom overrides vars on key collision (upstream GenerateVarsForTF).
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: app_host
      value: __SERVICE_HOST__
  varsFrom:
    - kind: Secret
      name: headlamp-terraform-vars
  writeOutputsToSecret:
    name: headlamp-sso-outputs
    outputs:
      - client_id
      - client_secret
