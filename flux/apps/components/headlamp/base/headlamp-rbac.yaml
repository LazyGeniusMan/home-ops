# Headlamp per-user RBAC: maps the Zitadel `groups` claim to Kubernetes
# authorization (Headlamp forwards the user's OIDC token with no
# claims-mapping knob, so subjects are explicit groups — reconcile with the
# API server's OIDC userClaim/groupsClaim + prefix flags). Subjects mirror the
# Zitadel org groups granted by `headlamp-sso` (`admin` → headlamp-admins,
# `users` → view + headlamp-basic). Least-privilege scaffolding
# (`headlamp-ops` + `headlamp-ops-global-read`, NOT BOUND yet) ships in this
# file; cutover plan + workflow gate in the README.
# ACCEPTED RISK (owner: platform admin, revisit 2027-Q1): `admin` group →
# cluster-admin via `headlamp-admins` until the admin workflow runs on
# `headlamp-ops`; the `main` Gateway HTTPRoute stays gated by native OIDC.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: admin
---
# Least-privilege admin scaffold (NOT BOUND yet — cutover per the plan
# above; binding lands as a separate change after the workflow gate passes).
# Namespace-admin minus escape hatches: full control of workloads, config,
# storage, autoscaling, gateway routes, and Flux Kustomizations/HelmReleases
# in every namespace it is bound in, but NO nodes/prox_subresources,
# NO cluster-scoped RBAC writes, NO secrets decrypt beyond read.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-ops
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "networking.k8s.io", "gateway.networking.k8s.io", "storage.k8s.io", "policy"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io", "source.toolkit.fluxcd.io", "notification.toolkit.fluxcd.io", "infra.contrib.fluxcd.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["kubevirt.io", "subresources.kubevirt.io", "cdi.kubevirt.io", "autoscaling.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
---
# Cluster-scoped read companion for `headlamp-ops` (enumeration across
# namespaces once the admin binding goes namespaced; also NOT BOUND yet).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-ops-global-read
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io", "gateway.networking.k8s.io", "storage.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-users-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: users
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-basic
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-users-basic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-basic
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: users
