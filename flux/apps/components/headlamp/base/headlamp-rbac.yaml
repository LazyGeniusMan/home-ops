# Headlamp per-user RBAC (§13.3): maps the Zitadel `groups` claim to
# Kubernetes authorization. Headlamp forwards the user's OIDC token to the
# API server, which authorizes the request against THESE bindings — Headlamp
# itself has no claims-mapping knob (the chart exposes only
# clusterRoleBinding.clusterRoleName for the pod's own in-cluster `main`
# context, left at cluster-admin). So the mapping is explicit subject names:
# - `admin` group → cluster-admin (admin@ is the sole admin member per §11.1;
#   the subject below names the Zitadel user identity as the API server sees
#   it — RECONCILE the subject name/claim with the API server's OIDC flags
#   (structured auth: userClaim/groupsClaim + prefix) before go-live; if the
#   API server prefixes (e.g. `zitadel:`), update the subjects to match).
# - `users` group → view (+ basic discovery ClusterRole below: self-
#   subject review + namespace listing so the UI can enumerate contexts).
# Group-subject form is used so future members of each Zitadel group inherit
# without manifest edits (requires the API server's groupsClaim to assert
# `admin`/`users` — same `groups` claim Headlamp requests via OIDC_SCOPES).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-users-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: users
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-basic
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-users-basic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-basic
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: users
