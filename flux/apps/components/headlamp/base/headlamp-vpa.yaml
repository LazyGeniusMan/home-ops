# VPA recommender for the headlamp Deployment (HPA-paired): updateMode Off —
# recommender-only, never VPA-apply on HPA-scaled metrics.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: headlamp
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: headlamp
  updatePolicy:
    updateMode: 'Off'
