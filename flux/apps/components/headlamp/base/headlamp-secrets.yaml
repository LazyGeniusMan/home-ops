# Headlamp secrets (§13.3). Git holds remoteRefs only, never values.
# - headlamp-oidc: the Zitadel `headlamp` client credentials (client_id +
#   client_secret, both generated server-side). They flow end-to-end from
#   stored outputs: the `headlamp-sso` Terraform module outputs them into the
#   `headlamp-sso-outputs` Secret (CR writeOutputsToSecret), and this
#   ExternalSecret consumes BOTH keys from that Secret through the
#   in-cluster `headlamp-k8s` SecretStore below (ESO Kubernetes provider).
#   NO pass:// seeding for OIDC creds. One ExternalSecret = one store, so
#   headlamp-oidc points at `headlamp-k8s` only. Static (non-secret) OIDC
#   fields — issuer URL, scopes — stay as template literals above (patched
#   per-env in the overlays); only the client credentials are synced from
#   the outputs Secret. The writeOutputsToSecret Secret stores outputs
#   base64-encoded under their output names (`client_id`, `client_secret`);
#   the `property` fields below map those onto the template keys
#   (`OIDC_CLIENT_ID`, `OIDC_CLIENT_SECRET`) the chart's externalSecret
#   contract expects (see base/headlamp.yaml).
# - headlamp-k8s (SecretStore): reads Secrets in THIS namespace via the
#   `eso-k8s-reader` ServiceAccount (Role: secrets get/list/watch +
#   selfsubjectrulesreviews create, in-namespace only). Same-cluster read,
#   so `server.url` is omitted (defaults to kubernetes.default) and the
#   in-namespace `kube-root-ca.crt` ConfigMap supplies the API CA.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: headlamp-k8s
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
spec:
  provider:
    kubernetes:
      remoteNamespace: headlamp
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: headlamp-k8s
    kind: SecretStore
  target:
    name: headlamp-oidc
    template:
      data:
        OIDC_CLIENT_ID: "{{ .clientId }}"
        OIDC_ISSUER_URL: __ZITADEL_ISSUER_URL__
        OIDC_SCOPES: openid profile email groups
        OIDC_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: headlamp-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: headlamp-sso-outputs
        property: client_secret
