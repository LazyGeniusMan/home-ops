# Headlamp secrets: Git holds remoteRefs only, never values.
# - headlamp-oidc: `headlamp` client credentials from the `headlamp-sso-outputs`
#   Secret via the in-cluster `headlamp-k8s` SecretStore — no pass:// seeding
#   for OIDC creds. Static OIDC fields (issuer URL, scopes) are template
#   literals patched per-env; only client credentials sync from outputs.
# - headlamp-k8s (SecretStore): in-namespace reads via the `eso-k8s-reader`
#   ServiceAccount.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: headlamp-k8s
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: headlamp
spec:
  provider:
    kubernetes:
      remoteNamespace: headlamp
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: headlamp-k8s
    kind: SecretStore
  target:
    name: headlamp-oidc
    template:
      data:
        OIDC_CLIENT_ID: "{{ .clientId }}"
        OIDC_ISSUER_URL: __ZITADEL_ISSUER_URL__
        OIDC_SCOPES: openid profile email groups
        OIDC_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: headlamp-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: headlamp-sso-outputs
        property: client_secret
