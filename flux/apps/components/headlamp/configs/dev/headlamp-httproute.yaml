# Headlamp HTTPRoute (§14 dev): attach to the shared §14 DEV Gateway
# (listeners accept routes from all namespaces — cross-namespace parentRef, no
# targetNamespace override needed). Chart-native httpRoute templating stays
# OFF (we own the §8.1 pattern explicitly rather than through chart values,
# same split as §14 DEV Zitadel). TLS terminates at the Gateway via the
# in-namespace wildcard Certificate (wildcard-certificate.yaml — cert-manager
# Secrets are namespace-local, same duplicate pattern as the base).
# Catch-all `/` covers the app plus the OIDC callback path /oidc-callback
# (Headlamp builds it as <URL>/oidc-callback; the locked DEV Zitadel redirect
# is https://headlamp.homelab-dev.yansyah.my.id/*).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - headlamp.homelab-dev.yansyah.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
