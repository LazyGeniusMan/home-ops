# Headlamp HTTPRoute (§13.3): attach to the shared §8.1 Gateway (listeners
# accept routes from all namespaces — cross-namespace parentRef, no
# targetNamespace override needed). Chart-native httpRoute templating stays
# OFF (we own the §8.1 pattern explicitly rather than through chart values,
# same split as §11.1 Zitadel). TLS terminates at the Gateway via the
# in-namespace wildcard Certificate (wildcard-certificate.yaml — cert-manager
# Secrets are namespace-local, same duplicate pattern as §§8.1/11.1).
# Catch-all `/` covers the app plus the OIDC callback path /oidc-callback
# (Headlamp builds it as <URL>/oidc-callback; the locked Zitadel redirect is
# (https://__SERVICE_HOST__/*).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SERVICE_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
