# Headlamp OIDC Secret (§13.3): synced by ESO from Proton Pass; Git holds
# remoteRefs only. Key names MUST match the chart's externalSecret contract
# (charts/headlamp/templates/deployment.yaml reads OIDC_CLIENT_ID,
# OIDC_CLIENT_SECRET, OIDC_ISSUER_URL, OIDC_SCOPES from the secret named
# headlamp-oidc). Seed the vault entries with pass-cli:
# - pass://acme-prd-bdo1-talos-apps-01/headlamp/oidc-client-secret — the
#   Zitadel `headlamp` client secret (read out of the Tofu state after
#   `terraform apply` in the §11.1 zitadel module; never commit it).
# The client is CONFIDENTIAL
# (zitadel_application_oidc.auth_method_type = OIDC_AUTH_METHOD_TYPE_BASIC in
# flux/infra/components/zitadel/terraform/main.tf), so a secret is required —
# NOT public-client PKCE. Static (non-secret) OIDC fields — clientID, issuer
# URL, scopes — are rendered into the headlamp-oidc Secret by the
# ExternalSecret template above; only the client secret itself is synced from
# the vault.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc
    template:
      data:
        OIDC_CLIENT_ID: headlamp
        OIDC_ISSUER_URL: https://zitadel.home-ops.yansyah.my.id
        OIDC_SCOPES: openid profile email groups
        OIDC_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: pass://acme-prd-bdo1-talos-apps-01/headlamp/oidc-client-secret
