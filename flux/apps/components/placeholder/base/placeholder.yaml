# Placeholder HelmRelease documenting the per-app D2 contract.
# Removed with this directory when the first real app lands (§§8-14).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: placeholder-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/charts/placeholder
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: 0.1.0 # {"$imagepolicy": "apps:placeholder:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: placeholder
spec:
  releaseName: placeholder
  chartRef:
    kind: OCIRepository
    name: placeholder-chart
  interval: 1h
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
    remediation:
      remediateLastFailure: true
  # Telemetry-off default: apps must not enable usage reporting.
  values:
    telemetry:
      enabled: false
