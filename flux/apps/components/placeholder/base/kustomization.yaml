# Placeholder app skeleton (§7 base). Real applications land in §§8-14, each
# as its own directory under components/ following this shape:
# <name>/base (Helm OCI source + HelmRelease) + <name>/production|staging
# (kustomize patches over ../base).
#
# Base holds the HelmRelease with telemetry-off defaults; monitoring wiring
# (ServiceMonitors, ingress, alerts) is enabled per app in §§8-14.
# This placeholder directory is removed when the first real app lands.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - placeholder.yaml
