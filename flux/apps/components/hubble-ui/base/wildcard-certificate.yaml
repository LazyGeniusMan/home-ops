# In-namespace wildcard Certificate (cert-manager Secrets are namespace-local,
# so the cert-manager-namespace Certificate cannot feed this Gateway listener).
# Mints __WILDCARD_TLS_SECRET__ HERE via ClusterIssuer/letsencrypt; the token
# ExternalSecret (hubble-secrets.yaml) mirrors the credential here.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __WILDCARD_CERT_NAME__
spec:
  secretName: __WILDCARD_TLS_SECRET__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.__BASE_DOMAIN__"
