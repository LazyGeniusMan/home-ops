# Per-instance oauth2-proxy: fronts hubble-ui, Zitadel auth via the own
# `hubble` client, admin-only (`hubble-ui-admin`). Official OCI chart,
# cosign-verified (app v7.15.4 pinned explicit). HTTPRoute backends to the
# proxy (:4180); proxy upstreams to hubble-ui:80. Credentials stay in ESO
# (chart renders no Secret); no telemetry; external HPA/VPA own scaling.
# Tags track update-policies/hubble-ui.yaml via $imagepolicy markers (shared
# with clickstack + flux-operator-ui — bump together).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: oauth2-proxy-chart
spec:
  interval: 1h
  url: oci://ghcr.io/oauth2-proxy/charts/oauth2-proxy
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 10.7.0 # {"$imagepolicy": "apps:oauth2-proxy-chart:tag"}
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/oauth2-proxy/manifests/.github/workflows/release.yaml@refs/heads/main$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
spec:
  interval: 1h
  releaseName: oauth2-proxy
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: oauth2-proxy-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/oauth2-proxy/manifests/tree/main/helm/oauth2-proxy
  values:
    fullnameOverride: oauth2-proxy
    config:
      existingSecret: oauth2-proxy
      forceLegacyConfig: false
    image:
      repository: oauth2-proxy/oauth2-proxy
      tag: v7.15.4 # {"$imagepolicy": "apps:oauth2-proxy:tag"}
      pullPolicy: IfNotPresent
    # ESO owns the oauth2-proxy Secret — the chart renders none.
    proxyVarsAsSecrets: false
    extraArgs:
      upstream: http://hubble-ui.hubble-ui.svc:80
      provider: oidc
      oidc-issuer-url: __ZITADEL_ISSUER_URL__
      oidc-groups-claim: groups
      allowed-group: hubble-ui-admin
      email-domain: "*"
      scope: openid profile email groups
      cookie-domain: .__BASE_DOMAIN__
      cookie-secure: "true"
      cookie-samesite: lax
      reverse-proxy: "true"
      skip-provider-button: "true"
      redirect-url: https://__SERVICE_HOST__/oauth2/callback
    extraEnv:
      - name: OAUTH2_PROXY_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy
            key: client-id
      - name: OAUTH2_PROXY_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy
            key: client-secret
      - name: OAUTH2_PROXY_COOKIE_SECRET
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy
            key: cookie-secret
    service:
      portNumber: 4180
      targetPort: 4180
    # No telemetry: metrics endpoint + ServiceMonitor stay off.
    metrics:
      enabled: false
    serviceAccount:
      enabled: false
      automountServiceAccountToken: false
    redis-ha:
      enabled: false
    # External HPA/VPA own scaling — chart autoscaling + PDB stay off.
    autoscaling:
      enabled: false
    podDisruptionBudget:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
