# hubble-ui (scalable) + oauth2-proxy (singleton) HPAs over the hand-vendored
# Deployments (no usable chart autoscaling knob). hubble-ui scales (dev 1-2,
# prd 2-4 via overlays); oauth2-proxy stays 1/1 in every env (singleton rule).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hubble-ui
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: hubble-ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hubble-ui
  minReplicas: 1 # placeholder - overridden by dev/prd
  maxReplicas: 2 # placeholder - overridden by dev/prd
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: hubble-ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oauth2-proxy
  minReplicas: 1 # placeholder - overridden by dev/prd
  maxReplicas: 2 # placeholder - overridden by dev/prd
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
