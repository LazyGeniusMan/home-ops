# Hubble UI secrets (§11.3): Git holds refs only, never values.
# - oauth2-proxy: the OWN `hubble` OIDC client credentials (client-id +
#   client-secret, both generated server-side) + the per-instance cookie secret
#   (32 random bytes, generated in-Tofu). They flow end-to-end from stored
#   outputs: the `hubble-ui-sso` Terraform module outputs them into the
#   `hubble-ui-sso-outputs` Secret (CR writeOutputsToSecret), and this
#   ExternalSecret consumes ALL THREE keys from that Secret through the
#   in-cluster `hubble-ui-k8s` SecretStore below (ESO Kubernetes provider).
#   NO pass:// seeding for OIDC creds. The writeOutputsToSecret Secret stores
#   outputs base64-encoded under their output names (`client_id`,
#   `client_secret`, `cookie_secret`); the `property` fields below map those
#   onto the keys (`client-id`, `client-secret`, `cookie-secret`) the proxy
#   Deployment consumes (OAUTH2_PROXY_CLIENT_ID env + --client-secret-file /
#   --cookie-secret-file mounts — never a --client-id flag).
# - hubble-ui-k8s (SecretStore): reads Secrets in THIS namespace via the
#   `eso-k8s-reader` ServiceAccount (Role: secrets get/list/watch +
#   selfsubjectrulesreviews create, in-namespace only). Same-cluster read,
#   so `server.url` is omitted (defaults to kubernetes.default) and the
#   in-namespace `kube-root-ca.crt` ConfigMap supplies the API CA.
# - cloudflare-api-token: mirrors cert-manager/configs/base/cluster-issuer.yaml
#   (same Proton Pass remoteRef) so the DNS-01 solver credential exists in
#   this namespace too.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: hubble-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: hubble-ui
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: hubble-ui
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: hubble-ui-k8s
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: hubble-ui
spec:
  provider:
    kubernetes:
      remoteNamespace: hubble-ui
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hubble-ui-k8s
    kind: SecretStore
  target:
    name: oauth2-proxy
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
        cookie-secret: "{{ .cookieSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: hubble-ui-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: hubble-ui-sso-outputs
        property: client_secret
    - secretKey: cookieSecret
      remoteRef:
        key: hubble-ui-sso-outputs
        property: cookie_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
