# Hubble UI secrets (§11.3): synced by ESO from Proton Pass — Git holds
# remoteRefs only, never values. Seed each vault entry with pass-cli.
# - oauth2-proxy: the OWN `hubble` OIDC client credentials (client-id is
#   generated server-side by this app's `hubble-ui-sso` Terraform CR — synced
#   from pass://<env-vault>/hubble-ui/oidc-client-id, consumed via the
#   OAUTH2_PROXY_CLIENT_ID env, never a --client-id flag) + the client secret
#   (from tofu state into pass://<env-vault>/hubble-ui/oauth2-proxy-client-secret,
#   mounted as a file for --client-secret-file) + the per-instance cookie
#   secret (32 random bytes, e.g. `head -c32 /dev/urandom | base64`, mounted
#   as a file for --cookie-secret-file).
# - cloudflare-api-token: mirrors cert-manager/configs/base/cluster-issuer.yaml
#   (same Proton Pass remoteRef) so the DNS-01 solver credential exists in
#   this namespace too.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
        cookie-secret: "{{ .cookieSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: __PROTON_PASS_BASE__/hubble-ui/oauth2-proxy-client-secret
    - secretKey: cookieSecret
      remoteRef:
        key: __PROTON_PASS_BASE__/hubble-ui/oauth2-proxy-cookie-secret
    - secretKey: clientId
      remoteRef:
        key: __PROTON_PASS_BASE__/hubble-ui/oidc-client-id
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
