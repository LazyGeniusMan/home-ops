# VPA recommenders for the hubble-ui + oauth2-proxy Deployments (HPA-paired):
# updateMode Off — recommender-only, never VPA-apply on HPA-scaled metrics.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hubble-ui
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hubble-ui
  updatePolicy:
    updateMode: 'Off'
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: oauth2-proxy
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oauth2-proxy
  updatePolicy:
    updateMode: 'Off'
