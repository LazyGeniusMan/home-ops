# Hubble HTTPRoute on the shared Gateway (cross-namespace parentRef).
# Hostname __SERVICE_HOST__ → oauth2-proxy Service (:4180), which upstreams
# to hubble-ui. TLS terminates at the Gateway via the in-namespace wildcard
# Certificate.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SERVICE_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy
          port: 4180
