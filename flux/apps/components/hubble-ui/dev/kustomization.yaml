apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev route hostname (hubble.home-ops-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: hubble.home-ops-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: hubble
  # No oauth2-proxy vault patches: client_id + client_secret + cookie_secret
  # flow end-to-end from the hubble-ui-sso outputs Secret via the in-cluster
  # `hubble-ui-k8s` SecretStore (base/hubble-secrets.yaml).
  # Dev SSO CR vars (issuer host, redirect URIs) against the shared
  # infra/zitadel root (base/terraform.yaml cross-namespace sourceRef).
  # Provider auth + org_id + admin ID mirror from the FirstInstance handoff
  # via the cross-namespace `hubble-ui-zitadel` SecretStore — no vault ref
  # patch, no per-env ID literals. project_name, oidc_name,
  # create_user_role, create_cookie_secret are env-invariant — only hosts
  # vary per env. Positional: /spec/vars/0 (domain) +
  # /spec/vars/3 (login_base_uri) + /spec/vars/4/value/0 (redirect) +
  # /spec/vars/5/value/0 (post-logout).
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/3/value
        value: https://login.zitadel.home-ops-dev.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/4/value/0
        value: https://hubble.home-ops-dev.yansyah.my.id/*
      - op: replace
        path: /spec/vars/5/value/0
        value: https://hubble.home-ops-dev.yansyah.my.id/
    target:
      kind: Terraform
      name: hubble-ui-sso
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  # Dev wildcard Certificate (wildcard-home-ops-dev). The DNS-01 solver
  # credential ES above already renders the per-env vault path — one
  # cloudflare-api-token ES serves both the route and the Certificate, so no
  # second vault patch is needed here.
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops-dev
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-dev-tls
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  # Dev proxy: Zitadel issuer, cookie domain, callback (values keys, not
  # arg indices — the chart takes every flag from extraArgs).
  - patch: |
      - op: replace
        path: /spec/values/extraArgs/oidc-issuer-url
        value: https://admin.zitadel.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/cookie-domain
        value: .home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/redirect-url
        value: https://hubble.home-ops-dev.yansyah.my.id/oauth2/callback
    target:
      kind: HelmRelease
      name: oauth2-proxy
  # Dev replica counts: minimal single-replica footprint. No Deployment
  # /spec/replicas patch: base replicas: 1 is the create-time seed, HPA
  # owns runtime count (HPA minReplicas enforces the floor); the HPAs below
  # scale 1-2 on CPU+memory.
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: hubble-ui
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: oauth2-proxy
