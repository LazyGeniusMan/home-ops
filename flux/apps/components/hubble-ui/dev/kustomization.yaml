apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev route hostname (hubble.homelab-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: hubble.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: hubble
  # Dev proxy + token vault refs.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/hubble-ui/oauth2-proxy-client-secret
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/hubble-ui/oauth2-proxy-cookie-secret
    target:
      kind: ExternalSecret
      name: oauth2-proxy
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  # Dev wildcard Certificate (wildcard-homelab-dev).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-homelab-dev
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-homelab-dev-tls
    target:
      kind: Certificate
      name: wildcard-homelab-dev
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-homelab-dev
  # Dev proxy: Zitadel issuer, cookie domain, callback.
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --oidc-issuer-url=https://zitadel.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/args/7
        value: --cookie-domain=.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/args/16
        value: --redirect-url=https://hubble.homelab-dev.yansyah.my.id/oauth2/callback
    target:
      kind: Deployment
      name: oauth2-proxy
