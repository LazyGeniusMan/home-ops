apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev route hostname (hubble.home-ops-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: hubble.home-ops-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: hubble
  # No OIDC vault patch: client creds + cookie flow from the sso outputs Secret
  # via the in-cluster SecretStore.
  # Dev SSO CR vars (issuer host, redirect URIs). Env-invariant vars stay in
  # base; only hosts vary per env. Positional: /spec/vars/0,3,4,5.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/3/value
        value: https://login.zitadel.home-ops-dev.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/4/value/0
        value: https://hubble.home-ops-dev.yansyah.my.id/*
      - op: replace
        path: /spec/vars/5/value/0
        value: https://hubble.home-ops-dev.yansyah.my.id/
    target:
      kind: Terraform
      name: hubble-ui-sso
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  # Dev wildcard Certificate (wildcard-home-ops-dev).
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops-dev
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-dev-tls
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  # Dev proxy: Zitadel issuer, cookie domain, callback.
  - patch: |
      - op: replace
        path: /spec/values/extraArgs/oidc-issuer-url
        value: https://admin.zitadel.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/cookie-domain
        value: .home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/redirect-url
        value: https://hubble.home-ops-dev.yansyah.my.id/oauth2/callback
    target:
      kind: HelmRelease
      name: oauth2-proxy
  # Dev replicas: single-replica footprint (HPAs scale 1-2).
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: hubble-ui
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: oauth2-proxy
