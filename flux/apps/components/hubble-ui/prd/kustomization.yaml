apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd route hostname (hubble.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: hubble.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: hubble
  # No OIDC vault patch: client creds + cookie flow from the sso outputs Secret
  # via the in-cluster SecretStore.
  # Prd SSO CR vars (issuer host, redirect URIs). Env-invariant vars stay in
  # base; only hosts vary per env. Positional: /spec/vars/0,3,4,5.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/3/value
        value: https://login.zitadel.home-ops.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/4/value/0
        value: https://hubble.home-ops.yansyah.my.id/*
      - op: replace
        path: /spec/vars/5/value/0
        value: https://hubble.home-ops.yansyah.my.id/
    target:
      kind: Terraform
      name: hubble-ui-sso
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  # Prd wildcard Certificate (wildcard-home-ops).
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
  # Prd proxy: Zitadel issuer, cookie domain, callback.
  - patch: |
      - op: replace
        path: /spec/values/extraArgs/oidc-issuer-url
        value: https://admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/cookie-domain
        value: .home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/redirect-url
        value: https://hubble.home-ops.yansyah.my.id/oauth2/callback
    target:
      kind: HelmRelease
      name: oauth2-proxy
  # Prd replicas: stateless HA floor (HPAs scale 2-4).
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: hubble-ui
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: oauth2-proxy
