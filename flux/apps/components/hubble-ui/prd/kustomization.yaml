apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd route hostname (hubble.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: hubble.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: hubble
  # No oauth2-proxy vault patches: client_id + client_secret + cookie_secret
  # flow end-to-end from the hubble-ui-sso outputs Secret via the in-cluster
  # `hubble-ui-k8s` SecretStore (base/hubble-secrets.yaml).
  # Prd SSO CR vars (issuer host, redirect URIs) against the shared
  # infra/zitadel root (base/terraform.yaml cross-namespace sourceRef).
  # Provider auth + org_id + admin ID mirror from the FirstInstance handoff
  # via the cross-namespace `hubble-ui-zitadel` SecretStore — no vault ref
  # patch, no per-env ID literals. project_name, oidc_name,
  # create_user_role, create_cookie_secret are env-invariant — only hosts
  # vary per env. Positional: /spec/vars/0 (domain) +
  # /spec/vars/3/value/0 (redirect) + /spec/vars/4/value/0 (post-logout).
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/3/value/0
        value: https://hubble.home-ops.yansyah.my.id/*
      - op: replace
        path: /spec/vars/4/value/0
        value: https://hubble.home-ops.yansyah.my.id/
    target:
      kind: Terraform
      name: hubble-ui-sso
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  # Prd wildcard Certificate (wildcard-home-ops).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
  # Prd proxy: Zitadel issuer, cookie domain, callback (args/4 --client-id
  # flag dropped for the OAUTH2_PROXY_CLIENT_ID env — indices above it shift
  # down one: cookie-domain 7→6, redirect-url 16→15).
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --oidc-issuer-url=https://zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/args/6
        value: --cookie-domain=.home-ops.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/args/15
        value: --redirect-url=https://hubble.home-ops.yansyah.my.id/oauth2/callback
    target:
      kind: Deployment
      name: oauth2-proxy
  # Prd replica counts: stateless HA floor (2). No Deployment
  # /spec/replicas patch: base replicas: 1 is the create-time seed, HPA
  # owns runtime count (HPA minReplicas enforces the floor); the HPAs below
  # scale 2-4 on CPU+memory.
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: hubble-ui
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: oauth2-proxy
