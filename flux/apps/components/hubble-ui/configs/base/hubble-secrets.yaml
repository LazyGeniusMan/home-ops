# Hubble UI secrets (§11.3): synced by ESO from Proton Pass — Git holds
# remoteRefs only, never values. Seed each vault entry with pass-cli.
# - oauth2-proxy: the shared OIDC client secret (Zitadel client
#   oauth2-proxy-shared) + the per-instance cookie secret (32 random bytes,
#   e.g. `head -c32 /dev/urandom | base64`). Mounted as files for
#   --client-secret-file / --cookie-secret-file.
# - cloudflare-api-token: mirrors cert-manager/configs/base/cluster-issuer.yaml
#   (same Proton Pass remoteRef) so the DNS-01 solver credential exists in
#   this namespace too.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy
  data:
    - secretKey: client-secret
      remoteRef:
        key: __PROTON_PASS_BASE__/hubble-ui/oauth2-proxy-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: __PROTON_PASS_BASE__/hubble-ui/oauth2-proxy-cookie-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
