apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Stg (prd values) secrets vault (pass://acme-prd-bdo1-talos-apps-01).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/oidc-client-secret
    target:
      kind: ExternalSecret
      name: coder-oidc
  # Stg (prd values) coder-oidc client-id vault ref (data/1 = clientId entry
  # added for SSO decoupling — the generated ID synced from the coder-sso
  # Terraform outputs; data/0 client-secret patch above is unchanged).
  - patch: |
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/oidc-client-id
    target:
      kind: ExternalSecret
      name: coder-oidc
  # Stg (prd values) Coder SSO Terraform identity: vault ref for the shared
  # instance JWT key + CR vars (prd issuer host, prd emails, prd app host).
  # org_id is a one-time manual fill from `zitadel-bootstrap-outputs`
  # (zitadel ns).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/zitadel/terraform-jwt-profile-json
    target:
      kind: ExternalSecret
      name: coder-terraform-vars
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/1/value
        value: REPLACE-ME-WITH-ORG-ID-FROM-zitadel-bootstrap-outputs
      - op: replace
        path: /spec/vars/2/value
        value: admin@home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/3/value
        value: user@home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/4/value
        value: coder.home-ops.yansyah.my.id
    target:
      kind: Terraform
      name: coder-sso
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/db-connection-url
    target:
      kind: ExternalSecret
      name: coder-db-credentials
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/db-password
    target:
      kind: ExternalSecret
      name: coder-db-app-secret
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cnpg/s3-access-key-id
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cnpg/s3-secret-access-key
    target:
      kind: ExternalSecret
      name: cnpg-s3-credentials
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: https://s3.seaweedfs.home-ops.yansyah.my.id
    target:
      kind: Cluster
      name: coder-db
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: coder.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: coder-redirect
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: coder.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: coder
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.coder.home-ops.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: coder-workspaces
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.coder.home-ops.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: coder-workspaces-redirect
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "coder.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: coder-root
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.coder.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: coder-wildcard
  # Stg (prd values) Coder URLs, OIDC issuer, mail domain, sign-in text.
  - patch: |
      - op: replace
        path: /spec/values/coder/env/0/value
        value: https://coder.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/1/value
        value: "*.coder.home-ops.yansyah.my.id"
      - op: replace
        path: /spec/values/coder/env/4/value
        value: https://zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/8/value
        value: home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/10/value
        value: Sign in with home-ops SSO
    target:
      kind: HelmRelease
      name: coder
