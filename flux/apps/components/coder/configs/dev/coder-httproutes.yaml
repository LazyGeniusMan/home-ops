# Coder HTTPRoutes (§14 dev): attach to the shared §14 DEV Gateway
# (listeners accept routes from all namespaces — cross-namespace parentRef, no
# targetNamespace override needed). Chart-native httproute templating stays
# OFF (we own the §8.1 pattern explicitly rather than through chart values).
# - Dashboard route (hostname coder.homelab-dev.yansyah.my.id, path /) → the
#   coder Service (port 80 → coderd 8080). Covers the UI, API, and the OIDC
#   callback /api/v2/users/oidc/callback.
# - Workspace route (hostname *.coder.homelab-dev.yansyah.my.id, path /) →
#   the same coder Service. Workspace agents and workspace apps dial
#   <workspace>.coder.homelab-dev.yansyah.my.id, which coderd multiplexes by
#   subdomain (CODER_WILDCARD_ACCESS_URL in controllers/dev/coder.yaml) —
#   one route covers every workspace, no per-workspace objects. Per the
#   Gateway API spec a `*.coder.…` hostname matches dots to the left, so
#   nested app subdomains under a workspace stay on this route too.
# - Redirect routes (coder-redirect, coder-workspaces-redirect): HTTP→HTTPS
#   RequestRedirect on the `http` listener for both hostnames — port 80 exists
#   only as a redirect source (same shape as the gateway-api dev
#   redirect-services route, owned explicitly per component).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-redirect
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - coder.homelab-dev.yansyah.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - coder.homelab-dev.yansyah.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coder
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-workspaces
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - "*.coder.homelab-dev.yansyah.my.id"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coder
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-workspaces-redirect
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - "*.coder.homelab-dev.yansyah.my.id"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
