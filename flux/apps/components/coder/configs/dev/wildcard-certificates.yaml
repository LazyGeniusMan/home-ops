# In-namespace Certificates (§14 dev). cert-manager Secrets are
# namespace-local, so the §14 DEV cert-manager Certificate cannot feed this
# component's Gateway listeners — these Certificates mint coder-tls
# (coder.homelab-dev.yansyah.my.id) and coder-wildcard-tls
# (*.coder.homelab-dev.yansyah.my.id, the nested wildcard coderd multiplexes
# workspaces by) HERE via the same ClusterIssuer/letsencrypt DNS-01 flow.
# Two Certificates because one TLS wildcard matches a single label only:
# *.homelab-dev.yansyah.my.id covers the dashboard root but NOT nested
# <workspace>.coder.homelab-dev.yansyah.my.id agents/apps. The token
# ExternalSecret mirrors cert-manager/configs/dev/cluster-issuer.yaml (same
# DEV Proton Pass remoteRef) so the DNS-01 solver credential exists in this
# namespace too. No manual DNS: issuance uses DNS-01 TXT records, and the A
# records ride on the §14 DEV external-dns automation (see README).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: coder-root
spec:
  secretName: coder-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "coder.homelab-dev.yansyah.my.id"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: coder-wildcard
spec:
  secretName: coder-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.coder.homelab-dev.yansyah.my.id"
