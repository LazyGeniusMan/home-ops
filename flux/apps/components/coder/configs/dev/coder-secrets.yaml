# Coder secrets (§14 dev). All synced by ESO from the DEV Proton Pass
# vault — Git holds remoteRefs only, never values. Seed each vault entry with
# pass-cli (never commit):
#   pass insert 'acme-dev-bdo1-talos-apps-01/coder/oidc-client-secret'
#   pass insert 'acme-dev-bdo1-talos-apps-01/coder/db-connection-url'
#   pass insert 'acme-dev-bdo1-talos-apps-01/coder/db-password'
# - coder-oidc: the DEV Zitadel `coder` client secret (key "client-secret").
#   Read it from the DEV zitadel terraform state after apply (same runbook as
#   the §14 DEV zitadel README: client secrets live in state, never in Git).
#   Consumed via CODER_OIDC_CLIENT_SECRET in controllers/dev/coder.yaml.
# - coder-db-credentials: full connection URL for the §14 DEV CNPG instance in
#   coder-db.yaml (key "connection-url", e.g.
#   postgres://coder:<pw>@coder-db-rw.coder.svc:5432/coder?sslmode=require).
#   The app user password MUST match password: in coder-db-app-secret below.
#   sslmode=require: CNPG serves TLS with a self-signed cert the app cannot
#   verify, so verify-full is impossible; require still encrypts in transit
#   (same trade-off as the upstream TLS-without-verification recipe).
# - coder-db-app-secret: CNPG initdb app-user secret (basic-auth, ESO-managed
#   so Git holds refs only): username MUST equal spec.bootstrap.initdb.owner
#   (upstream contract) and the password MUST match the password embedded in
#   the connection URL above — seed both vault entries with the same value
#   via pass-cli and rotate them together.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-oidc
    template:
      data:
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/coder/oidc-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-db-credentials
    template:
      data:
        connection-url: "{{ .connectionUrl }}"
  data:
    - secretKey: connectionUrl
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/coder/db-connection-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-db-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: coder
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/coder/db-password
