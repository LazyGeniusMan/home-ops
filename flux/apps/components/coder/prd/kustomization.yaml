apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # No coder-oidc vault patches (client id + secret flow from `coder-sso` outputs
  # via `coder-k8s`). Prd SSO Terraform identity (issuer host + redirect URIs;
  # IDs mirror from the handoff — no per-env ID literals; only hosts vary).
  # Vars patched by index (keep order).
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: https://login.zitadel.home-ops.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/3/value/0
        value: https://coder.home-ops.yansyah.my.id/*
      - op: replace
        path: /spec/vars/4/value/0
        value: https://coder.home-ops.yansyah.my.id/
    target:
      kind: Terraform
      name: coder-sso
  # Prd DB vault (single db-password source for both DB ExternalSecrets).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/db-password
    target:
      kind: ExternalSecret
      name: coder-db-credentials
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/db-password
    target:
      kind: ExternalSecret
      name: coder-db-app-secret
  # No matrix-notify vault patches (notifier flows from the kept Secret via
  # `coder-matrix`). (S3 keys COSI-minted — no per-env vault patch.)
  # Prd rclone identity (chart source: projects/helm-rclone-sync): vault keys +
  # destination cluster segment (base holds placeholders).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/rclone-proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/rclone-proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backups/acme-prd-bdo1-talos-apps-01/coder/coder-db
    target:
      kind: HelmRelease
      name: rclone-sync-coder-db
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs:8333
    target:
      kind: Cluster
      name: coder-db
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: coder.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: coder-redirect
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: coder.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: coder
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.coder.home-ops.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: coder-workspaces
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.coder.home-ops.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: coder-workspaces-redirect
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /spec/secretName
        value: coder-tls
    target:
      kind: Certificate
      name: coder-root
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "coder.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: coder-root
  - patch: |
      - op: replace
        path: /metadata/name
        value: coder-wildcard
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: coder-wildcard-tls
    target:
      kind: Certificate
      name: coder-wildcard
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.coder.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: coder-wildcard
  # Prd Coder URLs, OIDC issuer, mail domain, sign-in text (positional env
  # indices — keep order).
  - patch: |
      - op: replace
        path: /spec/values/coder/env/0/value
        value: https://coder.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/1/value
        value: "*.coder.home-ops.yansyah.my.id"
      - op: replace
        path: /spec/values/coder/env/4/value
        value: https://admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/8/value
        value: home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/10/value
        value: Sign in with home-ops SSO
    target:
      kind: HelmRelease
      name: coder
  # Prd scaling: `replicaCount` + HPA placeholders -> 2/4; DB instances -> 3.
  - patch: |
      - op: replace
        path: /spec/values/coder/replicaCount
        value: 2
    target:
      kind: HelmRelease
      name: coder
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: coder
  - patch: |
      - op: replace
        path: /spec/instances
        value: 3
    target:
      kind: Cluster
      name: coder-db
