apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # No coder-oidc vault patches: client_id + client_secret flow end-to-end
  # from the coder-sso outputs Secret via the in-cluster `coder-k8s`
  # SecretStore (base/coder-secrets.yaml) — no Proton Pass seeding.
  # Prd Coder SSO Terraform identity: CR vars (prd issuer host, prd app host).
  # Provider auth (jwt_profile_json) + org_id + admin_user_id all mirror from
  # the FirstInstance handoff via the cross-namespace `coder-zitadel`
  # SecretStore (base/terraform.yaml) — no vault ref patch, no pass:// JWT
  # seeding, no per-env ID literals.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/1/value
        value: coder.home-ops.yansyah.my.id
    target:
      kind: Terraform
      name: coder-sso
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/db-connection-url
    target:
      kind: ExternalSecret
      name: coder-db-credentials
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/db-password
    target:
      kind: ExternalSecret
      name: coder-db-app-secret
  # (S3 keys are COSI-minted via the coder-cosi SecretStore — no
  # per-env vault ref patch for cnpg-s3-credentials, rclone-coder-db-s3,
  # or rclone-coder-db-s3-path.)
  # Prd rclone-sync-coder-db identity: Proton Pass vault keys + the Proton
  # Drive destination cluster segment (base holds __PROTON_PASS_BASE__ /
  # __CLUSTER_NAME__ placeholders).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/rclone-proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/coder/rclone-proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backup/acme-prd-bdo1-talos-apps-01/coder/coder-db
    target:
      kind: HelmRelease
      name: rclone-sync-coder-db
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Cluster
      name: coder-db
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: coder.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: coder-redirect
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: coder.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: coder
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.coder.home-ops.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: coder-workspaces
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.coder.home-ops.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: coder-workspaces-redirect
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "coder.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: coder-root
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.coder.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: coder-wildcard
  # Prd Coder URLs, OIDC issuer, mail domain, sign-in text.
  - patch: |
      - op: replace
        path: /spec/values/coder/env/0/value
        value: https://coder.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/1/value
        value: "*.coder.home-ops.yansyah.my.id"
      - op: replace
        path: /spec/values/coder/env/4/value
        value: https://zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/8/value
        value: home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/10/value
        value: Sign in with home-ops SSO
    target:
      kind: HelmRelease
      name: coder
