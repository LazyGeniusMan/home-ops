apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # No coder-oidc vault patches: client_id + client_secret flow end-to-end
  # from the coder-sso outputs Secret via the in-cluster `coder-k8s`
  # SecretStore (base/coder-secrets.yaml) — no Proton Pass seeding.
  # Dev Coder SSO Terraform identity: vault ref for the shared instance JWT
  # key + CR vars (dev issuer host, dev emails, dev app host). org_id and
  # user IDs come from the zitadel bootstrap remote-state outputs (no var).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/zitadel/terraform-jwt-profile-json
    target:
      kind: ExternalSecret
      name: coder-terraform-vars
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: zitadel.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/1/value
        value: admin@homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: user@homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/3/value
        value: coder.homelab-dev.yansyah.my.id
    target:
      kind: Terraform
      name: coder-sso
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/coder/db-connection-url
    target:
      kind: ExternalSecret
      name: coder-db-credentials
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/coder/db-password
    target:
      kind: ExternalSecret
      name: coder-db-app-secret
  # (S3 keys are COSI-minted via the cosi-cnpg ClusterSecretStore — no
  # per-env vault ref patch for cnpg-s3-credentials.)
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Cluster
      name: coder-db
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: coder.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: coder-redirect
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: coder.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: coder
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.coder.homelab-dev.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: coder-workspaces
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.coder.homelab-dev.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: coder-workspaces-redirect
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "coder.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: coder-root
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.coder.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: coder-wildcard
  # Dev Coder URLs, OIDC issuer, mail domain, sign-in text.
  - patch: |
      - op: replace
        path: /spec/values/coder/env/0/value
        value: https://coder.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/1/value
        value: "*.coder.homelab-dev.yansyah.my.id"
      - op: replace
        path: /spec/values/coder/env/4/value
        value: https://zitadel.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/8/value
        value: homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/10/value
        value: Sign in with homelab-dev SSO
    target:
      kind: HelmRelease
      name: coder
