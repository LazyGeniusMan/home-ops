apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # No coder-oidc vault patches: client_id + client_secret flow end-to-end
  # from the coder-sso outputs Secret via the in-cluster `coder-k8s`
  # SecretStore (base/coder-secrets.yaml) — no Proton Pass seeding.
  # Dev Coder SSO Terraform identity: CR vars (dev issuer host, dev redirect
  # URIs). Provider auth (jwt_profile_json) + org_id + admin_user_id all
  # mirror from the FirstInstance handoff via the cross-namespace
  # `coder-zitadel` SecretStore (base/terraform.yaml) — no vault ref patch,
  # no pass:// JWT seeding, no per-env ID literals. project_name,
  # create_user_role, user_emails, create_cookie_secret are env-invariant —
  # only hosts vary per env. Positional: /spec/vars/0 (domain) +
  # /spec/vars/2 (login_base_uri) + /spec/vars/3/value/0 (redirect) +
  # /spec/vars/4/value/0 (post-logout).
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: https://login.zitadel.homelab-dev.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/3/value/0
        value: https://coder.homelab-dev.yansyah.my.id/*
      - op: replace
        path: /spec/vars/4/value/0
        value: https://coder.homelab-dev.yansyah.my.id/
    target:
      kind: Terraform
      name: coder-sso
  - patch: |
      # coder-db-credentials composes the full URI in ESO template from this
      # single db-password source (same field as coder-db-app-secret below).
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/coder/db-password
    target:
      kind: ExternalSecret
      name: coder-db-credentials
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/coder/db-password
    target:
      kind: ExternalSecret
      name: coder-db-app-secret
  # Dev coder-owned Matrix notifier credential (DECOUPLED — coder/matrix-*
  # vault paths, NOT matrix-rooms; base holds __PROTON_PASS_BASE__
  # placeholders; both data entries patched).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/coder/matrix-bot-token
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/coder/matrix-host
    target:
      kind: ExternalSecret
      name: matrix-notify
  # (S3 keys are COSI-minted via the coder-cosi SecretStore — no
  # per-env vault ref patch for cnpg-s3-credentials, rclone-coder-db-s3,
  # or rclone-coder-db-s3-path.)
  # Dev rclone-sync-coder-db identity: Proton Pass vault keys + the Proton
  # Drive destination cluster segment (base holds __PROTON_PASS_BASE__ /
  # __CLUSTER_NAME__ placeholders).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/coder/rclone-proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/coder/rclone-proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backup/acme-dev-bdo1-talos-apps-01/coder/coder-db
    target:
      kind: HelmRelease
      name: rclone-sync-coder-db
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Cluster
      name: coder-db
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: coder.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: coder-redirect
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: coder.homelab-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: coder
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.coder.homelab-dev.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: coder-workspaces
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: "*.coder.homelab-dev.yansyah.my.id"
    target:
      kind: HTTPRoute
      name: coder-workspaces-redirect
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "coder.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: coder-root
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.coder.homelab-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: coder-wildcard
  # Dev Coder URLs, OIDC issuer, mail domain, sign-in text.
  - patch: |
      - op: replace
        path: /spec/values/coder/env/0/value
        value: https://coder.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/1/value
        value: "*.coder.homelab-dev.yansyah.my.id"
      - op: replace
        path: /spec/values/coder/env/4/value
        value: https://admin.zitadel.homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/8/value
        value: homelab-dev.yansyah.my.id
      - op: replace
        path: /spec/values/coder/env/10/value
        value: Sign in with homelab-dev SSO
    target:
      kind: HelmRelease
      name: coder
  # Dev replica counts: minimal single-replica footprint. Static
  # `coder.replicaCount` stays at the HPA min (chart 2.37.0 has no
  # autoscaling knob); the HPA below scales 1-2 on CPU.
  - patch: |
      - op: replace
        path: /spec/values/coder/replicaCount
        value: 1
    target:
      kind: HelmRelease
      name: coder
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: coder
  - patch: |
      - op: replace
        path: /spec/instances
        value: 1
    target:
      kind: Cluster
      name: coder-db
