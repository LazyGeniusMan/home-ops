# Coder secrets (§13.6). Git holds remoteRefs only, never values.
# - coder-oidc: the Zitadel `coder` client credentials (client_id +
#   client_secret, both generated server-side). They flow end-to-end from
#   stored outputs: the `coder-sso` Terraform module outputs them into the
#   `coder-sso-outputs` Secret (CR writeOutputsToSecret), and this
#   ExternalSecret consumes BOTH keys from that Secret through the
#   in-cluster `coder-k8s` SecretStore below (ESO Kubernetes provider —
#   first in-repo usage; the repo otherwise only has the `proton-pass`
#   ClusterSecretStore). NO pass:// seeding for OIDC creds. One
#   ExternalSecret = one store, so coder-oidc points at `coder-k8s` only.
#   Consumed via CODER_OIDC_CLIENT_ID (secretKeyRef) +
#   CODER_OIDC_CLIENT_SECRET in base/coder.yaml. The client itself is owned
#   by this app's `coder-sso` Terraform CR (base/terraform.yaml), NOT the
#   central zitadel module. The writeOutputsToSecret Secret stores outputs
#   base64-encoded under their output names (`client_id`, `client_secret`);
#   the `property` fields below map those onto the secretKeyRef keys
#   (`client-id`, `client-secret`) the HelmRelease expects.
# - coder-k8s (SecretStore): reads Secrets in THIS namespace via the
#   `eso-k8s-reader` ServiceAccount (Role: secrets get/list/watch +
#   selfsubjectrulesreviews create, in-namespace only). Same-cluster read,
#   so `server.url` is omitted (defaults to kubernetes.default) and the
#   in-namespace `kube-root-ca.crt` ConfigMap supplies the API CA.
# - coder-db-credentials: full connection URL for the §10.1 CNPG instance in
#   coder-db.yaml (key "connection-url", e.g.
#   postgres://coder:<pw>@coder-db-rw.coder.svc:5432/coder?sslmode=require).
#   The app user password MUST match password: in coder-db-app-secret below.
#   sslmode=require: CNPG serves TLS with a self-signed cert the app cannot
#   verify, so verify-full is impossible; require still encrypts in transit
#   (same trade-off as the upstream TLS-without-verification recipe).
# - coder-db-app-secret: CNPG initdb app-user secret (basic-auth, ESO-managed
#   so Git holds refs only): username MUST equal spec.bootstrap.initdb.owner
#   (upstream contract) and the password MUST match the password embedded in
#   the connection URL above — seed both vault entries with the same value
#   via pass-cli and rotate them together.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: coder-k8s
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
spec:
  provider:
    kubernetes:
      remoteNamespace: coder
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: coder-k8s
    kind: SecretStore
  target:
    name: coder-oidc
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: coder-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: coder-sso-outputs
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-db-credentials
    template:
      data:
        connection-url: "{{ .connectionUrl }}"
  data:
    - secretKey: connectionUrl
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/db-connection-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-db-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: coder
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/db-password
