# Coder secrets: Git holds remoteRefs only. `coder-oidc` consumes the
# server-generated client id + secret from `coder-sso-outputs` via `coder-k8s`
# (no pass:// seeding; `property` maps `client_id`/`client_secret` onto
# `client-id`/`client-secret`). `coder-db-credentials` composes the connection URL
# from the single `.../coder/db-password` field shared with `coder-db-app-secret`
# (username MUST equal `initdb.owner`). `matrix-notify` composes `webhook-endpoint`
# + `apprise-urls` from the matrix kept Secret via `coder-matrix` (room literal).
# Zero vault refs for OIDC/matrix. `__PROTON_PASS_BASE__` is overlay-replaced.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: coder-k8s
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
spec:
  provider:
    kubernetes:
      remoteNamespace: coder
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: coder-k8s
    kind: SecretStore
  target:
    name: coder-oidc
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: coder-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: coder-sso-outputs
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-db-credentials
    template:
      data:
        connection-url: "postgres://coder:{{ .password }}@coder-db-rw.coder.svc:5432/coder?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-db-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: coder
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/db-password
---
# Cross-namespace handoff mirror: `matrix` namespace kept Secret into
# `matrix-notify` via the `coder-matrix` store (RBAC in
# `coder-matrix-handoff-rbac.yaml`). `server.url` omitted (kubernetes.default).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-matrix-handoff-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: coder-matrix
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
spec:
  provider:
    kubernetes:
      remoteNamespace: matrix
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-matrix-handoff-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-notify
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: coder-matrix
    kind: SecretStore
  target:
    name: matrix-notify
    template:
      engineVersion: v2
      data:
        # Bare per-request apprise URL (also the operator/injector handle).
        apprise-urls: "matrixs://{{ .botToken }}@{{ .matrixHost }}/%23coder-notifications?overflow=split&e2ee=false"
        # Full CODER_NOTIFICATIONS_WEBHOOK_ENDPOINT value (sink base + pinned
        # type/format + urlquery-encoded `urls` form field).
        webhook-endpoint: "http://apprise-go-api.apprise-go-api.svc:80/notify/?type=info&format=text&urls={{ urlquery (print \"matrixs://\" .botToken \"@\" .matrixHost \"/%23coder-notifications?overflow=split&e2ee=false\") }}"
  data:
    - secretKey: botToken
      remoteRef:
        key: matrix-bot-bootstrap-outputs
        property: notifier-token
    - secretKey: matrixHost
      remoteRef:
        key: matrix-bot-bootstrap-outputs
        property: homeserver-host
