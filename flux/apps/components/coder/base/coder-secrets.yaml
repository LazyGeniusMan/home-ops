# Coder secrets (§13.6). Git holds remoteRefs only, never values.
# - coder-oidc: the Zitadel `coder` client credentials (client_id +
#   client_secret, both generated server-side). They flow end-to-end from
#   stored outputs: the `coder-sso` Terraform module outputs them into the
#   `coder-sso-outputs` Secret (CR writeOutputsToSecret), and this
#   ExternalSecret consumes BOTH keys from that Secret through the
#   in-cluster `coder-k8s` SecretStore below (ESO Kubernetes provider —
#   first in-repo usage; the repo otherwise only has the `proton-pass`
#   ClusterSecretStore). NO pass:// seeding for OIDC creds. One
#   ExternalSecret = one store, so coder-oidc points at `coder-k8s` only.
#   Consumed via CODER_OIDC_CLIENT_ID (secretKeyRef) +
#   CODER_OIDC_CLIENT_SECRET in base/coder.yaml. The client itself is owned
#   by this app's `coder-sso` Terraform CR (base/terraform.yaml), NOT the
#   central zitadel module. The writeOutputsToSecret Secret stores outputs
#   base64-encoded under their output names (`client_id`, `client_secret`);
#   the `property` fields below map those onto the secretKeyRef keys
#   (`client-id`, `client-secret`) the HelmRelease expects.
# - coder-k8s (SecretStore): reads Secrets in THIS namespace via the
#   `eso-k8s-reader` ServiceAccount (Role: secrets get/list/watch +
#   selfsubjectrulesreviews create, in-namespace only). Same-cluster read,
#   so `server.url` is omitted (defaults to kubernetes.default) and the
#   in-namespace `kube-root-ca.crt` ConfigMap supplies the API CA.
# - coder-db-credentials: full connection URL for the §10.1 CNPG instance in
#   coder-db.yaml (key "connection-url", e.g.
#   postgres://coder:<pw>@coder-db-rw.coder.svc:5432/coder?sslmode=require).
#   The URI is COMPOSED here in ESO target.template from literal parts
#   (user coder, host coder-db-rw.coder.svc, port 5432, db coder,
#   sslmode=require) plus the app-user password pulled from the SINGLE
#   vault field .../coder/db-password — the same field consumed by
#   coder-db-app-secret below. One password source, no dual-write.
#   sslmode=require: CNPG serves TLS with a self-signed cert the app cannot
#   verify, so verify-full is impossible; require still encrypts in transit
#   (same trade-off as the upstream TLS-without-verification recipe).
# - coder-db-app-secret: CNPG initdb app-user secret (basic-auth, ESO-managed
#   so Git holds refs only): username MUST equal spec.bootstrap.initdb.owner
#   (upstream contract) and the password comes from the same
#   .../coder/db-password vault field the connection URL above is composed
#   from — seed it once via pass-cli and rotate in one place.
# - matrix-notify: coder-owned Matrix notifier credential (DECOUPLED — the
#   matrix tenant carries NO coder leg; the matrix fallback holds
#   flux/tofu/team legs only). Composes the FULL coder webhook endpoint in
#   ESO `target.template` from coder-owned vault fields (NEW vault paths
#   under coder/, NOT matrix-rooms — see VAULT-SEEDS):
#   - `coder/matrix-bot-token` (per-env notifier bot token, the `{token}`
#     half of the matrixs:// URL)
#   - `coder/matrix-host` (bare homeserver host, NO scheme — the scheme +
#     `matrixs://` prefix is literal in the template)
#   Two composed keys (same Secret `matrix-notify`):
#   - `webhook-endpoint`: the COMPLETE CODER_NOTIFICATIONS_WEBHOOK_ENDPOINT
#     value — sink base + `type=info&format=text` + the matrixs:// notifier
#     URL carried inline (URL-encoded form). The HelmRelease reads it via
#     valueFrom.secretKeyRef (plain env strings are the ONLY interpolation
#     the chart offers — hence ESO `template:` composes the whole string).
#   - `apprise-urls`: the BARE matrixs:// notifier URL (same composition,
#     no sink prefix) for the documented injector follow-up / operator use.
#   Room alias `coder-notifications` stays literal (public
#   directory name, NOT a secret); `overflow=split&e2ee=false` match the
#   matrix-tenant legs' posture (split tails, plaintext — the stateless
#   sink cannot do E2EE). Data-flow trace:
#   vault coder/matrix-{bot-token,host} -> ES matrix-notify (this file) ->
#   Secret matrix-notify (keys webhook-endpoint + apprise-urls) ->
#   HelmRelease env valueFrom -> sink per-request `urls` (body).
#   Zero matrix-rooms vault refs in this namespace.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: coder-k8s
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
spec:
  provider:
    kubernetes:
      remoteNamespace: coder
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: coder-k8s
    kind: SecretStore
  target:
    name: coder-oidc
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: coder-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: coder-sso-outputs
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-db-credentials
    template:
      data:
        connection-url: "postgres://coder:{{ .password }}@coder-db-rw.coder.svc:5432/coder?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-db-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: coder
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-notify
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: matrix-notify
    template:
      engineVersion: v2
      data:
        # Bare per-request apprise URL (body `urls` contract) — also the
        # operator/injector handle. sprig urlquery percent-encodes the
        # matrixs value for the endpoint composition below.
        apprise-urls: "matrixs://{{ .botToken }}@{{ .matrixHost }}/%23coder-notifications?overflow=split&e2ee=false"
        # Full CODER_NOTIFICATIONS_WEBHOOK_ENDPOINT value: sink base +
        # pinned type/format + the notifier URL inline as a urlquery-encoded
        # `urls` form field. No `tag=` — body urls select the target
        # directly, no fallback involved.
        webhook-endpoint: "http://apprise-go-api.apprise-go-api.svc:80/notify/?type=info&format=text&urls={{ urlquery (print \"matrixs://\" .botToken \"@\" .matrixHost \"/%23coder-notifications?overflow=split&e2ee=false\") }}"
  data:
    - secretKey: botToken
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/matrix-bot-token
    - secretKey: matrixHost
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/matrix-host
