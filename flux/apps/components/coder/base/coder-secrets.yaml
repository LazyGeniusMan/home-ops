# Coder secrets (§13.6). All synced by ESO from Proton Pass — Git holds
# remoteRefs only, never values. Seed each vault entry with pass-cli.
# - coder-oidc: the Zitadel `coder` client credentials — client-id (generated
#   server-side; read the `client_id` output after apply, or from the
#   `coder-sso-outputs` Secret) into
#   __PROTON_PASS_BASE__/coder/oidc-client-id, and the client secret (read
#   from the tofu state, never Git) into
#   __PROTON_PASS_BASE__/coder/oidc-client-secret. Consumed via
#   CODER_OIDC_CLIENT_ID (secretKeyRef) + CODER_OIDC_CLIENT_SECRET in
#   base/coder.yaml. The client itself is owned by this app's `coder-sso`
#   Terraform CR (base/terraform.yaml), NOT the central zitadel module.
# - coder-db-credentials: full connection URL for the §10.1 CNPG instance in
#   coder-db.yaml (key "connection-url", e.g.
#   postgres://coder:<pw>@coder-db-rw.coder.svc:5432/coder?sslmode=require).
#   The app user password MUST match password: in coder-db-app-secret below.
#   sslmode=require: CNPG serves TLS with a self-signed cert the app cannot
#   verify, so verify-full is impossible; require still encrypts in transit
#   (same trade-off as the upstream TLS-without-verification recipe).
# - coder-db-app-secret: CNPG initdb app-user secret (basic-auth, ESO-managed
#   so Git holds refs only): username MUST equal spec.bootstrap.initdb.owner
#   (upstream contract) and the password MUST match the password embedded in
#   the connection URL above — seed both vault entries with the same value
#   via pass-cli and rotate them together.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-oidc
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/oidc-client-secret
    - secretKey: clientId
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/oidc-client-id
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-db-credentials
    template:
      data:
        connection-url: "{{ .connectionUrl }}"
  data:
    - secretKey: connectionUrl
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/db-connection-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: coder-db-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: coder
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/db-password
