# COSI credential bridge: in-namespace `coder-cosi` SecretStore reading the
# COSI BucketInfo JSON via the shared `eso-k8s-reader` SA (ships in
# coder-secrets.yaml; also backs `coder-k8s`). `server.url` omitted
# (kubernetes.default); `kube-root-ca.crt` supplies the API CA. Consumers use
# GJSON `property` on `BucketInfo.spec.secretS3`.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: coder-cosi
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
spec:
  provider:
    kubernetes:
      remoteNamespace: coder
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
