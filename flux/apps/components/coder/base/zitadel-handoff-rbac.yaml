# Cross-namespace handoff grant: lets this namespace's `eso-zitadel-handoff-reader`
# SA read the two Zitadel handoff Secrets via the `coder-zitadel` SecretStore
# (terraform.yaml). Role + RoleBinding carry `namespace: zitadel` but are owned by
# this component (ship here so they prune with the app).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zitadel-bootstrap-credentials", "zitadel-bootstrap-outputs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
subjects:
  - kind: ServiceAccount
    name: eso-zitadel-handoff-reader
    namespace: coder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-zitadel-handoff-reader
