# HPA over the chart-rendered `coder` Deployment (CPU 70% only — memory churn on
# coderd is expensive). `coder.replicaCount` stays at the env min; base
# `replicas: 1` is the create-time seed. `min/maxReplicas` are placeholders —
# overlays set dev 1/2, prd 2/4.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coder
  minReplicas: 1 # placeholder - overridden by dev/prd
  maxReplicas: 2 # placeholder - overridden by dev/prd
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
