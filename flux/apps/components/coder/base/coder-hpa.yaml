# Coder HPA (autoscaling/v2 over the chart-rendered Deployment `coder`).
# The chart has no autoscaling knob (only `coder.replicaCount`, default 1),
# so the HPA lives here and `coder.replicaCount` stays at the env min
# (dev 1 / prd 2 via overlay patches). Dev min 1/max 2, prd min 2/max 4.
# CPU-only (no memory metric): memory-driven churn on coderd pods is
# expensive. CPU requests exist by chart default, so HPA works.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coder
  minReplicas: 1 # placeholder - overridden by dev/prd
  maxReplicas: 2 # placeholder - overridden by dev/prd
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
