# VPA recommender for the coder Deployment (HPA-paired): updateMode Off —
# recommender-only, because the HPA scales CPU (coder-hpa.yaml: single
# Resource metric cpu @70% — CPU-only verified, no memory metric), and
# controlledResources [memory] splits the axes per faq.md (memory-only VPA +
# CPU-based HPA is the sanctioned pattern; known-limitations.md: never
# VPA-apply on a resource HPA scales on).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: coder
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coder
  updatePolicy:
    updateMode: 'Off'
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        controlledResources: ['memory']
