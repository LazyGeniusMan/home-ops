# VPA recommender for the HPA-paired `coder` Deployment: updateMode Off,
# memory-only (`controlledResources: [memory]`) — never VPA-apply on CPU,
# which the HPA scales.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: coder
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coder
  updatePolicy:
    updateMode: 'Off'
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        controlledResources: ['memory']
