# COSI-managed bucket for the coder-db Postgres backups (colocated with the
# consuming component — lands in the `coder` tenant namespace via the Fleet
# `apps` Kustomization's `targetNamespace`).
# - Claim uses BucketClass/seaweedfs, protocol S3. The central controller
#   creates the cluster-scoped Bucket; the driver (DriverCreateBucket =
#   req.GetName()) provisions the live bucket in SeaweedFS under a
#   controller-generated name (`bc-<uuid>`) — claim/access names do NOT map
#   to pre-existing bucket names, so `spec.existingBucketName` is
#   intentionally unset. Read the live name from the claim's
#   `status.bucketName` once `status.bucketReady` is true.
# - Existing out-of-band bucket `cnpg-backups` keeps serving traffic until
#   cutover: the coder-db barmanObjectStore `destinationPath`
#   (`s3://cnpg-backups/coder/`) keeps pointing at the legacy bucket; copy
#   data to the COSI-provisioned bucket (see cosi README "Bucket cutover"),
#   then repoint `destinationPath`. Do NOT break existing backups — the
#   endpoint switch keeps working against the legacy bucket; this claim is
#   the migration path.
# - The BucketAccess (BucketAccessClass/seaweedfs-key, authenticationType
#   KEY) mints S3 keys into its `credentialsSecretName` Secret in THIS
#   namespace as a `BucketInfo` JSON file (secretS3.endpoint/region/
#   accessKeyID/accessSecretKey). The driver hands back the INTERNAL
#   endpoint (http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333).
# - Credential bridge: coder-db's `cnpg-s3-credentials` ExternalSecret (in
#   coder-db.yaml) reads through the in-namespace `coder-cosi` SecretStore
#   (cosi-keys.yaml) — GJSON `property` extracts
#   spec.secretS3.accessKeyID/accessSecretKey.
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: coder-db
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: coder-db-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: coder-db
  credentialsSecretName: coder-db-cosi-creds
  protocol: S3
