# COSI bucket for coder-db backups (claim `coder-db`, BucketClass/seaweedfs,
# S3): live name is controller-generated (`bc-<uuid>`, read from
# `status.bucketName`); `spec.existingBucketName` stays unset. S3 prefix must
# exist before the first Cluster starts (CNPG never creates buckets). Keys bridge
# via `coder-cosi` (cosi-keys.yaml) BucketInfo JSON.
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: coder-db
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: coder-db-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: coder-db
  credentialsSecretName: coder-db-cosi-creds
  protocol: S3
