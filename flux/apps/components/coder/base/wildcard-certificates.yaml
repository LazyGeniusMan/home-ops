# In-namespace Certificates (cert-manager Secrets are namespace-local): `coder-root`
# mints `__WILDCARD_TLS_SECRET__` for `__SERVICE_HOST__`, wildcard
# `__WILDCARD_CERT_NAME__` mints `__WILDCARD_TLS_SECRET__` for
# `*.coder.__BASE_DOMAIN__` — two certs because one wildcard covers a single
# label only (nested workspace subdomains need the second). Both via
# ClusterIssuer/letsencrypt DNS-01; issuance uses DNS-01 TXT, A records ride
# external-dns. Placeholders are overlay-replaced.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: coder-root
spec:
  secretName: __WILDCARD_TLS_SECRET__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "__SERVICE_HOST__"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __WILDCARD_CERT_NAME__
spec:
  secretName: __WILDCARD_TLS_SECRET__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.coder.__BASE_DOMAIN__"
