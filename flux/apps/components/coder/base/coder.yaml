# Coder remote dev environments (coderd + in-cluster provisioner). Chart
# `oci://ghcr.io/coder/chart/coder` 2.37.3 / app v2.37.3 (chart<->app lockstep —
# bump together; markers `apps:coder-chart:tag` + `apps:coder:tag`). Telemetry off
# (`CODER_TELEMETRY_ENABLE=false`). No ServiceMonitor until monitoring CRDs land
# (`CODER_PROMETHEUS_ENABLE` unset; health via kube-state-metrics). Placeholders
# `__SERVICE_HOST__`, `__BASE_DOMAIN__`, `__ZITADEL_ISSUER_URL__`,
# `__EMAIL_DOMAIN__`, `__SSO_SIGN_IN_TEXT__` are overlay-replaced.
# https://coder.com/docs/install/kubernetes
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coder-chart
spec:
  interval: 1h
  url: oci://ghcr.io/coder/chart/coder
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 2.37.3 # {"$imagepolicy": "apps:coder-chart:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
spec:
  interval: 1h
  releaseName: coder
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: coder-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    coder:
      replicaCount: 1 # placeholder - overridden by dev/prd
      image:
        repo: ghcr.io/coder/coder
        tag: v2.37.3 # {"$imagepolicy": "apps:coder:tag"}
        pullPolicy: IfNotPresent
      # ClusterIP (Gateway routes to the Service); chart-managed routing stays off
      # (HTTPRoutes in coder-httproutes.yaml).
      service:
        enable: true
        type: ClusterIP
      ingress:
        enable: false
      httproute:
        enable: false
      listenerset:
        enable: false
      envUseClusterAccessURL: false
      env:
        - name: CODER_ACCESS_URL
          value: https://__SERVICE_HOST__
        - name: CODER_WILDCARD_ACCESS_URL
          value: "*.coder.__BASE_DOMAIN__"
        - name: CODER_TELEMETRY_ENABLE
          value: "false"
        # Database: CNPG instance in coder-db.yaml (key `connection-url`,
        # `sslmode=require` — self-signed cert, still encrypted in transit).
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
            secretKeyRef:
              name: coder-db-credentials
              key: connection-url
        # Direct OIDC against Zitadel (no oauth2-proxy; Coder speaks OIDC
        # natively). Client id + secret come from ESO (server-generated by the
        # `coder-sso` Terraform CR, never a literal). Callback
        # `https://__SERVICE_HOST__/api/v2/users/oidc/callback` is covered by
        # the registered redirect `https://__SERVICE_HOST__/*`.
        - name: CODER_OIDC_ISSUER_URL
          value: __ZITADEL_ISSUER_URL__
        - name: CODER_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: coder-oidc
              key: client-id
        - name: CODER_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: coder-oidc
              key: client-secret
        - name: CODER_OIDC_SCOPES
          value: openid,profile,email,groups
        - name: CODER_OIDC_EMAIL_DOMAIN
          value: __EMAIL_DOMAIN__
        # Group allowlist: only `coder-admin` + `coder-user` members may sign in
        # (`groups` claim needs no groupField override — upstream default applies).
        - name: CODER_OIDC_ALLOWED_GROUPS
          value: coder-admin,coder-user
        - name: CODER_OIDC_SIGN_IN_TEXT
          value: __SSO_SIGN_IN_TEXT__
        # Notifications: single global webhook into the infra apprise-go-api sink
        # (`http://apprise-go-api.apprise-go-api.svc:80/notify`). Coder owns the
        # matrix credential end-to-end (no matrix-tenant leg, no apprise-coder
        # Provider). ESO `matrix-notify` (coder-secrets.yaml) templates the full
        # endpoint from the matrix bot bootstrap kept Secret; the endpoint below
        # reads it via secretKeyRef. `CODER_MATRIX_APPRISE_URLS` exposes the bare
        # matrixs:// URL for injector/operator use. Room `coder-notifications`
        # stays literal (public name, not a secret). Known gap: the sink reads
        # `urls` from the POST body only and coderd posts a fixed title/body
        # payload, so posts return 204 without a visible message (see matrix
        # NOTIFICATIONS.md). Appended LAST so overlay positional env patches
        # (/env/0, /1, /4, /8, /10) keep their indices.
        - name: CODER_NOTIFICATIONS_METHOD
          value: webhook
        - name: CODER_NOTIFICATIONS_WEBHOOK_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: matrix-notify
              key: webhook-endpoint
        - name: CODER_MATRIX_APPRISE_URLS
          valueFrom:
            secretKeyRef:
              name: matrix-notify
              key: apprise-urls
