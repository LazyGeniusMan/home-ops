# Coder v2.37.3 remote dev environments (§13.6): self-hosted workspaces on the
# Talos cluster (coderd + in-cluster provisioner via the chart service account).
# Chart: classic HelmRepository https://helm.coder.com/v2, chart coder 2.37.3
# (NO OCI index exists upstream — `helm show chart` 403s on every ghcr.io/coder
# path and registry.coder.com carries no chart; verified at authoring time. So
# the chart version below is bumped manually while the APP image auto-tracks
# flux/apps/update-policies/coder.yaml via the $imagepolicy marker — same
# split as the seaweedfs component).
# Telemetry: CODER_TELEMETRY_ENABLE=false below (evidence: the pulled chart
# values.yaml documents `telemetry.enable` defaulting true; we override it).
# Monitoring: the chart exposes no ServiceMonitor objects and we ship none —
# unguarded monitors OFF until monitoring.coreos.com CRDs land (same §9
# deviation). CODER_PROMETHEUS_ENABLE stays unset (default off); coderd health
# via kube-state-metrics meanwhile.
# Ordering: the OIDC/DSN ExternalSecrets live alongside the release in this
# same Kustomization, so the first install attempt pends until ESO syncs them
# and Flux retries (RetryOnFailure below).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: coder
spec:
  interval: 1h
  url: https://helm.coder.com/v2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
spec:
  interval: 1h
  releaseName: coder
  serviceAccountName: flux
  chart:
    spec:
      chart: coder
      version: 2.37.3
      sourceRef:
        kind: HelmRepository
        name: coder
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://coder.com/docs/install/kubernetes
  values:
    coder:
      # Chart schema `coder.replicaCount` (default 1; HA needs >1 + Enterprise).
      replicaCount: 1 # placeholder - overridden by dev/prd
      image:
        repo: ghcr.io/coder/coder
        tag: v2.37.3 # {"$imagepolicy": "apps:coder:tag"}
        pullPolicy: IfNotPresent
      # ClusterIP: the §8.1 Gateway routes to the Service; no cloud LB.
      service:
        enable: true
        type: ClusterIP
      # No chart-managed routing: HTTPRoutes are hand-written in
      # base/coder-httproutes.yaml (own the §8.1 pattern explicitly).
      ingress:
        enable: false
      httproute:
        enable: false
      listenerset:
        enable: false
      envUseClusterAccessURL: false
      env:
        - name: CODER_ACCESS_URL
          value: https://__SERVICE_HOST__
        - name: CODER_WILDCARD_ACCESS_URL
          value: "*.coder.__BASE_DOMAIN__"
        - name: CODER_TELEMETRY_ENABLE
          value: "false"
        # Database: the §10.1 CNPG instance in base/coder-db.yaml
        # (key "connection-url", sslmode=require — same self-signed trade-off
        # as the zitadel component).
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
            secretKeyRef:
              name: coder-db-credentials
              key: connection-url
        # Direct OIDC against Zitadel (§11.1, NO oauth2-proxy — Coder speaks
        # OIDC natively). Issuer/client/scopes per the locked contract; the
        # client id + secret come from ESO (base/coder-secrets.yaml — the
        # client_id is generated server-side by this app's `coder-sso`
        # Terraform CR, never the literal name).
        # Callback https://__SERVICE_HOST__/api/v2/users/oidc/callback
        # is covered by the locked redirect https://__SERVICE_HOST__/*.
        - name: CODER_OIDC_ISSUER_URL
          value: __ZITADEL_ISSUER_URL__
        - name: CODER_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: coder-oidc
              key: client-id
        - name: CODER_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: coder-oidc
              key: client-secret
        - name: CODER_OIDC_SCOPES
          value: openid,profile,email,groups
        - name: CODER_OIDC_EMAIL_DOMAIN
          value: __EMAIL_DOMAIN__
        # Group allowlist (locked): only Zitadel `coder-admin` + `coder-user`
        # role members may sign in (project-scoped roles owned by this app's
        # `coder-sso` Terraform CR). The `groups` claim needs no groupField
        # override (the scope and the claim share the name `groups` —
        # upstream default applies).
        - name: CODER_OIDC_ALLOWED_GROUPS
          value: coder-admin,coder-user
        - name: CODER_OIDC_SIGN_IN_TEXT
          value: __SSO_SIGN_IN_TEXT__
        # Notifications: single global unsigned webhook into the infra
        # apprise-go-api sink (in-cluster DNS
        # http://apprise-go-api.apprise-go-api.svc:80/notify — workload lives
        # in the infra namespace). DECOUPLED: coder owns its matrix
        # credential end-to-end (NO matrix-tenant fallback leg, NO
        # apprise-coder Provider — both removed; flux/tofu/team legs stay
        # matrix-owned). Coder posts its fixed payload (top-level
        # title/body) to ONE endpoint, so every event fans into
        # #coder-notifications (per-event routing is Premium-only). No remap
        # query params: title + body already match apprise field names (bare
        # mapping). Appended LAST so the dev/prd overlay positional env
        # patches (/env/0, /1, /4, /8, /10) keep their indices.
        # Credential path (DECOUPLED end-state — verified against the sink
        # contract in projects/apprise-go-api/internal/server/notify.go +
        # internal/remap/remap.go): `urls` is BODY-ONLY (JSON `urls` key or
        # form field — NO `?urls=` query fallback exists; query fallbacks
        # cover tag/tags/format/type/title only), and the remap engine
        # cannot constant-assign onto `urls` (constant rules assign onto the
        # SOURCE name, never the target). Coder's payload is FIXED
        # (title/body only — cannot add a urls field), so the credential
        # CANNOT ride the POST body from coderd itself. The seam the chart
        # DOES support: CODER_NOTIFICATIONS_WEBHOOK_ENDPOINT is a plain env
        # string, and HelmRelease chart env entries accept
        # valueFrom.secretKeyRef — so ESO `matrix-notify`
        # (base/coder-secrets.yaml) templates the FULL endpoint value from
        # the matrix bot bootstrap kept Secret (`notifier-token` +
        # `homeserver-host` via the `coder-matrix` SecretStore) and the
        # endpoint below reads it via secretKeyRef
        # (key `webhook-endpoint`). The composed endpoint is the sink base +
        # `type=info&format=text` + the matrixs:// notifier URL carried as a
        # URL-encoded `urls` FORM FIELD inside the endpoint's query string —
        # the sink decodes form bodies AND query-adjacent posts through the
        # same form path... precisely: the sink reads `urls` from the POST
        # body (form or JSON), NOT the query string — see the gap note in
        # NOTIFICATIONS.md for why the endpoint-embedded form still needs
        # the documented injector follow-up, and why this split (kept Secret
        # -> coder ES -> coder env -> sink per-request urls, zero vault +
        # zero matrix-tenant secret involved) is still the correct
        # decoupled
        # end-state versus silent centralization. `CODER_MATRIX_APPRISE_URLS`
        # (same Secret, key `apprise-urls`) exposes the BARE matrixs:// URL
        # for the injector / operator use. Room alias `coder-notifications`
        # stays literal (public directory name, NOT a secret).
        # GAP (documented, not silent): the sink reads `urls` from the POST
        # BODY only (notify.go decodePayload -> PostForm/JSON; the query
        # string supplies tag/tags/format/type/title fallbacks but NEVER
        # urls), and coderd POSTs a fixed JSON body (title/body) to the
        # endpoint URL as-is — a query-string `urls` is NOT promoted into
        # the body. So the ESO-composed endpoint delivers the credential to
        # the coder namespace (ownership split done), but live delivery
        # still needs the follow-up injector (sidecar or sink `?urls=`
        # query support — see NOTIFICATIONS.md). Until then Coder posts 204
        # VISIBLE (no silent centralization, no dead matrix leg).
        - name: CODER_NOTIFICATIONS_METHOD
          value: webhook
        - name: CODER_NOTIFICATIONS_WEBHOOK_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: matrix-notify
              key: webhook-endpoint
        - name: CODER_MATRIX_APPRISE_URLS
          valueFrom:
            secretKeyRef:
              name: matrix-notify
              key: apprise-urls
