# HTTPRoutes on the shared `main` Gateway (cross-namespace parentRef; chart-native
# routing stays off): dashboard (`__SERVICE_HOST__` → coder `:80`, covers UI, API,
# and the OIDC callback) + workspaces (`*.coder.__BASE_DOMAIN__` → same Service;
# coderd multiplexes by subdomain, one route covers all workspaces incl. nested
# app subdomains) + HTTP→HTTPS 301 redirects for both hostnames.
# `__SERVICE_HOST__` / `__BASE_DOMAIN__` are overlay-replaced placeholders.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-redirect
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - __SERVICE_HOST__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SERVICE_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coder
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-workspaces
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - "*.coder.__BASE_DOMAIN__"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coder
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-workspaces-redirect
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - "*.coder.__BASE_DOMAIN__"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

