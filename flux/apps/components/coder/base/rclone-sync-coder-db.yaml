# S3 -> Proton Drive backup of the `coder-db` COSI bucket (daily 03:15, `sync`,
# `concurrencyPolicy: Forbid`). Live bucket name templates from BucketInfo
# `spec.bucketName` via `rclone-coder-db-s3-path` (never hardcoded); S3 keys via
# `coder-cosi`, Proton creds via `rclone-proton-credentials` (consumed via
# `esoRef`). Seed pass://<cluster>/coder/rclone-proton-{username (plain),password
# (rclone-obscured)}; optional mailbox-password/otp-secret-key are obscured too.
# `__PROTON_PASS_BASE__` / `__CLUSTER_NAME__` are overlay-replaced placeholders.
# Chart source: projects/helm-rclone-sync.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-coder-db-s3-path
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: coder-cosi
    kind: SecretStore
  target:
    name: rclone-coder-db-s3-path
    template:
      data:
        path: "{{ .bucketName }}/cnpg-backups/coder/"
  data:
    - secretKey: bucketName
      remoteRef:
        key: coder-db-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-coder-db-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: coder-cosi
    kind: SecretStore
  target:
    name: rclone-coder-db-s3
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: coder-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: coder-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-proton-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: rclone-proton-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/rclone-proton-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/coder/rclone-proton-password
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: helm-rclone-sync-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-rclone-sync
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Tag MUST equal Chart.yaml `version` in projects/helm-rclone-sync (bump
  # Chart.yaml + all six consumers together; no $imagepolicy marker — Helm
  # OCIRepositories are untracked by image automation).
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-sync-coder-db
spec:
  interval: 1h
  releaseName: rclone-sync-coder-db
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-rclone-sync
  values:
    schedule: "15 3 * * *"
    concurrencyPolicy: Forbid
    rclone:
      operation: sync
    source:
      type: s3
      remoteName: ""
      uri:
        esoRef:
          name: rclone-coder-db-s3-path
          key: path
      credentials:
        provider:
          value: AWS
        accessKeyId:
          esoRef:
            name: rclone-coder-db-s3
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: rclone-coder-db-s3
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      remoteName: ""
      uri:
        value: /home-ops/backups/__CLUSTER_NAME__/coder/coder-db
      credentials:
        username:
          esoRef:
            name: rclone-proton-credentials
            key: username
        password:
          esoRef:
            name: rclone-proton-credentials
            key: password
