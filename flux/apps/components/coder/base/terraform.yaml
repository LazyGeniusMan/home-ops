# Coder SSO identity (§13.6), machine-applied by Tofu Controller.
# Owns ONLY this app's slice: the `coder` Zitadel project + project-scoped
# roles (coder-admin/coder-user) + user grants + the `coder` OIDC client.
# Project-scoped means coder-admin NEVER implies org admin.
#
# Ordering: this object ships in the app Kustomization (fleet `apps`
# Kustomization dependsOn `infra-configs`), so it only reconciles after the
# Zitadel HelmRelease + FirstInstance setup Job are Ready. Terraform `dependsOn`
# is Terraform-CR-only upstream (checkDependencies resolves every entry as
# kind Terraform), so NO dependsOn entry here — the fleet ordering above is
# the mechanism.
# Upstream wiring: org_id + admin_user_id flow from the FirstInstance handoff
# (`zitadel-bootstrap-outputs` Secret in the `zitadel` namespace, operator-created
# once per the zitadel README runbook) via the ESO-synced `coder-terraform-vars`
# Secret (same-namespace `varsFrom` below — varsKeys renames handoff keys onto the
# module vars; the cross-namespace `coder-zitadel` SecretStore + narrow
# `coder-zitadel-handoff-reader` Role in `zitadel-handoff-rbac.yaml` do the
# mirroring). NO org_id literal in git, NO manual per-env fill, NO email lookups,
# NO remote-state read off the retired bootstrap state. Provider auth likewise
# flows from the chart handoff (`zitadel-bootstrap-credentials` key
# `jwt_profile_json`) through the same Secret. Same-namespace `varsFrom` CANNOT
# cross namespaces (no namespace field), which is why the ESO mirror + RBAC is
# the mechanism here.
# First-run prerequisite (zero-UI): chart setup Job mints the key + ESO mirrors
# both handoff Secrets. Without the mirrored `coder-terraform-vars` the CR
# retries on interval — no vault seeding, no console step.
# Backend: in-cluster Kubernetes default (state Secrets in the coder
# namespace) — no backendConfig needed. Drift detection stays on (default).
# Outputs: client_id + client_secret land in `coder-sso-outputs` (sensitive);
# the `coder-oidc` ExternalSecret consumes BOTH from that Secret through the
# in-cluster `coder-k8s` SecretStore (base/coder-secrets.yaml) — never Git,
# never Proton Pass.
---
# Cross-namespace handoff reader: mirrors the two chart-minted handoff Secrets
# from the `zitadel` namespace into this namespace's `coder-terraform-vars`
# Secret (remoteNamespace MUST be `zitadel` — ESO reads REMOTE secrets through
# this namespace's `eso-zitadel-handoff-reader` SA; the narrow Role + RoleBinding
# in `zitadel-handoff-rbac.yaml` grant get/list/watch on the two handoff Secrets
# only). Same pattern as the in-namespace `coder-k8s` store in coder-secrets.yaml
# (server.url omitted = kubernetes.default, kube-root-ca.crt supplies the API CA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-handoff-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: coder-zitadel
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-handoff-reader
---
# Zero-UI vars mirror: provider auth (`jwt_profile_json`) from the chart-kept
# `zitadel-bootstrap-credentials`, IDs (`org_id`, `admin_user_id`) from the
# operator-created `zitadel-bootstrap-outputs` — no Proton Pass seeding, no
# manual vault step. Keys land under the module var names so `varsFrom` below
# needs no varsKeys renames.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: coder-zitadel
    kind: SecretStore
  target:
    name: coder-terraform-vars
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: zitadel-bootstrap-credentials
        property: jwt_profile_json
    - secretKey: org_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: org_id
    - secretKey: admin_user_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: admin_user_id
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: coder-sso
spec:
  interval: 30m
  approvePlan: auto
  # App OCI artifact (same namespace, in-tenant `apps` OCIRepository):
  # the artifact packs the whole component dir, terraform/ included.
  sourceRef:
    kind: OCIRepository
    name: apps
  path: ./terraform
  # Plain (non-sensitive) per-env values; secrets come from varsFrom below.
  # varsFrom overrides vars on key collision (upstream GenerateVarsForTF).
  # Normal users ride `vars` as an HCL list (tofu-controller renders nested
  # YAML values as HCL — no JSON encoding needed). `user_emails` stays LAST:
  # the dev/prd overlays patch /spec/vars/0 (domain) + /spec/vars/1
  # (app_host) by position, so this entry must remain at index 2.
  # No `user_initial_password` var is set (Terraform default null = no
  # initial password): first sign-in goes through the Zitadel invite/reset
  # flow — never commit passwords; seed pass:// + ESO wiring only if a
  # shared initial password is ever wanted (same shape as the zitadel
  # bootstrap `admin_initial_password`).
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: app_host
      value: __SERVICE_HOST__
    - name: user_emails
      value:
        - git@yansyah.my.id
        - git@lazygeniusman.my.id
  varsFrom:
    - kind: Secret
      name: coder-terraform-vars
  writeOutputsToSecret:
    name: coder-sso-outputs
    outputs:
      - client_id
      - client_secret
