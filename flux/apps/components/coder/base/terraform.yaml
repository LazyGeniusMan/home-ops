# `coder` Zitadel project + `coder-admin`/`coder-user` roles + grants + OIDC client,
# machine-applied by Tofu Controller (project-scoped: never implies org admin).
# Fleet ordering (`apps` after `infra-configs`) is the only ordering — no Terraform
# `dependsOn`. IDs + provider auth mirror from the FirstInstance handoff via ESO
# (no org literal, no vault seeding). Outputs land in `coder-sso-outputs` (via
# `coder-k8s`, never Git/Pass). Upsert-only (`destroy` knobs false); in-cluster
# state; drift on. Placeholders overlay-replaced (vars patched by index — keep order).
---
# Cross-namespace handoff mirror: `zitadel` namespace handoff Secrets into
# `coder-terraform-vars` via the `coder-zitadel` store (RBAC in
# `zitadel-handoff-rbac.yaml`). `server.url` omitted (kubernetes.default).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-handoff-reader
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: coder-zitadel
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-handoff-reader
---
# Vars mirror: provider auth from `zitadel-bootstrap-credentials`, IDs from
# `zitadel-bootstrap-outputs` (keys land under module var names).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: coder-zitadel
    kind: SecretStore
  target:
    name: coder-terraform-vars
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: zitadel-bootstrap-credentials
        property: jwt_profile_json
    - secretKey: org_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: org_id
    - secretKey: admin_user_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: admin_user_id
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: coder-sso
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: `destroy` knobs stay false (default); no `tofu destroy` via Flux.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared zitadel SSO root (cross-namespace `infra` OCIRepository in `zitadel`,
  # path ./terraform). Secrets arrive via `varsFrom` (overrides `vars` on
  # collision). Redirect URIs fully rendered here (`__SERVICE_HOST__` replaced by
  # overlays). Vars patched by index in overlays (keep order). No
  # `user_initial_password` (default null = Zitadel invite/reset flow; never
  # commit passwords).
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: zitadel
  path: ./terraform
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: project_name
      value: coder
    - name: login_base_uri
      value: __ZITADEL_LOGIN_URI__
    - name: redirect_uris
      value:
        - https://__SERVICE_HOST__/*
    - name: post_logout_redirect_uris
      value:
        - https://__SERVICE_HOST__/
    - name: create_user_role
      value: "true"
    # `user_emails` is env-invariant (same humans in dev+prd; README mapping
    # table is the source of truth — never diverge via overlays).
    - name: user_emails
      value:
        - git@yansyah.my.id
        - git@lazygeniusman.my.id
    - name: create_cookie_secret
      value: "false"
  varsFrom:
    - kind: Secret
      name: coder-terraform-vars
  writeOutputsToSecret:
    name: coder-sso-outputs
    outputs:
      - client_id
      - client_secret
