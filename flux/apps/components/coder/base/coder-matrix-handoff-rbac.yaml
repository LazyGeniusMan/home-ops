# Cross-namespace handoff grant: lets this namespace's `eso-matrix-handoff-reader`
# SA read the matrix bot bootstrap kept Secret via the `coder-matrix` SecretStore
# (coder-secrets.yaml). Role + RoleBinding carry `namespace: matrix` but are owned
# by this component (ship here so they prune with the app).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-matrix-handoff-reader
  namespace: matrix
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["matrix-bot-bootstrap-outputs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-matrix-handoff-reader
  namespace: matrix
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/part-of: coder
subjects:
  - kind: ServiceAccount
    name: eso-matrix-handoff-reader
    namespace: coder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-matrix-handoff-reader
