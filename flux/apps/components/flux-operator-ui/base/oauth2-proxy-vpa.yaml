# VPA recommender for the flux-operator-ui oauth2-proxy Deployment
# (HPA-paired): updateMode Off — recommender-only, because the HPA scales
# the same CPU/memory metrics (known-limitations.md: never VPA-apply on a
# resource HPA scales on).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: oauth2-proxy
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oauth2-proxy
  updatePolicy:
    updateMode: 'Off'
