# Flux Operator UI SSO identity, machine-applied by Tofu Controller: the
# `flux-operator-ui` Zitadel project + project-scoped admin role + OIDC client.
# Ships in the app Kustomization (fleet `apps` dependsOn `infra-configs`).
# IDs + provider auth flow from the FirstInstance handoff via the ESO-synced
# `flux-operator-ui-terraform-vars` Secret — no org_id literal in git.
# Outputs land in `flux-operator-ui-sso-outputs` for the oauth2-proxy
# ExternalSecret (cookie secret stays on Proton Pass).
---
# Cross-namespace handoff reader: mirrors the two chart-minted handoff Secrets
# from the `zitadel` namespace into `flux-operator-ui-terraform-vars`
# (remoteNamespace MUST be `zitadel`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-handoff-reader
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: flux-operator-ui-zitadel
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-handoff-reader
---
# Vars mirror: provider auth from `zitadel-bootstrap-credentials`, IDs from
# `zitadel-bootstrap-outputs` — keys land under module var names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-ui-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: flux-operator-ui-zitadel
    kind: SecretStore
  target:
    name: flux-operator-ui-terraform-vars
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: zitadel-bootstrap-credentials
        property: jwt_profile_json
    - secretKey: org_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: org_id
    - secretKey: admin_user_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: admin_user_id

---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: flux-operator-ui-sso
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: no `tofu destroy` path exists via Flux.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared zitadel SSO root (cross-namespace `infra` OCIRepository in the
  # `zitadel` namespace).
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: zitadel
  path: ./terraform
  # Admin-only proxy (no user role, no in-Terraform cookie). Secrets come from
  # varsFrom. Positional: overlays patch /spec/vars by index — var order must
  # not change without updating them. Bool vars ride UNQUOTED (native HCL).
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: project_name
      value: flux-operator-ui
    - name: login_base_uri
      value: __ZITADEL_LOGIN_URI__
    - name: redirect_uris
      value:
        - https://__SERVICE_HOST__/*
    - name: post_logout_redirect_uris
      value:
        - https://__SERVICE_HOST__/
    - name: create_user_role
      value: false
    - name: create_cookie_secret
      value: false
  varsFrom:
    - kind: Secret
      name: flux-operator-ui-terraform-vars
  writeOutputsToSecret:
    name: flux-operator-ui-sso-outputs
    outputs:
      - client_id
      - client_secret
