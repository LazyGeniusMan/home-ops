# Flux Operator UI SSO identity (§11.4), machine-applied by Tofu Controller.
# Owns ONLY this app's slice: the `flux-operator-ui` Zitadel project +
# project-scoped admin role (flux-operator-ui-admin) + admin grant + the
# `flux-operator-ui` OIDC client. Project-scoped means
# flux-operator-ui-admin NEVER implies org admin.
#
# Ordering: this object ships in the app Kustomization (fleet `apps`
# Kustomization dependsOn `infra-configs`), so it only
# reconciles after the Zitadel HelmRelease + FirstInstance setup Job are Ready.
# Terraform `dependsOn` is Terraform-CR-only upstream (checkDependencies resolves
# every entry as kind Terraform), so NO dependsOn entry here — the fleet ordering
# above is the mechanism.
# Upstream wiring: org_id + admin_user_id flow from the FirstInstance handoff
# (`zitadel-bootstrap-outputs` Secret in the `zitadel` namespace, operator-created
# once per the zitadel README runbook) via the ESO-synced `flux-operator-ui-terraform-vars`
# Secret (same-namespace `varsFrom` below; the cross-namespace `flux-operator-ui-zitadel`
# SecretStore + narrow `flux-operator-ui-zitadel-handoff-reader` Role in `zitadel-handoff-rbac.yaml` do the
# mirroring). NO org_id literal in git, NO manual per-env fill, NO email lookups,
# NO remote-state reads. Provider auth likewise
# flows from the chart handoff (`zitadel-bootstrap-credentials` key
# `jwt_profile_json`) through the same Secret. Same-namespace `varsFrom` CANNOT
# cross namespaces (no namespace field), which is why the ESO mirror + RBAC is
# the mechanism here.
# First-run prerequisite (zero-UI): chart setup Job mints the key + ESO mirrors
# both handoff Secrets. Without the mirrored `flux-operator-ui-terraform-vars` the CR
# retries on interval — no vault seeding, no console step.
# Backend: in-cluster Kubernetes default (state Secrets in the
# flux-operator-ui namespace) — no backendConfig needed. Drift detection stays
# on (default).
# Outputs: client_id + client_secret land in `flux-operator-ui-sso-outputs`
# (sensitive); the `oauth2-proxy-credentials` ExternalSecret consumes BOTH from
# that Secret through the in-cluster `flux-operator-ui-k8s` SecretStore
# (base/oauth2-proxy-credentials.yaml) — never Git, never Proton Pass. The
# cookie secret stays on Proton Pass (separate proton-pass ExternalSecret) —
# one ExternalSecret = one store.
---
# Cross-namespace handoff reader: mirrors the two chart-minted handoff Secrets
# from the `zitadel` namespace into this namespace's `flux-operator-ui-terraform-vars`
# Secret (remoteNamespace MUST be `zitadel` — ESO reads REMOTE secrets through
# this namespace's `eso-zitadel-handoff-reader` SA; the narrow Role + RoleBinding
# in `zitadel-handoff-rbac.yaml` grant get/list/watch on the two handoff Secrets
# only). Same pattern as the in-namespace `flux-operator-ui-k8s` store
# (server.url omitted = kubernetes.default, kube-root-ca.crt supplies the API CA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-handoff-reader
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: flux-operator-ui-zitadel
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-handoff-reader
---
# Zero-UI vars mirror: provider auth (`jwt_profile_json`) from the chart-kept
# `zitadel-bootstrap-credentials`, IDs (`org_id`, `admin_user_id`) from the
# operator-created `zitadel-bootstrap-outputs` — no Proton Pass seeding, no
# manual vault step. Keys land under the module var names so `varsFrom` below
# needs no varsKeys renames.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-ui-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: flux-operator-ui-zitadel
    kind: SecretStore
  target:
    name: flux-operator-ui-terraform-vars
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: zitadel-bootstrap-credentials
        property: jwt_profile_json
    - secretKey: org_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: org_id
    - secretKey: admin_user_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: admin_user_id

---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: flux-operator-ui-sso
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only guard (tofu-controller 0.16.5): the v1alpha2 CRD has no
  # preventDestroy/destroyPlan field — `destroy` (destroy plan on reconcile)
  # and `destroyResourcesOnDeletion` (destroy plan on CR deletion) are the
  # only destroy knobs, both default false. Stated explicitly so no `tofu
  # destroy` path exists via Flux; drift detection stays on (default).
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared zitadel SSO root (cross-namespace, in the `zitadel` namespace's
  # `infra` OCIRepository): the artifact packs the whole zitadel component
  # dir, so path ./terraform resolves to the reusable root (provider +
  # local sso-client module call). allowCrossNamespaceRefs=true on the
  # controller opts into this (upstream default false since 0.16.0).
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: zitadel
  path: ./terraform
  # Fully-rendered per-env values; secrets come from varsFrom below.
  # varsFrom overrides vars on key collision (upstream GenerateVarsForTF).
  # Nested lists render as HCL natively — no JSON encoding needed.
  # Admin-only proxy (no user role, no in-Terraform cookie): create_user_role
  # + create_cookie_secret stay false (root defaults match, stated explicitly
  # so drift is visible). jwt_profile_json/org_id/admin_user_id mirror from
  # the FirstInstance handoff via the cross-namespace SecretStore — never git.
  # Patch positions (dev/prd overlays patch by index): /spec/vars/0 (domain),
  # /spec/vars/2 (redirect_uris), /spec/vars/3 (post_logout_redirect_uris).
  # Bool vars ride UNQUOTED (native HCL bool) — quoted "false" fails validation.
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: project_name
      value: flux-operator-ui
    - name: login_base_uri
      value: __ZITADEL_LOGIN_URI__
    - name: redirect_uris
      value:
        - https://__SERVICE_HOST__/*
    - name: post_logout_redirect_uris
      value:
        - https://__SERVICE_HOST__/
    - name: create_user_role
      value: false
    - name: create_cookie_secret
      value: false
  varsFrom:
    - kind: Secret
      name: flux-operator-ui-terraform-vars
  writeOutputsToSecret:
    name: flux-operator-ui-sso-outputs
    outputs:
      - client_id
      - client_secret
