# Flux Operator UI HPA over the chart-rendered Deployment `flux-operator-ui`
# (chart has no autoscaling knob — HPA lives here). Base replicas is the
# create-time seed; HPA owns runtime count. Dev 1-2, prd 2-4 via overlays.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flux-operator-ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flux-operator-ui
  minReplicas: 1 # placeholder - overridden by dev/prd
  maxReplicas: 2 # placeholder - overridden by dev/prd
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
