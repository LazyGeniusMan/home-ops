# Flux Operator UI HTTPRoutes on the shared Gateway (cross-namespace
# parentRef). Port 80 carries only the RequestRedirect filter; 443 terminates
# with the in-namespace wildcard Secret. Both routes backend to the
# per-instance oauth2-proxy Service (port 4180), never the UI directly.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - __SERVICE_HOST__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SERVICE_HOST__
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 4180
