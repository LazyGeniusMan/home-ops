# oauth2-proxy credentials (§11.4): Git holds refs only, never values.
# - oauth2-proxy-oidc: the OWN flux-operator-ui client credentials (client-id +
#   client-secret, both generated server-side). They flow end-to-end from stored
#   outputs: the `flux-operator-ui-sso` Terraform module outputs them into the
#   `flux-operator-ui-sso-outputs` Secret (CR writeOutputsToSecret), and this
#   ExternalSecret consumes BOTH keys from that Secret through the in-cluster
#   `flux-operator-ui-k8s` SecretStore below (ESO Kubernetes provider). NO
#   pass:// seeding for OIDC creds. The writeOutputsToSecret Secret stores
#   outputs base64-encoded under their output names (`client_id`,
#   `client_secret`); the `property` fields below map those onto the env keys
#   (`client-id`, `client-secret`) the proxy Deployment consumes via
#   secretKeyRef (env-based plumbing kept — OAUTH2_PROXY_CLIENT_ID /
#   OAUTH2_PROXY_CLIENT_SECRET / OAUTH2_PROXY_COOKIE_SECRET).
# - oauth2-proxy-cookie: the 32-byte cookie secret
#   (`head -c 32 /dev/urandom | base64`) from Proton Pass — seed the vault entry
#   with pass-cli. One ExternalSecret = one store, so the cookie entry stays a
#   SEPARATE proton-pass ExternalSecret targeting the SAME
#   `oauth2-proxy-credentials` Secret.
# - flux-operator-ui-k8s (SecretStore): reads Secrets in THIS namespace via the
#   `eso-k8s-reader` ServiceAccount (Role: secrets get/list/watch +
#   selfsubjectrulesreviews create, in-namespace only). Same-cluster read,
#   so `server.url` is omitted (defaults to kubernetes.default) and the
#   in-namespace `kube-root-ca.crt` ConfigMap supplies the API CA.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: flux-operator-ui-k8s
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
spec:
  provider:
    kubernetes:
      remoteNamespace: flux-operator-ui
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: flux-operator-ui-k8s
    kind: SecretStore
  target:
    name: oauth2-proxy-credentials
  data:
    - secretKey: client-id
      remoteRef:
        key: flux-operator-ui-sso-outputs
        property: client_id
    - secretKey: client-secret
      remoteRef:
        key: flux-operator-ui-sso-outputs
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-cookie
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-credentials
  data:
    - secretKey: cookie-secret
      remoteRef:
        key: __PROTON_PASS_BASE__/flux-operator-ui/oauth2-proxy-cookie-secret
