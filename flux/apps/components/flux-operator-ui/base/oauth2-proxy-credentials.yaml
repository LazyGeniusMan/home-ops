# oauth2-proxy credentials (§11.4): synced by ESO from Proton Pass — Git holds
# remoteRefs only, never values. Seed each vault entry with pass-cli:
# - __PROTON_PASS_BASE__/flux-operator-ui/oauth2-proxy-client-id
#   — the OWN flux-operator-ui client ID from Zitadel (generated
#   server-side: read from the `flux-operator-ui-sso-outputs` Secret or tofu
#   state; the client itself is declared in terraform/, applied by the
#   `flux-operator-ui-sso` Terraform CR).
# - __PROTON_PASS_BASE__/flux-operator-ui/oauth2-proxy-client-secret
#   — the client secret (server-generated; read from terraform state).
# - __PROTON_PASS_BASE__/flux-operator-ui/oauth2-proxy-cookie-secret
#   — 32-byte cookie secret (`head -c 32 /dev/urandom | base64`).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-credentials
  data:
    - secretKey: client-id
      remoteRef:
        key: __PROTON_PASS_BASE__/flux-operator-ui/oauth2-proxy-client-id
    - secretKey: client-secret
      remoteRef:
        key: __PROTON_PASS_BASE__/flux-operator-ui/oauth2-proxy-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: __PROTON_PASS_BASE__/flux-operator-ui/oauth2-proxy-cookie-secret
