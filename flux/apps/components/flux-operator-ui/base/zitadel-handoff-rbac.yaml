# Narrow cross-namespace handoff grant for the ESO reader. Mirrors the two
# SecretStore (base/terraform.yaml). Owned by this component (explicit
# `metadata.namespace: zitadel`) so it reconciles and prunes with the app.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-operator-ui-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zitadel-bootstrap-credentials", "zitadel-bootstrap-outputs"]
    verbs: ["get"] # read-only: single-key remoteRef reads (name-pinned by resourceNames above)
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-operator-ui-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
subjects:
  - kind: ServiceAccount
    name: eso-zitadel-handoff-reader
    namespace: flux-operator-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-operator-ui-zitadel-handoff-reader
