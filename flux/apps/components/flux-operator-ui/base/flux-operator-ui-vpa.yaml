# VPA recommender for the flux-operator-ui Deployment (HPA-paired):
# updateMode Off — recommender-only, never VPA-apply on HPA-scaled metrics.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: flux-operator-ui
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flux-operator-ui
  updatePolicy:
    updateMode: 'Off'
