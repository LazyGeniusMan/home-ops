# Narrow cross-namespace read grant for the flux-operator-ui tofu runner (§11.4).
# The flux-operator-ui-sso Terraform module reads the zitadel bootstrap outputs
# via `data.terraform_remote_state` (in-cluster Kubernetes backend, state Secret
# `tfstate-default-zitadel-bootstrap-identity` in the `zitadel` namespace).
# That read runs as THIS namespace's tofu runner SA
# (`system:serviceaccount:flux-operator-ui:tf-runner`, created by the
# tofu-controller chart via allowedNamespaces), so the SA needs get+list on the
# bootstrap state Secret — and nothing else (resourceNames pins the single
# Secret).
# Ownership note: the Role + RoleBinding below carry explicit
# `metadata.namespace: zitadel` but are OWNED BY the flux-operator-ui
# component — they ship in the flux-operator-ui base dir so they reconcile
# (and prune) with the app. Same-namespace `varsFrom` CANNOT cross namespaces
# (no namespace field), which is why remote-state + this RBAC is the mechanism.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-operator-ui-terraform-remote-state-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tfstate-default-zitadel-bootstrap-identity"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-operator-ui-terraform-remote-state-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: flux-operator-ui
    app.kubernetes.io/part-of: flux-operator-ui
subjects:
  - kind: ServiceAccount
    name: tf-runner
    namespace: flux-operator-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-operator-ui-terraform-remote-state-reader
