# oauth2-proxy credentials (§14 dev): synced by ESO from the DEV Proton Pass
# vault — Git holds remoteRefs only, never values. Seed each vault entry with
# pass-cli (never commit):
# - pass://acme-dev-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-client-id
#   — the oauth2-proxy-shared client ID from the DEV Zitadel (reference only:
#   the client itself is declared in flux/infra/components/zitadel/terraform
#   with the §14 DEV overrides — see the zitadel dev README).
# - pass://acme-dev-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-client-secret
#   — the client secret (server-generated; read from terraform state).
# - pass://acme-dev-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-cookie-secret
#   — 32-byte cookie secret (`head -c 32 /dev/urandom | base64`).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-credentials
  data:
    - secretKey: client-id
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-client-id
    - secretKey: client-secret
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: pass://acme-dev-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-cookie-secret
