# Flux Operator UI HTTPRoutes (§§8.1/11.4): attach to the shared §8.1 Gateway
# (listeners accept routes from all namespaces — cross-namespace parentRef, no
# targetNamespace override needed; same shape as §11.1 zitadel-httproute.yaml).
# Port 80 carries only the RequestRedirect filter (mirrors the §8.1
# httproutes.yaml discipline); real traffic terminates on 443 with the
# in-namespace wildcard Secret. BOTH routes backend to the per-instance
# oauth2-proxy Service (port 4180) — the UI Service is never exposed directly
# (admin-only auth enforced by the proxy). Hostname leaves room for
# wave-3c siblings without renaming.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - flux-operator.home-ops.yansyah.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - flux-operator.home-ops.yansyah.my.id
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 4180
