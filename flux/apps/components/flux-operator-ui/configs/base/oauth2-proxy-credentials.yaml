# oauth2-proxy credentials (§11.4): synced by ESO from Proton Pass — Git holds
# remoteRefs only, never values. Seed each vault entry with pass-cli:
# - pass://acme-prd-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-client-id
#   — the oauth2-proxy-shared client ID from Zitadel (reference only: the
#   client itself is declared in flux/infra/components/zitadel/terraform).
# - pass://acme-prd-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-client-secret
#   — the client secret (server-generated; read from terraform state).
# - pass://acme-prd-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-cookie-secret
#   — 32-byte cookie secret (`head -c 32 /dev/urandom | base64`).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-credentials
  data:
    - secretKey: client-id
      remoteRef:
        key: pass://acme-prd-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-client-id
    - secretKey: client-secret
      remoteRef:
        key: pass://acme-prd-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: pass://acme-prd-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-cookie-secret
