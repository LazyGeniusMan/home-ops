apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev route hostnames (flux-operator.home-ops-dev.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: flux-operator.home-ops-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: flux-operator
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: flux-operator.home-ops-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: flux-operator-tls
  # No oauth2-proxy-oidc vault patches: client_id + client_secret flow
  # end-to-end from the flux-operator-ui-sso outputs Secret via the in-cluster
  # `flux-operator-ui-k8s` SecretStore — no Proton Pass seeding. Cookie only.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-cookie-secret
    target:
      kind: ExternalSecret
      name: oauth2-proxy-cookie
  # Dev wildcard Certificate (wildcard-home-ops-dev).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops-dev
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-dev-tls
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  # Dev proxy issuer + callback (values keys, not arg indices — the chart
  # takes every flag from extraArgs).
  - patch: |
      - op: replace
        path: /spec/values/extraArgs/oidc-issuer-url
        value: https://admin.zitadel.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/redirect-url
        value: https://flux-operator.home-ops-dev.yansyah.my.id/oauth2/callback
    target:
      kind: HelmRelease
      name: oauth2-proxy
  # Dev Flux Operator UI SSO Terraform identity: CR vars (issuer host,
  # rendered redirect + post-logout URIs against the shared zitadel root).
  # org_id + admin ID mirror from the FirstInstance handoff via the
  # cross-namespace SecretStore — no vault ref patch, no per-env ID literals.
  # POSITIONAL: /spec/vars/0 (domain) + /spec/vars/2 (login_base_uri) +
  # /spec/vars/3 (redirect_uris) + /spec/vars/4 (post_logout_redirect_uris) —
  # base/terraform.yaml var order must not change without updating this.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: https://login.zitadel.home-ops-dev.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/3/value/0
        value: https://flux-operator.home-ops-dev.yansyah.my.id/*
      - op: replace
        path: /spec/vars/4/value/0
        value: https://flux-operator.home-ops-dev.yansyah.my.id/
    target:
      kind: Terraform
      name: flux-operator-ui-sso
  # Dev replica counts: minimal single-replica footprint. No Deployment
  # /spec/replicas patch: base replicas: 1 is the create-time seed, HPA
  # owns runtime count (HPA minReplicas enforces the floor); static
  # `web.serverReplicas` stays as the chart seed; HPAs below scale 1-2
  # on CPU+memory.
  - patch: |
      - op: replace
        path: /spec/values/web/serverReplicas
        value: 1
    target:
      kind: HelmRelease
      name: flux-operator-ui
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: flux-operator-ui
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: oauth2-proxy
