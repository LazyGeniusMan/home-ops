# Flux Operator UI (§14 dev): standalone Web UI (serverOnly) from the SAME
# chart line as bootstrap (0.59.0 + $imagepolicy marker — this tag MUST match
# operator_chart_version in versions.yaml).
# Chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator (upstream
# source of truth per docs/web/web-standalone.md).
# installCRDs: false — CRDs are owned by the bootstrap operator; this release
# installs ONLY the UI (web.serverOnly). fullnameOverride pins the Service to
# flux-operator-ui (port 9080, http-web) — the oauth2-proxy upstream contract.
# Telemetry: no usage-reporting flags are set and no metrics port is opened.
# Monitoring: no ServiceMonitor here (guarded until monitoring.coreos.com CRDs
# land — same discipline as cert-manager §9).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator-chart
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.59.0 # {"$imagepolicy": "apps:flux-operator-ui:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-ui
spec:
  interval: 1h
  releaseName: flux-operator-ui
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: flux-operator-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/controlplaneio-fluxcd/flux-operator (docs/web/web-standalone.md)
  values:
    fullnameOverride: flux-operator-ui
    installCRDs: false
    web:
      serverOnly: true
