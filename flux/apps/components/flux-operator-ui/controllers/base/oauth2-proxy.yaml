# oauth2-proxy (§11.4): per-instance auth front for the UI — SAME locked
# contract as the other ExternalAuth apps (see zitadel README OIDC table):
# Zitadel issuer, oauth2-proxy-shared client, ESO secret from
# configs/base/oauth2-proxy-credentials.yaml, upstream the UI Service,
# admin-only via the `admin` group. The Gateway HTTPRoute backends to THIS
# proxy (port 4180), never to the UI directly. Callback
# https://__SERVICE_HOST__/oauth2/callback is covered by
# the oauth2-proxy-shared wildcard redirect (https://*/oauth2/callback), so no
# per-instance client change is needed. Image pinned (no $imagepolicy marker:
# update-policies/flux-operator-ui.yaml tracks the UI chart line only).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          ports:
            - name: http
              containerPort: 4180
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-credentials
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-credentials
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-credentials
                  key: cookie-secret
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=__ZITADEL_ISSUER_URL__
            - --redirect-url=https://__SERVICE_HOST__/oauth2/callback
            - --upstream=http://flux-operator-ui.$(POD_NAMESPACE).svc.cluster.local:9080
            - --scope=openid profile email groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --reverse-proxy=true
            - --session-store-type=cookie
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
