apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd route hostnames (flux-operator.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: flux-operator.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: flux-operator
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: flux-operator.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: flux-operator-tls
  # No OIDC vault patch: client creds flow from the sso outputs Secret via the
  # in-cluster SecretStore — cookie only.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-cookie-secret
    target:
      kind: ExternalSecret
      name: oauth2-proxy-cookie
  # Prd wildcard Certificate (wildcard-home-ops).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
  # Prd proxy issuer + callback.
  - patch: |
      - op: replace
        path: /spec/values/extraArgs/oidc-issuer-url
        value: https://admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/redirect-url
        value: https://flux-operator.home-ops.yansyah.my.id/oauth2/callback
    target:
      kind: HelmRelease
      name: oauth2-proxy
  # Prd SSO CR vars (issuer host, redirect + post-logout URIs). Positional:
  # /spec/vars/0,2,3,4 — base var order must not change without updating this.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: https://login.zitadel.home-ops.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/3/value/0
        value: https://flux-operator.home-ops.yansyah.my.id/*
      - op: replace
        path: /spec/vars/4/value/0
        value: https://flux-operator.home-ops.yansyah.my.id/
    target:
      kind: Terraform
      name: flux-operator-ui-sso
  # Prd replicas: stateless HA floor (HPA owns runtime count; HPAs scale 2-4).
  - patch: |
      - op: replace
        path: /spec/values/web/serverReplicas
        value: 2
    target:
      kind: HelmRelease
      name: flux-operator-ui
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: flux-operator-ui
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: oauth2-proxy
