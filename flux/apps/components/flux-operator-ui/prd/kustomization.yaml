apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd route hostnames (flux-operator.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: flux-operator.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: flux-operator
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: flux-operator.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: flux-operator-tls
  # No oauth2-proxy-oidc vault patches: client_id + client_secret flow
  # end-to-end from the flux-operator-ui-sso outputs Secret via the in-cluster
  # `flux-operator-ui-k8s` SecretStore — no Proton Pass seeding. Cookie only.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/flux-operator-ui/oauth2-proxy-cookie-secret
    target:
      kind: ExternalSecret
      name: oauth2-proxy-cookie
  # Prd wildcard Certificate (wildcard-home-ops).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
  # Prd proxy issuer + callback.
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --oidc-issuer-url=https://zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --redirect-url=https://flux-operator.home-ops.yansyah.my.id/oauth2/callback
    target:
      kind: Deployment
      name: oauth2-proxy
  # Prd Flux Operator UI SSO Terraform identity: CR vars (issuer host,
  # rendered redirect + post-logout URIs against the shared zitadel root).
  # org_id + admin ID mirror from the FirstInstance handoff via the
  # cross-namespace SecretStore — no vault ref patch, no per-env ID literals.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value/0
        value: https://flux-operator.home-ops.yansyah.my.id/*
      - op: replace
        path: /spec/vars/3/value/0
        value: https://flux-operator.home-ops.yansyah.my.id/
    target:
      kind: Terraform
      name: flux-operator-ui-sso
  # Prd replica counts: stateless HA (2), proxy sidecar stays 1.
  - patch: |
      - op: replace
        path: /spec/values/web/serverReplicas
        value: 2
    target:
      kind: HelmRelease
      name: flux-operator-ui
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: oauth2-proxy
