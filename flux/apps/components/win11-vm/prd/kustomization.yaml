apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd-only static `lan` MAC (specs unchanged from base).
  - path: win11-vm-prd-patch.yaml
    target:
      kind: VirtualMachine
      name: win11-vm
  # Substitute the vault literal (coder ESO idiom): base holds
  # `__PROTON_PASS_BASE__/...` remoteRefs only, never values.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/win11-vm/lan-mac
    target:
      kind: ExternalSecret
      name: win11-vm-network
