# win11-vm: Windows 11 guest, singleton, manual power (runStrategy Manual LOCKED —
# suspend the apps/win11-vm Kustomization around virtctl power ops; see README).
# UEFI + SecureBoot (features.smm.enabled required for SecureBoot; contrast talos-vm).
# No `metadata.namespace` (apps tenant applies with targetNamespace). Secondary net:
# NAD `multus/lan-dhcp` (multus-owned, single-writer). Storage: DataVolume on local-ssd-nvme.
# BLOCKED until ISO staged: `spec.source` is a REPLACE-ME placeholder that fails
# closed (CDI import error-loops by design) — follow README "Windows 11 ISO import"
# to stage + fill; never commit licensed ISO URLs.
# {"$imagepolicy": "apps:win11-vm:tag"}
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win11-vm
  labels:
    kubevirt.io/vm: win11-vm
spec:
  runStrategy: Manual
  template:
    metadata:
      labels:
        kubevirt.io/vm: win11-vm
    spec:
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 8Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
            - name: lan
              bridge: {}
          features:
            acpi: {}
            smm:
              enabled: true
        firmware:
          bootloader:
            efi:
              secureBoot: true
        machine:
          type: q35
      networks:
        - name: default
          pod: {}
        - name: lan
          multus:
            networkName: multus/lan-dhcp
      volumes:
        - name: rootdisk
          dataVolume:
            name: win11-vm-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: win11-vm
  dataVolumeTemplates:
    - metadata:
        name: win11-vm-rootdisk
        annotations:
          home-ops.yansyah.my.id/iso-prestage: "BLOCKED: stage Win11_24H2_English_x64.iso per README, then set spec.source.http.url"
      spec:
        storage:
          storageClassName: local-ssd-nvme
          resources:
            requests:
              storage: 80Gi
        source:
          # PLACEHOLDER — BLOCKED: fill per README "Windows 11 ISO import" steps
          # (stage Win11_24H2_English_x64.iso at https://files.home-ops.yansyah.my.id/iso/,
          # then set http.url to the staged file; never commit the filled URL).
          http:
            url: "https://REPLACE-ME/Win11_xxH2_x64.iso"
