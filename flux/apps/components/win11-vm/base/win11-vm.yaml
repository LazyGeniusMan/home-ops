# win11-vm: Windows 11 guest, singleton, manual power (runStrategy Manual LOCKED —
# suspend the apps/win11-vm Kustomization around virtctl power ops; see README).
# UEFI + SecureBoot (features.smm.enabled required for SecureBoot; contrast talos-vm).
# No `metadata.namespace` (apps tenant applies with targetNamespace). Secondary net:
# NAD `multus/lan-dhcp` (multus-owned, single-writer). Storage: DataVolume on local-ssd-nvme.
# Windows 11 ISO is a DOCUMENTED PREREQUISITE — fill `spec.source` per the README import
# steps (placeholder below); never commit licensed ISO URLs.
# {"$imagepolicy": "apps:win11-vm:tag"}
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win11-vm
  labels:
    kubevirt.io/vm: win11-vm
spec:
  runStrategy: Manual
  template:
    metadata:
      labels:
        kubevirt.io/vm: win11-vm
    spec:
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 8Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
            - name: lan
              bridge: {}
          features:
            acpi: {}
            smm:
              enabled: true
        firmware:
          bootloader:
            efi:
              secureBoot: true
        machine:
          type: q35
      networks:
        - name: default
          pod: {}
        - name: lan
          multus:
            networkName: multus/lan-dhcp
      volumes:
        - name: rootdisk
          dataVolume:
            name: win11-vm-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: win11-vm
  dataVolumeTemplates:
    - metadata:
        name: win11-vm-rootdisk
      spec:
        storage:
          storageClassName: local-ssd-nvme
          resources:
            requests:
              storage: 80Gi
        source:
          # PLACEHOLDER — fill per README "Windows 11 ISO import" steps
          # (e.g. https://files.home-ops.yansyah.my.id/iso/Win11_24H2_English_x64.iso once staged).
          http:
            url: "https://REPLACE-ME/Win11_xxH2_x64.iso"
