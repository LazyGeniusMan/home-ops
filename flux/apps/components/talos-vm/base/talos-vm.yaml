# talos-vm: Talos Linux guest, singleton, manual power (runStrategy Manual LOCKED —
# suspend the apps/talos-vm Kustomization around virtctl power ops; see README).
# UEFI with SecureBoot DISABLED (nocloud image is not SecureBoot-signed — no
# features.smm block; contrast win11-vm). No `metadata.namespace` (apps tenant
# applies with targetNamespace). Secondary net: NAD `multus/lan-dhcp`
# (multus-owned, single-writer). Storage: DataVolume on local-ssd-nvme.
# {"$imagepolicy": "apps:talos-vm:tag"}
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: talos-vm
  labels:
    kubevirt.io/vm: talos-vm
spec:
  runStrategy: Manual
  template:
    metadata:
      labels:
        kubevirt.io/vm: talos-vm
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
            - name: lan
              bridge: {}
        firmware:
          bootloader:
            efi:
              secureBoot: false
        machine:
          type: q35
      networks:
        - name: default
          pod: {}
        - name: lan
          multus:
            networkName: multus/lan-dhcp
      volumes:
        - name: rootdisk
          dataVolume:
            name: talos-vm-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: talos-vm
  dataVolumeTemplates:
    - metadata:
        name: talos-vm-rootdisk
      spec:
        storage:
          storageClassName: local-ssd-nvme
          resources:
            requests:
              storage: 20Gi
        source:
          # Talos nocloud image, aligned to talos/ansible/group_vars/all.yml (https://factory.talos.dev/).
          # No schematic extensions beyond base (virtio in-tree; qemu-guest-agent optional).
          http:
            url: "https://factory.talos.dev/image/nocloud/amd64/v1.15.0-alpha.0/nocloud-amd64.iso"
