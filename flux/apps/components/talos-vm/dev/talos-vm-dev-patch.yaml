# Dev-only talos-vm patch: minimal specs (v1.14 worker minima — boot+DHCP
# only: 1 core / 1Gi / 10Gi) + static `lan` bridge MAC. The MAC is a literal
# here because KubeVirt `macAddress` is a plain string ESO cannot inject —
# mirror the SAME value in Proton Pass at
# pass://acme-dev-bdo1-talos-apps-01/talos-vm/lan-mac (vault = source of
# truth; the talos-vm-network ExternalSecret syncs it for router DHCP
# reservations). If either side changes, update both.
- op: replace
  path: /spec/template/spec/domain/cpu/cores
  value: 1
- op: replace
  path: /spec/template/spec/domain/resources/requests/memory
  value: 1Gi
- op: replace
  path: /spec/dataVolumeTemplates/0/spec/storage/resources/requests/storage
  value: 10Gi
- op: add
  path: /spec/template/spec/domain/devices/interfaces/1/macAddress
  # vault: pass://acme-dev-bdo1-talos-apps-01/talos-vm/lan-mac
  value: 52:54:00:01:0A:01
