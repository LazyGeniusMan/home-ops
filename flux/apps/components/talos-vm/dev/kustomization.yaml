# Dev tracks ../base with minimal specs (1 core / 1Gi / 10Gi — v1.14 worker
# minima, boot+DHCP only) + a static `lan` MAC via talos-vm-dev-patch.yaml.
# VM keeps the production name (talos-vm) — dev and prd are separate
# clusters, so no name clash is possible. runStrategy Manual, NAD
# multus/lan-dhcp and local-ssd-nvme storage class are unchanged.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: talos-vm-dev-patch.yaml
    target:
      kind: VirtualMachine
      name: talos-vm
