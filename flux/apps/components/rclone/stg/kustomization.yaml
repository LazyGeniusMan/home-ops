apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Stg (prd values) Proton Pass vault (pass://acme-prd-bdo1-talos-apps-01)
  # for the Drive triple. (The S3 pair is COSI-minted via the in-namespace
  # rclone-cosi SecretStore — no per-env vault ref patch for
  # sw-access-key/sw-secret-key.)
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/rclone/drive-username
    target:
      kind: ExternalSecret
      name: rclone-credentials
  - patch: |
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/rclone/drive-password
    target:
      kind: ExternalSecret
      name: rclone-credentials
  - patch: |
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/rclone/drive-token
    target:
      kind: ExternalSecret
      name: rclone-credentials
  # Stg stays suspended (manual drill only: un-suspend + trigger) and
  # keeps the base dry-run flags, so it never writes to Proton Drive.
  # Endpoint is the prd SeaweedFS S3 (base holds a placeholder).
  - patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: rclone-vault-sync
      spec:
        schedule: "0 * * * *"
        suspend: true
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: rclone
                    env:
                      - name: RCLONE_CONFIG_SW_ENDPOINT
                        value: "http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333"
