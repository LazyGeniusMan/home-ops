apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Dev Proton Pass vault (pass://acme-dev-bdo1-talos-apps-01).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/rclone/sw-access-key
    target:
      kind: ExternalSecret
      name: rclone-credentials
  - patch: |
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/rclone/sw-secret-key
    target:
      kind: ExternalSecret
      name: rclone-credentials
  - patch: |
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/rclone/drive-username
    target:
      kind: ExternalSecret
      name: rclone-credentials
  - patch: |
      - op: replace
        path: /spec/data/3/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/rclone/drive-password
    target:
      kind: ExternalSecret
      name: rclone-credentials
  - patch: |
      - op: replace
        path: /spec/data/4/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/rclone/drive-token
    target:
      kind: ExternalSecret
      name: rclone-credentials
