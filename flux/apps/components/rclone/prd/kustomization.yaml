apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd Proton Pass vault (pass://acme-prd-bdo1-talos-apps-01) for the Drive
  # triple. (The S3 pair is COSI-minted via the in-namespace rclone-cosi
  # SecretStore — no per-env vault ref patch for sw-access-key/sw-secret-key.)
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/rclone/drive-username
    target:
      kind: ExternalSecret
      name: rclone-credentials
  - patch: |
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/rclone/drive-password
    target:
      kind: ExternalSecret
      name: rclone-credentials
  - patch: |
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/rclone/drive-token
    target:
      kind: ExternalSecret
      name: rclone-credentials
  # Prd syncs nightly for real: 03:00, live flags (no --dry-run),
  # against the prd SeaweedFS S3 endpoint.
  - patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: rclone-vault-sync
      spec:
        schedule: "0 3 * * *"
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: rclone
                    env:
                      - name: SYNC_FLAGS
                        value: "--verbose --transfers=4 --checkers=8"
                      - name: RCLONE_CONFIG_SW_ENDPOINT
                        value: "http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333"
