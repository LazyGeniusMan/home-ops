apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Staging stays suspended (manual drill only: un-suspend + trigger) and
  # keeps the base dry-run flags, so it never writes to Proton Drive.
  - patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: rclone-vault-sync
      spec:
        schedule: "0 * * * *"
        suspend: true
