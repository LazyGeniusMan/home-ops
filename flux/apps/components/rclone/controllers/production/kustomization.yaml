apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Production syncs nightly for real: 03:00, live flags (no --dry-run),
  # against the prd SeaweedFS S3 endpoint.
  - patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: rclone-vault-sync
      spec:
        schedule: "0 3 * * *"
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: rclone
                    env:
                      - name: SYNC_FLAGS
                        value: "--verbose --transfers=4 --checkers=8"
                      - name: RCLONE_CONFIG_SW_ENDPOINT
                        value: "https://s3.seaweedfs.home-ops.yansyah.my.id"
