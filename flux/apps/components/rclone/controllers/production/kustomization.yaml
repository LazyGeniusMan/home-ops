apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Production syncs nightly for real: 03:00, live flags (no --dry-run).
  - patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: rclone-vault-sync
      spec:
        schedule: "0 3 * * *"
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: rclone
                    env:
                      - name: SYNC_FLAGS
                        value: "--verbose --transfers=4 --checkers=8"
