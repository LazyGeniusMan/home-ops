# COSI credential bridge (§12.2): in-namespace Kubernetes SecretStore reading
# the COSI-minted BucketInfo JSON (Secret rclone-vault-cosi-creds, key
# BucketInfo) via the eso-k8s-reader ServiceAccount. Role is
# least-privilege: secrets get/list/watch restricted to the *-cosi-creds
# Secret + selfsubjectrulesreviews create, in-namespace only. Same pattern
# as the clickstack-k8s/coder-k8s stores: server.url omitted (defaults to
# kubernetes.default), kube-root-ca.crt supplies the API CA. The
# rclone-cosi-s3 ExternalSecret (in rclone-credentials.yaml) uses GJSON
# `property` (BucketInfo.spec.secretS3.accessKeyID/accessSecretKey) —
# verified against ESO v2.10.0 providers/v1/kubernetes/client.go
# getFromSecretData.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["rclone-vault-cosi-creds"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rclone-cosi
spec:
  provider:
    kubernetes:
      remoteNamespace: rclone
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
