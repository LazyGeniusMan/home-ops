# COSI-managed bucket for the rclone vault sync (colocated with the
# consuming component — lands in the `rclone` tenant namespace via the
# Fleet `apps` Kustomization's `targetNamespace`).
# - Claim uses BucketClass/seaweedfs, protocol S3. The central controller
#   creates the cluster-scoped Bucket; the driver (DriverCreateBucket =
#   req.GetName()) provisions the live bucket in SeaweedFS under a
#   controller-generated name (`bc-<uuid>`) — claim/access names do NOT map
#   to pre-existing bucket names, so `spec.existingBucketName` is
#   intentionally unset. Read the live name from the claim's
#   `status.bucketName` once `status.bucketReady` is true.
# - `rclone-vault` backs the vault sync: the CronJob `SOURCE`
#   (`sw:rclone-vault`, see cronjob.yaml) targets the COSI-provisioned
#   bucket.
# - The BucketAccess (BucketAccessClass/seaweedfs-key, authenticationType
#   KEY) mints S3 keys into its `credentialsSecretName` Secret in THIS
#   namespace as a `BucketInfo` JSON file (secretS3.endpoint/region/
#   accessKeyID/accessSecretKey). The driver hands back the INTERNAL
#   endpoint (http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333).
# - Credential bridge: the job keeps reading its same-namespace
#   ExternalSecret (Proton Pass) today. To migrate to COSI keys, copy
#   `accessKeyID`/`accessSecretKey` out of the BucketInfo JSON into the
#   Proton Pass entries (pass-cli seed), keeping the ExternalSecret shape
#   unchanged.
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: rclone-vault
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: rclone-vault-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: rclone-vault
  credentialsSecretName: rclone-vault-cosi-creds
  protocol: S3
