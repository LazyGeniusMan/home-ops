# Rclone vault sync (§12.2): SeaweedFS S3 → Proton Drive, image
# rclone/rclone:1.75.1. Env-only config — NO rclone.conf file: remotes are
# defined purely through RCLONE_CONFIG_* variables below, with secrets
# injected from the base/ ExternalSecret. Shell-form args let SYNC_FLAGS
# / RETENTION_DAYS stay plain env knobs patched per environment.
# Telemetry: rclone has no phone-home; --rc metrics endpoint stays off
# (unguarded monitors OFF) — job health via kube-state-metrics (see README).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone-vault-sync
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rclone
              image: rclone/rclone:1.75.1 # {"$imagepolicy": "apps:rclone:tag"}
              command: ["/bin/sh", "-c"]
              args:
                - rclone sync "$SOURCE" "$DEST" --max-age="${RETENTION_DAYS}d" $SYNC_FLAGS
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              env:
                # Job shape: WHAT moves WHERE, HOW (flags), HOW MUCH history.
                # Base defaults are dry-run — overlays flip SYNC_FLAGS live.
                - name: SOURCE
                  value: "sw:rclone-vault"
                - name: DEST
                  value: "drive:/home-ops-vault"
                - name: SYNC_FLAGS
                  value: "--dry-run --verbose"
                - name: RETENTION_DAYS
                  value: "30"
                # SeaweedFS S3 remote (the section 12.1 contract endpoint, __S3_ENDPOINT_URL__).
                - name: RCLONE_CONFIG_SW_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_SW_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_SW_ENDPOINT
                  value: "__S3_ENDPOINT_URL__"
                - name: RCLONE_CONFIG_SW_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_SW_REGION
                  value: "us-east-1"
                - name: RCLONE_CONFIG_SW_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: rclone-credentials
                      key: sw-access-key
                - name: RCLONE_CONFIG_SW_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rclone-credentials
                      key: sw-secret-key
                # Proton Drive remote: RCLONE_CONFIG_DRIVE_* + ESO-injected
                # secrets. Key names must match the rclone protondrive
                # backend options — align after `rclone config` (see README).
                - name: RCLONE_CONFIG_DRIVE_TYPE
                  value: "protondrive"
                - name: RCLONE_CONFIG_DRIVE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: rclone-credentials
                      key: drive-username
                - name: RCLONE_CONFIG_DRIVE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rclone-credentials
                      key: drive-password
                - name: RCLONE_CONFIG_DRIVE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: rclone-credentials
                      key: drive-token
              # PVC mode (alternative to the S3 SOURCE above): uncomment,
              # point SOURCE at /data, and set claimName to back up a volume
              # instead of a bucket.
              # volumeMounts:
              #   - name: data
              #     mountPath: /data
          # volumes:
          #   - name: data
          #     persistentVolumeClaim:
          #       claimName: rclone-staging
