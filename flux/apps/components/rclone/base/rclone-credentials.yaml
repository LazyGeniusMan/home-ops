# Rclone credentials (§12.2): synced by ESO from Proton Pass
# (__PROTON_PASS_BASE__/rclone/*). Seed the vault entries
# with pass-cli. Drive key names must match the rclone protondrive backend
# options — align them after running `rclone config` once (see README).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: rclone-credentials
  data:
    - secretKey: sw-access-key
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/sw-access-key
    - secretKey: sw-secret-key
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/sw-secret-key
    - secretKey: drive-username
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/drive-username
    - secretKey: drive-password
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/drive-password
    - secretKey: drive-token
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/drive-token
