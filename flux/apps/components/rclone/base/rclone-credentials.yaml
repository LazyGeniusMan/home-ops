# Rclone credentials (§12.2): one ExternalSecret = one store, so the S3 pair
# and the Proton Drive triple are separate ExternalSecrets targeting the
# SAME `rclone-credentials` Secret (same pattern as clickstack's
# oauth2-proxy-oidc + oauth2-proxy-cookie).
# - rclone-cosi-s3: the S3 pair, synced by ESO from the COSI-minted
#   BucketInfo JSON (Secret rclone-vault-cosi-creds, key BucketInfo)
#   through the in-namespace `rclone-cosi` SecretStore (cosi-keys.yaml) —
#   GJSON `property` extracts spec.secretS3.accessKeyID/accessSecretKey.
#   Target literal keys (sw-access-key/sw-secret-key) are unchanged, so the
#   CronJob secretKeyRefs are untouched. Keys only: SOURCE bucket name +
#   RCLONE_CONFIG_SW_ENDPOINT overlays are out of scope.
#   Fallback: the Proton Pass entries (pass://.../rclone/sw-*) are retained
#   in the vault; to roll back, repoint this ES at proton-pass/
#   ClusterSecretStore with remoteRef keys
#   __PROTON_PASS_BASE__/rclone/sw-access-key and
#   __PROTON_PASS_BASE__/rclone/sw-secret-key (no `property`).
# - rclone-credentials: the Drive triple, still synced by ESO from Proton
#   Pass. Drive key names must match the rclone protondrive backend
#   options — align them after running `rclone config` once (see README).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-cosi-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rclone-cosi
    kind: SecretStore
  target:
    name: rclone-credentials
  data:
    - secretKey: sw-access-key
      remoteRef:
        key: rclone-vault-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: sw-secret-key
      remoteRef:
        key: rclone-vault-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: rclone-credentials
  data:
    - secretKey: drive-username
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/drive-username
    - secretKey: drive-password
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/drive-password
    - secretKey: drive-token
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/drive-token
