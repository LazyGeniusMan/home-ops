# Element Web secrets (Goal 2d): Git holds refs only, never values.
# Element Web itself needs NO credentials (stateless public SPA — no SSO
# client, no proxy secret; the homeserver URL is public config, not a
# secret). The ONLY secret-adjacent object is the cloudflare-api-token
# mirror for the DNS-01 solver credential (same pattern as
# hubble-ui/hubble-secrets.yaml mirroring
# cert-manager/configs/base/cluster-issuer.yaml with the same Proton Pass
# remoteRef), so the in-namespace wildcard Certificate can be issued.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
