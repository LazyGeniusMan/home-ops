# VPA recommender for the element-web Deployment (HPA-paired): updateMode
# Off — recommender-only, because the HPA scales the same CPU/memory
# metrics (known-limitations.md: never VPA-apply on a resource HPA scales
# on; clickstack precedent).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: element-web
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: element-web
  updatePolicy:
    updateMode: 'Off'
