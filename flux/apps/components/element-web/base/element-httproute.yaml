# Element Web HTTPRoute (Goal 2d): attaches to the shared §8.1 Gateway
# (listeners accept routes from all namespaces — cross-namespace parentRef,
# no targetNamespace override needed; same pattern as hubble-ui/clickstack).
# Hostname __SERVICE_HOST__ (dev/prd overlays replace with the per-env
# element hostname) → element-web Service (:80, the nginx SPA). PathPrefix /
# (single-page app — all paths serve the SPA shell). TLS terminates at the
# Gateway via the in-namespace wildcard Certificate
# (wildcard-certificate.yaml).
# Upstream nginx-snippet headers translated (docs/kubernetes.md Ingress
# annotations → Gateway ResponseHeaderModifier — Cilium Gateway supports
# the standard filter):
#   X-Frame-Options SAMEORIGIN, X-Content-Type-Options nosniff,
#   Content-Security-Policy "frame-ancestors 'self'".
# X-XSS-Protection ("1; mode=block") is DELIBERATELY DROPPED: the header is
# deprecated (removed from modern browsers; MDN: do not use) and upstream
# Element never sets it itself — translating it would add a dead header.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SERVICE_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Frame-Options
                value: SAMEORIGIN
              - name: X-Content-Type-Options
                value: nosniff
              - name: Content-Security-Policy
                value: frame-ancestors 'self'
      backendRefs:
        - name: element-web
          port: 80
