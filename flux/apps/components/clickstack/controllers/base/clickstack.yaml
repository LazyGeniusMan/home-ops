# Clickstack observability (§11.2): HyperDX app + OTel Collector, vendored as
# plain Deployments (no embedded MongoDB/ClickHouse — backends are the
# namespace-local CHI in configs/base/clickstack-clickhouse.yaml and FerretDB
# on the CNPG Cluster in configs/base/ferretdb-postgres.yaml).
# Chart decision (bounded, 2 attempts, documented in README): the upstream
# hdx-oss-v2 chart (classic repo https://clickhouse.github.io/ClickStack-helm-charts,
# chart 0.8.4 = app 2.7.1) is deployable with mongodb/clickhouse.enabled=false,
# but renders its API-key Secret from values with NO existingSecret knob, so a
# real key would land in Git — incompatible with the ESO-only secret posture.
# Vendoring keeps every credential a secretKeyRef/envFrom to ESO-synced Secrets.
# Images pinned to the chart's appVersion line (v2.7.1, verified via
# `helm show chart clickstack/hdx-oss-v2` at authoring); bumps via
# update-policies/clickstack.yaml. Env shape mirrors the chart's app ConfigMap
# + Deployment (ports, probes, OPAMP wiring) minus the in-chart DBs.
# Telemetry: USAGE_STATS_ENABLED=false (chart knob, defaults true) and the
# app's OTLP endpoint points at the in-namespace collector — nothing leaves
# the cluster. See README for evidence.
# Monitoring: no ServiceMonitor (monitoring.coreos.com CRDs not present —
# same §9 deviation); flip once the monitoring stack lands.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickstack
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickstack
        app.kubernetes.io/part-of: clickstack
    spec:
      containers:
        - name: hyperdx
          image: docker.hyperdx.io/hyperdx/hyperdx:v2.7.1 # {"$imagepolicy": "apps:hyperdx:tag"}
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_PORT
              value: "3000"
            - name: API_PORT
              value: "8000"
            - name: FRONTEND_URL
              value: "https://__SERVICE_HOST__"
            - name: HYPERDX_API_PORT
              value: "8000"
            - name: HYPERDX_APP_PORT
              value: "3000"
            - name: HYPERDX_LOG_LEVEL
              value: "info"
            # Mongo-wire backend: FerretDB Service in this namespace (see
            # ferretdb.yaml + README connection contract).
            - name: MONGO_URI
              value: "mongodb://ferretdb.clickstack.svc:27017/hyperdx"
            - name: OTEL_SERVICE_NAME
              value: "hdx-oss-api"
            # Telemetry OFF: chart knob (values hyperdx.usageStatsEnabled,
            # default true) — nothing phones home.
            - name: USAGE_STATS_ENABLED
              value: "false"
            # App's own telemetry ships to the in-namespace collector only.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://clickstack-otel-collector.clickstack.svc:4318"
            - name: HYPERDX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clickstack-hyperdx
                  key: api-key
            # External ClickHouse connection: operator default user (empty
            # password, intra-cluster only — matches the CHI's no-users
            # stance) in an ESO-templated connections.json (never in Git).
            # Hardening follow-up replaces `default` with a dedicated app
            # user once ESO-managed ClickHouse passwords land.
            - name: DEFAULT_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: clickstack-hyperdx-config
                  key: connections.json
          ports:
            - name: app
              containerPort: 3000
            - name: api
              containerPort: 8000
            - name: opamp
              containerPort: 4320
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: clickstack
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
spec:
  selector:
    app.kubernetes.io/name: clickstack
  ports:
    - name: app
      port: 3000
      targetPort: 3000
    - name: api
      port: 8000
      targetPort: 8000
    - name: opamp
      port: 4320
      targetPort: 4320
---
# OTel Collector (chart's otel Deployment shape, repointed at the external
# CHI + HyperDX app; image pinned to the same v2.7.1 appVersion line).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickstack-otel-collector
  labels:
    app.kubernetes.io/name: clickstack-otel-collector
    app.kubernetes.io/part-of: clickstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickstack-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickstack-otel-collector
        app.kubernetes.io/part-of: clickstack
    spec:
      containers:
        - name: otel-collector
          image: docker.hyperdx.io/hyperdx/hyperdx-otel-collector:v2.7.1 # {"$imagepolicy": "apps:hyperdx-otel-collector:tag"}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_ENDPOINT
              value: "tcp://clickhouse-clickstack.clickstack.svc:9000?dial_timeout=10s"
            - name: CLICKHOUSE_SERVER_ENDPOINT
              value: "clickhouse-clickstack.clickstack.svc:9000"
            - name: OPAMP_SERVER_URL
              value: "http://clickstack.clickstack.svc:4320"
            - name: HYPERDX_LOG_LEVEL
              value: "info"
            - name: HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE
              value: "default"
            - name: HYPERDX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clickstack-hyperdx
                  key: api-key
            # Operator default user (empty password; same no-users stance as
            # the CHI — hardening follow-up adds a dedicated otel user).
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              value: ""
          ports:
            - name: health
              containerPort: 13133
            - name: fluentd
              containerPort: 24225
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: clickstack-otel-collector
  labels:
    app.kubernetes.io/name: clickstack-otel-collector
    app.kubernetes.io/part-of: clickstack
spec:
  selector:
    app.kubernetes.io/name: clickstack-otel-collector
  ports:
    - name: health
      port: 13133
      targetPort: 13133
    - name: fluentd
      port: 24225
      targetPort: 24225
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888
