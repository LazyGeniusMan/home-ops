# FerretDB (§14 dev): Mongo-wire proxy over the namespace-local DEV CNPG
# Cluster (configs/dev/ferretdb-postgres.yaml, dbname ferretdb). Same image
# (ghcr.io/ferretdb/ferretdb:2.7.0 + $imagepolicy marker) and connection
# contract as the base: HyperDX MONGO_URI=mongodb://ferretdb.clickstack.svc:27017/hyperdx;
# FerretDB reaches Postgres at ferretdb-rw.clickstack.svc:5432/ferretdb
# (CNPG -rw Service, user ferretdb, password from ferretdb-app-secret);
# sslmode=require (CNPG self-signed TLS — require encrypts without
# verification). No ServiceMonitor until monitoring.coreos.com CRDs land.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferretdb
  labels:
    app.kubernetes.io/name: ferretdb
    app.kubernetes.io/part-of: clickstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ferretdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferretdb
        app.kubernetes.io/part-of: clickstack
    spec:
      containers:
        - name: ferretdb
          image: ghcr.io/ferretdb/ferretdb:2.7.0 # {"$imagepolicy": "apps:ferretdb:tag"}
          imagePullPolicy: IfNotPresent
          env:
            - name: FERRETDB_POSTGRESQL_URL
              value: "postgres://ferretdb@ferretdb-rw.clickstack.svc:5432/ferretdb?sslmode=require"
            - name: FERRETDB_POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ferretdb-app-secret
                  key: password
          ports:
            - name: mongo
              containerPort: 27017
          livenessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ferretdb
  labels:
    app.kubernetes.io/name: ferretdb
    app.kubernetes.io/part-of: clickstack
spec:
  selector:
    app.kubernetes.io/name: ferretdb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
