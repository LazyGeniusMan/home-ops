# FerretDB Mongo-wire proxy over the `ferretdb` CNPG Cluster (ferretdb-postgres.yaml).
# Image marker `apps:ferretdb:tag`. `sslmode=require` (CNPG self-signed cert;
# require still encrypts in transit). No ServiceMonitor: the Deployment exposes no
# metrics endpoint, and the flip waits for monitoring CRDs via the otel pipeline
# (see the ESO `renderMode: skipIfMissing` template in
# external-secrets/controllers/base/externalsecrets.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferretdb
  labels:
    app.kubernetes.io/name: ferretdb
    app.kubernetes.io/part-of: clickstack
spec:
  replicas: 1 # create-time seed, HPA owns runtime count
  selector:
    matchLabels:
      app.kubernetes.io/name: ferretdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferretdb
        app.kubernetes.io/part-of: clickstack
    spec:
      containers:
        - name: ferretdb
          image: ghcr.io/ferretdb/ferretdb:2.7.0 # {"$imagepolicy": "apps:ferretdb:tag"}
          imagePullPolicy: IfNotPresent
          env:
            - name: FERRETDB_POSTGRESQL_URL
              value: "postgres://ferretdb@ferretdb-rw.clickstack.svc:5432/ferretdb?sslmode=require"
            - name: FERRETDB_POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ferretdb-app-secret
                  key: password
          ports:
            - name: mongo
              containerPort: 27017
          # No HTTP endpoint on this image — TCP on the mongo listener (same
          # convention as mautrix-discord.yaml). Startup gates
          # liveness/readiness (10s x 30 = 300s budget) so CNPG bootstrap
          # never trips restarts.
          startupProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ferretdb
  labels:
    app.kubernetes.io/name: ferretdb
    app.kubernetes.io/part-of: clickstack
spec:
  selector:
    app.kubernetes.io/name: ferretdb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
