# In-namespace wildcard Certificate (cert-manager Secrets are namespace-local):
# mints `__WILDCARD_TLS_SECRET__` via ClusterIssuer/letsencrypt DNS-01.
# `__WILDCARD_CERT_NAME__` / `__WILDCARD_TLS_SECRET__` / `__BASE_DOMAIN__`
# are overlay-replaced placeholders.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __WILDCARD_CERT_NAME__
spec:
  secretName: __WILDCARD_TLS_SECRET__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.__BASE_DOMAIN__"
