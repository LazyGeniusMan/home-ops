# PodDisruptionBudgets for the HPA-scaled Deployments: minAvailable 1 keeps at
# least one replica serving during voluntary disruptions. Singletons
# (oauth2-proxy, ferretdb proxy) stay singleton by design — no PDB (a PDB
# cannot protect a 1-replica workload; scale-up is a documented future step).
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickstack
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickstack
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickstack-otel-collector
  labels:
    app.kubernetes.io/name: clickstack-otel-collector
    app.kubernetes.io/part-of: clickstack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickstack-otel-collector
