# HTTPRoute on the shared `main` Gateway (`https` section, cross-namespace
# parentRef): `__SERVICE_HOST__` → oauth2-proxy `:4180`. TLS terminates at the
# Gateway via the in-namespace wildcard Certificate. `__SERVICE_HOST__` is an
# overlay-replaced placeholder.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clickstack
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SERVICE_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy
          port: 4180
