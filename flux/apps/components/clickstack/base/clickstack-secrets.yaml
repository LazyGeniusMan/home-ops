# Clickstack secrets (§11.2): synced by ESO from Proton Pass — Git holds
# remoteRefs only, never values. Seed each vault entry with pass-cli.
# - oauth2-proxy-oidc: this app's own Zitadel `clickstack` client credentials —
#   client-id + client-secret (both generated server-side). They flow end-to-end
#   from stored outputs: the `clickstack-sso` Terraform module outputs them into
#   the `clickstack-sso-outputs` Secret (CR writeOutputsToSecret), and this
#   ExternalSecret consumes BOTH keys from that Secret through the in-cluster
#   `clickstack-k8s` SecretStore below (ESO Kubernetes provider). NO pass://
#   seeding for OIDC creds. The client itself is owned by this app's
#   `clickstack-sso` Terraform CR (base/terraform.yaml), NOT the central
#   zitadel module. The writeOutputsToSecret Secret stores outputs
#   base64-encoded under their output names (`client_id`, `client_secret`);
#   the `property` fields below map those onto the secretKeyRef keys
#   (`client-id`, `client-secret`) the proxy Deployment expects.
# - oauth2-proxy-cookie: the per-instance cookie secret (32 random bytes, e.g.
#   `head -c32 /dev/urandom | base64`) from Proton Pass. One ExternalSecret =
#   one store, so the cookie entry stays a SEPARATE proton-pass ExternalSecret
#   targeting the SAME `oauth2-proxy` Secret.
#   Consumed via OAUTH2_PROXY_CLIENT_ID (secretKeyRef) +
#   --client-secret-file / --cookie-secret-file mounts.
# - clickstack-k8s (SecretStore): reads Secrets in THIS namespace via the
#   SHARED `eso-k8s-reader` ServiceAccount (ships in cosi-keys.yaml — same SA
#   backs the clickstack-cosi store, so the Role is unrestricted: secrets
#   get/list/watch with NO resourceNames + selfsubjectrulesreviews create,
#   in-namespace only). Same-cluster read, so `server.url` is omitted
#   (defaults to kubernetes.default) and the in-namespace `kube-root-ca.crt`
#   ConfigMap supplies the API CA.
# - clickstack-hyperdx: the HyperDX API key (uuid; the chart's single
#   hyperdx.apiKey consumed by BOTH the app container and the collector as
#   HYPERDX_API_KEY).
# - clickstack-hyperdx-config: connections.json rendered into a Secret by ESO
#   from a STATIC template (operator default user, empty password —
#   intra-cluster only, matches the CHI's no-users stance). The app reads it
#   as DEFAULT_CONNECTIONS. Hardening follow-up replaces `default` with a
#   dedicated app user once ESO-managed ClickHouse passwords land.
#   (No clickstack-clickhouse-credentials ExternalSecret ships for the same
#   reason: the CHI defines no users, so there is no password to sync.)
# - clickhouse-s3-backup: same SeaweedFS S3 credential pair as §10.2,
#   synced by ESO from the COSI-minted BucketInfo JSON (Secret
#   clickstack-cosi-creds in THIS namespace, from the colocated `clickstack`
#   BucketClaim) through the in-namespace `clickstack-cosi` SecretStore
#   (cosi-keys.yaml) — GJSON `property` extracts
#   spec.secretS3.accessKeyID/accessSecretKey. Target literal keys
#   (access-key-id/secret-access-key) are unchanged, so the CHI pod env
#   secretKeyRefs are untouched. Referenced by the CHI pod env for backup
#   disks. Keys only: the CHI `storage.xml` endpoint below still points at
#   the legacy `clickhouse/clickstack/` prefix; copy data to the
#   COSI-provisioned bucket (see cosi README "Bucket cutover"), then repoint.
#   Fallback: the Proton Pass entries
#   (pass://.../clickstack/s3-*) are retained in the vault; to roll back,
#   repoint secretStoreRef to proton-pass/ClusterSecretStore with remoteRef
#   keys __PROTON_PASS_BASE__/clickstack/s3-access-key-id and
#   __PROTON_PASS_BASE__/clickstack/s3-secret-access-key (no `property`).
# - ferretdb-app-secret: CNPG initdb app-user secret (basic-auth, username
#   MUST equal spec.bootstrap.initdb.owner = ferretdb per upstream).
# - cloudflare-api-token: mirrors cert-manager/configs/base/cluster-issuer.yaml
#   (same Proton Pass remoteRef) so the DNS-01 solver credential exists in
#   this namespace too.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: clickstack-k8s
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
spec:
  provider:
    kubernetes:
      remoteNamespace: clickstack
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-k8s
    kind: SecretStore
  target:
    name: oauth2-proxy
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: clickstack-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: clickstack-sso-outputs
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-cookie
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy
  data:
    - secretKey: cookie-secret
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/oauth2-proxy-cookie-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-hyperdx
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: clickstack-hyperdx
    template:
      data:
        api-key: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/hyperdx-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-hyperdx-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: clickstack-hyperdx-config
    template:
      data:
        connections.json: '[{"name":"Local ClickHouse","host":"http://clickhouse-clickstack.clickstack.svc:8123","port":8123,"username":"default","password":""}]'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-s3-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: clickhouse-s3-backup
    template:
      data:
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: clickstack-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: clickstack-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ferretdb-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: ferretdb-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: ferretdb
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/ferretdb-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
