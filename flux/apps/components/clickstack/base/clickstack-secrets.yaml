# Clickstack secrets: Git holds remoteRefs only (seed vault with pass-cli).
# `oauth2-proxy-oidc` + cookie share the `oauth2-proxy` Secret (oidc keys from
# `clickstack-sso-outputs` via `clickstack-k8s`, no pass:// seeding; cookie via
# separate proton-pass ExternalSecret). connections.json renders statically (operator
# `default`, empty password — CHI defines no users). S3 creds sync COSI BucketInfo
# via `clickstack-cosi`; `ferretdb-app-secret` username MUST equal `initdb.owner`.
# `__PROTON_PASS_BASE__` is an overlay-replaced placeholder.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: clickstack-k8s
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
spec:
  provider:
    kubernetes:
      remoteNamespace: clickstack
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-k8s
    kind: SecretStore
  target:
    name: oauth2-proxy
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: clickstack-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: clickstack-sso-outputs
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-cookie
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy
  data:
    - secretKey: cookie-secret
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/oauth2-proxy-cookie-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-hyperdx
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: clickstack-hyperdx
    template:
      data:
        api-key: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/hyperdx-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-hyperdx-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: clickstack-hyperdx-config
    template:
      data:
        connections.json: '[{"name":"Local ClickHouse","host":"http://clickhouse-clickstack.clickstack.svc:8123","port":8123,"username":"default","password":""}]'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-s3-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: clickhouse-s3-backup
    template:
      data:
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: clickstack-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: clickstack-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ferretdb-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: ferretdb-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: ferretdb
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/ferretdb-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
