# Namespace-local ClickHouseInstallation (1 shard x 2 replicas, `local-ssd-nvme`,
# S3 backups to `clickhouse/clickstack/`, no users — operator `default` user,
# empty password). Keeper reuses the shared infra `clickhouse-keeper` ensemble;
# stand up a local CHK first if cross-namespace resolution fails.
# `replicasCount` is a placeholder — overlays own the count.
# Server image tracks the infra line (`infra:clickhouse-server:tag` marker —
# reminder: bump WITH the infra clickhouse-server line, never alone).
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  # Operator exposes Service `clickhouse-<chi-name>` → `clickstack` yields
  # `clickhouse-clickstack`, the host every client dials.
  name: clickstack
spec:
  defaults:
    templates:
      dataVolumeClaimTemplate: clickhouse-data
      logVolumeClaimTemplate: clickhouse-log
      podTemplate: clickhouse-server
  configuration:
    zookeeper:
      keeper:
        name: clickhouse-keeper
        # Shared infra-namespace ensemble; stand up a local CHK if Pending.
        namespace: clickhouse
    clusters:
      - name: main
        layout:
          shardsCount: 1
          replicasCount: 2 # placeholder - overridden by dev/prd
    settings:
      backups/allowed_disk: backups_s3
    files:
      storage.xml: |
        <yandex>
          <storage_configuration>
            <disks>
              <backups_s3>
                <type>s3</type>
                <endpoint>__S3_ENDPOINT_URL__/clickhouse/clickstack/</endpoint>
                <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
              </backups_s3>
            </disks>
          </storage_configuration>
        </yandex>
  templates:
    podTemplates:
      - name: clickhouse-server
        spec:
          # Spread the 2 prd replicas across nodes (singletons on 1-node dev
          # stay schedulable: preferred, not required).
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        clickhouse.altinity.com/chi: clickstack
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: clickhouse-pod
              # Server line owned by the infra policy (`infra:clickhouse-server:tag`,
              # update-policies/clickstack.yaml carries NO clickhouse entry by
              # design — 26.8 LTS lockstep with installation-base.yaml +
              # backup-cronjob.yaml, hand-bumped in the same PR).
              image: clickhouse/clickhouse-server:26.8.10.6 # {"$imagepolicy": "infra:clickhouse-server:tag"}
              env:
                - name: CLICKHOUSE_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-s3-backup
                      key: access-key-id
                - name: CLICKHOUSE_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-s3-backup
                      key: secret-access-key
    volumeClaimTemplates:
      - name: clickhouse-data
        spec:
          storageClassName: local-ssd-nvme
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
      - name: clickhouse-log
        spec:
          storageClassName: local-ssd-nvme
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
