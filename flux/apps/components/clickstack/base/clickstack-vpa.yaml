# VPA recommenders for the four HPA-paired Deployments: updateMode Off —
# recommend-only (never VPA-apply on a resource HPA scales).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: clickstack
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clickstack
  updatePolicy:
    updateMode: 'Off'
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: clickstack-otel-collector
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clickstack-otel-collector
  updatePolicy:
    updateMode: 'Off'
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ferretdb
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ferretdb
  updatePolicy:
    updateMode: 'Off'
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: oauth2-proxy
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oauth2-proxy
  updatePolicy:
    updateMode: 'Off'
