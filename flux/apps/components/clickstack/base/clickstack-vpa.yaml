# VPA recommenders for the clickstack HPA-paired Deployments (clickstack,
# clickstack-otel-collector, ferretdb, oauth2-proxy): updateMode Off —
# recommender-only, because each HPA scales the same CPU/memory metrics
# (known-limitations.md: never VPA-apply on a resource HPA scales on).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: clickstack
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clickstack
  updatePolicy:
    updateMode: 'Off'
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: clickstack-otel-collector
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clickstack-otel-collector
  updatePolicy:
    updateMode: 'Off'
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ferretdb
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ferretdb
  updatePolicy:
    updateMode: 'Off'
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: oauth2-proxy
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oauth2-proxy
  updatePolicy:
    updateMode: 'Off'
