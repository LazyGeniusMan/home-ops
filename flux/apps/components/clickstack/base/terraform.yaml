# `clickstack` Zitadel project + `clickstack-admin` role + grant + OIDC client,
# machine-applied by Tofu Controller (project-scoped: never implies org admin).
# Fleet ordering (`apps` after `infra-configs`) is the only ordering — no Terraform
# `dependsOn`. IDs + provider auth mirror from the FirstInstance handoff via ESO
# (no org literal, no vault seeding). Outputs land in `clickstack-sso-outputs`
# (via `clickstack-k8s`, never Git/Pass). Upsert-only (`destroy` knobs false);
# in-cluster state; drift on. Placeholders overlay-replaced (vars patched by
# index — keep order).
---
# Cross-namespace handoff mirror: `zitadel` namespace handoff Secrets into
# `clickstack-terraform-vars` via the `clickstack-zitadel` store (RBAC in
# `zitadel-handoff-rbac.yaml`). `server.url` omitted (kubernetes.default).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-handoff-reader
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: clickstack-zitadel
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-handoff-reader
---
# Vars mirror: provider auth from `zitadel-bootstrap-credentials`, IDs from
# `zitadel-bootstrap-outputs` (keys land under module var names).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-zitadel
    kind: SecretStore
  target:
    name: clickstack-terraform-vars
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: zitadel-bootstrap-credentials
        property: jwt_profile_json
    - secretKey: org_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: org_id
    - secretKey: admin_user_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: admin_user_id

---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: clickstack-sso
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: `destroy` knobs stay false (default); no `tofu destroy` via Flux.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared zitadel SSO root (cross-namespace `infra` OCIRepository in `zitadel`,
  # path ./terraform). Secrets arrive via `varsFrom` (overrides `vars` on
  # collision). Admin-only proxy: `create_user_role` + `create_cookie_secret`
  # stay false. Vars patched by index in overlays (keep order).
  # Bool vars ride UNQUOTED (native HCL bool).
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: zitadel
  path: ./terraform
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: project_name
      value: clickstack
    - name: login_base_uri
      value: __ZITADEL_LOGIN_URI__
    - name: redirect_uris
      value:
        - https://__SERVICE_HOST__/*
    - name: post_logout_redirect_uris
      value:
        - https://__SERVICE_HOST__/
    - name: create_user_role
      value: false
    - name: create_cookie_secret
      value: false
  varsFrom:
    - kind: Secret
      name: clickstack-terraform-vars
  writeOutputsToSecret:
    name: clickstack-sso-outputs
    outputs:
      - client_id
      - client_secret
