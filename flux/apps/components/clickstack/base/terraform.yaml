# Clickstack SSO identity (§11.2), machine-applied by Tofu Controller.
# Owns ONLY this app's slice: the `clickstack` Zitadel project +
# project-scoped admin role (clickstack-admin) + admin grant + the
# `clickstack` OIDC client. Project-scoped means clickstack-admin NEVER
# implies org admin.
#
# Ordering: this object ships in the app Kustomization (fleet `apps`
# Kustomization dependsOn `infra-configs`), so it only
# reconciles after the Zitadel HelmRelease + FirstInstance setup Job are Ready.
# Terraform `dependsOn` is Terraform-CR-only upstream (checkDependencies resolves
# every entry as kind Terraform), so NO dependsOn entry here — the fleet ordering
# above is the mechanism.
# Upstream wiring: org_id + admin_user_id flow from the FirstInstance handoff
# (`zitadel-bootstrap-outputs` Secret in the `zitadel` namespace, operator-created
# once per the zitadel README runbook) via the ESO-synced `clickstack-terraform-vars`
# Secret (same-namespace `varsFrom` below; the cross-namespace `clickstack-zitadel`
# SecretStore + narrow `clickstack-zitadel-handoff-reader` Role in `zitadel-handoff-rbac.yaml` do the
# mirroring). NO org_id literal in git, NO manual per-env fill, NO email lookups,
# NO remote-state read off the retired bootstrap state. Provider auth likewise
# flows from the chart handoff (`zitadel-bootstrap-credentials` key
# `jwt_profile_json`) through the same Secret. Same-namespace `varsFrom` CANNOT
# cross namespaces (no namespace field), which is why the ESO mirror + RBAC is
# the mechanism here.
# First-run prerequisite (zero-UI): chart setup Job mints the key + ESO mirrors
# both handoff Secrets. Without the mirrored `clickstack-terraform-vars` the CR
# retries on interval — no vault seeding, no console step.
# Backend: in-cluster Kubernetes default (state Secrets in the clickstack
# namespace) — no backendConfig needed. Drift detection stays on (default).
# Outputs: client_id + client_secret land in `clickstack-sso-outputs` (sensitive);
# the `oauth2-proxy` ExternalSecret consumes BOTH from that Secret through the
# in-cluster `clickstack-k8s` SecretStore (base/clickstack-secrets.yaml) —
# never Git, never Proton Pass.
---
# Cross-namespace handoff reader: mirrors the two chart-minted handoff Secrets
# from the `zitadel` namespace into this namespace's `clickstack-terraform-vars`
# Secret (remoteNamespace MUST be `zitadel` — ESO reads REMOTE secrets through
# this namespace's `eso-zitadel-handoff-reader` SA; the narrow Role + RoleBinding
# in `zitadel-handoff-rbac.yaml` grant get/list/watch on the two handoff Secrets
# only). Same pattern as the in-namespace `clickstack-k8s` store
# (server.url omitted = kubernetes.default, kube-root-ca.crt supplies the API CA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-handoff-reader
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: clickstack-zitadel
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-handoff-reader
---
# Zero-UI vars mirror: provider auth (`jwt_profile_json`) from the chart-kept
# `zitadel-bootstrap-credentials`, IDs (`org_id`, `admin_user_id`) from the
# operator-created `zitadel-bootstrap-outputs` — no Proton Pass seeding, no
# manual vault step. Keys land under the module var names so `varsFrom` below
# needs no varsKeys renames.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-zitadel
    kind: SecretStore
  target:
    name: clickstack-terraform-vars
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: zitadel-bootstrap-credentials
        property: jwt_profile_json
    - secretKey: org_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: org_id
    - secretKey: admin_user_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: admin_user_id

---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: clickstack-sso
spec:
  interval: 30m
  approvePlan: auto
  # App OCI artifact (same namespace, in-tenant `apps` OCIRepository):
  # the artifact packs the whole component dir, terraform/ included.
  sourceRef:
    kind: OCIRepository
    name: apps
  path: ./terraform
  # Plain (non-sensitive) per-env values; secrets come from varsFrom below.
  # varsFrom overrides vars on key collision (upstream GenerateVarsForTF).
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: app_host
      value: __SERVICE_HOST__
  varsFrom:
    - kind: Secret
      name: clickstack-terraform-vars
  writeOutputsToSecret:
    name: clickstack-sso-outputs
    outputs:
      - client_id
      - client_secret
