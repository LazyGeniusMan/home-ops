# `ferretdb` CNPG Cluster (dbname/owner `ferretdb`, 3 instances, sync quorum 1,
# `local-ssd-nvme`, WAL + daily base backup to `s3://cnpg-backups/ferretdb/`).
# App password from `ferretdb-app-secret` (username MUST equal `initdb.owner`).
# S3 keys are COSI-minted via `clickstack-cosi` (cosi-keys.yaml). `instances`
# and `__S3_ENDPOINT_URL__` are overlay-replaced placeholders. PITR: apply a
# NEW Cluster with `bootstrap.recovery` (stanza below) instead of `initdb`.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: cnpg-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        ACCESS_SECRET_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: ferretdb-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: ferretdb-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ferretdb
spec:
  instances: 3 # placeholder - overridden by dev/prd

  postgresql:
    synchronous:
      standbyNames: ["*"]
      number: 1

  bootstrap:
    initdb:
      database: ferretdb
      owner: ferretdb
      secret:
        name: ferretdb-app-secret
  # PITR: NEW Cluster from an existing backup instead of initdb (uncomment, set
  # backup name + target timestamp).
  # bootstrap:
  #   recovery:
  #     backup:
  #       name: ferretdb-backup
  #     recoveryTarget:
  #       targetTime: "2026-09-08 00:00:00.00000+00"

  storage:
    storageClass: local-ssd-nvme
    size: 20Gi

  affinity:
    enablePodAntiAffinity: true

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/ferretdb/
      endpointURL: __S3_ENDPOINT_URL__
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
---
# Daily base backup to the same Barman object store.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ferretdb-backup
spec:
  schedule: "0 0 0 * * *" # midnight daily (CNPG uses 6-field cron)
  backupOwnerReference: self
  cluster:
    name: ferretdb
