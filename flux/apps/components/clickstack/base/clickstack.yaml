# HyperDX app + OTel Collector as plain Deployments (backends: namespace-local
# CHI in clickstack-clickhouse.yaml, FerretDB in ferretdb.yaml). All credentials
# are secretKeyRefs to ESO-synced Secrets. Images track the hdx-oss-v2
# appVersion line (`apps:hyperdx(-otel-collector):tag` markers). Telemetry off
# (`USAGE_STATS_ENABLED=false`; app OTLP points at the in-namespace collector).
# No ServiceMonitor: the Deployments expose no scrape endpoint yet, and the flip
# waits for monitoring CRDs via the otel pipeline (see the ESO
# `renderMode: skipIfMissing` template in
# external-secrets/controllers/base/externalsecrets.yaml). `__SERVICE_HOST__`
# is an overlay-replaced placeholder.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickstack
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
spec:
  replicas: 1 # create-time seed, HPA owns runtime count
  selector:
    matchLabels:
      app.kubernetes.io/name: clickstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickstack
        app.kubernetes.io/part-of: clickstack
    spec:
      containers:
        - name: hyperdx
          image: docker.hyperdx.io/hyperdx/hyperdx:v2.7.1 # {"$imagepolicy": "apps:hyperdx:tag"}
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_PORT
              value: "3000"
            - name: API_PORT
              value: "8000"
            - name: FRONTEND_URL
              value: "https://__SERVICE_HOST__"
            - name: HYPERDX_API_PORT
              value: "8000"
            - name: HYPERDX_APP_PORT
              value: "3000"
            - name: HYPERDX_LOG_LEVEL
              value: "info"
            # Mongo-wire backend: FerretDB Service in this namespace (ferretdb.yaml).
            - name: MONGO_URI
              value: "mongodb://ferretdb.clickstack.svc:27017/hyperdx"
            - name: OTEL_SERVICE_NAME
              value: "hdx-oss-api"
            # Telemetry off (chart knob defaults true); app OTLP stays in-namespace.
            - name: USAGE_STATS_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://clickstack-otel-collector.clickstack.svc:4318"
            - name: HYPERDX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clickstack-hyperdx
                  key: api-key
            # Operator `default` user, empty password (CHI defines no users).
            - name: DEFAULT_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: clickstack-hyperdx-config
                  key: connections.json
          ports:
            - name: app
              containerPort: 3000
            - name: api
              containerPort: 8000
            - name: opamp
              containerPort: 4320
          # Probes: upstream hdx-oss-v2 hardcodes `path: /health` on :8000 (no
          # /healthz + /readyz on this image) — keep `/health` for both probes.
          # Startup gates liveness/readiness (10s x 30 = 300s budget) so
          # FerretDB/CHI warmup never trips restarts.
          startupProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness checks twice as often as liveness (period 10 vs 30) so
          # the Service drops unready pods fast; liveness stays slow (period
          # 30) to ride out GC pauses without restarts.
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: clickstack
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
spec:
  selector:
    app.kubernetes.io/name: clickstack
  ports:
    - name: app
      port: 3000
      targetPort: 3000
    - name: api
      port: 8000
      targetPort: 8000
    - name: opamp
      port: 4320
      targetPort: 4320
---
# OTel Collector Deployment (repointed at the external CHI + HyperDX app).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickstack-otel-collector
  labels:
    app.kubernetes.io/name: clickstack-otel-collector
    app.kubernetes.io/part-of: clickstack
spec:
  replicas: 1 # create-time seed, HPA owns runtime count
  selector:
    matchLabels:
      app.kubernetes.io/name: clickstack-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickstack-otel-collector
        app.kubernetes.io/part-of: clickstack
    spec:
      containers:
        - name: otel-collector
          image: docker.hyperdx.io/hyperdx/hyperdx-otel-collector:v2.7.1 # {"$imagepolicy": "apps:hyperdx-otel-collector:tag"}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_ENDPOINT
              value: "tcp://clickhouse-clickstack.clickstack.svc:9000?dial_timeout=10s"
            - name: CLICKHOUSE_SERVER_ENDPOINT
              value: "clickhouse-clickstack.clickstack.svc:9000"
            - name: OPAMP_SERVER_URL
              value: "http://clickstack.clickstack.svc:4320"
            - name: HYPERDX_LOG_LEVEL
              value: "info"
            - name: HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE
              value: "default"
            - name: HYPERDX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clickstack-hyperdx
                  key: api-key
            # Operator `default` user, empty password (CHI defines no users).
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              value: ""
          ports:
            - name: health
              containerPort: 13133
            - name: fluentd
              containerPort: 24225
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
          # Probes: upstream hdx-oss-v2 hardcodes `path: /` on :13133 (no
          # /healthz + /readyz on this image) — keep `/` for both probes.
          # Startup gates liveness/readiness (10s x 30 = 300s budget) so CHI
          # warmup never trips restarts.
          startupProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness checks twice as often as liveness (period 10 vs 30) so
          # the Service drops unready pods fast; liveness stays slow (period
          # 30) to ride out reloads without restarts.
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: clickstack-otel-collector
  labels:
    app.kubernetes.io/name: clickstack-otel-collector
    app.kubernetes.io/part-of: clickstack
spec:
  selector:
    app.kubernetes.io/name: clickstack-otel-collector
  ports:
    - name: health
      port: 13133
      targetPort: 13133
    - name: fluentd
      port: 24225
      targetPort: 24225
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888
