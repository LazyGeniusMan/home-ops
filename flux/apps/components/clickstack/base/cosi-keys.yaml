# COSI credential bridge: in-namespace `clickstack-cosi` SecretStore reading both
# COSI BucketInfo JSONs via the shared `eso-k8s-reader` SA (ships here; also
# backs `clickstack-k8s`). `server.url` omitted (defaults to kubernetes.default);
# `kube-root-ca.crt` supplies the API CA. Consumers use GJSON `property` on
# `BucketInfo.spec.secretS3`.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: clickstack-cosi
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/part-of: clickstack
spec:
  provider:
    kubernetes:
      remoteNamespace: clickstack
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
