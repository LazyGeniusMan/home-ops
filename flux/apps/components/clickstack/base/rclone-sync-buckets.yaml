# S3 -> Proton Drive backups of the `ferretdb` + `clickstack` COSI buckets
# (colocated with the consuming component — land in the `clickstack` tenant
# namespace via the Fleet `apps` Kustomization's `targetNamespace`). One
# HelmRelease per bucket, per the colocated-backup rule (centralized backup
# is out of scope).
#
# What each syncs (SeaweedFS buckets provisioned by bucketclaims.yaml; the
# bucket prefix in each source path must exist before the first workload
# backup lands — CNPG/the CHI never create buckets):
# - `ferretdb`: the FerretDB CNPG Cluster WAL + base backups under the
#   barmanObjectStore prefix `cnpg-backups/ferretdb/` (see
#   ferretdb-postgres.yaml `destinationPath: s3://cnpg-backups/ferretdb/`).
#   rclone mirrors `<live-bucket>/cnpg-backups/ferretdb/` to Proton Drive
#   `/home-ops/backup/<cluster>/clickstack/ferretdb` (operation `sync`,
#   daily 03:30, `concurrencyPolicy: Forbid`, image pinned via chart
#   defaults rclone 1.75.0).
# - `clickstack`: the namespace-local CHI S3 backups under the storage.xml
#   prefix `clickhouse/clickstack/` (see clickstack-clickhouse.yaml
#   `<endpoint>__S3_ENDPOINT_URL__/clickhouse/clickstack/</endpoint>`,
#   credentials from the `clickhouse-s3-backup` ExternalSecret in
#   clickstack-secrets.yaml). rclone mirrors
#   `<live-bucket>/clickhouse/clickstack/` to Proton Drive
#   `/home-ops/backup/<cluster>/clickstack/clickstack` (operation `sync`,
#   daily 04:00 — staggered 30m after ferretdb so the two syncs never fight
#   over Proton Drive rate limits, `concurrencyPolicy: Forbid`).
#
# Live bucket names (NEVER hardcoded): the driver provisions each bucket under
# a controller-generated `bc-<uuid>` name (`spec.existingBucketName` is
# unset; the live name is only in `status.bucketName`). The BucketInfo JSON
# minted into Secrets `ferretdb-cosi-creds` / `clickstack-cosi-creds` carries
# that same live name at `spec.bucketName` (COSI sidecar contract — same JSON
# the existing `cnpg-s3-credentials` / `clickhouse-s3-backup` ExternalSecrets
# already read keys from), so the `rclone-*-s3-path` ExternalSecrets below
# template `<live-bucket>/<prefix>/` via GJSON `property`
# `BucketInfo.spec.bucketName` into synced Secrets, and the chart consumes
# them through `source.uri.esoRef` (`SRC_PATH` env + `$(VAR)` expansion in
# the `SRC:` arg — the chart-supported dynamic ref).
#
# S3 credentials: dedicated `rclone-ferretdb-s3` / `rclone-clickstack-s3`
# ExternalSecrets through the in-namespace `clickstack-cosi` SecretStore
# (cosi-keys.yaml), same GJSON pattern as `cnpg-s3-credentials` /
# `clickhouse-s3-backup`. Proton credentials: ONE shared
# `rclone-proton-credentials` ExternalSecret through the `proton-pass`
# ClusterSecretStore into a synced Secret consumed via the chart's `esoRef`
# (consume, not create) by BOTH HelmReleases.
#
# MANUAL SEEDING (Proton Pass vault, rclone-obscured where noted — generate
# with `rclone obscure`, see projects/helm-rclone-sync/README.md "Proton
# obscure step"; the ProtonDrive backend REJECTS plain-text passwords):
# - pass://<cluster>/clickstack/rclone-proton-username (plain login, NOT obscured)
# - pass://<cluster>/clickstack/rclone-proton-password (OBSCURED)
# - optional, only if the Proton account needs them (also OBSCURED; extend the
#   ExternalSecret data[] + each destination.credentials mailboxPassword/
#   otpSecretKey below): .../clickstack/rclone-proton-mailbox-password,
#   .../clickstack/rclone-proton-otp-secret-key
# Per-env overlay patches (dev/prd kustomization.yaml) repoint
# `__PROTON_PASS_BASE__` below to the full `pass://acme-<env>-...` keys and
# each destination uri to the full `/home-ops/backup/acme-<env>-...` path.
#
# Runtime note: provider AWS + the internal endpoint below mirror the chart's
# s3->proton-drive fixture
# (projects/helm-rclone-sync/ci/values-direction-05-s3-to-proton.yaml);
# region us-east-1 is ignored by SeaweedFS but required by S3 clients (same
# convention as the COSI README endpoint contract).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-ferretdb-s3-path
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: rclone-ferretdb-s3-path
    template:
      data:
        path: "{{ .bucketName }}/cnpg-backups/ferretdb/"
  data:
    - secretKey: bucketName
      remoteRef:
        key: ferretdb-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-ferretdb-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: rclone-ferretdb-s3
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: ferretdb-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: ferretdb-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-clickstack-s3-path
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: rclone-clickstack-s3-path
    template:
      data:
        path: "{{ .bucketName }}/clickhouse/clickstack/"
  data:
    - secretKey: bucketName
      remoteRef:
        key: clickstack-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-clickstack-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: rclone-clickstack-s3
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: clickstack-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: clickstack-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-proton-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: rclone-proton-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/rclone-proton-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/rclone-proton-password
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: helm-rclone-sync-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-rclone-sync
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-sync-ferretdb
spec:
  interval: 1h
  releaseName: rclone-sync-ferretdb
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-rclone-sync
  values:
    schedule: "30 3 * * *"
    concurrencyPolicy: Forbid
    rclone:
      operation: sync
    source:
      type: s3
      remoteName: ""
      uri:
        esoRef:
          name: rclone-ferretdb-s3-path
          key: path
      credentials:
        provider:
          value: AWS
        accessKeyId:
          esoRef:
            name: rclone-ferretdb-s3
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: rclone-ferretdb-s3
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      remoteName: ""
      uri:
        value: /home-ops/backup/__CLUSTER_NAME__/clickstack/ferretdb
      credentials:
        username:
          esoRef:
            name: rclone-proton-credentials
            key: username
        password:
          esoRef:
            name: rclone-proton-credentials
            key: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-sync-clickstack
spec:
  interval: 1h
  releaseName: rclone-sync-clickstack
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-rclone-sync
  values:
    schedule: "0 4 * * *"
    concurrencyPolicy: Forbid
    rclone:
      operation: sync
    source:
      type: s3
      remoteName: ""
      uri:
        esoRef:
          name: rclone-clickstack-s3-path
          key: path
      credentials:
        provider:
          value: AWS
        accessKeyId:
          esoRef:
            name: rclone-clickstack-s3
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: rclone-clickstack-s3
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      remoteName: ""
      uri:
        value: /home-ops/backup/__CLUSTER_NAME__/clickstack/clickstack
      credentials:
        username:
          esoRef:
            name: rclone-proton-credentials
            key: username
        password:
          esoRef:
            name: rclone-proton-credentials
            key: password
