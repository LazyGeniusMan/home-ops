# S3 -> Proton Drive backups of the `ferretdb` (03:30) + `clickstack` (04:00) COSI
# buckets, one HelmRelease per bucket (`sync`, `concurrencyPolicy: Forbid`). Live
# names template from BucketInfo `spec.bucketName` (never hardcoded); S3 keys via
# `clickstack-cosi`, Proton creds via shared `rclone-proton-credentials` (`esoRef`).
# Seed pass://<cluster>/clickstack/rclone-proton-{username (plain),password
# (rclone-obscured)}; optional mailbox/otp keys obscured too. Placeholders
# overlay-replaced. Chart source: projects/helm-rclone-sync.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-ferretdb-s3-path
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: rclone-ferretdb-s3-path
    template:
      data:
        path: "{{ .bucketName }}/cnpg-backups/ferretdb/"
  data:
    - secretKey: bucketName
      remoteRef:
        key: ferretdb-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-ferretdb-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: rclone-ferretdb-s3
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: ferretdb-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: ferretdb-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-clickstack-s3-path
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: rclone-clickstack-s3-path
    template:
      data:
        path: "{{ .bucketName }}/clickhouse/clickstack/"
  data:
    - secretKey: bucketName
      remoteRef:
        key: clickstack-cosi-creds
        property: BucketInfo.spec.bucketName
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-clickstack-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clickstack-cosi
    kind: SecretStore
  target:
    name: rclone-clickstack-s3
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: clickstack-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: clickstack-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-proton-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: rclone-proton-credentials
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/proton-username
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/rclone/proton-password
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: helm-rclone-sync-chart
spec:
  interval: 1h
  url: oci://ghcr.io/lazygeniusman/home-ops/projects/helm-rclone-sync
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Tag MUST equal Chart.yaml `version` in projects/helm-rclone-sync (bump
  # Chart.yaml + all six consumers together; no $imagepolicy marker — Helm
  # OCIRepositories are untracked by image automation).
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-sync-ferretdb
spec:
  interval: 1h
  releaseName: rclone-sync-ferretdb
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-rclone-sync
  values:
    schedule: "30 3 * * *"
    concurrencyPolicy: Forbid
    rclone:
      operation: sync
    source:
      type: s3
      remoteName: ""
      uri:
        esoRef:
          name: rclone-ferretdb-s3-path
          key: path
      credentials:
        provider:
          value: AWS
        accessKeyId:
          esoRef:
            name: rclone-ferretdb-s3
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: rclone-ferretdb-s3
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      remoteName: ""
      uri:
        value: /home-ops/backups/__CLUSTER_NAME__/clickstack/ferretdb
      credentials:
        username:
          esoRef:
            name: rclone-proton-credentials
            key: username
        password:
          esoRef:
            name: rclone-proton-credentials
            key: password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-sync-clickstack
spec:
  interval: 1h
  releaseName: rclone-sync-clickstack
  serviceAccountName: flux
  chartRef:
    kind: OCIRepository
    name: helm-rclone-sync-chart
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # https://github.com/lazygeniusman/home-ops/tree/main/projects/helm-rclone-sync
  values:
    schedule: "0 4 * * *"
    concurrencyPolicy: Forbid
    rclone:
      operation: sync
    source:
      type: s3
      remoteName: ""
      uri:
        esoRef:
          name: rclone-clickstack-s3-path
          key: path
      credentials:
        provider:
          value: AWS
        accessKeyId:
          esoRef:
            name: rclone-clickstack-s3
            key: accessKeyId
        secretAccessKey:
          esoRef:
            name: rclone-clickstack-s3
            key: secretAccessKey
        region:
          value: us-east-1
        endpoint:
          value: http://seaweed-main-s3.seaweedfs:8333
    destination:
      type: proton-drive
      remoteName: ""
      uri:
        value: /home-ops/backups/__CLUSTER_NAME__/clickstack/clickstack
      credentials:
        username:
          esoRef:
            name: rclone-proton-credentials
            key: username
        password:
          esoRef:
            name: rclone-proton-credentials
            key: password
