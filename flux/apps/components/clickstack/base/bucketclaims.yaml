# COSI buckets for clickstack backups (claims `ferretdb` + `clickstack`,
# BucketClass/seaweedfs, S3): live names are controller-generated
# (`bc-<uuid>`, read from `status.bucketName`); `spec.existingBucketName`
# stays unset. S3 prefixes must exist before the first workload backup lands
# (CNPG/CHI never create buckets). Keys bridge via `clickstack-cosi`
# (cosi-keys.yaml) BucketInfo JSON.
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: ferretdb
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: ferretdb-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: ferretdb
  credentialsSecretName: ferretdb-cosi-creds
  protocol: S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: clickstack
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: clickstack-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: clickstack
  credentialsSecretName: clickstack-cosi-creds
  protocol: S3
