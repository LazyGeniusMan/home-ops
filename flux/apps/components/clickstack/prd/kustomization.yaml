apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd secrets vault.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/oauth2-proxy-cookie-secret
    target:
      kind: ExternalSecret
      name: oauth2-proxy-cookie
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/hyperdx-api-key
    target:
      kind: ExternalSecret
      name: clickstack-hyperdx
  # (S3 keys COSI-minted — no per-env vault patch for S3 ExternalSecrets.)
  # Prd rclone identity (chart source: projects/helm-rclone-sync): vault keys +
  # destination cluster segments (base holds placeholders; one shared
  # rclone-proton-credentials ExternalSecret covers both releases).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/rclone/proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/rclone/proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backups/acme-prd-bdo1-talos-apps-01/clickstack/ferretdb
    target:
      kind: HelmRelease
      name: rclone-sync-ferretdb
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backups/acme-prd-bdo1-talos-apps-01/clickstack/clickstack
    target:
      kind: HelmRelease
      name: rclone-sync-clickstack
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/ferretdb-db-password
    target:
      kind: ExternalSecret
      name: ferretdb-app-secret
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  # Prd CNPG S3 endpoint (keys COSI-minted).
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs:8333
    target:
      kind: Cluster
      name: ferretdb
  # Prd CHI S3 backup endpoint.
  - patch: |
      - op: replace
        path: /spec/configuration/files/storage.xml
        value: |
          <yandex>
            <storage_configuration>
              <disks>
                <backups_s3>
                  <type>s3</type>
                  <endpoint>http://seaweed-main-s3.seaweedfs:8333/clickhouse/clickstack/</endpoint>
                  <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                  <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
                </backups_s3>
              </disks>
            </storage_configuration>
          </yandex>
    target:
      kind: ClickHouseInstallation
      name: clickstack

  # Prd route hostname.
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: clickstack.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: clickstack
  # Prd wildcard Certificate (placeholder -> prd values).
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
  # Prd app URL.
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "https://clickstack.home-ops.yansyah.my.id"
    target:
      kind: Deployment
      name: clickstack
  # Prd proxy identity (issuer, cookie domain, callback).
  - patch: |
      - op: replace
        path: /spec/values/extraArgs/oidc-issuer-url
        value: https://admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/cookie-domain
        value: .home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/redirect-url
        value: https://clickstack.home-ops.yansyah.my.id/oauth2/callback
    target:
      kind: HelmRelease
      name: oauth2-proxy
  # Prd SSO Terraform identity (issuer host + redirect URIs; IDs mirror from
  # the handoff — no per-env ID literals).
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: https://login.zitadel.home-ops.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/3/value/0
        value: https://clickstack.home-ops.yansyah.my.id/*
      - op: replace
        path: /spec/vars/4/value/0
        value: https://clickstack.home-ops.yansyah.my.id/
    target:
      kind: Terraform
      name: clickstack-sso
  # Prd scaling: HPA placeholders -> 2/4; stateful placeholders -> 3/2.
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: clickstack
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: clickstack-otel-collector
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: ferretdb
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: oauth2-proxy
  - patch: |
      - op: replace
        path: /spec/instances
        value: 3
    target:
      kind: Cluster
      name: ferretdb
  - patch: |
      - op: replace
        path: /spec/configuration/clusters/0/layout/replicasCount
        value: 2
    target:
      kind: ClickHouseInstallation
      name: clickstack
