apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd secrets vault (pass://acme-prd-bdo1-talos-apps-01).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/oauth2-proxy-cookie-secret
    target:
      kind: ExternalSecret
      name: oauth2-proxy-cookie
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/hyperdx-api-key
    target:
      kind: ExternalSecret
      name: clickstack-hyperdx
  # (S3 keys are COSI-minted via the in-namespace clickstack-cosi
  # SecretStore — no per-env vault ref patch for clickhouse-s3-backup,
  # cnpg-s3-credentials, rclone-ferretdb-s3(+path), or rclone-clickstack-s3(+path).)
  # Prd rclone-sync-buckets identity (chart source: projects/helm-rclone-sync): Proton Pass vault keys + the Proton
  # Drive destination cluster segments (base holds __PROTON_PASS_BASE__ /
  # __CLUSTER_NAME__ placeholders; both HelmReleases share the one
  # rclone-proton-credentials ExternalSecret, so one patch covers both).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/rclone-proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/rclone-proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backups/acme-prd-bdo1-talos-apps-01/clickstack/ferretdb
    target:
      kind: HelmRelease
      name: rclone-sync-ferretdb
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backups/acme-prd-bdo1-talos-apps-01/clickstack/clickstack
    target:
      kind: HelmRelease
      name: rclone-sync-clickstack
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/ferretdb-db-password
    target:
      kind: ExternalSecret
      name: ferretdb-app-secret
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  # Prd CNPG S3 endpoint. (S3 keys are COSI-minted via the in-namespace
  # clickstack-cosi SecretStore — no per-env vault ref patch for
  # cnpg-s3-credentials.)
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs:8333
    target:
      kind: Cluster
      name: ferretdb
  # Prd S3 backup endpoint.
  - patch: |
      - op: replace
        path: /spec/configuration/files/storage.xml
        value: |
          <yandex>
            <storage_configuration>
              <disks>
                <backups_s3>
                  <type>s3</type>
                  <endpoint>http://seaweed-main-s3.seaweedfs:8333/clickhouse/clickstack/</endpoint>
                  <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                  <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
                </backups_s3>
              </disks>
            </storage_configuration>
          </yandex>
    target:
      kind: ClickHouseInstallation
      name: clickstack

  # Prd route hostname (clickstack.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: clickstack.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: clickstack
  # Prd wildcard Certificate.
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
  # Prd app URL (FRONTEND_URL).
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "https://clickstack.home-ops.yansyah.my.id"
    target:
      kind: Deployment
      name: clickstack
  # Prd proxy: Zitadel issuer, cookie domain, callback (values keys, not
  # arg indices — the chart takes every flag from extraArgs).
  - patch: |
      - op: replace
        path: /spec/values/extraArgs/oidc-issuer-url
        value: https://admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/cookie-domain
        value: .home-ops.yansyah.my.id
      - op: replace
        path: /spec/values/extraArgs/redirect-url
        value: https://clickstack.home-ops.yansyah.my.id/oauth2/callback
    target:
      kind: HelmRelease
      name: oauth2-proxy
  # Prd Clickstack SSO Terraform identity: CR vars (issuer host, rendered
  # redirect + post-logout URIs against the shared zitadel root).
  # org_id + admin ID mirror from the FirstInstance handoff via the
  # cross-namespace SecretStore — no vault ref patch, no per-env ID literals.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: https://login.zitadel.home-ops.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/3/value/0
        value: https://clickstack.home-ops.yansyah.my.id/*
      - op: replace
        path: /spec/vars/4/value/0
        value: https://clickstack.home-ops.yansyah.my.id/
    target:
      kind: Terraform
      name: clickstack-sso
  # Prd replica counts: stateless/HA floor (2), CNPG 3, CHI 2. No Deployment
  # /spec/replicas patch: base replicas: 1 is the create-time seed, HPA
  # owns runtime count (HPA minReplicas enforces the floor); the HPAs below
  # scale 2-4 on CPU+memory.
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: clickstack
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: clickstack-otel-collector
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: ferretdb
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: oauth2-proxy
  - patch: |
      - op: replace
        path: /spec/instances
        value: 3
    target:
      kind: Cluster
      name: ferretdb
  - patch: |
      - op: replace
        path: /spec/configuration/clusters/0/layout/replicasCount
        value: 2
    target:
      kind: ClickHouseInstallation
      name: clickstack
