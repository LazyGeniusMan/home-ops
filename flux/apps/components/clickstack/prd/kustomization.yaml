apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Prd secrets vault (pass://acme-prd-bdo1-talos-apps-01).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/oauth2-proxy-cookie-secret
    target:
      kind: ExternalSecret
      name: oauth2-proxy-cookie
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/hyperdx-api-key
    target:
      kind: ExternalSecret
      name: clickstack-hyperdx
  # (S3 keys are COSI-minted via the in-namespace clickstack-cosi
  # SecretStore — no per-env vault ref patch for clickhouse-s3-backup,
  # cnpg-s3-credentials, rclone-ferretdb-s3(+path), or rclone-clickstack-s3(+path).)
  # Prd rclone-sync-buckets identity: Proton Pass vault keys + the Proton
  # Drive destination cluster segments (base holds __PROTON_PASS_BASE__ /
  # __CLUSTER_NAME__ placeholders; both HelmReleases share the one
  # rclone-proton-credentials ExternalSecret, so one patch covers both).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/rclone-proton-username
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/rclone-proton-password
    target:
      kind: ExternalSecret
      name: rclone-proton-credentials
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backup/acme-prd-bdo1-talos-apps-01/clickstack/ferretdb
    target:
      kind: HelmRelease
      name: rclone-sync-ferretdb
  - patch: |
      - op: replace
        path: /spec/values/destination/uri/value
        value: /home-ops/backup/acme-prd-bdo1-talos-apps-01/clickstack/clickstack
    target:
      kind: HelmRelease
      name: rclone-sync-clickstack
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/clickstack/ferretdb-db-password
    target:
      kind: ExternalSecret
      name: ferretdb-app-secret
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  # Prd CNPG S3 endpoint. (S3 keys are COSI-minted via the in-namespace
  # clickstack-cosi SecretStore — no per-env vault ref patch for
  # cnpg-s3-credentials.)
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Cluster
      name: ferretdb
  # Prd S3 backup endpoint.
  - patch: |
      - op: replace
        path: /spec/configuration/files/storage.xml
        value: |
          <yandex>
            <storage_configuration>
              <disks>
                <backups_s3>
                  <type>s3</type>
                  <endpoint>http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333/clickhouse/clickstack/</endpoint>
                  <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                  <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
                </backups_s3>
              </disks>
            </storage_configuration>
          </yandex>
    target:
      kind: ClickHouseInstallation
      name: clickstack

  # Prd route hostname (clickstack.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: clickstack.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: clickstack
  # Prd wildcard Certificate.
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__
  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
  # Prd app URL (FRONTEND_URL).
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "https://clickstack.home-ops.yansyah.my.id"
    target:
      kind: Deployment
      name: clickstack
  # Prd proxy: Zitadel issuer, cookie domain, callback.
  # (args shifted by one after the --client-id flag moved to
  # OAUTH2_PROXY_CLIENT_ID env: cookie-domain args/7 -> args/6,
  # redirect args/16 -> args/15.)
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --oidc-issuer-url=https://zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/args/6
        value: --cookie-domain=.home-ops.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/args/15
        value: --redirect-url=https://clickstack.home-ops.yansyah.my.id/oauth2/callback
    target:
      kind: Deployment
      name: oauth2-proxy
  # Prd Clickstack SSO Terraform identity: CR vars (issuer host, app host).
  # org_id + admin ID mirror from the FirstInstance handoff via the
  # cross-namespace SecretStore — no vault ref patch, no per-env ID literals.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/1/value
        value: clickstack.home-ops.yansyah.my.id
    target:
      kind: Terraform
      name: clickstack-sso
  # Prd replica counts: stateless HA (2), proxies/singletons stay 1, CNPG 3, CHI 2.
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: clickstack
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: clickstack-otel-collector
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: oauth2-proxy
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: ferretdb
  - patch: |
      - op: replace
        path: /spec/instances
        value: 3
    target:
      kind: Cluster
      name: ferretdb
  - patch: |
      - op: replace
        path: /spec/configuration/clusters/0/layout/replicasCount
        value: 2
    target:
      kind: ClickHouseInstallation
      name: clickstack
