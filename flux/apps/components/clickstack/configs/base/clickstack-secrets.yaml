# Clickstack secrets (§11.2): synced by ESO from Proton Pass — Git holds
# remoteRefs only, never values. Seed each vault entry with pass-cli.
# - oauth2-proxy: the shared OIDC client secret (Zitadel client
#   oauth2-proxy-shared) + the per-instance cookie secret (32 random bytes,
#   e.g. `head -c32 /dev/urandom | base64`). Mounted as files for
#   --client-secret-file / --cookie-secret-file.
# - clickstack-hyperdx: the HyperDX API key (uuid; the chart's single
#   hyperdx.apiKey consumed by BOTH the app container and the collector as
#   HYPERDX_API_KEY).
# - clickstack-hyperdx-config: connections.json rendered into a Secret by ESO
#   from a STATIC template (operator default user, empty password —
#   intra-cluster only, matches the CHI's no-users stance). The app reads it
#   as DEFAULT_CONNECTIONS. Hardening follow-up replaces `default` with a
#   dedicated app user once ESO-managed ClickHouse passwords land.
#   (No clickstack-clickhouse-credentials ExternalSecret ships for the same
#   reason: the CHI defines no users, so there is no password to sync.)
# - clickhouse-s3-backup: same SeaweedFS S3 credential pair as §§10.2/12,
#   referenced by the CHI pod env for backup disks.
# - ferretdb-app-secret: CNPG initdb app-user secret (basic-auth, username
#   MUST equal spec.bootstrap.initdb.owner = ferretdb per upstream).
# - cloudflare-api-token: mirrors cert-manager/configs/base/cluster-issuer.yaml
#   (same Proton Pass remoteRef) so the DNS-01 solver credential exists in
#   this namespace too.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy
  data:
    - secretKey: client-secret
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/oauth2-proxy-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/oauth2-proxy-cookie-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-hyperdx
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: clickstack-hyperdx
    template:
      data:
        api-key: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/hyperdx-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-hyperdx-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: clickstack-hyperdx-config
    template:
      data:
        connections.json: '[{"name":"Local ClickHouse","host":"http://clickhouse-clickstack.clickstack.svc:8123","port":8123,"username":"default","password":""}]'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-s3-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: clickhouse-s3-backup
    template:
      data:
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/s3-access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/s3-secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ferretdb-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: ferretdb-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: ferretdb
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/clickstack/ferretdb-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
