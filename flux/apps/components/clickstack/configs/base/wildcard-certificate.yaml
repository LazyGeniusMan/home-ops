# In-namespace wildcard Certificate (§§8.1/9.3/11.2). cert-manager Secrets are
# namespace-local, so the §9 Certificate (cert-manager namespace) cannot feed
# this component's Gateway listener — this duplicate Certificate mints
# wildcard-home-ops-tls HERE via the same ClusterIssuer/letsencrypt and
# dnsNames (same pattern as §8.1 gateway-api and §11.1 zitadel). The token
# ExternalSecret (clickstack-secrets.yaml) mirrors
# cert-manager/configs/base/cluster-issuer.yaml (same Proton Pass remoteRef)
# so the DNS-01 solver credential exists in this namespace too.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-home-ops
spec:
  secretName: wildcard-home-ops-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.home-ops.yansyah.my.id"
