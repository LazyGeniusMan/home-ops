# Clickstack ClickHouse (§14 dev): namespace-local instantiation of the §14
# DEV installation template (flux/infra/components/clickhouse — referenced by
# shape, no file dependency). Same classes as the base: 1 shard x 2 replicas
# against the shared 3-replica Keeper ensemble (the operator resolves keeper
# endpoints from the infra-namespace CHK by name — NOT duplicated here),
# storageClass local-ssd-nvme (50Gi data + 5Gi log), no users (operator
# defaults: `default`, empty password, intra-cluster only — committing
# placeholder passwords would put real credentials in Git).
# Dev deltas: S3 backup endpoint → the DEV SeaweedFS S3 under
# s3://.../clickhouse/clickstack/ (credentials from the clickhouse-s3-backup
# Secret synced by clickstack-secrets.yaml). Per-table replication: create
# tables with ReplicatedMergeTree + ON CLUSTER DDL; keeper path defaults to
# /clickhouse/backups.
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  # Name `clickstack` (not clickhouse-clickstack): the operator exposes the
  # cluster as Service `clickhouse-<chi-name>`, so this yields
  # `clickhouse-clickstack` — the host every client below dials.
  name: clickstack
spec:
  defaults:
    templates:
      dataVolumeClaimTemplate: clickhouse-data
      logVolumeClaimTemplate: clickhouse-log
      podTemplate: clickhouse-server
  configuration:
    zookeeper:
      keeper:
        name: clickhouse-keeper
        # Assumes the operator resolves the shared infra-namespace ensemble
        # cross-namespace (same "references the CHK by name" rule as the base).
        # If the CHI stays Pending on keeper resolution, stand up a
        # component-local CHK from the §14 DEV base shape and point here.
        namespace: clickhouse
    clusters:
      - name: main
        layout:
          shardsCount: 1
          replicasCount: 2
    settings:
      backups/allowed_disk: backups_s3
    files:
      storage.xml: |
        <yandex>
          <storage_configuration>
            <disks>
              <backups_s3>
                <type>s3</type>
                <endpoint>https://s3.seaweedfs.homelab-dev.yansyah.my.id/clickhouse/clickstack/</endpoint>
                <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
              </backups_s3>
            </disks>
          </storage_configuration>
        </yandex>
  templates:
    podTemplates:
      - name: clickhouse-server
        spec:
          containers:
            - name: clickhouse-pod
              image: clickhouse/clickhouse-server:25.9.7.56
              env:
                - name: CLICKHOUSE_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-s3-backup
                      key: access-key-id
                - name: CLICKHOUSE_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-s3-backup
                      key: secret-access-key
    volumeClaimTemplates:
      - name: clickhouse-data
        spec:
          storageClassName: local-ssd-nvme
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
      - name: clickhouse-log
        spec:
          storageClassName: local-ssd-nvme
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
