apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # No route/vault/cert patches: internal ClusterIP only (no HTTPRoute),
  # no ExternalSecrets (Matrix creds ride per-request urls or a later ESO
  # Secret — see README Matrix strategy). Dev replica counts: minimal
  # single-replica footprint. No Deployment /spec/replicas patch: base
  # replicas: 1 is the create-time seed, HPA owns runtime count (HPA
  # minReplicas enforces the floor); the HPA below scales 1-2 on
  # CPU+memory.
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: apprise-go-api
