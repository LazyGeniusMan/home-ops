apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # No route/vault/cert patches: internal ClusterIP only (no HTTPRoute),
  # no ExternalSecrets (Matrix creds ride per-request urls or a later ESO
  # Secret — see README Matrix strategy). Prd replica counts: stateless HA
  # floor (2). No Deployment /spec/replicas patch: base replicas: 1 is the
  # create-time seed, HPA owns runtime count (HPA minReplicas enforces the
  # floor); the HPA below scales 2-4 on CPU+memory.
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: apprise-go-api
