apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # No route/cert patches: internal ClusterIP only (no HTTPRoute).
  # Vault: per-env Proton Pass path for the stateless-URLs fallback
  # (base holds __PROTON_PASS_BASE__ placeholders; both data entries
  # patched — notifier token + homeserver host). Prd replica counts:
  # stateless HA floor (2). No Deployment /spec/replicas patch: base
  # replicas: 1 is the create-time seed, HPA owns runtime count (HPA
  # minReplicas enforces the floor); the HPA below scales 2-4 on
  # CPU+memory.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/matrix-rooms/notifier-bot-token
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/matrix-rooms/homeserver-host
    target:
      kind: ExternalSecret
      name: apprise-stateless-urls
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: apprise-go-api
