# apprise-go-api HPA (autoscaling/v2 over the hand-vendored Deployment —
# no chart autoscaling knob exists, so the HPA lives here, headlamp shape).
# Stateless (request-scoped state only; APPRISE_STATELESS_STORAGE=no), so
# horizontal scaling is safe. No Deployment /spec/replicas overlay patches:
# base replicas: 1 is the create-time seed, HPA owns runtime count (HPA
# minReplicas enforces the floor). Dev min 1/max 2, prd min 2/max 4 via
# overlay patches. CPU + memory: the Deployment requests cpu/memory, so HPA
# works.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apprise-go-api
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apprise-go-api
  minReplicas: 1 # placeholder - overridden by dev/prd
  maxReplicas: 2 # placeholder - overridden by dev/prd
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
