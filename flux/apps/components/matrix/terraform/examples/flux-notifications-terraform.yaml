# Example consumer: flux-notifications room (BOT posts, humans read).
# Copy into flux/apps/components/<team>/base/terraform.yaml, rename every
# matrix-rooms-*, replace mxids/hostnames. Reconciles after tuwunel is Ready
# (fleet `apps` dependsOn `infra-configs`); no Terraform dependsOn (Terraform-CR-only upstream).
# Notification-only (events_default 50 — members CANNOT post) + plaintext
# (encryption_enabled false — E2EE unreadable to the stateless notifier, irreversible).
# Provider auth flows from the TEAM's own bot-token mirror Secret (same-namespace `varsFrom`;
# keys land under module var names, no varsKeys renames). Team namespaces mint their own bot —
# NEVER the matrix tenant's kept Secret (varsFrom cannot cross namespaces). No token literal
# in git. Backend: in-cluster default, no backendConfig. Outputs land in
# `flux-notifications-outputs`. Prerequisite: the bootstrap runbook (../README.md) minted
# the bot per env; without `matrix-rooms-terraform-vars` the CR retries.
---
# Vars mirror: bot token + homeserver URL from the vault via the cluster-scoped
# `proton-pass` store (keys land under module var names, no varsKeys renames).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-rooms-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: matrix-rooms-terraform-vars
  data:
    - secretKey: homeserver_url
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/homeserver-url
    - secretKey: access_token
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/bot-access-token
    - secretKey: user_id
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/bot-user-id
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: flux-notifications
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: no `tofu destroy` path via Flux.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared rooms root: apps/matrix OCI artifact (namespace `matrix`), path ./terraform.
  sourceRef:
    kind: OCIRepository
    name: apps
    namespace: matrix
  path: ./terraform
  # Plain per-room values; secrets from varsFrom (overrides vars on collision).
  # Bot pinned at 100 by the module (self-lockout safe); on-call lead at 50.
  # Notification-only (events_default 50) + plaintext (encryption_enabled false, irreversible).
  vars:
    - name: room_name
      value: flux-notifications
    - name: topic
      value: Flux + Apprise delivery receipts (bot posts, humans read)
    - name: preset
      value: private_chat
    - name: visibility
      value: private
    - name: history_visibility
      value: shared
    - name: room_alias_name
      value: flux-notifications
    - name: encryption_enabled
      value: false
    - name: events_default
      value: 50
    - name: members
      value:
        "@oncall-lead:__SERVER_NAME__": invite
    - name: power_levels
      value:
        "@oncall-lead:__SERVER_NAME__": 50
    - name: join_rule
      value: invite
    - name: bot_room_display_name
      value: Flux Notifier
  varsFrom:
    - kind: Secret
      name: matrix-rooms-terraform-vars
  writeOutputsToSecret:
    name: flux-notifications-outputs
    outputs:
      - room_id
      - canonical_alias
      - bot_user_id
