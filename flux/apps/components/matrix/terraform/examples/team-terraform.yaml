# Example consumer: per-team opt-in room template (SUSPENDED by pairing, not
# by CR — the Terraform CR below is live, but nothing posts until a team
# Alert targets it).
#
# Copy into flux/apps/components/<team>/base/terraform.yaml, rename every
# placeholder (room name/alias `team` -> e.g. `payments`, the member mxid,
# the bot face), and wire the matching Alert: copy the suspended
# `team-optin` Alert from flux/apps/components/matrix/base/
# notifications.yaml, set eventSources[].namespace to the team tenant
# namespace, and unsuspend it. The `apprise-team` Provider address already
# carries `tag=team`, and the STATELESS_URLS fallback already has a
# `.../%23team?tag=team...` leg — but that leg points at the literal `#team`
# alias, so either (a) name the room alias `team` (single shared opt-in
# room), or (b) give the team its own room alias AND extend the fallback
# with a `?tag=<team>` leg pointing at it (the Provider tag must equal a
# fallback server tag or requests 204). See NOTIFICATIONS.md tag scheme.
#
# Notification-only power lock (events_default 50) + plaintext
# (encryption_enabled false): same rationale as the flux room header — the
# stateless apprise notifier has no Olm persistence, so E2EE rooms are
# unreadable to it.
# Team-owned bot-token mirror (same-namespace `varsFrom`; keys land under
# the module var names, no varsKeys renames). Team namespaces mint their own
# bot via their own bootstrap (same Job pattern as matrix
# base/matrix-bot-bootstrap.yaml) — NEVER the matrix tenant's kept Secret
# (varsFrom CANNOT cross namespaces).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-rooms-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: matrix-rooms-terraform-vars
  data:
    - secretKey: homeserver_url
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/homeserver-url
    - secretKey: access_token
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/bot-access-token
    - secretKey: user_id
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/bot-user-id
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: team
spec:
  interval: 30m
  approvePlan: auto
  destroy: false
  destroyResourcesOnDeletion: false
  sourceRef:
    kind: OCIRepository
    name: apps
    namespace: matrix
  path: ./terraform
  vars:
    - name: room_name
      value: team
    - name: topic
      value: Per-team opt-in notifications (bot posts, humans read)
    - name: preset
      value: private_chat
    - name: visibility
      value: private
    - name: history_visibility
      value: shared
    - name: room_alias_name
      value: team
    - name: encryption_enabled
      value: false
    - name: events_default
      value: 50
    - name: members
      value:
        "@team-lead:__SERVER_NAME__": invite
    - name: power_levels
      value:
        "@team-lead:__SERVER_NAME__": 50
    - name: join_rule
      value: invite
    - name: bot_room_display_name
      value: Team Notifier
  varsFrom:
    - kind: Secret
      name: matrix-rooms-terraform-vars
  writeOutputsToSecret:
    name: team-outputs
    outputs:
      - room_id
      - canonical_alias
      - bot_user_id
