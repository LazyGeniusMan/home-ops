# Example consumer: per-team opt-in room template (SUSPENDED by pairing, not by CR —
# the CR below is live, but nothing posts until a team Alert targets it).
# Copy into flux/apps/components/<team>/base/terraform.yaml, rename placeholders, and wire
# the matching Alert (copy suspended `team-optin` from base/notifications.yaml, set
# eventSources[].namespace, unsuspend). Either name the alias `team` (single shared room)
# or give the team its own alias + a `?tag=<team>` fallback leg (Provider tag MUST equal a
# fallback server tag or requests 204).
# Notification-only (events_default 50) + plaintext (encryption_enabled false — E2EE
# unreadable to the stateless notifier). Team-owned bot-token mirror (same-namespace
# `varsFrom`); team namespaces mint their own bot — NEVER the matrix kept Secret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-rooms-terraform-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: matrix-rooms-terraform-vars
  data:
    - secretKey: homeserver_url
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/homeserver-url
    - secretKey: access_token
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/bot-access-token
    - secretKey: user_id
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/bot-user-id
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: team
spec:
  interval: 30m
  approvePlan: auto
  destroy: false
  destroyResourcesOnDeletion: false
  sourceRef:
    kind: OCIRepository
    name: apps
    namespace: matrix
  path: ./terraform
  vars:
    - name: room_name
      value: team
    - name: topic
      value: Per-team opt-in notifications (bot posts, humans read)
    - name: preset
      value: private_chat
    - name: visibility
      value: private
    - name: history_visibility
      value: shared
    - name: room_alias_name
      value: team
    - name: encryption_enabled
      value: false
    - name: events_default
      value: 50
    - name: members
      value:
        "@team-lead:__SERVER_NAME__": invite
    - name: power_levels
      value:
        "@team-lead:__SERVER_NAME__": 50
    - name: join_rule
      value: invite
    - name: bot_room_display_name
      value: Team Notifier
  varsFrom:
    - kind: Secret
      name: matrix-rooms-terraform-vars
  writeOutputsToSecret:
    name: team-outputs
    outputs:
      - room_id
      - canonical_alias
      - bot_user_id
