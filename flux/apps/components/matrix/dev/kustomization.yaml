apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # ---- apprise-go-api consumer wiring (workload in the infra tenant; bootstrapped — no vault patch) ----
  # ---- tuwunel homeserver ----
  # Dev route hostnames.
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: tuwunel.matrix.home-ops-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: tuwunel-redirect

  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: tuwunel.matrix.home-ops-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: tuwunel-tls
  # No tuwunel-sso-client / tuwunel-s3 vault patches (SSO from tuwunel-sso outputs via
  # `tuwunel-k8s`; S3 COSI-minted via `tuwunel-cosi`).
  # Dev SSO identity: issuer host + login URI + redirect URIs against the shared
  # infra/zitadel root. POSITIONAL: /spec/vars/0 + /spec/vars/2 + /spec/vars/3 +
  # /spec/vars/4 — keep base/tuwunel-sso.yaml var order.
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: admin.zitadel.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: https://login.zitadel.home-ops-dev.yansyah.my.id/ui/v2/login
      - op: replace
        path: /spec/vars/3/value/0
        value: https://tuwunel.matrix.home-ops-dev.yansyah.my.id/_matrix/client/unstable/login/sso/callback/*
      - op: replace
        path: /spec/vars/4/value/0
        value: https://tuwunel.matrix.home-ops-dev.yansyah.my.id/
    target:
      kind: Terraform
      name: tuwunel-sso
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  # Dev registration shared secret (base holds the __PROTON_PASS_BASE__ placeholder).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/matrix/tuwunel-registration-secret
    target:
      kind: ExternalSecret
      name: tuwunel-registration-secret
  # Dev wildcard Certificate (wildcard-home-ops-dev).
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops-dev
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__

  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-dev-tls
    target:
      kind: Certificate
      name: wildcard-home-ops-dev

  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops-dev.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops-dev
  # Dev identity: server_name + well-known + issuer + SSO callback.
  # POSITIONAL: env/0 + env/5 + env/25 + env/26 (see base/tuwunel.yaml order note).
  # Callback embeds the matrix host; client_id suffix rides k8s $(VAR) expansion.
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: tuwunel.matrix.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: https://tuwunel.matrix.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/env/25/value
        value: https://admin.zitadel.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/env/26/value
        value: https://tuwunel.matrix.home-ops-dev.yansyah.my.id/_matrix/client/unstable/login/sso/callback/$(TUWUNEL_SSO_CLIENT_ID)
    target:
      kind: Deployment
      name: tuwunel
  # ---- mautrix-discord bridge + colocated Postgres ----
  # Dev Proton Pass identity (base holds __PROTON_PASS_BASE__ placeholders; S3 stays COSI-minted).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/mautrix-discord/bot-token
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/mautrix-discord/as-token
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/mautrix-discord/hs-token
      - op: replace
        path: /spec/data/3/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/mautrix-discord/avatar-proxy-key
      - op: replace
        path: /spec/data/4/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/mautrix-discord/direct-media-server-key
      - op: replace
        path: /spec/data/5/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/mautrix-discord/provisioning-shared-secret
      - op: replace
        path: /spec/data/6/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/mautrix-discord/double-puppet-shared-secret
    target:
      kind: ExternalSecret
      name: mautrix-discord

  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/mautrix-discord/db-password
    target:
      kind: ExternalSecret
      name: mautrix-discord-db-credentials

  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/mautrix-discord/db-password
    target:
      kind: ExternalSecret
      name: mautrix-discord-db-app-secret
  # S3 endpoint (internal SeaweedFS).
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs:8333
    target:
      kind: Cluster
      name: mautrix-discord-db
  # Dev homeserver link (in-namespace Service DNS, shared `matrix` namespace). Positional:
  # /spec/template/spec/containers/0/env/0 (HS_ADDRESS) +
  # /spec/template/spec/containers/0/env/1 (HS_DOMAIN).
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: http://tuwunel.matrix.svc:8008
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: tuwunel.matrix.home-ops-dev.yansyah.my.id
    target:
      kind: Deployment
      name: mautrix-discord
  # Dev bridge admin mxid. Positional: env/3 (BRIDGE_ADMIN_MXID).
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "@admin:tuwunel.matrix.home-ops-dev.yansyah.my.id"
    target:
      kind: Deployment
      name: mautrix-discord
  # Dev replica counts (bridge stays 1 — singleton; patch restates base so a future
  # base change cannot silently scale it).
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: mautrix-discord

  - patch: |
      - op: replace
        path: /spec/instances
        value: 1
    target:
      kind: Cluster
      name: mautrix-discord-db
  # ---- element-web stateless SPA + NetBird consumer ----
  # Dev route hostname.
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: element.matrix.home-ops-dev.yansyah.my.id
    target:
      kind: HTTPRoute
      name: element
  # Dev config.json: full-string replace (opaque string — sub-patches not addressable;
  # only hosts vary vs base).
  - patch: |
      - op: replace
        path: /data/config.json
        value: |
          {
              "default_server_config": {
                  "m.homeserver": {
                      "base_url": "https://tuwunel.matrix.home-ops-dev.yansyah.my.id"
                  }
              },
              "disable_custom_urls": true,
              "disable_guests": false,
              "disable_login_language_selector": false,
              "disable_3pid_login": false,
              "brand": "Element",
              "default_theme": "light",
              "permalink_prefix": "https://element.matrix.home-ops-dev.yansyah.my.id",
              "branding": {},
              "embedded_pages": {},
              "room_directory": {
                  "servers": [
                      "matrix.home-ops-dev.yansyah.my.id"
                  ]
              },
              "integrations_ui_url": null,
              "integrations_rest_url": null,
              "integrations_widgets_urls": [],
              "jitsi": {
                  "preferred_domain": "meet.element.io"
              },
              "help_url": "https://element.io/help",
              "help_encryption_url": "https://element.io/help#encryption",
              "default_federate": false,
              "show_labs_settings": false,
              "features": {},
              "setting_defaults": {
                  "breadcrumbs": true
              }
          }
    target:
      kind: ConfigMap
      name: element-config
  # No element-web cloudflare-api-token/Certificate patches — already applied under tuwunel
  # above (one ES + one Certificate remain).
  # Dev NetBird proxy vars: provider-token vault paths + service FQDN
  # (positional: /spec/vars/0 is domain — keep base order).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/element-web/netbird-pat
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-dev-bdo1-talos-apps-01/element-web/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: element-proxy-vars

  # cloudflare_zone_id absent = DNS self-managed (see base note).
  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: element.matrix.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: acme-dev-bdo1-talos-apps-01
      - op: replace
        path: /spec/vars/3/value
        value: 192.168.1.249
    target:
      kind: Terraform
      name: element-proxy
  # Dev replica bounds: HPA owns runtime count (no Deployment replicas patch); scales 1-2.
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: element-web
  # ---- live room provisioning (tofu-controller; bootstrapped — no vault patch) ----
  # Dev bot identity (ONE bot per env; base holds __PLACEHOLDERS__).
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: https://tuwunel.matrix.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: tuwunel.matrix.home-ops-dev.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: apprise-dev
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "@apprise-dev:tuwunel.matrix.home-ops-dev.yansyah.my.id"
    target:
      kind: Job
      name: matrix-bot-bootstrap
  # Dev room members. POSITIONAL: /spec/vars/8 (members) + /spec/vars/9 (power_levels).
  - patch: |
      - op: replace
        path: /spec/vars/8/value
        value:
          "@oncall-lead:tuwunel.matrix.home-ops-dev.yansyah.my.id": invite
      - op: replace
        path: /spec/vars/9/value
        value:
          "@oncall-lead:tuwunel.matrix.home-ops-dev.yansyah.my.id": 50
    target:
      kind: Terraform
      name: flux-notifications
  - patch: |
      - op: replace
        path: /spec/vars/8/value
        value:
          "@oncall-lead:tuwunel.matrix.home-ops-dev.yansyah.my.id": invite
      - op: replace
        path: /spec/vars/9/value
        value:
          "@oncall-lead:tuwunel.matrix.home-ops-dev.yansyah.my.id": 50
    target:
      kind: Terraform
      name: tofu-runs
  - patch: |
      - op: replace
        path: /spec/vars/8/value
        value:
          "@coder-admin:tuwunel.matrix.home-ops-dev.yansyah.my.id": invite
      - op: replace
        path: /spec/vars/9/value
        value:
          "@coder-admin:tuwunel.matrix.home-ops-dev.yansyah.my.id": 50
    target:
      kind: Terraform
      name: coder-notifications
