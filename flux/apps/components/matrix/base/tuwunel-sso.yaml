# Tuwunel SSO identity (tofu-controller): the `tuwunel` Zitadel project + project-scoped
# roles + user grants + `tuwunel` OIDC client. Project-scoped — tuwunel-admin never implies org admin.
# Reconciles after Zitadel is Ready (fleet `apps` dependsOn `infra-configs`); no Terraform
# dependsOn (Terraform-CR-only upstream).
# org_id + admin_user_id + provider auth (jwt_profile_json) flow from the FirstInstance handoff
# Secrets (`zitadel` namespace) via the ESO-synced `tuwunel-terraform-vars` Secret
# (cross-namespace `tuwunel-zitadel` store + narrow RBAC in zitadel-handoff-rbac.yaml).
# No org_id literal in git, no vault seeding. Backend: in-cluster default, no backendConfig.
# Outputs client_id + client_secret land in `tuwunel-sso-outputs` (consumed by the
# `tuwunel-sso-client` ES through `tuwunel-k8s` — never Git, never Proton Pass).
---
# Cross-namespace handoff reader: mirrors the two chart-minted handoff Secrets from the
# `zitadel` namespace into `tuwunel-terraform-vars` (remoteNamespace `zitadel`; narrow
# RBAC in zitadel-handoff-rbac.yaml). server.url omitted (kubernetes.default).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-zitadel-handoff-reader
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: matrix
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tuwunel-zitadel
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: matrix
spec:
  provider:
    kubernetes:
      remoteNamespace: zitadel
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-zitadel-handoff-reader
---
# Vars mirror: provider auth from `zitadel-bootstrap-credentials`, IDs from
# `zitadel-bootstrap-outputs` (keys land under module var names, no varsKeys renames).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-terraform-vars
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tuwunel-zitadel
    kind: SecretStore
  target:
    name: tuwunel-terraform-vars
  data:
    - secretKey: jwt_profile_json
      remoteRef:
        key: zitadel-bootstrap-credentials
        property: jwt_profile_json
    - secretKey: org_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: org_id
    - secretKey: admin_user_id
      remoteRef:
        key: zitadel-bootstrap-outputs
        property: admin_user_id
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: tuwunel-sso
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: no `tofu destroy` path via Flux.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared SSO root: infra/zitadel OCI artifact (namespace `zitadel`), path ./terraform.
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: zitadel
  path: ./terraform
  # Plain per-env values; secrets from varsFrom (overrides vars on collision).
  # Redirect URIs fully rendered here (`__SERVICE_HOST__` = per-env tuwunel hostname,
  # overlays replace). `user_emails` empty = admin-only. No `user_initial_password`
  # (first sign-in via the Zitadel invite/reset flow — never commit passwords).
  # POSITIONAL: overlays patch /spec/vars/0 + /spec/vars/2 + /spec/vars/3 +
  # /spec/vars/4 by index — keep this order.
  vars:
    - name: domain
      value: __ZITADEL_HOST__
    - name: project_name
      value: tuwunel
    - name: login_base_uri
      value: __ZITADEL_LOGIN_URI__
    - name: redirect_uris
      value:
        - https://__SERVICE_HOST__/_matrix/client/unstable/login/sso/callback/*
    - name: post_logout_redirect_uris
      value:
        - https://__SERVICE_HOST__/
    - name: create_user_role
      value: "true"
    - name: user_emails
      value: []
    - name: create_cookie_secret
      value: "false"
  varsFrom:
    - kind: Secret
      name: tuwunel-terraform-vars
  writeOutputsToSecret:
    name: tuwunel-sso-outputs
    outputs:
      - client_id
      - client_secret
