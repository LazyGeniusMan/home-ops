# VPA recommender for the apprise-go-api Deployment (HPA-paired):
# updateMode Off — recommender-only, because the HPA scales the same
# CPU/memory metrics (known-limitations.md: never VPA-apply on a resource
# HPA scales on).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: apprise-go-api
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apprise-go-api
  updatePolicy:
    updateMode: 'Off'
