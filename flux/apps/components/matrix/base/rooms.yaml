# Live room provisioning (flux-notifications + tofu-runs + coder-notifications).
# Ships in THIS tenant's base (no team namespace owns ops-wide rooms). Live counterpart
# of the terraform/examples/ skeletons (team-terraform.yaml stays example-only).
# Reconciles after tuwunel is Ready (fleet `apps` dependsOn `infra-configs`); no
# Terraform dependsOn (Terraform-CR-only upstream).
# Notification-only (events_default 50 — members CANNOT post) + plaintext
# (encryption_enabled false — E2EE unreadable to the stateless notifier, irreversible).
# Provider auth flows from the bootstrap kept Secret via same-namespace `varsFrom`
# (keys land under the module var names, no varsKeys renames, no ESO hop, no vault hop).
# Backend: in-cluster default, no backendConfig. Outputs land in `<room>-outputs`.
# Prerequisite: the bootstrap Job ran per env; without the kept Secret the CRs retry.
# POSITIONAL: overlays patch /spec/vars/8 (members) + /spec/vars/9 (power_levels) by
# index in EACH CR — keep this var order.
---
# Room auth: kept Secret via same-namespace varsFrom; no ESO hop.
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: flux-notifications
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: no `tofu destroy` path via Flux.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared rooms root: apps/matrix OCI artifact (namespace `matrix`), path ./terraform.
  sourceRef:
    kind: OCIRepository
    name: apps
    namespace: matrix
  path: ./terraform
  # Plain per-room values; secrets from varsFrom (overrides vars on collision).
  # Bot pinned at 100 by the module (self-lockout safe); on-call lead at 50.
  # Notification-only (events_default 50) + plaintext (encryption_enabled false,
  # irreversible). Nested maps ride `vars` as HCL natively.
  vars:
    - name: room_name
      value: flux-notifications
    - name: topic
      value: Flux + Apprise delivery receipts (bot posts, humans read)
    - name: preset
      value: private_chat
    - name: visibility
      value: private
    - name: history_visibility
      value: shared
    - name: room_alias_name
      value: flux-notifications
    - name: encryption_enabled
      value: false
    - name: events_default
      value: 50
    - name: members
      value:
        "@oncall-lead:__SERVER_NAME__": invite
    - name: power_levels
      value:
        "@oncall-lead:__SERVER_NAME__": 50
    - name: join_rule
      value: invite
    - name: bot_room_display_name
      value: Flux Notifier
  varsFrom:
    - kind: Secret
      name: matrix-bot-bootstrap-outputs
  writeOutputsToSecret:
    name: flux-notifications-outputs
    outputs:
      - room_id
      - canonical_alias
      - bot_user_id
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: tofu-runs
spec:
  interval: 30m
  approvePlan: auto
  destroy: false
  destroyResourcesOnDeletion: false
  sourceRef:
    kind: OCIRepository
    name: apps
    namespace: matrix
  path: ./terraform
  # Feeds from the `tofu-runs` Alert (overlaps the flux room by design).
  vars:
    - name: room_name
      value: tofu-runs
    - name: topic
      value: Terraform/tofu per-run log (bot posts, humans read)
    - name: preset
      value: private_chat
    - name: visibility
      value: private
    - name: history_visibility
      value: shared
    - name: room_alias_name
      value: tofu-runs
    - name: encryption_enabled
      value: false
    - name: events_default
      value: 50
    - name: members
      value:
        "@oncall-lead:__SERVER_NAME__": invite
    - name: power_levels
      value:
        "@oncall-lead:__SERVER_NAME__": 50
    - name: join_rule
      value: invite
    - name: bot_room_display_name
      value: Tofu Runner
  varsFrom:
    - kind: Secret
      name: matrix-bot-bootstrap-outputs
  writeOutputsToSecret:
    name: tofu-runs-outputs
    outputs:
      - room_id
      - canonical_alias
      - bot_user_id
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: coder-notifications
spec:
  interval: 30m
  approvePlan: auto
  destroy: false
  destroyResourcesOnDeletion: false
  sourceRef:
    kind: OCIRepository
    name: apps
    namespace: matrix
  path: ./terraform
  # Feeds from the Coder webhook (per-request `urls`, no Provider, no fallback leg).
  # Every event lands in this single room (per-event routing is Premium-only).
  # Var order mirrors the sibling CRs (positional /spec/vars/8 + /spec/vars/9).
  vars:
    - name: room_name
      value: coder-notifications
    - name: topic
      value: Coder workspace events (bot posts, humans read)
    - name: preset
      value: private_chat
    - name: visibility
      value: private
    - name: history_visibility
      value: shared
    - name: room_alias_name
      value: coder-notifications
    - name: encryption_enabled
      value: false
    - name: events_default
      value: 50
    - name: members
      value:
        "@coder-admin:__SERVER_NAME__": invite
    - name: power_levels
      value:
        "@coder-admin:__SERVER_NAME__": 50
    - name: join_rule
      value: invite
    - name: bot_room_display_name
      value: Coder Notifier
  varsFrom:
    - kind: Secret
      name: matrix-bot-bootstrap-outputs
  writeOutputsToSecret:
    name: coder-notifications-outputs
    outputs:
      - room_id
      - canonical_alias
      - bot_user_id
