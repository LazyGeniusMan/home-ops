# In-namespace wildcard Certificate (cert-manager Secrets are namespace-local):
# mints __WILDCARD_TLS_SECRET__ HERE via ClusterIssuer/letsencrypt DNS-01 for
# *.__BASE_DOMAIN__. Covers BOTH nested hostnames (tuwunel.matrix.* + element.matrix.*).
# cloudflare-api-token ES (tuwunel-secrets.yaml) mirrors the cluster-issuer remoteRef.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __WILDCARD_CERT_NAME__
spec:
  secretName: __WILDCARD_TLS_SECRET__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.__BASE_DOMAIN__"
