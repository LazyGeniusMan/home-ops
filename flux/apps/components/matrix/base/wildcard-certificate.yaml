# In-namespace wildcard Certificate (same pattern as hubble-ui and
# flux-operator-ui): cert-manager Secrets are namespace-local, so this
# duplicate Certificate mints __WILDCARD_TLS_SECRET__ HERE via the shared
# ClusterIssuer/letsencrypt DNS-01 solver for *.__BASE_DOMAIN__. The
# cloudflare-api-token ExternalSecret (tuwunel-secrets.yaml) mirrors
# cert-manager/configs/base/cluster-issuer.yaml (same Proton Pass remoteRef)
# so the DNS-01 solver credential exists in this namespace too.
# Covers BOTH nested service hostnames in this tenant
# (tuwunel.matrix.__BASE_DOMAIN__ + element.matrix.__BASE_DOMAIN__ — one
# cert, one TLS secret, shared by both Gateways/listeners; per the Gateway
# API spec a `*.` hostname matches dots to the left).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __WILDCARD_CERT_NAME__
spec:
  secretName: __WILDCARD_TLS_SECRET__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.__BASE_DOMAIN__"
