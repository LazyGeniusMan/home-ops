# Mautrix Discord secrets: Git holds remoteRefs only, never values.
# - mautrix-discord: seven stable tokens from ONE Proton Pass prefix
#   (__PROTON_PASS_BASE__/mautrix-discord/<field>, patched per env to
#   pass://acme-<env>-bdo1-talos-apps-01/mautrix-discord/<field>):
#   bot-token (Discord bot token — auth is `login-token bot <token>` at
#   runtime, NEVER baked into config: the bot token is a session credential,
#   entered once in the management room after registration), as-token +
#   hs-token (registration pair — seeded once, then STABLE forever; the PVC
#   persists registration.yaml so restarts never re-register), avatar-proxy-key
#   (HMAC key for the /mautrix-discord/avatar relay endpoint), direct-media
#   server-key (federation signing key, same format as a synapse .signing.key),
#   provisioning shared-secret (provisioning API auth), and the legacy
#   login_shared_secret_map value (double-puppet-shared-secret).
#   All TOCTOU-safe: the entrypoint reads them from env at every boot.
# - mautrix-discord-db-credentials: full connection URL for the colocated
#   mautrix-discord-db Cluster (key "connection-url": user discord, host
#   mautrix-discord-db-rw.matrix.svc, port 5432, db discord,
#   sslmode=require — same self-signed trade-off as coder/zitadel). Composed
#   in the ESO template from the single .../mautrix-discord/db-password vault
#   field — the same field consumed by mautrix-discord-db-app-secret below.
# - mautrix-discord-db-app-secret: CNPG initdb app-user secret (basic-auth,
#   ESO-managed): username MUST equal spec.bootstrap.initdb.owner (upstream
#   contract), password from the same db-password vault field.
# Seed each vault entry with pass-cli before first install; the Deployment
# pends until ESO syncs them and Flux retries.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-discord
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: mautrix-discord
    template:
      data:
        bot-token: "{{ .botToken }}"
        as-token: "{{ .asToken }}"
        hs-token: "{{ .hsToken }}"
        avatar-proxy-key: "{{ .avatarProxyKey }}"
        direct-media-server-key: "{{ .directMediaServerKey }}"
        provisioning-shared-secret: "{{ .provisioningSharedSecret }}"
        double-puppet-shared-secret: "{{ .doublePuppetSharedSecret }}"
  data:
    - secretKey: botToken
      remoteRef:
        key: __PROTON_PASS_BASE__/mautrix-discord/bot-token
    - secretKey: asToken
      remoteRef:
        key: __PROTON_PASS_BASE__/mautrix-discord/as-token
    - secretKey: hsToken
      remoteRef:
        key: __PROTON_PASS_BASE__/mautrix-discord/hs-token
    - secretKey: avatarProxyKey
      remoteRef:
        key: __PROTON_PASS_BASE__/mautrix-discord/avatar-proxy-key
    - secretKey: directMediaServerKey
      remoteRef:
        key: __PROTON_PASS_BASE__/mautrix-discord/direct-media-server-key
    - secretKey: provisioningSharedSecret
      remoteRef:
        key: __PROTON_PASS_BASE__/mautrix-discord/provisioning-shared-secret
    - secretKey: doublePuppetSharedSecret
      remoteRef:
        key: __PROTON_PASS_BASE__/mautrix-discord/double-puppet-shared-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-discord-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: mautrix-discord-db-credentials
    template:
      data:
        connection-url: "postgres://discord:{{ .password }}@mautrix-discord-db-rw.matrix.svc:5432/discord?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/mautrix-discord/db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-discord-db-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: mautrix-discord-db-app-secret
    template:
      type: kubernetes.io/basic-auth
      data:
        username: discord
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: __PROTON_PASS_BASE__/mautrix-discord/db-password
