# COSI credential bridge: in-namespace SecretStore reading the COSI-minted BucketInfo
# (Secret mautrix-discord-db-cosi-creds) via the shared eso-k8s-reader SA (matrix-rbac.yaml).
# server.url omitted (defaults to kubernetes.default); kube-root-ca.crt supplies the CA.
# Consumed by the cnpg-s3-credentials ES (mautrix-discord-db.yaml) via GJSON `property`.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mautrix-discord-cosi
  labels:
    app.kubernetes.io/name: mautrix-discord
    app.kubernetes.io/part-of: mautrix-discord
spec:
  provider:
    kubernetes:
      remoteNamespace: matrix
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
