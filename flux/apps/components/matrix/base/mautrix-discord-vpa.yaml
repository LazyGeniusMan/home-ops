# VPA for the SINGLETON mautrix-discord Deployment: updateMode Auto (VPA
# evicts + recreates the lone pod with the recommended request; Recreate
# strategy keeps at-most-one-writer). Initial mode lets the recommender
# learn before the first apply; NO HPA exists on this target.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mautrix-discord
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mautrix-discord
  updatePolicy:
    updateMode: 'Initial'
