# VPA for the mautrix-discord singleton (no HPA): updateMode Initial (recommender
# learns before the first apply; Recreate keeps at-most-one-writer).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mautrix-discord
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mautrix-discord
  updatePolicy:
    updateMode: 'Initial'
