# Matrix bot bootstrap (setup-Job-keeps-Secret): registers ONE bot per env via the
# Synapse-compat admin API + mints its token + writes the KEPT Secret
# `matrix-bot-bootstrap-outputs` (rooms.yaml CRs via same-namespace `varsFrom`;
# apprise ES via the in-cluster `tuwunel-k8s` store; coder via its own handoff).
# Kept keys: homeserver_url/access_token/user_id (rooms) + notifier-token/homeserver-host
# (apprise) + homeserver-url/bot-user-id aliases.
# Image python:3.13-alpine (bootstrap tooling, no $imagepolicy). RBAC: get/create/patch
# on the two pinned Secret names in THIS namespace only.
# Ordering: Job retries with backoff (backoffLimit 12, ~5min spacing) so cold-start needs
# no dependsOn. Rerun = delete Job + reconcile (M_USER_IN_USE path fails loud; token rotates).
# Overlays patch HOMESERVER_URL/HOST + BOT_USER_ID/LOCALPART (base holds __PLACEHOLDERS__).
# No secrets in git: shared secret via secretKeyRef; bot password per-run random in memory.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: matrix-bot-bootstrap
  labels:
    app.kubernetes.io/name: matrix-bot-bootstrap
    app.kubernetes.io/part-of: matrix-bot-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrix-bot-bootstrap
  labels:
    app.kubernetes.io/name: matrix-bot-bootstrap
    app.kubernetes.io/part-of: matrix-bot-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tuwunel-registration-secret", "matrix-bot-bootstrap-outputs"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrix-bot-bootstrap
  labels:
    app.kubernetes.io/name: matrix-bot-bootstrap
    app.kubernetes.io/part-of: matrix-bot-bootstrap
subjects:
  - kind: ServiceAccount
    name: matrix-bot-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matrix-bot-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-bot-bootstrap
  labels:
    app.kubernetes.io/name: matrix-bot-bootstrap
    app.kubernetes.io/part-of: matrix-bot-bootstrap
spec:
  # Keep the completed Job (rerun = delete Job + Flux reconcile).
  ttlSecondsAfterFinished: 2592000 # 30d, then GC (Secret is kept: no ownerRef)
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-bot-bootstrap
        app.kubernetes.io/part-of: matrix-bot-bootstrap
    spec:
      serviceAccountName: matrix-bot-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: HOMESERVER_URL
              value: __MATRIX_HOMESERVER_URL__
            - name: HOMESERVER_HOST
              value: __MATRIX_HOMESERVER_HOST__
            - name: BOT_LOCALPART
              value: __MATRIX_BOT_LOCALPART__
            - name: BOT_USER_ID
              value: __MATRIX_BOT_USER_ID__
            - name: INTERNAL_BASE_URL
              value: http://tuwunel.matrix.svc:8008
            - name: REGISTRATION_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: tuwunel-registration-secret
                  key: shared-secret
          command: ["python3", "-c"]
          args:
            - |
              import hashlib, hmac, json, os, random, ssl, sys, time
              import urllib.error, urllib.request

              base = os.environ["INTERNAL_BASE_URL"]
              secret = os.environ["REGISTRATION_SHARED_SECRET"]
              user = os.environ["BOT_LOCALPART"]
              mxid = os.environ["BOT_USER_ID"]
              hs_url = os.environ["HOMESERVER_URL"]
              hs_host = os.environ["HOMESERVER_HOST"]
              # Per-run bot password: random hex, memory-only (token is the only long-lived credential).
              password = "%032x" % random.getrandbits(128)

              def call(method, path, body=None, token=None):
                  req = urllib.request.Request(
                      base + path,
                      data=json.dumps(body).encode() if body is not None else None,
                      method=method,
                      headers={"Content-Type": "application/json"},
                  )
                  if token:
                      req.add_header("Authorization", "Bearer " + token)
                  try:
                      with urllib.request.urlopen(req, timeout=15) as r:
                          return r.status, json.loads(r.read().decode() or "{}")
                  except urllib.error.HTTPError as e:
                      try:
                          return e.code, json.loads(e.read().decode() or "{}")
                      except Exception:
                          return e.code, {}

              # Cold-start race: tuwunel listener may need migration time; retry inside the backoff budget.
              nonce = None
              for attempt in range(12):
                  try:
                      status, doc = call("GET", "/_synapse/admin/v1/register")
                  except Exception as e:
                      status, doc = None, {}
                      print("register endpoint not ready (%s), retrying" % e, flush=True)
                  nonce = doc.get("nonce") if status == 200 else None
                  if nonce:
                      break
                  time.sleep(300)
              if not nonce:
                  print("FATAL: no nonce after retries", flush=True)
                  sys.exit(1)

              # Synapse shared-secret register MAC: HMAC-SHA1 hex over
              # nonce\0user\0password\0notadmin keyed by the shared secret.
              mac = hmac.new(
                  secret.encode(),
                  ("%s\0%s\0%s\0%s" % (nonce, user, password, "notadmin")).encode(),
                  hashlib.sha1,
              ).hexdigest()
              status, doc = call("POST", "/_synapse/admin/v1/register", {
                  "nonce": nonce, "username": user, "password": password,
                  "mac": mac, "admin": False,
              })
              if status == 200:
                  print("registered bot %s" % mxid, flush=True)
              elif doc.get("errcode") == "M_USER_IN_USE":
                  # Bot exists + password is per-run random: operator deletes the bot
                  # server-side first, then reruns. Fail LOUD.
                  print("FATAL: bot exists but password is per-run random; "
                        "delete the bot user server-side, then rerun",
                        flush=True)
                  sys.exit(1)
              else:
                  print("FATAL: register %s %s" % (status, doc), flush=True)
                  sys.exit(1)

              # Mint the long-lived access token (tuwunel tokens do not expire).
              status, doc = call("POST", "/_matrix/client/v3/login", {
                  "type": "m.login.password",
                  "identifier": {"type": "m.id.user", "user": mxid},
                  "password": password,
              })
              token = doc.get("access_token") if status == 200 else None
              if not token:
                  print("FATAL: login %s %s" % (status, doc), flush=True)
                  sys.exit(1)

              # Write the KEPT Secret (no ownerRef — outlives the Job) via the in-pod
              # ServiceAccount. Values under BOTH module var names (rooms) AND notifier
              # names (apprise) so neither consumer needs varsKeys renames.
              import base64
              sa = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
              ns = open("/var/run/secrets/kubernetes.io/serviceaccount/namespace").read()
              api = "https://kubernetes.default.svc/api/v1/namespaces/%s/secrets" % ns
              ctx = ssl.create_default_context(
                  cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
              data = {k: base64.b64encode(v.encode()).decode() for k, v in {
                  "homeserver_url": hs_url,
                  "access_token": token,
                  "user_id": mxid,
                  "notifier-token": token,
                  "homeserver-host": hs_host,
                  "homeserver-url": hs_url,
                  "bot-user-id": mxid,
              }.items()}
              body = {"apiVersion": "v1", "kind": "Secret",
                      "metadata": {"name": "matrix-bot-bootstrap-outputs",
                                   "labels": {"app.kubernetes.io/name": "matrix-bot-bootstrap",
                                              "app.kubernetes.io/part-of": "matrix-bot-bootstrap"}},
                      "type": "Opaque", "data": data}

              def apicall(method, url, body=None):
                  req = urllib.request.Request(
                      url, data=json.dumps(body).encode() if body is not None else None,
                      method=method,
                      headers={"Content-Type": "application/json",
                               "Authorization": "Bearer " + sa},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=15, context=ctx) as r:
                          return r.status, json.loads(r.read().decode() or "{}")
                  except urllib.error.HTTPError as e:
                      try:
                          return e.code, json.loads(e.read().decode() or "{}")
                      except Exception:
                          return e.code, {}

              status, doc = apicall("GET", api + "/matrix-bot-bootstrap-outputs")
              if status == 200:
                  # Patch data wholesale (Secret carries ONLY Job-managed keys).
                  status, doc = apicall("PATCH", api + "/matrix-bot-bootstrap-outputs",
                                        {"data": data})
                  # Retry as PUT (full-object replace) on failure.
                  if status not in (200, 201):
                      _, cur = apicall("GET", api + "/matrix-bot-bootstrap-outputs")
                      body["metadata"]["resourceVersion"] = cur["metadata"]["resourceVersion"]
                      status, doc = apicall("PUT", api + "/matrix-bot-bootstrap-outputs", body)
              elif status == 404:
                  status, doc = apicall("POST", api, body)
              else:
                  print("FATAL: secret GET %s %s" % (status, doc), flush=True)
                  sys.exit(1)
              if status not in (200, 201):
                  print("FATAL: secret write %s %s" % (status, doc), flush=True)
                  sys.exit(1)
              print("kept Secret matrix-bot-bootstrap-outputs written", flush=True)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
