# Element Web stateless SPA (Deployment + config.json ConfigMap + Service),
# vendored from the upstream Kubernetes example (`/tmp/home-ops-docs/element-web-docs`):
# vectorim/element-web image, config.json via subPath mount at /app/config.json
# (entrypoint copies it to the nginx-served staging dir), Service :80.
# Stateless nginx static server — horizontal scaling safe; HPA owns runtime count
# (base replicas: 1 is the create-time seed). Image bumps via update-policies/element-web.yaml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: element-config
  labels:
    app.kubernetes.io/name: element-web
    app.kubernetes.io/part-of: element-web
data:
  # default_server_config.base_url is the public tuwunel URL (explicit-URL method,
  # no .well-known lookup; MUST match tuwunel server_name). disable_custom_urls locks
  # the picker to our homeserver. permalink_prefix is our Element hostname (overlays
  # replace). room_directory.servers points at our server. integrations null =
  # manager disabled. default_federate false (federation stays off). rageshake
  # omitted = feedback disabled.
  config.json: |
    {
        "default_server_config": {
            "m.homeserver": {
                "base_url": "https://tuwunel.matrix.home-ops.yansyah.my.id"
            }
        },
        "disable_custom_urls": true,
        "disable_guests": false,
        "disable_login_language_selector": false,
        "disable_3pid_login": false,
        "brand": "Element",
        "default_theme": "light",
        "permalink_prefix": "https://element.matrix.home-ops.yansyah.my.id",
        "branding": {},
        "embedded_pages": {},
        "room_directory": {
            "servers": [
                "matrix.home-ops.yansyah.my.id"
            ]
        },
        "integrations_ui_url": null,
        "integrations_rest_url": null,
        "integrations_widgets_urls": [],
        "jitsi": {
            "preferred_domain": "meet.element.io"
        },
        "help_url": "https://element.io/help",
        "help_encryption_url": "https://element.io/help#encryption",
        "default_federate": false,
        "show_labs_settings": false,
        "features": {},
        "setting_defaults": {
            "breadcrumbs": true
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  labels:
    app.kubernetes.io/name: element-web
    app.kubernetes.io/part-of: element-web
spec:
  replicas: 1 # create-time seed, HPA owns runtime count
  selector:
    matchLabels:
      app.kubernetes.io/name: element-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: element-web
        app.kubernetes.io/part-of: element-web
    spec:
      containers:
        - name: element
          image: vectorim/element-web:v1.12.29 # {"$imagepolicy": "apps:element-web:tag"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.json
              subPath: config.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config-volume
          configMap:
            defaultMode: 420
            name: element-config
---
apiVersion: v1
kind: Service
metadata:
  name: element-web
  labels:
    app.kubernetes.io/name: element-web
    app.kubernetes.io/part-of: element-web
spec:
  selector:
    app.kubernetes.io/name: element-web
  ports:
    - name: http
      port: 80
      targetPort: 80
