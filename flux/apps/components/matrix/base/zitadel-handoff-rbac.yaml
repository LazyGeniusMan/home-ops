# Narrow cross-namespace handoff grant: lets the tuwunel ESO reader (SA
# `eso-zitadel-handoff-reader`) mirror the two FirstInstance handoff Secrets from the
# `zitadel` namespace into `tuwunel-terraform-vars` (resourceNames pins both; nothing else).
# Owned BY the matrix component (ships here so it reconciles/prunes with the app).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tuwunel-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: matrix
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zitadel-bootstrap-credentials", "zitadel-bootstrap-outputs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tuwunel-zitadel-handoff-reader
  namespace: zitadel
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: matrix
subjects:
  - kind: ServiceAccount
    name: eso-zitadel-handoff-reader
    namespace: matrix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tuwunel-zitadel-handoff-reader
