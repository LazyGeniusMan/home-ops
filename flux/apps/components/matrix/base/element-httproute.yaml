# Element Web HTTPRoute on the shared Gateway (cross-namespace parentRef).
# __SERVICE_HOST__ (per-env element hostname) → element-web Service :80.
# PathPrefix / (SPA shell). TLS terminates at the Gateway via the
# in-namespace wildcard Certificate. Response headers: X-Frame-Options
# SAMEORIGIN, X-Content-Type-Options nosniff, CSP frame-ancestors 'self'.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __SERVICE_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Frame-Options
                value: SAMEORIGIN
              - name: X-Content-Type-Options
                value: nosniff
              - name: Content-Security-Policy
                value: frame-ancestors 'self'
      backendRefs:
        - name: element-web
          port: 80
