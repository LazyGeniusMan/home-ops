# Shared in-namespace ESO reader for the `matrix` tenant (ONE copy serves tuwunel-k8s,
# tuwunel-cosi, mautrix-discord-cosi). server.url omitted (kubernetes.default);
# kube-root-ca.crt supplies the CA.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: matrix
    app.kubernetes.io/part-of: matrix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: matrix
    app.kubernetes.io/part-of: matrix
# ESO kubernetes provider watches Secrets through this SA (list/watch feed
# the informer; get serves single-key reads).
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-reader
  labels:
    app.kubernetes.io/name: matrix
    app.kubernetes.io/part-of: matrix
subjects:
  - kind: ServiceAccount
    name: eso-k8s-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-reader
