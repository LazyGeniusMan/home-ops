# COSI credential bridge: in-namespace Kubernetes SecretStore reading the
# COSI-minted BucketInfo JSON (Secret tuwunel-media-cosi-creds, key BucketInfo)
# via the eso-k8s-reader ServiceAccount. The SA/Role/Binding live in
# matrix-rbac.yaml (shared with the `tuwunel-k8s` + `mautrix-discord-cosi`
# stores — the Role is unrestricted in-namespace, so no second copy is
# registered here). Same
# pattern as coder's cosi-keys.yaml: server.url omitted (defaults to
# kubernetes.default), kube-root-ca.crt supplies the API CA. The
# tuwunel-s3 ExternalSecret below uses GJSON `property`
# (BucketInfo.spec.bucketName + BucketInfo.spec.secretS3.accessKeyID/
# accessSecretKey) — verified against the COSI driver README shape
# (BucketInfo JSON: spec.secretS3.endpoint/region/accessKeyID/
# accessSecretKey) and the ESO v2.10.0 kubernetes provider getFromSecretData.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tuwunel-cosi
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: tuwunel
spec:
  provider:
    kubernetes:
      remoteNamespace: matrix
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tuwunel-cosi
    kind: SecretStore
  target:
    name: tuwunel-s3
    template:
      data:
        bucket: "{{ .bucketName }}"
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
  data:
    - secretKey: bucketName
      remoteRef:
        key: tuwunel-media-cosi-creds
        property: BucketInfo.spec.bucketName
    - secretKey: accessKeyId
      remoteRef:
        key: tuwunel-media-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: tuwunel-media-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
