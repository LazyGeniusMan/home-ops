# COSI credential bridge: in-namespace SecretStore reading the COSI-minted BucketInfo
# (Secret tuwunel-media-cosi-creds) via the shared eso-k8s-reader SA (matrix-rbac.yaml).
# server.url omitted (kubernetes.default); kube-root-ca.crt supplies the CA.
# The tuwunel-s3 ES below uses GJSON `property` (bucketName + secretS3 keys).
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tuwunel-cosi
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: tuwunel
spec:
  provider:
    kubernetes:
      remoteNamespace: matrix
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tuwunel-cosi
    kind: SecretStore
  target:
    name: tuwunel-s3
    template:
      data:
        bucket: "{{ .bucketName }}"
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
  data:
    - secretKey: bucketName
      remoteRef:
        key: tuwunel-media-cosi-creds
        property: BucketInfo.spec.bucketName
    - secretKey: accessKeyId
      remoteRef:
        key: tuwunel-media-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: tuwunel-media-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
