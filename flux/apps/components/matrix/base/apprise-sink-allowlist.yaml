# Sink allowlist for the shared apprise-go-api sink (reference only — NOT in
# base/kustomization.yaml resources). The sink accepts unauthenticated
# in-cluster POSTs (no HMAC path upstream: accepted risk), so access is fenced
# by NetworkPolicy here, not Gateway routing. The sink lives in the INFRA
# `apprise-go-api` tenant; these rules ship beside the consumer wiring
# (notifications.yaml + NOTIFICATIONS.md) so contract and fence travel
# together. The sink owner copies them into the sink tenant when it gains a
# configs overlay; until then containment is DNS-name discipline (only
# notification-controller + coderd hold the name). Cilium enforces standard
# NetworkPolicy semantics. Intended rules: default-deny ingress, allow
# TCP :8080 ONLY from flux-system notification-controller + coder pods.
# ---
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: apprise-go-api-default-deny
#   namespace: apprise-go-api
# spec:
#   podSelector:
#     matchLabels:
#       app.kubernetes.io/name: apprise-go-api
#   policyTypes: [Ingress]
# ---
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: apprise-go-api-allow-notifiers
#   namespace: apprise-go-api
# spec:
#   podSelector:
#     matchLabels:
#       app.kubernetes.io/name: apprise-go-api
#   policyTypes: [Ingress]
#   ingress:
#     - ports:
#         - port: 8080
#           protocol: TCP
#       from:
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: flux-system
#           podSelector:
#             matchLabels:
#               app.kubernetes.io/name: notification-controller
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: coder
#           podSelector:
#             matchLabels:
#               app.kubernetes.io/name: coder
