apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Shared tenant plumbing (ONE copy serves tuwunel-k8s, tuwunel-cosi, mautrix-discord-cosi).
  - matrix-rbac.yaml
  # ONE wildcard Certificate (tuwunel.matrix.* + element.matrix.*).
  - wildcard-certificate.yaml
  # apprise-go-api consumer wiring (workload in namespace apprise-go-api).
  - apprise-go-api-secrets.yaml
  - notifications.yaml
  # tuwunel homeserver (no HPA — singleton, RocksDB single-writer).
  - tuwunel-secrets.yaml
  - tuwunel-sso.yaml
  - zitadel-handoff-rbac.yaml
  - tuwunel-storage.yaml
  - tuwunel-cosi-keys.yaml
  - tuwunel.yaml
  - tuwunel-vpa.yaml
  - tuwunel-httproute.yaml
  # mautrix-discord bridge singleton + colocated Postgres (no HPA — singleton contract).
  - mautrix-storage.yaml
  - mautrix-cosi-keys.yaml
  - mautrix-discord-secrets.yaml
  - mautrix-discord-db.yaml
  - mautrix-discord.yaml
  - mautrix-discord-vpa.yaml
  # element-web stateless SPA (cloudflare-api-token mirror in tuwunel-secrets.yaml).
  - element-web.yaml
  - element-web-hpa.yaml
  - element-web-vpa.yaml
  - element-httproute.yaml
  - element-proxy.yaml
  # Bot bootstrap Job + kept Secret (rooms varsFrom + apprise ES read directly, same namespace).
  - matrix-bot-bootstrap.yaml
  # Live room provisioning (one Terraform CR per ops room; team room stays example-only).
  - rooms.yaml
