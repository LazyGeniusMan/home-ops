apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Shared tenant plumbing (ONE copy serves every in-namespace k8s store:
  # tuwunel-k8s, tuwunel-cosi, mautrix-discord-cosi).
  - matrix-rbac.yaml
  # ONE wildcard Certificate covering both nested service hostnames
  # (tuwunel.matrix.* + element.matrix.* — the tuwunel and element-web
  # copies were spec-identical, so they merge here into one).
  - wildcard-certificate.yaml
  # apprise-go-api: consumer-owned wiring only — the workload now lives in
  # the infra apprise-go-api tenant (namespace apprise-go-api); this tenant
  # keeps the STATELESS_URLS fallback secret + Flux Provider/Alert wiring,
  # posting to the infra Service DNS below.
  - apprise-go-api-secrets.yaml
  - notifications.yaml
  # tuwunel: Matrix homeserver (Deployment+PVC+Service, secrets, COSI storage
  # claim, COSI keys, VPA, HTTPRoutes). No HPA (singleton; RocksDB
  # single-writer).
  - tuwunel-secrets.yaml
  - tuwunel-storage.yaml
  - tuwunel-cosi-keys.yaml
  - tuwunel.yaml
  - tuwunel-vpa.yaml
  - tuwunel-httproute.yaml
  # mautrix-discord: Discord bridge singleton + colocated Postgres (secrets,
  # storage claim, COSI keys, CNPG Cluster, workload, VPA). No HPA (fixed
  # appservice listener + in-memory portal buffer — singleton contract).
  - mautrix-storage.yaml
  - mautrix-cosi-keys.yaml
  - mautrix-discord-secrets.yaml
  - mautrix-discord-db.yaml
  - mautrix-discord.yaml
  - mautrix-discord-vpa.yaml
  # element-web: stateless SPA (DNS-01 solver secret, workload + config +
  # Service, HTTPRoute, HPA, VPA, NetBird consumer). Only ONE
  # cloudflare-api-token mirror ships here — the tuwunel and element-web
  # copies were identical, so the tuwunel copy (inside tuwunel-secrets.yaml)
  # is the survivor and element-secrets.yaml is NOT carried over.
  - element-web.yaml
  - element-web-hpa.yaml
  - element-web-vpa.yaml
  - element-httproute.yaml
  - element-proxy.yaml
  # Bot bootstrap (zitadel-style): the matrix-bot-bootstrap Job registers the
  # notifier bot server-side + mints its token + writes the KEPT Secret
  # `matrix-bot-bootstrap-outputs` (rooms.yaml varsFrom + the
  # apprise-stateless-urls ES read it directly — same namespace, NO ESO
  # mirror hop). Registration secret wiring lives in tuwunel.yaml +
  # tuwunel-secrets.yaml.
  - matrix-bot-bootstrap.yaml
  # Live room provisioning (tofu-controller): one Terraform CR per ops
  # notification room (flux-notifications, tofu-runs, coder-notifications)
  # reading provider auth from the bootstrap kept Secret. Live counterpart
  # of the terraform/examples/ skeletons; team room stays example-only.
  - rooms.yaml
