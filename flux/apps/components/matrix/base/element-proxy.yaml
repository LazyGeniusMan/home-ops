# Element Web NetBird reverse-proxy consumer: private tailnet path alongside
# the public Gateway (upsert-only sidecar; never touches Deployment/Service/HTTPRoute).
# One custom-domain registration + wildcard CNAME + reverse-proxy service, per
# flux/infra/components/netbird/examples/consumer-terraform.yaml. Reconciles after
# NetBird/Cloudflare credentials (fleet `apps` dependsOn `infra-configs`); no Terraform
# dependsOn (Terraform-CR-only upstream). Tokens flow from Proton Pass via the ESO-synced
# `element-proxy-vars` Secret (same-namespace varsFrom). Backend: in-cluster default,
# no backendConfig. Outputs land in `element-proxy-outputs`.
# POSITIONAL: overlays patch /spec/vars/0 (domain), /spec/vars/2 (network_name),
# /spec/vars/3 (service_lb_ip) by index — keep this order.
# cloudflare_zone_id absent = DNS self-managed (root skips the verification CNAME).
# First apply leaves the domain Pending Verification — dashboard Verify within 48h.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: element-proxy-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: element-proxy-vars
  data:
    - secretKey: netbird_token
      remoteRef:
        key: __PROTON_PASS_BASE__/element-web/netbird-pat
    - secretKey: cloudflare_api_token
      remoteRef:
        key: __PROTON_PASS_BASE__/element-web/cloudflare-api-token
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: element-proxy
spec:
  interval: 30m
  approvePlan: auto
  # Upsert-only: no `tofu destroy` path via Flux.
  destroy: false
  destroyResourcesOnDeletion: false
  # Shared reverse-proxy root: infra/netbird OCI artifact (namespace `netbird`), path ./terraform.
  sourceRef:
    kind: OCIRepository
    name: infra
    namespace: netbird
  path: ./terraform
  # Plain per-env values; secrets from varsFrom (overrides vars on collision).
  # `__SERVICE_HOST__` is the per-env element hostname (overlays replace).
  # Backend is plain HTTP :80 (TLS terminates at the Gateway).
  vars:
    - name: domain
      value: __SERVICE_HOST__
    - name: service_name
      value: element-web
    # cloudflare_zone_id ABSENT = DNS self-managed (root skips the verification
    # CNAME). Overlays patch network_name + service_lb_ip (/spec/vars/2, /spec/vars/3).
    - name: network_name
      value: __CLUSTER_NAME__
    - name: service_lb_ip
      value: __SERVICE_LB_IP__
    - name: target_port
      value: 80
    - name: target_protocol
      value: http
  varsFrom:
    - kind: Secret
      name: element-proxy-vars
  writeOutputsToSecret:
    name: element-proxy-outputs
    outputs:
      - service_id
      - service_domain
      - proxy_url
      - service_lb_resource_id
