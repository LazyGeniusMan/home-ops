# Flux notification wiring: every Flux-native event source emits via the infra
# apprise-go-api sink into per-purpose Matrix rooms. Full contract: base/NOTIFICATIONS.md.
# Provider type generic (NOT generic-hmac — apprise-go-api has no HMAC path).
# Providers post to http://apprise-go-api.apprise-go-api.svc:80/notify (infra tenant);
# credentials ride the APPRISE_STATELESS_URLS fallback, not this address.
# `?:message=body&:reason=title` remap, `format=text`, pinned `type=`, `tag=` selects
# the fallback leg (flux|tofu|team; every tag MUST match a STATELESS_URLS entry or the
# request 204s; coder is NOT a fallback tag — it posts per-request `urls`).
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: apprise-flux
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  type: generic
  address: "http://apprise-go-api.apprise-go-api.svc:80/notify/?:message=body&:reason=title&format=text&type=info&tag=flux"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: apprise-flux-errors
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  type: generic
  address: "http://apprise-go-api.apprise-go-api.svc:80/notify/?:message=body&:reason=title&format=text&type=failure&tag=flux"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: apprise-tofu
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  type: generic
  address: "http://apprise-go-api.apprise-go-api.svc:80/notify/?:message=body&:reason=title&format=text&type=info&tag=tofu"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: apprise-team
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  type: generic
  address: "http://apprise-go-api.apprise-go-api.svc:80/notify/?:message=body&:reason=title&format=text&type=info&tag=team"
---
# Coder entrypoint (NOT Flux-driven — no Provider; Alerts cannot watch Coder).
# Coder posts directly to the infra sink via CODER_NOTIFICATIONS_WEBHOOK_ENDPOINT
# (`?type=info&format=text` only); the matrix credential rides per-request `urls` in
# the POST body (coder-owned handoff from the kept Secret; bare mapping — Coder's
# fixed payload already carries `title` + `body`). No `tag=coder`, no matrix fallback leg.
---
# Alerts: which Flux events feed which Provider (room).
# - flux-info: all-source info stream (info includes errors) minus no-change noise.
# - flux-errors: error-only leg into the SAME room with type=failure (failures arrive twice).
# - tofu-runs: info leg filtered to Terraform messages via inclusionList (`Terraform` is not
#   a valid eventSources kind — watches Kustomization + HelmRelease). Overlaps flux-info by design.
# - team-optin: SUSPENDED template for per-team rooms (copy, set namespace, unsuspend).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-info
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  providerRef:
    name: apprise-flux
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: OCIRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
  exclusionList:
    - "^Reconciliation finished.*no changes$"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-errors
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  providerRef:
    name: apprise-flux-errors
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: OCIRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: tofu-runs
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  providerRef:
    name: apprise-tofu
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
  inclusionList:
    - "(?i)terraform|tofu"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: team-optin
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  suspend: true
  providerRef:
    name: apprise-team
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: '*'
      namespace: team-placeholder
  exclusionList:
    - "^Reconciliation finished.*no changes$"
