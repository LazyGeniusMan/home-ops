# Flux notification wiring (Goal 3): every Flux-native event source emits via
# apprise-go-api into per-purpose Matrix rooms. Full contract (room -> source
# -> tag matrix, payload mapping, E2EE decision, test plan, deferred items):
# base/NOTIFICATIONS.md. Tenant/workflow onboarding (tenants/apps.yaml +
# flux-apps-push.yaml matrix) is a SEPARATE task — this base only.
#
# Provider type is generic (NOT generic-hmac): apprise-go-api has no HMAC
# verification path (SECRET_KEY is internal-callback auth only), so an
# X-Signature header would be silently ignored. Revisit only if apprise
# gains signature verification.
#
# Addressing: Providers post to the infra apprise-go-api tenant
# (http://apprise-go-api.apprise-go-api.svc:80/notify — workload lives in
# the infra namespace, NOT this tenant). The generic Provider address
# carries the WHOLE apprise contract as query params (remap + fallback +
# type + tag). Matrix credentials ride the APPRISE_STATELESS_URLS fallback
# (ESO apprise-stateless-urls Secret — consumer-owned, still lives here),
# NOT this address — secretRef holds headers only, and a token-embedded
# apprise URL cannot ride a header. Per-request `urls` stays reserved for
# future callers that inject creds another way.
# - `?:message=body&:reason=title`: Flux JSON Event -> apprise fields
#   (remap engine: exact targets format|type|title|body|attachment|tag|tags|
#   urls; failure -> HTTP 400 "Payload field mapping failed").
# - `format=text`: Flux messages are plain text (see Flux docs example);
#   markdown/html would carry a second fallback body for no benefit.
# - `type=`: pinned per Provider — Flux `severity` (info|error) is NOT a
#   valid apprise `type` (info|success|warning|failure only), so severity is
#   NEVER remapped; the Alert eventSeverity selects the pipeline instead.
# - `tag=`: selects the fallback-URL leg (flux|tofu|team server tags).
#   Mismatch -> the whole request 204s (selection lost), so every Provider
#   tag below MUST equal a tag baked into a STATELESS_URLS entry.
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: apprise-flux
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  type: generic
  address: "http://apprise-go-api.apprise-go-api.svc:80/notify/?:message=body&:reason=title&format=text&type=info&tag=flux"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: apprise-flux-errors
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  type: generic
  address: "http://apprise-go-api.apprise-go-api.svc:80/notify/?:message=body&:reason=title&format=text&type=failure&tag=flux"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: apprise-tofu
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  type: generic
  address: "http://apprise-go-api.apprise-go-api.svc:80/notify/?:message=body&:reason=title&format=text&type=info&tag=tofu"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: apprise-team
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  type: generic
  address: "http://apprise-go-api.apprise-go-api.svc:80/notify/?:message=body&:reason=title&format=text&type=info&tag=team"
---
# Alerts: which Flux events feed which Provider (room).
# - flux-info: all-source info stream (creates/updates/health-pass/delays +
#   errors — info severity includes errors) minus no-change noise via
#   exclusionList. Exclusion regex is Golang RE2 against the event message.
# - flux-errors: error-only leg into the SAME #flux-notifications room with
#   apprise type=failure (distinct rendering) — ops sees failures twice
#   (info stream + failure highlight) by design.
# - tofu-runs: info leg filtered to Terraform messages via inclusionList.
#   `Terraform` is NOT a valid Alert eventSources kind, so this watches
#   Kustomization + HelmRelease and filters on message text. Intentional
#   overlap with flux-info (tofu events post to BOTH rooms) — the tofu room
#   is the quiet per-run log, the flux room is the ops overview.
# - team-optin: SUSPENDED template for per-team rooms. Copy, set
#   eventSources[].namespace to the team tenant namespace, point at a new
#   apprise-team-tagged Provider if the team gets its own room (or reuse
#   apprise-team once the team room URL carries ?tag=team), then unsuspend.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-info
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  providerRef:
    name: apprise-flux
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: OCIRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
  exclusionList:
    - "^Reconciliation finished.*no changes$"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-errors
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  providerRef:
    name: apprise-flux-errors
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: OCIRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: tofu-runs
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  providerRef:
    name: apprise-tofu
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
  inclusionList:
    - "(?i)terraform|tofu"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: team-optin
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  suspend: true
  providerRef:
    name: apprise-team
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: '*'
      namespace: team-placeholder
  exclusionList:
    - "^Reconciliation finished.*no changes$"
