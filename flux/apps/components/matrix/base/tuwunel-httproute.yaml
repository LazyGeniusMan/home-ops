# Tuwunel HTTPRoutes: attach to the shared gateway-api Gateway (listeners
# accept routes from all namespaces — cross-namespace parentRef, no
# targetNamespace override needed; same shape as the hubble-ui/coder routes).
# - tuwunel-redirect: HTTP→HTTPS 301 on the `http` listener — port 80 exists
#   only as a redirect source (same shape as the gateway-api
#   redirect-services route, owned explicitly per component).
# - tuwunel-tls: `https` listener route for __TUWUNEL_MATRIX_HOST__ →
#   Service tuwunel:8008. Matrix client-server + federation + admin APIs all
#   share one listener port (tuwunel serves everything on 8008); the required
#   path set is one rule per prefix:
#   /_matrix/ (client + federation + SSO callback
#   /_matrix/client/unstable/login/sso/callback/<client_id>) + /_tuwunel/
#   (server admin console) + /_synapse/admin/ (Synapse-admin compat) +
#   /.well-known/matrix/* (client auto-discovery — served by tuwunel itself
#   via TUWUNEL_WELL_KNOWN__CLIENT; see README).
#   X-Forwarded-For preservation: Cilium Gateway appends the downstream peer
#   itself (Envoy xfcc/xff semantics) and tuwunel resolves the real client
#   from the rightmost X-Forwarded-For entry (TUWUNEL_IP_SOURCE); no
#   RequestHeaderModifier filter here — stripping or rewriting XFF at the
#   route would destroy the chain tuwunel trusts.
# Hostname shape: the nested tuwunel.matrix.__BASE_DOMAIN__ leaf is covered
# by the in-namespace *.__BASE_DOMAIN__ wildcard Certificate
# (wildcard-certificate.yaml; per the Gateway API spec a `*.` hostname
# matches dots to the left).
# TLS terminates at the Gateway via that in-namespace wildcard Secret.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tuwunel-redirect
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - __TUWUNEL_MATRIX_HOST__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tuwunel-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __TUWUNEL_MATRIX_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix/
      backendRefs:
        - name: tuwunel
          port: 8008
    - matches:
        - path:
            type: PathPrefix
            value: /_tuwunel/
      backendRefs:
        - name: tuwunel
          port: 8008
    - matches:
        - path:
            type: PathPrefix
            value: /_synapse/admin/
      backendRefs:
        - name: tuwunel
          port: 8008
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix/
      backendRefs:
        - name: tuwunel
          port: 8008
