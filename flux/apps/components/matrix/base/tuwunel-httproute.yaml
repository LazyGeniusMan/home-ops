# Tuwunel HTTPRoutes on the shared Gateway (cross-namespace parentRef).
# - tuwunel-redirect: HTTP→HTTPS 301 on the `http` listener.
# - tuwunel-tls: `https` route for __TUWUNEL_MATRIX_HOST__ → tuwunel:8008, one rule per
#   prefix: /_matrix/ (client + federation + SSO callback) + /_tuwunel/ (admin console) +
#   /_synapse/admin/ (Synapse compat) + /.well-known/matrix/* (served by tuwunel itself).
#   No XFF filter — tuwunel resolves the client from the rightmost X-Forwarded-For entry.
# Nested hostname covered by the in-namespace wildcard Certificate. TLS terminates at the Gateway.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tuwunel-redirect
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: http
  hostnames:
    - __TUWUNEL_MATRIX_HOST__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tuwunel-tls
spec:
  parentRefs:
    - name: main
      namespace: gateway-api
      sectionName: https
  hostnames:
    - __TUWUNEL_MATRIX_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix/
      backendRefs:
        - name: tuwunel
          port: 8008
    - matches:
        - path:
            type: PathPrefix
            value: /_tuwunel/
      backendRefs:
        - name: tuwunel
          port: 8008
    - matches:
        - path:
            type: PathPrefix
            value: /_synapse/admin/
      backendRefs:
        - name: tuwunel
          port: 8008
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix/
      backendRefs:
        - name: tuwunel
          port: 8008
