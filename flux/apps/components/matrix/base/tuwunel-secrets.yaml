# Tuwunel secrets. Git holds refs only, never values.
# - tuwunel-k8s (SecretStore): reads Secrets in THIS namespace via the
#   SHARED `eso-k8s-reader` ServiceAccount/Role/Binding (see matrix-rbac.yaml —
#   one copy serves every in-namespace k8s store in this tenant: tuwunel-k8s,
#   tuwunel-cosi, mautrix-discord-cosi). Same-cluster read, so `server.url`
#   is omitted (defaults to kubernetes.default) and the in-namespace
#   `kube-root-ca.crt` ConfigMap supplies the API CA. Same
#   shape as the hubble-ui/coder in-namespace stores.
# - tuwunel-sso-client: the Zitadel `tuwunel` OIDC client credentials
#   (client_id + client_secret, both generated server-side). Consumed from
#   the `tuwunel-sso-outputs` Secret written by the companion Terraform CR
#   (see README — the CR itself ships in the follow-up tofu task, not here)
#   through the in-cluster `tuwunel-k8s` SecretStore. NO pass:// seeding
#   for OIDC creds. The Deployment consumes client_id via an explicit
#   secretKeyRef env and client_secret via a read-only file mount
#   (TUWUNEL_IDENTITY_PROVIDER__0__CLIENT_SECRET_FILE) — envFrom is NOT
#   used because the secret keys contain dashes (invalid env names;
#   kubelet would skip them).
# - cloudflare-api-token: mirrors cert-manager/configs/base/cluster-issuer.yaml
#   (same Proton Pass remoteRef) so the DNS-01 solver credential exists in
#   this namespace too.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tuwunel-k8s
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: tuwunel
spec:
  provider:
    kubernetes:
      remoteNamespace: matrix
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-sso-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tuwunel-k8s
    kind: SecretStore
  target:
    name: tuwunel-sso-client
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: tuwunel-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: tuwunel-sso-outputs
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
