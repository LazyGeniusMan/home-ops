# Tuwunel secrets (Git holds refs only).
# - tuwunel-k8s (SecretStore): reads Secrets in THIS namespace via the shared
#   `eso-k8s-reader` SA (matrix-rbac.yaml). server.url omitted (kubernetes.default);
#   kube-root-ca.crt supplies the CA.
# - tuwunel-sso-client: Zitadel `tuwunel` OIDC client creds from the `tuwunel-sso-outputs`
#   Secret (written by the companion tuwunel-sso CR) through `tuwunel-k8s`. No pass://
#   seeding. Deployment consumes client_id via secretKeyRef + client_secret via file mount
#   (never envFrom — keys contain dashes).
# - cloudflare-api-token: mirrors the cluster-issuer remoteRef so the DNS-01 credential
#   exists in this namespace too.
# - tuwunel-registration-secret: Synapse-compat admin-register shared secret, seeded per env
#   (`matrix/tuwunel-registration-secret`, ≥32 random bytes) via `proton-pass`. Consumed
#   TWICE: (1) tuwunel Deployment mount (TUWUNEL_REGISTRATION_SHARED_SECRET_FILE),
#   (2) bootstrap Job env. One source, no dual-write.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tuwunel-k8s
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: tuwunel
spec:
  provider:
    kubernetes:
      remoteNamespace: matrix
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-k8s-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-sso-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tuwunel-k8s
    kind: SecretStore
  target:
    name: tuwunel-sso-client
    template:
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: tuwunel-sso-outputs
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: tuwunel-sso-outputs
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    template:
      data:
        api-token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: __PROTON_PASS_BASE__/cert-manager/cloudflare-api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-registration-secret
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: tuwunel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: tuwunel-registration-secret
    template:
      data:
        shared-secret: "{{ .sharedSecret }}"
  data:
    - secretKey: sharedSecret
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix/tuwunel-registration-secret
