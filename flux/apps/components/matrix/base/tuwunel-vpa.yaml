# VPA for the tuwunel singleton (no HPA): updateMode Auto (evict-and-recreate; safe —
# Deployment is already Recreate). minReplicas 1 (updater default 2 never evicts singletons).
# minAllowed guards the RocksDB page-cache floor (recommendations below it starve reads).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tuwunel
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tuwunel
  updatePolicy:
    updateMode: Auto
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: tuwunel
        minAllowed:
          cpu: 100m
          memory: 512Mi
