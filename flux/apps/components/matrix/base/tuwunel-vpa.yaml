# VPA for the tuwunel singleton (no HPA): updateMode Initial — recommendations
# apply at pod (re)start only, never mid-run eviction (600s grace, RWO
# single-writer). Same singleton convention as mautrix-discord-vpa.yaml.
# minReplicas 1 (updater default 2 never evicts singletons).
# minAllowed guards the RocksDB page-cache floor (recommendations below it starve reads).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tuwunel
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tuwunel
  updatePolicy:
    updateMode: 'Initial'
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: tuwunel
        minAllowed:
          cpu: 100m
          memory: 512Mi
