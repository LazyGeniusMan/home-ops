# COSI-managed bucket for tuwunel media (colocated with the consuming
# component — lands in the `matrix` tenant namespace via the Fleet `apps`
# Kustomization's `targetNamespace`).
# - Claim uses BucketClass/seaweedfs, protocol S3. The central controller
#   creates the cluster-scoped Bucket; the driver (DriverCreateBucket =
#   req.GetName()) provisions the live bucket in SeaweedFS under a
#   controller-generated name (`bc-<uuid>`) — claim/access names do NOT map
#   to pre-existing bucket names, so `spec.existingBucketName` is
#   intentionally unset. Read the live name from the claim's
#   `status.bucketName` once `status.bucketReady` is true. The Deployment
#   consumes it via the `tuwunel-s3` ExternalSecret (tuwunel-cosi-keys.yaml), which
#   extracts the LIVE BucketInfo.spec.bucketName — no per-env bucket literal
#   in git.
# - The BucketAccess (BucketAccessClass/seaweedfs-key, authenticationType
#   KEY) mints S3 keys into its `credentialsSecretName` Secret in THIS
#   namespace as a `BucketInfo` JSON file (spec.secretS3.endpoint/region/
#   accessKeyID/accessSecretKey). The driver hands back the INTERNAL
#   endpoint (http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333);
#   SeaweedFS S3 is path-style, so USE_VHOST_REQUEST=false (see tuwunel.yaml).
# - Base path BASE_PATH=tuwunel-media (see
#   TUWUNEL_STORAGE_PROVIDER__MEDIA_ON_S3__S3__BASE_PATH in tuwunel.yaml).
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: tuwunel-media
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: tuwunel-media-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: tuwunel-media
  credentialsSecretName: tuwunel-media-cosi-creds
  protocol: S3
