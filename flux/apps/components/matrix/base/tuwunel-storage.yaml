# COSI bucket for tuwunel media (lands in `matrix` via targetNamespace).
# Claim: BucketClass/seaweedfs, S3 (live name from status.bucketName; existingBucketName
# unset — no per-env bucket literal in git). Deployment consumes it via the `tuwunel-s3`
# ES (tuwunel-cosi-keys.yaml). SeaweedFS S3 is path-style (USE_VHOST_REQUEST=false).
# Base path tuwunel-media (TUWUNEL_STORAGE_PROVIDER__MEDIA_ON_S3__S3__BASE_PATH).
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: tuwunel-media
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: tuwunel-media-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: tuwunel-media
  credentialsSecretName: tuwunel-media-cosi-creds
  protocol: S3
