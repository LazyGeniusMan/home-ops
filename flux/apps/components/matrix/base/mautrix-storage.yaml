# COSI bucket for mautrix-discord-db backups (lands in `matrix` via targetNamespace).
# Claim: BucketClass/seaweedfs, S3 (live name from status.bucketName; existingBucketName unset).
# Backs CNPG WAL + base backups (s3://cnpg-backups/mautrix-discord/ — prefix must exist,
# CNPG never creates buckets). BucketAccess mints keys as BucketInfo JSON; the
# `cnpg-s3-credentials` ES bridges them via the in-namespace `mautrix-discord-cosi` store.
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: mautrix-discord-db
spec:
  bucketClassName: seaweedfs
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: mautrix-discord-db-access
spec:
  bucketAccessClassName: seaweedfs-key
  bucketClaimName: mautrix-discord-db
  credentialsSecretName: mautrix-discord-db-cosi-creds
  protocol: S3
