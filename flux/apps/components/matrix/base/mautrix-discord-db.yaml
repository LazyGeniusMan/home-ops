# Mautrix Discord PostgreSQL Cluster: namespace-local instantiation of the
# §10.1 cluster-base template (flux/infra/components/cnpg/configs/base/cluster-base.yaml —
# reference/instantiate pattern, same shape as coder-db, adjusted: dbname
# discord, single-purpose S3 prefix). Live cluster, not a template:
# spec.bootstrap.initdb creates database+owner discord, with the app password
# from mautrix-discord-db-app-secret (ESO, see mautrix-discord-secrets.yaml —
# the secret's username MUST equal spec.bootstrap.initdb.owner per upstream).
# - HA: 3 instances, sync quorum 1, pod anti-affinity (copied from the base).
# - Postgres >= 16 per the bridge setup requirements (own database `discord`;
#   the shared INSTANCE is the colocated Cluster — no database is ever shared
#   between programs).
# - Storage: local-ssd-nvme (the default StorageClass — see
#   flux/infra/components/local-path-provisioner/).
# - Backup: continuous WAL + daily base backup to the SeaweedFS S3 endpoint
#   (DNS name only, no file dependency; see the seaweedfs component S3
#   contract in flux/infra/components/seaweedfs/README.md) under
#   s3://cnpg-backups/mautrix-discord/. The bucket prefix must exist before
#   the first Cluster starts (CNPG never creates buckets). Credentials:
#   cnpg-s3-credentials ExternalSecret synced by ESO from the COSI-minted
#   BucketInfo JSON (Secret mautrix-discord-db-cosi-creds in THIS namespace,
#   from the colocated `mautrix-discord-db` BucketClaim in
#   mautrix-storage.yaml) through the in-namespace `mautrix-discord-cosi`
#   SecretStore (mautrix-cosi-keys.yaml) — GJSON `property` extracts
#   spec.secretS3.accessKeyID/accessSecretKey. Target literal keys
#   (ACCESS_KEY_ID/ACCESS_SECRET_KEY) are unchanged, so the Cluster reference
#   is untouched.
#   Fallback: the Proton Pass entries (pass://.../cnpg/s3-*) are retained in
#   the vault; to roll back, repoint secretStoreRef to proton-pass/
#   ClusterSecretStore with remoteRef keys
#   __PROTON_PASS_BASE__/cnpg/s3-access-key-id and
#   __PROTON_PASS_BASE__/cnpg/s3-secret-access-key (no `property`).
# - PITR/restore: same runbook as the base cluster-base template — apply a
#   NEW Cluster with bootstrap.recovery (example stanza commented out below)
#   instead of initdb.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mautrix-discord-cosi
    kind: SecretStore
  target:
    name: cnpg-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        ACCESS_SECRET_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: mautrix-discord-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: mautrix-discord-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mautrix-discord-db
spec:
  instances: 3 # placeholder - overridden by dev/prd

  postgresql:
    synchronous:
      standbyNames: ["*"]
      number: 1

  bootstrap:
    initdb:
      database: discord
      owner: discord
      secret:
        name: mautrix-discord-db-app-secret
  # Point-in-time recovery: create a NEW Cluster bootstrapping from an
  # existing backup instead of initdb (uncomment, set the Backup/ScheduledBackup
  # object name and the target timestamp). WAL replay reaches any instant
  # covered by the retained WAL archive.
  # bootstrap:
  #   recovery:
  #     backup:
  #       name: mautrix-discord-db-backup
  #     recoveryTarget:
  #       targetTime: "2026-09-08 00:00:00.00000+00"

  storage:
    storageClass: local-ssd-nvme
    size: 20Gi

  affinity:
    enablePodAntiAffinity: true

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/mautrix-discord/
      endpointURL: __S3_ENDPOINT_URL__
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
---
# Daily base backup to the same Barman object store (streaming method).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mautrix-discord-db-backup
spec:
  schedule: "0 0 0 * * *" # midnight daily (CNPG uses 6-field cron)
  backupOwnerReference: self
  cluster:
    name: mautrix-discord-db
