# Mautrix Discord Postgres Cluster: namespace-local instance of the §10.1 cluster-base
# template (dbname discord, single-purpose S3 prefix). initdb creates database+owner
# discord; app password from mautrix-discord-db-app-secret (username MUST equal
# spec.bootstrap.initdb.owner). HA 3 instances, sync quorum 1, anti-affinity.
# Storage local-ssd-nvme. Backup: continuous WAL + daily base to
# s3://cnpg-backups/mautrix-discord/ (prefix must exist — CNPG never creates buckets).
# Credentials: cnpg-s3-credentials ES from the COSI-minted BucketInfo via the in-namespace
# `mautrix-discord-cosi` store. PITR: apply a NEW Cluster with bootstrap.recovery
# (commented stanza below) instead of initdb.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mautrix-discord-cosi
    kind: SecretStore
  target:
    name: cnpg-s3-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .accessKeyId }}"
        ACCESS_SECRET_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: mautrix-discord-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessKeyID
    - secretKey: secretAccessKey
      remoteRef:
        key: mautrix-discord-db-cosi-creds
        property: BucketInfo.spec.secretS3.accessSecretKey
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mautrix-discord-db
spec:
  instances: 3 # placeholder - overridden by dev/prd

  postgresql:
    synchronous:
      standbyNames: ["*"]
      number: 1

  bootstrap:
    initdb:
      database: discord
      owner: discord
      secret:
        name: mautrix-discord-db-app-secret
  # Point-in-time recovery: NEW Cluster with bootstrap.recovery instead of initdb
  # (uncomment, set the Backup name + targetTime).
  # bootstrap:
  #   recovery:
  #     backup:
  #       name: mautrix-discord-db-backup
  #     recoveryTarget:
  #       targetTime: "2026-09-08 00:00:00.00000+00"

  storage:
    storageClass: local-ssd-nvme
    size: 20Gi

  affinity:
    enablePodAntiAffinity: true

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/mautrix-discord/
      endpointURL: __S3_ENDPOINT_URL__
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
---
# Daily base backup to the same Barman object store.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mautrix-discord-db-backup
spec:
  schedule: "0 0 0 * * *" # midnight daily (CNPG uses 6-field cron)
  backupOwnerReference: self
  cluster:
    name: mautrix-discord-db
