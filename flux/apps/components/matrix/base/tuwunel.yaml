# Tuwunel Matrix homeserver (federation-off; upstream ref: `/tmp/home-ops-docs/tuwunel-docs`).
# Singleton Deployment (replicas 1, Recreate — RocksDB single-writer) on one RWO PVC
# (local-ssd-nvme) at /var/lib/tuwunel. Probes exec ["tuwunel", "--health-check"];
# terminationGracePeriodSeconds 600 (migration budget). Service :8008.
# Config is env-only (TUWUNEL_* maps 1:1 to tuwunel-example.toml keys); base holds
# __PLACEHOLDERS__, overlays patch real hosts.
# POSITIONAL: overlays patch env/{0,5,25,26} by index — keep this order.
# Secrets via secretKeyRef + read-only file mounts (never literals, never envFrom —
# ESO keys contain dashes). server_name IMMUTABLE. No HPA (singleton; VPA owns sizing).
# Image tracked by update-policies/tuwunel.yaml ($imagepolicy apps:tuwunel:tag).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuwunel-data
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: tuwunel
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-ssd-nvme
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuwunel
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: tuwunel
spec:
  replicas: 1 # singleton: RocksDB single-writer, Recreate
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tuwunel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuwunel
        app.kubernetes.io/part-of: tuwunel
    spec:
      terminationGracePeriodSeconds: 600
      containers:
        - name: tuwunel
          image: ghcr.io/matrix-construct/tuwunel:v1.9.2 # {"$imagepolicy": "apps:tuwunel:tag"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8008
          env:
            - name: TUWUNEL_SERVER_NAME
              value: __TUWUNEL_MATRIX_HOST__
            - name: TUWUNEL_DATABASE_PATH
              value: /var/lib/tuwunel
            - name: TUWUNEL_ADDRESS
              value: '["0.0.0.0"]'
            - name: TUWUNEL_PORT
              value: "8008"
            - name: TUWUNEL_IP_SOURCE
              value: rightmost_x_forwarded_for
            - name: TUWUNEL_WELL_KNOWN__CLIENT
              value: https://__TUWUNEL_MATRIX_HOST__
            - name: TUWUNEL_ALLOW_REGISTRATION
              value: "false"
            - name: TUWUNEL_ALLOW_GUEST_REGISTRATION
              value: "false"
            - name: TUWUNEL_LOGIN_WITH_PASSWORD
              value: "false"
            - name: TUWUNEL_LOGIN_VIA_TOKEN
              value: "true"
            - name: TUWUNEL_ALLOW_FEDERATION
              value: "false"
            - name: TUWUNEL_FEDERATE_CREATED_ROOMS
              value: "false"
            - name: TUWUNEL_FEDERATE_ADMIN_ROOM
              value: "false"
            - name: TUWUNEL_ALLOW_PUBLIC_ROOM_DIRECTORY_OVER_FEDERATION
              value: "false"
            - name: TUWUNEL_ALLOW_DEVICE_NAME_FEDERATION
              value: "false"
            - name: TUWUNEL_MEDIA_STORAGE_PROVIDERS
              value: '["media", "media_on_s3"]'
            - name: TUWUNEL_STORE_MEDIA_ON_PROVIDERS
              value: '["media_on_s3"]'
            - name: TUWUNEL_MEDIA_STARTUP_CHECK
              value: "true"
            # Admin-register shared secret (server side of the bootstrap Job flow):
            # file mount from the vault-seeded `tuwunel-registration-secret` Secret.
            - name: TUWUNEL_REGISTRATION_SHARED_SECRET_FILE
              value: /etc/tuwunel-registration/shared-secret
            - name: TUWUNEL_GRANT_ADMIN_TO_FIRST_USER
              value: "true"
            - name: TUWUNEL_CREATE_ADMIN_ROOM
              value: "true"
            - name: TUWUNEL_SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tuwunel-sso-client
                  key: client-id
            - name: TUWUNEL_IDENTITY_PROVIDER__0__BRAND
              value: zitadel
            - name: TUWUNEL_IDENTITY_PROVIDER__0__CLIENT_ID
              value: $(TUWUNEL_SSO_CLIENT_ID)
            - name: TUWUNEL_IDENTITY_PROVIDER__0__CLIENT_SECRET_FILE
              value: /etc/tuwunel-sso/client-secret
            - name: TUWUNEL_IDENTITY_PROVIDER__0__ISSUER_URL
              value: https://__ZITADEL_ISSUER_HOST__
            - name: TUWUNEL_IDENTITY_PROVIDER__0__CALLBACK_URL
              value: https://__TUWUNEL_MATRIX_HOST__/_matrix/client/unstable/login/sso/callback/$(TUWUNEL_SSO_CLIENT_ID)
            - name: TUWUNEL_IDENTITY_PROVIDER__0__TRUSTED
              value: "true"
            - name: TUWUNEL_IDENTITY_PROVIDER__0__USERID_CLAIMS
              value: '["preferred_username", "email"]'
            - name: TUWUNEL_IDENTITY_PROVIDER__0__UNIQUE_ID_FALLBACKS
              value: "false"
            - name: TUWUNEL_IDENTITY_PROVIDER__0__REGISTRATION
              value: "true"
            - name: TUWUNEL_STORAGE_PROVIDER__MEDIA_ON_S3__S3__BUCKET
              valueFrom:
                secretKeyRef:
                  name: tuwunel-s3
                  key: bucket
            - name: TUWUNEL_STORAGE_PROVIDER__MEDIA_ON_S3__S3__REGION
              value: us-east-1
            - name: TUWUNEL_STORAGE_PROVIDER__MEDIA_ON_S3__S3__KEY
              valueFrom:
                secretKeyRef:
                  name: tuwunel-s3
                  key: access-key-id
            - name: TUWUNEL_STORAGE_PROVIDER__MEDIA_ON_S3__S3__SECRET
              valueFrom:
                secretKeyRef:
                  name: tuwunel-s3
                  key: secret-access-key
            - name: TUWUNEL_STORAGE_PROVIDER__MEDIA_ON_S3__S3__ENDPOINT
              value: http://seaweed-main-s3.seaweedfs:8333
            - name: TUWUNEL_STORAGE_PROVIDER__MEDIA_ON_S3__S3__BASE_PATH
              value: tuwunel-media
            - name: TUWUNEL_STORAGE_PROVIDER__MEDIA_ON_S3__S3__USE_VHOST_REQUEST
              value: "false"
          startupProbe:
            exec:
              command: ["tuwunel", "--health-check"]
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            exec:
              command: ["tuwunel", "--health-check"]
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["tuwunel", "--health-check"]
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: tuwunel-data
              mountPath: /var/lib/tuwunel
            - name: tuwunel-sso-client
              mountPath: /etc/tuwunel-sso/client-secret
              subPath: client-secret
              readOnly: true
            - name: tuwunel-registration-secret
              mountPath: /etc/tuwunel-registration/shared-secret
              subPath: shared-secret
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tuwunel-data
          persistentVolumeClaim:
            claimName: tuwunel-data
        - name: tuwunel-sso-client
          secret:
            secretName: tuwunel-sso-client
            defaultMode: 0400
            items:
              - key: client-secret
                path: client-secret
        - name: tuwunel-registration-secret
          secret:
            secretName: tuwunel-registration-secret
            defaultMode: 0400
            items:
              - key: shared-secret
                path: shared-secret
---
apiVersion: v1
kind: Service
metadata:
  name: tuwunel
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: tuwunel
spec:
  selector:
    app.kubernetes.io/name: tuwunel
  ports:
    - name: http
      port: 8008
      targetPort: 8008
