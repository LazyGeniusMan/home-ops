# apprise-go-api secrets (sink contract: projects/apprise-go-api/internal/server/notify.go). Git holds refs only, never values.
# - apprise-stateless-urls: the APPRISE_STATELESS_URLS fallback target set
#   (one matrixs:// URL per purpose room, comma separated; splitURLs splits
#   on commas/whitespace). Token auth form
#   `matrixs://{token}@{host}/%23{room}?tag={purpose}&overflow=split&e2ee=false`
#   (aliases ride %23 — a literal `#` would be cut as a URL fragment; room
#   IDs `!...` need no encoding). No user/pass literals, no room IDs
#   hard-coded in env. Composed in the ESO template from the kept-Secret
#   fields: the homeserver host comes from key `homeserver-host` (bare
#   host, no scheme — the scheme + `matrixs://` prefix is literal in the
#   template) and the notifier bot token from key `notifier-token`
#   (both on `matrix-bot-bootstrap-outputs`, in-cluster `tuwunel-k8s`
#   SecretStore — see the BOOTSTRAP note below); the
#   room aliases + tags stay literal (aliases are public directory names, NOT
#   secrets). Room <-> tag pairing: #flux-notifications?tag=flux,
#   #tofu-runs?tag=tofu, #team?tag=team — every Provider `tag=` MUST equal
#   one of these server tags or the request 204s (selection lost).
#   DECOUPLED: no #coder-notifications?tag=coder leg here — coder consumes
#   the kept Secret matrix-bot-bootstrap-outputs via its own coder-owned
#   handoff (SecretStore coder-matrix remoteNamespace matrix +
#   Role/Binding coder-matrix-handoff-reader in ns matrix, owned by the coder
#   component) into coder/matrix-notify ExternalSecret ->
#   CODER_MATRIX_APPRISE_URLS (per-request `urls` via the endpoint query
#   string) and NEVER reads a matrix-tenant fallback. flux/tofu/team legs stay:
#   those rooms are matrix-tenant-owned, so their centralization is legitimate.
#   BOOTSTRAP: the notifier credentials come from the matrix-bot-bootstrap
#   Job's kept Secret `matrix-bot-bootstrap-outputs` (keys `notifier-token`,
#   `homeserver-host`) through the in-cluster `tuwunel-k8s` SecretStore
#   (matrix-bot-bootstrap.yaml) — same-namespace read via the shared
#   eso-k8s-reader identity, no ESO fallback.
#   The
#   Consumer-owned: the matrix tenant IS a consumer of the infra apprise-go-api
#   sink (namespace apprise-go-api) — this fallback stays here while the
#   sink itself carries no credentials (coder is the FIRST caller on
#   per-request `urls` injection; flux/tofu/team migration to urls is
#   follow-up work; see NOTIFICATIONS.md). Per-env overlays carry no vault
#   patches for this ES. Hidden
#   webhook URL note: the composed value IS an
#   authenticated webhook-style URL — treat the Proton Pass fields as
#   secret, re-check visibility before pasting anywhere (see NOTIFICATIONS.md
#   deferred items).
# - Proton Pass ClusterSecretStore: cluster-scoped, pre-existing (same store
#   the cloudflare-api-token mirrors use) — no SecretStore CR ships here.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise-stateless-urls
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tuwunel-k8s
    kind: SecretStore
  target:
    name: apprise-stateless-urls
    template:
      data:
        stateless-urls: "matrixs://{{ .notifierToken }}@{{ .matrixHost }}/%23flux-notifications?tag=flux&overflow=split&e2ee=false,matrixs://{{ .notifierToken }}@{{ .matrixHost }}/%23tofu-runs?tag=tofu&overflow=split&e2ee=false,matrixs://{{ .notifierToken }}@{{ .matrixHost }}/%23team?tag=team&overflow=split&e2ee=false"
  # BOOTSTRAPPED: the notifier credential flows Job -> kept Secret -> this
  # ES, all in-namespace — the zitadel chain minus the cross-namespace hop
  # (rooms.yaml varsFrom reads the kept Secret directly for the SAME reason:
  # same namespace, no namespace field needed). The `tuwunel-k8s` store reads
  # through the SHARED eso-k8s-reader identity (matrix-rbac.yaml). dataFrom
  # fallback: NONE.
  data:
    - secretKey: notifierToken
      remoteRef:
        key: matrix-bot-bootstrap-outputs
        property: notifier-token
    - secretKey: matrixHost
      remoteRef:
        key: matrix-bot-bootstrap-outputs
        property: homeserver-host
