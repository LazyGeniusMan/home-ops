# apprise-go-api secrets. Git holds refs only, never values.
# - apprise-stateless-urls: the APPRISE_STATELESS_URLS fallback target set
#   (one matrixs:// URL per purpose room, comma separated; splitURLs splits
#   on commas/whitespace). Token auth form
#   `matrixs://{token}@{host}/%23{room}?tag={purpose}&overflow=split&e2ee=false`
#   (aliases ride %23 — a literal `#` would be cut as a URL fragment; room
#   IDs `!...` need no encoding). No user/pass literals, no room IDs
#   hard-coded in env. Composed in the ESO template from vault fields: the
#   homeserver host comes from .../matrix-rooms/homeserver-host (bare host,
#   no scheme — the scheme + `matrixs://` prefix is literal in the template)
#   and the notifier bot token from .../matrix-rooms/notifier-bot-token; the
#   room aliases + tags stay literal (aliases are public directory names, NOT
#   secrets). Room <-> tag pairing: #flux-notifications?tag=flux,
#   #tofu-runs?tag=tofu, #team?tag=team, #coder-notifications?tag=coder —
#   every Provider `tag=` MUST equal
#   one of these server tags or the request 204s (selection lost). The
#   Consumer-owned: the matrix tenant IS a consumer of the infra apprise-go-api
#   sink (namespace apprise-go-api) — this fallback stays here while the
#   sink itself carries no credentials (per-request `urls` injection for
#   these Providers is follow-up work; see NOTIFICATIONS.md deferred
#   items). Per-env overlays replace BOTH remoteRef keys
#   with the cluster vault path
#   (pass://acme-<env>-bdo1-talos-apps-01/...), same convention as the coder
#   dev overlay. Hidden webhook URL note: the composed value IS an
#   authenticated webhook-style URL — treat the Proton Pass fields as
#   secret, re-check visibility before pasting anywhere (see NOTIFICATIONS.md
#   deferred items).
# - Proton Pass ClusterSecretStore: cluster-scoped, pre-existing (same store
#   the cloudflare-api-token mirrors use) — no SecretStore CR ships here.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise-stateless-urls
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass
    kind: ClusterSecretStore
  target:
    name: apprise-stateless-urls
    template:
      data:
        stateless-urls: "matrixs://{{ .notifierToken }}@{{ .matrixHost }}/%23flux-notifications?tag=flux&overflow=split&e2ee=false,matrixs://{{ .notifierToken }}@{{ .matrixHost }}/%23tofu-runs?tag=tofu&overflow=split&e2ee=false,matrixs://{{ .notifierToken }}@{{ .matrixHost }}/%23team?tag=team&overflow=split&e2ee=false,matrixs://{{ .notifierToken }}@{{ .matrixHost }}/%23coder-notifications?tag=coder&overflow=split&e2ee=false"
  data:
    - secretKey: notifierToken
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/notifier-bot-token
    - secretKey: matrixHost
      remoteRef:
        key: __PROTON_PASS_BASE__/matrix-rooms/homeserver-host
