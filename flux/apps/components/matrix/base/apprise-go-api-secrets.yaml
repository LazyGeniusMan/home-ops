# apprise-stateless-urls fallback (sink contract: projects/apprise-go-api/internal/server/handler.go).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise-stateless-urls
  labels:
    app.kubernetes.io/name: apprise-go-api
    app.kubernetes.io/part-of: apprise-go-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tuwunel-k8s
    kind: SecretStore
  target:
    name: apprise-stateless-urls
    template:
      data:
        stateless-urls: "matrixs://{{ .notifierToken }}@{{ .matrixHost }}/%23flux-notifications?tag=flux&overflow=split&e2ee=false,matrixs://{{ .notifierToken }}@{{ .matrixHost }}/%23tofu-runs?tag=tofu&overflow=split&e2ee=false,matrixs://{{ .notifierToken }}@{{ .matrixHost }}/%23team?tag=team&overflow=split&e2ee=false"
  # BOOTSTRAPPED: Job -> kept Secret -> this ES, all in-namespace (shared eso-k8s-reader).
  data:
    - secretKey: notifierToken
      remoteRef:
        key: matrix-bot-bootstrap-outputs
        property: notifier-token
    - secretKey: matrixHost
      remoteRef:
        key: matrix-bot-bootstrap-outputs
        property: homeserver-host
