    concurrencyPolicy: Forbid
    rclone:
      operation: copy # offsite leg: copy only, never sync (sync deletes extras)
    source:
      type: s3
      remoteName: ""
      uri:
        esoRef:
          name: rclone-mautrix-discord-db-s3-path
