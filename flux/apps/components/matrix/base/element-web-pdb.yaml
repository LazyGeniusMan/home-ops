# PodDisruptionBudget for element-web (HPA-scaled stateless SPA):
# minAvailable 1 keeps the SPA serving during voluntary disruptions
# (HPA mins: dev 1 / prd 2).
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: element-web
  labels:
    app.kubernetes.io/name: element-web
    app.kubernetes.io/part-of: element-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: element-web
