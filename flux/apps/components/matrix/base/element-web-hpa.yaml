# Element Web HPA (stateless SPA — horizontal scaling safe). Base replicas: 1 is the
# create-time seed; HPA owns runtime count (minReplicas enforces the floor).
# Dev min 1/max 2, prd min 2/max 4 via overlays. CPU 70 / memory 80.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: element-web
  labels:
    app.kubernetes.io/name: element-web
    app.kubernetes.io/part-of: element-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: element-web
  minReplicas: 1 # placeholder - overridden by dev/prd
  maxReplicas: 2 # placeholder - overridden by dev/prd
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
