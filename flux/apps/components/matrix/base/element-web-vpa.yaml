# VPA recommender for element-web (HPA-paired): updateMode Off — recommender-only
# (never VPA-apply on a resource HPA scales).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: element-web
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: element-web
  updatePolicy:
    updateMode: 'Off'
