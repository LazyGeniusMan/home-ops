apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # ---- apprise-go-api consumer wiring (workload now in the infra
  # apprise-go-api tenant — no Deployment/Service/HPA/VPA here) ----
  # BOOTSTRAPPED: apprise-stateless-urls reads the notifier credential from
  # the in-cluster kept Secret (tuwunel-k8s store) — NO vault patch here
  # (the matrix-rooms/notifier-bot-token + homeserver-host vault path is
  # retired; see VAULT-SEEDS.md). Providers post to the infra Service DNS
  # (see base/notifications.yaml). This stanza is intentionally absent.
  # ---- (no apprise-stateless-urls patch — bootstrapped, see above) ----
  # ---- tuwunel (homeserver) (carried over from components/tuwunel/prd/) ----
  # Prd route hostnames (tuwunel.matrix.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: tuwunel.matrix.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: tuwunel-redirect

  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: tuwunel.matrix.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: tuwunel-tls
  # No tuwunel-sso-client vault patches: client_id + client_secret flow
  # end-to-end from the tuwunel-sso outputs Secret via the in-cluster
  # `tuwunel-k8s` SecretStore (base/tuwunel-secrets.yaml).
  # (S3 keys are COSI-minted via the tuwunel-cosi SecretStore — no
  # per-env vault ref patch for tuwunel-s3.)
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/cert-manager/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: cloudflare-api-token
  # Prd registration shared secret (server side of the bootstrap Job flow;
  # base holds the __PROTON_PASS_BASE__ placeholder).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/matrix/tuwunel-registration-secret
    target:
      kind: ExternalSecret
      name: tuwunel-registration-secret
  # Prd wildcard Certificate (wildcard-home-ops).
  - patch: |
      - op: replace
        path: /metadata/name
        value: wildcard-home-ops
    target:
      kind: Certificate
      name: __WILDCARD_CERT_NAME__

  - patch: |
      - op: replace
        path: /spec/secretName
        value: wildcard-home-ops-tls
    target:
      kind: Certificate
      name: wildcard-home-ops

  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.home-ops.yansyah.my.id"
    target:
      kind: Certificate
      name: wildcard-home-ops
  # Prd identity: server_name + well-known client + Zitadel issuer +
  # SSO callback. POSITIONAL: /spec/template/spec/containers/0/env/0
  # (SERVER_NAME) + /env/5 (WELL_KNOWN__CLIENT) + /env/25 (ISSUER_URL) +
  # /env/26 (CALLBACK_URL) — see the order note in base/tuwunel.yaml
  # (REGISTRATION_SHARED_SECRET_FILE at /env/18 shifts later indices +1).
  # The callback embeds the per-env matrix host; the client_id suffix
  # rides k8s $(TUWUNEL_SSO_CLIENT_ID) expansion, so no generated id
  # ever lands in git.
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: tuwunel.matrix.home-ops.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: https://tuwunel.matrix.home-ops.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/env/25/value
        value: https://admin.zitadel.home-ops.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/env/26/value
        value: https://tuwunel.matrix.home-ops.yansyah.my.id/_matrix/client/unstable/login/sso/callback/$(TUWUNEL_SSO_CLIENT_ID)
    target:
      kind: Deployment
      name: tuwunel
  # ---- mautrix-discord (bridge + colocated Postgres) (carried over from components/mautrix-discord/prd/) ----
  # Prd Proton Pass identity: every mautrix-discord vault ref (base holds
  # __PROTON_PASS_BASE__ placeholders). The S3 entry stays COSI-minted —
  # no per-env patch for cnpg-s3-credentials.
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/mautrix-discord/bot-token
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/mautrix-discord/as-token
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/mautrix-discord/hs-token
      - op: replace
        path: /spec/data/3/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/mautrix-discord/avatar-proxy-key
      - op: replace
        path: /spec/data/4/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/mautrix-discord/direct-media-server-key
      - op: replace
        path: /spec/data/5/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/mautrix-discord/provisioning-shared-secret
      - op: replace
        path: /spec/data/6/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/mautrix-discord/double-puppet-shared-secret
    target:
      kind: ExternalSecret
      name: mautrix-discord

  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/mautrix-discord/db-password
    target:
      kind: ExternalSecret
      name: mautrix-discord-db-credentials

  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/mautrix-discord/db-password
    target:
      kind: ExternalSecret
      name: mautrix-discord-db-app-secret
  # Prd S3 endpoint (same internal SeaweedFS name as every other component).
  - patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: http://seaweed-main-s3.seaweedfs.svc.cluster.local:8333
    target:
      kind: Cluster
      name: mautrix-discord-db
  # Prd homeserver link: the bridge talks to tuwunel over the SHARED `matrix`
  # namespace (in-namespace Service DNS — both workloads land in `matrix` via
  # the fleet apps Kustomization's targetNamespace). Positional:
  # /spec/template/spec/containers/0/env/0 (HS_ADDRESS) +
  # /spec/template/spec/containers/0/env/1 (HS_DOMAIN).
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: http://tuwunel.matrix.svc:8008
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: tuwunel.matrix.home-ops.yansyah.my.id
    target:
      kind: Deployment
      name: mautrix-discord
  # Prd admin identity: the Matrix user that gets bridge `admin` (everyone
  # on the prd HS keeps `user`; "*" keeps relay). Positional:
  # /spec/template/spec/containers/0/env/3 (BRIDGE_ADMIN_MXID).
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "@admin:tuwunel.matrix.home-ops.yansyah.my.id"
    target:
      kind: Deployment
      name: mautrix-discord
  # Prd replica counts: bridge stays 1 (singleton — the patch below only
  # restates the base value so a future base change cannot silently scale
  # it); CNPG goes to the recommended 3.
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: mautrix-discord

  - patch: |
      - op: replace
        path: /spec/instances
        value: 3
    target:
      kind: Cluster
      name: mautrix-discord-db
  # ---- element-web (stateless SPA + NetBird consumer) (carried over from components/element-web/prd/) ----
  # Prd route hostname (element.matrix.home-ops.yansyah.my.id).
  - patch: |
      - op: replace
        path: /spec/hostnames/0
        value: element.matrix.home-ops.yansyah.my.id
    target:
      kind: HTTPRoute
      name: element
  # Prd config.json: full-string replace (same opaque-string note as dev).
  # Base already carries the prd hosts, so this is a no-op anchor — kept so
  # the prd config is explicit in the built output and future prd-only keys
  # have a landing patch.
  - patch: |
      - op: replace
        path: /data/config.json
        value: |
          {
              "default_server_config": {
                  "m.homeserver": {
                      "base_url": "https://tuwunel.matrix.home-ops.yansyah.my.id"
                  }
              },
              "disable_custom_urls": true,
              "disable_guests": false,
              "disable_login_language_selector": false,
              "disable_3pid_login": false,
              "brand": "Element",
              "default_theme": "light",
              "permalink_prefix": "https://element.matrix.home-ops.yansyah.my.id",
              "branding": {},
              "embedded_pages": {},
              "room_directory": {
                  "servers": [
                      "matrix.home-ops.yansyah.my.id"
                  ]
              },
              "integrations_ui_url": null,
              "integrations_rest_url": null,
              "integrations_widgets_urls": [],
              "jitsi": {
                  "preferred_domain": "meet.element.io"
              },
              "help_url": "https://element.io/help",
              "help_encryption_url": "https://element.io/help#encryption",
              "default_federate": false,
              "show_labs_settings": false,
              "features": {},
              "setting_defaults": {
                  "breadcrumbs": true
              }
          }
    target:
      kind: ConfigMap
      name: element-config
  # (dropped identical ExternalSecret/cloudflare-api-token patch from element-web/prd — same ops already applied under tuwunel above; one cloudflare-api-token ES + one Certificate remain)
  # (dropped identical Certificate/__WILDCARD_CERT_NAME__ patch from element-web/prd — same ops already applied under tuwunel above; one cloudflare-api-token ES + one Certificate remain)
  # (dropped identical Certificate/wildcard-home-ops patch from element-web/prd — same ops already applied under tuwunel above; one cloudflare-api-token ES + one Certificate remain)
  # (dropped identical Certificate/wildcard-home-ops patch from element-web/prd — same ops already applied under tuwunel above; one cloudflare-api-token ES + one Certificate remain)
  # Prd NetBird proxy vars: provider-token vault paths + service FQDN
  # (positional: /spec/vars/0 is domain — base order must not change).
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/element-web/netbird-pat
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: pass://acme-prd-bdo1-talos-apps-01/element-web/cloudflare-api-token
    target:
      kind: ExternalSecret
      name: element-proxy-vars

  - patch: |
      - op: replace
        path: /spec/vars/0/value
        value: element.matrix.home-ops.yansyah.my.id
      - op: replace
        path: /spec/vars/2/value
        value: __CLOUDFLARE_ZONE_ID_HOME_OPS__
      - op: replace
        path: /spec/vars/3/value
        value: acme-prd-bdo1-talos-apps-01
      - op: replace
        path: /spec/vars/4/value
        value: 192.168.1.199
    target:
      kind: Terraform
      name: element-proxy
  # Prd replica bounds: stateless HA floor (2). No Deployment
  # /spec/replicas patch: base replicas: 1 is the create-time seed, HPA
  # owns runtime count (HPA minReplicas enforces the floor); scales 2-4 on
  # CPU+memory.
  - patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
    target:
      kind: HorizontalPodAutoscaler
      name: element-web
  # ---- live room provisioning (tofu-controller) ----
  # BOOTSTRAPPED: room provider auth flows from the matrix-bot-bootstrap
  # Job's kept Secret (same-namespace varsFrom — NO ESO mirror, NO vault
  # patch). The matrix-rooms/{homeserver-url,bot-access-token,bot-user-id}
  # vault path is retired (see VAULT-SEEDS.md); this stanza is
  # intentionally absent.
  # ---- (no matrix-rooms-terraform-vars patch — bootstrapped, see above) ----
  # Prd bot identity for the matrix-bot-bootstrap Job (ONE bot per env;
  # base holds __PLACEHOLDERS__; Job writes the kept Secret the CRs read).
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: https://tuwunel.matrix.home-ops.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: tuwunel.matrix.home-ops.yansyah.my.id
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: apprise
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "@apprise:tuwunel.matrix.home-ops.yansyah.my.id"
    target:
      kind: Job
      name: matrix-bot-bootstrap
  # Prd room members: on-call lead / coder-admin mxids on the prd homeserver.
  # POSITIONAL: /spec/vars/8 is members + /spec/vars/9 is power_levels — see
  # the order note in base/rooms.yaml.
  - patch: |
      - op: replace
        path: /spec/vars/8/value
        value:
          "@oncall-lead:tuwunel.matrix.home-ops.yansyah.my.id": invite
      - op: replace
        path: /spec/vars/9/value
        value:
          "@oncall-lead:tuwunel.matrix.home-ops.yansyah.my.id": 50
    target:
      kind: Terraform
      name: flux-notifications
  - patch: |
      - op: replace
        path: /spec/vars/8/value
        value:
          "@oncall-lead:tuwunel.matrix.home-ops.yansyah.my.id": invite
      - op: replace
        path: /spec/vars/9/value
        value:
          "@oncall-lead:tuwunel.matrix.home-ops.yansyah.my.id": 50
    target:
      kind: Terraform
      name: tofu-runs
  - patch: |
      - op: replace
        path: /spec/vars/8/value
        value:
          "@coder-admin:tuwunel.matrix.home-ops.yansyah.my.id": invite
      - op: replace
        path: /spec/vars/9/value
        value:
          "@coder-admin:tuwunel.matrix.home-ops.yansyah.my.id": 50
    target:
      kind: Terraform
      name: coder-notifications
