# Tenants for acme-prd-bdo1-talos-apps-01: renders
# tenants/overlays/acme-prd-bdo1-talos-apps-01.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  serviceAccountName: flux-operator
  interval: 12h
  retryInterval: 3m
  path: ./tenants/overlays/acme-prd-bdo1-talos-apps-01
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
