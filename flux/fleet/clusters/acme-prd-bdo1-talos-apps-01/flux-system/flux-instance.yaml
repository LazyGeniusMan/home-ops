apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
    # Pinned to the operator 0.60.0 lineage (flux/fleet/terraform/versions.yaml
    # operator_chart_version); keeps bootstrap and steady-state on the same
    # Flux distribution instead of floating :latest (adopt-then-flap).
    # v0.60.0 digest sha256:5757dc8cb5a83a496421e9b2686d710c70dc0300521641c03a8970f7cd3f4522.
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.60.0"
  components:
    - source-controller
    - source-watcher
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: medium
    multitenant: true
    tenantDefaultServiceAccount: flux
    networkPolicy: true
    domain: "cluster.local"
  sync:
    kind: OCIRepository
    url: "oci://ghcr.io/lazygeniusman/home-ops/fleet"
    ref: "stable"
    path: "clusters/acme-prd-bdo1-talos-apps-01"
    pullSecret: "ghcr-auth"
  kustomize:
    patches:
      - target:
          kind: OCIRepository
          name: flux-system
        patch: |
          - op: add
            path: /spec/verify
            value:
              provider: cosign
              matchOIDCIdentity:
              - issuer: ^https://token\.actions\.githubusercontent\.com$
                subject: ^https://github\.com/LazyGeniusMan/home-ops/\.github/workflows/flux-fleet-release\.yaml@refs/tags/flux-fleet-v\d+\.\d+\.\d+$
