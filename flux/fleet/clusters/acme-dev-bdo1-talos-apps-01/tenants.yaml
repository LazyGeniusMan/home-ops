# Tenants for acme-dev-bdo1-talos-apps-01.
# Renders the per-cluster overlay at tenants/overlays/acme-dev-bdo1-talos-apps-01
# (default: full shared set; opt-in exceptions live as commented patches there).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  serviceAccountName: flux-operator
  interval: 12h
  retryInterval: 3m
  path: ./tenants/overlays/acme-dev-bdo1-talos-apps-01
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
