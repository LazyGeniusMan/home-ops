apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
    # INTENTIONAL DIVERGENCE (automation cluster): no distribution.artifact —
    # the update cluster only reconciles image-update policies
    # (clusters/update/automation.yaml) and never serves workloads, so it
    # stays on the default distribution manifests. Likewise the component set
    # below is the image-automation subset (no helm/notification/source-watcher
    # controllers), and sync.verify tracks the flux-fleet-push workflow on
    # refs/heads/main instead of release tags.
  components:
    - source-controller
    - kustomize-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    type: kubernetes
    size: medium
    multitenant: true
    tenantDefaultServiceAccount: flux
    networkPolicy: true
    domain: "cluster.local"
  sync:
    kind: OCIRepository
    url: "oci://ghcr.io/lazygeniusman/home-ops/fleet"
    ref: "dev"
    path: "clusters/update"
    pullSecret: "ghcr-auth"
  kustomize:
    patches:
      - target:
          kind: OCIRepository
          name: flux-system
        patch: |
          - op: add
            path: /spec/verify
            value:
              provider: cosign
              matchOIDCIdentity:
              - issuer: ^https://token\.actions\.githubusercontent\.com$
                subject: ^https://github\.com/LazyGeniusMan/home-ops/\.github/workflows/flux-fleet-push\.yaml@refs/heads/main$
