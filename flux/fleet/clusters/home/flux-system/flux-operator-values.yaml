# Shared Flux Operator Helm values.
#
# SINGLE SOURCE: this file is consumed twice from the same path, it must not
# be duplicated:
# - Terraform bootstrap (flux/fleet/terraform/main.tf) passes it as the
#   operator chart values for the initial install.
# - Flux reconciles it via the flux-operator-values ConfigMap generated by
#   kustomization.yaml and referenced by the flux-operator HelmRelease
#   (valuesFrom). After bootstrap, Flux owns the release.
#
# The operator chart exposes no telemetry knobs; defaults are telemetry-off.
# Controller monitoring (metrics endpoints, ServiceMonitors) is enabled per
# component in flux/infra and flux/apps (§§8-14), not here.
multitenancy:
  enabled: true
  defaultServiceAccount: flux-operator
reporting:
  interval: 45s
