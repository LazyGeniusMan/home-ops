# Apps tenants: one entry per component directory under flux/apps/components.
# Every component uses the d2-apps environment-direct layout
# ({base,dev,stg,prd}/ with `resources: [../base]` env overlays)
# and reconciles through a SINGLE Kustomization at ./<<environment>>
# (mirrors the upstream d2-fleet tenants/apps.yaml; infra keeps its
# configs/controllers split in tenants/infra.yaml).
# To onboard a new application (§§8-14): add its directory as a new input
# tenant here AND add it to the components matrix in
# .github/workflows/flux-apps-push.yaml so its OCI artifact is published.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  dependsOn:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: zitadel
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  inputs:
    - tenant: "rclone"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "win11-vm"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "talos-vm"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "clickstack"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "hubble-ui"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "flux-operator-ui"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "headlamp"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "coder"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        labels:
          toolkit.fluxcd.io/role: "tenant"
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-runtime-info
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/flux-runtime-info"
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/ghcr-auth"
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      imagePullSecrets:
        - name: ghcr-auth
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: apps
        namespace: << inputs.tenant >>
      spec:
        interval: 5m
        serviceAccountName: flux
        url: "oci://ghcr.io/lazygeniusman/home-ops/apps/<< inputs.tenant >>"
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/LazyGeniusMan/home-ops/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: apps
        namespace: << inputs.tenant >>
      spec:
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: apps
        path: "./<< inputs.environment >>"
        prune: true
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
