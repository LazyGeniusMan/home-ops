# Apps tenants: one entry per component directory under flux/apps/components.
# Every component uses the environment-direct layout
# ({base,dev,prd}/ with `resources: [../base]` env overlays)
# and reconciles through a SINGLE Kustomization at ./<<environment>>
# (infra keeps its configs/controllers split in tenants/infra.yaml).
# To onboard a new application: add its directory as a new input
# tenant here AND add it to the components matrix in
# .github/workflows/flux-apps-push.yaml so its OCI artifact is published.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  # Convergence gate: the whole apps layer reconciles only after infra
  # readiness. Per-app consumption:
  # - Zitadel FirstInstance (controllers/zitadel): clickstack, coder,
  #   flux-operator-ui, headlamp, hubble-ui (SSO Terraform CRs read the
  #   zitadel-bootstrap-outputs handoff) + matrix/tuwunel (tuwunel-sso CR).
  #   matrix/rooms + element-proxy Terraform CRs ride the same gate via the
  #   in-tenant bootstrap Job kept Secret (no separate entry — the Job itself
  #   retries until tuwunel is Ready).
  # - gateway-api (configs/gateway-api: Gateway main, GatewayClass cilium):
  #   every app with an HTTPRoute (all except the two VMs).
  # - CoreDNS (configs/coredns) + Cilium kube-proxy replacement: all apps
  #   (in-cluster DNS + Service VIPs).
  # - cert-manager (configs/cert-manager: ClusterIssuer letsencrypt):
  #   every app minting an in-namespace wildcard Certificate (all except the
  #   two VMs).
  # - external-secrets (configs/external-secrets: proton-pass
  #   ClusterSecretStore): every app with a proton-pass ExternalSecret (all
  #   except the two VMs).
  # - seaweedfs (configs/seaweedfs: seaweed-main-s3): clickstack, coder,
  #   matrix (COSI BucketClaims + CNPG barmanObjectStore endpoints).
  # - cnpg (controllers/cnpg): clickstack, coder, matrix (CNPG Clusters).
  # - multus (configs/multus: NAD lan-dhcp) + kubevirt (configs/kubevirt):
  #   talos-vm + win11-vm (VirtualMachines on the secondary net).
  # - tofu-controller (controllers/tofu-controller): every app with a
  #   Terraform CR (all SSO apps + matrix rooms/proxy).
  # Kustomization-level dependsOn is the mechanism — see each app's
  # base/terraform.yaml header.
  dependsOn:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: zitadel
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: cilium
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: gateway-api
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: coredns
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: cert-manager
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: external-secrets
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: seaweedfs
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: multus
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-configs
      namespace: kubevirt
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: infra-controllers
      namespace: tofu-controller
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  inputs:
    - tenant: "win11-vm"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "talos-vm"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "clickstack"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "hubble-ui"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "flux-operator-ui"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "headlamp"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "coder"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
    - tenant: "matrix"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-apps-release"
      artifactSubjectGitRef: 'refs/tags/flux-apps-v\d+\.\d+\.\d+'
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        labels:
          toolkit.fluxcd.io/role: "tenant"
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-runtime-info
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/flux-runtime-info"
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/ghcr-auth"
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      imagePullSecrets:
        - name: ghcr-auth
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: apps
        namespace: << inputs.tenant >>
      spec:
        interval: 5m
        serviceAccountName: flux
        url: "oci://ghcr.io/lazygeniusman/home-ops/apps/<< inputs.tenant >>"
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/LazyGeniusMan/home-ops/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: apps
        namespace: << inputs.tenant >>
      spec:
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: apps
        path: "./<< inputs.environment >>"
        prune: true
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
