# Per-cluster tenants overlay for acme-dev-bdo1-talos-apps-01 (synced by
# clusters/acme-dev-bdo1-talos-apps-01/tenants.yaml). Pass-through of the
# shared set (apps + infra + policies) plus the active patch below.
# Patches are inline RFC 6902 (see ../README.md); guarded `test` ops fail
# the build if the base input order in tenants/*.yaml changed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps.yaml
  - ../../infra.yaml
  - ../../policies.yaml
# Dev exception (active): skip win11-vm on dev. Inputs are an ordered list;
# the `test` guard fails the build if apps.yaml input order changed.
# Current apps.yaml order: 0 win11-vm, 1 talos-vm, 2 clickstack, 3 hubble-ui,
# 4 flux-operator-ui, 5 headlamp, 6 coder, 7 matrix.
patches:
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: ResourceSet
      name: apps
    patch: |-
      - op: test
        path: /spec/inputs/0/tenant
        value: win11-vm
      - op: remove
        path: /spec/inputs/0
