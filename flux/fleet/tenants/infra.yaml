# Infra tenants: one input per component dir under flux/infra/components.
# Onboard: add the input tenant here + the components matrix in
# .github/workflows/flux-infra-push.yaml so its OCI artifact is published.
# Ordering (fresh Talos has no CNI/DNS): cilium is the bootstrap root;
# coredns + multus serialize after cilium infra-controllers Ready; every
# other tenant gates at minimum on the otel-operator infra-crds Established
# healthChecks (CRDs are cluster-scoped, cross-namespace refs are valid);
# otel-collectors additionally waits for the operator controllers + the
# shared infra CHI configs. CRD delivery (gateway-api + cosi + otel-operator
# only): CRDs render through a dedicated prune:false infra-crds Kustomization
# (a removed CRD must never cascade-delete CRs) with per-tenant healthChecks
# so one failing tenant cannot hold the others NotReady. Cilium/cert-manager
# CRDs stay Helm-managed (CreateReplace / keep:true) outside the kustomize
# prune inventory, so prune:true controllers cannot cascade-delete them.
# This file is a Go template rendered by the Flux
# Operator — `<< if ... >>` blocks are comments until rendered.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: infra
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: policies
      namespace: flux-system
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  inputs:
    - tenant: "cilium"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "coredns"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "gateway-api"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "tofu-controller"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "external-secrets"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "metrics-server"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "cert-manager"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "external-dns"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "local-path-provisioner"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "cnpg"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "clickhouse"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "dragonfly"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "seaweedfs"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "multus"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "kubevirt"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "zitadel"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "cosi"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "vpa"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "netbird"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "apprise-go-api"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "otel-operator"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "otel-collectors"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        labels:
          toolkit.fluxcd.io/role: "tenant"
          # TA discovery: the otel-gateway TargetAllocator namespaceSelectors
          # match otel-scrape, so every flipped monitor in the tenant is
          # scraped (the monitor object itself still needs the label — see
          # flux/OBSERVABILITY.md; ESO carries it via overlay additionalLabels).
          otel-scrape: "true"
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-runtime-info
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/flux-runtime-info"
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/ghcr-auth"
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      imagePullSecrets:
        - name: ghcr-auth
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: flux-infra-<< inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: infra
        namespace: << inputs.tenant >>
      spec:
        interval: 5m
        serviceAccountName: flux
        url: "oci://ghcr.io/lazygeniusman/home-ops/infra/<< inputs.tenant >>"
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/LazyGeniusMan/home-ops/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$
    # infra-crds: vendored-CRD delivery (gateway-api + cosi + otel-operator
    # only; disabled for other tenants). prune:false so removed CRDs never
    # delete CRs; healthChecks gate dependents on Established.
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-crds
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/reconcile: << if or (eq inputs.tenant "gateway-api") (eq inputs.tenant "cosi") (eq inputs.tenant "otel-operator") >>enabled<< else >>disabled<< end >>
      spec:
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: infra
        path: "./crds/<< inputs.environment >>"
        prune: false
        healthChecks:
          # Scoped per-tenant: one failing CRD set must not hold the other
          # tenants NotReady. Gateway gates (<< if eq inputs.tenant "gateway-api" >>):
          # << if eq inputs.tenant "gateway-api" >>
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: gatewayclasses.gateway.networking.k8s.io
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: gateways.gateway.networking.k8s.io
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: httproutes.gateway.networking.k8s.io
          # << end >>
          # (<< if eq inputs.tenant "cosi" >> COSI Established gates):
          # << if eq inputs.tenant "cosi" >>
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: bucketclasses.objectstorage.k8s.io
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: bucketclaims.objectstorage.k8s.io
          # << end >>
          # (<< if eq inputs.tenant "otel-operator" >> otel-operator ServiceMonitor/PodMonitor Established gates):
          # << if eq inputs.tenant "otel-operator" >>
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: servicemonitors.monitoring.coreos.com
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: podmonitors.monitoring.coreos.com
          # << end >>
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-controllers
        namespace: << inputs.tenant >>
      spec:
        # Single dependsOn (one key: template conditionals are comments until the
        # operator renders them). Cilium is the bootstrap root: its only gate
        # is the otel-operator infra-crds Established healthCheck (its chart
        # renders ServiceMonitors unconditionally). coredns + multus serialize
        # on cilium infra-controllers Ready so pods get DNS + node networking
        # before the rest. Own-CRD tenants gate on local infra-crds; every other
        # tenant gates at minimum on the otel-operator tenant's infra-crds
        # Established healthChecks (CRDs are cluster-scoped, cross-namespace
        # ref is valid) — including the 6 formerly-ungated tenants
        # (local-path-provisioner/kubevirt/vpa/netbird/apprise-go-api render no
        # monitors today yet keep the floor gate so a future monitor never
        # races the CRDs); kubevirt additionally waits for multus
        # infra-controllers (thick-plugin networking before VMs);
        # otel-collectors gates on the operator controllers (opentelemetry.io
        # CRDs + collector RBAC) and the shared infra CHI configs (the gateway
        # clickhouse exporter points at the infra clickhouse tenant). No tenant
        # is left with zero dependsOn.
        dependsOn:
          # << if eq inputs.tenant "coredns" >>
          - name: infra-controllers
            namespace: cilium
          # << end >>
          # << if eq inputs.tenant "multus" >>
          - name: infra-controllers
            namespace: cilium
          # << end >>
          # << if or (eq inputs.tenant "gateway-api") (eq inputs.tenant "cosi") (eq inputs.tenant "otel-operator") >>
          - name: infra-crds
          # << end >>
          # << if or (eq inputs.tenant "cilium") (eq inputs.tenant "coredns") (eq inputs.tenant "metrics-server") (eq inputs.tenant "cert-manager") (eq inputs.tenant "external-secrets") (eq inputs.tenant "external-dns") (eq inputs.tenant "tofu-controller") (eq inputs.tenant "zitadel") (eq inputs.tenant "cnpg") (eq inputs.tenant "clickhouse") (eq inputs.tenant "dragonfly") (eq inputs.tenant "seaweedfs") (eq inputs.tenant "multus") (eq inputs.tenant "local-path-provisioner") (eq inputs.tenant "kubevirt") (eq inputs.tenant "vpa") (eq inputs.tenant "netbird") (eq inputs.tenant "apprise-go-api") >>
          - name: infra-crds
            namespace: otel-operator
          # << end >>
          # << if eq inputs.tenant "kubevirt" >>
          - name: infra-controllers
            namespace: multus
          # << end >>
          # << if eq inputs.tenant "otel-collectors" >>
          - name: infra-controllers
            namespace: otel-operator
          - name: infra-configs
            namespace: clickhouse
          # << end >>
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: infra
        path: "./controllers/<< inputs.environment >>"
        prune: true
        # Cilium/cert-manager CRDs are Helm-managed (cilium CreateReplace,
        # cert-manager keep:true) and never enter the kustomize prune
        # inventory, so a prune:true controllers delete cannot cascade-delete
        # them; tenant deletion leaves the Helm-managed CRDs orphaned by
        # design. Residual component-level work: none — nothing further is
        # achievable purely from this ResourceSet.
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-configs
        namespace: << inputs.tenant >>
      spec:
        dependsOn:
          - name: infra-controllers
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: infra
        path: "./configs/<< inputs.environment >>"
        prune: true
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
