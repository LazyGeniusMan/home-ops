# Infra tenants: one entry per component directory under flux/infra/components.
# To onboard a new platform component (§§8-14): add its directory as a new
# input tenant here AND add it to the components matrix in
# .github/workflows/flux-infra-push.yaml so its OCI artifact is published.
#
# CRD delivery (§8.1 gateway-api, §12 COSI): vendored CRDs render through a
# dedicated prune:false infra-crds Kustomization per tenant below — a removed
# CRD file must never cascade-delete CRs cluster-wide (CRDs are never
# garbage-collected). The matching infra-controllers Kustomization keeps
# prune:true and gains a conditional dependsOn on its sibling infra-crds so
# the controller only reconciles once its CRDs are Ready.
# Sanctioned pattern: upstream ResourceSet conditional-resource inclusion —
# per-input resources gated by the fluxcd.controlplane.io/reconcile
# annotation set from << if >> Go-template conditionals. The infra-crds
# Kustomization carries reconcile: enabled only for the two tenants that ship
# a crds/<env> dir (gateway-api, cosi) and disabled for every other tenant;
# sibling components (cert-manager, cilium, kubevirt, multus) keep chart- or
# daemonset-managed CRDs inside prune:true controllers and are untouched.
# NOTE: infra.yaml is a Go template rendered by the Flux Operator, not plain
# YAML — the `<< if ... >>` conditionals are comments until the operator
# renders them, so plain-yaml tooling reads every block unconditionally.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: infra
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: policies
      namespace: flux-system
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  inputs:
    - tenant: "cilium"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "coredns"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "gateway-api"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "tofu-controller"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "external-secrets"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "metrics-server"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "cert-manager"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "external-dns"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "local-path-provisioner"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "cnpg"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "clickhouse"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "dragonfly"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "seaweedfs"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "multus"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "kubevirt"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "zitadel"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "cosi"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "vpa"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "netbird"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
    - tenant: "apprise-go-api"
      tag: "${ARTIFACT_TAG}"
      environment: "${ENVIRONMENT}"
      artifactSubjectWorkflow: "flux-infra-release"
      artifactSubjectGitRef: 'refs/tags/flux-infra-v\d+\.\d+\.\d+'
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        labels:
          toolkit.fluxcd.io/role: "tenant"
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-runtime-info
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/flux-runtime-info"
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-auth
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/ghcr-auth"
      type: kubernetes.io/dockerconfigjson
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      imagePullSecrets:
        - name: ghcr-auth
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: flux-infra-<< inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: infra
        namespace: << inputs.tenant >>
      spec:
        interval: 5m
        serviceAccountName: flux
        url: "oci://ghcr.io/lazygeniusman/home-ops/infra/<< inputs.tenant >>"
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/LazyGeniusMan/home-ops/\.github/workflows/<< inputs.artifactSubjectWorkflow >>\.yaml@<< inputs.artifactSubjectGitRef >>$
    # infra-crds: vendored-CRD delivery (gateway-api + cosi only — the
    # reconcile annotation below disables this resource for every other
    # tenant). prune:false so a removed CRD file never cascade-deletes CRs;
    # wait:true + explicit CRD healthChecks so dependents gate on Established.
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-crds
        namespace: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/reconcile: << if or (eq inputs.tenant "gateway-api") (eq inputs.tenant "cosi") >>enabled<< else >>disabled<< end >>
      spec:
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: infra
        path: "./crds/<< inputs.environment >>"
        prune: false
        # Health gates: one branch renders per input (operator strips the other).
        healthChecks:
          # Gateway Established gates (<< if eq inputs.tenant "gateway-api" >>):
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: gatewayclasses.gateway.networking.k8s.io
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: gateways.gateway.networking.k8s.io
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: httproutes.gateway.networking.k8s.io
          # (<< else >> COSI Established gates):
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: bucketclasses.objectstorage.k8s.io
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: bucketclaims.objectstorage.k8s.io # << end >>
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-controllers
        namespace: << inputs.tenant >>
      spec:
        # << if or (eq inputs.tenant "gateway-api") (eq inputs.tenant "cosi") >>
        dependsOn:
          - name: infra-crds
        # << end >>
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: infra
        path: "./controllers/<< inputs.environment >>"
        prune: true
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-configs
        namespace: << inputs.tenant >>
      spec:
        dependsOn:
          - name: infra-controllers
        targetNamespace: << inputs.tenant >>
        serviceAccountName: flux
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: infra
        path: "./configs/<< inputs.environment >>"
        prune: true
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-runtime-info
