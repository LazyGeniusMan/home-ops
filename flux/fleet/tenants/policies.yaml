apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: policies
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-allowlist
        namespace: flux-system
        labels:
          fluxcd.controlplane.io/role: "policy"
      data:
        # Tenant source allowlist: must prefix-match every spec.url that can
        # appear as a gitrepositories/ocirepositories/helmrepositories object
        # in a tenant namespace (component chart OCIRepositories reconcile
        # inside their tenant namespace, so a missing prefix denies the sync).
        # Onboarding a component with a new chart registry: add its org prefix
        # here. Verified 2026-09-26 by scanning all spec.url in
        # flux/{infra,apps}/components: chart sources below are exhaustive;
        # ferretdb/headlamp-k8s/matrix-construct ship no OCIRepository
        # spec.url (image refs / bundled manifests only), so no entries.
        sources: >-
          https://github.com/LazyGeniusMan/
          oci://ghcr.io/lazygeniusman/
          oci://ghcr.io/coder/
          oci://ghcr.io/oauth2-proxy/
          oci://ghcr.io/coredns/
          oci://ghcr.io/dragonflydb/
          oci://ghcr.io/external-secrets/
          oci://ghcr.io/cloudnative-pg/
          oci://ghcr.io/rancher/
          oci://ghcr.io/zitadel/
          oci://ghcr.io/controlplaneio-fluxcd/
          oci://ghcr.io/fluxcd/
          oci://ghcr.io/flux-iac/
          oci://ghcr.io/stefanprodan/charts/
          oci://quay.io/jetstack/charts/
          oci://quay.io/cilium/charts/
          oci://registry-1.docker.io/altinity/
          oci://registry-1.docker.io/bitnamicharts/
          oci://chartproxy.container-registry.com/
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        name: "source.policy.fluxcd.controlplane.io"
        annotations:
          policy.fluxcd.controlplane.io/role: |
            Restrict Flux access to Git repositories, OCI registries and Helm repositories,
            based on an allowlist defined in a ConfigMap stored in the flux-system namespace.
      spec:
        failurePolicy: Fail
        matchConstraints:
          resourceRules:
            - apiGroups: [ "source.toolkit.fluxcd.io" ]
              apiVersions: [ "*" ]
              operations: [ "CREATE", "UPDATE" ]
              resources: [ "gitrepositories", "ocirepositories", "helmrepositories" ]
        matchConditions:
          - name: "exclude-source-controller-finalizer"
            expression: >
              request.userInfo.username != "system:serviceaccount:flux-system:source-controller"
        paramKind:
          apiVersion: v1
          kind: ConfigMap
        variables:
          - name: url
            expression: object.spec.url
          - name: sources
            expression: params.data.sources.split(' ')
        validations:
          - expression: >
              variables.sources.exists_one(prefix, variables.url.startsWith(prefix))
            messageExpression: >
              "Source " + variables.url + " is not allowed, must be one of " + variables.sources.join(", ")
            reason: Invalid
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        name: flux-tenant-sources
      spec:
        policyName: "source.policy.fluxcd.controlplane.io"
        validationActions: [ "Deny" ]
        paramRef:
          name: flux-allowlist
          namespace: flux-system
          parameterNotFoundAction: "Deny"
        matchResources:
          namespaceSelector:
            matchExpressions:
              - key: toolkit.fluxcd.io/role
                operator: In
                values:
                  - tenant
