# Single source for the Flux Operator chart coordinates (GitOps + bootstrap).
# flux-operator.yaml floats semver '*'; this pins the bootstrap install.
# FluxInstance distribution.artifact pins flux-operator-manifests to
# v<operator_chart_version> (same lineage, never :latest).
# flux-operator-ui chart tag moves with operator_chart_version.
operator_chart_repository: ghcr.io/controlplaneio-fluxcd/charts/flux-operator
operator_chart_version: 0.60.0
bootstrap_module_version: 0.8.0
