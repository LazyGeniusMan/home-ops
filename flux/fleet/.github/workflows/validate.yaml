# Canonical fleet validation (manifests + Terraform bootstrap).
# Split-ready layout: paths assume the area directory is the repository root.
# After the per-area repo split this file executes as-is (callable via
# workflow_call); until then GitHub only executes the root wiring file
# .github/workflows/flux-fleet-validate.yaml, which calls the same shared logic
# in ../actions/{validate-manifests,validate-terraform} with
# monorepo-relative paths.
name: validate

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [ 'main' ]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate manifests
        uses: ./.github/actions/validate-manifests

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate bootstrap
        uses: ./.github/actions/validate-terraform
