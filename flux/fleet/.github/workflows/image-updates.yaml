# Canonical PR automation for Git-based image updates: the update cluster's
# ImageUpdateAutomation (clusters/update/automation.yaml) pushes chart/image
# bumps to image-updates-infra and image-updates-apps branches; this workflow
# opens a PR to main for each.
# Split-ready layout: after the per-area repo split this file executes as-is
# (callable via workflow_call); until then GitHub only executes the root wiring
# file .github/workflows/flux-image-updates.yaml, which calls the same shared
# logic in ../actions/image-updates.
name: image-updates

on:
  workflow_dispatch:
  workflow_call:
  create:

jobs:
  pull-request:
    if: github.event_name != 'create' || github.ref_name == 'image-updates-infra' || github.ref_name == 'image-updates-apps'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create Pull Request
        uses: ./.github/actions/image-updates
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
