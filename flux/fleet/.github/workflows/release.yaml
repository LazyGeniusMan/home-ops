# Canonical fleet release delivery: tag flux-fleet-vX.Y.Z to publish
# oci://ghcr.io/<owner>/home-ops/fleet:flux-fleet-vX.Y.Z and move latest-stable.
# The home cluster verifies this workflow + tag via the cosign subject pinned
# in clusters/home/flux-system/flux-instance.yaml.
# Split-ready layout: paths assume the area directory is the repository root.
# After the per-area repo split this file executes as-is (callable via
# workflow_call); until then GitHub only executes the root wiring file
# .github/workflows/flux-fleet-release.yaml, which calls the same shared logic
# in ../actions/oci-release with monorepo-relative paths.
name: release-artifact

# OCI: oci://ghcr.io/<owner>/home-ops/fleet:<flux-fleet-vX.Y.Z> + latest-stable.

on:
  workflow_call:
    inputs:
      repository:
        description: 'Target OCI repository'
        required: false
        type: string
        default: ''
      path:
        description: 'Artifact source directory, relative to the repository root'
        required: false
        type: string
        default: './'
      diff-tag:
        description: 'Diff tag for the push (the release tag)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'flux-fleet-v*'

jobs:
  flux-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish fleet release
        uses: ./.github/actions/oci-release
        with:
          repository: ${{ inputs.repository || format('ghcr.io/{0}/fleet', github.repository) }}
          path: ${{ inputs.path || './' }}
          diff-tag: ${{ inputs.diff-tag || github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
