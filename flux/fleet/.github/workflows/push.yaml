# Canonical fleet OCI delivery (main branch -> tags dev + dev-<sha>).
# Split-ready layout: paths assume the area directory is the repository root.
# After the per-area repo split this file executes as-is (callable via
# workflow_call); until then GitHub only executes the root wiring file
# .github/workflows/flux-fleet-push.yaml, which calls the same shared logic
# in ../actions/oci-push with monorepo-relative paths.
name: push-artifact

# OCI: oci://ghcr.io/<owner>/home-ops/fleet:dev + dev-<sha> (main commits).

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      repository:
        description: 'Target OCI repository'
        required: false
        type: string
        default: ''
      path:
        description: 'Artifact source directory, relative to the repository root'
        required: false
        type: string
        default: './'
  push:
    branches:
      - 'main'
    paths:
      - '**'

jobs:
  flux-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Push fleet artifact
        uses: ./.github/actions/oci-push
        with:
          repository: ${{ inputs.repository || format('ghcr.io/{0}/fleet', github.repository) }}
          path: ${{ inputs.path || './' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
