# Shared fleet OCI delivery logic (main branch -> tags dev + dev-<sha>).
# Called by the root wiring workflow .github/workflows/flux-fleet-push.yaml
# (via `uses: ./flux/fleet/.github/actions/oci-push`) and by the area-local
# flux/fleet/.github/workflows/push.yaml. Step-level composite action: the
# documented pattern for sharing local logic, since GitHub only executes
# reusable workflows placed directly under .github/workflows/.
# On the per-area repo split this directory moves with flux/fleet and callers
# switch to <new-repo>/.github/workflows/push.yaml@<ref> (workflow_call).
name: fleet-oci-push
description: Push the fleet OCI artifact and sign it with cosign.

inputs:
  repository:
    description: 'Target OCI repository, e.g. ghcr.io/<owner>/home-ops/fleet'
    required: true
  path:
    description: 'Artifact source directory, relative to the repository root'
    required: false
    default: '.'
  github-token:
    description: 'Token used for GHCR login'
    required: true

runs:
  using: composite
  steps:
    - name: Install flux
      uses: controlplaneio-fluxcd/distribution/actions/setup@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - name: Compute short SHA
      shell: bash
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
    - name: Push artifact
      uses: controlplaneio-fluxcd/distribution/actions/push@1eaaa7f67ad253af88d4fac2f349ed8e7d801b83 # main
      id: push
      with:
        repository: ${{ inputs.repository }}
        path: ${{ inputs.path }}
        diff-tag: dev
        tags: dev-${{ env.SHORT_SHA }}
    - name: Sign artifact
      if: steps.push.outputs.pushed == 'true'
      shell: bash
      run: cosign sign --yes $DIGEST_URL
      env:
        DIGEST_URL: ${{ steps.push.outputs.digest-url }}
